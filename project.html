      color: var(--ink);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 8px 10px;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }
    /* The word is the one field whose SHAPE is the rule — it has to be a
       given number of Turkish letters — so it is set wide and monospaced
       and the reader can count it without being told twice. */
    #submit-in:not(.submit-area) {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
      letter-spacing: 0.22em;
      text-transform: lowercase;
    }
    .submit-area { resize: none; line-height: 1.4; letter-spacing: 0; }
    .submit-in:focus { outline: 2px solid var(--ink-red); outline-offset: 1px; }
    /* What you already offered, printed as the thing itself rather than
       as a field you can no longer use. */
    .submit-made {
      margin-top: 10px;
      padding: 10px 12px;
      border: 2px solid var(--ink);
      border-bottom-width: 5px;
      background: var(--paper-card);
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      overflow-wrap: anywhere;
    }
    .fb-page-title { margin: 0 0 6px; font-size: 1.15rem; line-height: 1.2; }
    .fb-page-meta { color: var(--muted); font-size: 0.78rem; line-height: 1.45; margin-bottom: 9px; }
    .fb-page-body p { margin: 0 0 9px; font-size: 0.85rem; line-height: 1.5; }
    .fb-page-body p:last-child { margin-bottom: 0; }

    /* The heading over a seri's earlier posts, printed under a fresh
       gelişme's own paragraphs -- the same small-caps label kutuphane.html's
       sidebar prints before a Zaman Akışı, so it reads as one convention. */
    .fb-page-divider {
      font-size: 0.6rem; letter-spacing: 0.14em; color: var(--muted);
      margin: 14px 0 8px; text-transform: uppercase;
    }
    /* The three fixed conflicts' own page: a plain news timeline, newest
       first -- unlike an olay's chapters (oldest first, a shape read like
       a book), this is a feed of "what's happened lately", so it reads
       the same direction breaking_news's own gelişmeler do. */
    .fb-dunya-moment { margin: 0 0 14px; }
    .fb-dunya-moment:last-child { margin-bottom: 0; }
    .fb-dunya-moment-date {
      font-size: 0.72rem; letter-spacing: 0.04em; color: var(--muted);
      margin-bottom: 2px;
    }
    .fb-dunya-moment-title { font-size: 0.9rem; font-weight: 700; line-height: 1.3; }
    .fb-dunya-moment p { margin: 4px 0 0; font-size: 0.85rem; line-height: 1.5; }

    /* ── ANKET — the vote UI a poll's own page carries ──
       Two plain buttons rather than a swipe: this page is a scrolling
       sheet, not a deck card, so the direction-is-the-answer gesture
       Kahvehane's own question cards use has nothing to attach to here.
       Once answered (or on reopening one already answered), the buttons
       give way to a result bar and, under it, the same split read per
       DISTRICT -- the data a future district-colored map would paint
       from (see db/neighborhood_polls.sql); until that map is drawn, the
       swatch beside each district's name is the only place its color
       actually shows. */
    .anket-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .anket-opt {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border: 2px solid var(--ink); background: var(--paper);
      font-size: 0.85rem; text-align: left; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .anket-opt:active { background: var(--paper-card, #ddc4b5); }
    .anket-opt-swatch { flex: none; width: 12px; height: 12px; border: 1px solid var(--ink); }
    .anket-note { color: var(--muted); font-size: 0.72rem; margin-top: 8px; }
    .anket-result-bar {
      display: flex; height: 22px; border: 2px solid var(--ink);
      overflow: hidden; margin-top: 4px;
    }
    .anket-result-bar span { display: flex; align-items: center; height: 100%; }
    .anket-result-row { display: flex; justify-content: space-between; font-size: 0.72rem; margin-top: 4px; color: var(--muted); }
    .anket-districts { display: flex; flex-direction: column; gap: 5px; margin-top: 14px; }
    .anket-district-title {
      font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); margin-top: 10px; margin-bottom: 2px;
    }
    .anket-district-row { display: flex; align-items: center; gap: 8px; font-size: 0.76rem; }
    .anket-district-swatch { flex: none; width: 10px; height: 10px; border: 1px solid var(--ink); }
    .anket-district-swatch.none { border-style: dashed; border-color: var(--muted); background: none !important; }
    .anket-district-name { flex: 0 0 84px; }
    .anket-district-bar { flex: 1; height: 7px; display: flex; overflow: hidden; border: 1px solid var(--ink); }
    .anket-district-bar span { height: 100%; }
    .anket-district-pct { flex: 0 0 32px; text-align: right; color: var(--muted); }
    .anket-district-none { flex: 1; color: var(--muted); font-style: italic; }

    /* THE TAB BAR STAYS UP. Every other sheet on the site runs flush off
       the bottom edge of the screen (frames.css even drops its bottom
       border to say so), and comes to rest OVER the tab bar -- which is
       right for a surface you read for a moment and dismiss. A game is
       not that: the reader is in it, with a keyboard under their thumb,
       for as long as the puzzle takes, and the bar saying where they are
       must not be the thing that disappears for it. So the OVERLAY's own
       bottom is lifted to clear the bar rather than the sheet's -- the
       backdrop then stops there too, so the bar is not merely visible
       but still the bar (a transparent backdrop lying over it would
       swallow every press on the logo). The sheet is anchored to the
       overlay's bottom edge either way, so it lands exactly above the
       bar with the keyboard resting on it, and it gets its bottom border
       back since it no longer runs off the screen. */
    @media (max-width: 768px) {
      #fb-game-overlay {
        bottom: calc(var(--navbar-h, 46px) + env(safe-area-inset-bottom));
      }
      #fb-game-overlay .ist-sheet { border-bottom-width: 2px !important; }
    }
  </style>
</head>
<body data-page="project">

<!-- ── THE LOADING SCREEN ──
     The one wait the app has. This page is the app, and it cannot be
     flipped until every one of its two dozen drawings has decoded --
     so that decode happens behind the sea rising in the logo, the same
     screen index.html opens with, rather than in front of the reader as
     a count over blank paper. See loading-screen.js. -->
<div id="loading-overlay" aria-hidden="true">
  <div class="loading-frame-stack">
    <img id="loading-frame-back" class="loading-frame" src="assets/loading/logo-dark-mono-01.jpg" alt="">
    <img id="loading-frame-front" class="loading-frame loading-frame-front" src="assets/loading/logo-dark-mono-01.jpg" alt="">
  </div>
</div>

<div id="main-site">
  <div id="ist-pc-mount"></div>

  <div class="section-rule">
    <header>
      <nav id="fb-nav">
        <b>Kütüphane</b><b class="fb-logo-btn" id="fb-logo-btn" role="button" tabindex="0" aria-label="Petek"><i class="fb-hold-frame" aria-hidden="true"></i><i class="fb-logo"></i><span class="fb-wm">İstanbulite</span><span class="fb-lang-say" id="fb-lang-say" role="status" aria-live="polite"></span></b><b>Kahvehane</b>
      </nav>
    </header>
  </div>

  <div id="ist-content" style="display:contents">
    <main>
      <div class="fb" id="fb">
        <div class="fb-cast" id="fb-cast"></div>
        <!-- The middle lane, revealed by a pull from either side on slide
             12. Not a page and not a sheet: the drawing stays where it
             is, goes quiet under a wash, and the app's own shape fades in
             over it. -->
        <div class="fb-scrim" id="fb-scrim"></div>

        <!-- ── THE APP MAP -- the middle lane ──
             The windows in the shape the app actually stands in; the
             middle one is the reader's own hexagon and opens the petek,
             and pressing any other walks there rather than jumping. See
             the CSS block. -->
        <div id="fb-map">
          <div class="fb-map-grid" id="fb-map-grid">
            <span class="fb-map-wire h w-ku-hane"></span>
            <span class="fb-map-wire h w-hane-kah"></span>
            <span class="fb-map-wire v w-ku-tr"></span>
            <!-- The wire down to the ilçe is hidden with the window it
                 leads to (see ILCE_STOP_ENABLED); a line drawn to nothing
                 is worse than no line. buildMap removes it when the stop
                 is parked. -->
            <span class="fb-map-wire v w-kah-ilce" data-wire="ilce"></span>
          </div>
          <p class="fb-map-done" id="fb-map-done" hidden>Bugünlük bu kadar.<br>Dışarısı seni bekliyor.</p>
        </div>

        <!-- ── THE PETEK -- what the logo opens ──
             A switch rather than a door: the logo opens it and the logo
             closes it, and it rests UNDER the two bars because pressing a
             hexagon names that member on the top one. Inside .fb so it
             leaves with the page. See the CSS block. -->
        <div id="fb-petek-layer">
          <div class="fb-petek-wash"></div>
          <div class="fb-petek" id="fb-petek"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ── THE BAND PAGE ──
     What a box grows into: the whole rect the six boxes stand in. THE
     sheet (same markup, same IstSheet.open/close), arriving by the
     shared grow rather than by sliding -- see the CSS block above and
     openFbPage below. Body-level, like the map and the game overlay,
     because it has to cover the cast rather than stand inside it. -->
<div class="ist-sheet-overlay ist-sheet-dim fb-page-overlay" id="fb-page-overlay" hidden>
  <div class="ist-sheet-backdrop" id="fb-page-backdrop"></div>
  <div class="ist-sheet fb-page" id="fb-page">
    <div class="fb-page-inner" id="fb-page-inner"></div>
  </div>
</div>

<!-- ── THE GAME OVERLAY ──
     Sözcel opens here instead of navigating away -- see wireGameOverlay
     and the CSS block above. THE sheet, exactly as the profile bar's
     own name opens one; the iframe is the only thing in it. -->
<div class="ist-sheet-overlay" id="fb-game-overlay" hidden>
  <div class="ist-sheet-backdrop" id="fb-game-backdrop"></div>
  <div class="ist-sheet fb-game-sheet">
    <iframe id="fb-game-frame" title="Oyun"></iframe>
  </div>

<script>
(function () {
// ══════════════════════════════════════════════════════════════
// PROJE — the flip book, on its own, with nothing else in the way
//
// A rig rather than a feature. Twelve numbered frames, scrubbed by the
// finger, and it can only come to rest on a STOP. Let go anywhere in
// between and it runs to whichever of the two stops it is between is
// nearer -- there is no stopping in mid-book and nothing to press
// there, which is the whole reason a journey like this costs nothing.
//
// Deliberately self-contained: no map, no data, no page swap, no shared
// transition machinery. If it is not smooth here it is not the app's
// fault, and if it is smooth here then everything that made it rough
// elsewhere is something else.
// ══════════════════════════════════════════════════════════════
// ── THE İLÇE STOP IS PARKED ──
// The book's second run -- slide 12 down to slide 24, Kahvehane out to
// the reader's own ilçe -- is not drawn and has nothing behind it: every
// frame from 13 to 24 is still the numbered placeholder, and the stop
// they arrive at carries two dashed boxes (Kahve, Yorumlar) whose
// content is in the parts bin. A run of test frames ending on an empty
// screen is worse than no run at all, so the run does not exist: a pull
// down on Kahvehane simply does not move the paper, which is the same
// "not this way" Hane's own vertical already says (see laneStops).
//
// It is parked rather than deleted, the way kahvehane.html's comments
// and Kütüphane's Olaylar column are. Turning it back on is this one
// line -- the poses, the actors, the app map's window and the wire to it
// are all still written, each gated on this flag. The local level is
// worth drawing when there are enough members per district for it to say
// anything; until then it is twelve PNGs every reader downloads before
// the book will arm, to reach a screen with nothing on it.
const ILCE_STOP_ENABLED = false;

// The book is genuinely as long as it is reachable. This is not a clamp
// over a 24-frame book: FRAMES drives the image array and the loader
// (see loadFrames), so parking the second run also stops those twelve
// frames being fetched at all -- and the gesture arms only once every
// frame is in, so it is the reader's first-open wait that gets shorter.
const FRAMES = ILCE_STOP_ENABLED ? 24 : 12;

// ── What each frame shows ──
// The first two stops are the real maps -- frame 1 is Türkiye, frame 12
// İstanbul -- and everything else, the run out to frame 24 included, is
// still the numbered test slide. Swap a number for a path here and that
// frame becomes a picture; there is nothing else to change.
const OVERRIDE = {
  0:  'assets/map/kutuphane-map-mobile.png',     // 1080 x 2420 -- the odd one
  1:  'assets/map/istanbul-map-mobile02.png',    // 1080 x 1920
  2:  'assets/map/istanbul-map-mobile03.png',    // 1080 x 1920
  3:  'assets/map/istanbul-map-mobile04.png',    // 1080 x 1920
  4:  'assets/map/istanbul-map-mobile05.png',    // 1080 x 1920
  5:  'assets/map/istanbul-map-mobile06.png',    // 1080 x 1920
  // 6 -> slide 7, not drawn yet: still the numbered placeholder
  7:  'assets/map/istanbul-map-mobile08.png',    // 1080 x 1920
  8:  'assets/map/istanbul-map-mobile09.png',    // 1080 x 1920
  9:  'assets/map/istanbul-map-mobile10.png',    // 1080 x 1920
  10: 'assets/map/istanbul-map-mobile11.png',    // 1080 x 1920
  11: 'assets/map/istanbul-map-mobile.png',      // 1080 x 1920
};
const SRC = i => OVERRIDE[i] || ('assets/project/' + String(i + 1).padStart(2, '0') + '.png');

// How a frame is laid into the screen. `cover` fills it and crops what
// does not fit; `contain` shows the whole picture and leaves paper
// around it. Every frame is treated the same way, whatever its own
// shape, so the book stays registered with itself.
//
// Everything here is 9:16 (1080x1920) except the Türkiye end, which is
// 1080x2420 -- taller, so cover trims a little off its top and bottom
// where every other frame loses 9% off each side instead. That is the
// one frame not yet registered with the rest of the book.
const FIT = 'cover';

// How far the thumb travels PER PAGE, as a fraction of the screen's
// height -- not per book. Stated this way on purpose: the book's length
// is a thing that changes, and with a fixed whole-book distance every
// slide added made every page flip faster, which quietly undoes the lag
// tuning. 0.05 is the original 0.55 across the twelve-slide book.
const TRAVEL_PER_SLIDE = 0.05;
const TRAVEL = TRAVEL_PER_SLIDE * (FRAMES - 1);
// ── The stops ──
// The frames the book is allowed to come to rest on, 0-based and in
// order. Everything else is mid-flip: a stop is where the drawing is a
// real screen with real things on it, and the runs between two stops
// are the journeys.
//
// Three of them, and the two runs are the same kind of thing: 1 -> 12
// is one journey, 12 -> 24 is the next. A stop in the middle of the
// book is not a landing the gesture has to be told about -- it is just
// another entry here, which is why the whole of "add a stop" is adding
// a number to this line.
// With the ilçe stop parked there are TWO of them, not three, and that
// is all the rest of the release logic needs to hear: bracket() reads
// this list and nothing else, so a release on Kahvehane now brackets
// [11, 11] and has nowhere to run to.
const STOPS = ILCE_STOP_ENABLED ? [0, 11, FRAMES - 1] : [0, 11];

// The two stops a position is between -- the same stop twice when the
// book is resting on one. This is what makes a release a local
// question: the run out of a drag is decided against the stops on
// either side of the finger, never against the ends of the book.
function bracket(p) {
  let lo = STOPS[0];
  let hi = STOPS[STOPS.length - 1];
  for (const s of STOPS) if (s <= p) lo = s;
  for (let i = STOPS.length - 1; i >= 0; i--) if (STOPS[i] >= p) hi = STOPS[i];
  return [lo, hi];
}

// Where a release decides which stop it is running to, as a fraction of
// the run it was let go in, when the finger was moving slowly enough
// for position to be the question.
const TIP = 0.5;
// px/ms. Past this the direction of the throw decides instead of the
// distance, and it commits to the next stop THAT WAY rather than to an
// end of the book -- otherwise a long book can only be crossed by
// dragging half a screen, which is not a gesture anyone makes twice. 0.55 is the
// app's own throw constant (FLICK_SPEED in router.js, and the deck
// swipes on Kütüphane and Kahvehane), so a flick that turns the book
// asks exactly as much of the thumb as a flick that throws a card away.
const FLICK = 0.55;
// How fast it runs out once let go, in pages per second. A longer book
// takes longer to run out, which is right -- but only up to a point, so
// this is the knob if the far end starts feeling distant.
const RUN_FPS = 34;

// ── The three lanes of slide 12 ──
// Declared up here rather than beside the rest of the lane machinery
// because the CAST table below is written in terms of them, and a
// `const` read before its own line is a TDZ error that takes the whole
// page script with it. See "SLIDE 12 IS THREE SCREENS" further down for
// what they are.
const LANE_STOP = 11;       // the lanes are slide 12's, and slide 12's alone
const LANE_KUTUPHANE = 0;   // left on the screen: the reading side
const LANE_MAP = 1;         // the middle: the app map (see THE APP MAP below)
const LANE_KAHVEHANE = 2;   // right on the screen: the doing side
const LANES = 3;

// ── Where the reader comes in ──
// The middle stop and the middle lane: the app map, on slide 12. Not
// slide 1 -- the app's own rule is that you always enter in the MIDDLE
// and swipe out from there, so the book opens on the shape of the whole
// thing and Türkiye is one pull away rather than the doorstep. The petek
// is one press of the logo away from it, wherever the reader is standing.
const START_SLIDE = LANE_STOP;
const START_LANE = LANE_MAP;

// ══════════════════════════════════════════════════════════════
// THE TWO EDITIONS — the sun decides which paper is out
//
// The palette already follows the sun over İstanbul (IstDate.isDaytime,
// read by palette.js), so the app is genuinely light by day and dark by
// night. This makes that more than a colour: the İstanbul level prints
// two editions, and which one is out is the same question the theme is
// already asking.
//
//   GÜNDÜZ  Kütüphane  wide: the three news buckets; pressing one opens
//                            it and a THROW answers the story's own poll
//                      narrow: the same three categories, one story
//                              deeper into their own stack -- more news,
//                              not a vote (see loadHaberlerNarrowActor)
//           Kahvehane  wide: the three evenings; a throw is the RSVP
//                      narrow: the three games, COLLECTING -- a word for
//                              Sözcel, a quote for Tümcel, and Bulmaca
//                              saying it builds itself
//
//   GECE    Kütüphane  wide: the news, unchanged — a story is a story
//                            whatever the hour
//                      narrow: ANKET SONUÇLARI — every district,
//                              coloured by its own split (the reveal)
//           Kahvehane  wide: the evenings, unchanged — an event you RSVP
//                            to at 21:00 is the most normal thing here
//                      narrow: Oyunlar — the three games, playable
//
// Kütüphane's wide column is the news now, day and night alike, and no
// longer trades places with anything -- a reader mid-story at sunset
// must never have it swapped out from under them for a poll result. What
// the sun changes is the NARROW column alone: news one layer deeper by
// day, the district polls' own answers once they close for the night --
// "the polls come out" is a night thing through and through, asking and
// answering both, rather than a box that hands the front page back and
// forth between two unrelated questions.
//
// The games being night-only is a real restriction -- in June that is a
// window from 20:38 to 05:32, under nine hours -- so it is one flag
// rather than a rule spread through the column. Set it false and the
// games stand in their column around the clock, with the scoreboard
// reached the way it always was.
const NIGHT_GAMES_ENABLED = true;

// 'gun' | 'gece'. Null until the first sync, which is mount().
let fbEdition = null;

function readEdition() {
  try {
    if (window.IstDate && IstDate.edition) return IstDate.edition();
  } catch (err) { console.error('[proje baski]', err); }
  // A clock that cannot be reached is a day, not a night: the morning
  // paper is the one with the news in it, so an app that fails open is
  // an app with something to read.
  return 'gun';
}

// ── THE EDITION TURNS ON ARRIVAL, NEVER UNDER THE READER'S HANDS ──
// The theme flips live, on palette.js's own 60s timer, and that is right
// for colour: a page going dark around you is the room going dark. It is
// exactly wrong for CONTENT. A reader half way through a story at 20:38
// in June must not have it replaced by a poll result, so nothing here is
// on a timer -- the edition is re-read when the reader ARRIVES (a fresh
// mount, a lane they have just walked onto, the app coming back from the
// background with nothing open) and held otherwise.
// Answers whether it actually changed, so the caller only re-renders
// when there is something to re-render.
function syncEdition(force) {
  const next = readEdition();
  if (!force && next === fbEdition) return false;
  fbEdition = next;
  // The stylesheet gets to know too: a night column and a day column are
  // the same box with different content, but a kicker or a rule may want
  // to say which paper this is.
  document.documentElement.setAttribute('data-ist-edition', fbEdition);
  return true;
}

// ── The third arrival: the app coming back from the background ──
// Most readers cross a sunset with the app shut rather than by walking a
// lane, so without this the edition would only ever turn on a cold
// start. It is still an ARRIVAL and not a timer: the turn is refused
// outright while a page is open, because that is precisely the reader
// holding the paper (see syncEdition), and while a finger is down or the
// book is in flight, because a column rebuilt mid-gesture is the strip
// reflowing under the thumb. Refused, not deferred -- the next lane they
// walk onto will pick it up, which is the same rule stated once.
let _editionReturnWired = false;
function wireEditionReturn() {
  if (_editionReturnWired) return;
  _editionReturnWired = true;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const overlay = document.getElementById('fb-page-overlay');
    if (overlay && !overlay.hidden) return;
    const game = document.getElementById('fb-game-overlay');
    if (game && !game.hidden) return;
    if (drag || anim || laneRun) return;
    if (syncEdition()) refreshEditionColumns();
  });
}

// Every actor whose content is decided by the edition, re-read in place.
// The same move refreshOyunColumn and refreshAnketColumn already make --
// the cast is not rebuilt, only its boxes are filled again.
function refreshEditionColumns() {
  anketPromise = null;
  if (loadAnketSonucActor && loadAnketSonucActor.reset) loadAnketSonucActor.reset();
  gamesStatePromise = null;
  submitPromise = null;
  (cast || []).forEach(a => {
    if (!a.def.load) return;
    if (!/\bfb-haberler\b|\bfb-anket\b|\bfb-oyun\b/.test(a.def.cls)) return;
    try { a.def.load(a.el); } catch (err) { console.error(err); }
  });
  refreshDayMeter();
}

// ══════════════════════════════════════════════════════════════
// THE CAST
//
// The things that live on a STOP -- buttons, panels, the page's own
// furniture. Two rules make them work:
//
//   1. They are only ALIVE on their own stop AND their own LANE.
//      Anywhere else -- another stop, another lane, or anywhere in
//      between -- they are a picture of themselves and take no presses:
//      an actor belongs to one screen, not to the book.
//   2. They never appear or disappear. Every slide gives each of them a
//      place, and they travel between those places with the finger.
//
// A pose is `{ x, y, scale, opacity, rot }` where x and y are PERCENT
// OF THE ACTOR'S OWN SIZE -- the same units a CSS translate uses. That
// makes "parked off the left edge" simply x: -160, whatever the screen
// is, and `{}` means "exactly where its CSS puts it".
//
// The table is sparse: write the slides that matter and the rest is
// interpolated. Before the first pose you give and after the last, it
// holds.
//
// An actor on a middle stop is parked off-screen on BOTH sides of it:
// it comes in over the run that arrives at its stop and leaves again
// over the run that departs it, so it belongs to that screen coming and
// going. Its poses are symmetric about its own slide, and the symmetry
// is the whole of it -- there is no code that knows a stop is in the
// middle.
//
// `lane` is the second axis and needs no table at all: an actor is
// simply pushed a lane's width in whichever direction the reader walked
// away from it (see paintCast). That is what makes the two casts
// diverge without either of them knowing the other exists -- Kahvehane's
// leave to the right because the reader went left, and Kütüphane's
// arrive from the left because the reader kept going.
//
// `col` ('l' / 'r') is the one thing an actor says about how it LOOKS,
// and it is a word rather than a stylesheet: the wide column on the
// left or the narrower one on the right, always three slots stacked
// per column -- the only shape the app has (see "What each screen
// carries" in CLAUDE.md). Everything about a box's size and place is
// stated once in .fb-box / .fb-col-l / .fb-col-r / .fb-slot-N; an
// actor's own class only ever says what it is OF. `stackActors()`
// below is what turns one such description into the three sibling
// actors (slot 0/1/2) it implies, so a new column is one call rather
// than three hand-copied objects.
// ══════════════════════════════════════════════════════════════

// ── District names, shared by the events and news actors below ──
const NB_NAMES = {
  bakirkoy:'Bakırköy', bayrampasa:'Bayrampaşa', bahcelievler:'Bahçelievler', sisli:'Şişli',
  eyupsultan:'Eyüpsultan', gop:'Gaziosmanpaşa', esenler:'Esenler', bagcilar:'Bağcılar',
  basaksehir:'Başakşehir', kucukcekmece:'Küçükçekmece', sultangazi:'Sultangazi',
  uskudar:'Üsküdar', kadikoy:'Kadıköy', maltepe:'Maltepe', umraniye:'Ümraniye',
  cekmekoy:'Çekmeköy', beykoz:'Beykoz', sariyer:'Sarıyer', besiktas:'Beşiktaş',
  beyoglu:'Beyoğlu', gungoren:'Güngören', kagithane:'Kağıthane', atasehir:'Ataşehir',
  zeytinburnu:'Zeytinburnu', fatih:'Fatih',
};

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// Everything Istanbul-dated goes through one clock (CLAUDE.md rule 10);
// here that is just the timeZone these are formatted in.
// Just the clock, in Istanbul local time -- the day itself is already
// said by which box a card landed in (BUGÜN/YARIN/...), so the meta
// line under it only owes the reader the hour.
function eventTimeOnly(iso) {
  return new Date(iso).toLocaleTimeString('tr-TR',
    { timeZone: 'Europe/Istanbul', hour: '2-digit', minute: '2-digit', hour12: false });
}

// The whole stamp, for the page the card opens into: there the day is no
// longer said by which box the reader pressed, so it has to be printed.
function eventWhenLong(iso) {
  return new Date(iso).toLocaleString('tr-TR', {
    timeZone: 'Europe/Istanbul', day: 'numeric', month: 'long',
    weekday: 'long', hour: '2-digit', minute: '2-digit', hour12: false,
  });
}

// ── Filling a 3-box stack from one fetch ──
// Olaylar is still this shape: fetch up to 3 rows once, render each
// into its own box, and leave whichever slots have no row as an empty
// dashed frame -- the same "nothing here" convention as everywhere
// else on the site (.events-empty, deckFrameHTML). One fetch serves
// all three slots via a shared promise, so a column costs one round
// trip and not three. Etkinlikler and Haberler used to be this shape
// too; they are bucketed columns now (see below), where which slot a
// card lands in is a fact about the card, not just how new it is.
function stackFetch(fetchRows) {
  let promise = null;
  const run = function (el, slot) {
    if (!promise) promise = fetchRows();
    promise.then(({ rows, failed, emptyHtml, failedHtml }) => {
      if (!el.isConnected) return;
      // Cleared before every render, filled only on the path that
      // actually has something to open (see THE BAND PAGE): a message,
      // an empty feed and a dashed slot are all boxes with nothing
      // behind them, and none of the three is pressable.
      fbSetPage(el, null);
      fbSetDone(el, false);
      // Three states, and they say different things: a fetch that
      // never landed, a feed with nothing in it, and a feed with fewer
      // than three things are not the same fact -- only the first slot
      // ever carries the message, the rest are simply left dashed.
      if (failed) {
        if (slot === 0) { el.classList.remove('fb-empty'); el.innerHTML = failedHtml; }
        else { el.classList.add('fb-empty'); el.innerHTML = ''; }
        return;
      }
      if (!rows.length && slot === 0) {
        el.classList.remove('fb-empty'); el.innerHTML = emptyHtml;
        return;
      }
      // A row is the card AND the page it opens into -- one object, so
      // a column cannot end up printing one thing and opening another.
      const row = rows[slot];
      if (!row) { el.classList.add('fb-empty'); el.innerHTML = ''; return; }
      el.classList.remove('fb-empty'); el.innerHTML = row.html;
      fbSetPage(el, row.page);
      // A row may say it has already been dealt with (Anket does; Olaylar
      // has nothing to be done with, so it never sets this).
      fbSetDone(el, row.done);
    });
  };
  // A column that can change while the reader is standing on it (Anket,
  // the moment a vote lands) needs the shared fetch dropped as well as
  // its own source promise -- this closure caches independently of
  // whatever the fetcher itself remembers, so nulling only that one
  // would re-render the same rows and look like nothing happened.
  run.reset = () => { promise = null; };
  return run;
}

// ── Kahvehane's lane: one box per DAY, not a feed ──
// Fixed vertical order top to bottom -- day+0, day+1, day+2 -- so the
// slot a card lands in says WHICH day, never merely how soon. Slots are
// stacked bottom-up (slot 0 lowest), so day offset 0 is slot 2, offset 1
// is slot 1, offset 2 is slot 0. Day boundaries go through IstDate.iso()
// (CLAUDE.md rule 10) rather than a device-local midnight, then get
// built as fixed +03:00 instants -- Istanbul carries no DST, so this is
// exact rather than a guess.
//
// A function, not a table: the three words are I18N's own
// (events.today/tomorrow/dayafter) and have to be re-read on every call,
// never cached, because a flip has to relabel a column that is already
// standing (see THE LANGUAGE HOLD). The Turkish for day+2 used to be
// "Evvelsi gün", which means the day BEFORE yesterday -- corrected to
// "Öbür gün" in i18n.js rather than merely translated.
function etkinlikLabels() {
  const t = (k) => (window.I18N && I18N.t) ? I18N.t(k) : k;
  return [t('events.today'), t('events.tomorrow'), t('events.dayafter')];
}
let etkinlikPromise = null;
async function loadEtkinlikActor(el, slot) {
  if (!etkinlikPromise) {
    etkinlikPromise = (async () => {
      try {
        const ranges = [0, 1, 2].map(off => ({
          start: new Date(IstDate.iso(off) + 'T00:00:00+03:00').toISOString(),
          end: new Date(IstDate.iso(off + 1) + 'T00:00:00+03:00').toISOString(),
        }));
        const results = await Promise.all(ranges.map(r => IstRouter.sb.from('events')
          .select('*').gte('event_date', r.start).lt('event_date', r.end)
          .order('event_date', { ascending: true }).limit(1)));
        return { days: results.map(r => (r.error ? null : (r.data || [])[0] || null)), failed: false };
      } catch (err) {
        console.error('[proje etkinlik]', err);
        return { days: [null, null, null], failed: true };
      }
    })();
  }
  const { days, failed } = await etkinlikPromise;
  if (!el.isConnected) return;
  // Cleared before every render, filled only on the path that actually
  // has something to open: a box with no payload is not pressable, which
  // is the truth about a dashed slot or a fetch that failed.
  fbSetPage(el, null);
  // An evening is never "done". It is somewhere to be, not content to
  // get through -- so Etkinlikler is deliberately outside the day's
  // meter as well (see refreshDayMeter). Cleared all the same, because
  // a class outlives a re-render.
  fbSetDone(el, false);
  const dayIdx = 2 - slot;
  const label = etkinlikLabels()[dayIdx];
  if (failed) {
    el.classList.toggle('fb-empty', slot !== 2);
    el.innerHTML = '<div class="k">' + label + '</div>' +
      (slot === 2 ? '<div class="t">Yüklenemedi</div>' : '');
    return;
  }
  const ev = days[dayIdx];
  if (!ev) { el.classList.add('fb-empty'); el.innerHTML = '<div class="k">' + label + '</div>'; return; }
  el.classList.remove('fb-empty');
  const nb = ev.neighborhood ? (NB_NAMES[ev.neighborhood] || ev.neighborhood) : 'İstanbul';
  el.innerHTML = '<div class="k">' + label + '</div>' +
    '<div class="m">' + esc(eventTimeOnly(ev.event_date)) + '</div>' +
    '<div class="t">' + esc(ev.title) + ' — ' + esc(nb) + '</div>';
  // Where the reader already stands on this evening, so the page can say
  // so instead of asking again as if they had never seen it.
  const rsvp = await eventVerdictFor(ev.id);
  if (!el.isConnected) return;
  // What the box only had room to name (see THE BAND PAGE): the evening
  // itself, where it is and what it is -- and the one thing it asks.
  fbSetPage(el, {
    kicker: label, meta: eventTimeOnly(ev.event_date), title: ev.title,
    lines: [eventWhenLong(ev.event_date), [nb, ev.location].filter(Boolean).join(' · ')].filter(Boolean),
    html: fbParas(ev.description || '') +
      (rsvp === 'yes'
        ? '<div class="fb-throw-q">Gidiyorsun.</div>' + throwFootHTML('Vazgeç', 'Gidiyorum', 'Fikrini değiştirebilirsin.')
        : '<div class="fb-throw-q">Gidiyor musun?</div>' + throwFootHTML('Gitmiyorum', 'Gidiyorum', 'Sola ya da sağa at.')),
    wire: (inner) => wirePageThrow(inner, {
      right: { label: 'Gidiyorum', run: () => setEventRsvp(ev, true) },
      left:  { label: rsvp === 'yes' ? 'Vazgeç' : 'Gitmiyorum', run: () => setEventRsvp(ev, false) },
    }),
  });
}

// ── An evening's verdict ──
// Two tables, on purpose, and this pass writes BOTH: event_rsvps is
// presence ("somebody is going") and event_interest carries the yes/no
// ("there is somebody to go with"). Hane paints them as two separate
// marks on the petek -- a corner dot for the verdict, a red disc for
// actually going -- and they are not the same fact, so collapsing the
// gesture must not collapse the record. A left throw is a real "no"
// rather than the absence of a yes, which is the whole reason
// event_interest exists (db/hive_event_interest.sql).
async function eventVerdictFor(eventId) {
  try {
    const uid = await doneUid();
    if (!uid) return null;
    const { data, error } = await IstRouter.sb.from('event_rsvps')
      .select('event_id').eq('event_id', eventId).eq('user_id', uid).maybeSingle();
    if (error) throw error;
    return data ? 'yes' : null;
  } catch (err) { console.error('[proje etkinlik rsvp]', err); return null; }
}

async function setEventRsvp(ev, going) {
  const sb = IstRouter.sb;
  let uid = null;
  try { uid = await doneUid(); } catch (err) {}
  if (!uid) return;
  // Each half is independent and best-effort: a database without the
  // event_interest migration still records the RSVP, which is the half
  // the reader can actually see on this page.
  try {
    if (going) {
      // The unique (event_id, user_id) makes a second yes a no-op rather
      // than a duplicate, so throwing right twice is harmless.
      const { error } = await sb.from('event_rsvps')
        .upsert([{ event_id: ev.id, user_id: uid }], { onConflict: 'event_id,user_id' });
      if (error) throw error;
    } else {
      const { error } = await sb.from('event_rsvps')
        .delete().eq('event_id', ev.id).eq('user_id', uid);
      if (error) throw error;
    }
  } catch (err) { console.error('[proje rsvp]', err); }
  try {
    const { error } = await sb.from('event_interest')
      .upsert([{ user_id: uid, event_id: ev.id, verdict: going ? 'yes' : 'no' }],
              { onConflict: 'user_id,event_id' });
    if (error) throw error;
  } catch (err) { console.error('[proje etkinlik verdict]', err); }
  // No localStorage mirror here on purpose: event-interest.js is gone
  // (it left with kahvehane's own events deck), so event_interest IS the
  // record now rather than a server copy of one. Hane's petek reads it
  // through hive_event_interest_status either way.
  refreshEtkinlikColumn();
}

// The column is re-read the moment a verdict lands, the same rule
// refreshOyunColumn and refreshAnketColumn follow.
function refreshEtkinlikColumn() {
  etkinlikPromise = null;
  (cast || []).forEach(a => {
    if (!/\bfb-events\b/.test(a.def.cls) || !a.def.load) return;
    try { a.def.load(a.el); } catch (err) { console.error(err); }
  });
}

// ── Kütüphane's lane: one box per CATEGORY, not a feed ──
// ══════════════════════════════════════════════════════════════
// WHAT THE READER HAS ALREADY DEALT WITH — and the day's own meter
//
// The app's dopamine is CLOSURE, not accumulation: the day is a small
// finite set of things -- the three categories of news, the games that
// are on, the polls that are open -- and finishing it means the app is
// over for today. So there is no streak here, no lifetime total and no
// points; there is a box that goes quiet when you are done with it (see
// .fb-done) and a ring that fills as the day does (see --fb-day). The
// reward for finishing is being let go, which is the only reward this
// app is allowed to offer (see the anti-screen-time rule in CLAUDE.md).
//
// Nothing new is stored. The three facts already exist:
//   * news    -- dunya_dealt_<uid> in localStorage, mirrored server-side
//                as news_dealt (db/hive_member_status.sql), which is what
//                lets somebody's petek caption say how deep their deck is
//   * games   -- game_results, attempts >= 1
//   * anket   -- neighborhood_poll_votes, insert-only
// ══════════════════════════════════════════════════════════════

let _doneUid;   // undefined = not asked yet, null = signed out
function doneUid() {
  if (_doneUid === undefined) {
    _doneUid = (async () => {
      const sb = window.IstRouter && IstRouter.sb;
      if (!sb) return null;
      try { return (await sb.auth.getUser()).data.user.id; } catch (err) { return null; }
    })();
  }
  return _doneUid;
}

function lsRead(key) {
  try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (err) { return null; }
}

// The deck's own store, normalised. Its first version was a plain array
// of ids with no stamp at all; those entries are kept as the sentinel
// `true`, which reads as "dealt with as it stands" -- the same reading
// kutuphane.html's reconcileDealt and the app map's own square give it.
function newsDealtStore(uid) {
  const raw = uid ? lsRead('dunya_dealt_' + uid) : null;
  if (Array.isArray(raw)) {
    const map = {};
    raw.forEach(id => { map[String(id)] = true; });
    return map;
  }
  return (raw && typeof raw === 'object') ? raw : {};
}

// What is remembered is not "this story is done" but the story's own
// updated_at AS THROWN -- so a gelişme landing on its timeline (which
// bumps breaking_news.updated_at) brings the story back, and back into
// the day's denominator with it. A story that has not moved stays done.
function newsIsDealt(store, row) {
  if (!row) return false;
  const v = store[row.id];
  if (v == null) return false;
  return v === true || v === row.updated_at;
}

async function newsMarkDealt(row) {
  const uid = await doneUid();
  if (!uid || !row) return;
  const store = newsDealtStore(uid);
  if (store[row.id] === row.updated_at) return;
  store[row.id] = row.updated_at;
  try { localStorage.setItem('dunya_dealt_' + uid, JSON.stringify(store)); } catch (err) {}
  // The server copy is written BESIDE the local one, never instead of
  // it: localStorage is what the reader's own screen runs on and must
  // not wait for a round trip, while news_dealt is what somebody else's
  // petek reads. A database without that migration simply answers an
  // error here and the column behaves exactly as it did before.
  const sb = window.IstRouter && IstRouter.sb;
  if (!sb) return;
  try {
    const { error } = await sb.from('news_dealt').upsert(
      { user_id: uid, news_id: row.id, dealt_stamp: row.updated_at },
      { onConflict: 'user_id,news_id' });
    if (error) throw error;
  } catch (err) {
    console.error('[proje okundu]', err);
  }
}

// One setter, so "is done" and "looks done" cannot drift apart -- the
// same reason fbSetPage is one function. A done box stays pressable:
// a story can be read twice.
function fbSetDone(el, done) {
  if (el) el.classList.toggle('fb-done', !!done);
}

// ── The day's own denominator ──
// Every part is best-effort and independent, exactly as the app map's
// squares are: a query that fails contributes nothing rather than
// taking the meter (or the page) down with it.
let dayMeter = { done: 0, total: 0 };

async function refreshDayMeter() {
  const uid = await doneUid();
  let done = 0, total = 0;

  try {
    const { byBucket, failed } = await haberlerData();
    if (!failed) {
      const store = newsDealtStore(uid);
      for (const b of HABER_BUCKETS) {
        const arr = byBucket[b];
        if (!arr || !arr.length) continue;      // no story in that category's edition
        total += arr.length;
        done += arr.filter(n => newsIsDealt(store, n)).length;
      }
    }
  } catch (err) { console.error('[proje gün]', err); }

  try {
    const state = await gamesStateToday();
    for (const g of GAME_DEFS) {
      // A game the admin switched off is not a step anybody has left to
      // take, so it is on neither side of the fraction -- the same
      // reading hive_member_status and the app map's square give it.
      if (state.off.has(g.key)) continue;
      total++;
      if (state.played.has(g.key)) done++;
    }
  } catch (err) { console.error('[proje gün]', err); }

  try {
    const { polls, voted, failed } = await anketData();
    if (!failed) {
      for (const p of polls) { total++; if (voted.has(p.id)) done++; }
    }
  } catch (err) { console.error('[proje gün]', err); }

  dayMeter = { done, total };
  paintDayMeter();
}

function paintDayMeter() {
  const btn = document.getElementById('fb-logo-btn');
  const line = document.getElementById('fb-map-done');
  const { done, total } = dayMeter;
  // A day with nothing on it is not a finished day -- an empty ring says
  // "nothing to do", which is the truth, rather than "well done".
  const full = total > 0 && done >= total;
  const pct = total > 0 ? (done / total) * 100 : 0;
  if (btn) {
    btn.style.setProperty('--fb-day', pct.toFixed(1) + '%');
    btn.classList.toggle('fb-day-full', full);
  }
  if (line) line.hidden = !full;
}

// Fixed vertical order top to bottom -- İSTANBUL, TÜRKİYE, DÜNYA -- each
// showing that category's own EDITION: the stories the admin curated for
// the day, in the admin's own order, not the newest thing posted. Posting
// a story is not publishing it any more -- a story only reaches this
// column once it carries a hook, a poll, and an edition_date
// (db/breaking_news_v3_edition.sql). A district story (`neighborhood` set,
// no `category`) is still İstanbul for this column's purposes.
const HABER_BUCKETS = ['istanbul', 'turkiye', 'dunya']; // [slot 2, slot 1, slot 0]
// A function, not a table, for the same reason etkinlikLabels() is: the
// three words are I18N's own (news.istanbul/turkiye/dunya) and have to
// be re-read on every call, never cached, so a flip relabels a column
// that is already standing (see THE LANGUAGE HOLD).
function haberLabels() {
  const t = (k) => (window.I18N && I18N.t) ? I18N.t(k) : k;
  return { istanbul: t('news.istanbul'), turkiye: t('news.turkiye'), dunya: t('news.dunya') };
}
function newsBucket(n) {
  const c = n.category || n.neighborhood || 'turkiye';
  if (c === 'dunya') return 'dunya';
  if (c === 'turkiye') return 'turkiye';
  return 'istanbul';
}
let haberlerPromise = null;
// One fetch, shared by the three boxes AND by the day meter -- the meter
// must never be able to count a different set of stories than the column
// is printing. `byBucket[b]` is now a STACK (admin's own edition_order),
// not a single row -- some days one category carries seven stories and
// another carries one, and the slot is the same either way.
function haberlerData() {
  if (!haberlerPromise) {
    haberlerPromise = (async () => {
      try {
        // "Today's edition" is the newest one that has actually gone out
        // (news_current_edition, SECURITY DEFINER) -- never a future one
        // the admin is still assembling, and never rolled by a timer: it
        // holds until the admin sets a newer edition_date, whenever that
        // is. IstDate.iso() (never a parsed locale string, CLAUDE.md rule 10).
        const today = IstDate.iso();
        const { data: editionDate, error: edErr } = await IstRouter.sb
          .rpc('news_current_edition', { p_today: today });
        if (edErr) throw edErr;
        if (!editionDate) return { byBucket: {}, editionDate: null, failed: false };
        const { data, error } = await IstRouter.sb.from('breaking_news')
          .select('id, title, body, title_en, body_en, hook_tr, hook_en, hook_author, category, neighborhood, series_id, updated_at, edition_order')
          .eq('edition_date', editionDate)
          .is('archived_at', null)
          .order('edition_order', { ascending: true });
        if (error) throw error;
        const byBucket = {};
        for (const n of (data || [])) {
          const b = newsBucket(n);
          (byBucket[b] || (byBucket[b] = [])).push(n);
        }
        return { byBucket, editionDate, failed: false };
      } catch (err) {
        console.error('[proje haberler]', err);
        return { byBucket: {}, editionDate: null, failed: true };
      }
    })();
  }
  return haberlerPromise;
}

// A vote just answered is what lets the next story in the stack stand up
// in this box -- see loadHaberlerActor's own note on why dealing waits
// for the throw rather than the open.
function refreshHaberlerColumn() {
  (cast || []).forEach(a => {
    if (!/\bfb-haberler\b|\bfb-anket\b/.test(a.def.cls) || !a.def.load) return;
    try { a.def.load(a.el); } catch (err) { console.error(err); }
  });
  refreshDayMeter();
}

// Wide is depth 0 -- the same box it always was. Narrow (day only, see
// loadKutuphaneNarrow) is depth 1: the same three categories one story
// further into their own stack, which is the whole of what "expand the
// news" means -- not a second feed, the next thing in the category
// already on screen. A category with nothing past its own primary story
// today has nothing to be deeper than, so depth 1 goes dashed there
// rather than printing the same headline the wide column already has.
function loadHaberlerActor(el, slot) { return loadHaberlerActorAt(el, slot, 0); }
function loadHaberlerNarrowActor(el, slot) { return loadHaberlerActorAt(el, slot, 1); }

async function loadHaberlerActorAt(el, slot, depth) {
  const { byBucket, editionDate, failed } = await haberlerData();
  if (!el.isConnected) return;
  // Cleared before every render, filled only on the path that actually
  // has something to open: a box with no payload is not pressable, which
  // is the truth about a dashed slot or a fetch that failed.
  fbSetPage(el, null);
  fbSetDone(el, false);
  const bucket = HABER_BUCKETS[2 - slot];
  const label = haberLabels()[bucket];
  if (failed) {
    // The message stands once, on the wide column's own İstanbul box --
    // printing it a second time on the narrow column's copy said the
    // same failure from two directions at once.
    el.classList.toggle('fb-empty', !(slot === 2 && depth === 0));
    el.innerHTML = '<div class="k">' + label + '</div>' +
      (slot === 2 && depth === 0 ? '<div class="t">Yüklenemedi</div>' : '');
    return;
  }
  const arr = byBucket[bucket] || [];
  if (!arr.length) {
    el.classList.add('fb-empty');
    el.innerHTML = '<div class="k">' + label + '</div>' +
      (slot === 2 && depth === 0 && !editionDate ? '<div class="t">Bugün için bir sayı çıkmadı.</div>' : '');
    return;
  }
  const uid = await doneUid();
  if (!el.isConnected) return;
  const store = newsDealtStore(uid);
  // The stack shows the first story nobody has answered yet -- and once
  // every one of them has been, it settles on the last, the same "a done
  // box stays pressable" rule every other box follows.
  const undealt = arr.filter(n => !newsIsDealt(store, n));
  const primary = undealt[0] || arr[arr.length - 1];
  let n = primary;
  if (depth > 0) {
    n = undealt.find(x => x !== primary) || arr.find(x => x !== primary);
    if (!n) { el.classList.add('fb-empty'); el.innerHTML = '<div class="k">' + label + '</div>'; return; }
  }
  const stackTag = arr.length > 1 ? ' · ' + (arr.indexOf(n) + 1) + '/' + arr.length : '';
  const byline = n.hook_author ? '— ' + n.hook_author : '';
  el.classList.remove('fb-empty');
  // The front of the card is the HOOK, not the headline -- a teaser the
  // admin (for now; see db/breaking_news_v3_edition.sql) writes on its
  // own, with its own byline. The real headline and body are the reveal,
  // printed only once the page is opened. Falling back to the real title
  // is "no data, no gate": an older row never given a hook still opens.
  el.innerHTML = '<div class="k">' + label + stackTag + '</div>' +
    (byline ? '<div class="m">' + esc(byline) + '</div>' : '') +
    '<div class="t">' + esc(hookText(n) || newsText(n, 'title')) + '</div>';
  fbSetDone(el, newsIsDealt(store, n));
  // If this update is itself part of a `seri` (it links back to earlier
  // posts about the same thing), its page carries their Zaman Akışı too,
  // so pressing a fresh gelişme still hands the reader the story it grew
  // out of instead of stranding them on one paragraph with no way to the
  // rest of it.
  let siblings = [];
  if (n.series_id) {
    try { siblings = await fetchSeriesSiblings(n.series_id, n.id); }
    catch (err) { console.error('[proje haber seri]', err); }
  }
  if (!el.isConnected) return;
  // The story's own question -- every curated story carries one (the
  // admin's curation panel refuses to add a story to an edition without
  // one), fetched with the story rather than when the page opens, so the
  // throw is armed from the page's first frame.
  const poll = await newsPollFor(n.id);
  if (!el.isConnected) return;
  fbSetPage(el, {
    kicker: label, meta: newsAge(n.updated_at),
    title: newsText(n, 'title'),
    html: fbParas(newsText(n, 'body')) + (siblings.length ? seriesTimelineHTML(siblings) : '') +
      (poll ? '<div class="fb-throw-q">' + esc(poll.question) + '</div>' +
              throwFootHTML(poll.option_b, poll.option_a, 'Sola ya da sağa at.') : ''),
    wire: poll ? (inner) => wirePageThrow(inner, {
      // Right is the FIRST option and left the second, the same reading
      // Kütüphane's own news deck gave the gesture in the parts bin.
      right: { label: poll.option_a, run: () => voteNewsPoll(poll, 1).then(() => {
        newsMarkDealt(n).then(refreshHaberlerColumn);
      }) },
      left:  { label: poll.option_b, run: () => voteNewsPoll(poll, 2).then(() => {
        newsMarkDealt(n).then(refreshHaberlerColumn);
      }) },
    }) : undefined,
    // What we hand the reader is not news, it is a POLL -- so the story is
    // dealt with (and the next one in its stack stands up) at the THROW,
    // not at the open, the same rule Kütüphane's own news deck always
    // followed ("a story leaves the deck by being swiped, not by being
    // opened"). A story with no poll at all (a malformed or pre-edition
    // row) has nothing to wait on, so it still deals on open -- a box
    // that could never be dismissed would be worse than a lenient one.
    onOpen: poll ? undefined : () => {
      fbSetDone(el, true);
      newsMarkDealt(n).then(refreshDayMeter);
    },
  });
}

// ── A story's own question (breaking_news_polls) ──
// The NEWEST poll on this story the reader has not already answered, or
// null -- a story with nothing left to ask opens and reads exactly as it
// did before, which is most of them. Best-effort in both directions: a
// table that is missing, a policy that refuses, or a network that never
// answers all leave the story readable and unthrowable rather than
// taking the column down.
async function newsPollFor(newsId) {
  try {
    const sb = IstRouter.sb;
    const { data: polls, error } = await sb.from('breaking_news_polls')
      .select('id, question, option_a, option_b')
      .eq('news_id', newsId)
      .order('created_at', { ascending: false })
      .limit(5);
    if (error) throw error;
    if (!polls || !polls.length) return null;
    const uid = await doneUid();
    if (!uid) return null;
    const { data: votes, error: vErr } = await sb.from('breaking_news_poll_option_votes')
      .select('poll_id').eq('user_id', uid).in('poll_id', polls.map(p => p.id));
    if (vErr) throw vErr;
    const answered = new Set((votes || []).map(v => v.poll_id));
    return polls.find(p => !answered.has(p.id)) || null;
  } catch (err) {
    console.error('[proje haber anket]', err);
    return null;
  }
}

// `option` is 1 or 2, which is what the column stores. Insert-only by
// policy: an answer is what you thought when you were asked, so there is
// nothing here that edits one.
async function voteNewsPoll(poll, option) {
  try {
    const uid = await doneUid();
    if (!uid) return;
    const { error } = await IstRouter.sb.from('breaking_news_poll_option_votes')
      .insert([{ poll_id: poll.id, user_id: uid, option }]);
    if (error) throw error;
  } catch (err) { console.error('[proje haber oy]', err); }
}

// A seri's earlier posts, newest first -- the same pool and the same cap
// (`db/breaking_news_series.sql`) the Türkiye stop's own pinned box reads,
// just keyed per series instead of per pinned slot, and shared by every
// box that opens onto the same seri so two boxes never fetch it twice.
const seriesSiblingsCache = new Map();
function fetchSeriesSiblings(seriesId, selfId) {
  if (!seriesSiblingsCache.has(seriesId)) {
    seriesSiblingsCache.set(seriesId, (async () => {
      const { data, error } = await IstRouter.sb.from('breaking_news')
        .select('id, title, body, title_en, body_en, series_id, updated_at')
        .eq('series_id', seriesId)
        .is('archived_at', null)
        .order('updated_at', { ascending: false })
        .limit(9);
      if (error) throw error;
      return data || [];
    })());
  }
  return seriesSiblingsCache.get(seriesId).then(rows => rows.filter(r => r.id !== selfId));
}

// The seri's earlier posts, printed under the fresh one exactly the way
// the Dünya box's own timeline reads (newest of the rest first) -- one
// heading borrowed from the same "Zaman Akışı" label kutuphane.html's
// sidebar carries, so the two objects read as one convention.
function seriesTimelineHTML(items) {
  return '<div class="fb-page-divider">Zaman Akışı</div>' +
    items.map(it =>
      '<div class="fb-dunya-moment">' +
        '<div class="fb-dunya-moment-date">' + esc(newsAge(it.updated_at)) + '</div>' +
        '<div class="fb-dunya-moment-title">' + esc(newsText(it, 'title')) + '</div>' +
        (newsText(it, 'body') ? '<p>' + esc(newsText(it, 'body')) + '</p>' : '') +
      '</div>').join('');
}

// A story is entered in both languages (db/breaking_news_v2_bilingual.sql);
// the English half is used only where the reader is in English and it was
// actually written, so a half-translated story still reads in Turkish.
function newsText(row, field) {
  if (!row) return '';
  const en = row[field + '_en'];
  if (window.I18N && I18N.isEnglish() && en && String(en).trim()) return en;
  return row[field];
}

// The hook's own language choice -- same rule as newsText, kept separate
// because a hook can exist where the real headline hasn't been written yet
// (or vice versa on an older, pre-edition row), so the two must not share
// one fallback chain.
function hookText(row) {
  if (!row) return '';
  const en = row.hook_en;
  if (window.I18N && I18N.isEnglish() && en && String(en).trim()) return en;
  return row.hook_tr || '';
}

function newsAge(iso) {
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return mins + ' dk önce';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' saat önce';
  return Math.round(hrs / 24) + ' gün önce';
}

// ── Türkiye stop, left column: three ADMIN-PINNED series, not a feed ──
// Hikâyeler (the country_stories grouping) has no content pipeline yet
// and stays out of scope for now (see CLAUDE.md's "parts bin"). In its
// place, three slots the admin fills from the Haberler tab: any
// `breaking_news_series` can claim one of them
// (db/breaking_news_series_v2_world_slot.sql), and the box shows that
// series' own `breaking_news` rows as a timeline, newest first -- so
// what stands here is whichever developing story the admin currently
// wants an İstanbulite walking past to see, not three names baked into
// this file.
let dunyaPromise = null;
async function loadDunyaActor(el, slot) {
  if (!dunyaPromise) {
    dunyaPromise = (async () => {
      try {
        const { data: seriesRows, error: seriesErr } = await IstRouter.sb
          .from('breaking_news_series')
          .select('id, name, pinned_slot')
          .not('pinned_slot', 'is', null);
        if (seriesErr) throw seriesErr;
        // Indexed by (pinned_slot - 1) so slot 1 is the array's own top
        // entry -- the same top-to-bottom reading HABER_BUCKETS uses.
        const slots = [null, null, null];
        for (const s of (seriesRows || [])) {
          if (s.pinned_slot >= 1 && s.pinned_slot <= 3) slots[s.pinned_slot - 1] = s;
        }
        const ids = slots.filter(Boolean).map(s => s.id);
        const byId = {};
        if (ids.length) {
          const { data, error } = await IstRouter.sb.from('breaking_news')
            .select('id, title, body, title_en, body_en, series_id, updated_at')
            .in('series_id', ids)
            .is('archived_at', null)
            .order('updated_at', { ascending: false });
          if (error) throw error;
          for (const n of (data || [])) (byId[n.series_id] || (byId[n.series_id] = [])).push(n);
        }
        return { slots, byId, failed: false };
      } catch (err) {
        console.error('[proje dünya]', err);
        return { slots: [null, null, null], byId: {}, failed: true };
      }
    })();
  }
  const { slots, byId, failed } = await dunyaPromise;
  if (!el.isConnected) return;
  // Cleared before every render, filled only on the path that actually
  // has something to open: a box with no payload is not pressable.
  fbSetPage(el, null);
  // A pinned seri is a running timeline rather than one thing to finish,
  // so it has no done state -- the same reasoning as Etkinlikler.
  fbSetDone(el, false);
  if (failed) {
    el.classList.toggle('fb-empty', slot !== 2);
    el.innerHTML = slot === 2
      ? '<div class="k">DÜNYA</div><div class="t">Yüklenemedi</div>' : '';
    return;
  }
  const series = slots[2 - slot];
  // No series pinned to this slot at all -- a reserved box, same
  // convention as Kahve/Yorumlar, naming what it is rather than what
  // fills it.
  if (!series) { placeholderBox(el, 'Dünya'); return; }
  const label = series.name.toLocaleUpperCase('tr-TR');
  const items = byId[series.id] || [];
  if (!items.length) {
    el.classList.add('fb-empty');
    el.innerHTML = '<div class="k">' + esc(label) + '</div>';
    return;
  }
  el.classList.remove('fb-empty');
  const latest = items[0];
  el.innerHTML = '<div class="k">' + esc(label) + '</div>' +
    '<div class="m">' + esc(newsAge(latest.updated_at)) + '</div>' +
    '<div class="t">' + esc(newsText(latest, 'title')) + '</div>';
  // The page is the series' own timeline, newest development first --
  // the last several posts rather than just the one the box had room for.
  fbSetPage(el, {
    kicker: label, meta: newsAge(latest.updated_at), title: newsText(latest, 'title'),
    html: items.slice(0, 8).map(n =>
      '<div class="fb-dunya-moment">' +
        '<div class="fb-dunya-moment-date">' + esc(newsAge(n.updated_at)) + '</div>' +
        '<div class="fb-dunya-moment-title">' + esc(newsText(n, 'title')) + '</div>' +
        (newsText(n, 'body') ? '<p>' + esc(newsText(n, 'body')) + '</p>' : '') +
      '</div>').join(''),
  });
}

// ── And the olaylar board's own door -- parked, not deleted ──
// The right column stood as the top ongoing olaylar, one to a box
// (`sort_order`, see CLAUDE.md); it is parked for now in favour of the
// left column's admin-pinned series (see loadDunyaActor above), the
// same way Kahvehane's comments are parked behind COMMENTS_ENABLED.
// Flipping this back on is the whole of bringing it back.
const OLAYLAR_COLUMN_ENABLED = false;
// The top ongoing olaylar, one to a box -- the same list the board
// itself orders by (`sort_order`, see CLAUDE.md), just truncated to
// the three slots this column has.
const loadOlaylarActor = stackFetch(async () => {
  try {
    // `name_tr`, not `title` -- an olay is named, not headlined
    // (db/world_events.sql). Asking for a column that does not exist is
    // an error PostgREST answers the whole query with, so this column
    // printed "Yüklenemedi" on a database that was perfectly healthy.
    const { data, error } = await IstRouter.sb.from('world_events')
      .select('id, name_tr, blurb, parties, status, started_on, ended_on, body')
      .eq('status', 'ongoing')
      .order('sort_order', { ascending: true })
      .limit(3);
    if (error) throw error;
    const rows = (data || []).map(r => ({
      html: '<div class="k">OLAY</div><div class="t">' + esc(r.name_tr) + '</div>',
      page: {
        kicker: 'OLAY', title: r.name_tr,
        lines: [r.parties, worldEventWhen(r)].filter(Boolean),
        body: [r.blurb, r.body].filter(Boolean).join('\n\n'),
      },
    }));
    return { rows, failed: false,
      emptyHtml: '<div class="k">Olaylar</div><div class="t">Sürmüyor</div>' +
                 '<div class="m">Şu an süren bir olay yok.</div>' };
  } catch (err) {
    console.error('[proje olaylar]', err);
    return { rows: [], failed: true,
      failedHtml: '<div class="k">Olaylar</div><div class="t">Yüklenemedi</div>' +
                  '<div class="m">Bağlantını kontrol et.</div>' };
  }
});

// Whether it is still going -- the one fact an olay carries that a news
// item does not (db/world_events.sql). "2014 — sürüyor", "2003–2011".
function worldEventWhen(r) {
  const y = (d) => (d ? String(d).slice(0, 4) : '');
  const from = y(r.started_on);
  if (r.status === 'ongoing') return from ? from + ' — sürüyor' : 'Sürüyor';
  const to = y(r.ended_on);
  return [from, to].filter(Boolean).join('–');
}

// ── ANKET — district polls, the box that used to be the "Bilgi"
// placeholder (db/neighborhood_polls.sql) ──
// A member answers once, filed under their own district. What makes this
// different from a plain city-wide poll is what the answer is FOR: the
// per-district split under the result is exactly the data a future
// district-colored map would read to pick each district's color, mixing
// the poll's own color_a/color_b by that district's own a/b split. There
// is no such map drawn yet -- project.html's İstanbul at slide 12 is
// still a flat painted frame, not a traced one a fill can be set on (see
// "The zoom is DRAWN, not computed" in CLAUDE.md) -- so for now the same
// numbers print as a list, each row already wearing the color a map
// would paint it.
// Unlike breaking_news (bare `title`/`body`, with `_en` for the English
// half), neighborhood_polls spells its Turkish columns with their own
// `_tr` suffix (`question_tr`, `option_a_tr`, ...) -- so `base` here is
// the field's common stem, not a column name on its own.
function anketText(poll, base) {
  if (!poll) return '';
  const en = poll[base + '_en'];
  if (window.I18N && I18N.isEnglish() && en && String(en).trim()) return en;
  return poll[base + '_tr'];
}

function anketHexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

// The same linear mix a choropleth would paint a district with, by that
// district's own fraction choosing option A.
function anketMixColor(colorA, colorB, fracA) {
  const pa = anketHexToRgb(colorA), pb = anketHexToRgb(colorB);
  if (!pa || !pb) return colorA || '#b93631';
  const mix = (a, b) => Math.round(a * fracA + b * (1 - fracA));
  return 'rgb(' + mix(pa.r, pb.r) + ',' + mix(pa.g, pb.g) + ',' + mix(pa.b, pb.b) + ')';
}

// One fetch, shared by the three boxes and by the day meter -- and it
// carries the reader's own votes, because "answered" is what makes an
// anket box done and the meter must count the same set the column shows.
let anketPromise = null;
function anketData() {
  if (!anketPromise) {
    anketPromise = (async () => {
      try {
        const { data, error } = await IstRouter.sb.from('neighborhood_polls')
          .select('id, question_tr, question_en, option_a_tr, option_a_en, option_b_tr, option_b_en, color_a, color_b')
          .eq('active', true)
          .order('created_at', { ascending: false })
          .limit(3);
        if (error) throw error;
        const polls = data || [];
        const voted = new Set();
        const uid = await doneUid();
        if (uid && polls.length) {
          // Best-effort: a vote lookup that fails leaves the boxes loud
          // rather than taking the column down. RLS only ever hands back
          // the caller's own rows (db/neighborhood_polls.sql).
          try {
            const { data: votes, error: vErr } = await IstRouter.sb
              .from('neighborhood_poll_votes')
              .select('poll_id').eq('user_id', uid)
              .in('poll_id', polls.map(p => p.id));
            if (vErr) throw vErr;
            (votes || []).forEach(v => voted.add(v.poll_id));
          } catch (err) { console.error('[proje anket oy]', err); }
        }
        return { polls, voted, failed: false };
      } catch (err) {
        console.error('[proje anket]', err);
        return { polls: [], voted: new Set(), failed: true };
      }
    })();
  }
  return anketPromise;
}

// Voting is exactly what changes this column, so it is re-read the
// moment a vote lands rather than at the next mount -- the same rule
// refreshOyunColumn follows for a game just played. Anket is a night box
// alone now (loadAnketSonucActor, further down), so that is the one this
// resets; there is no day-time vote box left to reset beside it.
function refreshAnketColumn() {
  anketPromise = null;
  if (loadAnketSonucActor && loadAnketSonucActor.reset) loadAnketSonucActor.reset();
  (cast || []).forEach(a => {
    if (!/\bfb-anket\b/.test(a.def.cls) || !a.def.load) return;
    try { a.def.load(a.el); } catch (err) { console.error(err); }
  });
  refreshDayMeter();
}

// The page's body is filled in by `wire`, once its markup is actually in
// the document (see openFbPage) -- voting has to happen after a fetch and
// re-render the buttons into a result, which a static render can't do.
function anketPagePayload(poll) {
  return {
    kicker: 'ANKET', title: anketText(poll, 'question'),
    html: '<div id="anket-body-' + poll.id + '" class="anket-body">Yükleniyor…</div>',
    wire: (inner) => wireAnketPage(inner, poll),
  };
}

async function wireAnketPage(inner, poll) {
  const body = inner.querySelector('#anket-body-' + poll.id);
  if (!body) return;
  const sb = IstRouter.sb;
  let uid = null;
  try { uid = (await sb.auth.getUser()).data.user.id; } catch (err) {}
  let already = null;
  if (uid) {
    try {
      const { data } = await sb.from('neighborhood_poll_votes')
        .select('choice').eq('poll_id', poll.id).eq('user_id', uid).maybeSingle();
      already = data ? data.choice : null;
    } catch (err) { console.error('[anket]', err); }
  }
  if (!body.isConnected) return;
  if (already) { renderAnketResults(body, poll, already); return; }
  renderAnketButtons(body, poll, uid);
}

function renderAnketButtons(body, poll, uid) {
  body.innerHTML =
    '<div class="anket-opts">' +
      '<button type="button" class="anket-opt" data-choice="a">' +
        '<span class="anket-opt-swatch" style="background:' + esc(poll.color_a) + ';"></span>' +
        esc(anketText(poll, 'option_a')) +
      '</button>' +
      '<button type="button" class="anket-opt" data-choice="b">' +
        '<span class="anket-opt-swatch" style="background:' + esc(poll.color_b) + ';"></span>' +
        esc(anketText(poll, 'option_b')) +
      '</button>' +
    '</div>' +
    '<div class="anket-note">Oyun kendi mahallenin altına yazılır.</div>';
  body.querySelectorAll('.anket-opt').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!uid) return;
      const choice = btn.dataset.choice;
      body.innerHTML = '<div class="anket-note">Kaydediliyor…</div>';
      let neighborhood = null;
      try {
        const { data } = await IstRouter.sb.from('profiles')
          .select('neighborhood').eq('id', uid).maybeSingle();
        neighborhood = data ? data.neighborhood : null;
      } catch (err) { console.error('[anket]', err); }
      if (!neighborhood) {
        body.innerHTML = '<div class="anket-note">Oy kaydedilemedi. Bağlantını kontrol et.</div>';
        return;
      }
      const { error } = await IstRouter.sb.from('neighborhood_poll_votes')
        .insert([{ poll_id: poll.id, user_id: uid, neighborhood, choice }]);
      if (error) {
        console.error('[anket]', error);
        body.innerHTML = '<div class="anket-note">Oy kaydedilemedi.</div>';
        return;
      }
      renderAnketResults(body, poll, choice);
      // The box behind this page has just become one the reader is done
      // with, and the day is one step shorter.
      refreshAnketColumn();
    });
  });
}

// The per-district breakdown is the point of this poll: neighborhood_poll_
// results() hands back every district (even one with no votes yet), and
// each row's swatch is already mixed the way a future map would paint it.
async function renderAnketResults(body, poll, myChoice) {
  body.innerHTML = '<div class="anket-note">Yükleniyor…</div>';
  let rows = [];
  try {
    const { data, error } = await IstRouter.sb.rpc('neighborhood_poll_results', { p_poll_id: poll.id });
    if (error) throw error;
    rows = data || [];
  } catch (err) { console.error('[anket]', err); }
  if (!body.isConnected) return;
  const totalA = rows.reduce((s, r) => s + (r.a_count || 0), 0);
  const totalB = rows.reduce((s, r) => s + (r.b_count || 0), 0);
  const total = totalA + totalB;
  const pctA = total ? Math.round((totalA / total) * 100) : 50;
  const districtsHtml = rows
    .map(r => ({
      name: NB_NAMES[r.neighborhood] || r.neighborhood,
      total: (r.a_count || 0) + (r.b_count || 0), a: r.a_count || 0,
    }))
    .sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, 'tr'))
    .map(d => {
      if (!d.total) {
        return '<div class="anket-district-row">' +
          '<span class="anket-district-swatch none"></span>' +
          '<span class="anket-district-name">' + esc(d.name) + '</span>' +
          '<span class="anket-district-none">Oy yok</span></div>';
      }
      const dPct = Math.round((d.a / d.total) * 100);
      const color = anketMixColor(poll.color_a, poll.color_b, dPct / 100);
      return '<div class="anket-district-row">' +
        '<span class="anket-district-swatch" style="background:' + color + ';"></span>' +
        '<span class="anket-district-name">' + esc(d.name) + '</span>' +
        '<span class="anket-district-bar">' +
          '<span style="width:' + dPct + '%;background:' + esc(poll.color_a) + ';"></span>' +
          '<span style="width:' + (100 - dPct) + '%;background:' + esc(poll.color_b) + ';"></span>' +
        '</span>' +
        '<span class="anket-district-pct">%' + dPct + '</span>' +
      '</div>';
    }).join('');
  body.innerHTML =
    '<div class="anket-note">' +
      (myChoice === 'a' ? esc(anketText(poll, 'option_a')) : esc(anketText(poll, 'option_b'))) +
      ' dedin' + (total ? ' · ' + total + ' oy' : '') + '</div>' +
    '<div class="anket-result-bar">' +
      '<span style="width:' + pctA + '%;background:' + esc(poll.color_a) + ';"></span>' +
      '<span style="width:' + (100 - pctA) + '%;background:' + esc(poll.color_b) + ';"></span>' +
    '</div>' +
    '<div class="anket-result-row"><span>' + esc(anketText(poll, 'option_a')) + ' · %' + pctA + '</span>' +
      '<span>%' + (100 - pctA) + ' · ' + esc(anketText(poll, 'option_b')) + '</span></div>' +
    '<div class="anket-district-title">İlçelere göre</div>' +
    '<div class="anket-districts">' + districtsHtml + '</div>';
}

// ══════════════════════════════════════════════════════════════
// THE NIGHT EDITION — the polls come out
//
// After sunset Kütüphane's narrow column stops collecting votes and
// prints the day's ANSWERS instead: one box per open poll, each printing
// the city's own split, opening onto the 25 districts each wearing the
// colour its own split mixes to. The wide column stays the news, exactly
// as it is by day -- a reader mid-story at sunset must never have it
// swapped out from under them for a poll result.
//
// Voting and reading the result are the same page now (anketPagePayload
// / wireAnketPage decides which of the two a reader is shown), so there
// is no day-time vote box left to keep in step -- anketData() is asked
// once, here, and this box is the whole of Anket's presence on screen.
const loadAnketSonucActor = stackFetch(async () => {
  const { polls, voted, failed } = await anketData();
  if (failed) {
    return { rows: [], failed: true,
      failedHtml: '<div class="k">ANKET</div><div class="t">Yüklenemedi</div>' +
                  '<div class="m">Bağlantını kontrol et.</div>' };
  }
  // The kicker and the meta share ONE line, ranged to its two ends -- the
  // same row İSTANBUL / "0 dk önce" sits on by day. So both have to stay
  // about that long: "AKŞAM · ANKET" against "Önce sen ne diyorsun?"
  // overran the box and the two printed on top of each other. The edition
  // needs no naming here anyway -- it is night, the whole app is dark,
  // and the box says ANKET where a story would say its category.
  const rows = polls.map(poll => ({
    html: '<div class="k">ANKET</div>' +
      '<div class="t">' + esc(anketText(poll, 'question')) + '</div>' +
      '<div class="m">' + (voted.has(poll.id) ? 'İlçelere göre' : 'Oy ver') + '</div>',
    // The same page the day's own Anket box opens. A reader who never
    // voted is asked first and sees the result the moment they do --
    // wireAnketPage already decides which of the two it is, so the night
    // needs no second version of that question.
    page: anketPagePayload(poll),
    done: voted.has(poll.id),
  }));
  return { rows, failed: false,
    emptyHtml: '<div class="k">ANKET</div><div class="t">Bu gece sonuç yok</div>' +
               '<div class="m">Gündüz anket açılmamış.</div>' };
});

// ══════════════════════════════════════════════════════════════
// KAHVEHANE'S NARROW COLUMN BY DAY — the city writes tonight's games
//
// The same three boxes, in the same order, doing the opposite thing. By
// night they ARE the games; by day they collect what the games will be
// made of, and the admin chooses between what came in. It is the
// edition's own rule (ask from sunrise, answer from sunset) applied to
// the one column that is not reading at all — so the member who comes
// only for the games still puts something into the day rather than
// finding a locked door until sunset.
//
//   Sözcel   a word for tonight        -> sozcel_word_suggestions
//   Tümcel   a quote for tonight       -> tumcel_quote_suggestions
//
// Both tables are admin-curated by construction: nothing a member writes
// here reaches another member except by the admin picking it. Bulmaca is
// not a slot in this column — it stays generated and admin-managed
// elsewhere, so there is nothing for a member to offer it.
const SUBMIT_DEFS = [
  { key: 'sozcel', kicker: '1. OYUN', title: 'Sözcel', logo: 'assets/sozcel-logo.png', ask: 'Bu geceye bir kelime öner' },
  { key: 'tumcel', kicker: '2. OYUN', title: 'Tümcel', ask: 'Bu geceye bir alıntı öner' },
];

// One title, two loaders (loadOyunActor at night, loadSubmitActor by
// day) -- a game with its own mark (see .fb-oyun .logo) shows it either
// time, so the box names the same game the same way whichever question
// it happens to be asking.
function oyunTitleHtml(g) {
  return g.logo
    ? '<div class="logo"><img src="' + g.logo + '" alt="' + g.title + '" width="512" height="512" decoding="async"></div>'
    : '<div class="t">' + g.title + '</div>';
}

// The night these offers are FOR. By day editionKey() is simply today,
// which is the night that begins this evening — the one key both halves
// of it will share once it starts (see ist-date.js).
function tonightKey() {
  try {
    if (window.IstDate && IstDate.gameNight) return IstDate.gameNight();
  } catch (err) { console.error('[proje gece]', err); }
  return IstDate.iso();
}

// ── What Sözcel actually wants: 2 or 3 SYLLABLES ──
// The board is a syllable staircase, not a row of five tiles — the game
// adopts whatever length the recorded word has (WORD_LENGTH =
// TARGET_WORD.length in sozcel.html) — so asking a member for "5 harfli
// bir kelime" was asking for the wrong thing entirely: a letter count is
// a fact about the auto-pick's own pool, not about the game. What the
// staircase can actually draw is two or three syllables.
//
// In Turkish a syllable has exactly one vowel, so counting vowels IS
// counting syllables — which is also what syllabifyTr() in sozcel.html
// produces, one chunk per vowel. Written here as the count rather than
