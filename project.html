  <style data-page="project">
    html, body {
      margin: 0; padding: 0;
      background: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #main-site { display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr; min-height: 100dvh; }
    .section-rule { grid-column: 1 / -1; grid-row: 1; display: flex; justify-content: center; align-items: center; }
    main { grid-column: 1; grid-row: 1; position: relative; overflow: hidden; }

    /* ── The flip book itself ──
       Twelve frames stacked in one box, all decoded, one visible at a
       time. Showing a frame is a change of OPACITY and nothing else --
       never a src swap, which blanks an <img> until the new bytes
       decode and would land in the middle of the drag. */
    .fb {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--paper);
      touch-action: none;          /* the page must not scroll under the finger */
      user-select: none;
      -webkit-user-select: none;
    }
    .fb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: var(--fb-fit, cover);
      opacity: 0;
      /* No transition. A flip book flips: interpolating two drawings
         makes a third nobody drew. */
      transition: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .fb img.on { opacity: 1; }

    /* ── The cast ──
       The things that live on slide 1 and slide 12. They do not appear
       and disappear: every slide gives each of them a place, and they
       travel between those places with the finger. Only transforms and
       opacity move, so a slide costs a composite and nothing else. */
    .fb-cast {
      position: absolute;
      inset: 0;
      pointer-events: none;   /* the layer never takes a press */
      z-index: 1;
    }
    .fb-actor {
      position: absolute;
      will-change: transform, opacity;
      /* Off at every slide except the two ends -- see armCast(). An
         actor mid-flight is a picture of a button, not a button. */
      pointer-events: none;
    }
    .fb-actor.live { pointer-events: auto; }

    /* ── Events, bottom-left, belonging to slide 12 ── */
    .fb-events {
      left: var(--screen-inset, 18px);
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px) + 16px);
      width: 62%;
      background: var(--paper-card, #ddc4b5);
      border: 2px solid var(--ink);
      padding: 9px 11px 10px;
      text-align: left;
      font: inherit;
      color: var(--ink);
      display: block;
      -webkit-tap-highlight-color: transparent;
    }
    .fb-events .k {
      font-size: 0.56rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 3px;
    }
    .fb-events .t { font-size: 0.95rem; font-weight: 700; line-height: 1.15; }
    .fb-events .m { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
    /* Opened in place. The card is docked bottom-left and poses are a
       percentage of its OWN size, so growing upward moves nothing else. */
    .fb-events .x { display: none; }
    .fb-events .x p { margin: 6px 0 0; font-size: 0.72rem; line-height: 1.35; }
    .fb-events.open .x { display: block; }
    .fb-actor.live.fb-events:active { transform-origin: 0% 100%; }

    /* Read-out, so what the thumb is doing is measurable by eye. */
    .fb-hud {
      position: fixed;
      left: 0; right: 0;
      top: calc(env(safe-area-inset-top) + var(--navbar-h-top, 56px) + 10px);
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
      z-index: 2;
      font-variant-numeric: tabular-nums;
    }
    .fb-hud b { color: var(--ink); }
    .fb-hint {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px) + 14px);
      text-align: center;
      font-size: 0.74rem;
      color: var(--muted);
      pointer-events: none;
      z-index: 2;
    }
    /* ── The phone's bottom tab bar ──
       Same object as every other page's: the <header> comes out of the
       grid and is pinned to the viewport's bottom edge, so the two
       fixed bars stand in exactly the same place on this tab as on the
       others (see "The phone's two bars" in CLAUDE.md). */
    @media (max-width: 768px) {
      .section-rule {
        position: absolute; top: 0; left: 0;
        width: 0; height: 0; padding: 0; overflow: visible;
      }
      header {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom));
        padding: 0 0 env(safe-area-inset-bottom);
        margin: 0;
        border-top: 1px solid var(--rule);
        border-bottom: none;
        background: var(--paper-navbar);
        z-index: 100;
        display: flex;
        align-items: stretch;
      }
      nav {
        display: flex; width: 100%; height: 100%;
        gap: 0; padding: 0 18px; flex-wrap: nowrap; justify-content: stretch;
      }
      nav a {
        flex: 1;
        display: flex; align-items: flex-end; justify-content: center;
        padding-bottom: 6px;
        font-size: 16px; font-weight: 600; letter-spacing: 0.5px;
        text-transform: uppercase; color: var(--muted);
        border: none; text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }
      nav a.active { color: var(--ink); font-weight: 700; }
      nav a:first-child { justify-content: flex-start; }
      nav a:last-child { justify-content: flex-end; margin-right: -0.5px; }
    }

    /* Sits over the first frame once it is up, so what the reader sees
       while the rest arrive is the book's first page and a count --
       never a spinner on blank paper. */
    .fb-loading {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px) + 44px);
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      z-index: 3;
    }

<script>
// ══════════════════════════════════════════════════════════════
// PROJE — the flip book, on its own, with nothing else in the way
//
// A rig rather than a feature. Twelve numbered frames, scrubbed by the
// finger, and the only two places it can come to rest are the first and
// the last. Let go anywhere in between and it runs to whichever end is
// nearer -- there is no stopping in the middle and nothing to press
// there, which is the whole reason a journey like this costs nothing.
//
// Deliberately self-contained: no map, no data, no page swap, no shared
// transition machinery. If it is not smooth here it is not the app's
// fault, and if it is smooth here then everything that made it rough
// elsewhere is something else.
// ══════════════════════════════════════════════════════════════
const FRAMES = 12;

// ── What each frame shows ──
// The two ends are the real maps; everything between is still the
// numbered test slide. Swap a number for a path here and that frame
// becomes a picture -- there is nothing else to change.
const OVERRIDE = {
  0:  'assets/map/kutuphane-map-mobile.png',     // 1080 x 2420 -- the odd one
  1:  'assets/map/istanbul-map-mobile02.png',    // 1080 x 1920
  2:  'assets/map/istanbul-map-mobile03.png',    // 1080 x 1920
  3:  'assets/map/istanbul-map-mobile04.png',    // 1080 x 1920
  4:  'assets/map/istanbul-map-mobile05.png',    // 1080 x 1920
  5:  'assets/map/istanbul-map-mobile06.png',    // 1080 x 1920
  // 6 -> slide 7, not drawn yet: still the numbered placeholder
  7:  'assets/map/istanbul-map-mobile08.png',    // 1080 x 1920
  8:  'assets/map/istanbul-map-mobile09.png',    // 1080 x 1920
  9:  'assets/map/istanbul-map-mobile10.png',    // 1080 x 1920
  10: 'assets/map/istanbul-map-mobile11.png',    // 1080 x 1920
  11: 'assets/map/istanbul-map-mobile.png',      // 1080 x 1920
};
const SRC = i => OVERRIDE[i] || ('assets/project/' + String(i + 1).padStart(2, '0') + '.png');

// How a frame is laid into the screen. `cover` fills it and crops what
// does not fit; `contain` shows the whole picture and leaves paper
// around it. Every frame is treated the same way, whatever its own
// shape, so the book stays registered with itself.
//
// Everything here is 9:16 (1080x1920) except the Türkiye end, which is
// 1080x2420 -- taller, so cover trims a little off its top and bottom
// where every other frame loses 9% off each side instead. That is the
// one frame not yet registered with the rest of the book.
const FIT = 'cover';

// How far the thumb travels to cross the whole book. A fraction of the
// screen rather than a pixel count, so it feels the same on every phone.
const TRAVEL = 0.55;
// Where a release decides which end it is running to.
const TIP = 0.5;
// How fast it runs out once let go, in frames per second.
const RUN_FPS = 34;

// ══════════════════════════════════════════════════════════════
// THE CAST
//
// The things that live on slide 1 and slide 12 -- buttons, panels, the
// page's own furniture. Two rules make them work:
//
//   1. They are only ALIVE at the two ends. In between they are a
//      picture of themselves: they take no presses, because there is
//      no landing in the middle of a flip book.
//   2. They never appear or disappear. Every slide gives each of them a
//      place, and they travel between those places with the finger.
//
// A pose is `{ x, y, scale, opacity, rot }` where x and y are PERCENT
// OF THE ACTOR'S OWN SIZE -- the same units a CSS translate uses. That
// makes "parked off the left edge" simply x: -160, whatever the screen
// is, and `{}` means "exactly where its CSS puts it".
//
// The table is sparse: write the slides that matter and the rest is
// interpolated. Before the first pose you give and after the last, it
// holds.
// ══════════════════════════════════════════════════════════════
const CAST = [
  {
    id: 'events',
    live: 11,                       // the slide it belongs to (0-based)
    cls: 'fb-events',
    // How much it trails the finger. 0 is locked to it; higher is
    // heavier. Per-actor on purpose: different weights are what make a
    // screenful of things read as having depth rather than being one
    // sheet. See CAST_LAG below for what the number means.
    lag: 0.16,
    // Real rows from `events`, the same query and the same card the
    // Kahvehane deck is built from. Its own fetch rather than a shared
    // one: this tab is a rig and must not depend on another page having
    // run first.
    html: '<div class="k">Etkinlikler</div><div class="t">…</div>',
    load: loadEventsActor,
    onpress(e) {
      // Interactable, and only here -- the card opens in place rather
      // than going anywhere, since this tab has nowhere to go.
      e.currentTarget.classList.toggle('open');
    },
    // Slides in from the left over the second half of the book, and is
    // home by the last slide.
    poses: {
      0:  { x: -160, opacity: 1 },
      6:  { x: -160, opacity: 1 },
      8:  { x: -95 },
      10: { x: -22 },
      11: { x: 0 },
    },
  },
];

// ── The lag ──
// The drawings stay locked to the finger -- they are the flip book, and
// a page that arrives late is just a slow page. The CAST trails instead:
// each actor eases toward wherever the book currently is, so the
// furniture has a little weight and settles a beat after the paper.
//
// The number is the fraction of the remaining distance covered per 60Hz
// frame -- 0.16 catches up ~63% in 6 frames, which reads as weight
// rather than as lag. It is applied per elapsed time, not per frame, so
// it feels identical on a 120Hz screen.
const CAST_LAG = 0.16;
let castTarget = 0;
let castTick = null;
let castLast = 0;

let cast = [];
let imgs = [];
let at = 0;             // 0..FRAMES-1, where the book is resting
let shown = -1;
let anim = null;

// Looked up in mount(), never at the top level. router.js runs a page's
// script at idle, before the reader ever asks for it -- which happens
// while a DIFFERENT page's DOM is on screen, so a top-level
// getElementById here finds nothing and throws, and a script that
// throws half way has already declared its consts and cannot be run
// again. Everything that touches the DOM waits for mount().
let box = null;
let hud = null;

function paintHud(p) {
  if (!hud) return;
  const i = Math.round(p);
  hud.innerHTML = '<b>' + (i + 1) + '</b> / ' + FRAMES;
}

// ── The events actor's own content ──
// One fetch, the next few evenings in the city, soonest first -- the
// same rows and the same order Kahvehane's deck uses.
const NB_NAMES = {
  bakirkoy:'Bakırköy', bayrampasa:'Bayrampaşa', bahcelievler:'Bahçelievler', sisli:'Şişli',
  eyupsultan:'Eyüpsultan', gop:'Gaziosmanpaşa', esenler:'Esenler', bagcilar:'Bağcılar',
  basaksehir:'Başakşehir', kucukcekmece:'Küçükçekmece', sultangazi:'Sultangazi',
  uskudar:'Üsküdar', kadikoy:'Kadıköy', maltepe:'Maltepe', umraniye:'Ümraniye',
  cekmekoy:'Çekmeköy', beykoz:'Beykoz', sariyer:'Sarıyer', besiktas:'Beşiktaş',
  beyoglu:'Beyoğlu', gungoren:'Güngören', kagithane:'Kağıthane', atasehir:'Ataşehir',
  zeytinburnu:'Zeytinburnu', fatih:'Fatih',
};
const MON_TR = ['OCA','ŞUB','MAR','NİS','MAY','HAZ','TEM','AĞU','EYL','EKİ','KAS','ARA'];

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// Everything Istanbul-dated goes through one clock (CLAUDE.md rule 10);
// here that is just the timeZone these are formatted in.
function eventWhen(iso) {
  const d = new Date(iso);
  const tz = 'Europe/Istanbul';
  const day = parseInt(d.toLocaleDateString('en-US', { timeZone: tz, day: 'numeric' }), 10);
  const mon = parseInt(d.toLocaleDateString('en-US', { timeZone: tz, month: 'numeric' }), 10);
  const wd = d.toLocaleDateString('tr-TR', { timeZone: tz, weekday: 'short' }).toLocaleUpperCase('tr-TR');
  const time = d.toLocaleTimeString('tr-TR', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false });
  return day + ' ' + (MON_TR[mon - 1] || '') + ' ' + wd + ' · ' + time;
}

async function loadEventsActor(el) {
  let rows = null, failed = false;
  try {
    const { data, error } = await IstRouter.sb.from('events')
      .select('*')
      .gte('event_date', new Date().toISOString())
      .order('event_date', { ascending: true })
      .limit(3);
    if (error) throw error;
    rows = data || [];
  } catch (err) {
    console.error('[proje events]', err);
    failed = true;
  }
  if (!el.isConnected) return;

  // Three states, and they say different things: a city with nothing on,
  // and a fetch that never landed, are not the same fact.
  if (failed) {
    el.innerHTML = '<div class="k">Etkinlikler</div><div class="t">Yüklenemedi</div>' +
                   '<div class="m">Bağlantını kontrol et.</div>';
    return;
  }
  if (!rows.length) {
    el.innerHTML = '<div class="k">Etkinlikler</div><div class="t">Şimdilik yok</div>' +
                   '<div class="m">Bu aralar bir şey yok.</div>';
    return;
  }
  const ev = rows[0];
  const nb = ev.neighborhood ? (NB_NAMES[ev.neighborhood] || ev.neighborhood) : 'İstanbul';
  const more = rows.length - 1;
  el.innerHTML =
    '<div class="k">' + esc(nb.toLocaleUpperCase('tr-TR')) + '</div>' +
    '<div class="t">' + esc(ev.title) + '</div>' +
    '<div class="m">' + esc(eventWhen(ev.event_date)) +
      (more > 0 ? ' · +' + more : '') + '</div>' +
    '<div class="x">' +
      (ev.location ? '<div class="m">' + esc(ev.location) + '</div>' : '') +
      (ev.description ? '<p>' + esc(ev.description) + '</p>' : '') +
    '</div>';
}

// ── Poses ──
const POSE0 = { x: 0, y: 0, scale: 1, opacity: 1, rot: 0 };
const lerp = (a, b, t) => a + (b - a) * t;

// Fill a sparse table so every slide has a pose.
function expandPoses(poses) {
  const out = new Array(FRAMES);
  const given = [];
  for (let i = 0; i < FRAMES; i++) {
    if (poses[i]) { out[i] = Object.assign({}, POSE0, poses[i]); given.push(i); }
  }
  if (!given.length) { out.fill(POSE0); return out; }
  for (let i = 0; i < given[0]; i++) out[i] = out[given[0]];
  for (let i = given[given.length - 1] + 1; i < FRAMES; i++) out[i] = out[given[given.length - 1]];
  for (let g = 0; g < given.length - 1; g++) {
    const a = given[g], b = given[g + 1];
    for (let i = a + 1; i < b; i++) {
      const t = (i - a) / (b - a);
      out[i] = {
        x: lerp(out[a].x, out[b].x, t), y: lerp(out[a].y, out[b].y, t),
        scale: lerp(out[a].scale, out[b].scale, t),
        opacity: lerp(out[a].opacity, out[b].opacity, t),
        rot: lerp(out[a].rot, out[b].rot, t),
      };
    }
  }
  return out;
}

function buildCast() {
  const layer = document.getElementById('fb-cast');
  if (!layer) return;
  stopCastTick();
  layer.innerHTML = '';
  cast = CAST.map(def => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'fb-actor ' + def.cls;
    el.innerHTML = def.html;
    if (def.onpress) el.addEventListener('click', def.onpress);
    layer.appendChild(el);
    // Fetched once per mount, after the element exists, and never
    // awaited by anything: an actor whose rows have not landed yet is
    // still an actor, and the book must not wait on the network.
    if (def.load) { try { def.load(el); } catch (e) { console.error(e); } }
    return { def, el, poses: expandPoses(def.poses || {}), pos: 0,
             lag: def.lag == null ? CAST_LAG : def.lag };
  });
}

function stopCastTick() {
  if (castTick) { cancelAnimationFrame(castTick); castTick = null; }
}

// Where the book is; the actors will get there in their own time.
function aimCast(p, snap) {
  castTarget = Math.max(0, Math.min(FRAMES - 1, p));
  if (snap) {
    stopCastTick();
    for (const a of cast) a.pos = castTarget;
    paintCast();
    return;
  }
  if (!castTick) { castLast = performance.now(); castTick = requestAnimationFrame(castStep); }
}

function castStep(now) {
  const dt = Math.min(64, now - castLast) || 16.7;
  castLast = now;
  let moving = false;
  for (const a of cast) {
    const d = castTarget - a.pos;
    if (Math.abs(d) < 0.0015) { a.pos = castTarget; continue; }
    // Per elapsed time rather than per frame, so 60Hz and 120Hz feel
    // the same rather than the faster screen catching up twice as fast.
    a.pos += d * (1 - Math.pow(1 - a.lag, dt / 16.6667));
    moving = true;
  }
  paintCast();
  // Every frame, not only when the tick stops: an actor that has come
  // near enough to its own slide is pressable, even while the last few
  // pixels are still easing in.
  armCast();
  if (moving) castTick = requestAnimationFrame(castStep);
  else castTick = null;
}

// The actors move continuously between poses while the frame index
// jumps whole numbers: a flip book flips, but type sliding in
// whole-pixel steps shimmers.
function paintCast() {
  for (const a of cast) {
    const p = a.pos;
    const lo = Math.max(0, Math.min(FRAMES - 1, Math.floor(p)));
    const hi = Math.max(0, Math.min(FRAMES - 1, lo + 1));
    const t = p - lo;
    const A = a.poses[lo], B = a.poses[hi];
    const x = lerp(A.x, B.x, t), y = lerp(A.y, B.y, t);
    const sc = lerp(A.scale, B.scale, t), rot = lerp(A.rot, B.rot, t);
    a.el.style.transform = 'translate3d(' + x + '%,' + y + '%,0) scale(' + sc + ')' +
                           (rot ? ' rotate(' + rot + 'deg)' : '');
    a.el.style.opacity = String(lerp(A.opacity, B.opacity, t));
  }
}

// Alive only when the book is actually resting on the slide an actor
// belongs to. Mid-flight, and on the other end, it is a drawing.
// How close an actor has to be to its own slide before it will take a
// press. Not zero: an exponential ease never quite arrives, and waiting
// for the last thousandth left the card unpressable for the better part
// of a second after it had visibly stopped. 0.05 of a slide is about
// six pixels of drift left -- close enough to press, far enough that
// nothing is live while it is still visibly travelling.
const LIVE_EPS = 0.05;

function armCast() {
  const settled = ready && !drag && !anim;
  for (const a of cast) {
    a.el.classList.toggle('live', settled && Math.abs(a.pos - a.def.live) < LIVE_EPS);
  }
}

// Showing a frame is one class swap. Nothing else touches the DOM
// during a drag, which is what keeps the main thread free enough to
// track the finger.
function show(p, snap) {
  // The actors are AIMED at the continuous position and arrive in their
  // own time; the drawings get the rounded one, at once.
  aimCast(Math.max(0, Math.min(FRAMES - 1, p)), snap);
  const i = Math.max(0, Math.min(FRAMES - 1, Math.round(p)));
  if (i === shown) return;
  if (shown >= 0) imgs[shown].classList.remove('on');
  imgs[i].classList.add('on');
  shown = i;
  paintHud(i);
}

// ── Loading ──
// Two rules, and they pull against each other.
//
// Every frame must be decoded before the book can reach it: an <img>
// whose bytes are not ready paints nothing, and a blank page in the
// middle of a flip is worse than a wait at the start. But waiting for
// all twelve before showing anything means staring at the word
// "loading" while ~4 MB of drawings arrive, which is the app looking
// broken at the exact moment it should look like a book.
//
// So the first frame is decoded on its own and put up straight away --
// the page is a map within a moment -- and the rest are fetched in
// parallel but decoded in order behind it. The gesture only arms once
// they are all in, so the book is never asked for a page it does not
// have. What the reader sees meanwhile is the first drawing and a count,
// not a spinner.
let ready = false;

function loadingLine(n) {
  const el = document.getElementById('fb-loading');
  if (!el) return;
  if (n >= FRAMES) { el.remove(); return; }
  el.textContent = n + ' / ' + FRAMES;
}

async function load() {
  if (!box) return;
  ready = false;
  imgs = [];
  for (let i = 0; i < FRAMES; i++) {
    const img = new Image();
    img.decoding = 'async';
    img.alt = '';
    imgs.push(img);
  }
  const decode = (img) => (img.decode ? img.decode().catch(() => {}) : Promise.resolve());

  // The first frame is fetched ALONE. Starting all twelve at once shares
  // the connection twelve ways and the first page arrives no sooner than
  // the last -- measured on a 4 Mbps link, 7.9s for both. Fetching it by
  // itself gets it on screen in a fraction of that, and the rest have
  // the whole rest of the wait to arrive in. `fetchPriority` alone does
  // not do this: it reorders a queue, it does not empty one.
  if ('fetchPriority' in imgs[0]) imgs[0].fetchPriority = 'high';
  imgs[0].src = SRC(0);
  await decode(imgs[0]);
  if (!box.isConnected) return;
  box.appendChild(imgs[0]);
  shown = -1; at = 0;
  show(0, true);
  loadingLine(1);

  // Now the rest: all fetched at once (the network is idle again and
  // parallel is right for it), decoded one at a time (twelve
  // simultaneous decodes of a 1080x1920 image allocate ~95 MB of
  // surface in one go).
  for (let i = 1; i < FRAMES; i++) imgs[i].src = SRC(i);

  for (let i = 1; i < FRAMES; i++) {
    await decode(imgs[i]);
    if (!box.isConnected) return;
    box.appendChild(imgs[i]);
    loadingLine(i + 1);
  }
  ready = true;
  armCast();
}

// ── The gesture ──
// One pointer, vertical only. `at` is where the book was resting when
// the finger landed, so a drag continues from there rather than
// restarting -- pull down twice and it keeps going forward.
let drag = null;

function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }

function onDown(e) {
  if (!ready) return;
  // A press that lands on a live actor is that actor's, not the book's.
  // Without this the book swallows its own buttons: the drag handler
  // takes pointer capture on the way down, which re-targets the eventual
  // click at the capturing element, so the card never hears it. It looks
  // exactly like a dead button and nothing throws.
  if (e.target && e.target.closest && e.target.closest('.fb-actor.live')) return;
  stopAnim();
  drag = { y: e.clientY, from: at, moved: false };
  armCast();                    // a press begins: the cast goes inert
  box.setPointerCapture && box.setPointerCapture(e.pointerId);
}

function onMove(e) {
  if (!drag) return;
  const dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dy) < 4) return;
  drag.moved = true;
  // Down is forward. The span is the whole book, so the finger is
  // moving the pages rather than nudging a counter.
  const span = window.innerHeight * TRAVEL;
  const p = drag.from + (dy / span) * (FRAMES - 1);
  at = Math.max(0, Math.min(FRAMES - 1, p));
  show(at);
  e.preventDefault();
}

// Run to an end at a steady rate. Deliberately frame-paced rather than
// eased: this is a flip book being let go of, and the pages should turn
// at the speed pages turn.
function runTo(target) {
  stopAnim();
  const from = at;
  const dist = Math.abs(target - from);
  if (dist < 0.001) { at = target; show(at); armCast(); return; }
  const ms = (dist / RUN_FPS) * 1000;
  const t0 = performance.now();
  const step = (now) => {
    const a = Math.min(1, (now - t0) / ms);
    at = from + (target - from) * a;
    show(at);
    if (a < 1) anim = requestAnimationFrame(step);
    else { anim = null; at = target; armCast(); }
  };
  anim = requestAnimationFrame(step);
}

function onUp() {
  if (!drag) return;
  const wasDrag = drag.moved;
  drag = null;
  if (!wasDrag) { armCast(); return; }
  // The book only ever comes to rest on the first frame or the last.
  const p = at / (FRAMES - 1);
  runTo(p >= TIP ? FRAMES - 1 : 0);
}

// ── The page lifecycle router.js drives ──
// Bound to the box rather than to the document, so the listeners leave
// with the page when #ist-content is swapped (see CLAUDE.md: "A page
// script must not delegate on `document` for anything another page also
// has").
function mount() {
  document.getElementById('main-site').classList.add('active');
  box = document.getElementById('fb');
  hud = document.getElementById('fb-hud');
  if (!box) return;
  box.style.setProperty('--fb-fit', FIT);
  buildCast();
  box.addEventListener('pointerdown', onDown, { passive: true });
  box.addEventListener('pointermove', onMove, { passive: false });
  box.addEventListener('pointerup', onUp, { passive: true });
  box.addEventListener('pointercancel', onUp, { passive: true });
  // A fresh box every mount, so the decoded frames have to be put back
  // into it. They are kept, not re-fetched: decoding twelve
  // 1080x1920 images is the one cost worth paying only once.
  if (imgs.length && ready) {
    const spinner = document.getElementById('fb-loading');
    if (spinner) spinner.remove();
    imgs.forEach(i => { i.classList.remove('on'); box.appendChild(i); });
    shown = -1; at = 0; show(0, true); armCast();
  } else {
    load();
  }
  if (window.IstProfileCard) IstProfileCard.setPage('project');
}
function unmount() { stopAnim(); drag = null; box = null; hud = null; }
IstRouter.registerPage('project', { mount, unmount });

if (!window.__istVirtualNavInjecting) {
  mount();
  window.addEventListener('DOMContentLoaded', () => {
    if (window.IstProfileCard) IstProfileCard.mount({ sb: IstRouter.sb, I18N: window.I18N, page: 'project' });
  });
}
</script>
</body>
</html>
