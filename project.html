// as a call into that file because the two pages share no script; if the
// rule ever stops being "one vowel, one syllable" they have to move
// together.
const TR_VOWELS_LOWER = 'aeıioöuü';
const SOZCEL_SYL_MIN = 2;
const SOZCEL_SYL_MAX = 3;
function syllableCountTr(word) {
  let n = 0;
  for (const ch of word) if (TR_VOWELS_LOWER.includes(ch)) n++;
  return n;
}

let submitPromise = null;
function submitData() {
  if (!submitPromise) {
    submitPromise = (async () => {
      const night = tonightKey();
      const out = { night, mine: {}, count: 0, failed: false };
      try {
        const uid = await doneUid();
        if (!uid) return out;
        // RLS hands back only the caller's own row (see the migration's
        // own note on why this table is not world-readable).
        const [sz, tm, cnt] = await Promise.all([
          IstRouter.sb.from('sozcel_word_suggestions')
            .select('id, word, status').eq('for_night', night).eq('suggested_by', uid).maybeSingle(),
          IstRouter.sb.from('tumcel_quote_suggestions')
            .select('id, body, status').eq('suggested_by', uid).eq('status', 'pending').limit(1),
          IstRouter.sb.rpc('sozcel_suggestion_count', { p_night: night }),
        ]);
        if (sz && sz.data) out.mine.sozcel = sz.data;
        if (tm && tm.data && tm.data.length) out.mine.tumcel = tm.data[0];
        if (cnt && typeof cnt.data === 'number') out.count = cnt.data;
        // ── The offer that did not get picked ──
        // Only asked about when tonight is still empty: a member who has
        // already offered something is not being asked to offer again.
        // Sözcel only, and not by omission — a Tümcel suggestion has no
        // for_night at all (it is a standing pool that sits until it is
        // used), so an unpicked quote never expires and there is nothing
        // to re-send. Only a per-night offer can be missed.
        if (!out.mine.sozcel) out.again = await lastUnpickedWord(uid, night);
      } catch (err) {
        console.error('[proje öneri]', err);
        out.failed = true;
      }
      return out;
    })();
  }
  return submitPromise;
}

// ── "You offered this and it wasn't played. Again, or something else?" ──
// The member's own most recent offer for a night that has already gone
// by without being picked. Their LAST one and not a queue of them: if
// they let it go and offer something else, the chain moves on with them
// rather than nagging about a word they have stopped caring about.
//
// The night's actual word is read alongside it, which is worth saying
// and costs nothing to say: sozcel_used_answers is readable by every
// signed-in member and that word has already been played, so there is
// nothing left to give away. "Seçilmedi" alone is a shrug; "seçilmedi,
// 'çakıl' oynandı" is the answer to the question they would ask next.
async function lastUnpickedWord(uid, night) {
  try {
    const { data, error } = await IstRouter.sb.from('sozcel_word_suggestions')
      .select('id, word, definition, status, for_night')
      .eq('suggested_by', uid)
      .neq('status', 'picked')
      .lt('for_night', night)
      .order('for_night', { ascending: false })
      .limit(1);
    if (error) throw error;
    const row = (data || [])[0];
    if (!row) return null;
    let played = null;
    try {
      const { data: used } = await IstRouter.sb.from('sozcel_used_answers')
        .select('word').eq('used_on', row.for_night).maybeSingle();
      if (used) played = used.word;
    } catch (err) { /* the night may simply have had no game */ }
    return { word: row.word, definition: row.definition || '', night: row.for_night, played };
  } catch (err) {
    // A database without the migration, or a policy that refuses: the box
    // falls back to an ordinary empty form, which is the state it had
    // before this existed.
    console.error('[proje tekrar]', err);
    return null;
  }
}

function refreshSubmitColumn() {
  submitPromise = null;
  (cast || []).forEach(a => {
    if (!/\bfb-oyun\b/.test(a.def.cls) || !a.def.load) return;
    try { a.def.load(a.el); } catch (err) { console.error(err); }
  });
}

async function loadSubmitActor(el, slot) {
  const data = await submitData();
  if (!el.isConnected) return;
  fbSetPage(el, null);
  fbSetDone(el, false);
  el.classList.remove('fb-locked', 'fb-empty');
  // The same slot arithmetic the games use: the column reads downward,
  // so the first game stands in the last slot (see gameForSlot).
  const g = SUBMIT_DEFS[SUBMIT_DEFS.length - 1 - slot];
  if (!g) {
    el.classList.add('fb-empty');
    el.innerHTML = '';
    return;
  }
  const mine = data.mine[g.key];
  // A word offered and not played is asked about again, once, on the next
  // morning the member has not already offered something (see
  // lastUnpickedWord). It is NOT this column's "done" -- the day still
  // wants an offer from them, and the box says which question it is
  // asking rather than repeating the standing one.
  const again = (g.key === 'sozcel' && !mine) ? data.again : null;
  // An offer already made is this column's "done": the box goes quiet the
  // way a read story does, and stays pressable so it can be withdrawn.
  fbSetDone(el, !!mine);
  el.innerHTML = '<div class="k">' + g.kicker + '</div>' + oyunTitleHtml(g) +
    '<div class="m">' + (mine ? 'Önerdin' : (again ? 'Tekrar mı, başka mı?' : esc(g.ask))) + '</div>';
  fbSetPage(el, submitPagePayload(g, data, mine, again));
}

// What an offer box opens: a field, or what you already offered. Built
// by `wire` rather than statically, for the same reason ANKET's page is
// — it is stateful, and submitting has to turn the form into a receipt
// without closing the page.
function submitPagePayload(g, data, mine, again) {
  return {
    kicker: g.kicker + ' · ÖNERİ',
    // Sözcel's own box names when the game actually unlocks -- sunset --
    // in the one corner every fb-page already reserves for its meta (see
    // .fb-page-head .m); it ticks live once wired (see
    // wireSozcelCountdown), so the render-time value is only the first
    // paint. The other two games have no such wait, so they keep the
    // suggestion count that used to stand here.
    meta: g.key === 'sozcel' ? sozcelCountdownLabel() : (data.count ? data.count + ' öneri' : ''),
    title: g.title,
    html: '<div id="submit-body" class="anket-body">Yükleniyor…</div>',
    wire: (inner) => wireSubmitPage(inner, g, data, mine, again),
  };
}

function wireSubmitPage(inner, g, data, mine, again) {
  const body = inner.querySelector('#submit-body');
  if (!body) return;
  if (g.key === 'sozcel') wireSozcelCountdown(inner);
  if (mine) { renderSubmitMade(body, g, mine); return; }
  if (again) { renderSubmitAgain(body, g, data, again); return; }
  renderSubmitForm(body, g, data);
}

// ── The countdown to sunset, in the offer box's own top-right corner ──
// The games are night-only (see NIGHT_GAMES_ENABLED), and Sözcel's daytime
// box is exactly the reader waiting on that -- so its page names the wait
// rather than leaving the reader to wonder when "bu gece" actually starts.
// It ticks in the same corner every fb-page already reserves for its meta
// (.fb-page-head .m, margin-left: auto) rather than a second element, so
// there is nothing new to place.
let _sozcelCountdownTimer = null;

function stopSozcelCountdown() {
  if (_sozcelCountdownTimer) { clearInterval(_sozcelCountdownTimer); _sozcelCountdownTimer = null; }
}

// Milliseconds until the next night's games open -- the same sun ist-date.js
// already draws the day/night edition from, so this box, the edition switch
// and every game page's own "yeni sözcük" countdown can never disagree about
// when the games unlock.
//
// Through IstDate.nextGameNight() rather than sunTimes() directly, because
// that comparison has to be between two real instants: IstDate.now() returns
// a Date whose *local* fields read as Istanbul's wall clock, so subtracting
// it from a real sunset instant silently offsets the answer by the device's
// own distance from Istanbul.
function sozcelUnlockMs() {
  try { return IstDate.nextGameNight() - new Date(); }
  catch (err) { return null; }
}

function fmtCountdown(ms) {
  const total = Math.max(0, Math.floor((ms || 0) / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = n => String(n).padStart(2, '0');
  return (h > 0 ? h + ':' + pad(m) : m) + ':' + pad(s);
}

// Whether the games are open right now. Asked of the edition rather than of
// the countdown above: nextGameNight() names the next sunset strictly after
// now, so the instant this evening's arrives the number jumps forward a
// whole day rather than crossing zero, and a label reading `ms > 0` would
// never say "Açıldı" at all.
function gamesAreOpen() {
  try { return IstDate.edition() === 'gece'; } catch (err) { return false; }
}

function sozcelCountdownLabel() {
  if (gamesAreOpen()) return 'Açıldı';
  const ms = sozcelUnlockMs();
  if (ms == null) return '';
  return fmtCountdown(ms) + ' sonra';
}

function wireSozcelCountdown(inner) {
  const el = inner.querySelector('.fb-page-head .m');
  stopSozcelCountdown();
  if (!el) return;
  const paint = () => {
    const label = sozcelCountdownLabel();
    if (!label) return;
    el.textContent = label;
    // Once the games are open the wait this box was naming is over -- the
    // box itself is re-read on the next mount/refresh, this just stops
    // ticking a clock that has nothing left to count down.
    if (gamesAreOpen()) stopSozcelCountdown();
  };
  paint();
  _sozcelCountdownTimer = setInterval(paint, 1000);
}

// How a past night is named to the reader. Almost always the one before
// this one, and "dün gece" is what a person says — a raw ISO date reads
// as a machine quoting a row back at them. Anything older keeps its date,
// since "5 gün önce" is arithmetic the reader would have to redo.
function nightWord(key) {
  if (key === IstDate.iso(-1)) return 'Dün gece';
  const d = IstDate.parseYMD(key);
  if (!d) return key + ' için';
  try {
    if (window.I18N && I18N.formatDate) return I18N.formatDate(d, { day: 'numeric', month: 'long' }) + ' gecesi';
  } catch (err) { /* fall through to the key itself */ }
  return key + ' için';
}

// The morning after a word was not played. Two ways on and no third:
// send the same one again, or write another. Declining is simply leaving
// the page -- there is no "no thanks" button, because not offering is
// what every other morning already looks like and it needs no answer.
function renderSubmitAgain(body, g, data, again) {
  body.innerHTML =
    '<div class="submit-made">' + esc(again.word) + '</div>' +
    '<div class="anket-note">' +
      esc(nightWord(again.night)) + ' önerdin — seçilmedi.' +
      (again.played ? ' O gece <b>' + esc(again.played) + '</b> oynandı.' : '') +
    '</div>' +
    '<div class="fb-throw-row">' +
      '<button type="button" class="fb-throw-btn" id="submit-other">Başka kelime</button>' +
      '<button type="button" class="fb-throw-btn" id="submit-again">Tekrar gönder</button>' +
    '</div>' +
    '<div class="anket-note" id="submit-msg">Bu gece için tekrar önerebilirsin.</div>';

  const other = body.querySelector('#submit-other');
  if (other) other.addEventListener('click', () => renderSubmitForm(body, g, data, again.word, again.definition));

  const go = body.querySelector('#submit-again');
  if (go) go.addEventListener('click', async () => {
    const msg = body.querySelector('#submit-msg');
    go.disabled = true;
    msg.textContent = 'Gönderiliyor…';
    // Re-checked rather than trusted: a word that went unpicked for one
    // night can perfectly well have been PLAYED since -- somebody else
    // offering it, or the auto-pick taking it -- and sozcel_used_answers
    // .word is unique across all days, so it could never be an answer
    // again. Better to say so here than to let the admin find out.
    const err = await offerWord(again.word, again.definition, data.night);
    if (err) { go.disabled = false; msg.innerHTML = esc(err); return; }
    refreshSubmitColumn();
    dismissFbPage();
  });
}

// The one path that writes a word, shared by the form and by "tekrar
// gönder" so the checks cannot drift apart. Returns a message to print,
// or null when it landed.
async function offerWord(word, definition, night) {
  const uid = await doneUid();
  if (!uid) return 'Oturum bulunamadı.';
  try {
    const { data: used } = await IstRouter.sb.from('sozcel_used_answers')
      .select('word').eq('word', word).maybeSingle();
    if (used) return 'Bu kelime bu arada oynandı — başka bir tane seç.';
  } catch (err) { /* best effort: the insert is still fenced */ }
  const { error } = await IstRouter.sb.from('sozcel_word_suggestions')
    .insert([{ for_night: night, word, definition: definition || null, suggested_by: uid }]);
  if (!error) return null;
  console.error('[proje öneri]', error);
  return offerWordError(error);
}

// ── What went wrong, said in a way somebody can act on ──
// Every failure used to print "Gönderilemedi, tekrar dene." — which is
// actively WRONG advice for the two failures that are actually likely,
// because neither of them will ever come right by trying again: the
// table is not there, or it is there in its first shape and does not
// have the column this page writes. Both are one unrun migration, and a
// member told to retry will simply keep retrying while nobody finds out.
// So a permanent failure says it is permanent and names the file that
// fixes it; only a genuinely transient one says "tekrar dene".
//
// PostgREST answers from a cached schema, so a missing table and a
// missing column are both reported as cache misses rather than as the
// Postgres errors underneath them — which is why the codes here are
// PGRST2xx and not 42P01/42703.
function offerWordError(error) {
  const code = error && error.code;
  // The CODE decides wherever there is one, because it is the only part
  // of the answer that is unambiguous. Every message below names the
  // table it was about — "Could not find the 'definition' column OF
  // 'sozcel_word_suggestions'", 'violates row-level security policy FOR
  // TABLE "sozcel_word_suggestions"' — so any table-shaped pattern
  // matches all three of them and whichever test runs first wins. Two
  // different wrong answers came out of trying to order those patterns;
  // the codes have no such overlap.
  const BY_CODE = {
    // The table is at its first shape: `note`, not `definition`.
    'PGRST204': 'stale', '42703': 'stale',
    // The table has never been created.
    'PGRST205': 'missing', '42P01': 'missing',
    // RLS refused the row. By day for_night is today and the policy's
    // fence is "not a night already past", so in practice this is a
    // session the database does not recognise rather than a member
    // offering too late.
    '42501': 'rls',
    // Either this member already offered tonight, or somebody else
    // already offered this word.
    '23505': 'dupe',
  };
  let kind = Object.prototype.hasOwnProperty.call(BY_CODE, code) ? BY_CODE[code] : null;
  // No code at all (a network-level failure, or a client that dropped
  // it): fall back to the message, narrowest test first.
  if (!kind) {
    const msg = ((error && error.message) || '') + ' ' + ((error && error.details) || '');
    if (/'?definition'? column/i.test(msg)) kind = 'stale';
    else if (/row-level security/i.test(msg)) kind = 'rls';
    else if (/(could not find the table|relation).*sozcel_word_suggestions/i.test(msg)) kind = 'missing';
  }
  if (kind === 'stale')   return 'Öneri tablosu güncel değil (db/sozcel_word_suggestions.sql).';
  if (kind === 'missing') return 'Öneri tablosu kurulu değil (db/sozcel_word_suggestions.sql).';
  if (kind === 'rls')     return 'Bu öneri kaydedilemedi — oturumu kapatıp tekrar açar mısın?';
  if (kind === 'dupe')    return 'Bu öneri zaten var — ya seninki ya da aynı kelime.';
  return 'Gönderilemedi, tekrar dene.';
}

// What you offered, and the one thing left to do with it: take it back.
function renderSubmitMade(body, g, mine) {
  const what = g.key === 'sozcel' ? (mine.word || '') : (mine.body || '');
  body.innerHTML =
    '<div class="submit-made">' + esc(what) + '</div>' +
    '<div class="anket-note">' +
      (mine.status === 'picked'
        ? 'Seçildi — bu gece bu oynanıyor.'
        : 'Gönderildi. Akşam hangisinin oynanacağına yönetici karar veriyor.') +
    '</div>' +
    (mine.status === 'picked' ? '' :
      '<div class="fb-throw-row"><button type="button" class="fb-throw-btn" id="submit-undo">Vazgeç</button></div>');
  const undo = body.querySelector('#submit-undo');
  if (undo) undo.addEventListener('click', async () => {
    undo.disabled = true;
    const table = g.key === 'sozcel' ? 'sozcel_word_suggestions' : 'tumcel_quote_suggestions';
    const { error } = await IstRouter.sb.from(table).delete().eq('id', mine.id);
    if (error) {
      console.error('[proje öneri sil]', error);
      undo.disabled = false;
      body.insertAdjacentHTML('beforeend', '<div class="anket-note">Geri alınamadı.</div>');
      return;
    }
    refreshSubmitColumn();
    dismissFbPage();
  });
}

function renderSubmitForm(body, g, data, prefill, prefillNote) {
  const isWord = g.key === 'sozcel';
  body.innerHTML =
    '<label class="submit-label" for="submit-in">' +
      (isWord ? SOZCEL_SYL_MIN + ' ya da ' + SOZCEL_SYL_MAX + ' heceli bir kelime' : 'Alıntı') + '</label>' +
    (isWord
      ? '<input class="submit-in" id="submit-in" type="text" inputmode="text" autocomplete="off" ' +
        'autocapitalize="off" spellcheck="false" maxlength="16">'
      : '<textarea class="submit-in submit-area" id="submit-in" rows="3" maxlength="240"></textarea>') +
    (isWord
      // Not "why this word" any more: the MEANING. sozcel_used_answers
      // carries a `definition` for every word it has played and the game
      // prints it when the round is over, so what is asked for here is
      // the thing that actually gets used rather than a line of
      // reasoning that stops at the admin's desk.
      ? '<label class="submit-label" for="submit-note">Sözcüğün anlamı</label>' +
        '<input class="submit-in" id="submit-note" type="text" maxlength="160">'
      : '<label class="submit-label" for="submit-note">Kimden?</label>' +
        '<input class="submit-in" id="submit-note" type="text" maxlength="120">') +
    '<div class="fb-throw-row"><button type="button" class="fb-throw-btn" id="submit-go">Gönder</button></div>' +
    '<div class="anket-note" id="submit-msg">Bu gece oynanacak oyun için.</div>';

  const field = body.querySelector('#submit-in');
  const note = body.querySelector('#submit-note');
  const go = body.querySelector('#submit-go');
  const msg = body.querySelector('#submit-msg');
  if (!field || !go) return;
  // Arriving from "başka kelime": the word they are replacing is in the
  // field, because changing one letter of it is the likeliest edit and
  // retyping the whole thing is the likeliest reason not to bother. Its
  // meaning comes with it -- a word edited by a letter usually means the
  // same thing, and a field cleared behind the reader's back reads as
  // work lost.
  if (prefill) { field.value = prefill; field.select && setTimeout(() => field.select(), 0); }
  if (note && prefillNote) note.value = prefillNote;

  go.addEventListener('click', async () => {
    // Turkish lowercase: İ/I are not each other's case pair in tr, so
    // toLocaleLowerCase('tr') is the only correct fold here — the word
    // lists are lowercase Turkish and a mismatched I never matches.
    const raw = (field.value || '').trim().toLocaleLowerCase('tr-TR');
    const extra = (note && note.value || '').trim();
    if (!raw) { msg.textContent = 'Önce bir şey yaz.'; return; }
    if (isWord) {
      // Turkish letters only. The pool is Turkish words; anything else is
      // a word the game could never take. Checked before the syllables,
      // since the vowel count of a string with digits in it means nothing.
      if (!/^[a-zçğıöşü]+$/.test(raw)) { msg.textContent = 'Sadece Türkçe harfler.'; return; }
      const syl = syllableCountTr(raw);
      if (syl < SOZCEL_SYL_MIN || syl > SOZCEL_SYL_MAX) {
        msg.textContent = 'Kelime ' + SOZCEL_SYL_MIN + ' ya da ' + SOZCEL_SYL_MAX + ' heceli olmalı.';
        return;
      }
      // The meaning is what the game prints when the round is over, so a
      // word offered without one is a word the admin cannot play.
      if (!extra) { msg.textContent = 'Sözcüğün anlamını da yaz.'; return; }
    }
    go.disabled = true;
    msg.textContent = 'Gönderiliyor…';
    let problem = null;
    if (isWord) {
      problem = await offerWord(raw, extra, data.night);
    } else {
      const uid = await doneUid();
      if (!uid) problem = 'Oturum bulunamadı.';
      else {
        const { error } = await IstRouter.sb.from('tumcel_quote_suggestions')
          .insert([{ body: (field.value || '').trim(), source: extra || '—', suggested_by: uid }]);
        if (error) {
          console.error('[proje öneri]', error);
          problem = error.code === '23505' ? 'Bu alıntı zaten önerilmiş.' : 'Gönderilemedi, tekrar dene.';
        }
      }
    }
    if (problem) { go.disabled = false; msg.textContent = problem; return; }
    refreshSubmitColumn();
    dismissFbPage();
  });
}

// ══════════════════════════════════════════════════════════════
// WHICH LOADER A COLUMN USES — the whole of the day/night switch
//
// The cast is never rebuilt for an edition: an actor keeps its slot, its
// column, its poses and its lag, and only what fills it changes. That is
// what keeps the walk between lanes identical at noon and at midnight --
// a column that rebuilt itself would land its cards a few pixels off the
// ones beside it and the whole strip would read as reflowing.
// The wide column is the news, day and night alike -- it no longer
// trades places with Anket, which now lives in the narrow column alone
// (see "THE TWO EDITIONS" above).
function loadKutuphaneWide(el, slot) {
  return loadHaberlerActor(el, slot);
}
// Narrow: the news one story deeper by day (see loadHaberlerNarrowActor),
// the poll results by night -- the reader swipes through the news itself
// now rather than voting beside it, and the vote's own answer waits for
// the edition it belongs to.
function loadKutuphaneNarrow(el, slot) {
  return fbEdition === 'gece' ? loadAnketSonucActor(el, slot) : loadHaberlerNarrowActor(el, slot);
}
function loadKahveNarrow(el, slot) {
  if (!NIGHT_GAMES_ENABLED) return loadOyunActor(el, slot);
  return fbEdition === 'gece' ? loadOyunActor(el, slot) : loadSubmitActor(el, slot);
}

// ── Kahvehane's other column: the fixed set of games ──
// Not a feed -- always these two, in this order -- but a game the
// admin switched off for today (game_day_toggles) is not a step the
// reader has left to take (see CLAUDE.md), so its own slot goes
// dashed exactly like an empty feed slot rather than opening a locked
// page. Bulmaca is not a slot here any more -- it stays a real page
// (bulmaca.html), reachable directly and still run by the admin's
// on/off board and scoreboard, but this column only carries two boxes
// now (see .fb-oyun's own height override, sized to fill exactly the
// room three boxes used to take).
const GAME_DEFS = [
  // Sözcel wears its own mark (the same assets/sozcel-logo.png the
  // desktop game-link tiles use) in place of its plain title; Tümcel has
  // no logo of its own yet, so it still prints its name as text.
  { key: 'sozcel', kicker: '1. OYUN', title: 'Sözcel', logo: 'assets/sozcel-logo.png', file: 'sozcel.html' },
  { key: 'tumcel', kicker: '2. OYUN', title: 'Tümcel', file: 'tumcel.html' },
];
// The sequence reads DOWNWARD: 1. Oyun on top, 2. Oyun at the dock. The
// slots are numbered from the dock up (see .fb-slot-N), so the first
// game stands in the last slot -- the one place that arithmetic is
// written.
function gameForSlot(slot) { return GAME_DEFS[GAME_DEFS.length - 1 - slot]; }

// Today's state for the whole column, fetched once and shared by all
// three boxes: which games the admin has switched off, and which the
// reader has already finished. Dropped when a game is closed, since
// playing one is exactly what changes the answer (see
// closeGameOverlay).
let gamesStatePromise = null;
function gamesStateToday() {
  if (gamesStatePromise) return gamesStatePromise;
  gamesStatePromise = (async () => {
    const state = { off: new Set(), played: new Set() };
    const sb = window.IstRouter && IstRouter.sb;
    if (!sb) return state;
    // Two different date SHAPES, deliberately: game_day_toggles is keyed
    // by the padded ISO key and game_results by the unpadded seed. Both
    // name the same thing — the NIGHT being played, which spans midnight,
    // so neither may be the calendar date (see ist-date.js). Both go
    // through ist-date.js, never a parsed locale string (CLAUDE.md rule 10).
    try {
      const { data, error } = await sb.from('game_day_toggles')
        .select('game').eq('game_date', IstDate.gameNight());
      if (error) throw error;
      (data || []).forEach(r => state.off.add(r.game));
    } catch (err) {
      console.error('[proje oyun]', err);   // best effort: nothing off rather than everything off
    }
    let uid = null;
    try { uid = (await sb.auth.getUser()).data.user.id; } catch (err) {}
    if (uid) {
      try {
        const { data, error } = await sb.from('game_results')
          .select('game, attempts').eq('user_id', uid).eq('date', IstDate.gameNightSeed());
        if (error) throw error;
        // PLAYED means FINISHED, not opened. Every game writes an
        // attempts:0 row on the reader's first interaction, so counting
        // rows would call a game still being played done and open the
        // next one early -- the same rule Kahvehane's deck and the app
        // map's own square use, and the three must agree.
        (data || []).forEach(r => { if ((r.attempts || 0) >= 1) state.played.add(r.game); });
      } catch (err) {
        console.error('[proje oyun]', err);
      }
    }
    return state;
  })();
  return gamesStatePromise;
}

// What is standing in front of this game: the first game before it in
// the sequence that is on today and has not been finished. A game the
// admin switched off is not a step anybody has left to take, so it
// blocks nothing -- the same reading Kahvehane's deck gives it, where an
// off game simply leaves the sequence.
function gameBlocker(state, idx) {
  for (let i = 0; i < idx; i++) {
    const p = GAME_DEFS[i];
    if (!state.off.has(p.key) && !state.played.has(p.key)) return p;
  }
  return null;
}

async function loadOyunActor(el, slot) {
  const state = await gamesStateToday();
  if (!el.isConnected) return;
  const idx = GAME_DEFS.length - 1 - slot;
  const g = GAME_DEFS[idx];
  el.classList.remove('fb-locked');
  fbSetDone(el, false);
  if (state.off.has(g.key)) {
    el.classList.add('fb-empty'); el.classList.remove('fb-openable');
    el.innerHTML = '<div class="k">' + g.kicker + '</div>'; return;
  }
  el.classList.remove('fb-empty');
  // PLAYED means finished (attempts >= 1), the same reading the lock
  // below and the app map's own square use -- all three have to agree or
  // a game opens the next one while still saying it has not been played.
  fbSetDone(el, state.played.has(g.key));
  const blocker = gameBlocker(state, idx);
  if (blocker) el.classList.add('fb-locked');
  // The same class every other column's boxes carry, and it means the
  // same thing here: this box answers a press. A game whose turn has not
  // come does not, so it does not wear it -- and neither the cursor nor
  // the press effect has a second rule to state (see fbSetPage).
  el.classList.toggle('fb-openable', !blocker);
  // The box names its game and nothing about it -- "Türkçe Wordle" told
  // the reader something they already know once the game has a mark of
  // its own; the only thing this line still has to say is that another
  // game is standing in front of this one.
  el.innerHTML = '<div class="k">' + g.kicker + '</div>' + oyunTitleHtml(g) +
                 (blocker ? '<div class="m">Önce ' + blocker.title + '</div>' : '');
}

// Playing a game is what unlocks the next one, so the column is re-read
// the moment one is closed rather than at the next mount -- otherwise a
// reader who has just finished Sözcel is looking at a Tümcel that is
// still holding them off.
function refreshOyunColumn() {
  gamesStatePromise = null;
  (cast || []).forEach(a => {
    if (!/\bfb-oyun\b/.test(a.def.cls) || !a.def.load) return;
    try { a.def.load(a.el); } catch (err) { console.error(err); }
  });
  // A game just finished is also a step off the day's own meter.
  refreshDayMeter();
}

function onpressOyun(e, slot) {
  const el = e.currentTarget;
  if (el.classList.contains('fb-empty') || el.classList.contains('fb-locked')) return;
  // ── The press handler belongs to the ACTOR, not to the edition ──
  // This column is two different things across the day, so the one
  // handler both of them carry has to route: by night a press opens the
  // game, by day it opens that game's offer page, which is an ordinary
  // payload and so goes through the ordinary door (onpressBox). Without
  // this the daytime boxes looked pressable, set `_fbPage`, and did
  // nothing at all when pressed.
  if (NIGHT_GAMES_ENABLED && fbEdition !== 'gece') { onpressBox(e); return; }
  openGameOverlay(gameForSlot(slot).file);
}

// ══════════════════════════════════════════════════════════════
// THE BAND PAGE — a box, opened
//
// A box has room for a kicker, a timestamp and two lines of headline;
// pressing it opens the whole of what it was naming. Where that page
// goes is the one place it can go without covering what it came out of:
// the band itself. It is THE sheet -- same markup, same IstSheet.open/
// close -- arriving by the shared grow rather than by sliding, exactly
// as Kütüphane's news page and Kahvehane's event page do.
//
// Every box that has something to open carries its own payload, set by
// its loader at the moment it renders (`el._fbPage`). One handler reads
// it, so a column adds a page by describing one rather than by wiring
// one: a box with no payload -- a dashed slot, a placeholder, a feed
// that failed -- is simply not pressable, which is the truth about it.
// ══════════════════════════════════════════════════════════════

let _fbOrigin = null;   // the box this page grew out of
// Whether this page put an entry on the history stack. It does, so the
// device's own back gesture closes the page rather than leaving the app
// -- the reader's "back" is one thing, and on a phone it is not a mark
// printed on the screen.
let _fbPushed = false;

function fbPageGrows() {
  return !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// Paragraph breaks are blank lines, single newlines are line breaks --
// the same reading of a text column the rest of the site gives one.
function fbParas(text) {
  return String(text == null ? '' : text).split(/\n{2,}/)
    .map(t => t.trim()).filter(Boolean)
    .map(t => '<p>' + esc(t).replace(/\n/g, '<br>') + '</p>').join('');
}

// One page, whatever box it came out of: the card's own two corners on
// the top line with the way back beside them, and everything the card
// only had room to name underneath.
function fbPageHTML(p) {
  return '<div class="fb-page-head">' +
      '<button class="fb-page-back" type="button" id="fb-page-back" ' +
        'aria-label="Geri" title="Geri"><img src="assets/back.png" alt=""></button>' +
      '<div class="k">' + esc(p.kicker || '') + '</div>' +
      (p.meta ? '<div class="m">' + esc(p.meta) + '</div>' : '') +
    '</div>' +
    '<div class="fb-page-body">' +
      '<h2 class="fb-page-title">' + esc(p.title || '') + '</h2>' +
      (p.lines && p.lines.length
        ? '<div class="fb-page-meta">' + p.lines.map(esc).join('<br>') + '</div>' : '') +
      // ANKET's page carries live vote buttons rather than plain text --
      // p.html stands in for p.body wherever a box needs more than a
      // paragraph of reading (see the anket-* rules above). Everything
      // else still just writes body/lines, so this is the one place the
      // two kinds of page diverge.
      (p.html || (p.body ? fbParas(p.body) : '')) +
    '</div>';
}

// What a box opens into, set by its loader as it renders. One setter
// rather than a bare property, so "has a page" and "looks like it has
// one" cannot drift apart: a dashed slot, a placeholder and a fetch that
// failed are all boxes with nothing behind them, and none of the three
// should say otherwise under a cursor or give under a finger.
//
// `fb-openable` says exactly one thing -- THIS BOX ANSWERS A PRESS -- and
// is the single condition the cursor and the press effect are both hung
// off. Oyunlar sets it too (its press opens a game rather than a page),
// so there is one predicate rather than one per column.
function fbSetPage(el, page) {
  if (!el) return;
  el._fbPage = page || null;
  el.classList.toggle('fb-openable', !!page);
}

// The one press handler every openable column shares.
function onpressBox(e) {
  const el = e.currentTarget;
  if (!el || !el._fbPage) return;
  openFbPage(el._fbPage, el);
}

function openFbPage(payload, origin) {
  const overlay = document.getElementById('fb-page-overlay');
  const page = document.getElementById('fb-page');
  const inner = document.getElementById('fb-page-inner');
  if (!overlay || !page || !inner || !overlay.hidden) return;
  _fbOrigin = origin || null;
  inner.innerHTML = fbPageHTML(payload);
  // The page came out of a column and keeps its ranging: Kahvehane's
  // pair is the mirror of Kütüphane's (see .fb-mirror), so the red flag
  // stands on the edge that column is ranged from.
  page.classList.toggle('fb-mirror',
    !!(origin && origin.classList.contains('fb-mirror')));
  IstSheet.open(overlay);
  if (fbPageGrows()) IstSheet.grow({ page, inner, origin: _fbOrigin, dir: 'in' });
  const back = document.getElementById('fb-page-back');
  if (back) back.addEventListener('click', () => dismissFbPage());
  // ANKET's page is stateful (vote, then show the result), which a static
  // render can't do -- wire is the one hook a payload can carry to attach
  // its own listeners once its markup is actually in the document. Every
  // other box simply has no wire.
  if (payload && payload.wire) { try { payload.wire(inner); } catch (err) { console.error(err); } }
  // Opening IS the deal for a box that can be dealt with (see the news
  // loader's own onOpen). Every other box simply has no onOpen, exactly
  // as it has no wire.
  if (payload && payload.onOpen) { try { payload.onOpen(); } catch (err) { console.error(err); } }
  try { history.pushState({ fbPage: 1 }, ''); _fbPushed = true; } catch (err) {}
}

// Every way out that is the READER leaving goes through here, so the
// history entry this page put on the stack is spent rather than left
// behind -- otherwise the next back press would close a page that is
// already gone. popstate does the actual closing in that case.
function dismissFbPage() {
  const overlay = document.getElementById('fb-page-overlay');
  if (!overlay || overlay.hidden) return;
  if (_fbPushed) { _fbPushed = false; history.back(); return; }
  closeFbPage();
}

function closeFbPage() {
  const overlay = document.getElementById('fb-page-overlay');
  const page = document.getElementById('fb-page');
  const inner = document.getElementById('fb-page-inner');
  if (!overlay || !inner || overlay.hidden) return;
  stopSozcelCountdown();
  if (fbPageGrows()) IstSheet.grow({ page, inner, origin: _fbOrigin, dir: 'out' });
  IstSheet.close(overlay, () => {
    inner.innerHTML = '';
    // The throw moved its stamp onto the page and may have left an
    // inline transform on it mid-flight; neither belongs to the next
    // page that opens here.
    page.querySelectorAll(':scope > .fb-throw-cue').forEach(n => n.remove());
    page.style.transform = ''; page.style.opacity = ''; page.style.transition = '';
    IstSheet.cancelGrow(page);
    _fbOrigin = null;
  });
}

// Gone this frame, with no fold-back: for a teardown of the page itself,
// which has nothing left to fold back INTO. The overlay is body-level
// and outlives the content swap, so a page left open would be the last
// word on a page that is gone.
function snapFbPageShut() {
  const overlay = document.getElementById('fb-page-overlay');
  const page = document.getElementById('fb-page');
  const inner = document.getElementById('fb-page-inner');
  if (!overlay || !inner || overlay.hidden) return;
  stopSozcelCountdown();
  IstSheet.cancelGrow(page);
  page.querySelectorAll(':scope > .fb-throw-cue').forEach(n => n.remove());
  page.style.transform = ''; page.style.opacity = ''; page.style.transition = '';
  overlay.classList.remove('open');
  // This path drops .open by hand rather than through IstSheet.close, so
  // the tint's other half has to be told (see syncDim there).
  overlay.hidden = true;
  IstSheet.syncDim();
  inner.innerHTML = '';
  _fbOrigin = null;
  _fbPushed = false;
}

// ══════════════════════════════════════════════════════════════
// THE THROW — how an opened page is answered
//
// A box opens into the band, and the one thing the page then asks is
// answered by throwing it: right is the first option, left the second,
// and the option is STAMPED on the paper as it goes so nobody ever
// answers a question they did not see. It is the gesture Kütüphane's
// news deck and Kahvehane's event deck both taught in the parts bin, and
// the same one the reader already uses to walk the lanes -- so the page
// is answered with the finger that opened it rather than with a row of
// buttons underneath.
//
// One implementation for both: a story's poll and an evening's RSVP are
// the same gesture with different words and different writes. What
// differs is passed in; nothing about the movement is stated twice.
//
// Two buttons are rendered as well, and deliberately: a desktop reader
// has no finger, and a throw is not discoverable on its own the first
// time. The gesture is the fast path, the buttons are the floor.
const THROW_COMMIT = 0.28;   // of the page's own width
const THROW_FLICK = 0.55;    // px/ms -- the app's own throw constant

function wirePageThrow(inner, opts) {
  const page = document.getElementById('fb-page');
  if (!page || !inner) return;
  // The stamp is authored inside the reading (it belongs to the question
  // it answers) but it must not SCROLL with it -- it is printed on the
  // paper, not written in the column. Moved up to the page itself, which
  // is the positioned box it is pinned against. Any stamp a previous
  // page left behind goes with it.
  page.querySelectorAll(':scope > .fb-throw-cue').forEach(n => n.remove());
  const cue = inner.querySelector('.fb-throw-cue');
  if (cue) page.appendChild(cue);
  let drag = null;
  let spent = false;

  const setCue = (dx) => {
    if (!cue) return;
    const w = page.offsetWidth || 1;
    const t = Math.min(1, Math.abs(dx) / (w * THROW_COMMIT));
    cue.textContent = dx > 0 ? opts.right.label : opts.left.label;
    cue.classList.toggle('on-right', dx > 0);
    cue.style.opacity = String(t);
  };
  const clearCue = () => { if (cue) { cue.style.opacity = '0'; cue.textContent = ''; } };

  const settle = () => {
    page.style.transition = 'transform 260ms cubic-bezier(.2,.7,.3,1)';
    page.style.transform = '';
    clearCue();
    setTimeout(() => { page.style.transition = ''; }, 280);
  };

  // The answer, and then the page goes. The write is fired first and the
  // page leaves without waiting on it: a verdict the reader has already
  // given should not sit under a spinner, and every one of these writes
  // reports its own failure where the column will show it.
  const commit = (side) => {
    if (spent) return;
    spent = true;
    const dir = side === 'right' ? 1 : -1;
    const w = page.offsetWidth || 400;
    page.style.transition = 'transform 300ms cubic-bezier(.4,0,.8,.3), opacity 300ms linear';
    page.style.transform = 'translateX(' + (dir * w * 1.25) + 'px) rotate(' + (dir * 4) + 'deg)';
    page.style.opacity = '0';
    try { opts[side].run(); } catch (err) { console.error('[proje throw]', err); }
    setTimeout(() => {
      page.style.transition = ''; page.style.transform = ''; page.style.opacity = '';
      dismissFbPage();
    }, 300);
  };

  inner.querySelectorAll('[data-throw]').forEach(btn => {
    btn.addEventListener('click', () => commit(btn.dataset.throw));
  });

  const down = (e) => {
    if (spent) return;
    // A press on a control is that control's. Everything else on the
    // page is fair game for a throw: the body scrolls VERTICALLY, and
    // the axis test below hands a vertical drag straight back to it
    // without ever calling preventDefault, so the two never compete.
    if (e.target.closest('button, a')) return;
    drag = { x: e.clientX, y: e.clientY, t: performance.now(), axis: null, lastX: e.clientX, v: 0 };
  };
  const move = (e) => {
    if (!drag || spent) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      // Vertical belongs to the page's own scroll; only a sideways drag
      // is the throw. Claimed once and never re-decided mid-gesture.
      drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (drag.axis === 'x') { try { page.setPointerCapture(e.pointerId); } catch (err) {} }
    }
    if (drag.axis !== 'x') return;
    const now = performance.now();
    if (now > drag.t) drag.v = (e.clientX - drag.lastX) / (now - drag.t);
    drag.lastX = e.clientX; drag.t = now;
    page.style.transition = '';
    page.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx * 0.012) + 'deg)';
    setCue(dx);
    e.preventDefault();
  };
  const up = (e) => {
    if (!drag || spent) { drag = null; return; }
    const wasX = drag.axis === 'x';
    const dx = e.clientX - drag.x;
    const v = drag.v;
    drag = null;
    if (!wasX) return;
    const w = page.offsetWidth || 1;
    // Distance OR speed, the same pair the book's own release uses: a
    // flick that never travelled far is still a throw.
    if (Math.abs(dx) > w * THROW_COMMIT || Math.abs(v) > THROW_FLICK) {
      commit(dx > 0 ? 'right' : 'left');
    } else settle();
  };

  page.addEventListener('pointerdown', down);
  page.addEventListener('pointermove', move);
  page.addEventListener('pointerup', up);
  page.addEventListener('pointercancel', up);
}

// The two-option foot every throwable page carries: the stamp that
// appears as the paper moves, and the two buttons that say the same
// thing for a reader with no finger.
function throwFootHTML(leftLabel, rightLabel, note) {
  return '<div class="fb-throw-cue"></div>' +
    '<div class="fb-throw-row">' +
      '<button type="button" class="fb-throw-btn" data-throw="left">' + esc(leftLabel) + '</button>' +
      '<button type="button" class="fb-throw-btn" data-throw="right">' + esc(rightLabel) + '</button>' +
    '</div>' +
    (note ? '<div class="fb-throw-note">' + esc(note) + '</div>' : '');
}

function wireFbPage() {
  if (document.body.dataset.fbPageWired) return;
  document.body.dataset.fbPageWired = '1';
  const backdrop = document.getElementById('fb-page-backdrop');
  if (backdrop) backdrop.addEventListener('click', () => dismissFbPage());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && IstSheet.isOpen('fb-page-overlay')) dismissFbPage();
  });
  // The device's own back. The entry is already off the stack by the
  // time this runs, so this closes and never calls history again.
  window.addEventListener('popstate', () => {
    if (!IstSheet.isOpen('fb-page-overlay')) return;
    _fbPushed = false;
    closeFbPage();
  });
}

// Shared pose tables: the x-parking pattern depends only on which
// column an actor stands in and which stop it belongs to, never on
// what it is OF -- so every column on the same stop can share one
// table instead of restating it per actor.
//
// The slide-12 pair (Kütüphane's and Kahvehane's own columns): parked
// off its own side from 0-6, in over 8-11, home at 11, back out over
// 12-16, parked again to 23. Symmetric about 11 on purpose -- leaving

const MID_POSES_L = {

  10: { x: -22 }, 11: { x: 0 }, 12: { x: -22 }, 14: { x: -95 },

};

  10: { x: 22 }, 11: { x: 0 }, 12: { x: 22 }, 14: { x: 95 },
  16: { x: 160 }, 23: { x: 160, opacity: 1 },
};
// Slide 1 (Türkiye) is a book END, not a middle stop -- there is no
// "before" side, so its columns simply stand at home on slide 0 and
// fade off toward Kütüphane's own pair by slide 3, staying gone for
// the rest of the book (a held pose holds past its last key).

const END0_POSES_R = { 0: { x: 0, opacity: 1 }, 3: { x: 60, opacity: 0 }, 11: { x: 60, opacity: 0 } };
// The mirror at the other end of the book, slide 24 (the ilçe).
const END23_POSES_L = { 11: { x: -60, opacity: 0 }, 20: { x: -60, opacity: 0 }, 23: { x: 0, opacity: 1 } };
const END23_POSES_R = { 11: { x: 60, opacity: 0 }, 20: { x: 60, opacity: 0 }, 23: { x: 0, opacity: 1 } };

// One column description in, three stacked actors out by default (slot
// 0 at the dock, 1 and 2 above it) -- or `count` of them, for a column
// whose fixed set is not three (Oyunlar is two, see the CAST entry
// below). `load`/`onpress`, if given, are called with the slot index
// appended, so one fetch can fill every box and one handler can tell
// them apart.
//
// They all share one pose table -- the same x/opacity numbers at the
// same slide -- so what staggers them is purely how fast each one's
// `pos` catches up to it (see `ease()`): SLOT_LAG multiplies slot 0's
// (the dock-most box) lag and lagFree up and the topmost slot's down,
// keeping their 3.2:1 ratio intact whether there are two slots or
// three. Higher lag reaches wherever the target currently is sooner, in
// EITHER direction, so the same ordering plays both ways: entering,
// slot 0 is first to arrive; leaving, slot 0 is first to be gone, with
// the rest following a beat behind each time.
const SLOT_LAG = [1.25, 1, 0.8];
function stackActors({ idBase, live, lane, col, mirror, cls, poses, lag, lagFree, load, onpress, count }) {
  const out = [];
  for (let slot = 0; slot < (count || 3); slot++) {
    out.push({
      id: idBase + slot,
      live, lane,
      cls: cls + ' fb-box fb-col-' + col + (mirror ? ' fb-mirror' : '') + ' fb-slot-' + slot,
      lag: lag * SLOT_LAG[slot], lagFree: lagFree * SLOT_LAG[slot],
      html: '',
      load: load ? (el) => load(el, slot) : undefined,
      onpress: onpress ? (e) => onpress(e, slot) : undefined,
      poses,
    });
  }
  return out;
}

// ── The lag ──
// The drawings stay locked to the finger -- they are the flip book, and
// a page that arrives late is just a slow page. The CAST trails instead:
// each actor eases toward wherever the book currently is, so the
// furniture has a little weight and settles a beat after the paper.
//
// The number is the fraction of the remaining distance covered per 60Hz
// frame -- 0.16 catches up ~63% in 6 frames, which reads as weight
// rather than as lag. It is applied per elapsed time, not per frame, so
// it feels identical on a 120Hz screen.
// Two rates, not one. While the finger is DOWN the screen should stay
// close to it -- a big trail under your own thumb reads as the app
// struggling, not as weight. Once it is let go there is nothing to keep
// up with, and a slower catch-up is what makes the settle feel heavy
// rather than mechanical.
//
// Higher is TIGHTER: it is the fraction of the remaining distance
// covered per 60Hz frame. So the dragging number is the big one.
const CAST_LAG = 0.43;        // following the finger
const CAST_LAG_FREE = 0.135;  // let go   (the same 3.2 : 1 ratio)
// The drawings, on their own pair of knobs. Set both to 1 and the paper
// is locked to the finger while the furniture still trails.
const FRAME_LAG = 0.43;
const FRAME_LAG_FREE = 0.135;
// ── THE WAVE TRAVELS AT ITS OWN, EVEN SPEED ──
// The letters do not ride `lanePos` raw, and they do not chase it on an
// ease() either. Two reasons, and they are different. The lane's release
// tween is 300ms of ease-out: nine letters crossed inside it is not a
// wave, it is the snap the wave was meant to replace. And an exponential
// chase spends itself at the front -- five letters in the first two
// hundred milliseconds and the last one still going half a second later,
// which reads as a stutter rather than as a run. So once the finger is
// off the glass the front moves at a CONSTANT rate, a whole lane (a
// whole word) in NAV_RUN_MS, and every letter gets the same beat.
// It runs a whole word in about a quarter of a second: the release tween
// is 300ms, so a wave much slower than that is still crossing letters
// after the strip it belongs to has stopped moving.
// Under the finger there is nothing to chase: the gesture is the
// animation, exactly as it is for the strip itself.
const NAV_RUN_MS = 260;
let navP = START_LANE;   // where the WAVE has got to; lanePos is where it is going
let castTarget = 0;
let castTick = null;
let castLast = 0;
// Where the DRAWINGS have caught up to. Continuous, like an actor's --
// what gets rounded is only which frame that lands on.
let framePos = START_SLIDE;

let cast = [];
let imgs = [];
let at = START_SLIDE;   // 0..FRAMES-1, where the book is resting
let shown = -1;
let anim = null;

// Looked up in mount(), never at the top level. router.js runs a page's
// script at idle, before the reader ever asks for it -- which happens
// while a DIFFERENT page's DOM is on screen, so a top-level
// getElementById here finds nothing and throws, and a script that
// throws half way has already declared its consts and cannot be run
// again. Everything that touches the DOM waits for mount().
let box = null;
// The two layers paintLanes writes to, looked up once rather than
// every frame (see paintLanes for why they are written at all).
let scrimEl = null, mapLaneEl = null;

// ── Poses ──
const POSE0 = { x: 0, y: 0, scale: 1, opacity: 1, rot: 0 };
const lerp = (a, b, t) => a + (b - a) * t;

// Fill a sparse table so every slide has a pose.
function expandPoses(poses) {
  const out = new Array(FRAMES);
  const given = [];
  for (let i = 0; i < FRAMES; i++) {
    if (poses[i]) { out[i] = Object.assign({}, POSE0, poses[i]); given.push(i); }
  }
  if (!given.length) { out.fill(POSE0); return out; }
  for (let i = 0; i < given[0]; i++) out[i] = out[given[0]];
  for (let i = given[given.length - 1] + 1; i < FRAMES; i++) out[i] = out[given[given.length - 1]];
  for (let g = 0; g < given.length - 1; g++) {
    const a = given[g], b = given[g + 1];
    for (let i = a + 1; i < b; i++) {
      const t = (i - a) / (b - a);
      out[i] = {
        x: lerp(out[a].x, out[b].x, t), y: lerp(out[a].y, out[b].y, t),
        scale: lerp(out[a].scale, out[b].scale, t),
        opacity: lerp(out[a].opacity, out[b].opacity, t),
        rot: lerp(out[a].rot, out[b].rot, t),
      };
    }
  }
  return out;
}

function buildCast() {
  const layer = document.getElementById('fb-cast');
  if (!layer) return;
  stopCastTick();
  layer.innerHTML = '';
  cast = CAST.map(def => {
    const el = document.createElement('button');
    el.type = 'button';
    // `def.cls` already carries its own identity plus the shared box/
    // column/slot classes stackActors() built it with.
    el.className = 'fb-actor ' + def.cls;
    el.innerHTML = def.html;
    if (def.onpress) el.addEventListener('click', def.onpress);
    layer.appendChild(el);
    // Fetched once per mount, after the element exists, and never
    // awaited by anything: an actor whose rows have not landed yet is
    // still an actor, and the book must not wait on the network.
    if (def.load) { try { def.load(el); } catch (e) { console.error(e); } }
    // `laneP` starts already AT the current lane, not at 0 -- a fresh
    // mount has nothing to catch up on, so there is nothing to animate.
    return { def, el, poses: expandPoses(def.poses || {}), pos: 0, laneP: lanePos,
             lag: def.lag == null ? CAST_LAG : def.lag,
             lagFree: def.lagFree == null ? CAST_LAG_FREE : def.lagFree };
  });
  // Every box gets it -- whether a press does anything is asked at the
  // moment of the press (fb-openable), not wired per column, so a box
  // that gains or loses its page mid-session is right either way.
  cast.forEach(wireActorPress);
}

function stopCastTick() {
  if (castTick) { cancelAnimationFrame(castTick); castTick = null; }
}

// Starts the shared tick if it isn't already running -- the one place
// that does, so anything that moves a target the cast chases (the
// book's `castTarget`, or the lane's own `lanePos`) can just call this
// rather than each keeping its own copy of the same three lines.
function ensureCastTick() {
  if (!castTick) { castLast = performance.now(); castTick = requestAnimationFrame(castStep); }
}

// Where the book is; the actors will get there in their own time.
// Where the book is; the drawings and the actors will each get there in
// their own time.
function aim(p, snap) {
  castTarget = Math.max(0, Math.min(FRAMES - 1, p));
  if (snap) {
    stopCastTick();
    framePos = castTarget;
    for (const a of cast) a.pos = castTarget;
    paintFrame();
    paintCast();
    paintBarLevel();
    return;
  }
  ensureCastTick();
}

// One ease, used by the drawings and by every actor, so they cannot
// drift apart in how they feel. Per elapsed time rather than per frame,
// so 60Hz and 120Hz behave the same rather than the faster screen
// catching up twice as fast.
function ease(pos, target, lag, dt) {
  const d = target - pos;
  if (Math.abs(d) < 0.0015) return target;
  return pos + d * (1 - Math.pow(1 - lag, dt / 16.6667));
}

function castStep(now) {
  const dt = Math.min(64, now - castLast) || 16.7;
  castLast = now;
  let moving = false;
  // Which pair is live depends on whether a finger is on the glass. The
  // rate can change mid-flight without a jump: it governs how fast the
  // gap closes, never where anything is.
  const held = !!drag;
  const fp = ease(framePos, castTarget, held ? FRAME_LAG : FRAME_LAG_FREE, dt);
  if (fp !== framePos) { framePos = fp; moving = true; }
  paintFrame();
  paintBarLevel();
  for (const a of cast) {
    const np = ease(a.pos, castTarget, held ? a.lag : a.lagFree, dt);
    if (np !== a.pos) { a.pos = np; moving = true; }
    // The lane fade chases `lanePos` on the actor's OWN lag too -- see
    // paintCast() -- so a column's three boxes stagger leaving a lane
    // exactly as they already stagger arriving at or leaving a slide:
    // same ease(), same per-slot rate, just a second target.
    const nlp = ease(a.laneP, lanePos, held ? a.lag : a.lagFree, dt);
    if (nlp !== a.laneP) { a.laneP = nlp; moving = true; }
  }
  // The compass's wave (see NAV_RUN_MS). It keeps the tick alive on its
  // own account: the letters are still crossing after the strip itself
  // has landed.
  if (held) {
    if (navP !== lanePos) { navP = lanePos; moving = true; }
  } else if (navP !== lanePos) {
    const d = lanePos - navP;
    const stepP = dt / NAV_RUN_MS;
    navP = Math.abs(d) <= stepP ? lanePos : navP + Math.sign(d) * stepP;
    moving = true;
  }
  paintCast();
  // The position marks ride the eased frame position, so they are
  // repainted here rather than only when the lane changes.
  paintNav();
  // Every frame, not only when the tick stops: an actor that has come
  // near enough to its own slide is pressable, even while the last few
  // pixels are still easing in.
  armCast();
  if (moving) castTick = requestAnimationFrame(castStep);
  else castTick = null;
}

// The actors move continuously between poses while the frame index
// jumps whole numbers: a flip book flips, but type sliding in
// whole-pixel steps shimmers.
function paintCast() {
  for (const a of cast) {
    const p = a.pos;
    const lo = Math.max(0, Math.min(FRAMES - 1, Math.floor(p)));
    const hi = Math.max(0, Math.min(FRAMES - 1, lo + 1));
    const t = p - lo;
    const A = a.poses[lo], B = a.poses[hi];
    const y = lerp(A.y, B.y, t);
    const sc = lerp(A.scale, B.scale, t), rot = lerp(A.rot, B.rot, t);
    // ── Leaving a lane is a FADE, not a slide ──
    // Where the reader is standing relative to THIS actor's lane, in
    // lanes: 0 standing on it, 1 a lane away. It is the whole of what
    // an actor knows about the strip -- nothing here knows which lane is
    // which -- and all it does is take the actor's ink away. They used
    // to be pushed a lane's width sideways as well, on top of whatever
    // pose the book had them in; two things travelling in the same
    // gesture (the cast sliding one way, the strip the other) read as
    // the page being dragged apart rather than as one screen giving way
    // to another. The petek is what arrives, so what leaves should only
    // stop being there.
    //
    // `a.laneP` rather than the shared `lanePos`: the strip itself (the
    // wash, the hexagons, the nav bar) still moves on the one true
    // `lanePos`, but each actor chases it at its own lag (see
    // castStep()), which is what makes a column's three boxes enter and
    // leave a lane in the same staggered order they already enter and
    // leave a slide.
    const d = Math.max(-1, Math.min(1, a.laneP - a.def.lane));
    const x = lerp(A.x, B.x, t);
    a.el.style.transform = 'translate3d(' + x + '%,' + y + '%,0) scale(' + sc + ')' +
                           (rot ? ' rotate(' + rot + 'deg)' : '');
    a.el.style.opacity = String(lerp(A.opacity, B.opacity, t) * (1 - Math.abs(d)));
  }
}

// Alive only when the book is actually resting on the stop an actor
// belongs to. Mid-flight, and on any other stop, it is a drawing.
// How close an actor has to be to its own slide before it will take a
// press. Not zero: an exponential ease never quite arrives, and waiting
// for the last thousandth left the card unpressable for the better part
// of a second after it had visibly stopped. 0.05 of a slide is about
// six pixels of drift left -- close enough to press, far enough that
// nothing is live while it is still visibly travelling.
const LIVE_EPS = 0.05;

// ── THE PRESS ──
// A box that just grew a chunky foot (see the CSS) is pushed the way
// that foot suggests: the border-bottom thins as the block sinks into
// its base, a grey shadow grows under the top edge, and the printed
// content rides down with the face -- three plain CSS transitions keyed
// to one class (.fb-pressing, see the stylesheet). None of those three
// properties is the one paintCast() writes every frame (`transform` on
// the actor itself), so unlike everything else on this page a press
// here needs no number computed on the tick -- the browser interpolates
// it, and this function is only the gate that decides when the class is
// true.
//
// Pointer events, never :active -- which sticks after a tap on iOS and
// would leave a box looking permanently pressed. A flick that merely
// passed over a box on its way somewhere else never sees the class:
// pointerleave and pointercancel both clear it exactly as pointerup does.
function wireActorPress(a) {
  const el = a.el;
  const down = () => {
    if (!el.classList.contains('fb-openable') || !el.classList.contains('live')) return;
    el.classList.add('fb-pressing');
  };
  const up = () => el.classList.remove('fb-pressing');
  el.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(e => el.addEventListener(e, up));
}

function armCast() {
  // The drawings are part of "settled" now: while they are still
  // catching up the book is visibly mid-flip, whatever `at` says. So is
  // the petek: an actor on its way off the screen is a picture of a
  // button exactly as one mid-flip is.
  const settled = ready && !drag && !anim && !laneRun &&
                  Math.abs(framePos - castTarget) < LIVE_EPS;
  for (const a of cast) {
    // Its own stop AND its own lane: slide 12 is three screens, and an
    // actor belongs to one of them. `a.laneP`, not `lanePos` -- a box
    // still catching up to its own lane (see paintCast()) is still
    // fading in, whatever the strip itself has already reached.
    a.el.classList.toggle('live', settled &&
      Math.abs(a.pos - a.def.live) < LIVE_EPS &&
      Math.abs(a.laneP - a.def.lane) < LIVE_EPS);
  }
  // Where the BOOK is, which is a different question from whether the
  // cast is live: a finger on the glass makes nothing live, but it does
  // not move the book off slide 12 -- and a lane pull begins with a
  // finger already down. Asking `!drag` here is what made the very
  // gesture this flag gates impossible: armCast runs on pointerdown, so
  // the flag was cleared a frame before it was read.
  atLaneStop = ready && Math.abs(framePos - LANE_STOP) < LIVE_EPS;
}

// Showing a frame is one class swap. Nothing else touches the DOM
// during a drag, which is what keeps the main thread free enough to
// track the finger.
// Which drawing is up. The position is continuous and eased like an
// actor's; what is whole-numbered is only the frame it lands on -- a
// flip book flips, and blending two drawings makes a third nobody drew.
function paintFrame() {
  if (!imgs.length) return;
  const i = Math.max(0, Math.min(FRAMES - 1, Math.round(framePos)));
  if (i === shown) return;
  if (shown >= 0) imgs[shown].classList.remove('on');
  imgs[i].classList.add('on');
  shown = i;
}

// ── The bar's second line reads the book's own DEPTH ──
// The reader's own name used to walk sideways with the lane drag; it now
// stays dead centre always (see setBarLevelLabel in profile-card.js), and
// what moves instead is the line under it. TÜRKİYE at the outermost stop,
// İSTANBUL at the middle one, and -- once ILCE_STOP_ENABLED draws a third
// -- the reader's own ilçe at the innermost, the same three distances the
// app map already names. Read off `framePos`, the same continuous number
// the drawings themselves ease toward, so the label turns over right where
// the reader would say it did rather than on a whole-frame jump; the
// halfway point between two stops is the boundary.
const BAR_LEVEL_TURKIYE = 'TÜRKİYE';
const BAR_LEVEL_ISTANBUL = 'İSTANBUL';
let barLevelShown = null;

function paintBarLevel() {
  if (!window.IstProfileCard || !IstProfileCard.setBarLevelLabel) return;
  const s0 = STOPS[0], s1 = STOPS[1], s2 = STOPS[2];
  let label;
  if (s2 == null || framePos <= (s1 + s2) / 2) {
    label = framePos <= (s0 + s1) / 2 ? BAR_LEVEL_TURKIYE : BAR_LEVEL_ISTANBUL;
  } else {
    // The reader's own ilçe is already sitting on the bar's element,
    // written there by profile-card.js from the real profile row -- no
    // second fetch here, just reading the same word back.
    const me = document.getElementById('ist-pc-me');
    label = (me && me.dataset.selfMeta) || BAR_LEVEL_ISTANBUL;
  }
  if (label === barLevelShown) return;
  barLevelShown = label;
  IstProfileCard.setBarLevelLabel(label);
}

// Aim everything at where the book now is. Nothing paints from `p`
// directly any more: the drawings and the actors each ease toward it.
function show(p, snap) {
  aim(Math.max(0, Math.min(FRAMES - 1, p)), snap);
}

// ── Loading ──
// Every frame must be decoded before the book can reach it: an <img>
// whose bytes are not ready paints nothing, and a blank page in the
// middle of a flip is worse than a wait at the start. So the whole of
// that wait happens BEHIND THE LOADING SCREEN -- the sea rising in the
// logo that index.html already opens with (loading-screen.js), held one
// frame short of full until `resolveLoading` is called. The app has one
// wait and one place it is shown; a second one, reported as a count over
// the first drawing while the rest arrived, was the app looking like it
// was still assembling itself at the exact moment it should look like a
// book.
//
// The order below still matters, because it is what the screen is
// waiting on: the frame the reader ENTERS on is fetched alone and
// decoded first, and the rest are fetched in parallel behind it but
// decoded one at a time. The gesture only arms once they are all in, so
// the book is never asked for a page it does not have.
let ready = false;
let resolveLoading = function () {};

async function load() {
  // Whichever way this ends -- including a page torn down mid-fetch --
  // the loading screen is let go. Nothing else can lift it, so an early
  // return here would leave the reader looking at black paper for good.
  try { await loadFrames(); } finally { resolveLoading(); }
  // A brand-new account is walked through the app once, HERE and nowhere
  // else -- this is the only page a member can reach. It goes last on
  // purpose: the tour asks the reader for real pulls and watches the book
  // arrive, so it must not start before the book can be pulled (`ready`,
  // set at the end of loadFrames) or its first gesture beat would wait on
  // a page that cannot answer. Awaited by nothing: onboarding is a whole
  // conversation and the app is usable the moment the frames are in.
  runOnboarding();
}

// Fire-and-forget, and deliberately quiet about every way it can decline:
// no window.IstOnboarding (the script is `defer`red and could be missing),
// no session, the admin kill switch, or an account that has already been
// through it. None of those is a failure the reader should see -- the app
// behind it is complete either way.
//
// The edition notice runs right after, and only when onboarding declined --
// a brand-new account gets the welcome screen on its first launch, never
// both screens stacked on top of each other. It is otherwise independent:
// an onboarded reader gets it every time they open the app in a new
// edition (see edition-notice.js), which needs no session round trip at
// all, only the sun.
async function runOnboarding() {
  if (!window.IstOnboarding) { showEditionNotice(); return; }
  let onboardingRan = false;
  try {
    const { data } = await IstRouter.sb.auth.getUser();
    if (!data || !data.user) return;
    onboardingRan = await IstOnboarding.maybeRun({ sb: IstRouter.sb, user: data.user });
  } catch (err) {
    console.error('onboarding did not run', err);
  } finally {
    if (!onboardingRan) showEditionNotice();
  }
}

function showEditionNotice() {
  if (window.IstEditionNotice) IstEditionNotice.show();
}

async function loadFrames() {
  if (!box) return;
  ready = false;
  imgs = [];
  for (let i = 0; i < FRAMES; i++) {
    const img = new Image();
    img.decoding = 'async';
    img.alt = '';
    imgs.push(img);
  }
  const decode = (img) => (img.decode ? img.decode().catch(() => {}) : Promise.resolve());

  // The first frame is fetched ALONE. Starting them all at once shares
  // the connection between all of them and the first page arrives no sooner than
  // the last -- measured on a 4 Mbps link, 7.9s for both. Fetching it by
  // itself gets it on screen in a fraction of that, and the rest have
  // the whole rest of the wait to arrive in. `fetchPriority` alone does
  // not do this: it reorders a queue, it does not empty one.
  // It is the frame the reader ENTERS on, not frame 0: the book opens on
  // the middle stop, so that is the one drawing that has to be up before
  // anything else has arrived.
  const first = START_SLIDE;
  if ('fetchPriority' in imgs[first]) imgs[first].fetchPriority = 'high';
  imgs[first].src = SRC(first);
  await decode(imgs[first]);
  if (!box || !box.isConnected) return;
  box.appendChild(imgs[first]);
  shown = -1; at = START_SLIDE;
  show(at, true);

  // Now the rest: all fetched at once (the network is idle again and
  // parallel is right for it), decoded one at a time (simultaneous
  // decodes of a 1080x1920 image allocate ~8 MB of surface each, and
  // the book is two dozen of them).
  for (let i = 0; i < FRAMES; i++) if (i !== first) imgs[i].src = SRC(i);

  for (let i = 0; i < FRAMES; i++) {
    if (i === first) continue;
    await decode(imgs[i]);
    if (!box || !box.isConnected) return;
    box.appendChild(imgs[i]);
  }
  ready = true;
  armCast();
}

// ── The gesture ──
// One pointer, vertical only. `at` is where the book was resting when
// the finger landed, so a drag continues from there rather than
// restarting -- pull down twice and it keeps going forward.
let drag = null;

function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }

// ══════════════════════════════════════════════════════════════
// SLIDE 12 IS THREE SCREENS, NOT ONE
//
// The book's stops are its DEPTH -- slide 1 is Türkiye, slide 12 is
// İstanbul, slide 24 is what is inside it. Slide 12 also has a
// SIDEWAYS axis, and it is the app's own carousel laid on the one
// slide that is the city:
//
//        LANE 0            LANE 1           LANE 2
//      Kütüphane   <--    the MAP    -->   Kahvehane
//      (the read)     (where you are in    (the doing)
//                      relation to it all)
//
// left to right on the screen, exactly as the two side tabs stand. A
// pull right walks the strip right, so the reader moves LEFT along it --
// Kahvehane, then the map, then Kütüphane -- and a pull left walks back.
//
// The middle used to be the petek and the map used to be a layer behind
// the logo; the two have swapped. The middle screen is the one every
// other screen is reached FROM, so what belongs there is the shape of
// the app rather than one place inside it -- and the petek is not a
// place in that shape at all, it is the reader, which is what the logo
// on the bar opens now (see THE PETEK below).
//
// Each lane has its own cast, and they never trade places: the buttons
// that left to the right are Kahvehane's and stay gone; the ones that
// arrive from the left are Kütüphane's. Nothing navigates, nothing
// rises from the bottom, and the drawing underneath is left exactly
// where it is -- this is the one screen all three are about, and a
// surface that covered it would take back the thing being answered.
//
// ── And the lane decides which way the book may move ──
// This is the whole point of the divergence rather than a rule bolted
// onto it. Standing on Kütüphane you are facing OUT, so the only depth
// you can reach is slide 1 -- Türkiye. Standing on Kahvehane you are
// facing IN, so the only one is slide 24. Standing on the map there is
// no run at all: the middle is where you choose a direction, not a
// depth to fall down.
//
// So there is no way from Türkiye to the innermost slide that does not
// pass through the middle. That is the mall stairway in the smallest
// form it has ever had here: you cannot go from the reading to the
// doing without walking past the whole shape of the thing -- and the
// people, whose door stands in the middle of it.
// ══════════════════════════════════════════════════════════════
// The thumb distance for ONE lane, as a fraction of the screen's width
// -- stated per lane rather than per strip, the same rule the book's
// own travel follows.
const LANE_TRAVEL = 0.42;
const LANE_RUN_MS = 300;
// ── The walk back to the middle is ANSWERED, not dragged ──
// Every other gesture here follows the finger, and that is right for a
// scrub: the reader is choosing where in the strip to stand. Arriving in
// the middle is not that -- it is the one screen the whole arrangement
// puts there, and it is a place the reader either goes to or does not.
// So a pull toward it does not walk the strip under the finger at all:
// the swipe is READ, and the app answers it by making the move itself.
// The two outward pulls (the map -> either side) still follow the
// finger, because there the reader is stepping off the middle rather
// than into it.
const LANE_SNAP_TRAVEL = 0.18;   // how far the finger goes before the app answers
// px before a drag has to say which axis it is. The book's own gesture
// is vertical and the lanes' is horizontal, so this is the one place
// they are told apart.
const AXIS_SLOP = 8;

// The reader starts on the map, because the book starts on the middle
// stop and the middle stop's middle lane is the map: the lane and the
// depth have to agree, and from here either run of the book is one pull
// away.
let lane = START_LANE;
let lanePos = START_LANE;       // continuous; the drag writes it live
let laneRun = null;
let atLaneStop = false;  // whether the book is standing on LANE_STOP

const clamp01 = (n) => n < 0 ? 0 : n > 1 ? 1 : n;

// How present a lane's own things are: 1 standing on it, 0 a whole lane
// away, and the linear middle in between. One function for the petek
// and for every actor, so nothing can arrive on a different curve from
// its neighbour.
function lanePresence(l) { return 1 - Math.min(1, Math.abs(lanePos - l)); }

// One number drives the wash, the hexagons and every actor's exit: the
// two layers take it as their own opacity (see below), and the actors
// are painted from lanePos here.
function paintLanes() {
  if (!box) return;
  const mid = lanePresence(LANE_MAP);
  // ── Written as OPACITY, on the two elements that consume it ──
  // This used to be one inherited custom property set on `box` every
  // frame, which is the cheapest-looking and most expensive thing in
  // this file: `box` is the ancestor of the whole book, the cast AND the
  // petek, and changing an inherited custom property on an element
  // invalidates the computed style of everything under it. With a real
  // petek standing there -- a few hundred hexagons, each with a masked
  // frame and a masked ring -- a lane walk was recalculating all of it
  // sixty times a second. Measured on a 4x-throttled CPU across one walk
  // in each direction: 1.7s of style recalc, p95 60ms, p99 154ms, 23
  // frames over 32ms. Opacity is not inherited and is composited, so the
  // same picture now costs nothing but a composite.
  const scrim = scrimEl || (scrimEl = document.getElementById('fb-scrim'));
  const mapEl = mapLaneEl || (mapLaneEl = document.getElementById('fb-map'));
  if (scrim) scrim.style.opacity = (mid * 0.86).toFixed(3);
  if (mapEl) mapEl.style.opacity = Math.max(0, Math.min(1, mid)).toFixed(3);
  box.classList.toggle('map-pulling', mid > 0);
  box.classList.toggle('map-open', lane === LANE_MAP && mid >= 1);
  paintCast();
  paintNav();
}

// The two words on the bar are set letter by letter, because the light
// that crosses them travels ALONG them. One <i> per character, each
// carrying its own index, so a frame of the pull is one number written
// per word rather than nine (see "nav b i.fb-ltr" in the stylesheet).
// Idempotent: the bar lives outside #ist-content and survives a mount.
function splitNavMarks() {
  const marks = document.querySelectorAll('#fb-nav b');
  [marks[0], marks[LANES - 1]].forEach((b) => {
    if (!b || b.querySelector('.fb-ltr')) return;
    const word = b.textContent;
    b.textContent = '';
    for (const ch of word) {
      const l = document.createElement('i');
      l.className = 'fb-ltr';
      l.style.setProperty('--i', String(b.children.length));
      l.textContent = ch;
      b.appendChild(l);
    }
  });
}

// THE WAVE. One coordinate, and it is the reader's own travel across the
// strip: how far along its own segment the wave has come, 0 to 1, in the
// direction the finger is going. That is the whole of why there is one
// wave here and not two -- both words are crossed by the same edge, at
// the same moment, going the same way, and the two formulas that turn it
// into a letter's ink are mirrored in the stylesheet rather than here.
//
// The wordmark in the middle has no letters to count, so it takes the
// same front as a gradient stop, with the pale side leading on the way
// in and trailing on the way out.
function paintNavWave(marks, clamp01) {
  const left = marks[0], right = marks[LANES - 1], mid = marks[LANE_MAP];
  if (left) left.style.setProperty('--f',
    (clamp01(navP) * left.children.length).toFixed(3));
  if (right) right.style.setProperty('--f',
    (clamp01(navP - (LANES - 2)) * right.children.length).toFixed(3));
  if (mid) {
    // x < 0 is the walk in from Kütüphane (the wordmark is coming up),
    // x > 0 the walk out to Kahvehane (it is going down). Both are the
    // same edge crossing left to right; only which side of it is pale
    // swaps, and at x = 0 the two spellings agree on "all pale".
    const x = Math.max(-1, Math.min(1, navP - LANE_MAP));
    const incoming = x <= 0;
    mid.style.setProperty('--fb-logo-a', incoming ? 'var(--fb-mark-on)' : 'var(--fb-mark-off)');
    mid.style.setProperty('--fb-logo-b', incoming ? 'var(--fb-mark-off)' : 'var(--fb-mark-on)');
    // The front has to leave the box ENTIRELY at either end, or the two
    // neighbours' light is still on the wordmark while the reader is
    // standing a whole lane away from it: the ramp is 24% of the box
    // wide (+/-12% either side of the front), so a front parked at 0% or
    // 100% leaves a lit sliver against the edge it sits on. It travels
    // -12% -> 112% instead, which is the same journey with both ends of
    // the ramp pushed off the paper -- x = 0 is still all pale, and a
    // whole lane out is now all ink.
    mid.style.setProperty('--fb-logo-f',
      (((incoming ? x + 1 : x) * 124) - 12).toFixed(2) + '%');
  }
}

// The bar says where the reader is standing, continuously: each mark is
// lit by its own lane's presence, the same number the wash and the
// hexagons run on. Off slide 12 the lane still means something -- it is
// which of the two runs the reader is on -- so Kütüphane stays lit all
// the way out to Türkiye and Kahvehane all the way in.
function paintNav() {
  if (!box) return;
  const marks = box.ownerDocument.querySelectorAll('#fb-nav b');
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const pres = [];
  for (let i = 0; i < LANES; i++) {
    const p = lanePresence(i);
    pres.push(p);
    // On the mark itself, never on <html>. Three numbers written to the
    // document root every frame invalidate the computed style of every
    // element in the document -- and the only thing that ever read them
    // is `nav b`'s own --p, three elements with one child each. Same
    // trap as --fb-petek-p above, one scope wider.
    if (marks[i]) {
      marks[i].style.setProperty('--p', p.toFixed(3));
      marks[i].classList.toggle('on', lane === i);
    }
  }
  paintNavWave(marks, clamp01);
}


function setLanePos(p, snap) {
  lanePos = Math.max(0, Math.min(LANES - 1, p));
  // A programmatic placement (a fresh mount, the app map's own walk)
  // puts the wave where the lane is rather than sending it across: a
  // page that opens on Hane must not deal itself an entrance.
  if (snap) navP = lanePos;
  // The strip itself (the wash, the hexagons, the nav bar) reads
  // `lanePos` straight away, unstaggered -- only the cast's own chase of
  // it (see castStep()/paintCast()) needs the tick running, whether this
  // call came from a live drag or from runLane()'s own release tween.
  ensureCastTick();
  paintLanes();
}

// Whether a pull that way has anywhere to go. Not a general "are the
// lanes open": it is the direction as well, so a pull off the end of
// the strip is nobody's and falls through to whatever is underneath.
function lanePullable(dx) {
  if (!atLaneStop) return false;
  // Right walks the strip right, so the reader moves toward lane 0.
  return dx > 0 ? lane > 0 : lane < LANES - 1;
}

// ── What the lane lets the book reach ──
