  <style data-page="project">
    html, body {
      margin: 0; padding: 0;
      background: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #main-site { display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr; min-height: 100dvh; }
    .section-rule { grid-column: 1 / -1; grid-row: 1; display: flex; justify-content: center; align-items: center; }
    main { grid-column: 1; grid-row: 1; position: relative; overflow: hidden; }

    /* ── The flip book itself ──
       Twelve frames stacked in one box, all decoded, one visible at a
       time. Showing a frame is a change of OPACITY and nothing else --
       never a src swap, which blanks an <img> until the new bytes
       decode and would land in the middle of the drag. */
    .fb {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--paper);
      touch-action: none;          /* the page must not scroll under the finger */
      user-select: none;
      -webkit-user-select: none;
    }
    /* `> img`, not ` img`: the frames are direct children of .fb, and a
       descendant selector also caught every image an ACTOR contains --
       which inherited position:absolute, inset:0 and opacity:0 from
       here. The Sözcel wordmark was laid out at full size, invisible and
       out of flow, so its tile collapsed to the height of its label. */
    .fb > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: var(--fb-fit, cover);
      opacity: 0;
      /* No transition. A flip book flips: interpolating two drawings
         makes a third nobody drew. */
      transition: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .fb > img.on { opacity: 1; }

    /* ── The cast ──
       The things that live on a stop -- today, slide 12's. They do not
       appear and disappear: every slide gives each a place, and they
       travel between those places with the finger. Only transforms and
       opacity move, so a slide costs a composite and nothing else. */
    .fb-cast {
      position: absolute;
      inset: 0;
      pointer-events: none;   /* the layer never takes a press */
      z-index: 1;
    }
    .fb-actor {
      position: absolute;
      will-change: transform, opacity;
      /* Off at every slide except its own stop -- see armCast(). An
         actor mid-flight is a picture of a button, not a button. */
      pointer-events: none;
    }
    .fb-actor.live { pointer-events: auto; }

    /* ── One box, three of them a side ──
       Every screen is the maps on top and two columns of three
       rectangles under them (see "What each screen carries" in
       CLAUDE.md): a wider column on the left, a narrower one on the
       right, both the same height. Left:right width is 3:2, and the
       left column's distance from the left edge, the right column's
       distance from the right edge and the gap between the two
       columns are all --fb-inset -- one number stated once rather than
       three that could drift apart. Splitting the remaining width into
       five units and handing 3 to the left column and 2 to the right
       is what keeps the ratio true by construction instead of by two
       widths kept in step by hand. */
    /* Declared on the ROOT rather than on .fb-cast, because the band is
       no longer only the cast's: pressing a box grows it into a window
       filling exactly the rect the six boxes stand in (see THE BAND
       PAGE below), and that overlay is body-level -- outside .fb-cast,
       and so unable to inherit from it. One set of numbers, or the
       window would land a pixel or two off the boxes it came out of and
       the grow would read as a jump. The percentages are unaffected:
       they are substituted at the point of USE and still resolve
       against .fb-cast, which is the box every actor is positioned in. */
    html {
      --fb-inset: var(--screen-inset, 18px);
      --fb-unit: calc((100% - 3 * var(--fb-inset)) / 5);
      --fb-col-l-w: calc(var(--fb-unit) * 3);
      --fb-col-r-w: calc(var(--fb-unit) * 2);
      --fb-box-h: 81px;
      /* The vertical gap between a column's own three stacked boxes is
         --fb-inset, the same number the columns are already built from,
         scaled down 30% -- tighter than the side-to-side gap on purpose,
         since a stack reads as one column and doesn't need as much air
         between its own rows as it does from its neighbour. */
      --fb-box-gap: calc(var(--fb-inset) * 0.7 + var(--fb-kicker-h));
      /* The two top corners are ONE line of type, split. The kicker and
         the timestamp share this size and this line-height so their
         line boxes are identical -- pinned to the same `top`, that is
         what actually puts them on one line. Two sizes chosen
         separately is exactly what read as ragged: a smaller kicker
         with `line-height: 1` sat high while the timestamp's own
         half-leading pushed it down. The page a box grows into prints
         the same pair, off the same two numbers. */
      --fb-box-tag-size: 0.6rem;
      --fb-box-tag-lh: 1;
      /* The kicker stands OUTSIDE the box now -- on its own line just
         above it, ranged to the same edge the column is ranged from (see
         .fb-box .k). So the room it takes is room the column takes: one
         line of tag type plus the air between it and the card it names.
         Stated here as a number the gap and the band are both built
         from, rather than left to each of them to guess at -- a kicker
         taller than the gap it hangs in would print over the box above
         it, and a band that did not include the top one would open the
         page with that kicker standing outside its own window. */
      --fb-box-tag-gap: 4px;
      --fb-kicker-h: calc(var(--fb-box-tag-size) * var(--fb-box-tag-lh) + var(--fb-box-tag-gap));
      /* The band the six boxes stand in, and the window they open into:
         the left column's left edge, the right column's right edge, the
         top slot's top edge and the dock line. Stated as the sum the
         slots are already built from rather than as a fourth number. */
      --fb-band-h: calc(3 * var(--fb-box-h) + 2 * var(--fb-box-gap) + var(--fb-kicker-h));
      /* Oyunlar carries two boxes now, not three (see GAME_DEFS) -- taller
         ones, so the column still fills exactly the band the three used
         to: 2 * this + 1 gap == 3 * --fb-box-h + 2 gaps, the same total
         --fb-band-h is built from. Derived rather than a second literal,
         so the two stay in step if --fb-box-h or --fb-box-gap ever move. */
      --fb-oyun-box-h: calc((3 * var(--fb-box-h) + var(--fb-box-gap)) / 2);
      /* Both columns hang from the same line above the tab bar -- the
         phone's stacks grow upward from the thumb (see "The phone's feeds
         hang from the bottom" in CLAUDE.md). */
      --fb-dock: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px) + 16px);
    }

    /* Every box is cut from the same card stock, whichever column or
       slot it stands in -- only the width and the vertical offset
       differ. */
    .fb-box {
      position: absolute;
      height: var(--fb-box-h);
      box-sizing: border-box;
      /* --lit, not --paper-card: after sunset a box the reader can act
         on is a lit window and the page it stands on is the street (see
         "GECE = THE LIGHTS COMING ON" in frames.css). By day the token
         IS --paper-card, so nothing here changes at noon. */
      background: var(--lit, #ddc4b5);
      border: 2px solid var(--ink);
      font: inherit;
      color: var(--ink);
      text-align: left;
      /* A thicker foot is this site's own convention for a solid card
         (.info-card, .library-card and friends in kutuphane.html /
         kahvehane.html all carry it) -- 2px on three sides, 5px on the
         one the card actually rests on, reading as a base rather than
         an outline. A dashed slot stays uniform (see .fb-empty below):
         it is a placeholder marking where a card would be, not a card
         itself, and the weighted foot is what tells the two apart. */
      /* One pair of insets, reused by the pinned kicker below so its
         text starts at the same distance from the box's edges as the
         title and meta do -- two different paddings chosen separately
         is exactly what read as unaligned. */
      --fb-box-pad-x: 10px;
      --fb-box-pad-y: 7px;
      padding: var(--fb-box-pad-y) var(--fb-box-pad-x);
      /* NOT `overflow: hidden` -- the kicker is printed above the box's
         own top edge (see .fb-box .k) and a clipping box would cut it
         off entirely. Nothing else here needs the clip: `.t` carries its
         own (it is a -webkit-line-clamp), and `.m` is a corner tag of a
         few characters. */
      overflow: visible;
      -webkit-tap-highlight-color: transparent;
    }
    .fb-box.fb-col-l { left: var(--fb-inset); width: var(--fb-col-l-w); }
    .fb-box.fb-col-r { right: var(--fb-inset); width: var(--fb-col-r-w); }
    /* Kahvehane's own pair is the mirror of that: the SHORT column
       (Oyunlar) stands on the left and the LONG one (Etkinlikler) on the
       right, and everything printed inside them is ranged the same way --
       kicker top-right, the red category rule down the right edge. The
       two lanes lean outward from Hane rather than being one layout
       repeated, so the wide column is always the one nearer the screen
       edge the lane sits at. Only the widths and the ranging flip; which
       side of the screen each column is docked to is still fb-col-l /
       fb-col-r, so the slots, the dock line and the press origins are
       untouched. */
    .fb-box.fb-mirror.fb-col-l { width: var(--fb-col-r-w); }
    .fb-box.fb-mirror.fb-col-r { width: var(--fb-col-l-w); }
    .fb-box.fb-mirror { text-align: right; }
    /* Three slots, stacked from the dock line upward. */
    .fb-box.fb-slot-0 { bottom: var(--fb-dock); }
    .fb-box.fb-slot-1 { bottom: calc(var(--fb-dock) + var(--fb-box-h) + var(--fb-box-gap)); }
    .fb-box.fb-slot-2 { bottom: calc(var(--fb-dock) + 2 * (var(--fb-box-h) + var(--fb-box-gap))); }
    /* Oyunlar overrides both: taller boxes (--fb-oyun-box-h, see above)
       stacked two deep instead of three, landing on the same top edge
       the three used to. Cast AFTER the rule above so it wins at equal
       specificity. */
    .fb-box.fb-oyun { height: var(--fb-oyun-box-h); }
    .fb-box.fb-oyun.fb-slot-1 { bottom: calc(var(--fb-dock) + var(--fb-oyun-box-h) + var(--fb-box-gap)); }
    /* A slot with nothing to put in it is drawn as an empty frame --
       the same "nothing here" convention as everywhere else on the site
       (.events-empty, deckFrameHTML): a dashed rectangle marking where
       the thing would be, never a blank gap. */
    /* border-bottom-width and box-shadow both animate on press (see
       .fb-pressing below), so both are stated here rather than only at
       rest. */
    .fb-box:not(.fb-empty) {
      border-bottom-width: 5px;
      /* Two shadows in one list: the light this box spills onto the
         street around it (a no-op transparent shadow by day) and the
         press band's own slot. box-shadow is one property, so they
         cannot be stated separately -- and both states below must
         carry both, in this order, or the press interpolates against
         a list of a different length and pops. */
      box-shadow: var(--lit-glow, 0 0 0 0 rgba(0, 0, 0, 0)),
                  inset 0 0 0 0 rgba(60, 60, 60, 0);
      /* The last two are the "dealt with" fade (see .fb-done below): the
         press's own two properties snap in 0.1s because a finger is on
         the glass, but a box going quiet is a thing the reader watches
         happen as the page folds back into it. */
      transition: border-bottom-width 0.1s ease-out, box-shadow 0.1s ease-out,
                  color 0.4s ease, border-color 0.4s ease, background 0.4s ease;
    }
    .fb-box.fb-empty {
      background: none;
      border: 2px dashed var(--muted, #9a9a9a);
    }
    /* The category flag: a thin red bar down the inside of the left
       edge, on every filled box -- an empty/dashed slot has no category
       to flag, so it stays plain. */
    .fb-box:not(.fb-empty)::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 4px;
      /* --lit-red, not --ink-red: this stripe is printed ON the card, and
         --ink-red is walked a long way down its own hue for the night
         STREET -- on lit paper it is a near-black smudge (see frames.css).
         Scoped to the two pseudo-elements rather than declared on the box,
         deliberately: `.k` is a CHILD of the box but stands on the street
         above it, so a token set here would take the kicker with it and
         drop it from 2.63:1 to 1.32:1 on that paper. By day both tokens
         are the same colour. */
      background: var(--lit-red, #B93631);
      transition: width 0.4s ease, background 0.4s ease;
    }
    .fb-box.fb-mirror:not(.fb-empty)::before { left: auto; right: 0; }
    /* Its own dark cap, growing down from the top exactly as far as the
       press band beside it does (see .fb-pressing below) -- the flag is
       a pseudo-element and paints ABOVE the box's own background, which
       is where that band (an inset box-shadow) lives, so the band would
       otherwise pass invisibly behind the flag: the paper goes into
       shadow while the stripe over it stays lit at full strength. A
       second pseudo-element, on top of the first (::after paints after
       ::before in generated-content order), keyed to the same 0 -> 4px
       offset the band itself animates, so the two grow in lockstep and
       the flag reads as going into the same shadow rather than as a
       second, unrelated colour change. */
    .fb-box:not(.fb-empty)::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 0;
      background: color-mix(in srgb, var(--lit-red, #B93631) 55%, black);
      transition: height 0.1s ease-out;
    }
    .fb-box.fb-mirror:not(.fb-empty)::after { left: auto; right: 0; }
    /* Only a box that answers a press says so under a cursor -- one class,
       set by whichever loader knows (fbSetPage, loadOyunActor). A dashed
       slot, a placeholder and a game whose turn has not come are all
       boxes a press does nothing to. */
    .fb-actor.live.fb-openable { cursor: pointer; }
    /* ── The press ──
       Now that a box has a chunky foot (see the border rule above), the
       press honours that geometry literally rather than borrowing the
       flat card's uniform scale-down: the foot thins as if the block
       has sunk into its base, a flat grey band grows down from the top
       edge as the face recedes from the frame's lip, and the printed
       content rides down with the face by exactly the foot's own loss.
       Simple by construction -- three plain CSS transitions keyed to
       one class -- and, unlike a scale, none of them fight paintCast()'s
       own inline transform: border-bottom-width, box-shadow and a
       child's own transform are none of them the property paintCast
       writes, so there is nothing here for the tick to overwrite.

       The band is a FLAT fill, not a soft shadow -- zero blur, zero
       spread, so it reads as one more sheet of the page's own paper
       (the newspaper convention, a printed panel of tone) rather than
       as a drop shadow. It grows because it IS the offset animating:
       an inset box-shadow of blur 0 paints exactly the strip between
       the box's own top edge and a copy of itself pushed down by the
       offset, so a transition on that offset from 0 to 4px is a flat
       band growing from nothing to 4px tall, hard edge throughout.

       The class itself is still driven by pointer events, not `:active`
       -- `:active` sticks after a tap on iOS, which would leave the box
       looking permanently pressed (see wireCardPress in kutuphane.html). */
    .fb-actor.fb-pressing:not(.fb-empty) {
      border-bottom-width: 2px;
      /* Grey, deliberately never black -- the box's own paper going into
         shadow, not a hole opening in it. The glow rides along unchanged:
         pressing a lit window does not switch it off. */
      box-shadow: var(--lit-glow, 0 0 0 0 rgba(0, 0, 0, 0)),
                  inset 0 4px 0 0 rgba(60, 60, 60, 0.4);
    }
    /* The flag's own cap, same height the band grows to -- see the
       ::after comment above. */
    .fb-actor.fb-pressing:not(.fb-empty)::after {
      height: 4px;
    }
    /* The foot lost 3px (5px -> 2px); the face -- everything printed in
       the box -- drops by exactly that much, so the whole card reads as
       one block sinking rather than as text sliding inside a static
       frame.

       The kicker is deliberately NOT in that set: it stands above the
       box rather than on its face (see .fb-box .k), so riding it down
       would close the gap it hangs in instead of reading as the face
       sinking. */
    .fb-box .m, .fb-box .t, .fb-box .logo {
      transition: transform 0.1s ease-out;
    }
    .fb-actor.fb-pressing .m,
    .fb-actor.fb-pressing .t,
    .fb-actor.fb-pressing .logo {
      transform: translateY(3px);
    }
    @media (prefers-reduced-motion: reduce) {
      .fb-box:not(.fb-empty), .fb-box:not(.fb-empty)::after { transition: none; }
      .fb-box .m, .fb-box .t, .fb-box .logo { transition: none; }
    }

    /* ── What a filled box is OF -- one template for all of them ── */
    /* The date is pinned to the box's own top corner -- `position:
       absolute` at --fb-box-pad-y/-x from its own edge, never a
       normal-flow line that merely happens to start near the top. The
       kicker used to share that line from the other end and now stands
       above the box entirely (see below). Kept as a category label even
       on an empty slot (see the loaders) -- BUGÜN, İSTANBUL and the rest
       are known regardless of whether that bucket has anything in it
       today, so the line over an empty slot still names it. */
    /* The kicker stands ABOVE its box, not inside it -- BUGÜN sits on
       the line over the card it names rather than in its top corner.
       Two reasons, and the first is a bug: inside, the kicker and the
       date share one line ranged to its two ends, so a box whose meta
       runs long ("Bu geceye bir kelime öner") printed the two on top of
       each other. And outside, the category reads as a heading over the
       card rather than as one more thing crowded into it, which is what
       a kicker is. Ranged to the box's own outer edge (no padding
       inset): it is not printed on the card any more, so it lines up
       with the card's frame rather than with the type inside it. */
    .fb-box .k {
      position: absolute;
      bottom: calc(100% + var(--fb-box-tag-gap)); left: 0;
      font-size: var(--fb-box-tag-size); letter-spacing: 0.14em; text-transform: uppercase;
      line-height: var(--fb-box-tag-lh);
      color: var(--ink-red, #B93631);
      white-space: nowrap;
    }
    .fb-box .m {
      position: absolute;
      top: var(--fb-box-pad-y); right: var(--fb-box-pad-x);
      font-size: var(--fb-box-tag-size); line-height: var(--fb-box-tag-lh);
      color: var(--muted);
      /* It has the whole inner width to itself now that the kicker has
         left this line -- and it needs the clamp stated, because the box
         no longer clips (see .fb-box): a long meta would otherwise run
         out past the card's own frame. Cut hard rather than with an
         ellipsis, the same reason .t does. */
      max-width: calc(100% - 2 * var(--fb-box-pad-x));
      white-space: nowrap; overflow: hidden; text-overflow: clip;
    }
    /* Mirrored, both swap sides with the column: the kicker's line above
       the box ranges from its right edge, and the date takes the top-left
       corner inside it. */
    .fb-box.fb-mirror .k { left: auto; right: 0; }
    .fb-box.fb-mirror .m { right: auto; left: var(--fb-box-pad-x); }
    /* Clears the pinned date in the corner above it -- the box's own top
       padding only clears that tag, not a second line under it. Two
       lines, not one -- the box grew 40% taller for exactly this -- and
       text-overflow: clip (paired with -webkit-line-clamp) drops the
       browser's own "…" on the rare headline that still doesn't fit: a
       hard edge, never three dots, because a title cut off with an
       ellipsis reads as unfinished and a title cut off in silence reads
       as a headline that simply ran out of room. */
    .fb-box .t {
      margin-top: 12px;
      font-size: 0.82rem; font-weight: 700; line-height: 1.15;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; text-overflow: clip;
    }
    /* The games column names its game in the BOTTOM-LEFT corner, on
       every lane. The other columns are feeds whose headline is the
       thing itself and reads from the top; this one is a fixed set of
       three read by their names, and a name standing on the floor of
       its box is on the same line in all three of them however long the
       line above it runs. Left even where the box is mirrored: the
       three names are a column of their own and want one edge to be
       ranged from, and it is the edge furthest from the red rule. */
    .fb-oyun .t {
      position: absolute;
      left: var(--fb-box-pad-x); right: var(--fb-box-pad-x);
      bottom: var(--fb-box-pad-y);
      margin-top: 0;
      text-align: left;
      font-size: 1.15rem;
    }
    /* Sözcel's own mark stands in for its title text -- not ranged like
       a title at all, since the mark already reads as a whole thing
       rather than as a word starting from an edge. It fills the box
       (inset by the box's own padding) and is centred both ways, sized
       up or down by object-fit as the box itself grows or shrinks. */
    .fb-oyun .logo {
      position: absolute;
      inset: var(--fb-box-pad-y) var(--fb-box-pad-x);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fb-oyun .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* ── The electric sign, at night only ──
       By day the mark is flat ink like everything else on the card; after
       sunset it is a lit sign standing on a quieter face, the way a real
       shopfront reads once the street goes dark (see "GECE = THE LIGHTS
       COMING ON" in frames.css). Two halves of one effect: the card that
       holds it is walked a step darker than an ordinary lit box (so the
       sign reads as brighter than what it's mounted on, not the same
       brightness twice), and the mark itself carries a warm glow -- a
       tight bright halo plus a soft wider spread, the same warm amber the
       night --lit-glow already spills onto the street with, so the sign
       and the paper agree on what "lit" looks like here. `:has()` finds
       the box that holds a logo rather than a second class kept in step
       with the JS that decides whether one is printed. */
    :root[data-theme="dark"] .fb-box:has(.logo) {
      --lit: color-mix(in srgb, var(--lit) 62%, black);
    }
    :root[data-theme="dark"] .fb-oyun .logo img {
      filter: drop-shadow(0 0 5px rgba(255, 205, 130, 0.9))
              drop-shadow(0 0 16px rgba(255, 160, 80, 0.55));
    }
    /* A game whose turn has not come yet. It still names itself and
       still says what is standing in front of it -- a step you can see
       ahead of you is not the same thing as a slot with nothing in it,
       which is why this is not .fb-empty. Colour only, never opacity:
       an actor's opacity is its pose (see CAST), and a rule here would
       be overwritten by it on the next frame. */
    .fb-box.fb-locked {
      color: var(--muted);
      border-color: var(--muted, #9a9a9a);
      cursor: default;
      /* And its light is off. Redeclaring the token rather than the
         background takes the spill with the paper in one line, and
         never fights the press's own box-shadow on specificity -- see
         frames.css. By day both tokens already mean "not a light", so
         this says nothing at noon. */
      --lit: var(--paper-card, #ddc4b5);
      --lit-glow: 0 0 0 0 rgba(0, 0, 0, 0);
    }
    .fb-box.fb-locked .k { color: var(--muted); }
    .fb-box.fb-locked:not(.fb-empty)::before { background: var(--muted, #9a9a9a); }

    /* ── A box the reader has already dealt with ──
       The story that has been read, the game that has been played, the
       poll that has been answered. Two things at once, and they are one
       gesture: the red rail DRAINS to a hairline and the ink steps back
       to --muted, so the box stops being a card rather than merely
       getting a tick. The rail is the right thing to spend because it
       says nothing a done box still needs to say -- it is one uniform
       --ink-red on every filled box on every lane (the CATEGORY is said
       by the kicker), so what it actually means is "this is a filled
       card", which is exactly what stops being true.

       It reads next to .fb-locked above without colliding, and not by
       luck: gameBlocker only ever locks a game that has an earlier
       unplayed one in front of it, and that earlier game is itself
       always open -- so the Oyunlar column is always
       [done...][open][locked...] and the two greys can never stand
       side by side. Every other column has no locked state at all.
       What the reader is left looking at is a column gone quiet with
       the one thing they can actually do still in full ink.

       Colour only, never opacity -- an actor's opacity is its pose (see
       CAST) and would be overwritten on the next frame, the same reason
       .fb-locked states it that way. A done box is still pressable: a
       story can be read twice, and .fb-openable is untouched here.

       And the PAPER goes 20% translucent with it, so the card starts to
       sink back into the page rather than only changing colour on it.
       It is the box's own background that thins, never `opacity`:
       paintCast() writes the actor's inline opacity on every frame of
       the flip, so a rule here would be overwritten a frame later --
       the same trap .fb-locked's own note is about. A background is
       nothing the tick touches. */
    .fb-box.fb-done:not(.fb-empty) {
      color: var(--muted);
      border-color: var(--muted, #9a9a9a);
      background: color-mix(in srgb, var(--paper-card, #ddc4b5) 80%, transparent);
      /* The light goes out with it -- the shop you have already been to,
         closed for the night. Same one-line form .fb-locked above uses,
         and the reason the background here can go on naming --paper-card:
         that is what --lit means once it is switched off. */
      --lit: var(--paper-card, #ddc4b5);
      --lit-glow: 0 0 0 0 rgba(0, 0, 0, 0);
    }
    .fb-box.fb-done:not(.fb-empty) .k { color: var(--muted); }
    .fb-box.fb-done:not(.fb-empty)::before {
      width: 1px;
      background: var(--muted, #9a9a9a);
    }

    /* A reserved slot -- not yet built (Kahve, Yorumlar), parked
       (Olaylar), or simply unassigned (a Dünya slot with no series
       pinned to it) -- still names its own slot, so a dashed box reads
       as "this is reserved" rather than as the page being broken. */
    .fb-box .ph {
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); text-align: center;
      display: flex; align-items: center; justify-content: center;
      height: 100%;
    }

    /* ── The middle lane: the app map over the book ──
       Slide 12's own reveal, and slide 12's alone. Nothing navigates and
       nothing is opened: the drawing under it stays exactly where it is
       (this is the one screen all three lanes are ABOUT -- covering it
       with a sheet would take back the very thing being answered), goes
       quiet under a wash, and the app's own shape fades in on top.

       Both layers are driven from one number, written onto each of them
       as its own opacity by paintLanes, which is how
       PRESENT the middle lane is: 1 standing on it, 0 a lane away either
       side, and the linear middle in between (lanePresence). So the same
       wash and the same fade run whether the reader came from Kahvehane
       or from Kütüphane, and the petek is at full strength only when
       they are actually standing on it. Nothing here transitions --
       while a finger is on the glass the number is the animation, and
       the release runs it in JS (see runLane).

       The two used to be staggered -- the wash arriving with the finger
       and the windows only over the back half of the pull -- so the page
       went quiet BEFORE the new thing appeared. They cross on purpose
       now: the map starts coming in as the lane's own buttons start
       going out, so the two casts hand over to each other in one
       movement rather than in two. */
    .fb-scrim {
      position: absolute;
      inset: 0;
      background: var(--paper);
      /* Written by paintLanes, as opacity on this element rather than
         through an inherited custom property on the box above it -- see
         paintLanes for what that cost. 0 is the resting state. */
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }
    /* ══════════════════════════════════════════════════════════════
       THE PETEK -- what the İstanbulite logo opens
       ══════════════════════════════════════════════════════════════
       It used to be the middle lane and the app map used to be behind
       the logo; the two have swapped. The reasoning is the same in both
       directions: the middle screen is the one thing every other screen
       is reached FROM, so what belongs there is the app's own shape --
       and the petek is not a place in that shape, it is the reader
       themselves, which is exactly what a mark on the bar should open.

       It is a switch and not a door: the logo opens it, the logo closes
       it again, and it stays lit for as long as the petek is standing --
       the same move Kütüphane's Olaylar box makes.

       It RESTS UNDER THE TWO BARS, and that is load-bearing rather than
       tidy. The map, when it was the thing behind the logo, was the one
       surface on the site that dimmed them (frames.css: nothing may pass
       in front of the two bars) -- and the petek must not inherit that
       exception, because pressing a hexagon names that member on the TOP
       bar and pressing the bar is how their profile is opened. A layer
       over the bar would take away the second half of its own gesture.

       Inside .fb rather than at body level so it is swapped out with the
       page (see "A page script must not delegate on `document`" in
       CLAUDE.md); a press that lands in it is the petek's, and onDown
       hands the whole gesture over for as long as it is open. */
    #fb-petek-layer {
      position: absolute;
      inset: 0;
      z-index: 10;             /* over the map lane and the cast, under the bars */
      opacity: 0;
      transition: opacity 0.22s ease;
      -webkit-tap-highlight-color: transparent;
      /* MOUNTED AND MEASURABLE EVEN WHILE SHUT. `visibility`, never
         `display`: the grid has to keep its box so fitHive has something
         real to measure at any moment. */
      visibility: hidden;
      pointer-events: none;
    }
    #fb-petek-layer.on { opacity: 1; visibility: visible; pointer-events: auto; }
    /* The book goes quiet behind it -- the page's own paper rather than a
       dark scrim, because what is arriving is a drawing on paper too. */
    .fb-petek-wash { position: absolute; inset: 0; background: var(--paper); }
    .fb-petek {
      position: absolute;
      /* Between the two bars, so the reader sits in the middle of the
         room the bars leave. The petek's own geometry -- the cell size,
         the packing, the window it is scaled into, the three depths --
         is .ist-hive-page's in profile-card.css and is never restated
         here; all this is, is the box it stands in. */
      top: calc(env(safe-area-inset-top) + var(--navbar-h-top, 56px));
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px));
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* ── The bottom bar is a COMPASS, not a tab bar ──
       Three marks -- Kütüphane, the İstanbulite wordmark, Kahvehane --
       and none of them is a link. Nothing on this bar is pressed: the
       reader moves the app with their finger, and the bar's whole job is
       to say where that has put them. A tab bar answers "where can I
       go"; this answers "where am I", which is the only question left
       once the swipe is the navigation.

       It lights CONTINUOUSLY, off the same lane presence the wash and
       the hexagons run on (each mark's own --p, written by paintNav), so the
       middle mark comes up as the reader walks toward Hane and goes
       down as they walk off it. A bar that snapped between three states
       would be reporting the result of a gesture; this one is part of
       the gesture.

       It stands where every other bar on the site stands -- pinned to
       the viewport's bottom edge, its own height plus the device's
       inset, contents on --screen-inset (see "The phone's two bars" in
       CLAUDE.md). */
    .section-rule {
      position: absolute; top: 0; left: 0;
      width: 0; height: 0; padding: 0; overflow: visible;
    }
    /* The bar is THINNER here than the site's own tab bar, and it is
       thinner because it carries no tabs: two words and a logo, none of
       which is a target you have to hit. One number, stated where every
       calc on this page already reads it, so the room the page leaves at
       the bottom shrinks with it rather than leaving a strip of dead
       paper above the bar. */
    body {
      --navbar-h: 34px;
      /* ── THE COMPASS'S TWO INKS ARE THE BAR'S, NOT THE PAGE'S ──
         This bar is the charcoal one (frames.css: "the bar is BLACK on
         every page and in every palette, with light-gray labels"), so
         the page's own --ink is BLACK ON CHARCOAL: darker than the paper
         it is printed on, and therefore not a mark at all. Both marks
         are mixed out of the bar's own label tokens instead, which is
         what those tokens are for -- the dark one sits a little above
         the bar so it reads as recessed rather than as missing, and the
         pale one a little under the near-white the site uses for "you
         are here". */
      --fb-mark-off: color-mix(in srgb, var(--navbar-ink-label, #9b9b9b) 52%, var(--navbar-ink, #2e2e2e));
      --fb-mark-on: color-mix(in srgb, var(--navbar-ink-label-active, #f4f4f4) 62%, var(--navbar-ink-label, #9b9b9b));
    }
    header {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom));
      padding: 0 0 env(safe-area-inset-bottom);
      margin: 0;
      border-top: none;
      border-bottom: none;
      /* frames.css already forces this on a phone; stating it here too
         means the desktop window prints the compass on the same paper
         its two inks were mixed against. */
      background: var(--navbar-ink, #2e2e2e);
      z-index: 100;
      display: flex;
      align-items: stretch;
    }
    nav {
      display: flex; width: 100%; height: 100%;
      padding: 0 var(--screen-inset, 18px);
      align-items: flex-end;
      /* Nothing here is pressable, so nothing here takes a press --
         and the map underneath goes on answering a finger that lands
         on the bar's own paper. */
      pointer-events: none;
      -webkit-user-select: none; user-select: none;
    }
    nav b {
      flex: 1;
      display: flex; align-items: flex-end;
      padding-bottom: 5px;
      font-size: 13px; letter-spacing: 0.5px;
      text-transform: uppercase;
      /* THE MARK YOU ARE STANDING ON IS THE PALE ONE. The bar is not a
         menu of places to press -- it is a compass, and what it is
         saying is "the city is over there": the two you are not on are
         the ink, because they are the things still to be gone to, and
         the one under your feet has already been reached and steps
         back. So --ink is the resting colour here and --muted is what
         arriving does to a word.

         The WEIGHT is deliberately not on the same number -- a
         fractional font-weight re-measures the type on every frame of
         the pull, and the bar would jitter its own words while the
         reader dragged. It steps once, on the lane they land on. */
      font-weight: 600;
      color: var(--fb-mark-off);
      transition: none;   /* the finger is the animation */
    }
    /* ...AND IT PALES ONE LETTER AT A TIME, in the direction of the
       swipe. A word that changed colour in one piece would be reporting
       the result of the gesture; a word crossed by a wave is part of it.
       --f is the wave's front, written by paintNav in letters travelled
       (0 .. n), and each letter carries its own index, so the whole
       stagger is one subtraction per letter with nothing per-frame for
       the JS to write but that single number.

       The front runs THE WAY THE FINGER IS GOING, which is why there is
       one wave here and not two: it is the reader's own travel across
       the strip, so both words are crossed by the same edge moving the
       same way at the same moment. Pulling right (Kütüphane -> Hane ->
       Kahvehane) it runs left to right: Kütüphane's K goes to ink first
       and its E last, and Kahvehane's K is the first letter to pale.
       Pulling back the other way is exactly that reversed -- the E ends
       first on either word. */
    nav b i.fb-ltr {
      display: inline-block;
      font-style: normal;
      white-space: pre;
      /* --fb-ltr-on, not --lit: that name belongs to the night's lit
         paper site-wide (frames.css), and this one is a 0..1 scalar --
         a letter inheriting a COLOUR into this calc() is an invalid
         property the wave silently stops on. */
      color: color-mix(in srgb, var(--fb-mark-on) calc(var(--fb-ltr-on, 0) * 100%), var(--fb-mark-off));
    }
    /* Leaving the left-hand mark: a letter is pale until the front
       reaches it and inked once it has passed -- one letter wide, so
       they go over one at a time. */
    nav b:first-child i.fb-ltr { --fb-ltr-on: clamp(0, calc(var(--i) + 1 - var(--f, 0)), 1); }
    /* Arriving at the right-hand one: the same front, read the other
       way round -- a letter is inked until the front reaches it. */
    nav b:last-child  i.fb-ltr { --fb-ltr-on: clamp(0, calc(var(--f, 0) - var(--i)), 1); }
    nav b.on { font-weight: 700; }
    /* --p is that mark's own lane presence, written onto the mark by
       paintNav. It was read from --fb-nav-0/1/2 on <html>; three
       inherited custom properties on the document root, rewritten every
       frame, is a whole-document style invalidation per frame. */
    nav b:first-child  { justify-content: flex-start; }
    nav b:nth-child(2) { justify-content: center; }
    nav b:last-child   { justify-content: flex-end; }
    /* The wordmark in the middle is the app's own name, so it is the
       LOGO itself rather than the name set in type: the two either side
       are places, written; this is the thing you are inside of, drawn.
       Painted as a MASK rather than dropped in as a picture -- the file
       is white letters on black with no transparency, so an <img> on
       this bar is a black rectangle. Luminance-masking it makes the
       letterforms the only ink and lets them take `currentColor`, which
       is the same continuous color-mix the two words either side ride,
       so the middle mark comes up and goes down with the pull exactly
       as they do. */
    nav b:nth-child(2) {
      font-size: 13px; letter-spacing: 0.14em;
      flex: 0 0 auto; padding: 0 10px 7px;
    }
    nav b .fb-logo {
      display: block;
      width: 86px; height: 26px;
      /* The two words either side are crossed letter by letter; the
         wordmark has no letters of its own to count, so the same wave
         crosses it as a gradient -- one hard-ish edge sliding across the
         mask from left to right, pale behind it and ink in front of it
         (and the other way round on the way out). It is the same
         movement, drawn rather than set. */
      background-color: transparent;
      background-image: linear-gradient(90deg,
        var(--fb-logo-a, var(--fb-mark-off)) calc(var(--fb-logo-f, 0%) - 12%),
        var(--fb-logo-b, var(--fb-mark-on)) calc(var(--fb-logo-f, 0%) + 12%));
      -webkit-mask: url('assets/loading/logo-dark-mono-01.jpg') center / contain no-repeat;
              mask: url('assets/loading/logo-dark-mono-01.jpg') center / contain no-repeat;
      -webkit-mask-source-type: luminance;
      mask-mode: luminance;
    }
    nav b .fb-wm {
      display: none;
      color: color-mix(in srgb, var(--fb-mark-on) calc(var(--p, 0) * 100%), var(--fb-mark-off));
    }
    /* A browser that cannot luminance-mask gets the name in type, which
       is what stood here before. */
    @supports not ((mask-mode: luminance) or (-webkit-mask-source-type: luminance)) {
      nav b .fb-logo { display: none; }
      nav b .fb-wm { display: block; }
    }

    /* ══════════════════════════════════════════════════════════════
       THE APP MAP -- the MIDDLE LANE
       ══════════════════════════════════════════════════════════════
       The compass bar says WHERE YOU ARE. This says where you are in
       relation to everywhere else: the app's windows drawn in the shape
       they actually stand in -- the two side lanes across the middle,
       Türkiye hanging off Kütüphane and the ilçe off Kahvehane, because
       those are the depths each of those two lanes can reach and nobody
       else can (see "What each screen carries" in CLAUDE.md) -- and the
       reader's own hexagon in the middle of it.

       It used to be a layer the logo opened over whatever screen the
       reader was standing on, which is why it dimmed the two bars and
       had a backdrop to press. It is a SCREEN now: the middle lane of
       slide 12, reached by the same sideways pull as the two beside it,
       resting under the two bars like everything else the app draws.
       That swap is what the whole arrangement turns on -- the middle
       screen is the one every other screen is reached FROM, so what
       stands there is the shape of the app rather than one place inside
       it (the petek, which is what the logo opens now).

       Three things follow from it being a screen:

       - There is NO "you are here" window to walk to any more. The map
         can only be seen from the map, so the answer would be the same
         every time it was asked. What is marked instead is the one thing
         that is always true of the middle: the reader is in it, and the
         hexagon in the centre is them.
       - Pressing a window does not JUMP there. It walks the app to it
         one transition at a time, through every screen in between (see
         travelTo). A map that teleported would be the shortcut past
         everything, which is the one thing the whole arrangement exists
         to prevent.
       - Pressing the MIDDLE window opens the petek, because that window
         is the reader. The logo is the same door; this is the handle
         that is standing where the thing itself is. */
    /* The red is the ONE red on this layer, so it has to be the
       palette's own red and not a hardcoded one: on the earth palette
       that red is a fire orange, and a mark left at #B93631 was the one
       thing on a brown screen still printed in the mono palette's ink.
       It follows --ink-red for the same reason every other red on the
       site does -- including at night, where the palette walks the
       orange down its own hue (frames.css) because the night paper
       cannot carry the daytime one. */
    :root { --fb-map-red: var(--ink-red, #B93631); }

    #fb-map {
      position: absolute;
      /* Between the two bars, the same room every other screen is drawn
         in -- it is one of the three, not a surface over them. */
      top: calc(env(safe-area-inset-top) + var(--navbar-h-top, 56px));
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px));
      left: 0; right: 0;
      z-index: 3;
      /* paintLanes writes this one; see .fb-scrim above. 0 is the
         resting state -- a lane away either side. */
      opacity: 0;
      /* A lane the reader is not standing on must not eat the book's own
         drag. `visibility` rather than `display`, so the windows keep
         their boxes and nothing re-lays-out mid-pull. */
      visibility: hidden;
      pointer-events: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Live only once the pull has committed. Mid-drag it is a picture of
       a map, exactly as an actor mid-flight is a picture of a button. */
    .fb.map-open #fb-map { visibility: visible; pointer-events: auto; }
    .fb.map-pulling #fb-map { visibility: visible; }

    .fb-map-grid {
      position: absolute;
      inset: 10px var(--screen-inset, 18px) 18px;
      pointer-events: none;   /* only the windows answer a finger */
    }
    /* The closing line and the bottom row of windows share one box now
       that this is a screen rather than a layer over the whole phone --
       so the grid gives the line its strip, and only on the day there is
       a line to give it to. An unconditional reserve would take 50px off
       every other day for nothing. */
    #fb-map:has(> .fb-map-done:not([hidden])) .fb-map-grid { bottom: 56px; }

    /* ── The wires ──
       Drawn against the grid's own thirds rather than measured off the
       windows, so a window changing size never leaves a wire hanging in
       space. They lie UNDER the windows for the same reason. */
    /* Ink on paper. They were a near-white line because this layer used
       to lie over a dark scrim; it lies on the page's own paper now (the
       middle lane's wash, see .fb-scrim), so the whole drawing inverts. */
    .fb-map-wire { position: absolute; background: var(--ink, #17140f); opacity: 0.5; }
    .fb-map-wire.h { height: 6px; top: 50%; transform: translateY(-50%); }
    .fb-map-wire.v { width: 6px; left: 50%; transform: translateX(-50%); }
    .fb-map-wire.w-ku-hane   { left: 16.66%; right: 50%; }
    .fb-map-wire.w-hane-kah  { left: 50%; right: 16.66%; }
    .fb-map-wire.w-ku-tr     { left: 16.66%; top: 50%; bottom: 16.66%; right: auto; }
    .fb-map-wire.w-kah-ilce  { left: 83.33%; top: 16.66%; bottom: 50%; right: auto; }

    /* ── A window ──
       The app's screens are portrait, so these are too. Placed on a 3x3
       whose middle row is the lane strip. */
    .fb-map-win {
      position: absolute;
      width: min(26%, 132px);   /* of the grid, whose columns are its thirds */
      aspect-ratio: 3 / 4;
      transform: translate(-50%, -50%);
      /* --lit, not --paper: the wash behind this lane IS --paper, so a
         window filled with it would be nothing but its own border. And
         after sunset these are the one thing on the site the word
         "window" is already literal about -- the city drawn as its own
         lit windows (see frames.css).

         By day --lit is --paper-card, which is what this rule has always
         resolved to in every state but ONE: --paper-card is undefined on
         the earth palette at noon, and the literal standing in for it
         here was #e9e4dc -- a cool near-white left over from the days
         this layer lay on a dark scrim, printed beside boxes on #ddc4b5.
         The fallback is the boxes' own now, so a window is cut from the
         same card stock as everything else on the screen. */
      background: var(--lit, #ddc4b5);
      box-shadow: var(--lit-glow, 0 0 0 0 rgba(0, 0, 0, 0));
      --ink-red: var(--lit-red, #B93631);
      border: 2px solid var(--ink, #17140f);
      color: var(--ink, #17140f);
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font: inherit;
      pointer-events: auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.14s ease;
    }
    /* Pointer events, never :active -- which sticks after a tap on iOS,
       the same reason .fb-box and Kütüphane's cards press the way they do.
       It mattered less while this was a layer somebody opened (a stuck
       press left with it); the map is a permanent screen now, so a window
       left shrunk would simply stay shrunk. See wireMapPress. */
    .fb-map-win.fb-map-pressing { transform: translate(-50%, -50%) scale(0.955); }
    .fb-map-win.at-r1c3 { left: 83.33%; top: 16.66%; }
    .fb-map-win.at-r2c1 { left: 16.66%; top: 50%; }
    .fb-map-win.at-r2c3 { left: 83.33%; top: 50%; }
    .fb-map-win.at-r3c1 { left: 16.66%; top: 83.33%; }

    /* A locked window (Türkiye, for now) is muted in the ink rather than
       in opacity -- the same rule a locked game tile follows, and for the
       same reason: `paintCast`-style per-frame writes are not in play
       here, but a box that merely looked switched off would read as
       broken rather than as parked. No press-scale either: nothing here
       answers a press with a walk, so nothing here should look like it's
       about to. */
    .fb-map-win.fb-map-locked {
      color: var(--muted, #7a7368);
      /* Parked, so its light is off -- the same one-line form .fb-locked
         uses on a box whose turn has not come. */
      --lit: var(--paper-card, #ddc4b5);
      --lit-glow: 0 0 0 0 rgba(0, 0, 0, 0);
      cursor: default;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .fb-map-win.fb-map-locked.fb-map-pressing { transform: translate(-50%, -50%); }
    .fb-map-soon {
      font-size: 0.62rem;
      font-style: italic;
      letter-spacing: 0.02em;
    }
    .fb-map-name {
      flex: none;
      font-size: 0.5rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1;
      color: inherit;
    }
    /* The stat squares: how much of that window's content the reader has
       actually got through. Squares because the drawing says squares --
       the same shape the right-hand column of every screen is. */
    .fb-map-stats { flex: none; display: flex; gap: 4px; }
    .fb-map-stat {
      flex: 1;
      aspect-ratio: 1;
      border: 1.5px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    /* What is waiting there, in the corner a badge goes. */
    .fb-map-badge {
      position: absolute;
      top: 0; right: 0;
      transform: translate(38%, -38%);
      min-width: 19px; height: 19px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--fb-map-red);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      font-variant-numeric: tabular-nums;
    }
    /* The day, closed. It stands under the windows rather than over
       them: the squares are what has just been finished, and this is
       the sentence they add up to. The deck's own bottom line
       ("Hepsi bu kadar. / Dışarısı seni bekliyor."), promoted to being
       the app's one reward -- the reader is let go, not congratulated. */
    .fb-map-done {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      margin: 0;
      padding: 0 var(--screen-inset, 18px);
      text-align: center;
      font-size: 0.8rem; line-height: 1.45;
      /* Ink on paper, for the same reason the wires are: this used to be
         printed over a dark scrim and is printed on the page now. */
      color: var(--muted, #6b6459);
      pointer-events: none;
      z-index: 2;
    }

    /* ── The logo is the door, so it is bigger and it rests on the floor ──
       It hangs below the bar's own bottom edge on purpose: everything
       else on this bar is a word printed ON the bar, and this is the one
       thing that comes off it. Nothing else here is pressable, so `nav`
       still takes no pointer events at all and only this one mark opts
       back in -- the drawing under the bar's own paper goes on answering
       a finger that lands beside it. */
    nav b.fb-logo-btn {
      pointer-events: auto;
      cursor: pointer;
      background: none;
      border: 0;
      /* ── THE SEA THAT RISES WHEN THE LOGO IS HELD ──
         Held down, the mark fills from the bottom with the loading
         screen's OWN ten drawings (see THE LANGUAGE HOLD in the script,
         and `.fb-hold-frame` below) -- not a computed CSS sea, the actual
         frames, stepped through in real time as the finger stays down.
         At full it changes the app's language. It is the loading
         screen's rising sea met a third time on this one mark -- the
         ring around the letters carries the day (--fb-day), the letters
         carry the lane wave, and this is the MARK'S OWN BODY filling up.
         Because it is the real artwork rather than a mixed tone, it
         reads at its own native black/grey/white regardless of palette
         -- the same deliberate palette-independence the curtain itself
         keeps (see "the loading screen is the third ladder" in
         CLAUDE.md): a splash that is one palette on the way in and
         another on the way out is two different doors. */
      /* A long press on anything pressable is a callout and a selection
         on iOS, and both would land in the middle of this gesture. */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      /* The hold is a vertical-ish nothing, but the book underneath
         reads a sideways drag -- and a press that starts here is this
         mark's, not the strip's. */
      touch-action: none;
      position: relative;
      z-index: 2;              /* over the bar's own ring and wordmark layers */
      /* No translateY here on purpose. `nav` aligns its three columns to
         its own BOTTOM edge (align-items: flex-end) -- so a box taller
         than the row overflows upward, past the header's own top, all
         by itself. That is the whole mechanism: grow the box and its
         foot stays planted where Kütüphane and Kahvehane's own text
         sits, exactly matched by sharing their padding-bottom. */
      padding: 0 10px 5px;
      transition: transform 0.14s ease, filter 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    /* The artwork's own margin is cropped off, so the OUTLINE hugs the
       letters. The file is 1200x400 but the ink inside it is only
       1147x266 -- 15% of the height is empty above it and 19% empty
       below -- so a box fitted to the file is a box with a dead band
       across its top and a bigger one across its bottom. The mask is
       scaled up by the reciprocal of those fractions (100/0.956 across,
       100/0.665 down) so the ink alone fills the box, and the position
       splits the overflow the way the margins are split (left is 75% of
       the horizontal slack, top 44% of the vertical) so it lands
       centred on the ink rather than on the file. Re-measure all four
       numbers if the file is ever redrawn. */
    nav b.fb-logo-btn .fb-logo {
      /* Big enough that the bulk of it stands clear above the header,
         not just a sliver breaking the line. Ratio stays the ink's own
         (4.33:1) so it grows without distorting. */
      width: 208px; height: 48px;
      /* Above the ring the button paints under it (see the note there) --
         the letters are the last thing drawn, on every day. */
      position: relative; z-index: 1;
      -webkit-mask-size: 104.5% 150.9%;
              mask-size: 104.5% 150.9%;
      -webkit-mask-position: 77.4% 44.4%;
              mask-position: 77.4% 44.4%;
    }
    /* A THICK, SOLID ring of the bar's own colour, drawn from a SECOND
       FILE rather than computed in CSS -- `logo-outline-mask.png` is the
       source JPEG thresholded to pure black/white, dilated 10px on a
       24px-padded canvas, and then THE LETTERS THEMSELVES KNOCKED BACK
       OUT of it (scripts/none, done once with Pillow and committed as an
       asset). The knockout is what makes it a ring rather than a PLATE:
       a filled, dilated copy of the wordmark sat behind the letters as a
       slab of the bar's own dark, which above the bar is a brown block
       hanging over the page's paper. What is wanted there is the drawing
       and nothing else -- the letters solid, the contour around them,
       and the page in between. It also carries the alpha channel a CSS
       image mask actually reads: a grayscale PNG with no alpha masks
       NOTHING under `mask-mode: match-source`, which is why this layer
       was a plain rectangle until its shape came from somewhere else. Two failed attempts before this: scaling a second copy of
       the mask scaled the JPEG's own compression noise right along
       with it into a grey smudge, and a ring of `drop-shadow`s left
       semi-transparent seams wherever the source jpg's edges were
       already anti-aliased gray rather than pure black/white. A
       pre-dilated binary mask has neither problem -- its edge is as
       hard as a threshold, so the stroke is solid at any thickness.
       Same scale `s` as the front layer (0.1811 px per source px) so
       the two are exactly concentric; only the size/position numbers
       differ, because the outline was dilated on a padded, larger
       canvas (see the script that made it, in this commit's diff). A
       first pass dilated 23px and merged the letters into one blob --
       this script font's own counters are that tight at 1200x400, so
       10px is as far as the ink can grow before it stops reading as
       type. */
    /* ── AND THE RING IS THE DAY'S OWN SEA ──
       The day is finishable: three category boxes of news, the games
       that are on, the polls that are open. As each one is dealt with
       the sea rises through this ring, and at the last one it is full.
       It is the loading screen's own rising sea (loading-screen.js),
       met again as the progress of a day rather than of a page load --
       and it needs no number printed anywhere, which is the point: a
       streak counts days at you, a level that is simply full says the
       day is done and lets you go.

       It rides the RING and never the letters, deliberately. The
       letterforms are already carrying the lane wave (--fb-logo-a/-b/-f
       above), and two meanings stacked on the same 86x26 mark is mush:
       the letters say WHERE you are standing, the ring around them says
       HOW MUCH of the day is behind you. The ring had no meaning at all
       before this -- it was one flat colour.

       Drawn as background-size rather than a gradient stop because that
       is the property that transitions everywhere: one solid image, no
       repeat, anchored to the bottom, grown from 0% to 100% of the
       ring's own height. --fb-day is written by paintDayMeter(). */
    /* ── IT IS THE BUTTON'S LAYER, NOT THE LETTERS' ──
       This ring used to be `.fb-logo::before`, and it drowned the
       wordmark on the one day it mattered: the letters are the
       `.fb-logo` element's own BACKGROUND, and a `z-index: -1` pseudo
       paints behind its parent's CONTENT but still in front of that
       parent's background (CSS painting order; `.fb-logo` is a stacking
       context of its own because it carries a mask, so the negative
       index cannot escape it). At --fb-day: 0% that was invisible -- the
       ring was a 30% tint -- and as the day filled it turned into solid
       ink laid over letters it is a dilated copy of, so a finished day
       replaced the wordmark with a black blob. Hung off the BUTTON
       instead, it is a sibling layer under `.fb-logo` in the button's own
       stacking context, so the letters are always painted on top of it.
       The inset is the button's own padding, so the ring still lands
       exactly on the logo's box. */
    nav b.fb-logo-btn::before {
      content: '';
      position: absolute; inset: 0 10px 5px; z-index: 0;
      background-color: color-mix(in srgb, var(--navbar-ink, #2e2e2e) 30%, transparent);
      background-image: linear-gradient(var(--navbar-ink, #2e2e2e), var(--navbar-ink, #2e2e2e));
      background-repeat: no-repeat;
      background-position: bottom;
      background-size: 100% var(--fb-day, 0%);
      transition: background-size 0.55s cubic-bezier(.22,.8,.3,1);
      -webkit-mask: url('assets/loading/logo-outline-mask.png') 54.2% 40.4% / 108.7% 169.1% no-repeat;
              mask: url('assets/loading/logo-outline-mask.png') 54.2% 40.4% / 108.7% 169.1% no-repeat;
    }
    /* ── AND THE MARK IS FILLED, NOT A STENCIL ──
       The artwork is an OUTLINE logo: white strokes on black, with the
       letters' own bodies black inside them. Luminance-masked, that
       makes the whole interior a hole -- the map, the page, whatever is
       behind the bar shows straight through the letters, and the mark
       reads as a cut-out rather than as a thing printed on the paper.
       So a solid layer of the bar's own colour is laid under the
       strokes, masked by the mark's SILHOUETTE: the strokes plus
       everything they enclose, flood-filled from outside the artwork
       once with Pillow and committed as `logo-fill-mask.png` (same
       1200x400 canvas as the source JPEG, so it takes the letters' own
       size and position numbers unchanged).

       It is the button's ::after rather than a second layer inside
       .fb-logo for the same reason the ring is its ::before -- a pseudo
       cannot get underneath its own parent's background. Tree order puts
       it over the ring and .fb-logo's z-index puts the letters over
       both: contour, fill, letters. */
    /* At rest (no hold in progress) this is simply the letter interior's
       flat colour, unchanged from before THE LANGUAGE HOLD existed --
       the hold's own layer (`.fb-hold-frame`, right below) sits on top
       of it and hides it while a press is showing the real frames, and
       reveals it again the moment that layer fades back out. */
    nav b.fb-logo-btn::after {
      content: '';
      position: absolute; inset: 0 10px 5px; z-index: 0;
      background: var(--navbar-ink, #2e2e2e);
      -webkit-mask: url('assets/loading/logo-fill-mask.png') 77.4% 44.4% / 104.5% 150.9% no-repeat;
              mask: url('assets/loading/logo-fill-mask.png') 77.4% 44.4% / 104.5% 150.9% no-repeat;
    }
    /* ── THE HOLD'S OWN LAYER -- THE ACTUAL DRAWINGS, STEPPED THROUGH ──
       A real element, not a pseudo (a crossfade needs somewhere to write
       a `background-image` to, and the button already spends its one
       ::before/::after pair on the ring and the resting fill). It wears
       the SAME mask as the resting fill -- `logo-fill-mask.png`, at the
       same size and position -- and sits on the SAME 1200x400 canvas the
       ten loading frames themselves are drawn on (`logo-dark-mono-*.jpg`
       are 1200x400, identically), so a frame dropped in here as the
       `background-image` lands registered pixel-for-pixel under
       `.fb-logo`'s own strokes above it -- no second alignment to keep
       in step with the first.
       Invisible at rest (opacity 0, background-image unset, the resting
       fill showing through underneath); the script sets the image and
       fades it in the moment a hold clears the initial delay, then steps
       the image itself through the ten frames in place as the finger
       stays down -- a flip, not a crossfade, the same idiom the rest of
       this file already uses for its drawings ("a flip book flips").
       z-index sits it between the resting fill (0) and the strokes (1);
       it has to come BEFORE .fb-logo in the markup for that tie to
       resolve the right way, since ::after always paints after every
       real child regardless of z-index ties among equals. */
    nav b.fb-logo-btn .fb-hold-frame {
      position: absolute; inset: 0 10px 5px; z-index: 1;
      background-repeat: no-repeat;
      background-size: 104.5% 150.9%;
      background-position: 77.4% 44.4%;
      -webkit-mask: url('assets/loading/logo-fill-mask.png') 77.4% 44.4% / 104.5% 150.9% no-repeat;
              mask: url('assets/loading/logo-fill-mask.png') 77.4% 44.4% / 104.5% 150.9% no-repeat;
      opacity: 0;
    }
    /* Ta da. The one beat this gesture celebrates itself, and it is the
       same one the day's own full ring gets: a glow, and then the water
       runs back out while the app re-labels around the reader. White
       rather than a palette token -- the frame it is glowing around is
       the loading screen's own material, which never tracks the palette
       either (see the note on the button above). */
    nav b.fb-logo-btn.fb-lang-done {
      filter: drop-shadow(0 0 9px rgba(255, 255, 255, 0.75));
    }
    /* The word the flip says back, printed over the logo rather than
       beside it -- this bar has no room for a row, and the mark is where
       the reader is already looking. On the page's own paper (the logo
       hangs BELOW the bar, so above it is the app), which is why it is
       ink on paper like every other card on the site and not the bar's
       pale label ink. */
    nav b.fb-logo-btn .fb-lang-say {
      position: absolute; left: 50%; bottom: calc(100% + 2px);
      transform: translate(-50%, 6px);
      white-space: nowrap;
      /* Uppercased, and the element carries its own `lang` (written by
         sayLang): CSS case folding is locale-aware and this document is
         lang="tr", so an English word uppercased under it comes out
         "ENGLİSH". It is also what a screen reader needs to read the
         live region in the right voice. */
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      font-weight: 700;
      color: var(--ink); background: var(--paper-card, var(--paper));
      border: 2px solid var(--ink);
      padding: 3px 8px;
      opacity: 0; pointer-events: none; z-index: 3;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    nav b.fb-logo-btn .fb-lang-say.on { opacity: 1; transform: translate(-50%, 0); }
    /* The day is done. The only moment this app celebrates anything, and
       what it says is "you can stop now". */
    nav b.fb-logo-btn.fb-day-full::before {
      filter: drop-shadow(0 0 7px color-mix(in srgb, var(--navbar-ink, #2e2e2e) 55%, transparent));
    }
    @media (prefers-reduced-motion: reduce) {
      nav b.fb-logo-btn::before { transition: none; }
    }
    nav b.fb-logo-btn:active { transform: scale(0.94); }
    /* Lit while the petek is standing -- it is held down because it is
       the way back out, exactly as Kütüphane's Olaylar box is.
       Nothing on this page dims the two bars any more: the map used to,
       being a layer over the whole screen, and the petek that replaced
       it behind this logo deliberately does not (see #fb-petek-layer --
       the top bar is half of the petek's own gesture). So the site's one
       exception to "THE TWO BARS ARE OMNIPRESENT" is gone with it. */
    body.fb-petek-on nav b.fb-logo-btn {
      color: var(--fb-map-red);
      filter: drop-shadow(0 0 9px color-mix(in srgb, var(--fb-map-red) 55%, transparent));
    }
    /* `color` alone never reached the mark, and that is worth stating
       because it looked like it did: the letterforms are a masked
       GRADIENT between --fb-logo-a and --fb-logo-b, and paintNavWave
       writes both as INLINE styles on the <b> on every frame of a lane
       walk. So only the glow around the logo changed and the logo itself
       kept its lane ink. Declared on the .fb-logo child rather than on
       the <b>, which is what wins: a declaration on the element beats a
       value inherited from its parent's inline style, with no
       !important needed anywhere. The wave those two carry means nothing
       while the petek is standing over the lanes in any case. */
    body.fb-petek-on nav b.fb-logo-btn .fb-logo {
      --fb-logo-a: var(--fb-map-red);
      --fb-logo-b: var(--fb-map-red);
    }

    /* ── THE GAME OVERLAY ──
       Sözcel is still a real, unmodified page (sozcel.html) -- but
       pressing its tile must not leave the book behind: no reload, no
       flash, no lost place in the flip. So it renders inside an iframe
       laid over the book, the same trick kahvehane.html's own now-parked
       game deck used. sozcel.html already knows how to be embedded (it
       checks `window.self !== window.top` and posts a close message
       instead of navigating its own back arrow); nothing there had to
       change.

       It is THE sheet -- the same object that rises from the bottom
       when the reader presses their own name on the profile bar (see
       "THE sheet" in CLAUDE.md and sheet.css). Not a bespoke pop up
       with its own geometry: same markup, same IstSheet.open/close,
       same 0.55s slide, and on a phone the same resting position under
       the profile bar that sheet.js measures live. So the game arrives
       the way every other surface on the site arrives, and there is no
       second transition language to keep in step.

       All this page states is what is genuinely its own: the iframe
       fills the sheet edge to edge, instead of the padded, scrolling
       .ist-sheet-body every other sheet carries -- a game page brings
       its own chrome and does its own scrolling (sozcel.html's
       layoutGame() measures the room it is actually given). */
    #fb-game-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--paper, #f4f1ec);
    }
    /* ══════════════════════════════════════════════════════════════
       THE BAND PAGE — what a box grows into
       ══════════════════════════════════════════════════════════════
       A box is a card with room for a kicker, a timestamp and two lines
       of headline. Pressing it opens the whole of what it was naming,
       and where that page goes is the one place it can go without
       covering the thing it came out of: the band itself -- the left
       column's left edge, the right column's right edge, the top slot's
       top edge, the dock line. It is the same argument Kütüphane's news
       page and Kahvehane's event page make, and it is THE sheet either
       way (same markup, same IstSheet.open/close); only the way it
       ARRIVES differs, and that arrival is the shared IstSheet.grow --
       one clip-path run from the pressed card's own box out to these
       four edges, with the frame drawn by a sibling box so the page is
       never a raw cut edge mid-flight.

       Every number here is the band's own (see the html block above),
       so the window opens exactly on the boxes' edges by construction
       rather than by two sets of numbers agreeing. */
    .fb-page {
      /* frames.css states .ist-sheet's chrome with !important -- rightly,
         since every sheet on the site wears one frame. Three of its
         declarations are wrong for a page that floats in a band rather
         than running off the bottom of the screen: it needs its fourth
         edge back, at the CARD's own chunky foot rather than the sheet's
         thin one (see .fb-box), and it is the card becoming a page, so
         it keeps the card's own paper rather than the sheet's -- lit
         after sunset exactly as that card was, since this IS that card
         standing at full size (see frames.css). The glow needs its own
         !important for the same reason the other three do: .ist-sheet
         states `box-shadow: none` with one. */
      background: var(--lit, #ddc4b5) !important;
      box-shadow: var(--lit-glow, 0 0 0 0 rgba(0, 0, 0, 0)) !important;
      /* Everything printed INSIDE a lit page reads against lit paper,
         so the two tokens the contents name are re-pointed here rather
         than in each of their own rules -- a throw button, the stamp,
         an anket option. One place, and it cannot drift from the paper
         it is standing on. */
      --paper: var(--lit-hi, #eddbd0);
      --paper-card: var(--lit, #ddc4b5);
      --ink-red: var(--lit-red, #B93631);
      border-bottom-width: 5px !important;
      left: var(--fb-inset);
      right: var(--fb-inset);
      bottom: var(--fb-dock);
      top: auto;
      width: auto;
      height: var(--fb-band-h);
      box-sizing: border-box;
      /* It does not slide: it grows. The transform sheet.css slides a
         sheet up with would be fighting the clip-path that opens this
         one, and the page has to be standing exactly where it will end
         up before the window onto it is animated at all. */
      transform: none;
      transition: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-align: left;
    }
    .ist-sheet-overlay.open .fb-page { transform: none; }
    /* The same red category flag the card carried, on the same side --
       the page came out of that column and says so. */
    .fb-page::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 4px;
      background: var(--ink-red, #B93631);
      z-index: 1;
    }
    .fb-page.fb-mirror::before { left: auto; right: 0; }
    /* A real box, not display:contents: the grow cross-fades the page's
       CONTENTS separately from the window opening onto them (see
       IstSheet.grow), and opacity on a box that generates no box of its
       own does nothing at all. */
    .fb-page-inner {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    /* Head / body, and only the body moves: what the page is stays on
       the top line where the card printed it, and the reading scrolls
       under it. The two corners are the card's own two corners, off the
       same two tokens, so the type does not change size on the way out
       of the box. Deliberately NOT mirrored with the column: the arrow
       and the kicker are where the reader's eye lands, and they should
       land in the same place on every lane. What says which column this
       came out of is the red flag, which is the one thing here that
       does flip. */
    .fb-page-head {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--ink);
    }
    .fb-page-head .k {
      font-size: var(--fb-box-tag-size); line-height: var(--fb-box-tag-lh);
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-red, #B93631);
    }
    .fb-page-head .m {
      margin-left: auto;
      font-size: var(--fb-box-tag-size); line-height: var(--fb-box-tag-lh);
      color: var(--muted);
    }
    /* The hand-drawn arrow the game pages and Kütüphane's own story
       pages use -- the site has one back mark, not one per page. */
    .fb-page-back {
      flex: none;
      width: 30px; height: 26px;
      padding: 0; border: 0; background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
    }
    .fb-page-back img { width: 100%; height: 100%; object-fit: contain; }
    .fb-page-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 11px 12px 14px;
      /* The page owns nothing horizontal; the vertical axis stays the
         browser's so this scrolls natively. The book underneath is
         behind an overlay and hears nothing either way. */
      touch-action: pan-y;
    }

    /* ── THE THROW ──
       What an opened page ASKS, and the two ways to answer it. The
       question stands on its own rule at the foot of the reading, so it
       is the last thing in the column rather than a panel over it. */
    .fb-throw-q {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 2px solid var(--ink);
      font-weight: 800;
      font-size: 0.95rem;
      line-height: 1.3;
      text-wrap: balance;
    }
    /* The stamp the paper wears as it goes. It is not a label on a
       control -- it is the answer being printed on the page while the
       reader is still deciding, which is the whole reason nobody ever
       answers a question they did not see. Pinned to the page rather
       than to the scroller, so it does not travel with the reading. */
    .fb-throw-cue {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-7deg);
      padding: 6px 14px;
      border: 3px solid var(--ink-red);
      color: var(--ink-red);
      background: var(--paper-card);
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      max-width: 88%;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      pointer-events: none;
      z-index: 6;
    }
    .fb-throw-cue.on-right { transform: translate(-50%, -50%) rotate(7deg); }
    /* The floor under the gesture: a desktop reader has no finger, and a
       throw is not discoverable the first time. Same chunky foot every
       pressable thing on the site wears, because these genuinely are the
       thing you press. */
    .fb-throw-row {
      display: flex;
      gap: 9px;
      margin-top: 12px;
    }
    .fb-throw-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 9px 8px;
      border: 2px solid var(--ink);
      border-bottom-width: 5px;
      background: var(--paper-card);
      color: var(--ink);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      line-height: 1.2;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      overflow-wrap: anywhere;
    }
    .fb-throw-btn:active { border-bottom-width: 2px; transform: translateY(3px); }
    .fb-throw-note {
      margin-top: 7px;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── THE OFFER ──
       What the games column asks for by day. Plain ruled fields on the
       page's own paper: this is a form on a sheet of newsprint, not a
       dialog, so nothing here is boxed or raised. */
    .submit-label {
      display: block;
      margin: 12px 0 5px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .submit-in {
      width: 100%;
      box-sizing: border-box;
      border: 2px solid var(--ink);
      background: var(--paper);
