// The two ends of the run the reader is standing on. Kütüphane's run is
// slide 1 to slide 12, Kahvehane's is slide 12 to slide 24, and the map
// in the middle has none at all -- it is where a direction is chosen,
// not a depth to fall down.
function laneStops() {
  if (lane === LANE_KUTUPHANE) return [STOPS[0], STOPS[1]];
  // Kahvehane's run is parked (see ILCE_STOP_ENABLED), so it answers the
  // way the middle lane always has: both ends the same stop, which the
  // drag clamps to and the release resolves to without moving. Nothing
  // springs back, because nothing ever left.
  if (lane === LANE_KAHVEHANE && ILCE_STOP_ENABLED) return [STOPS[1], STOPS[2]];
  return [STOPS[1], STOPS[1]];
}

// The release: carry on from where the finger left off. Timed rather
// than frame-paced -- the book runs out at the speed pages turn, but
// this is a wash and a fade, which have no pages in them.
function runLane(to, done) {
  if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
  lane = Math.max(0, Math.min(LANES - 1, to));
  const from = lanePos;
  const dist = Math.abs(lane - from);
  if (dist < 0.001) { setLanePos(lane); armCast(); landLane(); if (done) done(); return; }
  const ms = LANE_RUN_MS * dist;
  const t0 = performance.now();
  const step = (now) => {
    const a = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - a, 3);   // ease out
    setLanePos(from + (lane - from) * e);
    if (a < 1) { laneRun = requestAnimationFrame(step); }
    else { laneRun = null; setLanePos(lane); armCast(); landLane(); if (done) done(); }
  };
  laneRun = requestAnimationFrame(step);
}

// The walk has landed. Arriving in the middle is arriving on the map, so
// the numbers in its squares are asked for again -- behind the 60s cache
// in loadMapStats, so coming back twice in a minute costs nothing, and
// never awaited, because the book must not wait on the network.
function landLane() {
  // ── The edition may have turned while the reader was elsewhere ──
  // Arriving on a lane is exactly the moment it is safe to change what a
  // column carries: nothing is open, nothing is mid-read, and the boxes
  // are about to be looked at for the first time. Never on a timer --
  // see syncEdition for why. Checked before the lane test below, because
  // it is true of every lane and not just the middle one.
  if (syncEdition()) refreshEditionColumns();
  if (lane !== LANE_MAP) return;
  loadMapStats();
}

// ══════════════════════════════════════════════════════════════
// THE PETEK -- what the logo opens
//
// It was the middle lane; the app map that used to stand behind this
// logo is the middle lane now and this is what the logo opens. A switch
// rather than a door, exactly as the map was: the logo opens it, the
// logo closes it again, and it stays lit for as long as the petek is
// standing (see body.fb-petek-on in the stylesheet).
//
// It rests UNDER the two bars, deliberately, where the map used to dim
// them: pressing a hexagon names that member on the TOP bar and pressing
// the bar is how their profile is opened, so a layer over it would take
// away the second half of its own gesture. That also makes this page one
// fewer exception to "THE TWO BARS ARE OMNIPRESENT" (frames.css).
// ══════════════════════════════════════════════════════════════
let petekHideTimer = null;   // nothing pending: the layer is never display:none

function petekIsOpen() {
  const layer = document.getElementById('fb-petek-layer');
  return !!(layer && layer.classList.contains('on'));
}

// Mounted, and kept mounted even while the layer is shut. Two reasons,
// and the second is the one that is easy to miss: the grid has to be
// measurable for fitHive at any moment (which is why the layer hides
// with `visibility`, never `display`), and the app map's middle window
// is the reader's own cell CLONED out of this petek -- with nothing
// mounted there is nothing to clone and the map falls back to a drawn
// figure on every screen.
//
// Every mount re-fetches hive_map(), because somebody else's attachment
// may have carried this whole petek somewhere since it was last drawn.
// It is never remounted while the layer is OPEN, though: that would pull
// the drawing out from under a reader who is standing in it.
function mountPetek() {
  if (petekIsOpen() && document.getElementById('po-hive-mount')) return;
  if (!window.IstProfileCard || !IstProfileCard.mountHivePage) return;
  if (!document.getElementById('fb-petek')) return;
  try {
    const p = IstProfileCard.mountHivePage({
      sb: IstRouter.sb, I18N: window.I18N, mountId: 'fb-petek',
    });
    // The middle window of the app map is a clone of the cell this mount
    // is about to draw, so the map is rebuilt once it lands. Never
    // awaited by anything: the book must not wait on the network.
    if (p && p.then) p.then(() => { if (box) buildMap(); }, () => {});
  } catch (err) { console.error('[proje petek]', err); }
}

function openPetek() {
  const layer = document.getElementById('fb-petek-layer');
  if (!layer || traveling) return;
  if (petekHideTimer) { clearTimeout(petekHideTimer); petekHideTimer = null; }
  // Remounted on the way IN rather than on the way out, so the shape the
  // reader sees is the shape the petek is in right now. mountHivePage
  // draws from the map it was left standing on and only moves it when
  // the fetch lands, so there is no blank beat to watch.
  mountPetek();
  document.body.classList.add('fb-petek-on');
  requestAnimationFrame(() => layer.classList.add('on'));
}

function closePetek() {
  const layer = document.getElementById('fb-petek-layer');
  if (!layer || !layer.classList.contains('on')) return;
  layer.classList.remove('on');
  document.body.classList.remove('fb-petek-on');
  // A member named on the top bar is named BY the petek (see
  // pickHiveMember in profile-card.js) -- left on it, the bar would go on
  // naming a hexagon that is no longer on the screen.
  if (window.IstProfileCard && IstProfileCard.clearBarMember) IstProfileCard.clearBarMember();
}

function onDown(e) {
  if (!ready) return;
  // A press that lands on a live actor is that actor's, not the book's.
  // Without this the book swallows its own buttons: the drag handler
  // takes pointer capture on the way down, which re-targets the eventual
  // click at the capturing element, so the card never hears it. It looks
  // exactly like a dead button and nothing throws.
  if (e.target && e.target.closest && e.target.closest('.fb-actor.live')) return;
  // ── A standing petek owns EVERY gesture ──
  // It is a layer over the book now rather than one of the lanes, so
  // there is nothing here for a drag on it to mean: the depth pull, a
  // hexagon and the field that takes a code are all the petek's, and the
  // way out is the logo. The book takes nothing at all until it is shut.
  //
  // It has to be a bail rather than a capture. The layer is inside .fb,
  // so its events bubble to this box -- and capturing here would
  // re-target every following event at the box and kill the petek's own
  // handlers outright (see wireHiveGestures in profile-card.js).
  if (petekIsOpen()) return;
  // ── A press on a map window is TRACKED but never CAPTURED ──
  // The app map is one of the lanes now rather than a layer over the whole
  // phone, so its windows are inside this box and every press on one
  // arrives here first. Capturing would re-target the eventual click at
  // the box, and the window would never hear it -- a dead button, with
  // nothing thrown, which is the exact trap the actor guard above
  // documents. It is not a bail, though: the map fills most of the middle
  // screen, and bailing would make that whole area a dead zone for the
  // lane swipe. Tracked without capture, a sideways drag over a window
  // still walks the strip and a tap on one still reaches it.
  const onWindow = !!(e.target && e.target.closest && e.target.closest('.fb-map-win'));
  stopAnim();
  if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
  drag = { x: e.clientX, y: e.clientY, from: at, fromLane: lanePos, axis: null, moved: false,
           lastX: e.clientX, lastY: e.clientY, lastT: performance.now(), v: 0, vx: 0 };
  armCast();                    // a press begins: the cast goes inert
  if (!onWindow) box.setPointerCapture && box.setPointerCapture(e.pointerId);
}

function onMove(e) {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  // ── Which gesture is this? ──
  // The book's is vertical and the petek's is horizontal; this is the
  // one place they are told apart, and a drag that turns out to belong
  // to neither is dropped rather than half-answered.
  if (!drag.axis) {
    if (Math.abs(dx) < AXIS_SLOP && Math.abs(dy) < AXIS_SLOP) return;
    drag.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
    if (drag.axis === 'x' && !lanePullable(dx)) { drag = null; armCast(); return; }
    // Right walks the strip right, so the reader moves toward lane 0.
    // Taken once, with the axis: which lane this gesture is aimed at
    // cannot change half way through it. EVERY lane move is answered
    // this way, onto Hane and off it alike -- the strip is a row of
    // three screens the reader either goes to or does not, and a screen
    // that comes half way with the thumb is a choice half made.
    if (drag.axis === 'x') {
      drag.snapTo = Math.max(0, Math.min(LANES - 1, lane + (dx > 0 ? -1 : 1)));
    }
    // Which run the reader is on is the LANE's answer, not the book's --
    // and it is taken once, at the moment the gesture claims its axis,
    // so a drag cannot be re-scoped half way through.
    if (drag.axis === 'y') drag.run = laneStops();
    drag.moved = true;
  }
  const now = performance.now();
  const dt = now - drag.lastT;
  if (drag.axis === 'x') {
    if (dt > 0) drag.vx = (e.clientX - drag.lastX) / dt;
    drag.lastX = e.clientX; drag.lastT = now;
    // The strip follows the finger, like everything else here. A pull
    // right walks the strip right, so the reader moves toward lane 0.
    //
    // At most ONE lane per gesture, however far the finger goes: this is
    // a carousel of three screens, not a scrub through twenty-four, and
    // a swipe that crossed two of them walked the reader straight past
    // the middle -- which is the one screen the whole arrangement exists
    // to put there. The book's own vertical is deliberately not
    // clamped this way: there it IS a scrub.
    // Clamped around the lane the reader is COMMITTED to, not around
    // where the drawing happened to be when the finger went down: an
    // interrupted run leaves those two apart, and clamping to the
    // drawing lets a long drag reach a lane two along.
    // A pull toward the middle is read rather than followed (see
    // LANE_SNAP_TRAVEL): the drawing does not move at all until the
    // finger has said enough, and then the app makes the whole move on
    // its own. Either a throw or enough travel is "enough"; anything
    // less leaves the reader exactly where they were standing.
    if (drag.snapTo !== null && drag.snapTo !== undefined) {
      const far = Math.abs(dx) >= window.innerWidth * LANE_SNAP_TRAVEL;
      if (far || Math.abs(drag.vx) > FLICK) {
        const to = drag.snapTo;
        drag = null;
        runLane(to);
      }
      e.preventDefault();
      return;
    }
    const to = drag.fromLane - dx / (window.innerWidth * LANE_TRAVEL);
    setLanePos(Math.max(lane - 1, Math.min(lane + 1, to)));
    e.preventDefault();
    return;
  }
  if (dt > 0) drag.v = (e.clientY - drag.lastY) / dt;
  drag.lastY = e.clientY; drag.lastT = now;
  // Down is forward. The span is the whole book, so the finger is
  // moving the pages rather than nudging a counter.
  const span = window.innerHeight * TRAVEL;
  const p = drag.from + (dy / span) * (FRAMES - 1);
  // Clamped to the lane's run, not to the book: from Kütüphane the
  // deepest the finger can reach is slide 12, and from Kahvehane the
  // shallowest is. A pull the wrong way simply does not move the paper,
  // which says "not this way" more plainly than springing back would.
  const run = drag.run || STOPS;
  at = Math.max(run[0], Math.min(run[1], p));
  show(at);
  e.preventDefault();
}

// Run to a stop at a steady rate. Deliberately frame-paced rather than
// eased: this is a flip book being let go of, and the pages should turn
// at the speed pages turn.
function runTo(target, done) {
  stopAnim();
  const from = at;
  const dist = Math.abs(target - from);
  if (dist < 0.001) { at = target; show(at); armCast(); if (done) done(); return; }
  const ms = (dist / RUN_FPS) * 1000;
  const t0 = performance.now();
  const step = (now) => {
    const a = Math.min(1, (now - t0) / ms);
    at = from + (target - from) * a;
    show(at);
    if (a < 1) anim = requestAnimationFrame(step);
    else { anim = null; at = target; armCast(); if (done) done(); }
  };
  anim = requestAnimationFrame(step);
}

function onUp() {
  if (!drag) return;
  const wasDrag = drag.moved;
  const axis = drag.axis;
  const v = drag.v;
  const vx = drag.vx;
  const snapTo = drag.snapTo;
  drag = null;
  if (!wasDrag) { armCast(); return; }
  // The lanes: a throw decides by direction, a slow release by how far
  // it got -- the same two rules the book itself releases on, and the
  // same local question, since the strip is a row of stops too.
  if (axis === 'x') {
    // The two candidates are always the lane the reader is on and the
    // ONE next to it in the direction they pulled -- never `floor` of
    // where the drawing ended up, which at a whole number brackets the
    // wrong pair and overshoots by a lane in one direction only.
    const step = (n) => Math.max(0, Math.min(LANES - 1, n));
    // A pull toward the middle that was let go before the app answered
    // it: the strip never moved, so there is nothing to run back -- only a throw
    // still counts, which is the same rule the move itself is read by.
    if (snapTo !== null && snapTo !== undefined) {
      if (Math.abs(vx) > FLICK) runLane(snapTo);
      else armCast();
      return;
    }
    if (Math.abs(vx) > FLICK) { runLane(step(lane + (vx > 0 ? -1 : 1))); return; }
    const dir = lanePos < lane ? -1 : lanePos > lane ? 1 : 0;
    if (!dir) { runLane(lane); return; }
    runLane(Math.abs(lanePos - lane) >= TIP ? step(lane + dir) : lane);
    return;
  }
  // The book only ever comes to rest on a stop, and the question is
  // always local: which of the two stops the finger was let go BETWEEN.
  // A throw decides by DIRECTION; a slow release decides by position.
  const [lo, hi] = bracket(at);
  if (lo === hi) { runTo(lo); return; }
  if (Math.abs(v) > FLICK) { runTo(v > 0 ? hi : lo); return; }
  runTo((at - lo) / (hi - lo) >= TIP ? hi : lo);
}

// ── The page lifecycle router.js drives ──
// Bound to the box rather than to the document, so the listeners leave
// with the page when #ist-content is swapped (see CLAUDE.md: "A page
// script must not delegate on `document` for anything another page also
// has").
function mount() {
  document.getElementById('main-site').classList.add('active');
  box = document.getElementById('fb');
  if (!box) return;
  box.style.setProperty('--fb-fit', FIT);
  // A fresh box, and a fresh #fb-map and #fb-petek inside it. The reader
  // starts on the map because the book starts on the middle stop: the
  // lane and the depth have to agree, or the first pull down is one the
  // lane forbids.
  lane = START_LANE; lanePos = START_LANE; navP = START_LANE;
  atLaneStop = false;
  // Which paper is out, decided before a single box is filled: buildCast
  // runs the loaders, and they each ask fbEdition. Left unset it is null,
  // which every loader reads as the day edition -- so the app would show
  // the morning paper at midnight and nothing would throw.
  syncEdition(true);
  wireEditionReturn();
  buildCast();
  splitNavMarks();  // before paintLanes(): the wave needs its letters
  paintLanes();     // after buildCast: it paints the cast too
  box.addEventListener('pointerdown', onDown, { passive: true });
  box.addEventListener('pointermove', onMove, { passive: false });
  box.addEventListener('pointerup', onUp, { passive: true });
  box.addEventListener('pointercancel', onUp, { passive: true });
  // A fresh box every mount, so the decoded frames have to be put back
  // into it. They are kept, not re-fetched: decoding two dozen
  // 1080x1920 images is the one cost worth paying only once.
  if (imgs.length && ready) {
    imgs.forEach(i => { i.classList.remove('on'); box.appendChild(i); });
    shown = -1; at = START_SLIDE; show(at, true); armCast();
    resolveLoading();
  } else {
    load();
  }
  if (window.IstProfileCard) IstProfileCard.setPage('project');
  // The map is one of the lanes and leaves with the content; the game
  // overlay lives at body level. Both wirings are idempotent either way.
  wireMap();
  wireGameOverlay();
  wireFbPage();
  // What a language change has to repaint on this page. Registered
  // against I18N, so the petek's own preference row and the logo's hold
  // relabel the app by exactly the same path.
  wireLangRelabel();
  // ── The middle lane is drawn before it is looked at ──
  // It is a screen the reader is already standing on when the page
  // opens, not something that gets built on a press, so it is drawn on
  // mount and its numbers asked for straight away. Both are best-effort
  // and neither is awaited (see an actor's own load).
  buildMap();
  loadMapStats();
  // The petek is mounted from the start and simply kept hidden (see
  // mountPetek): the map's own middle window is a clone of the reader's
  // cell out of it, and fitHive has to be able to measure the grid at
  // any moment.
  mountPetek();
  // The ring is painted from whatever the last visit worked out before
  // the fetches are asked again, so a swipe back does not empty the sea
  // for a round trip and then refill it. Never awaited: the book must
  // not wait on the network (see an actor's own load).
  paintDayMeter();
  refreshDayMeter();
}
function unmount() {
  stopAnim();
  // The petek layer leaves with the content, but the body class that
  // lights the logo does not -- and the logo is on the bar, which
  // outlives this page. The game overlay is body-level outright.
  closePetek();
  if (petekHideTimer) { clearTimeout(petekHideTimer); petekHideTimer = null; }
  document.body.classList.remove('fb-petek-on');
  closeGameOverlay(true);
  snapFbPageShut();
  traveling = false;
  if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
  // The petek leaves two things behind it that live OUTSIDE this page --
  // the depth classes on <html> and the module's own _hive, which every
  // in-flight fetch checks itself against before drawing. Both have to
  // be unwound or they are the last word on a page that is gone (see
  // unmountHivePage in profile-card.js).
  if (window.IstProfileCard && IstProfileCard.unmountHivePage) IstProfileCard.unmountHivePage();
  // The bar outlives this page too (it is outside #ist-content), so the
  // depth label it was showing has to be handed back to the real district.
  if (window.IstProfileCard && IstProfileCard.clearBarLevelLabel) IstProfileCard.clearBarLevelLabel();
  barLevelShown = null;
  lane = LANE_KUTUPHANE; lanePos = LANE_KUTUPHANE;
  atLaneStop = false;
  drag = null; box = null; scrimEl = null; mapLaneEl = null;
  // Nothing of the lane's own is left on <html> any more (see paintNav);
  // the leftovers from an older shape are cleared for a reader whose
  // browser still has them on the root from a previous visit.
  const root = document.documentElement;
  for (let i = 0; i < LANES; i++) root.style.removeProperty('--fb-nav-' + i);
}

// ══════════════════════════════════════════════════════════════
// THE APP MAP -- the middle lane
//
// The compass says where you are. This says where you are IN RELATION
// TO EVERYWHERE ELSE: the app's windows drawn in the shape they actually
// stand in -- the two side lanes either side of the middle, Türkiye
// hanging off Kütüphane and the ilçe off Kahvehane, because those are
// the depths those two lanes can reach -- with the reader's own hexagon
// standing in the middle of it.
//
// A window is a (lane, slide) pair and nothing else, so the map cannot
// drift from the app: there is no second table of places here, only the
// ones the book and the lane strip already have between them. The one
// exception is the middle window, which is not a place on the strip at
// all: it is the reader, and pressing it opens the petek -- the same
// door the logo is.
//
// There is deliberately no "you are here" window any more. The map used
// to be a layer openable from anywhere, so the question had a different
// answer each time; now it can only be seen from the map, and the only
// thing always true of the middle is that the reader is in it. That is
// what the red hexagon says.
// ══════════════════════════════════════════════════════════════
// No map artwork on these any more, and no hexagon in the middle -- the
// map used to carry a thumbnail per window and the reader's own petek
// cell cloned into the centre one, and both read as scenery competing
// with the two boxes that actually matter. What is here now is two plain
// screens, named honestly: Kütüphane on the left, Kahvehane on the right
// -- the app itself, for now, while everything past İstanbul (Türkiye)
// is parked (see `locked` below) and Hane's own window is gone outright,
// since the logo already opens the petek from anywhere and a second door
// to the same place was the one thing this layer never needed.
const MAP_WINDOWS = [
  // The ilçe window only exists while the stop it walks to does. A map
  // is a map OF the app, so a window onto a screen no gesture can reach
  // would be the one thing this layer must never be: a picture of a
  // place that is not there. It comes back with ILCE_STOP_ENABLED, along
  // with the wire drawn to it in the markup above.
  ...(ILCE_STOP_ENABLED ? [{ id: 'ilce', cell: 'r1c3', lane: LANE_KAHVEHANE, slide: STOPS[2],
    name: 'İlçen', stats: ['kahve', 'yorum'] }] : []),
  { id: 'kutuphane', cell: 'r2c1', lane: LANE_KUTUPHANE, slide: STOPS[1],
    name: 'Kütüphane', stats: ['haber', 'anket'] },
  { id: 'kahvehane', cell: 'r2c3', lane: LANE_KAHVEHANE, slide: STOPS[1],
    name: 'Kahvehane', stats: ['etkinlik', 'oyun'] },
  // Türkiye is parked, not deleted -- locked and honestly labelled
  // "Yakında" rather than silently doing nothing on a press, the same
  // rule a locked game tile already follows ("Önce Sözcel"). No `lane`/
  // `slide` at all: a locked window is never walked to.
  { id: 'turkiye', cell: 'r3c1', name: 'Türkiye', locked: true },
];

// What each square counts. A dash is a square whose content is parked
// (Fikirler) or not lifted out of the parts bin yet -- it still prints,
// because the shape of a screen should not change on the day its numbers
// arrive.
let mapStats = null;      // { key: 'a/b' } once loaded
let mapBadges = null;     // { windowId: n }
let mapStatsAt = 0;       // when, so coming back a minute later is free
let traveling = false;

function mapWinHTML(w) {
  // A locked window is honest about being parked rather than silently
  // doing nothing on a press -- the same rule a locked game tile already
  // follows ("Önce Sözcel"): it names what is coming rather than
  // pretending to work. No stats either; there is nothing behind it yet
  // to count.
  if (w.locked) {
    return '<span class="fb-map-name">' + w.name + '</span>' +
           '<span class="fb-map-soon">Yakında</span>';
  }
  // `> 0`, not `!= null`: this is a permanent screen now rather than a
  // layer the reader opened, so a red "0" would be sitting on the map all
  // day saying nothing. Nothing waiting means no badge.
  const badge = mapBadges && mapBadges[w.id] > 0
    ? '<span class="fb-map-badge">' + mapBadges[w.id] + '</span>' : '';
  const stats = (w.stats || []).map(k =>
    '<span class="fb-map-stat">' + ((mapStats && mapStats[k]) || '–') + '</span>').join('');
  return '<span class="fb-map-name">' + w.name + '</span>' +
         (stats ? '<span class="fb-map-stats">' + stats + '</span>' : '') +
         badge;
}

function buildMap() {
  const grid = document.getElementById('fb-map-grid');
  if (!grid) return;
  grid.querySelectorAll('.fb-map-win').forEach(n => n.remove());
  // The wire to a parked window goes with it. Done here rather than in
  // the markup so the two can never disagree: the same flag that drops
  // the window drops the line drawn to it.
  if (!ILCE_STOP_ENABLED) grid.querySelectorAll('[data-wire="ilce"]').forEach(n => n.remove());
  for (const w of MAP_WINDOWS) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'fb-map-win at-' + w.cell + (w.locked ? ' fb-map-locked' : '');
    el.innerHTML = mapWinHTML(w);
    // A locked window answers a press with a shrug, not a walk -- it
    // carries no click handler at all, the same as a locked game tile.
    if (!w.locked) el.addEventListener('click', () => travelTo(w));
    wireMapPress(el);
    grid.appendChild(el);
  }
}

// The press, driven by pointer events for the reason stated on
// .fb-map-pressing. A flick that merely passed over a window on its way
// somewhere else never keeps the class: pointerleave and pointercancel
// both clear it exactly as pointerup does.
function wireMapPress(el) {
  const down = () => el.classList.add('fb-map-pressing');
  const up = () => el.classList.remove('fb-map-pressing');
  el.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(k => el.addEventListener(k, up));
}

// ── THE GAME OVERLAY ──
// See the CSS block for why: a real page, an iframe rather than a swap,
// so nothing about sozcel.html changes.
function openGameOverlay(href) {
  const layer = document.getElementById('fb-game-overlay');
  const frame = document.getElementById('fb-game-frame');
  if (!layer || !frame) return;
  frame.src = href;
  IstSheet.open(layer);
}
function closeGameOverlay(immediate) {
  const layer = document.getElementById('fb-game-overlay');
  const frame = document.getElementById('fb-game-frame');
  if (!layer || layer.hidden) return;
  // Unloads the game rather than leaving it running behind the layer, so
  // the next open is a fresh start rather than wherever it was left --
  // and only once the sheet is off-screen, never mid-slide (which is
  // exactly what IstSheet.close's `after` is for).
  const done = () => {
    if (frame) frame.src = 'about:blank';
    // A game just played may have moved the Oyunlar square -- let the next
    // map open re-fetch it rather than show a stale count.
    mapStatsAt = 0;
  };
  // A teardown (leaving project.html itself, unmount()) has nothing left
  // to slide in front of, so it skips straight to hidden.
  if (immediate) {
    layer.classList.remove('open');
    layer.hidden = true;
    IstSheet.syncDim();
    done();
    return;
  }
  IstSheet.close(layer, done);
}
function wireGameOverlay() {
  if (document.body.dataset.fbGameWired) return;
  document.body.dataset.fbGameWired = '1';
  // sozcel.html's own back arrow posts this instead of navigating its
  // iframe when it detects it is embedded (window.self !== window.top).
  window.addEventListener('message', (e) => {
    const frame = document.getElementById('fb-game-frame');
    if (frame && e.source === frame.contentWindow && e.data === 'ist-close-game-overlay') {
      closeGameOverlay();
    }
  });
  // The two ways out every other sheet on the site already has, beside
  // the game's own back arrow above.
  const backdrop = document.getElementById('fb-game-backdrop');
  if (backdrop) backdrop.addEventListener('click', () => closeGameOverlay());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && IstSheet.isOpen('fb-game-overlay')) closeGameOverlay();
  });
}

// ── Going there is a WALK, not a jump ──
// The app moves one transition at a time, through every screen between
// here and there: down to the lane stop first (the lanes can only be
// walked from slide 12), then one lane at a time, then out to the
// target's own depth. So the map to the ilçe is two moves and passes
// through Kahvehane's own screen -- you never arrive anywhere without
// having gone past what stands between. That is the whole point of the
// map being a map and not a menu.
function travelTo(w) {
  if (traveling || !ready || w.locked) return;
  traveling = true;
  // `at` is a float, so every comparison against a stop is a tolerance --
  // a strict !== here would leave the walk one imperceptible step short
  // and never clear `traveling`, which locks the map for the session.
  const off = (a, b) => Math.abs(a - b) > 0.001;
  const step = () => {
    // The lanes can only be walked from the middle depth, so a window on
    // another lane is reached by coming back to slide 12 first.
    if (off(at, STOPS[1]) && lane !== w.lane) { runTo(STOPS[1], step); return; }
    if (lane !== w.lane) { runLane(lane + (w.lane > lane ? 1 : -1), step); return; }
    if (off(at, w.slide)) { runTo(w.slide, step); return; }
    traveling = false;
  };
  step();
}

// ── The numbers in the squares ──
// How much of each window's content the reader has actually got through.
// Every one is best-effort and independent: a query that fails leaves
// its own square as a dash rather than taking the map down with it.
async function loadMapStats() {
  if (mapStats && Date.now() - mapStatsAt < 60000) return;
  const sb = window.IstRouter && IstRouter.sb;
  if (!sb) return;
  const stats = {}, badges = {};
  let uid = null;
  try { uid = (await sb.auth.getUser()).data.user.id; } catch (e) {}

  // Haberler: the day's own edition -- read through haberlerData(), the
  // same curated stack the column itself renders, so this square can
  // never disagree with what the reader actually sees there (see
  // db/breaking_news_v3_edition.sql). Türkiye's own "Olaylar" square is
  // gone with its window: a locked window has nothing to count.
  const haber = (async () => {
    const { byBucket, failed } = await haberlerData();
    if (failed) { stats.haber = '–'; return; }
    const rows = HABER_BUCKETS.flatMap(b => byBucket[b] || []);
    // Read through the same two helpers the box and the day meter use
    // (newsDealtStore / newsIsDealt), so this square cannot come to a
    // different answer than the column it is counting -- stamp semantics
    // and the legacy stampless format included.
    const dealt = newsDealtStore(uid);
    const done = rows.filter(r => newsIsDealt(dealt, r)).length;
    stats.haber = done + '/' + rows.length;
    // += rather than =: the anket block below shares this same badge, and
    // the two run concurrently -- whichever resolves second must not
    // overwrite what the first one already added.
    badges.kutuphane = (badges.kutuphane || 0) + (rows.length - done);
  })();

  // Etkinlikler: what is still to come. A count rather than a fraction --
  // an evening is not content to get through, it is somewhere to be.
  const etkinlik = (async () => {
    const { data, error } = await sb.from('events')
      .select('id').gte('event_date', new Date().toISOString());
    if (error) throw error;
    const n = (data || []).length;
    stats.etkinlik = n ? '+' + n : '0';
    badges.kahvehane = (badges.kahvehane || 0) + n;
  })();

  // Oyunlar: today's sequence. A game the admin switched off is on
  // neither side of the fraction -- it is not a step anybody has left to
  // take (see game_day_toggles in CLAUDE.md).
  const oyun = (async () => {
    // Two different date SHAPES, deliberately: game_day_toggles is keyed by
    // the padded ISO key and game_results by the unpadded seed. Both name
    // the NIGHT being played, which spans midnight — the square has to say
    // the same thing at 23:50 and at 00:10, and the boxes it is counting
    // are keyed that way too. Both go through ist-date.js, never a parsed
    // locale string (CLAUDE.md rule 10).
    const all = ['sozcel', 'tumcel', 'bulmaca'];
    const off = await sb.from('game_day_toggles').select('game')
      .eq('game_date', IstDate.gameNight());
    const disabled = new Set(((off.data) || []).map(r => r.game));
    const on = all.filter(g => !disabled.has(g));
    let played = 0;
    if (uid && on.length) {
      const res = await sb.from('game_results')
        .select('game, attempts').eq('user_id', uid).eq('date', IstDate.gameNightSeed());
      // PLAYED means finished. Every game writes an attempts:0 row on the
      // reader's first interaction, so counting rows would call a game
      // still being played done -- the same rule Kahvehane's deck uses.
      const done = new Set(((res.data) || [])
        .filter(r => (r.attempts || 0) >= 1).map(r => r.game));
      played = on.filter(g => done.has(g)).length;
    }
    stats.oyun = played + '/' + on.length;
    badges.kahvehane = (badges.kahvehane || 0) + (on.length - played);
  })();

  // Anket: how many of the active polls this member has already answered.
  const anket = (async () => {
    const { data, error } = await sb.from('neighborhood_polls').select('id').eq('active', true);
    if (error) throw error;
    const rows = data || [];
    let answered = 0;
    if (uid && rows.length) {
      const { data: votes } = await sb.from('neighborhood_poll_votes')
        .select('poll_id').eq('user_id', uid).in('poll_id', rows.map(r => r.id));
      answered = (votes || []).length;
    }
    stats.anket = answered + '/' + rows.length;
    badges.kutuphane = (badges.kutuphane || 0) + (rows.length - answered);
  })();

  await Promise.allSettled([haber, etkinlik, oyun, anket]);
  mapStats = stats;
  mapBadges = badges;
  mapStatsAt = Date.now();
  // Only redraw if the page is still standing: the reader may have gone.
  if (box) buildMap();
}

// ══════════════════════════════════════════════════════════════
// THE LANGUAGE HOLD — press the logo and keep pressing
//
// The logo is a switch that opens the petek. Held down, it is the one
// other thing it can be without becoming a menu: after half a second the
// SEA RISES INSIDE THE MARK, over a second and a half, and at full the
// app changes language — wherever the reader is standing, because this
// bar is standing there too (see "THE TWO BARS ARE OMNIPRESENT").
//
// It is the loading screen's own rising sea (loading-screen.js) met a
// third time, and each of the three fills a different part of the same
// drawing so the three meanings can never be confused: the RING around
// the letters is the day (--fb-day), the LETTERS are the lane wave
// (--fb-logo-a/-b/-f), and the mark's own BODY is this. The other two
// are states the app is in; this one only exists while a finger is on
// it, which is the whole reason it may share the mark at all.
//
// And it is not a computed fill -- it is the loading screen's OWN TEN
// DRAWINGS (`assets/loading/logo-dark-mono-01..10.jpg`), stepped through
// exactly like a flip book as the finger stays down, then run back to
// nothing on release. `.fb-hold-frame` in the stylesheet is the layer
// this writes to.
//
// A language is not a mode with a door, so it gets no tile and no row on
// a settings page: it is one gesture on the thing the app is named
// after. The petek's innermost depth still carries the same preference
// as a pair of buttons (Sen — see profile-card.js), which is the
// keyboard and screen-reader route and what Enter on this mark still
// reaches; this is the shortcut for a thumb.
// ══════════════════════════════════════════════════════════════

const LANG_HOLD_DELAY = 500;    // before the water starts to rise
const LANG_HOLD_FILL = 1500;    // and how long it takes to reach the top
const LANG_HOLD_DRAIN = 320;    // how fast it runs back out again
const LANG_HOLD_TADA = 420;     // how long it stands full before it does
const LANG_HOLD_SAY = 1600;     // how long the mark says what it just did
const LANG_HOLD_SLOP = 12;      // px of travel before this is a drag, not a hold
const LANG_HOLD_FRAME_COUNT = 10;
// Ten frames over the fill's own duration, so the last one lands exactly
// on the tick that commits the flip (see commitLangHold) -- there is one
// number for how long the rise takes, not two that can drift apart.
const LANG_HOLD_FRAME_MS = LANG_HOLD_FILL / (LANG_HOLD_FRAME_COUNT - 1);
const langHoldFrameSrc = n => 'assets/loading/logo-dark-mono-' + String(n).padStart(2, '0') + '.jpg';

let langHold = null;
// Whether the press that is ending got far enough to be about the
// language. The click that follows a pointerup is the petek's door, and
// a reader who just watched the mark fill (or watched it run back out)
// did not also ask for the door.
let langHoldTook = false;
let langSayTimer = null;

function cancelLangHold() {
  if (!langHold) return;
  clearTimeout(langHold.timer);
  if (langHold.frameLoop) cancelAnimationFrame(langHold.frameLoop);
  langHold = null;
}

// Drops the image in and shows it at once -- no fade, the same flip-book
// idiom the rest of this file already uses for its own drawings ("a
// flip book flips"). `transition: none` guards against a leftover fade
// duration from the PREVIOUS hold's drain still being declared inline.
function showHoldFrame(btn, n) {
  const frame = btn.querySelector('.fb-hold-frame');
  if (!frame) return;
  frame.style.transition = 'none';
  frame.style.backgroundImage = "url('" + langHoldFrameSrc(n) + "')";
  frame.style.opacity = '1';
}

// The run back to nothing -- an ordinary opacity fade, not a reverse
// flip through the frames: what it is fading TO is the resting fill
// already sitting underneath it (::after, unchanged since before this
// gesture existed), so nothing needs to be un-shown frame by frame.
function fadeHoldFrame(btn, ms) {
  const frame = btn.querySelector('.fb-hold-frame');
  if (!frame) return;
  frame.style.transition = 'opacity ' + ms + 'ms linear';
  requestAnimationFrame(() => { frame.style.opacity = '0'; });
}

// Reads elapsed time back rather than counting steps, so a dropped
// requestAnimationFrame tick (a busy main thread) is never a frame the
// reader simply never got -- the next tick catches straight up to
// wherever the clock actually is.
function langHoldFrameLoop(startedAt) {
  if (!langHold || !langHold.filling) return;
  const elapsed = performance.now() - startedAt;
  const n = Math.min(LANG_HOLD_FRAME_COUNT,
    1 + Math.floor(elapsed / LANG_HOLD_FRAME_MS));
  if (n !== langHold.frameShown) {
    langHold.frameShown = n;
    showHoldFrame(langHold.btn, n);
  }
  if (elapsed < LANG_HOLD_FILL) {
    langHold.frameLoop = requestAnimationFrame(() => langHoldFrameLoop(startedAt));
  }
}

function onLangDown(e) {
  langHoldTook = false;
  // The tour drives this same mark (it is the petek's door, and its own
  // beat asks the reader to press it) and has a language step of its
  // own. A flip in the middle of that is the app arguing with itself.
  if (document.body.classList.contains('ist-onb-locked')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  cancelLangHold();
  const btn = e.currentTarget;
  langHold = { btn, x: e.clientX, y: e.clientY, filling: false, timer: 0, frameShown: 0 };
  langHold.timer = setTimeout(() => startLangFill(), LANG_HOLD_DELAY);
}

// A finger that travels is not a press. The threshold is checked against
// where it went DOWN rather than against the last frame, so a slow slide
// off the mark cancels just as a quick one does.
function onLangMove(e) {
  if (!langHold) return;
  if (Math.abs(e.clientX - langHold.x) <= LANG_HOLD_SLOP &&
      Math.abs(e.clientY - langHold.y) <= LANG_HOLD_SLOP) return;
  endLangHold();
}

function startLangFill() {
  if (!langHold) return;
  langHold.filling = true;
  // From here on the press is the language's, whatever happens next:
  // the reader has been shown something, so the door must not also open
  // when they let go.
  langHoldTook = true;
  const startedAt = performance.now();
  langHoldFrameLoop(startedAt);
  langHold.timer = setTimeout(() => commitLangHold(), LANG_HOLD_FILL);
}

function endLangHold() {
  if (!langHold) return;
  const btn = langHold.btn;
  const filling = langHold.filling;
  cancelLangHold();
  // Let go part way and the water simply runs back out. Nothing was
  // changed and the drawing says so without a word — which is also why
  // there is no confirmation at the other end: the mark filling to the
  // top IS the confirmation.
  if (filling) fadeHoldFrame(btn, LANG_HOLD_DRAIN);
}

function commitLangHold() {
  if (!langHold) return;
  const btn = langHold.btn;
  cancelLangHold();
  langHoldTook = true;
  // Forced to the last frame rather than trusting the loop's own last
  // tick to have landed exactly here: requestAnimationFrame runs on the
  // browser's own refresh cadence, and this timer can fire a few
  // milliseconds ahead of the next one -- the mark has to be standing at
  // full before it is told the flip is done, not one frame short of it.
  showHoldFrame(btn, LANG_HOLD_FRAME_COUNT);
  if (!window.I18N || !I18N.otherLang) { fadeHoldFrame(btn, LANG_HOLD_DRAIN); return; }
  const next = I18N.otherLang();
  // Ta da. The mark stands full and glowing for a beat — the app is
  // re-labelling itself around the reader while it does — and then the
  // water runs back out of it.
  btn.classList.add('fb-lang-done');
  setTimeout(() => {
    btn.classList.remove('fb-lang-done');
    fadeHoldFrame(btn, LANG_HOLD_DRAIN);
  }, LANG_HOLD_TADA);
  // Applied here and now, and NOT behind the uid: doneUid() is a round
  // trip on the first ask, and a reader who has held the mark to the top
  // is watching for the app to change, not for it to find out who they
  // are. The profile row is written once that lands (saveToSupabase in
  // i18n.js, whose own setLang is then a no-op) -- and it is what the
  // word below is said in, so the flip names itself in the language it
  // has just arrived at.
  I18N.setLang(next);
  sayLang(btn, next);
  doneUid().then(uid => I18N.saveToSupabase(IstRouter.sb, uid, next));
}

// What it just did, in the language it just did it in. A gesture with no
// handle and no menu needs to name its own result once: a reader who
// held the mark by accident would otherwise be left working out what
// changed, and the two values are a LEANING rather than a switch, so the
// word for them is i18n.js's own (one source — the petek's preference
// row prints the same pair).
function sayLang(btn, value) {
  const say = document.getElementById('fb-lang-say');
  if (!say) return;
  say.textContent = I18N.t('lang.' + value);
  say.lang = value === 'more_english' ? 'en' : 'tr';
  say.classList.add('on');
  clearTimeout(langSayTimer);
  langSayTimer = setTimeout(() => say.classList.remove('on'), LANG_HOLD_SAY);
}

// ── Everything the reader can currently see, re-read in place ──
// Registered against I18N rather than called from the hold, so the
// petek's own preference row relabels the app exactly as the hold does
// — one listener, and neither surface has to know what the other has to
// repaint. The cast is never rebuilt, only its boxes filled again (the
// same move refreshEditionColumns makes), so nothing on the strip moves
// under the reader while the words change.
let _langRelabelWired = false;
function wireLangRelabel() {
  if (_langRelabelWired || !window.I18N || !I18N.onChange) return;
  _langRelabelWired = true;
  I18N.onChange(() => {
    refreshAllColumns();
    buildMap();
    loadMapStats();
    relabelGameFrame();
  });
}

// Every cached fetch dropped, then every box filled again. A column's
// cache is keyed by nothing but "already asked", so a language change
// has to drop all of them: the rows they hold carry the text that was
// chosen when they were built (newsText picks title_en/body_en, the
// dates are formatted, the labels are translated), and re-rendering
// them would print the old language from a fresh render.
function refreshAllColumns() {
  etkinlikPromise = null;
  haberlerPromise = null;
  dunyaPromise = null;
  anketPromise = null;
  gamesStatePromise = null;
  submitPromise = null;
  seriesSiblingsCache.clear();
  // The three stackFetch columns cache independently of whatever their
  // own fetcher remembers, so nulling only the promise above would
  // re-render the same rows and look like nothing happened.
  [loadOlaylarActor, loadAnketSonucActor].forEach(f => {
    if (f && f.reset) f.reset();
  });
  (cast || []).forEach(a => {
    if (!a.def.load) return;
    try { a.def.load(a.el); } catch (err) { console.error(err); }
  });
  refreshDayMeter();
}

// ── A PAGE STANDING OPEN NEEDS NOTHING, AND THAT IS WORTH STATING ──
// A story's own body is the most visible thing in the app a flip
// changes, so the obvious thing to do here is re-render an open page
// from its box's fresh payload. There is nothing to re-render: one of
// THE sheet's four ways out is a press outside it, and its backdrop is
// over the bar (the overlay layer is 500, the two bars 400/401) -- so a
// press aimed at the logo while a page stands open closes the page
// before this gesture can begin. The reading the reader had is already
// gone by the time the language could change under it, and the next
// opening builds its page from a column that has been re-read.
//
// The game overlay is the one surface that is NOT like this, and
// deliberately: it lifts its own bottom edge to leave the tab bar
// pressable, because a game is where the reader stays (see THE GAME
// OVERLAY). So it is the one thing below that has to be told.

// A game is a real page in an iframe over the book (see THE GAME
// OVERLAY), with its own I18N — same origin, so the flip can simply be
// told to it. Best-effort: a frame that has not finished loading, or one
// torn down between the flip and this call, is a game that will read the
// stored preference on its next open anyway.
function relabelGameFrame() {
  const overlay = document.getElementById('fb-game-overlay');
  const frame = document.getElementById('fb-game-frame');
  if (!overlay || overlay.hidden || !frame) return;
  try {
    const win = frame.contentWindow;
    if (win && win.I18N && win.I18N.setLang) win.I18N.setLang(I18N.lang);
  } catch (err) { /* the next open reads the stored preference */ }
}

// The logo lives on the bottom bar, which is OUTSIDE #ist-content and so
// survives a virtual navigation -- hence the idempotence guard rather
// than a fresh binding per mount.
function wireMap() {
  const btn = document.getElementById('fb-logo-btn');
  if (btn && !btn.dataset.wired) {
    btn.dataset.wired = '1';
    // The logo is a switch, not a door: it opens the petek and it closes
    // it again, which is why it stays lit while the petek is standing.
    btn.addEventListener('click', () => {
      // ...unless the press that ended was the language hold's (see THE
      // LANGUAGE HOLD above). The flag is cleared by the next pointerdown
      // as well, so a pointercancel -- which is followed by no click at
      // all -- cannot leave it standing to swallow the press after it.
      if (langHoldTook) { langHoldTook = false; return; }
      petekIsOpen() ? closePetek() : openPetek();
    });
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
    });
    // The hold is bound beside the click rather than instead of it: the
    // two are one mark, and which of them a press turns out to be is
    // decided by how long the finger stays on it.
    btn.addEventListener('pointerdown', onLangDown);
    btn.addEventListener('pointermove', onLangMove);
    btn.addEventListener('pointerup', endLangHold);
    btn.addEventListener('pointercancel', endLangHold);
    btn.addEventListener('pointerleave', endLangHold);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  // The petek fills the whole band between the two bars, so there is no
  // backdrop left to press -- the way out is the logo, and Escape.
  if (!document.body.dataset.fbPetekEsc) {
    document.body.dataset.fbPetekEsc = '1';
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && petekIsOpen()) closePetek();
    });
  }
}

IstRouter.registerPage('project', { mount, unmount });

if (!window.__istVirtualNavInjecting) {
  // The loading screen goes up before anything is mounted and comes down
  // once the book is in (see the Loading section above). `force`, because
  // index.html has already marked this browser session as entered on its
  // way here -- and what is being waited for on THIS page is not entry,
  // it is the app itself. A page injected by a virtual navigation has no
  // loading screen in it and none of this runs there.
  if (window.LoadingScreen) resolveLoading = LoadingScreen.start(() => {}, { force: true });
  mount();
  window.addEventListener('DOMContentLoaded', () => {
    if (window.IstProfileCard) IstProfileCard.mount({ sb: IstRouter.sb, I18N: window.I18N, page: 'project' });
  });
}

// ── One deliberate handle, for driving the book from outside ──
// Everything above is inside this wrapper because the four carousel
// pages share ONE document (see router.js): two of them declaring the
// same top-level `const` is a SyntaxError that takes the second page's
// whole script with it. This page had 26 top-level names and one of
// them, NB_NAMES, already collided with mahalle's.
window.__fb = {
  get at() { return at; },
  get framePos() { return framePos; },
  get cast() { return cast; },
  get ready() { return ready; },
  get busy() { return !!(anim || castTick || drag); },
  frames: FRAMES,
  // Put the book at a slide as if it had been dragged there and let go.
  // `show` alone only paints -- it does not move the book -- which is
  // exactly the distinction the drag handler depends on.
  goto(p, snap) {
    stopAnim();
    at = Math.max(0, Math.min(FRAMES - 1, p));
    // A slide off the middle stop can only be reached from one lane, so
    // arriving there by hand has to leave the reader on it -- otherwise
    // the handle can put the book somewhere its own lane forbids.
    if (at < STOPS[1]) { lane = LANE_KUTUPHANE; setLanePos(lane, true); }
    else if (at > STOPS[1]) { lane = LANE_KAHVEHANE; setLanePos(lane, true); }
    show(at, snap !== false); armCast();
  },
  show, armCast,
  lanes: LANES,
  get lane() { return { at: lane, pos: lanePos, atStop: atLaneStop,
                        map: lanePresence(LANE_MAP), stops: laneStops() }; },
  // ── The petek, which is the logo's ──
  // The onboarding tour has to be able to stand the reader in it and
  // take them back out again, and it is behind a press rather than a
  // lane now, so it needs a handle of its own.
  get petekOpen() { return petekIsOpen(); },
  openPetek, closePetek,
  // Put the reader on a lane as if they had pulled there and let go.
  goLane(n, snap) {
    if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
    if (snap === false) { runLane(n); return; }
    lane = Math.max(0, Math.min(LANES - 1, n)); setLanePos(lane, true); armCast();
  },
  pullLane(p) { setLanePos(p); },
};
})();
</script>
