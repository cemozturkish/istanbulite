<!DOCTYPE html>
<html lang="tr" class="ist-safe-area-pending">
<head>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f0f0f0">

  <script src="safe-area-ready.js?v=2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="ist-date.js?v=2"></script>

  <script src="i18n.js?v=18"></script>

  <script src="flip-steps.js?v=1"></script>
  <script src="palette.js?v=1"></script>

  <link rel="stylesheet" href="profile-card.css?v=22">
  <script src="avatar.js?v=1" defer></script>
  <script src="profile-card.js?v=25" defer></script>
  <script src="sheet.js?v=5"></script>
  <link rel="stylesheet" href="sheet.css?v=7">
  <link rel="stylesheet" href="frames.css?v=8">

  <style data-page="project">
    html, body {
      margin: 0; padding: 0;
      background: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #main-site { display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr; min-height: 100dvh; }
    .section-rule { grid-column: 1 / -1; grid-row: 1; display: flex; justify-content: center; align-items: center; }
    main { grid-column: 1; grid-row: 1; position: relative; overflow: hidden; }

    /* ── The flip book itself ──
       Twelve frames stacked in one box, all decoded, one visible at a
       time. Showing a frame is a change of OPACITY and nothing else --
       never a src swap, which blanks an <img> until the new bytes
       decode and would land in the middle of the drag. */
    .fb {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--paper);
      touch-action: none;          /* the page must not scroll under the finger */
      user-select: none;
      -webkit-user-select: none;
    }
    /* `> img`, not ` img`: the frames are direct children of .fb, and a
       descendant selector also caught every image an ACTOR contains --
       which inherited position:absolute, inset:0 and opacity:0 from
       here. The Sözcel wordmark was laid out at full size, invisible and
       out of flow, so its tile collapsed to the height of its label. */
    .fb > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: var(--fb-fit, cover);
      opacity: 0;
      /* No transition. A flip book flips: interpolating two drawings
         makes a third nobody drew. */
      transition: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .fb > img.on { opacity: 1; }

    /* ── The cast ──
       The things that live on a stop -- today, slide 12's. They do not
       appear and disappear: every slide gives each a place, and they
       travel between those places with the finger. Only transforms and
       opacity move, so a slide costs a composite and nothing else. */
    .fb-cast {
      position: absolute;
      inset: 0;
      pointer-events: none;   /* the layer never takes a press */
      z-index: 1;
    }
    .fb-actor {
      position: absolute;
      will-change: transform, opacity;
      /* Off at every slide except its own stop -- see armCast(). An
         actor mid-flight is a picture of a button, not a button. */
      pointer-events: none;
    }
    .fb-actor.live { pointer-events: auto; }

    /* ── Events and Sözcel, the foot of slide 12 ──
       The two live on one line at the foot of slide 12: events on the
       left, Sözcel filling what is left on the right. One number decides
       the split, so narrowing one widens the other by construction
       rather than by two numbers being kept in step by hand.
       52.7% is the original 62% less 15%. */
    .fb-cast { --fb-events-w: 52.7%; --fb-gap: 8px; }

    /* Both lanes put a wide card on the left of the line and a narrow
       tile on the right of it, so the geometry is written once and each
       lane only says what it is OF. A lane that invented its own line
       would land its cards a few pixels off the one before it, and the
       walk between them would read as the page reflowing. */
    .fb-events, .fb-haberler {
      left: var(--screen-inset, 18px);
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px) + 16px);
      width: var(--fb-events-w);
      background: var(--paper-card, #ddc4b5);
      border: 2px solid var(--ink);
      padding: 9px 11px 10px;
      text-align: left;
      font: inherit;
      color: var(--ink);
      display: block;
      -webkit-tap-highlight-color: transparent;
    }
    .fb-events .k, .fb-haberler .k {
      font-size: 0.56rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 3px;
    }
    .fb-events .t, .fb-haberler .t { font-size: 0.95rem; font-weight: 700; line-height: 1.15; }
    .fb-events .m, .fb-haberler .m { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
    /* Opened in place. The card is docked bottom-left and poses are a
       percentage of its OWN size, so growing upward moves nothing else. */
    .fb-events .x, .fb-haberler .x { display: none; }
    .fb-events .x p, .fb-haberler .x p { margin: 6px 0 0; font-size: 0.72rem; line-height: 1.35; }
    .fb-events.open .x, .fb-haberler.open .x { display: block; }
    .fb-actor.live.fb-events:active,
    .fb-actor.live.fb-haberler:active { transform-origin: 0% 100%; }

    /* ── The narrow tile on the right of the line ── */
    .fb-sozcel, .fb-olaylar {
      right: var(--screen-inset, 18px);
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px) + 16px);
      width: calc(100% - var(--fb-events-w) - (var(--screen-inset, 18px) * 2) - var(--fb-gap));
      background: var(--paper-card, #ddc4b5);
      border: 2px solid var(--ink);
      padding: 9px 8px 10px;
      font: inherit;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      -webkit-tap-highlight-color: transparent;
    }
    .fb-sozcel img {
      width: 100%;
      max-width: 82px;
      height: auto;
      display: block;
      /* In a column flex container the image's HEIGHT is the main size,
         so it shrinks along it -- the wordmark was being squashed to a
         third of its height. Nothing here should give. */
      flex: none;
      /* Deliberately no mix-blend-mode. The wordmark is white letters
         with a black outline, and multiply turns that white fill into
         the paper colour -- the letterforms vanish and the tile reads as
         empty. */
    }
    .fb-sozcel .n, .fb-olaylar .n {
      font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); text-align: center; line-height: 1.1;
    }
    /* Olaylar has no wordmark of its own, so its name is set in type
       where Sözcel's picture stands -- same box, same two lines. */
    .fb-olaylar .w {
      font-size: 1.02rem; font-weight: 800; line-height: 1;
      letter-spacing: 0.02em; text-align: center;
    }
    /* Opened in place, like the two cards on the left of either lane.
       Docked bottom-right, and every pose is a percentage of the tile's
       OWN size, so growing upward moves nothing else on the screen. */
    .fb-olaylar .x { display: none; }
    .fb-olaylar.open .x { display: block; width: 100%; }
    .fb-olaylar .x p {
      margin: 5px 0 0; font-size: 0.66rem; line-height: 1.3;
      text-align: left; color: var(--ink);
    }
    .fb-actor.live.fb-olaylar:active { transform-origin: 100% 100%; }

    /* ── The middle lane: the petek over the book ──
       Slide 12's own reveal, and slide 12's alone. Nothing navigates and
       nothing is opened: the drawing under it stays exactly where it is
       (this is the one screen all three lanes are ABOUT -- covering it
       with a sheet would take back the very thing being answered), goes
       quiet under a wash, and the honeycomb fades in on top.

       Both layers are driven from one number, --fb-petek-p, which is how
       PRESENT the middle lane is: 1 standing on it, 0 a lane away either
       side, and the linear middle in between (lanePresence). So the same
       wash and the same fade run whether the reader came from Kahvehane
       or from Kütüphane, and the petek is at full strength only when
       they are actually standing on it. The wash arrives with the finger
       and the hexagons follow it in over the back half of the pull, so
       the page goes quiet BEFORE the new thing appears rather than the
       two crossing. Nothing here transitions -- while a finger is on the
       glass the number is the animation, and the release runs it in JS
       (see runLane). */
    .fb-scrim {
      position: absolute;
      inset: 0;
      background: var(--paper);
      opacity: calc(var(--fb-petek-p, 0) * 0.86);
      pointer-events: none;
      z-index: 2;
    }
    .fb-petek {
      position: absolute;
      /* Between the two bars, so the reader sits in the middle of the
         same room they sit in on Hane. The petek's own geometry -- the
         cell size, the packing, the window it is scaled into, the three
         depths -- is .ist-hive-page's in profile-card.css and is never
         restated here; all this is, is the box it stands in. */
      top: calc(env(safe-area-inset-top) + var(--navbar-h-top, 56px));
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px));
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      z-index: 3;
      /* Under the two bars, which are omnipresent (frames.css) -- this
         is a layer over one screen, not a page taking the phone over. */
      opacity: clamp(0, calc((var(--fb-petek-p, 0) - 0.35) / 0.65), 1);
      /* A shut petek must not eat the book's own drag. `visibility`
         rather than `display`, so the grid keeps its box and fitHive
         has something real to measure at any moment. */
      visibility: hidden;
      pointer-events: none;
    }
    /* Live only once the pull has committed. Mid-drag it is a picture of
       a petek, exactly as an actor mid-flight is a picture of a button. */
    .fb.petek-open .fb-petek { visibility: visible; pointer-events: auto; }
    .fb.petek-pulling .fb-petek { visibility: visible; }

    /* ── The bottom bar is a COMPASS, not a tab bar ──
       Three marks -- Kütüphane, the İstanbulite wordmark, Kahvehane --
       and none of them is a link. Nothing on this bar is pressed: the
       reader moves the app with their finger, and the bar's whole job is
       to say where that has put them. A tab bar answers "where can I
       go"; this answers "where am I", which is the only question left
       once the swipe is the navigation.

       It lights CONTINUOUSLY, off the same lane presence the wash and
       the hexagons run on (--fb-nav-0/1/2, written by paintNav), so the
       middle mark comes up as the reader walks toward Hane and goes
       down as they walk off it. A bar that snapped between three states
       would be reporting the result of a gesture; this one is part of
       the gesture.

       It stands where every other bar on the site stands -- pinned to
       the viewport's bottom edge, its own height plus the device's
       inset, contents on --screen-inset (see "The phone's two bars" in
       CLAUDE.md). */
    .section-rule {
      position: absolute; top: 0; left: 0;
      width: 0; height: 0; padding: 0; overflow: visible;
    }
    header {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom));
      padding: 0 0 env(safe-area-inset-bottom);
      margin: 0;
      border-top: 1px solid var(--rule);
      border-bottom: none;
      background: var(--paper-navbar);
      z-index: 100;
      display: flex;
      align-items: stretch;
    }
    nav {
      display: flex; width: 100%; height: 100%;
      padding: 0 var(--screen-inset, 18px);
      align-items: flex-end;
      /* Nothing here is pressable, so nothing here takes a press --
         and the map underneath goes on answering a finger that lands
         on the bar's own paper. */
      pointer-events: none;
      -webkit-user-select: none; user-select: none;
    }
    nav b {
      flex: 1;
      display: flex; align-items: flex-end;
      padding-bottom: 6px;
      font-size: 16px; letter-spacing: 0.5px;
      text-transform: uppercase;
      /* The INK is what moves, continuously: --muted at a lane's
         distance, --ink standing on it, and the real middle in between,
         so a mark half-lit is a reader half-way there. The WEIGHT is
         deliberately not on the same number -- a fractional font-weight
         re-measures the type on every frame of the pull, and the bar
         would jitter its own words while the reader dragged. It steps
         once, on the lane they land on. */
      font-weight: 600;
      color: color-mix(in srgb, var(--ink) calc(var(--p, 0) * 100%), var(--muted));
      transition: none;   /* the finger is the animation */
    }
    nav b.on { font-weight: 700; }
    nav b:first-child  { justify-content: flex-start; --p: var(--fb-nav-0, 0); }
    nav b:nth-child(2) { justify-content: center;     --p: var(--fb-nav-1, 0); }
    nav b:last-child   { justify-content: flex-end;   --p: var(--fb-nav-2, 0); }
    /* The wordmark in the middle is the app's own name, so it is set
       tighter and smaller than the two places either side of it: those
       are where you are, this is what you are in. */
    nav b:nth-child(2) {
      font-size: 13px; letter-spacing: 0.14em;
      flex: 0 0 auto; padding: 0 10px 7px;
    }

    /* Sits over the first frame once it is up, so what the reader sees
       while the rest arrive is the book's first page and a count --
       never a spinner on blank paper. */
    .fb-loading {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px) + 44px);
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      z-index: 3;
    }
  </style>
</head>
<body data-page="project">

<div id="main-site">
  <div id="ist-pc-mount"></div>

  <div class="section-rule">
    <header>
      <nav id="fb-nav">
        <b>Kütüphane</b><b>İstanbulite</b><b>Kahvehane</b>
      </nav>
    </header>
  </div>

  <div id="ist-content" style="display:contents">
    <main>
      <div class="fb" id="fb">
        <div class="fb-loading" id="fb-loading">Kareler yükleniyor…</div>
        <div class="fb-cast" id="fb-cast"></div>
        <!-- The petek, revealed by a rightward pull on slide 12. Not a
             page and not a sheet: the drawing stays where it is, goes
             quiet under a wash, and the honeycomb fades in over it. -->
        <div class="fb-scrim" id="fb-scrim"></div>
        <div class="fb-petek" id="fb-petek"></div>
      </div>
    </main>
  </div>
</div>

<script>
(function () {
// ══════════════════════════════════════════════════════════════
// PROJE — the flip book, on its own, with nothing else in the way
//
// A rig rather than a feature. Twelve numbered frames, scrubbed by the
// finger, and it can only come to rest on a STOP. Let go anywhere in
// between and it runs to whichever of the two stops it is between is
// nearer -- there is no stopping in mid-book and nothing to press
// there, which is the whole reason a journey like this costs nothing.
//
// Deliberately self-contained: no map, no data, no page swap, no shared
// transition machinery. If it is not smooth here it is not the app's
// fault, and if it is smooth here then everything that made it rough
// elsewhere is something else.
// ══════════════════════════════════════════════════════════════
const FRAMES = 24;

// ── What each frame shows ──
// The first two stops are the real maps -- frame 1 is Türkiye, frame 12
// İstanbul -- and everything else, the run out to frame 24 included, is
// still the numbered test slide. Swap a number for a path here and that
// frame becomes a picture; there is nothing else to change.
const OVERRIDE = {
  0:  'assets/map/kutuphane-map-mobile.png',     // 1080 x 2420 -- the odd one
  1:  'assets/map/istanbul-map-mobile02.png',    // 1080 x 1920
  2:  'assets/map/istanbul-map-mobile03.png',    // 1080 x 1920
  3:  'assets/map/istanbul-map-mobile04.png',    // 1080 x 1920
  4:  'assets/map/istanbul-map-mobile05.png',    // 1080 x 1920
  5:  'assets/map/istanbul-map-mobile06.png',    // 1080 x 1920
  // 6 -> slide 7, not drawn yet: still the numbered placeholder
  7:  'assets/map/istanbul-map-mobile08.png',    // 1080 x 1920
  8:  'assets/map/istanbul-map-mobile09.png',    // 1080 x 1920
  9:  'assets/map/istanbul-map-mobile10.png',    // 1080 x 1920
  10: 'assets/map/istanbul-map-mobile11.png',    // 1080 x 1920
  11: 'assets/map/istanbul-map-mobile.png',      // 1080 x 1920
};
const SRC = i => OVERRIDE[i] || ('assets/project/' + String(i + 1).padStart(2, '0') + '.png');

// How a frame is laid into the screen. `cover` fills it and crops what
// does not fit; `contain` shows the whole picture and leaves paper
// around it. Every frame is treated the same way, whatever its own
// shape, so the book stays registered with itself.
//
// Everything here is 9:16 (1080x1920) except the Türkiye end, which is
// 1080x2420 -- taller, so cover trims a little off its top and bottom
// where every other frame loses 9% off each side instead. That is the
// one frame not yet registered with the rest of the book.
const FIT = 'cover';

// How far the thumb travels PER PAGE, as a fraction of the screen's
// height -- not per book. Stated this way on purpose: the book's length
// is a thing that changes, and with a fixed whole-book distance every
// slide added made every page flip faster, which quietly undoes the lag
// tuning. 0.05 is the original 0.55 across the twelve-slide book.
const TRAVEL_PER_SLIDE = 0.05;
const TRAVEL = TRAVEL_PER_SLIDE * (FRAMES - 1);
// ── The stops ──
// The frames the book is allowed to come to rest on, 0-based and in
// order. Everything else is mid-flip: a stop is where the drawing is a
// real screen with real things on it, and the runs between two stops
// are the journeys.
//
// Three of them, and the two runs are the same kind of thing: 1 -> 12
// is one journey, 12 -> 24 is the next. A stop in the middle of the
// book is not a landing the gesture has to be told about -- it is just
// another entry here, which is why the whole of "add a stop" is adding
// a number to this line.
const STOPS = [0, 11, FRAMES - 1];

// The two stops a position is between -- the same stop twice when the
// book is resting on one. This is what makes a release a local
// question: the run out of a drag is decided against the stops on
// either side of the finger, never against the ends of the book.
function bracket(p) {
  let lo = STOPS[0];
  let hi = STOPS[STOPS.length - 1];
  for (const s of STOPS) if (s <= p) lo = s;
  for (let i = STOPS.length - 1; i >= 0; i--) if (STOPS[i] >= p) hi = STOPS[i];
  return [lo, hi];
}

// Where a release decides which stop it is running to, as a fraction of
// the run it was let go in, when the finger was moving slowly enough
// for position to be the question.
const TIP = 0.5;
// px/ms. Past this the direction of the throw decides instead of the
// distance, and it commits to the next stop THAT WAY rather than to an
// end of the book -- otherwise a long book can only be crossed by
// dragging half a screen, which is not a gesture anyone makes twice. 0.55 is the
// app's own throw constant (FLICK_SPEED in router.js, and the deck
// swipes on Kütüphane and Kahvehane), so a flick that turns the book
// asks exactly as much of the thumb as a flick that throws a card away.
const FLICK = 0.55;
// How fast it runs out once let go, in pages per second. A longer book
// takes longer to run out, which is right -- but only up to a point, so
// this is the knob if the far end starts feeling distant.
const RUN_FPS = 34;

// ── The three lanes of slide 12 ──
// Declared up here rather than beside the rest of the lane machinery
// because the CAST table below is written in terms of them, and a
// `const` read before its own line is a TDZ error that takes the whole
// page script with it. See "SLIDE 12 IS THREE SCREENS" further down for
// what they are.
const PETEK_STOP = 11;      // the lanes are slide 12's, and slide 12's alone
const LANE_KUTUPHANE = 0;   // left on the screen: the reading side
const LANE_HANE = 1;        // the middle: the petek
const LANE_KAHVEHANE = 2;   // right on the screen: the doing side
const LANES = 3;

// ══════════════════════════════════════════════════════════════
// THE CAST
//
// The things that live on a STOP -- buttons, panels, the page's own
// furniture. Two rules make them work:
//
//   1. They are only ALIVE on their own stop AND their own LANE.
//      Anywhere else -- another stop, another lane, or anywhere in
//      between -- they are a picture of themselves and take no presses:
//      an actor belongs to one screen, not to the book.
//   2. They never appear or disappear. Every slide gives each of them a
//      place, and they travel between those places with the finger.
//
// A pose is `{ x, y, scale, opacity, rot }` where x and y are PERCENT
// OF THE ACTOR'S OWN SIZE -- the same units a CSS translate uses. That
// makes "parked off the left edge" simply x: -160, whatever the screen
// is, and `{}` means "exactly where its CSS puts it".
//
// The table is sparse: write the slides that matter and the rest is
// interpolated. Before the first pose you give and after the last, it
// holds.
//
// An actor on a middle stop is parked off-screen on BOTH sides of it:
// it comes in over the run that arrives at its stop and leaves again
// over the run that departs it, so it belongs to that screen coming and
// going. Its poses are symmetric about its own slide, and the symmetry
// is the whole of it -- there is no code that knows a stop is in the
// middle.
//
// `lane` is the second axis and needs no table at all: an actor is
// simply pushed a lane's width in whichever direction the reader walked
// away from it (see paintCast). That is what makes the two casts
// diverge without either of them knowing the other exists -- Kahvehane's
// leave to the right because the reader went left, and Kütüphane's
// arrive from the left because the reader kept going.
// ══════════════════════════════════════════════════════════════
const CAST = [
  {
    id: 'events',
    // The stop it belongs to, 0-based: slide 12, the İstanbul map. Not
    // the end of the book -- these are exceptional to that one screen,
    // and slide 24 will have a cast of its own.
    live: 11,
    // ...and the lane, which is the sideways half of the same answer.
    // Events are the doing side, so they are Kahvehane's.
    lane: LANE_KAHVEHANE,
    cls: 'fb-events',
    // How closely it follows. Two numbers: `lag` while the finger is
    // down, `lagFree` once it is let go -- higher is tighter. Per-actor
    // on purpose: different weights are what make a screenful of things
    // read as having depth rather than being one sheet.
    lag: 0.43, lagFree: 0.135,
    // Real rows from `events`, the same query and the same card the
    // Kahvehane deck is built from. Its own fetch rather than a shared
    // one: this tab is a rig and must not depend on another page having
    // run first.
    html: '<div class="k">Etkinlikler</div><div class="t">…</div>',
    load: loadEventsActor,
    onpress(e) {
      // Interactable, and only here -- the card opens in place rather
      // than going anywhere, since this tab has nowhere to go.
      e.currentTarget.classList.toggle('open');
    },
    // In from the left over the back half of the 1 -> 12 run, home on
    // slide 12, and back out the same way over the front half of the
    // 12 -> 24 run. Symmetric about 11 on purpose: leaving a screen
    // should look like arriving at it played backwards, which is what
    // makes the two runs read as one gesture in either direction.
    poses: {
      0:  { x: -160, opacity: 1 },
      6:  { x: -160, opacity: 1 },
      8:  { x: -95 },
      10: { x: -22 },

// ── The lag ──
// The drawings stay locked to the finger -- they are the flip book, and
// a page that arrives late is just a slow page. The CAST trails instead:
// each actor eases toward wherever the book currently is, so the
// furniture has a little weight and settles a beat after the paper.
//
// The number is the fraction of the remaining distance covered per 60Hz
// frame -- 0.16 catches up ~63% in 6 frames, which reads as weight
// rather than as lag. It is applied per elapsed time, not per frame, so
// it feels identical on a 120Hz screen.
// Two rates, not one. While the finger is DOWN the screen should stay
// close to it -- a big trail under your own thumb reads as the app
// struggling, not as weight. Once it is let go there is nothing to keep
// up with, and a slower catch-up is what makes the settle feel heavy
// rather than mechanical.
//
// Higher is TIGHTER: it is the fraction of the remaining distance
// covered per 60Hz frame. So the dragging number is the big one.
const CAST_LAG = 0.43;        // following the finger
const CAST_LAG_FREE = 0.135;  // let go   (the same 3.2 : 1 ratio)
// The drawings, on their own pair of knobs. Set both to 1 and the paper
// is locked to the finger while the furniture still trails.
const FRAME_LAG = 0.43;
const FRAME_LAG_FREE = 0.135;
let castTarget = 0;
let castTick = null;
let castLast = 0;
// Where the DRAWINGS have caught up to. Continuous, like an actor's --
// what gets rounded is only which frame that lands on.
let framePos = 0;

let cast = [];
let imgs = [];
let at = 0;             // 0..FRAMES-1, where the book is resting
let shown = -1;
let anim = null;

// Looked up in mount(), never at the top level. router.js runs a page's
// script at idle, before the reader ever asks for it -- which happens
// while a DIFFERENT page's DOM is on screen, so a top-level
// getElementById here finds nothing and throws, and a script that
// throws half way has already declared its consts and cannot be run
// again. Everything that touches the DOM waits for mount().
let box = null;


// ── The events actor's own content ──
// One fetch, the next few evenings in the city, soonest first -- the
// same rows and the same order Kahvehane's deck uses.
const NB_NAMES = {
  bakirkoy:'Bakırköy', bayrampasa:'Bayrampaşa', bahcelievler:'Bahçelievler', sisli:'Şişli',
  eyupsultan:'Eyüpsultan', gop:'Gaziosmanpaşa', esenler:'Esenler', bagcilar:'Bağcılar',
  basaksehir:'Başakşehir', kucukcekmece:'Küçükçekmece', sultangazi:'Sultangazi',
  uskudar:'Üsküdar', kadikoy:'Kadıköy', maltepe:'Maltepe', umraniye:'Ümraniye',
  cekmekoy:'Çekmeköy', beykoz:'Beykoz', sariyer:'Sarıyer', besiktas:'Beşiktaş',
  beyoglu:'Beyoğlu', gungoren:'Güngören', kagithane:'Kağıthane', atasehir:'Ataşehir',
  zeytinburnu:'Zeytinburnu', fatih:'Fatih',
};
const MON_TR = ['OCA','ŞUB','MAR','NİS','MAY','HAZ','TEM','AĞU','EYL','EKİ','KAS','ARA'];

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// Everything Istanbul-dated goes through one clock (CLAUDE.md rule 10);
// here that is just the timeZone these are formatted in.
function eventWhen(iso) {
  const d = new Date(iso);
  const tz = 'Europe/Istanbul';
  const day = parseInt(d.toLocaleDateString('en-US', { timeZone: tz, day: 'numeric' }), 10);
  const mon = parseInt(d.toLocaleDateString('en-US', { timeZone: tz, month: 'numeric' }), 10);
  const wd = d.toLocaleDateString('tr-TR', { timeZone: tz, weekday: 'short' }).toLocaleUpperCase('tr-TR');
  const time = d.toLocaleTimeString('tr-TR', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false });
  return day + ' ' + (MON_TR[mon - 1] || '') + ' ' + wd + ' · ' + time;
}

async function loadEventsActor(el) {
  let rows = null, failed = false;
  try {
    const { data, error } = await IstRouter.sb.from('events')
      .select('*')
      .gte('event_date', new Date().toISOString())
      .order('event_date', { ascending: true })
      .limit(3);
    if (error) throw error;
    rows = data || [];
  } catch (err) {
    console.error('[proje events]', err);
    failed = true;
  }
  if (!el.isConnected) return;

  // Three states, and they say different things: a city with nothing on,
  // and a fetch that never landed, are not the same fact.
  if (failed) {
    el.innerHTML = '<div class="k">Etkinlikler</div><div class="t">Yüklenemedi</div>' +
                   '<div class="m">Bağlantını kontrol et.</div>';

                   '<div class="m">Bu aralar bir şey yok.</div>';

  }
  const ev = rows[0];
  const nb = ev.neighborhood ? (NB_NAMES[ev.neighborhood] || ev.neighborhood) : 'İstanbul';
  const more = rows.length - 1;
  el.innerHTML =
    '<div class="k">' + esc(nb.toLocaleUpperCase('tr-TR')) + '</div>' +
    '<div class="t">' + esc(ev.title) + '</div>' +
    '<div class="m">' + esc(eventWhen(ev.event_date)) +

}

// Which layer a story belongs to -- the same words Kütüphane's own cards
// are kickered with (newsCategoryLabel there).
function newsKicker(n) {
  const c = n.category || n.neighborhood || 'turkiye';
  if (c === 'turkiye') return 'TÜRKİYE';
  if (c === 'istanbul') return 'İSTANBUL';
  if (c === 'dunya') return 'DÜNYA';
  return (NB_NAMES[c] || c).toLocaleUpperCase('tr-TR');
}

function newsAge(iso) {
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return mins + ' dk önce';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' saat önce';
  return Math.round(hrs / 24) + ' gün önce';
}

// ── Poses ──
const POSE0 = { x: 0, y: 0, scale: 1, opacity: 1, rot: 0 };
const lerp = (a, b, t) => a + (b - a) * t;

// Fill a sparse table so every slide has a pose.
function expandPoses(poses) {
  const out = new Array(FRAMES);
  const given = [];
  for (let i = 0; i < FRAMES; i++) {
    if (poses[i]) { out[i] = Object.assign({}, POSE0, poses[i]); given.push(i); }
  }
  if (!given.length) { out.fill(POSE0); return out; }
  for (let i = 0; i < given[0]; i++) out[i] = out[given[0]];
  for (let i = given[given.length - 1] + 1; i < FRAMES; i++) out[i] = out[given[given.length - 1]];
  for (let g = 0; g < given.length - 1; g++) {
    const a = given[g], b = given[g + 1];
    for (let i = a + 1; i < b; i++) {
      const t = (i - a) / (b - a);
      out[i] = {
        x: lerp(out[a].x, out[b].x, t), y: lerp(out[a].y, out[b].y, t),
        scale: lerp(out[a].scale, out[b].scale, t),
        opacity: lerp(out[a].opacity, out[b].opacity, t),
        rot: lerp(out[a].rot, out[b].rot, t),
      };
    }
  }
  return out;
}

function buildCast() {
  const layer = document.getElementById('fb-cast');
  if (!layer) return;
  stopCastTick();
  layer.innerHTML = '';
  cast = CAST.map(def => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'fb-actor ' + def.cls;
    el.innerHTML = def.html;
    if (def.onpress) el.addEventListener('click', def.onpress);
    layer.appendChild(el);
    // Fetched once per mount, after the element exists, and never
    // awaited by anything: an actor whose rows have not landed yet is
    // still an actor, and the book must not wait on the network.
    if (def.load) { try { def.load(el); } catch (e) { console.error(e); } }
    return { def, el, poses: expandPoses(def.poses || {}), pos: 0,
             lag: def.lag == null ? CAST_LAG : def.lag,
             lagFree: def.lagFree == null ? CAST_LAG_FREE : def.lagFree };
  });
}

function stopCastTick() {
  if (castTick) { cancelAnimationFrame(castTick); castTick = null; }
}

// Where the book is; the actors will get there in their own time.
// Where the book is; the drawings and the actors will each get there in
// their own time.
function aim(p, snap) {
  castTarget = Math.max(0, Math.min(FRAMES - 1, p));
  if (snap) {
    stopCastTick();
    framePos = castTarget;
    for (const a of cast) a.pos = castTarget;
    paintFrame();
    paintCast();
    return;
  }
  if (!castTick) { castLast = performance.now(); castTick = requestAnimationFrame(castStep); }
}

// One ease, used by the drawings and by every actor, so they cannot
// drift apart in how they feel. Per elapsed time rather than per frame,
// so 60Hz and 120Hz behave the same rather than the faster screen
// catching up twice as fast.
function ease(pos, target, lag, dt) {
  const d = target - pos;
  if (Math.abs(d) < 0.0015) return target;
  return pos + d * (1 - Math.pow(1 - lag, dt / 16.6667));
}

function castStep(now) {
  const dt = Math.min(64, now - castLast) || 16.7;
  castLast = now;
  let moving = false;
  // Which pair is live depends on whether a finger is on the glass. The
  // rate can change mid-flight without a jump: it governs how fast the
  // gap closes, never where anything is.
  const held = !!drag;
  const fp = ease(framePos, castTarget, held ? FRAME_LAG : FRAME_LAG_FREE, dt);
  if (fp !== framePos) { framePos = fp; moving = true; }
  paintFrame();
  for (const a of cast) {
    const np = ease(a.pos, castTarget, held ? a.lag : a.lagFree, dt);
    if (np !== a.pos) { a.pos = np; moving = true; }
  }
  paintCast();
  // Every frame, not only when the tick stops: an actor that has come
  // near enough to its own slide is pressable, even while the last few
  // pixels are still easing in.
  armCast();
  if (moving) castTick = requestAnimationFrame(castStep);
  else castTick = null;
}

// The actors move continuously between poses while the frame index
// jumps whole numbers: a flip book flips, but type sliding in
// whole-pixel steps shimmers.
function paintCast() {
  for (const a of cast) {
    const p = a.pos;
    const lo = Math.max(0, Math.min(FRAMES - 1, Math.floor(p)));
    const hi = Math.max(0, Math.min(FRAMES - 1, lo + 1));
    const t = p - lo;
    const A = a.poses[lo], B = a.poses[hi];
    const y = lerp(A.y, B.y, t);
    const sc = lerp(A.scale, B.scale, t), rot = lerp(A.rot, B.rot, t);
    // The petek pushes them off to the right on top of wherever the
    // book has them: a second term rather than a second pose table,
    // because it is a different gesture happening at the same time,
    // not a different place in the book.
    // Where the reader is standing relative to THIS actor's lane, in
    // lanes. One rule for both casts, and it is the whole of what makes
    // them diverge: an actor is pushed away in the direction the reader
    // walked, so Kahvehane's leave to the right as the reader goes left
    // and Kütüphane's arrive from the left as they keep going. Nothing
    // here knows which lane is which.
    const d = Math.max(-1, Math.min(1, lanePos - a.def.lane));
    const x = lerp(A.x, B.x, t) - d * LANE_EXIT;
    a.el.style.transform = 'translate3d(' + x + '%,' + y + '%,0) scale(' + sc + ')' +
                           (rot ? ' rotate(' + rot + 'deg)' : '');
    a.el.style.opacity = String(lerp(A.opacity, B.opacity, t) * (1 - Math.abs(d)));
  }
}

// Alive only when the book is actually resting on the stop an actor
// belongs to. Mid-flight, and on any other stop, it is a drawing.
// How close an actor has to be to its own slide before it will take a
// press. Not zero: an exponential ease never quite arrives, and waiting
// for the last thousandth left the card unpressable for the better part
// of a second after it had visibly stopped. 0.05 of a slide is about
// six pixels of drift left -- close enough to press, far enough that
// nothing is live while it is still visibly travelling.
const LIVE_EPS = 0.05;

function armCast() {
  // The drawings are part of "settled" now: while they are still
  // catching up the book is visibly mid-flip, whatever `at` says. So is
  // the petek: an actor on its way off the screen is a picture of a
  // button exactly as one mid-flip is.
  const settled = ready && !drag && !anim && !laneRun &&
                  Math.abs(framePos - castTarget) < LIVE_EPS;
  for (const a of cast) {
    // Its own stop AND its own lane: slide 12 is three screens, and an
    // actor belongs to one of them.
    a.el.classList.toggle('live', settled &&
      Math.abs(a.pos - a.def.live) < LIVE_EPS &&
      Math.abs(lanePos - a.def.lane) < LIVE_EPS);
  }
  // Where the BOOK is, which is a different question from whether the
  // cast is live: a finger on the glass makes nothing live, but it does
  // not move the book off slide 12 -- and the pull that opens the petek
  // begins with a finger already down. Asking `!drag` here is what made
  // the very gesture this flag gates impossible: armCast runs on
  // pointerdown, so the flag was cleared a frame before it was read.
  atLaneStop = ready && Math.abs(framePos - PETEK_STOP) < LIVE_EPS;
  // Arriving on slide 12 is what BUILDS the petek, so the pull never
  // waits on a round trip. Once per arrival, and only once the book has
  // stopped.
  if (!atLaneStop) petekBuilt = false;
  else if (!petekBuilt && !drag && !anim) { petekBuilt = true; ensurePetek(); }
}

// Showing a frame is one class swap. Nothing else touches the DOM
// during a drag, which is what keeps the main thread free enough to
// track the finger.
// Which drawing is up. The position is continuous and eased like an
// actor's; what is whole-numbered is only the frame it lands on -- a
// flip book flips, and blending two drawings makes a third nobody drew.
function paintFrame() {
  if (!imgs.length) return;
  const i = Math.max(0, Math.min(FRAMES - 1, Math.round(framePos)));
  if (i === shown) return;
  if (shown >= 0) imgs[shown].classList.remove('on');
  imgs[i].classList.add('on');
  shown = i;
}

// Aim everything at where the book now is. Nothing paints from `p`
// directly any more: the drawings and the actors each ease toward it.
function show(p, snap) {
  aim(Math.max(0, Math.min(FRAMES - 1, p)), snap);
}

// ── Loading ──
// Two rules, and they pull against each other.
//
// Every frame must be decoded before the book can reach it: an <img>
// whose bytes are not ready paints nothing, and a blank page in the
// middle of a flip is worse than a wait at the start. But waiting for
// the whole book before showing anything means staring at the word
// "loading" while ~4 MB of drawings arrive, which is the app looking
// broken at the exact moment it should look like a book.
//
// So the first frame is decoded on its own and put up straight away --
// the page is a map within a moment -- and the rest are fetched in
// parallel but decoded in order behind it. The gesture only arms once
// they are all in, so the book is never asked for a page it does not
// have. What the reader sees meanwhile is the first drawing and a count,
// not a spinner.
let ready = false;

function loadingLine(n) {
  const el = document.getElementById('fb-loading');
  if (!el) return;
  if (n >= FRAMES) { el.remove(); return; }
  el.textContent = n + ' / ' + FRAMES;
}

async function load() {
  if (!box) return;
  ready = false;
  imgs = [];
  for (let i = 0; i < FRAMES; i++) {
    const img = new Image();
    img.decoding = 'async';
    img.alt = '';
    imgs.push(img);
  }
  const decode = (img) => (img.decode ? img.decode().catch(() => {}) : Promise.resolve());

  // The first frame is fetched ALONE. Starting them all at once shares
  // the connection between all of them and the first page arrives no sooner than
  // the last -- measured on a 4 Mbps link, 7.9s for both. Fetching it by
  // itself gets it on screen in a fraction of that, and the rest have
  // the whole rest of the wait to arrive in. `fetchPriority` alone does
  // not do this: it reorders a queue, it does not empty one.
  if ('fetchPriority' in imgs[0]) imgs[0].fetchPriority = 'high';
  imgs[0].src = SRC(0);
  await decode(imgs[0]);
  if (!box || !box.isConnected) return;
  box.appendChild(imgs[0]);
  shown = -1; at = 0;
  show(0, true);
  loadingLine(1);

  // Now the rest: all fetched at once (the network is idle again and
  // parallel is right for it), decoded one at a time (simultaneous
  // decodes of a 1080x1920 image allocate ~8 MB of surface each, and
  // the book is two dozen of them).
  for (let i = 1; i < FRAMES; i++) imgs[i].src = SRC(i);

  for (let i = 1; i < FRAMES; i++) {
    await decode(imgs[i]);
    if (!box || !box.isConnected) return;
    box.appendChild(imgs[i]);
    loadingLine(i + 1);
  }
  ready = true;
  armCast();
}

// ── The gesture ──
// One pointer, vertical only. `at` is where the book was resting when
// the finger landed, so a drag continues from there rather than
// restarting -- pull down twice and it keeps going forward.
let drag = null;

function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }

// ══════════════════════════════════════════════════════════════
// SLIDE 12 IS THREE SCREENS, NOT ONE
//
// The book's stops are its DEPTH -- slide 1 is Türkiye, slide 12 is
// İstanbul, slide 24 is what is inside it. Slide 12 also has a
// SIDEWAYS axis, and it is the app's own carousel laid on the one
// slide that is the city:
//
//        LANE 0            LANE 1           LANE 2
//      Kütüphane   <--     Hane      -->   Kahvehane
//      (the read)       (the petek)        (the doing)
//
// left to right on the screen, exactly as the three tabs stand. A pull
// right walks the strip right, so the reader moves LEFT along it --
// Kahvehane, then Hane, then Kütüphane -- and a pull left walks back.
//
// Each lane has its own cast, and they never trade places: the buttons
// that left to the right are Kahvehane's and stay gone; the ones that
// arrive from the left are Kütüphane's. Nothing navigates, nothing
// rises from the bottom, and the drawing underneath is left exactly
// where it is -- this is the one screen all three are about, and a
// surface that covered it would take back the thing being answered.
//
// ── And the lane decides which way the book may move ──
// This is the whole point of the divergence rather than a rule bolted
// onto it. Standing on Kütüphane you are facing OUT, so the only depth
// you can reach is slide 1 -- Türkiye. Standing on Kahvehane you are
// facing IN, so the only one is slide 24. Standing on Hane the
// vertical gesture is not the book's at all: it is the petek's own
// depth pull.
//
// So there is no way from Türkiye to the innermost slide that does not
// pass through Hane. That is the mall stairway in the smallest form it
// has ever had here: you cannot go from the reading to the doing
// without walking past the people.
// ══════════════════════════════════════════════════════════════
// How far an actor is pushed when the reader walks off its lane, in
// percent of the actor's own width.
const LANE_EXIT = 190;
// The thumb distance for ONE lane, as a fraction of the screen's width
// -- stated per lane rather than per strip, the same rule the book's
// own travel follows.
const LANE_TRAVEL = 0.42;
const LANE_RUN_MS = 300;
// px before a drag has to say which axis it is. The book's own gesture
// is vertical and the lanes' is horizontal, so this is the one place
// they are told apart.
const AXIS_SLOP = 8;

// The reader starts on Kütüphane, because the book starts on slide 1
// and slide 1 is Türkiye: the lane and the depth have to agree or the
// first pull down would be one the lane forbids.
let lane = LANE_KUTUPHANE;
let lanePos = LANE_KUTUPHANE;   // continuous; the drag writes it live
let laneRun = null;
let atLaneStop = false;  // whether the book is standing on PETEK_STOP
let petekBuilt = false;  // whether this arrival has already mounted it

const clamp01 = (n) => n < 0 ? 0 : n > 1 ? 1 : n;

// How present a lane's own things are: 1 standing on it, 0 a whole lane
// away, and the linear middle in between. One function for the petek
// and for every actor, so nothing can arrive on a different curve from
// its neighbour.
function lanePresence(l) { return 1 - Math.min(1, Math.abs(lanePos - l)); }

// One number drives the wash, the hexagons and every actor's exit: the
// two layers are the stylesheet's job off --fb-petek-p (see .fb-scrim /
// .fb-petek), and the actors are painted from lanePos here.
function paintLanes() {
  if (!box) return;
  const petek = lanePresence(LANE_HANE);
  box.style.setProperty('--fb-petek-p', String(petek));
  box.classList.toggle('petek-pulling', petek > 0);
  box.classList.toggle('petek-open', lane === LANE_HANE && petek >= 1);
  paintCast();
  paintNav();
}

// The bar says where the reader is standing, continuously: each mark is
// lit by its own lane's presence, the same number the wash and the
// hexagons run on. Off slide 12 the lane still means something -- it is
// which of the two runs the reader is on -- so Kütüphane stays lit all
// the way out to Türkiye and Kahvehane all the way in.
function paintNav() {
  if (!box) return;
  const root = document.documentElement;
  const marks = box.ownerDocument.querySelectorAll('#fb-nav b');
  for (let i = 0; i < LANES; i++) {
    root.style.setProperty('--fb-nav-' + i, lanePresence(i).toFixed(3));
    if (marks[i]) marks[i].classList.toggle('on', lane === i);
  }
}


function setLanePos(p) {
  lanePos = Math.max(0, Math.min(LANES - 1, p));
  paintLanes();
}

// Whether a pull that way has anywhere to go. Not a general "are the
// lanes open": it is the direction as well, so a pull off the end of
// the strip is nobody's and falls through to whatever is underneath.
function lanePullable(dx) {
  if (!atLaneStop) return false;
  // Right walks the strip right, so the reader moves toward lane 0.
  return dx > 0 ? lane > 0 : lane < LANES - 1;
}

// ── What the lane lets the book reach ──
// The two ends of the run the reader is standing on. Kütüphane's run is
// slide 1 to slide 12, Kahvehane's is slide 12 to slide 24, and Hane
// has none at all -- its vertical gesture belongs to the petek.
function laneStops() {
  if (lane === LANE_KUTUPHANE) return [STOPS[0], STOPS[1]];
  if (lane === LANE_KAHVEHANE) return [STOPS[1], STOPS[2]];
  return [STOPS[1], STOPS[1]];
}

// The release: carry on from where the finger left off. Timed rather
// than frame-paced -- the book runs out at the speed pages turn, but
// this is a wash and a fade, which have no pages in them.
function runLane(to) {
  if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
  lane = Math.max(0, Math.min(LANES - 1, to));
  const from = lanePos;
  const dist = Math.abs(lane - from);
  if (dist < 0.001) { setLanePos(lane); armCast(); return; }
  const ms = LANE_RUN_MS * dist;
  const t0 = performance.now();
  const step = (now) => {
    const a = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - a, 3);   // ease out
    setLanePos(from + (lane - from) * e);
    if (a < 1) { laneRun = requestAnimationFrame(step); }
    else { laneRun = null; setLanePos(lane); armCast(); }
  };
  laneRun = requestAnimationFrame(step);
}

// Built the moment the book comes to rest on slide 12, never on the
// pull itself: mounting is a round trip to hive_map(), and a reveal
// that waits on the network is a reveal with a blank beat in it. Every
// arrival re-mounts, because somebody else's attachment may have
// carried this whole petek somewhere since it was last drawn -- the
// same rule Hane follows. Not while it is standing, though: that would
// pull the drawing out from under the reader.
function ensurePetek() {
  if (lanePresence(LANE_HANE) > 0) return;
  if (!window.IstProfileCard || !IstProfileCard.mountHivePage) return;
  if (!document.getElementById('fb-petek')) return;
  try {
    IstProfileCard.mountHivePage({
      sb: IstRouter.sb, I18N: window.I18N, mountId: 'fb-petek',
    });
  } catch (err) { console.error('[proje petek]', err); }
}

function onDown(e) {
  if (!ready) return;
  // A press that lands on a live actor is that actor's, not the book's.
  // Without this the book swallows its own buttons: the drag handler
  // takes pointer capture on the way down, which re-targets the eventual
  // click at the capturing element, so the card never hears it. It looks
  // exactly like a dead button and nothing throws.
  if (e.target && e.target.closest && e.target.closest('.fb-actor.live')) return;
  // While the petek is standing, everything inside it is ITS gesture --
  // the depth pull, a hexagon, the field that takes a code. Only a
  // horizontal drag is ours, and horizontal is exactly what the petek's
  // own handler hands back (see wireHiveGestures in profile-card.js).
  // So a press that lands in it is tracked but never CAPTURED: capture
  // would re-target every following event at this box and kill the
  // petek's own handlers outright.
  const inPetek = lanePresence(LANE_HANE) > 0 &&
                  !!(e.target && e.target.closest && e.target.closest('.fb-petek'));
  stopAnim();
  if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
  drag = { x: e.clientX, y: e.clientY, from: at, fromLane: lanePos, axis: null, moved: false,
           lastX: e.clientX, lastY: e.clientY, lastT: performance.now(), v: 0, vx: 0, inPetek };
  armCast();                    // a press begins: the cast goes inert
  if (!inPetek) box.setPointerCapture && box.setPointerCapture(e.pointerId);
}

function onMove(e) {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  // ── Which gesture is this? ──
  // The book's is vertical and the petek's is horizontal; this is the
  // one place they are told apart, and a drag that turns out to belong
  // to neither is dropped rather than half-answered.
  if (!drag.axis) {
    if (Math.abs(dx) < AXIS_SLOP && Math.abs(dy) < AXIS_SLOP) return;
    drag.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
    if (drag.axis === 'x' && !lanePullable(dx)) { drag = null; armCast(); return; }
    // A vertical drag while the petek is on screen is the petek's own
    // depth pull, not the book being scrubbed underneath it.
    if (drag.axis === 'y' && (lanePresence(LANE_HANE) > 0 || drag.inPetek)) {
      drag = null; armCast(); return;
    }
    // Which run the reader is on is the LANE's answer, not the book's --
    // and it is taken once, at the moment the gesture claims its axis,
    // so a drag cannot be re-scoped half way through.
    if (drag.axis === 'y') drag.run = laneStops();
    drag.moved = true;
  }
  const now = performance.now();
  const dt = now - drag.lastT;
  if (drag.axis === 'x') {
    if (dt > 0) drag.vx = (e.clientX - drag.lastX) / dt;
    drag.lastX = e.clientX; drag.lastT = now;
    // The strip follows the finger, like everything else here. A pull
    // right walks the strip right, so the reader moves toward lane 0.
    //
    // At most ONE lane per gesture, however far the finger goes: this is
    // a carousel of three screens, not a scrub through twenty-four, and
    // a swipe that crossed two of them walked the reader straight past
    // Hane -- which is the one screen the whole arrangement exists to
    // put in the middle. The book's own vertical is deliberately not
    // clamped this way: there it IS a scrub.
    // Clamped around the lane the reader is COMMITTED to, not around
    // where the drawing happened to be when the finger went down: an
    // interrupted run leaves those two apart, and clamping to the
    // drawing lets a long drag reach a lane two along.
    const to = drag.fromLane - dx / (window.innerWidth * LANE_TRAVEL);
    setLanePos(Math.max(lane - 1, Math.min(lane + 1, to)));
    e.preventDefault();
    return;
  }
  if (dt > 0) drag.v = (e.clientY - drag.lastY) / dt;
  drag.lastY = e.clientY; drag.lastT = now;
  // Down is forward. The span is the whole book, so the finger is
  // moving the pages rather than nudging a counter.
  const span = window.innerHeight * TRAVEL;
  const p = drag.from + (dy / span) * (FRAMES - 1);
  // Clamped to the lane's run, not to the book: from Kütüphane the
  // deepest the finger can reach is slide 12, and from Kahvehane the
  // shallowest is. A pull the wrong way simply does not move the paper,
  // which says "not this way" more plainly than springing back would.
  const run = drag.run || STOPS;
  at = Math.max(run[0], Math.min(run[1], p));
  show(at);
  e.preventDefault();
}

// Run to a stop at a steady rate. Deliberately frame-paced rather than
// eased: this is a flip book being let go of, and the pages should turn
// at the speed pages turn.
function runTo(target) {
  stopAnim();
  const from = at;
  const dist = Math.abs(target - from);
  if (dist < 0.001) { at = target; show(at); armCast(); return; }
  const ms = (dist / RUN_FPS) * 1000;
  const t0 = performance.now();
  const step = (now) => {
    const a = Math.min(1, (now - t0) / ms);
    at = from + (target - from) * a;
    show(at);
    if (a < 1) anim = requestAnimationFrame(step);
    else { anim = null; at = target; armCast(); }
  };
  anim = requestAnimationFrame(step);
}

function onUp() {
  if (!drag) return;
  const wasDrag = drag.moved;
  const axis = drag.axis;
  const v = drag.v;
  const vx = drag.vx;
  drag = null;
  if (!wasDrag) { armCast(); return; }
  // The lanes: a throw decides by direction, a slow release by how far
  // it got -- the same two rules the book itself releases on, and the
  // same local question, since the strip is a row of stops too.
  if (axis === 'x') {
    // The two candidates are always the lane the reader is on and the
    // ONE next to it in the direction they pulled -- never `floor` of
    // where the drawing ended up, which at a whole number brackets the
    // wrong pair and overshoots by a lane in one direction only.
    const step = (n) => Math.max(0, Math.min(LANES - 1, n));
    if (Math.abs(vx) > FLICK) { runLane(step(lane + (vx > 0 ? -1 : 1))); return; }
    const dir = lanePos < lane ? -1 : lanePos > lane ? 1 : 0;
    if (!dir) { runLane(lane); return; }
    runLane(Math.abs(lanePos - lane) >= TIP ? step(lane + dir) : lane);
    return;
  }
  // The book only ever comes to rest on a stop, and the question is
  // always local: which of the two stops the finger was let go BETWEEN.
  // A throw decides by DIRECTION; a slow release decides by position.
  const [lo, hi] = bracket(at);
  if (lo === hi) { runTo(lo); return; }
  if (Math.abs(v) > FLICK) { runTo(v > 0 ? hi : lo); return; }
  runTo((at - lo) / (hi - lo) >= TIP ? hi : lo);
}

// ── The page lifecycle router.js drives ──
// Bound to the box rather than to the document, so the listeners leave
// with the page when #ist-content is swapped (see CLAUDE.md: "A page
// script must not delegate on `document` for anything another page also
// has").
function mount() {
  document.getElementById('main-site').classList.add('active');
  box = document.getElementById('fb');
  if (!box) return;
  box.style.setProperty('--fb-fit', FIT);
  // A fresh box, and a fresh #fb-petek inside it. The reader starts on
  // Kütüphane because the book starts on slide 1: the lane and the depth
  // have to agree, or the first pull down is one the lane forbids.
  lane = LANE_KUTUPHANE; lanePos = LANE_KUTUPHANE;
  atLaneStop = false; petekBuilt = false;
  buildCast();
  paintLanes();     // after buildCast: it paints the cast too
  box.addEventListener('pointerdown', onDown, { passive: true });
  box.addEventListener('pointermove', onMove, { passive: false });
  box.addEventListener('pointerup', onUp, { passive: true });
  box.addEventListener('pointercancel', onUp, { passive: true });
  // A fresh box every mount, so the decoded frames have to be put back
  // into it. They are kept, not re-fetched: decoding two dozen
  // 1080x1920 images is the one cost worth paying only once.
  if (imgs.length && ready) {
    const spinner = document.getElementById('fb-loading');
    if (spinner) spinner.remove();
    imgs.forEach(i => { i.classList.remove('on'); box.appendChild(i); });
    shown = -1; at = 0; show(0, true); armCast();
  } else {
    load();
  }
  if (window.IstProfileCard) IstProfileCard.setPage('project');
}
function unmount() {
  stopAnim();
  if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
  // The petek leaves two things behind it that live OUTSIDE this page --
  // the depth classes on <html> and the module's own _hive, which every
  // in-flight fetch checks itself against before drawing. Both have to
  // be unwound or they are the last word on a page that is gone (see
  // unmountHivePage in profile-card.js).
  if (window.IstProfileCard && IstProfileCard.unmountHivePage) IstProfileCard.unmountHivePage();
  lane = LANE_KUTUPHANE; lanePos = LANE_KUTUPHANE;
  atLaneStop = false; petekBuilt = false;
  drag = null; box = null;
  // The lane variables live on <html> and would outlive this page.
  const root = document.documentElement;
  for (let i = 0; i < LANES; i++) root.style.removeProperty('--fb-nav-' + i);
}
IstRouter.registerPage('project', { mount, unmount });

if (!window.__istVirtualNavInjecting) {
  mount();
  window.addEventListener('DOMContentLoaded', () => {
    if (window.IstProfileCard) IstProfileCard.mount({ sb: IstRouter.sb, I18N: window.I18N, page: 'project' });
  });
}

// ── One deliberate handle, for driving the book from outside ──
// Everything above is inside this wrapper because the four carousel
// pages share ONE document (see router.js): two of them declaring the
// same top-level `const` is a SyntaxError that takes the second page's
// whole script with it. This page had 26 top-level names and one of
// them, NB_NAMES, already collided with mahalle's.
window.__fb = {
  get at() { return at; },
  get framePos() { return framePos; },
  get cast() { return cast; },
  get ready() { return ready; },
  get busy() { return !!(anim || castTick || drag); },
  frames: FRAMES,
  // Put the book at a slide as if it had been dragged there and let go.
  // `show` alone only paints -- it does not move the book -- which is
  // exactly the distinction the drag handler depends on.
  goto(p, snap) {
    stopAnim();
    at = Math.max(0, Math.min(FRAMES - 1, p));
    // A slide off the middle stop can only be reached from one lane, so
    // arriving there by hand has to leave the reader on it -- otherwise
    // the handle can put the book somewhere its own lane forbids.
    if (at < STOPS[1]) { lane = LANE_KUTUPHANE; setLanePos(lane); }
    else if (at > STOPS[1]) { lane = LANE_KAHVEHANE; setLanePos(lane); }
    show(at, snap !== false); armCast();
  },
  show, armCast,
  lanes: LANES,
  get lane() { return { at: lane, pos: lanePos, atStop: atLaneStop,
                        petek: lanePresence(LANE_HANE), stops: laneStops() }; },
  // Put the reader on a lane as if they had pulled there and let go.
  goLane(n, snap) {
    if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
    if (snap === false) { runLane(n); return; }
    lane = Math.max(0, Math.min(LANES - 1, n)); setLanePos(lane); armCast();
  },
  pullLane(p) { setLanePos(p); },
};
})();
</script>
</body>
</html>
