  <style data-page="project">
    html, body {
      margin: 0; padding: 0;
      background: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #main-site { display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr; min-height: 100dvh; }
    .section-rule { grid-column: 1 / -1; grid-row: 1; display: flex; justify-content: center; align-items: center; }
    main { grid-column: 1; grid-row: 1; position: relative; overflow: hidden; }

    /* ── The flip book itself ──
       Twelve frames stacked in one box, all decoded, one visible at a
       time. Showing a frame is a change of OPACITY and nothing else --
       never a src swap, which blanks an <img> until the new bytes
       decode and would land in the middle of the drag. */
    .fb {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--paper);
      touch-action: none;          /* the page must not scroll under the finger */
      user-select: none;
      -webkit-user-select: none;
    }
    /* `> img`, not ` img`: the frames are direct children of .fb, and a
       descendant selector also caught every image an ACTOR contains --
       which inherited position:absolute, inset:0 and opacity:0 from
       here. The Sözcel wordmark was laid out at full size, invisible and
       out of flow, so its tile collapsed to the height of its label. */
    .fb > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: var(--fb-fit, cover);
      opacity: 0;
      /* No transition. A flip book flips: interpolating two drawings
         makes a third nobody drew. */
      transition: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .fb > img.on { opacity: 1; }

    /* ── The cast ──
       The things that live on a stop -- today, slide 12's. They do not
       appear and disappear: every slide gives each a place, and they
       travel between those places with the finger. Only transforms and
       opacity move, so a slide costs a composite and nothing else. */
    .fb-cast {
      position: absolute;
      inset: 0;
      pointer-events: none;   /* the layer never takes a press */
      z-index: 1;
    }
    .fb-actor {
      position: absolute;
      will-change: transform, opacity;
      /* Off at every slide except its own stop -- see armCast(). An
         actor mid-flight is a picture of a button, not a button. */
      pointer-events: none;
    }
    .fb-actor.live { pointer-events: auto; }

    /* ── The two shapes, and there are only two ──
       The drawing says every screen is the maps on top and two columns of
       tiles under them: a column of WIDE ROWS on the left and a column of
       SMALL SQUARES on the right (see "What each screen carries" in
       CLAUDE.md). So the whole app has exactly two button shapes, and
       they are stated here ONCE rather than per lane -- an actor's own
       class says what it is OF, never how big it is. It is declared as
       `shape` on the actor beside `live` and `lane`, so a new tile is a
       word in the cast table rather than a fifth copy of this geometry.
       A lane that restated it would land its cards a few pixels off the
       lane before it, and the walk between them would read as the page
       reflowing.

       One number splits the line (--fb-row-w) and the square's side falls
       out of it, so narrowing one widens the other by construction rather
       than by two numbers being kept in step by hand. 52.7% is the
       original 62% less 15%. */
    .fb-cast {
      --fb-row-w: 52.7%;
      --fb-gap: 8px;
      --fb-inset: var(--screen-inset, 18px);
      /* The HEIGHT OF THE LINE, and the only number that decides the
         square: a square's side is the row's height, so the two shapes
         stand at one height whatever is printed inside them. It used to
         be the other way round -- the square took whatever width the
         split left over, which made it as wide as the row is tall twice
         over and left the pair reading as a card and a poster rather
         than as one line. */
      --fb-line-h: 74px;
      /* Both columns hang from the same line above the tab bar -- the
         phone's stacks grow upward from the thumb (see "The phone's feeds
         hang from the bottom" in CLAUDE.md). */
      --fb-dock: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px) + 16px);
    }

    /* Both shapes are cut from the same card stock. */
    .fb-row, .fb-sq {
      bottom: var(--fb-dock);
      background: var(--paper-card, #ddc4b5);
      border: 2px solid var(--ink);
      font: inherit;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }
    /* The left column: a wide row. The line's height is a MINIMUM rather
       than a height -- a row carries a kicker, a headline and a line of
       meta, and one that opens in place grows upward from its own dock
       corner; a fixed height would clip both. */
    .fb-row {
      left: var(--fb-inset);
      width: var(--fb-row-w);
      min-height: var(--fb-line-h);
      padding: 9px 11px 10px;
      text-align: left;
      display: block;
    }
    /* The right column: a small square, and actually square -- its side
       IS the line's height, so it stands exactly as tall as the row beside
       it. aspect-ratio yields to content that genuinely needs more room,
       which is what lets a tile open in place without fighting it. */
    .fb-sq {
      right: var(--fb-inset);
      width: var(--fb-line-h);
      aspect-ratio: 1;
      padding: 7px 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      /* aspect-ratio yields to content that will not fit, and a tile whose
         wordmark was an inch too tall silently stopped being square and
         stood a third taller than the row beside it. Anything that cannot
         fit is clipped rather than allowed to change the shape -- and
         nothing below is left able to overflow, so nothing is clipped. */
      overflow: hidden;
    }
    /* Each shape gives under the finger from the corner it is docked to,
       so the press reads as the card being pushed into its own corner
       rather than sliding across the line. */
    .fb-actor.live.fb-row:active { transform-origin: 0% 100%; }
    .fb-actor.live.fb-sq:active { transform-origin: 100% 100%; }

    /* ── What each one is OF ──
       Below here, nothing decides a size or a position. */
    .fb-row .k {
      font-size: 0.56rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 3px;
    }
    .fb-row .t { font-size: 0.95rem; font-weight: 700; line-height: 1.15; }
    .fb-row .m { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
    /* Opened in place. Poses are a percentage of the card's OWN size and
       it is docked bottom-left, so growing upward moves nothing else. */
    .fb-row .x { display: none; }
    .fb-row .x p { margin: 6px 0 0; font-size: 0.72rem; line-height: 1.35; }
    .fb-row.open .x { display: block; }

    .fb-sozcel img {
      /* Sized by its HEIGHT, not its width: the tile is the line's height
         square, and what has to fit inside it is the wordmark plus its
         line of type. Bounding the width instead let a nearly-square
         wordmark take the whole box and push the label out of it. */
      width: auto;
      max-width: 100%;
      max-height: calc(var(--fb-line-h) - 46px);
      height: auto;
      display: block;
      /* In a column flex container the image's HEIGHT is the main size,
         so it shrinks along it -- the wordmark was being squashed to a
         third of its height. Nothing here should give. */
      flex: none;
      /* Deliberately no mix-blend-mode. The wordmark is white letters
         with a black outline, and multiply turns that white fill into
         the paper colour -- the letterforms vanish and the tile reads as
         empty. */
    }
    .fb-sq .n {
      flex: none;
      font-size: 0.48rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); text-align: center; line-height: 1.1;
    }
    /* Olaylar has no wordmark of its own, so its name is set in type
       where Sözcel's picture stands -- same box, same two lines. */
    .fb-sq .w {
      flex: none;
      font-size: 0.8rem; font-weight: 800; line-height: 1;
      letter-spacing: 0.02em; text-align: center;
    }
    /* Opened in place, like the rows on the left of either lane. Docked
       bottom-right, and every pose is a percentage of the tile's OWN
       size, so growing upward moves nothing else on the screen. */
    .fb-sq .x { display: none; }
    .fb-sq.open .x { display: block; width: 100%; }
    .fb-sq .x p {
      margin: 5px 0 0; font-size: 0.66rem; line-height: 1.3;
      text-align: left; color: var(--ink);
    }

    /* ── The middle lane: the petek over the book ──
       Slide 12's own reveal, and slide 12's alone. Nothing navigates and
       nothing is opened: the drawing under it stays exactly where it is
       (this is the one screen all three lanes are ABOUT -- covering it
       with a sheet would take back the very thing being answered), goes
       quiet under a wash, and the honeycomb fades in on top.

       Both layers are driven from one number, --fb-petek-p, which is how
       PRESENT the middle lane is: 1 standing on it, 0 a lane away either
       side, and the linear middle in between (lanePresence). So the same
       wash and the same fade run whether the reader came from Kahvehane
       or from Kütüphane, and the petek is at full strength only when
       they are actually standing on it. The wash arrives with the finger
       and the hexagons follow it in over the back half of the pull, so
       the page goes quiet BEFORE the new thing appears rather than the
       two crossing. Nothing here transitions -- while a finger is on the
       glass the number is the animation, and the release runs it in JS
       (see runLane). */
    .fb-scrim {
      position: absolute;
      inset: 0;
      background: var(--paper);
      opacity: calc(var(--fb-petek-p, 0) * 0.86);
      pointer-events: none;
      z-index: 2;
    }
    .fb-petek {
      position: absolute;
      /* Between the two bars, so the reader sits in the middle of the
         same room they sit in on Hane. The petek's own geometry -- the
         cell size, the packing, the window it is scaled into, the three
         depths -- is .ist-hive-page's in profile-card.css and is never
         restated here; all this is, is the box it stands in. */
      top: calc(env(safe-area-inset-top) + var(--navbar-h-top, 56px));
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px));
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      z-index: 3;
      /* Under the two bars, which are omnipresent (frames.css) -- this
         is a layer over one screen, not a page taking the phone over. */
      opacity: clamp(0, calc((var(--fb-petek-p, 0) - 0.35) / 0.65), 1);
      /* A shut petek must not eat the book's own drag. `visibility`
         rather than `display`, so the grid keeps its box and fitHive
         has something real to measure at any moment. */
      visibility: hidden;
      pointer-events: none;
    }
    /* Live only once the pull has committed. Mid-drag it is a picture of
       a petek, exactly as an actor mid-flight is a picture of a button. */
    .fb.petek-open .fb-petek { visibility: visible; pointer-events: auto; }
    .fb.petek-pulling .fb-petek { visibility: visible; }

    /* ── The bottom bar is a COMPASS, not a tab bar ──
       Three marks -- Kütüphane, the İstanbulite wordmark, Kahvehane --
       and none of them is a link. Nothing on this bar is pressed: the
       reader moves the app with their finger, and the bar's whole job is
       to say where that has put them. A tab bar answers "where can I
       go"; this answers "where am I", which is the only question left
       once the swipe is the navigation.

       It lights CONTINUOUSLY, off the same lane presence the wash and
       the hexagons run on (--fb-nav-0/1/2, written by paintNav), so the
       middle mark comes up as the reader walks toward Hane and goes
       down as they walk off it. A bar that snapped between three states
       would be reporting the result of a gesture; this one is part of
       the gesture.

       It stands where every other bar on the site stands -- pinned to
       the viewport's bottom edge, its own height plus the device's
       inset, contents on --screen-inset (see "The phone's two bars" in
       CLAUDE.md). */
    .section-rule {
      position: absolute; top: 0; left: 0;
      width: 0; height: 0; padding: 0; overflow: visible;
    }
    header {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom));
      padding: 0 0 env(safe-area-inset-bottom);
      margin: 0;
      border-top: 1px solid var(--rule);
      border-bottom: none;
      background: var(--paper-navbar);
      z-index: 100;
      display: flex;
      align-items: stretch;
    }
    nav {
      display: flex; width: 100%; height: 100%;
      padding: 0 var(--screen-inset, 18px);
      align-items: flex-end;
      /* Nothing here is pressable, so nothing here takes a press --
         and the map underneath goes on answering a finger that lands
         on the bar's own paper. */
      pointer-events: none;
      -webkit-user-select: none; user-select: none;
    }
    nav b {
      flex: 1;
      display: flex; align-items: flex-end;
      padding-bottom: 6px;
      font-size: 16px; letter-spacing: 0.5px;
      text-transform: uppercase;
      /* The INK is what moves, continuously: --muted at a lane's
         distance, --ink standing on it, and the real middle in between,
         so a mark half-lit is a reader half-way there. The WEIGHT is
         deliberately not on the same number -- a fractional font-weight
         re-measures the type on every frame of the pull, and the bar
         would jitter its own words while the reader dragged. It steps
         once, on the lane they land on. */
      font-weight: 600;
      color: color-mix(in srgb, var(--ink) calc(var(--p, 0) * 100%), var(--muted));
      transition: none;   /* the finger is the animation */
    }
    nav b.on { font-weight: 700; }
    nav b:first-child  { justify-content: flex-start; --p: var(--fb-nav-0, 0); }
    nav b:nth-child(2) { justify-content: center;     --p: var(--fb-nav-1, 0); }
    nav b:last-child   { justify-content: flex-end;   --p: var(--fb-nav-2, 0); }
    /* The wordmark in the middle is the app's own name, so it is the
       LOGO itself rather than the name set in type: the two either side
       are places, written; this is the thing you are inside of, drawn.
       Painted as a MASK rather than dropped in as a picture -- the file
       is white letters on black with no transparency, so an <img> on
       this bar is a black rectangle. Luminance-masking it makes the
       letterforms the only ink and lets them take `currentColor`, which
       is the same continuous color-mix the two words either side ride,
       so the middle mark comes up and goes down with the pull exactly
       as they do. */
    nav b:nth-child(2) {
      font-size: 13px; letter-spacing: 0.14em;
      flex: 0 0 auto; padding: 0 10px 7px;
    }
    nav b .fb-logo {
      display: block;
      width: 86px; height: 26px;
      background-color: currentColor;
      -webkit-mask: url('assets/loading/logo-dark-mono-01.jpg') center / contain no-repeat;
              mask: url('assets/loading/logo-dark-mono-01.jpg') center / contain no-repeat;
      -webkit-mask-source-type: luminance;
      mask-mode: luminance;
    }
    nav b .fb-wm { display: none; }
    /* A browser that cannot luminance-mask gets the name in type, which
       is what stood here before. */
    @supports not ((mask-mode: luminance) or (-webkit-mask-source-type: luminance)) {
      nav b .fb-logo { display: none; }
      nav b .fb-wm { display: block; }
    }

    /* ── THE POSITION DOTS ──
       The bar says which LANE the reader is standing on; these say how
       far through that lane's own run of the book they are. Two marks a
       side, joined by a double rule: on the left, the middle of the
       city (slide 12) and Türkiye beyond it; on the right, the same
       middle and the innermost slide beyond that. The shared mark is
       dead centre of the screen on both sides and is Hane -- so the two
       columns are one line broken in the middle, which is where the
       reader always is.

       Nothing here is pressed. Both the column's presence and each
       mark's ink are continuous numbers written by paintNav: the
       columns fade with the lane (--fb-dots-l / -r) and a mark fills
       with ink as the book arrives at its stop (--fb-dot-*), so a mark
       half-filled is a reader half-way there. */
    .fb-dots {
      position: fixed;
      left: var(--screen-inset, 18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 4;
    }
    .fb-dots-l { top: 50%; }
    .fb-dots-r { left: auto; right: var(--screen-inset, 18px); bottom: 50%; }
    .fb-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      box-sizing: border-box;
      border: 1.5px solid var(--ink);
      /* Filled by how near the book is to this mark's own stop. */
      background: color-mix(in srgb, var(--ink) calc(var(--d, 0) * 100%), transparent);
    }
    /* The double line the site sets its rules in, stood on end. */
    .fb-rule {
      width: 5px;
      height: 46px;
      border-left: 1px solid var(--ink);
      border-right: 1px solid var(--ink);
    }
    .fb-dots-l { opacity: var(--fb-dots-l, 0); }
    .fb-dots-r { opacity: var(--fb-dots-r, 0); }
    .fb-dot[data-stop="out"] { --d: var(--fb-dot-out, 0); }
    .fb-dot[data-stop="mid"] { --d: var(--fb-dot-mid, 0); }
    .fb-dot[data-stop="in"]  { --d: var(--fb-dot-in, 0); }

    /* Sits over the first frame once it is up, so what the reader sees
       while the rest arrive is the book's first page and a count --
       never a spinner on blank paper. */
    .fb-loading {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom) + var(--navbar-h, 38px) + 44px);
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      z-index: 3;
    }

    /* ══════════════════════════════════════════════════════════════
       THE APP MAP -- what the İstanbulite logo opens
       ══════════════════════════════════════════════════════════════
       The compass bar says WHERE YOU ARE. This says where you are in
       relation to everywhere else: the app's five windows drawn in the
       shape they actually stand in -- the three lanes across the middle,
       Türkiye hanging off Kütüphane and the ilçe off Kahvehane, because
       those are the depths each of those two lanes can reach and nobody
       else can (see "What each screen carries" in CLAUDE.md).

       Two things make it different from every other surface here:

       - It is the ONE thing on the site that dims the two bars as well.
         Everywhere else the bars are omnipresent furniture that nothing
         may pass in front of (frames.css) -- and that is right, because
         everywhere else they are the answer to "where can I go". Here
         the whole screen IS that answer, so the furniture is part of
         what goes quiet. The logo alone stays lit, because it is the way
         back out -- the same move Kütüphane's Olaylar switch makes.
       - Pressing a window does not JUMP there. It closes and then walks
         the app to it one transition at a time, through every screen in
         between (see travelTo). A map that teleported would be the
         shortcut past everything, which is the one thing the whole
         arrangement exists to prevent. */
    /* The wash is ONE number used in both places -- over the page, and
       inside the bottom bar -- because the two have to read as a single
       thing going quiet rather than as two surfaces dimming by eye. */
    :root { --fb-map-red: #B93631; --fb-map-dim: rgba(16, 14, 13, 0.62); }

    #fb-map {
      position: fixed;
      inset: 0;
      z-index: 600;          /* over both bars, which sit at 100 / ~400 */
      opacity: 0;
      transition: opacity 0.22s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #fb-map[hidden] { display: none; }
    #fb-map.on { opacity: 1; }
    /* The backdrop takes the press: anywhere off a window closes it. */
    .fb-map-scrim { position: absolute; inset: 0; background: var(--fb-map-dim); }

    .fb-map-grid {
      position: absolute;
      inset: calc(var(--navbar-h-top, 54px) + env(safe-area-inset-top) + 10px)
             var(--screen-inset, 18px)
             calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom) + 18px);
      pointer-events: none;   /* only the windows answer a finger */
    }

    /* ── The wires ──
       Drawn against the grid's own thirds rather than measured off the
       windows, so a window changing size never leaves a wire hanging in
       space. They lie UNDER the windows for the same reason. */
    .fb-map-wire { position: absolute; background: #f2efec; opacity: 0.8; }
    .fb-map-wire.h { height: 6px; top: 50%; transform: translateY(-50%); }
    .fb-map-wire.v { width: 6px; left: 50%; transform: translateX(-50%); }
    .fb-map-wire.w-ku-hane   { left: 16.66%; right: 50%; }
    .fb-map-wire.w-hane-kah  { left: 50%; right: 16.66%; }
    .fb-map-wire.w-ku-tr     { left: 16.66%; top: 50%; bottom: 16.66%; right: auto; }
    .fb-map-wire.w-kah-ilce  { left: 83.33%; top: 16.66%; bottom: 50%; right: auto; }

    /* ── A window ──
       The app's screens are portrait, so these are too. Placed on a 3x3
       whose middle row is the lane strip. */
    .fb-map-win {
      position: absolute;
      width: min(26%, 132px);   /* of the grid, whose columns are its thirds */
      aspect-ratio: 3 / 4;
      transform: translate(-50%, -50%);
      background: var(--paper, #f4f1ec);
      border: 2px solid var(--ink, #17140f);
      color: var(--ink, #17140f);
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font: inherit;
      pointer-events: auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.14s ease;
    }
    .fb-map-win:active { transform: translate(-50%, -50%) scale(0.955); }
    .fb-map-win.at-r1c3 { left: 83.33%; top: 16.66%; }
    .fb-map-win.at-r2c1 { left: 16.66%; top: 50%; }
    .fb-map-win.at-r2c2 { left: 50%;    top: 50%; }
    .fb-map-win.at-r2c3 { left: 83.33%; top: 50%; }
    .fb-map-win.at-r3c1 { left: 16.66%; top: 83.33%; }

    /* WHERE YOU ARE. The only red on the layer, so it cannot be read as
       anything else -- and it is not pressable, because you are already
       standing in it. */
    .fb-map-win.here {
      border-color: var(--fb-map-red);
      color: var(--fb-map-red);
      cursor: default;
    }
    .fb-map-win.here:active { transform: translate(-50%, -50%); }

    /* Hane is the petek, so its window is a hexagon rather than a screen
       -- the middle page is the one that is not a page of tiles. */
    .fb-map-win.hex {
      border: none;
      background: none;
      padding: 0;
      align-items: center;
      justify-content: center;
    }
    .fb-map-hex {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: currentColor;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }
    .fb-map-hex > span {
      width: calc(100% - 5px); height: calc(100% - 5px);
      background: var(--paper, #f4f1ec);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* A head and shoulders in currentColor, so it goes red with the ring
       when this is the window the reader is standing in. */
    .fb-map-figure { position: relative; width: 46%; height: 58%; color: inherit; }
    .fb-map-figure::before, .fb-map-figure::after {
      content: ''; position: absolute; background: var(--ink, #17140f);
    }
    .fb-map-win.here .fb-map-figure::before,
    .fb-map-win.here .fb-map-figure::after { background: var(--fb-map-red); }
    .fb-map-figure::before {
      left: 27%; top: 0; width: 46%; aspect-ratio: 1; border-radius: 50%;
    }
    .fb-map-figure::after {
      left: 4%; right: 4%; top: 52%; bottom: 0;
      border-radius: 48% 48% 0 0 / 62% 62% 0 0;
    }

    /* The window's own hero: the map at that depth, which is what the
       real screen has at the top of it. */
    /* The hero takes whatever the window's own ratio leaves, and the
       picture inside it is OUT OF FLOW. A map PNG left in flow reports
       its intrinsic height (1080x2420 for Türkiye's) into a box whose
       height was supposed to come from aspect-ratio -- the two argue,
       intrinsic wins, and every window comes out half again too tall and
       overlapping the one below it. Nothing in here may have a height of
       its own to offer. */
    .fb-map-hero {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      background: var(--paper-card, #e9e4dc);
    }
    .fb-map-hero img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.85;
    }
    .fb-map-name {
      flex: none;
      font-size: 0.5rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1;
      color: inherit;
    }
    /* The stat squares: how much of that window's content the reader has
       actually got through. Squares because the drawing says squares --
       the same shape the right-hand column of every screen is. */
    .fb-map-stats { flex: none; display: flex; gap: 4px; }
    .fb-map-stat {
      flex: 1;
      aspect-ratio: 1;
      border: 1.5px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    /* ── The middle window is the reader's own hexagon ──
       The cell is cloned out of the petek, so everything about how it
       looks -- the drawn ring, the mask, the avatar, the badges -- is the
       petek's own and there is no second version to keep in step. What
       has to be undone is only its PLACE: in the petek it is absolutely
       positioned on the plane by calc() against the packing's own step,
       and here it simply fills the window. */
    .fb-map-hex-slot { display: block; width: 100%; }
    .fb-map-hex-slot .ist-hive-cell {
      position: static;
      width: 100%;
      opacity: 1 !important;   /* the petek's own cells are being faded out */
      transform: none;
    }
    /* Standing on Hane the window is pinned over the real cell, measured,
       so opening the map changes nothing about where the reader's own
       hexagon is -- only that everybody else has gone. */
    .fb-map-win.pinned {
      /* FIXED, not absolute. The rect is measured off the real cell in
         viewport coordinates, and every other window is placed inside the
         grid, which is inset by both bars -- left in that frame the pin
         lands exactly the grid's own inset away from the hexagon it is
         supposed to be standing on. */
      position: fixed;
      transform: none;
      aspect-ratio: auto;
      padding: 0;
      border: none;
      background: none;
    }
    .fb-map-win.pinned:active { transform: none; }
    /* Red for "you are here" is the RING going red, which is what red on a
       hexagon already means everywhere else in the petek (see the bar
       member in profile-card.css) -- not a box drawn around it. */
    .fb-map-win.here .ist-hive-frame { --hexframe-stroke: var(--fb-map-red); }

    /* ── While the map is up, the petek is only the reader ──
       Everybody else fades out under the wash and the reader's own cell
       goes with them, because the pinned clone above is standing exactly
       where it was. What the reader sees is the people leaving and
       themselves staying put. */
    body.fb-map-on #po-hive-mount .ist-hive-cell,
    body.fb-map-on #po-hive-mount .ist-hive-name,
    body.fb-map-on #po-hive-mount .ist-hive-stat { opacity: 0; }

    /* What is waiting there, in the corner a badge goes. */
    .fb-map-badge {
      position: absolute;
      top: 0; right: 0;
      transform: translate(38%, -38%);
      min-width: 19px; height: 19px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--fb-map-red);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    /* ── The logo is the door, so it is bigger and it rests on the floor ──
       It hangs below the bar's own bottom edge on purpose: everything
       else on this bar is a word printed ON the bar, and this is the one
       thing that comes off it. Nothing else here is pressable, so `nav`
       still takes no pointer events at all and only this one mark opts
       back in -- the drawing under the bar's own paper goes on answering
       a finger that lands beside it. */
    nav b.fb-logo-btn {
      pointer-events: auto;
      cursor: pointer;
      background: none;
      border: 0;
      position: relative;
      z-index: 2;              /* over the bar's own share of the dim */
      transform: translateY(14px);
      transition: transform 0.14s ease, filter 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    nav b.fb-logo-btn .fb-logo { width: 148px; height: 45px; }
    nav b.fb-logo-btn:active { transform: translateY(14px) scale(0.94); }
    /* Lit while its map is open -- it is held down because it is the way
       back out, exactly as Kütüphane's Olaylar box is. */
    body.fb-map-on nav b.fb-logo-btn {
      color: var(--fb-map-red);
      filter: drop-shadow(0 0 9px rgba(185, 54, 49, 0.55));
    }
    /* The bar's own share of the dim. It is painted INSIDE the bar
       rather than over it, so the logo can stand above it and stay the
       one lit thing on the screen. */
    /* !important, and not for tidiness. frames.css states that nothing may
       ever pass in front of the two bars, and states it with !important so
       a page's own <style data-page> cannot climb over them (see "THE TWO
       BARS ARE OMNIPRESENT" in CLAUDE.md). This layer is the ONE
       deliberate exception on the site -- it dims the bars rather than
       resting under them -- so the bar it lets through has to say so at
       the same weight, or it silently loses and the logo goes dark under
       the wash it is supposed to be standing above. */
    body.fb-map-on header { z-index: 610 !important; }
    body.fb-map-on header::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--fb-map-dim);
      pointer-events: none;
      z-index: 1;
    }

    /* ── THE GAME OVERLAY ──
       Sözcel is still a real, unmodified page (sozcel.html) -- but
       pressing its tile must not leave the book behind: no reload, no
       flash, no lost place in the flip. So it renders inside an iframe
       laid over the book, the same trick kahvehane.html's own now-parked
       game deck used. sozcel.html already knows how to be embedded (it
       checks `window.self !== window.top` and posts a close message
       instead of navigating its own back arrow); nothing there had to
       change.

       It stands in exactly the room the map + band fill on every other
       page -- the two bars stay up, the same rule everywhere else on the
       site (see "THE TWO BARS ARE OMNIPRESENT" in CLAUDE.md) -- and it
       is framed by the SAME two measurements: --map-hero-top/--map-hero-
       end for where the map's own square sits, --navbar-h for the room
       the tab bar keeps clear. Not a fraction of the screen guessed at;
       the exact box the map and the band already stand in everywhere
       else.

       Its z-index has to sit UNDER the bars' own 400/401 (frames.css),
       not over them -- the profile bar's real height is taller than
       --map-hero-top on purpose (it floats over the top sliver of the
       map on every page), so the overlay's own top edge already sits a
       little way under it. Below the bars, that sliver -- and the
       matching one the tab bar covers at the bottom -- is what makes the
       curtains read as sliding out from BEHIND the bars rather than
       over them. */
    #fb-game-overlay {
      position: fixed;
      top: var(--map-hero-top, 26px);
      left: 0; right: 0;
      bottom: calc(var(--navbar-h, 46px) + env(safe-area-inset-bottom));
      z-index: 40;          /* under the omnipresent bars (400/401) on purpose */
      background: var(--paper, #f4f1ec);
      overflow: hidden;
    }
    #fb-game-overlay[hidden] { display: none; }
    #fb-game-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
    /* Two paper pages, not a fade -- the entrance the book itself uses
       nowhere else, because nowhere else opens a real separate page. The
       iframe underneath is already loading at its true, untouched full
       size the whole time (its own layoutGame() must never measure a
       transformed box), so these are purely a cover: one the height of
       the map's own square, descending from above; one resting just
       above the actor row it was pressed from, rising from below the
       tab bar. THEY DO NOT MEET -- two windows, not one closed sheet,
       so the room between the map and the row stays exactly what it
       already was, in view the instant the curtains land. Only once
       the game has actually loaded do both get out of the way, fading
       together rather than staying on as a frame around it. Same curve
       as THE sheet's own 0.55s slide (sheet.css), so this reads as the
       same object opening a different way, not a second transition
       language. */
    .fb-game-curtain {
      position: absolute;
      left: 0; right: 0;
      background: var(--paper, #f4f1ec);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.3s ease;
    }
    .fb-game-curtain-top {
      top: 0;
      /* The map's own square: --map-hero-end minus --map-hero-top. */
      height: calc(var(--frame-pad, 10px) + 100vw);
      transform: translateY(-100%);
      border-bottom: 2px solid var(--ink, #17140f);
    }
    /* Where this one rests is the actor row's own top edge, minus a
       breath of margin -- set as --fb-curtain-bottom-top by
       openGameOverlay() the instant it measures the live row, so a
       taller Etkinlikler card or a different device is never guessed
       at. The calc() here is only the value's fallback, for the one
       frame before that measurement lands: the row's own dock formula
       (--fb-dock/--fb-line-h, see the cast block above) translated into
       this layer's own coordinate space, since the two boxes don't
       share an origin. */
    .fb-game-curtain-bottom {
      top: var(--fb-curtain-bottom-top,
            calc(100% - 16px - var(--fb-line-h, 74px) - var(--frame-pad, 10px)));
      bottom: 0;
      transform: translateY(100%);
      border-top: 2px solid var(--ink, #17140f);
    }
    #fb-game-overlay.in .fb-game-curtain { transform: translateY(0); }
    #fb-game-overlay.gone .fb-game-curtain { opacity: 0; pointer-events: none; }
  </style>
</head>

<!-- ── THE APP MAP ──
     Opened by the İstanbulite logo, which is the only thing on the

<!-- ── THE GAME OVERLAY ──

<script>
(function () {
// ══════════════════════════════════════════════════════════════
// PROJE — the flip book, on its own, with nothing else in the way
//
// A rig rather than a feature. Twelve numbered frames, scrubbed by the
// finger, and it can only come to rest on a STOP. Let go anywhere in
// between and it runs to whichever of the two stops it is between is
// nearer -- there is no stopping in mid-book and nothing to press
// there, which is the whole reason a journey like this costs nothing.
//
// Deliberately self-contained: no map, no data, no page swap, no shared
// transition machinery. If it is not smooth here it is not the app's
// fault, and if it is smooth here then everything that made it rough
// elsewhere is something else.
// ══════════════════════════════════════════════════════════════
const FRAMES = 24;

// ── What each frame shows ──
// The first two stops are the real maps -- frame 1 is Türkiye, frame 12
// İstanbul -- and everything else, the run out to frame 24 included, is
// still the numbered test slide. Swap a number for a path here and that
// frame becomes a picture; there is nothing else to change.
const OVERRIDE = {
  0:  'assets/map/kutuphane-map-mobile.png',     // 1080 x 2420 -- the odd one
  1:  'assets/map/istanbul-map-mobile02.png',    // 1080 x 1920
  2:  'assets/map/istanbul-map-mobile03.png',    // 1080 x 1920
  3:  'assets/map/istanbul-map-mobile04.png',    // 1080 x 1920
  4:  'assets/map/istanbul-map-mobile05.png',    // 1080 x 1920
  5:  'assets/map/istanbul-map-mobile06.png',    // 1080 x 1920
  // 6 -> slide 7, not drawn yet: still the numbered placeholder
  7:  'assets/map/istanbul-map-mobile08.png',    // 1080 x 1920
  8:  'assets/map/istanbul-map-mobile09.png',    // 1080 x 1920
  9:  'assets/map/istanbul-map-mobile10.png',    // 1080 x 1920
  10: 'assets/map/istanbul-map-mobile11.png',    // 1080 x 1920
  11: 'assets/map/istanbul-map-mobile.png',      // 1080 x 1920
};
const SRC = i => OVERRIDE[i] || ('assets/project/' + String(i + 1).padStart(2, '0') + '.png');

// How a frame is laid into the screen. `cover` fills it and crops what
// does not fit; `contain` shows the whole picture and leaves paper
// around it. Every frame is treated the same way, whatever its own
// shape, so the book stays registered with itself.
//
// Everything here is 9:16 (1080x1920) except the Türkiye end, which is
// 1080x2420 -- taller, so cover trims a little off its top and bottom
// where every other frame loses 9% off each side instead. That is the
// one frame not yet registered with the rest of the book.
const FIT = 'cover';

// How far the thumb travels PER PAGE, as a fraction of the screen's
// height -- not per book. Stated this way on purpose: the book's length
// is a thing that changes, and with a fixed whole-book distance every
// slide added made every page flip faster, which quietly undoes the lag
// tuning. 0.05 is the original 0.55 across the twelve-slide book.
const TRAVEL_PER_SLIDE = 0.05;
const TRAVEL = TRAVEL_PER_SLIDE * (FRAMES - 1);
// ── The stops ──
// The frames the book is allowed to come to rest on, 0-based and in
// order. Everything else is mid-flip: a stop is where the drawing is a
// real screen with real things on it, and the runs between two stops
// are the journeys.
//
// Three of them, and the two runs are the same kind of thing: 1 -> 12
// is one journey, 12 -> 24 is the next. A stop in the middle of the
// book is not a landing the gesture has to be told about -- it is just
// another entry here, which is why the whole of "add a stop" is adding
// a number to this line.
const STOPS = [0, 11, FRAMES - 1];

// The two stops a position is between -- the same stop twice when the
// book is resting on one. This is what makes a release a local
// question: the run out of a drag is decided against the stops on
// either side of the finger, never against the ends of the book.
function bracket(p) {
  let lo = STOPS[0];
  let hi = STOPS[STOPS.length - 1];
  for (const s of STOPS) if (s <= p) lo = s;
  for (let i = STOPS.length - 1; i >= 0; i--) if (STOPS[i] >= p) hi = STOPS[i];
  return [lo, hi];
}

// Where a release decides which stop it is running to, as a fraction of
// the run it was let go in, when the finger was moving slowly enough
// for position to be the question.
const TIP = 0.5;
// px/ms. Past this the direction of the throw decides instead of the
// distance, and it commits to the next stop THAT WAY rather than to an
// end of the book -- otherwise a long book can only be crossed by
// dragging half a screen, which is not a gesture anyone makes twice. 0.55 is the
// app's own throw constant (FLICK_SPEED in router.js, and the deck
// swipes on Kütüphane and Kahvehane), so a flick that turns the book
// asks exactly as much of the thumb as a flick that throws a card away.
const FLICK = 0.55;
// How fast it runs out once let go, in pages per second. A longer book
// takes longer to run out, which is right -- but only up to a point, so
// this is the knob if the far end starts feeling distant.
const RUN_FPS = 34;

// ── The three lanes of slide 12 ──
// Declared up here rather than beside the rest of the lane machinery
// because the CAST table below is written in terms of them, and a
// `const` read before its own line is a TDZ error that takes the whole
// page script with it. See "SLIDE 12 IS THREE SCREENS" further down for
// what they are.
const PETEK_STOP = 11;      // the lanes are slide 12's, and slide 12's alone
const LANE_KUTUPHANE = 0;   // left on the screen: the reading side
const LANE_HANE = 1;        // the middle: the petek
const LANE_KAHVEHANE = 2;   // right on the screen: the doing side
const LANES = 3;

// ── Where the reader comes in ──
// The middle stop and the middle lane: Hane, the petek, on slide 12.
// Not slide 1 -- the app's own rule is that you always enter in the
// MIDDLE and swipe out from there, so the book opens where the people
// are and Türkiye is one pull away rather than the doorstep.
const START_SLIDE = PETEK_STOP;
const START_LANE = LANE_HANE;

// ══════════════════════════════════════════════════════════════
// THE CAST
//
// The things that live on a STOP -- buttons, panels, the page's own
// furniture. Two rules make them work:
//
//   1. They are only ALIVE on their own stop AND their own LANE.
//      Anywhere else -- another stop, another lane, or anywhere in
//      between -- they are a picture of themselves and take no presses:
//      an actor belongs to one screen, not to the book.
//   2. They never appear or disappear. Every slide gives each of them a
//      place, and they travel between those places with the finger.
//
// A pose is `{ x, y, scale, opacity, rot }` where x and y are PERCENT
// OF THE ACTOR'S OWN SIZE -- the same units a CSS translate uses. That
// makes "parked off the left edge" simply x: -160, whatever the screen
// is, and `{}` means "exactly where its CSS puts it".
//
// The table is sparse: write the slides that matter and the rest is
// interpolated. Before the first pose you give and after the last, it
// holds.
//
// An actor on a middle stop is parked off-screen on BOTH sides of it:
// it comes in over the run that arrives at its stop and leaves again
// over the run that departs it, so it belongs to that screen coming and
// going. Its poses are symmetric about its own slide, and the symmetry
// is the whole of it -- there is no code that knows a stop is in the
// middle.
//
// `lane` is the second axis and needs no table at all: an actor is
// simply pushed a lane's width in whichever direction the reader walked
// away from it (see paintCast). That is what makes the two casts
// diverge without either of them knowing the other exists -- Kahvehane's
// leave to the right because the reader went left, and Kütüphane's
// arrive from the left because the reader kept going.
//
// `shape` is the one thing an actor says about how it LOOKS, and it
// is a word rather than a stylesheet: 'row' is the wide card in the
// left column and 'sq' the small square in the right one -- the only
// two buttons the app has (see "What each screen carries" in
// CLAUDE.md). Everything about their size and their place on the line
// is stated once in .fb-row / .fb-sq; an actor's own class only ever
// says what it is OF.
// ══════════════════════════════════════════════════════════════
const CAST = [
  {
    id: 'events',
    // The stop it belongs to, 0-based: slide 12, the İstanbul map. Not
    // the end of the book -- these are exceptional to that one screen,
    // and slide 24 will have a cast of its own.
    live: 11,
    // ...and the lane, which is the sideways half of the same answer.
    // Events are the doing side, so they are Kahvehane's.
    lane: LANE_KAHVEHANE,
    cls: 'fb-events', shape: 'row',
    // How closely it follows. Two numbers: `lag` while the finger is
    // down, `lagFree` once it is let go -- higher is tighter. Per-actor
    // on purpose: different weights are what make a screenful of things
    // read as having depth rather than being one sheet.
    lag: 0.43, lagFree: 0.135,
    // Real rows from `events`, the same query and the same card the
    // Kahvehane deck is built from. Its own fetch rather than a shared
    // one: this tab is a rig and must not depend on another page having
    // run first.
    html: '<div class="k">Etkinlikler</div><div class="t">…</div>',
    load: loadEventsActor,
    onpress(e) {
      // Interactable, and only here -- the card opens in place rather
      // than going anywhere, since this tab has nowhere to go.
      e.currentTarget.classList.toggle('open');
    },
    // In from the left over the back half of the 1 -> 12 run, home on
    // slide 12, and back out the same way over the front half of the
    // 12 -> 24 run. Symmetric about 11 on purpose: leaving a screen
    // should look like arriving at it played backwards, which is what
    // makes the two runs read as one gesture in either direction.
    poses: {
      0:  { x: -160, opacity: 1 },
      6:  { x: -160, opacity: 1 },
      8:  { x: -95 },
      10: { x: -22 },
      11: { x: 0 },
      12: { x: -22 },
      14: { x: -95 },
      16: { x: -160 },
      23: { x: -160, opacity: 1 },
    },
  },
  {
    id: 'sozcel',

// ── The lag ──
// The drawings stay locked to the finger -- they are the flip book, and
// a page that arrives late is just a slow page. The CAST trails instead:
// each actor eases toward wherever the book currently is, so the
// furniture has a little weight and settles a beat after the paper.
//
// The number is the fraction of the remaining distance covered per 60Hz
// frame -- 0.16 catches up ~63% in 6 frames, which reads as weight
// rather than as lag. It is applied per elapsed time, not per frame, so
// it feels identical on a 120Hz screen.
// Two rates, not one. While the finger is DOWN the screen should stay
// close to it -- a big trail under your own thumb reads as the app
// struggling, not as weight. Once it is let go there is nothing to keep
// up with, and a slower catch-up is what makes the settle feel heavy
// rather than mechanical.
//
// Higher is TIGHTER: it is the fraction of the remaining distance
// covered per 60Hz frame. So the dragging number is the big one.
const CAST_LAG = 0.43;        // following the finger
const CAST_LAG_FREE = 0.135;  // let go   (the same 3.2 : 1 ratio)
// The drawings, on their own pair of knobs. Set both to 1 and the paper
// is locked to the finger while the furniture still trails.
const FRAME_LAG = 0.43;
const FRAME_LAG_FREE = 0.135;
let castTarget = 0;
let castTick = null;
let castLast = 0;
// Where the DRAWINGS have caught up to. Continuous, like an actor's --
// what gets rounded is only which frame that lands on.
let framePos = START_SLIDE;

let cast = [];
let imgs = [];
let at = START_SLIDE;   // 0..FRAMES-1, where the book is resting
let shown = -1;
let anim = null;

// Looked up in mount(), never at the top level. router.js runs a page's
// script at idle, before the reader ever asks for it -- which happens
// while a DIFFERENT page's DOM is on screen, so a top-level
// getElementById here finds nothing and throws, and a script that
// throws half way has already declared its consts and cannot be run
// again. Everything that touches the DOM waits for mount().
let box = null;


// ── The events actor's own content ──
// One fetch, the next few evenings in the city, soonest first -- the
// same rows and the same order Kahvehane's deck uses.
const NB_NAMES = {
  bakirkoy:'Bakırköy', bayrampasa:'Bayrampaşa', bahcelievler:'Bahçelievler', sisli:'Şişli',
  eyupsultan:'Eyüpsultan', gop:'Gaziosmanpaşa', esenler:'Esenler', bagcilar:'Bağcılar',
  basaksehir:'Başakşehir', kucukcekmece:'Küçükçekmece', sultangazi:'Sultangazi',
  uskudar:'Üsküdar', kadikoy:'Kadıköy', maltepe:'Maltepe', umraniye:'Ümraniye',
  cekmekoy:'Çekmeköy', beykoz:'Beykoz', sariyer:'Sarıyer', besiktas:'Beşiktaş',
  beyoglu:'Beyoğlu', gungoren:'Güngören', kagithane:'Kağıthane', atasehir:'Ataşehir',
  zeytinburnu:'Zeytinburnu', fatih:'Fatih',
};
const MON_TR = ['OCA','ŞUB','MAR','NİS','MAY','HAZ','TEM','AĞU','EYL','EKİ','KAS','ARA'];

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// Everything Istanbul-dated goes through one clock (CLAUDE.md rule 10);
// here that is just the timeZone these are formatted in.
function eventWhen(iso) {
  const d = new Date(iso);
  const tz = 'Europe/Istanbul';
  const day = parseInt(d.toLocaleDateString('en-US', { timeZone: tz, day: 'numeric' }), 10);
  const mon = parseInt(d.toLocaleDateString('en-US', { timeZone: tz, month: 'numeric' }), 10);
  const wd = d.toLocaleDateString('tr-TR', { timeZone: tz, weekday: 'short' }).toLocaleUpperCase('tr-TR');
  const time = d.toLocaleTimeString('tr-TR', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false });
  return day + ' ' + (MON_TR[mon - 1] || '') + ' ' + wd + ' · ' + time;
}

async function loadEventsActor(el) {

  } catch (err) {
    console.error('[proje events]', err);
    failed = true;
  }
  if (!el.isConnected) return;

  // Three states, and they say different things: a city with nothing on,

  if (failed) {

  const more = rows.length - 1;

// ── Kütüphane's lane: the newest story ──
// The same three states the events actor says, for the same reason, and
// the same 72-hour window Kütüphane's own column reads in: what is on
// this card has to be what is on that page, or the rig is testing a
// screen the app does not have.
async function loadHaberlerActor(el) {

    const { data, error } = await IstRouter.sb.from('breaking_news')
      .select('id, title, body, title_en, body_en, category, neighborhood, updated_at')

// A story is entered in both languages (db/breaking_news_v2_bilingual.sql);
// the English half is used only where the reader is in English and it was
// actually written, so a half-translated story still reads in Turkish.
function newsText(row, field) {
  if (!row) return '';
  const en = row[field + '_en'];
  if (window.I18N && I18N.isEnglish() && en && String(en).trim()) return en;
  return row[field];
}

// Which layer a story belongs to -- the same words Kütüphane's own cards
// are kickered with (newsCategoryLabel there).
function newsKicker(n) {
  const c = n.category || n.neighborhood || 'turkiye';
  if (c === 'turkiye') return 'TÜRKİYE';
  if (c === 'istanbul') return 'İSTANBUL';
  if (c === 'dunya') return 'DÜNYA';
  return (NB_NAMES[c] || c).toLocaleUpperCase('tr-TR');
}

function newsAge(iso) {
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return mins + ' dk önce';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' saat önce';
  return Math.round(hrs / 24) + ' gün önce';
}

// ── And the olaylar board's own door ──
// A count rather than a headline: an olay is the thing the stories are

    (rows && rows.length
      ? '<div class="x">' + rows.map(r => '<p>' + esc(r.title) + '</p>').join('') + '</div>'
      : '');
