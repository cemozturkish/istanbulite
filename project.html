// ── Poses ──
const POSE0 = { x: 0, y: 0, scale: 1, opacity: 1, rot: 0 };
const lerp = (a, b, t) => a + (b - a) * t;

// Fill a sparse table so every slide has a pose.
function expandPoses(poses) {
  const out = new Array(FRAMES);
  const given = [];
  for (let i = 0; i < FRAMES; i++) {
    if (poses[i]) { out[i] = Object.assign({}, POSE0, poses[i]); given.push(i); }
  }
  if (!given.length) { out.fill(POSE0); return out; }
  for (let i = 0; i < given[0]; i++) out[i] = out[given[0]];
  for (let i = given[given.length - 1] + 1; i < FRAMES; i++) out[i] = out[given[given.length - 1]];
  for (let g = 0; g < given.length - 1; g++) {
    const a = given[g], b = given[g + 1];
    for (let i = a + 1; i < b; i++) {
      const t = (i - a) / (b - a);
      out[i] = {
        x: lerp(out[a].x, out[b].x, t), y: lerp(out[a].y, out[b].y, t),
        scale: lerp(out[a].scale, out[b].scale, t),
        opacity: lerp(out[a].opacity, out[b].opacity, t),
        rot: lerp(out[a].rot, out[b].rot, t),
      };
    }
  }
  return out;
}

function buildCast() {
  const layer = document.getElementById('fb-cast');
  if (!layer) return;
  stopCastTick();
  layer.innerHTML = '';
  cast = CAST.map(def => {
    const el = document.createElement('button');
    el.type = 'button';
    // Identity and shape are separate: `cls` says what the actor is OF
    // and `shape` is one of the app's two buttons -- a wide row on the
    // left of the line or a small square on the right of it. Nothing
    // below the shape class decides a size.
    el.className = 'fb-actor ' + def.cls + (def.shape ? ' fb-' + def.shape : '');
    el.innerHTML = def.html;
    if (def.onpress) el.addEventListener('click', def.onpress);
    layer.appendChild(el);
    // Fetched once per mount, after the element exists, and never
    // awaited by anything: an actor whose rows have not landed yet is
    // still an actor, and the book must not wait on the network.
    if (def.load) { try { def.load(el); } catch (e) { console.error(e); } }
    return { def, el, poses: expandPoses(def.poses || {}), pos: 0,
             lag: def.lag == null ? CAST_LAG : def.lag,
             lagFree: def.lagFree == null ? CAST_LAG_FREE : def.lagFree };
  });
}

function stopCastTick() {
  if (castTick) { cancelAnimationFrame(castTick); castTick = null; }
}

// Where the book is; the actors will get there in their own time.
// Where the book is; the drawings and the actors will each get there in
// their own time.
function aim(p, snap) {
  castTarget = Math.max(0, Math.min(FRAMES - 1, p));
  if (snap) {
    stopCastTick();
    framePos = castTarget;
    for (const a of cast) a.pos = castTarget;
    paintFrame();
    paintCast();
    return;
  }
  if (!castTick) { castLast = performance.now(); castTick = requestAnimationFrame(castStep); }
}

// One ease, used by the drawings and by every actor, so they cannot
// drift apart in how they feel. Per elapsed time rather than per frame,
// so 60Hz and 120Hz behave the same rather than the faster screen
// catching up twice as fast.
function ease(pos, target, lag, dt) {
  const d = target - pos;
  if (Math.abs(d) < 0.0015) return target;
  return pos + d * (1 - Math.pow(1 - lag, dt / 16.6667));
}

function castStep(now) {
  const dt = Math.min(64, now - castLast) || 16.7;
  castLast = now;
  let moving = false;
  // Which pair is live depends on whether a finger is on the glass. The
  // rate can change mid-flight without a jump: it governs how fast the
  // gap closes, never where anything is.
  const held = !!drag;
  const fp = ease(framePos, castTarget, held ? FRAME_LAG : FRAME_LAG_FREE, dt);
  if (fp !== framePos) { framePos = fp; moving = true; }
  paintFrame();
  for (const a of cast) {
    const np = ease(a.pos, castTarget, held ? a.lag : a.lagFree, dt);
    if (np !== a.pos) { a.pos = np; moving = true; }
  }
  paintCast();
  // The position marks ride the eased frame position, so they are
  // repainted here rather than only when the lane changes.
  paintNav();
  // Every frame, not only when the tick stops: an actor that has come
  // near enough to its own slide is pressable, even while the last few
  // pixels are still easing in.
  armCast();
  if (moving) castTick = requestAnimationFrame(castStep);
  else castTick = null;
}

// The actors move continuously between poses while the frame index
// jumps whole numbers: a flip book flips, but type sliding in
// whole-pixel steps shimmers.
function paintCast() {
  for (const a of cast) {
    const p = a.pos;
    const lo = Math.max(0, Math.min(FRAMES - 1, Math.floor(p)));
    const hi = Math.max(0, Math.min(FRAMES - 1, lo + 1));
    const t = p - lo;
    const A = a.poses[lo], B = a.poses[hi];
    const y = lerp(A.y, B.y, t);
    const sc = lerp(A.scale, B.scale, t), rot = lerp(A.rot, B.rot, t);
    // The petek pushes them off to the right on top of wherever the
    // book has them: a second term rather than a second pose table,
    // because it is a different gesture happening at the same time,
    // not a different place in the book.
    // Where the reader is standing relative to THIS actor's lane, in
    // lanes. One rule for both casts, and it is the whole of what makes
    // them diverge: an actor is pushed away in the direction the reader
    // walked, so Kahvehane's leave to the right as the reader goes left
    // and Kütüphane's arrive from the left as they keep going. Nothing
    // here knows which lane is which.
    const d = Math.max(-1, Math.min(1, lanePos - a.def.lane));
    const x = lerp(A.x, B.x, t) - d * LANE_EXIT;
    a.el.style.transform = 'translate3d(' + x + '%,' + y + '%,0) scale(' + sc + ')' +
                           (rot ? ' rotate(' + rot + 'deg)' : '');
    a.el.style.opacity = String(lerp(A.opacity, B.opacity, t) * (1 - Math.abs(d)));
  }
}

// Alive only when the book is actually resting on the stop an actor
// belongs to. Mid-flight, and on any other stop, it is a drawing.
// How close an actor has to be to its own slide before it will take a
// press. Not zero: an exponential ease never quite arrives, and waiting
// for the last thousandth left the card unpressable for the better part
// of a second after it had visibly stopped. 0.05 of a slide is about
// six pixels of drift left -- close enough to press, far enough that
// nothing is live while it is still visibly travelling.
const LIVE_EPS = 0.05;

function armCast() {
  // The drawings are part of "settled" now: while they are still
  // catching up the book is visibly mid-flip, whatever `at` says. So is
  // the petek: an actor on its way off the screen is a picture of a
  // button exactly as one mid-flip is.
  const settled = ready && !drag && !anim && !laneRun &&
                  Math.abs(framePos - castTarget) < LIVE_EPS;
  for (const a of cast) {
    // Its own stop AND its own lane: slide 12 is three screens, and an
    // actor belongs to one of them.
    a.el.classList.toggle('live', settled &&
      Math.abs(a.pos - a.def.live) < LIVE_EPS &&
      Math.abs(lanePos - a.def.lane) < LIVE_EPS);
  }
  // Where the BOOK is, which is a different question from whether the
  // cast is live: a finger on the glass makes nothing live, but it does
  // not move the book off slide 12 -- and the pull that opens the petek
  // begins with a finger already down. Asking `!drag` here is what made
  // the very gesture this flag gates impossible: armCast runs on
  // pointerdown, so the flag was cleared a frame before it was read.
  atLaneStop = ready && Math.abs(framePos - PETEK_STOP) < LIVE_EPS;
  // Arriving on slide 12 is what BUILDS the petek, so the pull never
  // waits on a round trip. Once per arrival, and only once the book has
  // stopped.
  if (!atLaneStop) petekBuilt = false;
  else if (!petekBuilt && !drag && !anim) { petekBuilt = ensurePetek(); }
}

// Showing a frame is one class swap. Nothing else touches the DOM
// during a drag, which is what keeps the main thread free enough to
// track the finger.
// Which drawing is up. The position is continuous and eased like an
// actor's; what is whole-numbered is only the frame it lands on -- a
// flip book flips, and blending two drawings makes a third nobody drew.
function paintFrame() {
  if (!imgs.length) return;
  const i = Math.max(0, Math.min(FRAMES - 1, Math.round(framePos)));
  if (i === shown) return;
  if (shown >= 0) imgs[shown].classList.remove('on');
  imgs[i].classList.add('on');
  shown = i;
}

// Aim everything at where the book now is. Nothing paints from `p`
// directly any more: the drawings and the actors each ease toward it.
function show(p, snap) {
  aim(Math.max(0, Math.min(FRAMES - 1, p)), snap);
}

// ── Loading ──
// Two rules, and they pull against each other.
//
// Every frame must be decoded before the book can reach it: an <img>
// whose bytes are not ready paints nothing, and a blank page in the
// middle of a flip is worse than a wait at the start. But waiting for
// the whole book before showing anything means staring at the word
// "loading" while ~4 MB of drawings arrive, which is the app looking
// broken at the exact moment it should look like a book.
//
// So the first frame is decoded on its own and put up straight away --
// the page is a map within a moment -- and the rest are fetched in
// parallel but decoded in order behind it. The gesture only arms once
// they are all in, so the book is never asked for a page it does not
// have. What the reader sees meanwhile is the first drawing and a count,
// not a spinner.
let ready = false;

function loadingLine(n) {
  const el = document.getElementById('fb-loading');
  if (!el) return;
  if (n >= FRAMES) { el.remove(); return; }
  el.textContent = n + ' / ' + FRAMES;
}

async function load() {
  if (!box) return;
  ready = false;
  imgs = [];
  for (let i = 0; i < FRAMES; i++) {
    const img = new Image();
    img.decoding = 'async';
    img.alt = '';
    imgs.push(img);
  }
  const decode = (img) => (img.decode ? img.decode().catch(() => {}) : Promise.resolve());

  // The first frame is fetched ALONE. Starting them all at once shares
  // the connection between all of them and the first page arrives no sooner than
  // the last -- measured on a 4 Mbps link, 7.9s for both. Fetching it by
  // itself gets it on screen in a fraction of that, and the rest have
  // the whole rest of the wait to arrive in. `fetchPriority` alone does
  // not do this: it reorders a queue, it does not empty one.
  // It is the frame the reader ENTERS on, not frame 0: the book opens on
  // the middle stop, so that is the one drawing that has to be up before
  // anything else has arrived.
  const first = START_SLIDE;
  if ('fetchPriority' in imgs[first]) imgs[first].fetchPriority = 'high';
  imgs[first].src = SRC(first);
  await decode(imgs[first]);
  if (!box || !box.isConnected) return;
  box.appendChild(imgs[first]);
  shown = -1; at = START_SLIDE;
  show(at, true);
  loadingLine(1);

  // Now the rest: all fetched at once (the network is idle again and
  // parallel is right for it), decoded one at a time (simultaneous
  // decodes of a 1080x1920 image allocate ~8 MB of surface each, and
  // the book is two dozen of them).
  let done = 1;
  for (let i = 0; i < FRAMES; i++) if (i !== first) imgs[i].src = SRC(i);

  for (let i = 0; i < FRAMES; i++) {
    if (i === first) continue;
    await decode(imgs[i]);
    if (!box || !box.isConnected) return;
    box.appendChild(imgs[i]);
    loadingLine(++done);
  }
  ready = true;
  armCast();
}

// ── The gesture ──
// One pointer, vertical only. `at` is where the book was resting when
// the finger landed, so a drag continues from there rather than
// restarting -- pull down twice and it keeps going forward.
let drag = null;

function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }

// ══════════════════════════════════════════════════════════════
// SLIDE 12 IS THREE SCREENS, NOT ONE
//
// The book's stops are its DEPTH -- slide 1 is Türkiye, slide 12 is
// İstanbul, slide 24 is what is inside it. Slide 12 also has a
// SIDEWAYS axis, and it is the app's own carousel laid on the one
// slide that is the city:
//
//        LANE 0            LANE 1           LANE 2
//      Kütüphane   <--     Hane      -->   Kahvehane
//      (the read)       (the petek)        (the doing)
//
// left to right on the screen, exactly as the three tabs stand. A pull
// right walks the strip right, so the reader moves LEFT along it --
// Kahvehane, then Hane, then Kütüphane -- and a pull left walks back.
//
// Each lane has its own cast, and they never trade places: the buttons
// that left to the right are Kahvehane's and stay gone; the ones that
// arrive from the left are Kütüphane's. Nothing navigates, nothing
// rises from the bottom, and the drawing underneath is left exactly
// where it is -- this is the one screen all three are about, and a
// surface that covered it would take back the thing being answered.
//
// ── And the lane decides which way the book may move ──
// This is the whole point of the divergence rather than a rule bolted
// onto it. Standing on Kütüphane you are facing OUT, so the only depth
// you can reach is slide 1 -- Türkiye. Standing on Kahvehane you are
// facing IN, so the only one is slide 24. Standing on Hane the
// vertical gesture is not the book's at all: it is the petek's own
// depth pull.
//
// So there is no way from Türkiye to the innermost slide that does not
// pass through Hane. That is the mall stairway in the smallest form it
// has ever had here: you cannot go from the reading to the doing
// without walking past the people.
// ══════════════════════════════════════════════════════════════
// How far an actor is pushed when the reader walks off its lane, in
// percent of the actor's own width.
const LANE_EXIT = 190;
// The thumb distance for ONE lane, as a fraction of the screen's width
// -- stated per lane rather than per strip, the same rule the book's
// own travel follows.
const LANE_TRAVEL = 0.42;
const LANE_RUN_MS = 300;
// ── The walk back to Hane is ANSWERED, not dragged ──
// Every other gesture here follows the finger, and that is right for a
// scrub: the reader is choosing where in the strip to stand. Arriving on
// Hane is not that -- it is the one screen the whole arrangement puts in
// the middle, and it is a place the reader either goes to or does not.
// So a pull toward it does not walk the strip under the finger at all:
// the swipe is READ, and the app answers it by making the move itself.
// The two outward pulls (Hane -> either side) still follow the finger,
// because there the reader is stepping off the middle rather than into
// it.
const LANE_SNAP_TRAVEL = 0.18;   // how far the finger goes before the app answers
// px before a drag has to say which axis it is. The book's own gesture
// is vertical and the lanes' is horizontal, so this is the one place
// they are told apart.
const AXIS_SLOP = 8;

// The reader starts on Hane, because the book starts on the middle stop
// and the middle stop's middle lane is the petek: the lane and the depth
// have to agree, and from here either run of the book is one pull away.
let lane = START_LANE;
let lanePos = START_LANE;       // continuous; the drag writes it live
let laneRun = null;
let atLaneStop = false;  // whether the book is standing on PETEK_STOP
let petekBuilt = false;  // whether this arrival has already mounted it

const clamp01 = (n) => n < 0 ? 0 : n > 1 ? 1 : n;

// How present a lane's own things are: 1 standing on it, 0 a whole lane
// away, and the linear middle in between. One function for the petek
// and for every actor, so nothing can arrive on a different curve from
// its neighbour.
function lanePresence(l) { return 1 - Math.min(1, Math.abs(lanePos - l)); }

// One number drives the wash, the hexagons and every actor's exit: the
// two layers are the stylesheet's job off --fb-petek-p (see .fb-scrim /
// .fb-petek), and the actors are painted from lanePos here.
function paintLanes() {
  if (!box) return;
  const petek = lanePresence(LANE_HANE);
  box.style.setProperty('--fb-petek-p', String(petek));
  box.classList.toggle('petek-pulling', petek > 0);
  box.classList.toggle('petek-open', lane === LANE_HANE && petek >= 1);
  paintCast();
  paintNav();
}

// The bar says where the reader is standing, continuously: each mark is
// lit by its own lane's presence, the same number the wash and the
// hexagons run on. Off slide 12 the lane still means something -- it is
// which of the two runs the reader is on -- so Kütüphane stays lit all
// the way out to Türkiye and Kahvehane all the way in.
function paintNav() {
  if (!box) return;
  const root = document.documentElement;
  const marks = box.ownerDocument.querySelectorAll('#fb-nav b');
  const pres = [];
  for (let i = 0; i < LANES; i++) {
    const p = lanePresence(i);
    pres.push(p);
    root.style.setProperty('--fb-nav-' + i, p.toFixed(3));
    if (marks[i]) marks[i].classList.toggle('on', lane === i);
  }
  // A column belongs to its own lane AND to Hane, because the mark it
  // shares with Hane is the one in the middle: standing on Hane both
  // halves of the broken line are up, and the centre mark is inked from
  // either side.
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  root.style.setProperty('--fb-dots-l',
    clamp01(pres[LANE_KUTUPHANE] + pres[LANE_HANE]).toFixed(3));
  root.style.setProperty('--fb-dots-r',
    clamp01(pres[LANE_KAHVEHANE] + pres[LANE_HANE]).toFixed(3));
  // The ink is where the BOOK is, eased, not where `at` is aimed: the
  // marks travel with the paper rather than reporting the release.
  const p = framePos;
  const S = STOPS;
  let out = 0, mid = 0, inn = 0;
  if (p <= S[1]) {
    const t = clamp01((S[1] - p) / (S[1] - S[0]));
    out = t; mid = 1 - t;
  } else {
    const t = clamp01((p - S[1]) / (S[2] - S[1]));
    inn = t; mid = 1 - t;
  }
  root.style.setProperty('--fb-dot-out', out.toFixed(3));
  root.style.setProperty('--fb-dot-mid', mid.toFixed(3));
  root.style.setProperty('--fb-dot-in', inn.toFixed(3));
}


function setLanePos(p) {
  lanePos = Math.max(0, Math.min(LANES - 1, p));
  paintLanes();
}

// Whether a pull that way has anywhere to go. Not a general "are the
// lanes open": it is the direction as well, so a pull off the end of
// the strip is nobody's and falls through to whatever is underneath.
function lanePullable(dx) {
  if (!atLaneStop) return false;
  // Right walks the strip right, so the reader moves toward lane 0.
  return dx > 0 ? lane > 0 : lane < LANES - 1;
}

// ── What the lane lets the book reach ──
// The two ends of the run the reader is standing on. Kütüphane's run is
// slide 1 to slide 12, Kahvehane's is slide 12 to slide 24, and Hane
// has none at all -- its vertical gesture belongs to the petek.
function laneStops() {
  if (lane === LANE_KUTUPHANE) return [STOPS[0], STOPS[1]];
  if (lane === LANE_KAHVEHANE) return [STOPS[1], STOPS[2]];
  return [STOPS[1], STOPS[1]];
}

// The release: carry on from where the finger left off. Timed rather
// than frame-paced -- the book runs out at the speed pages turn, but
// this is a wash and a fade, which have no pages in them.
function runLane(to, done) {
  if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
  lane = Math.max(0, Math.min(LANES - 1, to));
  // ── The petek arrives WITH the walk, not after it ──
  // The reveal belongs to the arrival: armed here, at the moment the
  // move is answered, the reader watches the wash come up and the
  // honeycomb draw itself in behind it -- you, the ring touching you,
  // then the names. Armed at the end instead, the cells would already be
  // standing there at full strength and the stagger would read as a
  // flash. ensurePetek deliberately refuses to remount a standing petek,
  // so this cannot ride on the mount (see revealHivePage).
  if (lane === LANE_HANE && lanePos !== LANE_HANE &&
      window.IstProfileCard && IstProfileCard.revealHivePage) {
    IstProfileCard.revealHivePage();
  }
  const from = lanePos;
  const dist = Math.abs(lane - from);
  if (dist < 0.001) { setLanePos(lane); armCast(); if (done) done(); return; }
  const ms = LANE_RUN_MS * dist;
  const t0 = performance.now();
  const step = (now) => {
    const a = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - a, 3);   // ease out
    setLanePos(from + (lane - from) * e);
    if (a < 1) { laneRun = requestAnimationFrame(step); }
    else { laneRun = null; setLanePos(lane); armCast(); if (done) done(); }
  };
  laneRun = requestAnimationFrame(step);
}

// Built the moment the book comes to rest on slide 12, never on the
// pull itself: mounting is a round trip to hive_map(), and a reveal
// that waits on the network is a reveal with a blank beat in it. Every
// arrival re-mounts, because somebody else's attachment may have
// carried this whole petek somewhere since it was last drawn -- the
// same rule Hane follows. Not while it is standing, though: that would
// pull the drawing out from under the reader.
// Answers whether it actually mounted, and the caller latches on that
// rather than on having called it: this function is allowed to decline,
// and a latch set before the call spends the one arrival that had a
// chance of building the petek on a call that did nothing.
function ensurePetek() {
  // Never REmount while it is standing -- that pulls the drawing out from
  // under the reader. But an empty petek is not a drawing anybody is
  // standing in: if nothing has been mounted yet there is nothing to
  // disturb, and refusing here leaves the reader on a blank Hane.
  //
  // That is not hypothetical. Arriving on Hane through the app map walks
  // the book first and the lane second, and `framePos` LAGS `at` -- so
  // atLaneStop only comes true a beat later, by which time the lane is
  // already Hane and the arrival's one chance to mount is refused.
  // Standing on Hane with a petek already up: there is nothing to do, and
  // nothing will change until the reader leaves -- so this arrival counts
  // as settled. Only the cases that could not mount YET answer false.
  const mounted = !!document.getElementById('po-hive-mount');
  if (mounted && lanePresence(LANE_HANE) > 0) return true;
  if (!window.IstProfileCard || !IstProfileCard.mountHivePage) return false;
  if (!document.getElementById('fb-petek')) return false;
  try {
    IstProfileCard.mountHivePage({
      sb: IstRouter.sb, I18N: window.I18N, mountId: 'fb-petek',
    });
    return true;
  } catch (err) { console.error('[proje petek]', err); return false; }
}

function onDown(e) {
  if (!ready) return;
  // A press that lands on a live actor is that actor's, not the book's.
  // Without this the book swallows its own buttons: the drag handler
  // takes pointer capture on the way down, which re-targets the eventual
  // click at the capturing element, so the card never hears it. It looks
  // exactly like a dead button and nothing throws.
  if (e.target && e.target.closest && e.target.closest('.fb-actor.live')) return;
  // While the petek is standing, everything inside it is ITS gesture --
  // the depth pull, a hexagon, the field that takes a code. Only a
  // horizontal drag is ours, and horizontal is exactly what the petek's
  // own handler hands back (see wireHiveGestures in profile-card.js).
  // So a press that lands in it is tracked but never CAPTURED: capture
  // would re-target every following event at this box and kill the
  // petek's own handlers outright.
  const inPetek = lanePresence(LANE_HANE) > 0 &&
                  !!(e.target && e.target.closest && e.target.closest('.fb-petek'));
  stopAnim();
  if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
  drag = { x: e.clientX, y: e.clientY, from: at, fromLane: lanePos, axis: null, moved: false,
           lastX: e.clientX, lastY: e.clientY, lastT: performance.now(), v: 0, vx: 0, inPetek };
  armCast();                    // a press begins: the cast goes inert
  if (!inPetek) box.setPointerCapture && box.setPointerCapture(e.pointerId);
}

function onMove(e) {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  // ── Which gesture is this? ──
  // The book's is vertical and the petek's is horizontal; this is the
  // one place they are told apart, and a drag that turns out to belong
  // to neither is dropped rather than half-answered.
  if (!drag.axis) {
    if (Math.abs(dx) < AXIS_SLOP && Math.abs(dy) < AXIS_SLOP) return;
    drag.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
    if (drag.axis === 'x' && !lanePullable(dx)) { drag = null; armCast(); return; }
    // Right walks the strip right, so the reader moves toward lane 0.
    // Taken once, with the axis: which lane this gesture is aimed at
    // cannot change half way through it.
    if (drag.axis === 'x') {
      const aim = Math.max(0, Math.min(LANES - 1, lane + (dx > 0 ? -1 : 1)));
      drag.snapTo = aim === LANE_HANE ? aim : null;
    }
    // A vertical drag while the petek is on screen is the petek's own
    // depth pull, not the book being scrubbed underneath it.
    if (drag.axis === 'y' && (lanePresence(LANE_HANE) > 0 || drag.inPetek)) {
      drag = null; armCast(); return;
    }
    // Which run the reader is on is the LANE's answer, not the book's --
    // and it is taken once, at the moment the gesture claims its axis,
    // so a drag cannot be re-scoped half way through.
    if (drag.axis === 'y') drag.run = laneStops();
    drag.moved = true;
  }
  const now = performance.now();
  const dt = now - drag.lastT;
  if (drag.axis === 'x') {
    if (dt > 0) drag.vx = (e.clientX - drag.lastX) / dt;
    drag.lastX = e.clientX; drag.lastT = now;
    // The strip follows the finger, like everything else here. A pull
    // right walks the strip right, so the reader moves toward lane 0.
    //
    // At most ONE lane per gesture, however far the finger goes: this is
    // a carousel of three screens, not a scrub through twenty-four, and
    // a swipe that crossed two of them walked the reader straight past
    // Hane -- which is the one screen the whole arrangement exists to
    // put in the middle. The book's own vertical is deliberately not
    // clamped this way: there it IS a scrub.
    // Clamped around the lane the reader is COMMITTED to, not around
    // where the drawing happened to be when the finger went down: an
    // interrupted run leaves those two apart, and clamping to the
    // drawing lets a long drag reach a lane two along.
    // A pull toward Hane is read rather than followed (see
    // LANE_SNAP_TRAVEL): the drawing does not move at all until the
    // finger has said enough, and then the app makes the whole move on
    // its own. Either a throw or enough travel is "enough"; anything
    // less leaves the reader exactly where they were standing.
    if (drag.snapTo !== null && drag.snapTo !== undefined) {
      const far = Math.abs(dx) >= window.innerWidth * LANE_SNAP_TRAVEL;
      if (far || Math.abs(drag.vx) > FLICK) {
        const to = drag.snapTo;
        drag = null;
        runLane(to);
      }
      e.preventDefault();
      return;
    }
    const to = drag.fromLane - dx / (window.innerWidth * LANE_TRAVEL);
    setLanePos(Math.max(lane - 1, Math.min(lane + 1, to)));
    e.preventDefault();
    return;
  }
  if (dt > 0) drag.v = (e.clientY - drag.lastY) / dt;
  drag.lastY = e.clientY; drag.lastT = now;
  // Down is forward. The span is the whole book, so the finger is
  // moving the pages rather than nudging a counter.
  const span = window.innerHeight * TRAVEL;
  const p = drag.from + (dy / span) * (FRAMES - 1);
  // Clamped to the lane's run, not to the book: from Kütüphane the
  // deepest the finger can reach is slide 12, and from Kahvehane the
  // shallowest is. A pull the wrong way simply does not move the paper,
  // which says "not this way" more plainly than springing back would.
  const run = drag.run || STOPS;
  at = Math.max(run[0], Math.min(run[1], p));
  show(at);
  e.preventDefault();
}

// Run to a stop at a steady rate. Deliberately frame-paced rather than
// eased: this is a flip book being let go of, and the pages should turn
// at the speed pages turn.
function runTo(target, done) {
  stopAnim();
  const from = at;
  const dist = Math.abs(target - from);
  if (dist < 0.001) { at = target; show(at); armCast(); if (done) done(); return; }
  const ms = (dist / RUN_FPS) * 1000;
  const t0 = performance.now();
  const step = (now) => {
    const a = Math.min(1, (now - t0) / ms);
    at = from + (target - from) * a;
    show(at);
    if (a < 1) anim = requestAnimationFrame(step);
    else { anim = null; at = target; armCast(); if (done) done(); }
  };
  anim = requestAnimationFrame(step);
}

function onUp() {
  if (!drag) return;
  const wasDrag = drag.moved;
  const axis = drag.axis;
  const v = drag.v;
  const vx = drag.vx;
  const snapTo = drag.snapTo;
  drag = null;
  if (!wasDrag) { armCast(); return; }
  // The lanes: a throw decides by direction, a slow release by how far
  // it got -- the same two rules the book itself releases on, and the
  // same local question, since the strip is a row of stops too.
  if (axis === 'x') {
    // The two candidates are always the lane the reader is on and the
    // ONE next to it in the direction they pulled -- never `floor` of
    // where the drawing ended up, which at a whole number brackets the
    // wrong pair and overshoots by a lane in one direction only.
    const step = (n) => Math.max(0, Math.min(LANES - 1, n));
    // A pull toward Hane that was let go before the app answered it: the
    // strip never moved, so there is nothing to run back -- only a throw
    // still counts, which is the same rule the move itself is read by.
    if (snapTo !== null && snapTo !== undefined) {
      if (Math.abs(vx) > FLICK) runLane(snapTo);
      else armCast();
      return;
    }
    if (Math.abs(vx) > FLICK) { runLane(step(lane + (vx > 0 ? -1 : 1))); return; }
    const dir = lanePos < lane ? -1 : lanePos > lane ? 1 : 0;
    if (!dir) { runLane(lane); return; }
    runLane(Math.abs(lanePos - lane) >= TIP ? step(lane + dir) : lane);
    return;
  }
  // The book only ever comes to rest on a stop, and the question is
  // always local: which of the two stops the finger was let go BETWEEN.
  // A throw decides by DIRECTION; a slow release decides by position.
  const [lo, hi] = bracket(at);
  if (lo === hi) { runTo(lo); return; }
  if (Math.abs(v) > FLICK) { runTo(v > 0 ? hi : lo); return; }
  runTo((at - lo) / (hi - lo) >= TIP ? hi : lo);
}

// ── The page lifecycle router.js drives ──
// Bound to the box rather than to the document, so the listeners leave
// with the page when #ist-content is swapped (see CLAUDE.md: "A page
// script must not delegate on `document` for anything another page also
// has").
function mount() {
  document.getElementById('main-site').classList.add('active');
  box = document.getElementById('fb');
  if (!box) return;
  box.style.setProperty('--fb-fit', FIT);
  // A fresh box, and a fresh #fb-petek inside it. The reader starts on
  // Hane because the book starts on the middle stop: the lane and the
  // depth have to agree, or the first pull down is one the lane forbids.
  lane = START_LANE; lanePos = START_LANE;
  atLaneStop = false; petekBuilt = false;
  buildCast();
  paintLanes();     // after buildCast: it paints the cast too
  box.addEventListener('pointerdown', onDown, { passive: true });
  box.addEventListener('pointermove', onMove, { passive: false });
  box.addEventListener('pointerup', onUp, { passive: true });
  box.addEventListener('pointercancel', onUp, { passive: true });
  // A fresh box every mount, so the decoded frames have to be put back
  // into it. They are kept, not re-fetched: decoding two dozen
  // 1080x1920 images is the one cost worth paying only once.
  if (imgs.length && ready) {
    const spinner = document.getElementById('fb-loading');
    if (spinner) spinner.remove();
    imgs.forEach(i => { i.classList.remove('on'); box.appendChild(i); });
    shown = -1; at = START_SLIDE; show(at, true); armCast();
  } else {
    load();
  }
  if (window.IstProfileCard) IstProfileCard.setPage('project');
  // The map and the game overlay both live at body level (they have to
  // cover both bars), so neither is swapped out with the content and
  // both wirings are idempotent.
  wireMap();
  wireGameOverlay();
}
function unmount() {
  stopAnim();
  // The map and the game overlay are both body-level and would otherwise
  // be the last word on a page that is gone -- along with the body class
  // that dims the bottom bar.
  closeMap();
  closeGameOverlay(true);
  traveling = false;
  if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
  // The petek leaves two things behind it that live OUTSIDE this page --
  // the depth classes on <html> and the module's own _hive, which every
  // in-flight fetch checks itself against before drawing. Both have to
  // be unwound or they are the last word on a page that is gone (see
  // unmountHivePage in profile-card.js).
  if (window.IstProfileCard && IstProfileCard.unmountHivePage) IstProfileCard.unmountHivePage();
  lane = LANE_KUTUPHANE; lanePos = LANE_KUTUPHANE;
  atLaneStop = false; petekBuilt = false;
  drag = null; box = null;
  // The lane variables live on <html> and would outlive this page.
  const root = document.documentElement;
  for (let i = 0; i < LANES; i++) root.style.removeProperty('--fb-nav-' + i);
  for (const k of ['--fb-dots-l', '--fb-dots-r',
                   '--fb-dot-out', '--fb-dot-mid', '--fb-dot-in']) {
    root.style.removeProperty(k);
  }
}

// ══════════════════════════════════════════════════════════════
// THE APP MAP -- opened by the logo, and the only thing on the
// bottom bar that is pressed
//
// The compass says where you are. This says where you are IN RELATION
// TO EVERYWHERE ELSE: the app's five windows drawn in the shape they
// actually stand in -- the three lanes across the middle, Türkiye
// hanging off Kütüphane and the ilçe off Kahvehane, because those are
// the depths those two lanes can reach.
//
// A window is a (lane, slide) pair and nothing else, so the map cannot
// drift from the app: there is no second table of places here, only the
// five the book and the lane strip already have between them.
// ══════════════════════════════════════════════════════════════
const MAP_WINDOWS = [
  { id: 'ilce',      cell: 'r1c3', lane: LANE_KAHVEHANE, slide: STOPS[2],
    name: 'İlçen',     map: 'assets/map/istanbul-map-mobile.png', stats: ['kahve', 'yorum'] },
  { id: 'kutuphane', cell: 'r2c1', lane: LANE_KUTUPHANE, slide: STOPS[1],
    name: 'Kütüphane', map: 'assets/map/istanbul-map-mobile.png', stats: ['haber', 'olay'] },
  { id: 'hane',      cell: 'r2c2', lane: LANE_HANE,      slide: STOPS[1],
    name: 'Hane',      hex: true },
  { id: 'kahvehane', cell: 'r2c3', lane: LANE_KAHVEHANE, slide: STOPS[1],
    name: 'Kahvehane', map: 'assets/map/istanbul-map-mobile.png', stats: ['etkinlik', 'oyun'] },
  { id: 'turkiye',   cell: 'r3c1', lane: LANE_KUTUPHANE, slide: STOPS[0],
    name: 'Türkiye',   map: 'assets/map/kutuphane-map-mobile.png', stats: ['hikaye', 'bilgi'] },
];

// What each square counts. A dash is a square whose content is parked
// (Fikirler, Bilgi) or not lifted out of the parts bin yet -- it still
// prints, because the shape of a screen should not change on the day its
// numbers arrive.
let mapStats = null;      // { key: 'a/b' } once loaded
let mapBadges = null;     // { windowId: n }
let mapStatsAt = 0;       // when, so a reopen a minute later is free
let traveling = false;
let mapHideTimer = null;  // the pending hide of a fading-out layer
let gameOverlayTimer = null; // the pending reveal/re-cover of the game curtains

// ── The middle window is the reader's OWN hexagon ──
// Not a drawing of one: the actual cell out of the petek, cloned. Hane's
// window is the reader's profile, and that already exists at the petek's
// middle depth -- building a second version of it here would be a second
// thing to keep in step with the avatar, the badges and the ring.
function mapMeCell() {
  const me = document.querySelector('#po-hive-mount .ist-hive-cell[data-me]');
  if (!me) return null;
  const clone = me.cloneNode(true);
  // Every id in there is a live handle somewhere else -- #po-avatar-preview
  // is what the four avatar carousels replace on an arrow press, and the
  // claim field is what a code is typed into. A second copy carrying them
  // would steal both.
  clone.removeAttribute('id');
  clone.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  clone.removeAttribute('data-me');
  clone.classList.remove('ist-hive-cell-open');
  clone.classList.add('fb-map-me');
  // A picture of the hexagon, not a second button: it must not answer a
  // press, and it must not be a second tab stop for the same cell.
  clone.disabled = true;
  clone.setAttribute('aria-hidden', 'true');
  clone.querySelectorAll('.ist-hive-claim-in').forEach(n => n.remove());
  return clone;
}

// Whether the petek is actually standing on screen behind the layer. If
// it is, the middle window is pinned over the reader's own cell and the
// rest of the petek fades out under the wash -- so opening the map reads
// as everybody else leaving and the reader staying exactly where they
// were, rather than as a new drawing arriving over the old one.
function petekOnScreen() {
  const me = document.querySelector('#po-hive-mount .ist-hive-cell[data-me]');
  if (!me || !box || !box.classList.contains('petek-open')) return null;
  const r = me.getBoundingClientRect();
  return (r.width > 8 && r.height > 8) ? r : null;
}

function mapWinHTML(w) {
  const badge = mapBadges && mapBadges[w.id] != null
    ? '<span class="fb-map-badge">' + mapBadges[w.id] + '</span>' : '';
  if (w.hex) {
    // Hane is the petek, so its window is a hexagon rather than a screen
    // of tiles -- the middle page is the one that is not a page. The
    // reader's own cell is dropped in afterwards, in buildMap; this is
    // only the fallback for a petek that has never been mounted (the
    // reader has not reached slide 12 yet).
    return '<span class="fb-map-hex"><span><i class="fb-map-figure"></i></span></span>' + badge;
  }
  const stats = (w.stats || []).map(k =>
    '<span class="fb-map-stat">' + ((mapStats && mapStats[k]) || '–') + '</span>').join('');
  return '<span class="fb-map-hero">' +
           (w.map ? '<img src="' + w.map + '" alt="" draggable="false">' : '') +
         '</span>' +
         '<span class="fb-map-name">' + w.name + '</span>' +
         (stats ? '<span class="fb-map-stats">' + stats + '</span>' : '') +
         badge;
}

// Which window the reader is standing in. The book can rest between
// stops only while a finger is down, and the map is not openable then,
// so the nearest stop is the honest answer.
function mapHere() {
  let best = null, bestD = Infinity;
  for (const w of MAP_WINDOWS) {
    // A lane away is further than any distance within a lane: you cannot
    // be half in Hane and half in Kütüphane and be counted as either.
    const d = Math.abs(w.lane - lane) * 1000 + Math.abs(w.slide - at);
    if (d < bestD) { bestD = d; best = w; }
  }
  return best;
}

function buildMap() {
  const grid = document.getElementById('fb-map-grid');
  if (!grid) return;
  grid.querySelectorAll('.fb-map-win').forEach(n => n.remove());
  const here = mapHere();
  for (const w of MAP_WINDOWS) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'fb-map-win at-' + w.cell + (w.hex ? ' hex' : '') +
                   (w === here ? ' here' : '');
    el.innerHTML = mapWinHTML(w);
    if (w.hex) {
      const me = mapMeCell();
      if (me) {
        el.innerHTML = '';
        const slot = document.createElement('span');
        slot.className = 'fb-map-hex-slot';
        slot.appendChild(me);
        el.appendChild(slot);
        el.innerHTML += mapBadges && mapBadges[w.id] != null
          ? '<span class="fb-map-badge">' + mapBadges[w.id] + '</span>' : '';
        // Standing on Hane, the cell is pinned exactly over the real one,
        // so the only thing that changes on screen is that everybody else
        // goes. The pin is a measurement rather than a guess: the petek is
        // fitted to its window and nothing here can predict where that put
        // the reader.
        const r = petekOnScreen();
        if (r) {
          el.classList.add('pinned');
          el.style.left = r.left + 'px';
          el.style.top = r.top + 'px';
          el.style.width = r.width + 'px';
          el.style.height = r.height + 'px';
        }
      }
    }
    if (w === here) {
      el.setAttribute('aria-current', 'true');
      el.disabled = true;
    } else {
      el.addEventListener('click', () => travelTo(w));
    }
    grid.appendChild(el);
  }
}

function openMap() {
  const layer = document.getElementById('fb-map');
  if (!layer || traveling) return;
  // Whatever the last close still had pending is cancelled here. A close
  // cannot hide the layer at once -- it has to stay on screen while it
  // fades -- so it schedules the hide; left running, that timer lands on
  // THIS opening and hides a layer that was just unhidden, with the body
  // class still on it and the petek still faded out under a wash that is
  // no longer there. It is the same trap IstSheet.open documents.
  if (mapHideTimer) { clearTimeout(mapHideTimer); mapHideTimer = null; }
  buildMap();
  layer.hidden = false;
  document.body.classList.add('fb-map-on');
  requestAnimationFrame(() => layer.classList.add('on'));
  loadMapStats();
}

function closeMap() {
  const layer = document.getElementById('fb-map');
  if (!layer || layer.hidden) return;
  layer.classList.remove('on');
  document.body.classList.remove('fb-map-on');
  if (mapHideTimer) clearTimeout(mapHideTimer);
  // Matches the CSS fade; cancelled by the next open (see there).
  mapHideTimer = setTimeout(() => { mapHideTimer = null; layer.hidden = true; }, 240);
}

function mapIsOpen() {
  const layer = document.getElementById('fb-map');
  return !!(layer && !layer.hidden);
}

// ── THE GAME OVERLAY ──
// See the CSS block for why: a real page, an iframe rather than a swap,
// so nothing about sozcel.html changes.
function openGameOverlay(href) {
  const layer = document.getElementById('fb-game-overlay');
  const frame = document.getElementById('fb-game-frame');
  if (!layer || !frame) return;
  if (gameOverlayTimer) { clearTimeout(gameOverlayTimer); gameOverlayTimer = null; }
  // Back to the curtains' resting, off-screen state before the next
  // frame flips them in -- the same trap IstSheet.open documents: a
  // previous close's pending reveal must not land on this opening.
  layer.classList.remove('in', 'gone');
  layer.hidden = false;
  // The bottom curtain rests just above the actor row it was pressed
  // from, not against the top curtain -- see the CSS block. Measured
  // live off whichever row/square is actually on screen, so a taller
  // Etkinlikler card or a different device is never guessed at; a
  // press that finds no live actor (there always should be one) leaves
  // the property unset and the CSS fallback takes over.
  const overlayTop = layer.getBoundingClientRect().top;
  let rowTop = null;
  document.querySelectorAll('.fb-actor.live').forEach((el) => {
    const r = el.getBoundingClientRect();
    if (rowTop === null || r.top < rowTop) rowTop = r.top;
  });
  if (rowTop !== null) {
    const margin = 16; // breathing room above the row
    layer.style.setProperty('--fb-curtain-bottom-top',
      Math.max(0, rowTop - overlayTop - margin) + 'px');
  } else {
    layer.style.removeProperty('--fb-curtain-bottom-top');
  }
  // The curtains land apart and stay apart; the reveal behind them
  // waits on BOTH the slide finishing and the iframe's own load, so a
  // slow load never uncovers a blank page and a fast one never looks
  // rushed.
  let slid = false, loaded = false;
  const reveal = () => { if (slid && loaded) layer.classList.add('gone'); };
  frame.onload = () => { loaded = true; reveal(); };
  frame.src = href;
  requestAnimationFrame(() => {
    layer.classList.add('in');
    gameOverlayTimer = setTimeout(() => {
      gameOverlayTimer = null;
      slid = true; reveal();
    }, 550);
  });
}
function closeGameOverlay(immediate) {
  const layer = document.getElementById('fb-game-overlay');
  const frame = document.getElementById('fb-game-frame');
  if (!layer || layer.hidden) return;
  if (gameOverlayTimer) { clearTimeout(gameOverlayTimer); gameOverlayTimer = null; }
  const finish = () => {
    layer.hidden = true;
    layer.classList.remove('in', 'gone');
    // Unloads the game rather than leaving it running behind the layer, so
    // the next open is a fresh start rather than wherever it was left.
    if (frame) { frame.onload = null; frame.src = 'about:blank'; }
    // A game just played may have moved the Oyunlar square -- let the next
    // map open re-fetch it rather than show a stale count.
    mapStatsAt = 0;
  };
  // A teardown (leaving project.html itself, unmount()) has nothing left
  // to animate in front of, so it skips straight to `finish`. Every other
  // close -- the back arrow -- leaves the way it arrived, reversed: the
  // curtains close back over the game first, the same "never a snap" rule
  // THE sheet's own close follows (sheet.js drops .open and only hides
  // after the slide finishes) -- and only once they've met does the layer
  // actually come down. Before this it was a bare `hidden = true`: the
  // game vanished and the book was back in the same frame, the one
  // surface on the site that closed with no motion at all.
  if (immediate) { finish(); return; }
  layer.classList.remove('gone');
  gameOverlayTimer = setTimeout(() => {
    gameOverlayTimer = null;
    finish();
  }, 300); // .fb-game-curtain's own opacity transition
}
function wireGameOverlay() {
  if (document.body.dataset.fbGameWired) return;
  document.body.dataset.fbGameWired = '1';
  // sozcel.html's own back arrow posts this instead of navigating its
  // iframe when it detects it is embedded (window.self !== window.top).
  window.addEventListener('message', (e) => {
    const frame = document.getElementById('fb-game-frame');
    if (frame && e.source === frame.contentWindow && e.data === 'ist-close-game-overlay') {
      closeGameOverlay();
    }
  });
}

// ── Going there is a WALK, not a jump ──
// The map closes and then the app moves, one transition at a time,
// through every screen between here and there: down to the lane stop
// first (the lanes can only be walked from slide 12), then one lane at a
// time, then out to the target's own depth. So Türkiye to the ilçe is
// four moves and passes through Hane -- you cannot get from the reading
// to the doing without walking past the people. That is the whole point
// of the map being a map and not a menu.
function travelTo(w) {
  if (traveling || !ready) return;
  traveling = true;
  closeMap();
  // `at` is a float, so every comparison against a stop is a tolerance --
  // a strict !== here would leave the walk one imperceptible step short
  // and never clear `traveling`, which locks the map for the session.
  const off = (a, b) => Math.abs(a - b) > 0.001;
  const step = () => {
    // The lanes can only be walked from the middle depth, so a window on
    // another lane is reached by coming back to slide 12 first.
    if (off(at, STOPS[1]) && lane !== w.lane) { runTo(STOPS[1], step); return; }
    if (lane !== w.lane) { runLane(lane + (w.lane > lane ? 1 : -1), step); return; }
    if (off(at, w.slide)) { runTo(w.slide, step); return; }
    traveling = false;
  };
  // Let the layer get out of the way before the app starts moving --
  // the walk is the thing to watch, and it is happening underneath it.
  setTimeout(step, 260);
}

// ── The numbers in the squares ──
// How much of each window's content the reader has actually got through.
// Every one is best-effort and independent: a query that fails leaves
// its own square as a dash rather than taking the map down with it.
async function loadMapStats() {
  if (mapStats && Date.now() - mapStatsAt < 60000) return;
  const sb = window.IstRouter && IstRouter.sb;
  if (!sb) return;
  const stats = {}, badges = {};
  let uid = null;
  try { uid = (await sb.auth.getUser()).data.user.id; } catch (e) {}

  const store = (key) => {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  };

  // Haberler: the deck's own two numbers -- what is in the 72h window,
  // and how much of it this member has already dealt with. Read from the
  // same localStorage key the deck writes (see kutuphane.html), so the
  // square cannot disagree with the deck it is counting.
  const haber = (async () => {
    const cutoff = new Date(Date.now() - 72 * 3600 * 1000).toISOString();
    const { data, error } = await sb.from('breaking_news')
      .select('id, updated_at').gte('updated_at', cutoff).is('archived_at', null);
    if (error) throw error;
    const rows = data || [];
    // The store keeps each story's updated_at AS THROWN, so a gelişme
    // puts it back in the deck -- and back into this count. Its first
    // version was a plain array of ids with no stamp at all; that reads
    // as "dealt with as it stands", the same reading kutuphane.html's own
    // reconcileDealt gives it.
    const raw = uid ? store('dunya_dealt_' + uid) : null;
    const stampless = Array.isArray(raw) ? new Set(raw.map(String)) : null;
    const dealt = (!stampless && raw && typeof raw === 'object') ? raw : {};
    const done = rows.filter(r => stampless
      ? stampless.has(String(r.id))
      : dealt[r.id] === r.updated_at).length;
    stats.haber = done + '/' + rows.length;
    badges.kutuphane = rows.length - done;
  })();

  // Olaylar: how many of the ongoing ones the reader has opened at all.
  const olay = (async () => {
    const { data, error } = await sb.from('world_events')
      .select('id').eq('status', 'ongoing');
    if (error) throw error;
    const rows = data || [];
    const started = uid
      ? rows.filter(r => store('olay_progress_' + uid + '_' + r.id) != null).length : 0;
    stats.olay = started + '/' + rows.length;
  })();

  // Etkinlikler: what is still to come. A count rather than a fraction --
  // an evening is not content to get through, it is somewhere to be.
  const etkinlik = (async () => {
    const { data, error } = await sb.from('events')
      .select('id').gte('event_date', new Date().toISOString());
    if (error) throw error;
    const n = (data || []).length;
    stats.etkinlik = n ? '+' + n : '0';
    badges.kahvehane = (badges.kahvehane || 0) + n;
  })();

  // Oyunlar: today's sequence. A game the admin switched off is on
  // neither side of the fraction -- it is not a step anybody has left to
  // take (see game_day_toggles in CLAUDE.md).
  const oyun = (async () => {
    // Two different date keys, deliberately: game_day_toggles is keyed by
    // the Istanbul ISO date and game_results by IstDate.daySeed(). Both go
    // through ist-date.js, never a parsed locale string (CLAUDE.md rule 10).
    const all = ['sozcel', 'tumcel', 'bulmaca'];
    const off = await sb.from('game_day_toggles').select('game')
      .eq('game_date', IstDate.iso());
    const disabled = new Set(((off.data) || []).map(r => r.game));
    const on = all.filter(g => !disabled.has(g));
    let played = 0;
    if (uid && on.length) {
      const res = await sb.from('game_results')
        .select('game, attempts').eq('user_id', uid).eq('date', IstDate.daySeed());
      // PLAYED means finished. Every game writes an attempts:0 row on the
      // reader's first interaction, so counting rows would call a game
      // still being played done -- the same rule Kahvehane's deck uses.
      const done = new Set(((res.data) || [])
        .filter(r => (r.attempts || 0) >= 1).map(r => r.game));
      played = on.filter(g => done.has(g)).length;
    }
    stats.oyun = played + '/' + on.length;
    badges.kahvehane = (badges.kahvehane || 0) + (on.length - played);
  })();

  await Promise.allSettled([haber, olay, etkinlik, oyun]);
  mapStats = stats;
  mapBadges = badges;
  mapStatsAt = Date.now();
  // Only redraw if the map is still up: the reader may have gone.
  if (mapIsOpen()) buildMap();
}

function wireMap() {
  const btn = document.getElementById('fb-logo-btn');
  const scrim = document.getElementById('fb-map-scrim');
  if (btn && !btn.dataset.wired) {
    btn.dataset.wired = '1';
    // The logo is a switch, not a door: it opens the map and it closes
    // it again, which is why it stays lit while the map is up.
    btn.addEventListener('click', () => { mapIsOpen() ? closeMap() : openMap(); });
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
    });
  }
  if (scrim && !scrim.dataset.wired) {
    scrim.dataset.wired = '1';
    scrim.addEventListener('click', closeMap);
  }
  if (!document.body.dataset.fbMapEsc) {
    document.body.dataset.fbMapEsc = '1';
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && mapIsOpen()) closeMap();
    });
  }
}

IstRouter.registerPage('project', { mount, unmount });

if (!window.__istVirtualNavInjecting) {
  mount();
  window.addEventListener('DOMContentLoaded', () => {
    if (window.IstProfileCard) IstProfileCard.mount({ sb: IstRouter.sb, I18N: window.I18N, page: 'project' });
  });
}

// ── One deliberate handle, for driving the book from outside ──
// Everything above is inside this wrapper because the four carousel
// pages share ONE document (see router.js): two of them declaring the
// same top-level `const` is a SyntaxError that takes the second page's
// whole script with it. This page had 26 top-level names and one of
// them, NB_NAMES, already collided with mahalle's.
window.__fb = {
  get at() { return at; },
  get framePos() { return framePos; },
  get cast() { return cast; },
  get ready() { return ready; },
  get busy() { return !!(anim || castTick || drag); },
  frames: FRAMES,
  // Put the book at a slide as if it had been dragged there and let go.
  // `show` alone only paints -- it does not move the book -- which is
  // exactly the distinction the drag handler depends on.
  goto(p, snap) {
    stopAnim();
    at = Math.max(0, Math.min(FRAMES - 1, p));
    // A slide off the middle stop can only be reached from one lane, so
    // arriving there by hand has to leave the reader on it -- otherwise
    // the handle can put the book somewhere its own lane forbids.
    if (at < STOPS[1]) { lane = LANE_KUTUPHANE; setLanePos(lane); }
    else if (at > STOPS[1]) { lane = LANE_KAHVEHANE; setLanePos(lane); }
    show(at, snap !== false); armCast();
  },
  show, armCast,
  lanes: LANES,
  get lane() { return { at: lane, pos: lanePos, atStop: atLaneStop,
                        petek: lanePresence(LANE_HANE), stops: laneStops() }; },
  // Put the reader on a lane as if they had pulled there and let go.
  goLane(n, snap) {
    if (laneRun) { cancelAnimationFrame(laneRun); laneRun = null; }
    if (snap === false) { runLane(n); return; }
    lane = Math.max(0, Math.min(LANES - 1, n)); setLanePos(lane); armCast();
  },
  pullLane(p) { setLanePos(p); },
};
})();
</script>
