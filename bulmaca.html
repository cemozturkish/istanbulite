<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <meta charset="UTF-8">
  <!-- A game is not a page: it is only ever opened inside project.html's own
       overlay, so a top-level hit on this URL never renders and is replaced
       by the app (see sozcel.html's "A GAME IS NOT A PAGE, AND THIS URL IS
       NOT A DOOR" for the whole of why, and for why it is `replace` and why
       it stands first in the head). Embedded it is a no-op. -->
  <script>
    if (window.self === window.top) location.replace('project.html');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e2e2e">
  <title>Çengel — istanbulite.net</title>
  <script src="sheet.js?v=6"></script>
  <link rel="stylesheet" href="sheet.css?v=9">
  <style>
    :root {
      /* Core ink & paper — warm cream newspaper palette */
      --paper-card: #ddc4b5;
      /* Warm neutrals */
      /* Newspaper accents */
      /* Semantic aliases */
      --success: var(--accent-2);
      /* Border shortcuts */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      touch-action: pan-y;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      display: grid;
      grid-template-columns: 1fr 2.2fr 1fr;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .section-rule {
      grid-column: 1 / -1;
      grid-row: 1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 28px;
      padding: 14px 28px 10px 28px;
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
    }
    .section-rule > .masthead { justify-self: start; }
    .section-rule > header { justify-self: center; }
    .section-rule > .datetime-block { justify-self: end; }
    .masthead {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-weight: 400;
      font-size: 1.45rem;
      letter-spacing: 0.5px;
      color: var(--ink);
      line-height: 1;
    }
    .masthead .tld { color: var(--muted); font-style: italic; }
    .datetime-block {
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
    }
    .datetime-block .sep { color: var(--muted); opacity: 0.6; }

    header {
      display: flex;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 32px;
    }
    nav a {
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: color 0.2s;
      padding: 2px 0;
    }
    nav a:hover { color: var(--ink); }
    nav a.active { color: var(--ink); font-weight: 700; }

    /* ── Left column ── */
    .col-left {
      grid-column: 1;
      grid-row: 2 / -1;
      border-right: var(--col-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .col-left .nb-highlight {
      padding: 8px 12px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--paper-banner);
      color: var(--ink);
      text-align: center;
      flex-shrink: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      border-bottom: 1px solid var(--rule);
    }

    /* ── Right column ── */
    .col-right {
      grid-column: 3;
      grid-row: 2 / -1;
      border-left: var(--col-border);
      display: flex;
      flex-direction: column;
      overflow-y: hidden;
    }

    main {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      position: relative;
    }

    /* Left: personal + community stats (compact) */
    .stats-left {
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      overflow-y: auto;
      gap: 8px;
    }

    .panel-title {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      padding-bottom: 3px;
      border-bottom: 1px solid var(--rule);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
    }

    .stat-tiles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .stat-tile {
      text-align: center;
      padding: 4px 2px;
      background: var(--paper-card);
      border: 1px solid var(--hairline);
    }
    .stat-tile .num {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1;
    }
    .stat-tile .label {
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      padding: 1px 0;
    }
    .stat-row .stat-label { color: var(--muted); }
    .stat-row .stat-val { font-weight: 700; }

    .stats-left .dist-bar-wrap {
      font-size: 0.6rem;
      margin-bottom: 2px;
      gap: 4px;
    }
    .stats-left .dist-bar-outer { height: 10px; }
    .stats-left .dist-pct { font-size: 0.55rem; min-width: 24px; }
    .stats-left .district-rank { font-size: 0.65rem; padding: 1px 0; }

    /* Center: game */
    .game-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 16px;
      overflow: hidden;
      min-height: 0;
      gap: 8px;
      flex: 1;
    }

    /* Nothing on this page scrolls: the grid is sized by layoutBoard() to
       whatever the keyboard, the definition bar and the buttons leave, so
       the whole game is one screen. */
    .play-area {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* The highlighted word's definition, with a step either way through
       the clue list. */
    .clue-bar {
      display: flex;
      align-items: stretch;
      width: 100%;
      max-width: 460px;
      flex-shrink: 0;
      background: var(--paper-card);
      border: 2px solid var(--ink);
      border-left: 5px solid var(--ink-red);
      /* A fixed height, so a one-line definition and a two-line one leave
         the grid above exactly where it was. */
      height: 72px;
      box-sizing: border-box;
    }
    .clue-bar[hidden] { display: none; }
    .clue-bar-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3px 6px;
      cursor: pointer;
    }
    .clue-bar-k {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--ink-red);
    }
    .clue-bar-t {
      font-size: 0.95rem;
      line-height: 1.3;
      /* Two lines at most: the bar is a fixed height so the grid above it
         never moves when the definition changes. */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .clue-nav {
      flex: 0 0 36px;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* ── The keyboard: Sözcel's, key for key ──
       The grid cells are not inputs, so a phone never raises its own
       keyboard for them; this is the one it gets instead. Same Turkish Q
       layout, same hexagon keys (the .key mask and ring come from
       frames.css), sized by layoutKeyboard() the way sozcel.html's
       layoutGame() sizes its own. */
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: var(--kb-row-gap, 5px);
      max-width: 100%;
      flex-shrink: 0;
      --kb-key-wide: calc(var(--kb-key, 30px) * 1.5 + var(--kb-gap, 3px) * 0.5);
    }
    .keyboard:empty { display: none; }
    .keyboard-row {
      display: flex;
      gap: var(--kb-gap, 3px);
      justify-content: center;
    }
    .key {
      flex: 0 0 var(--kb-key, 30px);
      width: var(--kb-key, 30px);
      padding: 0;
      background: var(--rule);
      /* A <button> with no color of its own takes the platform's default
         tint (iOS Safari's blue); say the ink outright. */
      color: var(--ink);
      border: none;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: var(--kb-font, 15px);
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .key.wide {
      flex-basis: var(--kb-key-wide);
      width: var(--kb-key-wide);
      font-size: var(--kb-font-wide, 11px);
    }
    /* Q/W/X keep their place on the Turkish layout but never type. */
    .key:disabled, .key.key-disabled {
      opacity: 0.2;
      cursor: default;
    }

    .crossword-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      /* layoutBoard() sets the real width; this is only the first paint. */
      width: min(100%, 220px);
      flex-shrink: 0;
    }

    .crossword-cell {
      aspect-ratio: 1;
      border: 1.5px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: var(--cell-font, clamp(0.8rem, 2.5vh, 1.2rem));
      font-weight: 700;
      text-transform: uppercase;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .crossword-cell.black {
      background: var(--ink);
      border-color: var(--ink);
      cursor: default;
    }

    /* The word the reader is in, and the square the next letter lands in. */
    .crossword-cell.in-word {
      background: var(--paper-dark);
    }
    .crossword-cell.active {
      background: var(--brown-1);
    }

    .crossword-cell.correct {
      background: var(--paper-card);
    }

    .cell-number {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 0.5rem;
      color: var(--accent);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      padding: 8px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-primary {
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
    }
    .btn-primary:hover { background: var(--accent); }

    .game-message {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      min-height: 18px;
      flex-shrink: 0;
    }

    .reset-info {
      text-align: center;
      font-size: 0.65rem;
      color: var(--muted);
      font-style: italic;
      flex-shrink: 0;
      /* Reserved even while empty, so the countdown appearing after a win
         does not take room the grid was already sized into. */
      min-height: 1.3em;
    }

    .clues-wrap {
      width: 100%;
      max-width: 360px;
      flex-shrink: 0;
    }

    .clues-wrap h3 {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      padding: 4px 8px;
      background: var(--paper-banner);
      border-bottom: 1px solid var(--rule);
      letter-spacing: 1px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      text-transform: uppercase;
    }

    .clue-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 10px;
      background: var(--paper-card);
      padding: 6px 8px;
      border: 1px solid var(--hairline);
    }

    .clue {
      display: flex;
      gap: 4px;
      font-size: 0.78rem;
      line-height: 1.3;
      padding: 2px 4px;
      border-left: 3px solid transparent;
    }

    .clue.active {
      background: var(--hover);
      border-left-color: var(--ink-red);
    }

    .clue-number {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-weight: 700;
      color: var(--ink-red);
      min-width: 16px;
    }

    .dist-bar-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      margin-bottom: 4px;
    }
    .dist-bar-wrap .dist-label {
      min-width: 12px;
      text-align: right;
      font-weight: 700;
      color: var(--muted);
    }
    .dist-bar-outer {
      flex: 1;
      height: 14px;
      background: var(--paper-dark);
      border: 1px solid var(--hairline);
    }
    .dist-bar-inner {
      height: 100%;
      background: var(--accent);
      transition: width 0.5s ease;
    }
    .dist-bar-wrap .dist-pct {
      min-width: 30px;
      font-size: 0.65rem;
      color: var(--muted);
    }

    .district-rank {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      padding: 2px 0;
      border-bottom: 1px solid var(--whisper);
    }
    .district-rank:last-child { border-bottom: none; }
    .district-rank .rank-name { font-weight: 600; }
    .district-rank .rank-pct { color: var(--muted); font-weight: 700; }

    /* ── Right: games nav (mirrors Kahvehane) ── */
    .games-section {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }
    /* The three tiles share one row (they're square, see .game-link
       below) with the heading on its own line above it -- same games nav
       as Kahvehane's, keep the two in sync. align-content keeps that
       pair of lines packed at the top instead of stretching apart over
       the column's full height. */
    .games-section-inner {
      padding: 16px;
      display: flex;
      flex-flow: row wrap;
      align-content: flex-start;
      /* No stretch: the tiles' height comes from their aspect-ratio and
         nothing else. Letting the row stretch them too leaves two rules
         claiming the same axis, which is precisely what WebKit resolved
         the other way on Kahvehane's mobile tiles. */
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow-y: hidden;
    }
    .games-section-inner > h2 {
      flex: 0 0 100%;
    }
    .games-section h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
      text-align: center;
      letter-spacing: 2px;
      flex-shrink: 0;
      background: var(--paper-banner);
      padding: 6px 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      text-transform: uppercase;
    }
    /* Chapter-box style, matching the Kütüphane reading-path nodes
       (.path-node): thick border with a heavier bottom edge. */
    .game-link {
      /* Square, and centred on its own content -- a third of the row
         each (see .games-section-inner above). */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 0;
      min-width: 0;
      aspect-ratio: 1 / 1;
      background: var(--paper-card);
      border: 2px solid var(--ink);
      border-bottom: 5px solid var(--ink);
      padding: 0;
      text-align: center;
      text-decoration: none;
      color: var(--ink);
      transition: background 0.2s, border-color 0.2s, transform 0.15s ease, filter 0.1s ease;
      position: relative;
    }
    .game-link:hover {
      background: var(--hover);
      transform: translateX(-4px);
    }
    /* Pressed feedback: darken whatever the current state's colors are
       (plain, started, completed, active) plus a small press-down nudge. */
    .game-link:active {
      filter: brightness(0.85);
      transform: translateX(-2px) translateY(2px);
    }
    .game-link.active { background: var(--brown-4); color: var(--paper); border-color: var(--paper); }
    /* Smaller than the old 1rem: three squares in a row are each about a
       third of the column wide, and "Bulmaca" has to stay on one line
       inside that. The column is a fixed fraction of the viewport (1fr
       of 1fr/2.2fr/1fr), so the squares shrink with the window and the
       label tracks them, capped at 0.78rem and floored at 8px so it
       still fits at the 769px breakpoint. The subtitle is kept in the
       markup (JS elsewhere colors it per state) but has no room on a
       square tile, same as Kahvehane's. */
    .game-link-title { font-size: clamp(8px, 0.95vw, 0.78rem); font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif; }
    .game-link-subtitle { display: none; }
    /* Sözcel's wordmark, filling its square tile in place of the text
       title -- the artwork spells the name out, and alt= carries it for
       screen readers. The padding is a percentage so the margin around
       it stays proportional whatever width the column gives the tile. */
    .game-link-logo {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 6%;
      object-fit: contain;
    }
    .game-link[data-game="sozcel"] .game-link-title { display: none; }
    .game-link.active .game-link-subtitle { color: var(--whisper); }
    .scoreboard {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--rule);
      flex-shrink: 0;
    }
    .scoreboard h2 {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--paper-banner);
      padding: 6px 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
    }
    .scoreboard-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .scoreboard-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--paper-card);
      border: 1px solid var(--hairline);
      font-size: 0.75rem;
    }
    /* 4-stop brown gradient on the row BACKGROUND. Dark-bg rows flip text to paper. */
    .scoreboard-item { background: var(--brown-1); color: var(--ink); border-color: var(--brown-2); }
    .scoreboard-item.r1 { background: var(--brown-4); color: var(--paper); border-color: var(--ink); }
    .scoreboard-item.r2 { background: var(--brown-3); color: var(--paper); }
    .scoreboard-item.r3 { background: var(--brown-2); color: var(--paper); }
    .scoreboard-rank { font-weight: 700; color: inherit; min-width: 18px; font-size: 0.8rem; }
    .scoreboard-player {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .scoreboard-name { color: inherit; }
    .scoreboard-score {
      font-weight: 700;
      color: inherit;
      font-size: 0.85rem;
      min-width: 22px;
      text-align: right;
    }
    /* Scoreboard rows are clickable end-to-end (not just the name) and
       nudge left on hover, same feel as the game-link cards above. */
    .scoreboard-item.author-link { cursor: pointer; transition: transform 0.15s ease; }
    .scoreboard-item.author-link:hover { transform: translateX(-4px); text-decoration: none; }
    .scoreboard-empty {
      font-size: 0.7rem;
      color: var(--muted);
      font-style: italic;
      text-align: center;
      padding: 10px 4px;
      list-style: none;
    }

    /* ── MOBILE RESPONSIVE ── */
    /* Back button hidden on desktop (overridden in mobile @media below) */
    /* Desktop back button: floating top-left inside main. The hand-drawn
       arrow (assets/back.png) stands on its own — no circle, border or
       fill behind it, so it reads as ink on the page the way the drawing
       itself does. The box stays 30px for the hit area; the PNG's own
       transparent padding (~27% a side) is part of that target. */
    .game-back-btn {
      position: absolute;
      top: 10px;
      left: 14px;
      z-index: 50;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 1;
      transition: opacity 0.15s;
    }
    /* Square box keeps the arrow centered — the ink is centered on both
       axes inside the square canvas. */
    .game-back-btn .back-icon {
      width: 26px;
      height: 26px;
      display: block;
    }
    .game-back-btn:hover { opacity: 0.6; }

    /* Side nav: started today (light tint) vs completed today (darker tint) */
    .game-link.started {
      background: var(--paper-dark);
      color: var(--accent);
    }
    .game-link.started .game-link-subtitle { color: var(--muted); }
    .game-link.completed {
      background: var(--brown-2);
      color: var(--paper);
      border-color: var(--brown-4);
    }
    .game-link.completed .game-link-subtitle { color: var(--whisper); }

    /* ── Embedded mode: opened inside kahvehane.html's game-overlay bottom

// Daily seed for puzzle rotation
// Was a one-line wrapper in three pages; it still is, but over one seed.
// The seed is the NIGHT rather than the calendar date, because a night
// spans midnight and the games are night-only: keyed on the date, the

const dailySeed = getDailySeed();

// Çengel's puzzles used to be a hardcoded pool, picked by a seeded random
// over the night's own key. There is no pool any more: the admin draws
// the grid cell by cell in admin.html's Oyunlar → Çengel panel

      .from('bulmaca_puzzles')

let ROWS = 5;
let COLS = 5;
let PUZZLE = null;  // rows×cols array of letter (uppercase Turkish) or null (blocked)
let CLUES = null;   // { across: [{num,row,col,len,clue}], down: [...] }

let activeCell = null;
let gameCompleted = false;
let checkAttempts = 0;
let userAnswers = [];
const SAVE_KEY = 'bulmaca_state_' + dailySeed;

function initFromPuzzle(puzzle) {
  ROWS = puzzle.rows;
  COLS = puzzle.cols;
  PUZZLE = puzzle.grid;
  CLUES = puzzle.clues;
  userAnswers = Array(ROWS).fill(null).map(() => Array(COLS).fill(''));
}

function createGrid() {
  const grid = document.getElementById('crossword-grid');
  grid.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;

  // The number a cell carries is the admin's own grid saying it, not
  // recomputed here — bulmaca_puzzles stores each entry's row/col/num
  // exactly as the editor derived them, so the two can never disagree.
  const numAt = {};
  (CLUES.across || []).forEach(e => { numAt[e.row + ':' + e.col] = e.num; });
  (CLUES.down || []).forEach(e => { numAt[e.row + ':' + e.col] = e.num; });

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = document.createElement('div');

      if (PUZZLE[row][col] === null) {
        cell.className = 'crossword-cell black';
      } else {
        cell.className = 'crossword-cell';
        cell.dataset.row = row;
        cell.dataset.col = col;

        const n = numAt[row + ':' + col];
        if (n) {
          const num = document.createElement('span');
          num.className = 'cell-number';
          num.textContent = n;
          cell.appendChild(num);
        }

        cell.onclick = () => selectCell(row, col, { tap: true });
      }

      grid.appendChild(cell);
    }
  }
}

// ── The word the reader is in ──
// A square belongs to at most one across and one down entry. Pressing a
// square highlights its word; pressing the same square again switches to
// its other word, when it has one. Typing runs along that word.
let activeDir = 'across';

function wordsAt(row, col) {
  return {
    across: (CLUES.across || []).find(e => e.row === row && col >= e.col && col < e.col + e.len) || null,
    down: (CLUES.down || []).find(e => e.col === col && row >= e.row && row < e.row + e.len) || null,
  };
}

function wordCells(e, dir) {
  return Array.from({ length: e.len }, (_, i) =>
    dir === 'across' ? { row: e.row, col: e.col + i } : { row: e.row + i, col: e.col });
}

function activeWord() {
  if (!activeCell) return null;
  const e = wordsAt(activeCell.row, activeCell.col)[activeDir];
  return e ? { e, dir: activeDir } : null;
}

// opts.tap: a press on the grid (a second press on the same square flips
// the word); opts.dir: the word to land in, when the caller knows it.
function selectCell(row, col, opts = {}) {
  const w = wordsAt(row, col);
  const same = activeCell && activeCell.row === row && activeCell.col === col;
  if (opts.dir) activeDir = opts.dir;
  else if (same && opts.tap) {
    const other = activeDir === 'across' ? 'down' : 'across';
    if (w[other]) activeDir = other;
  }
  if (!w[activeDir]) activeDir = w.across ? 'across' : (w.down ? 'down' : activeDir);
  activeCell = { row, col };
  paintSelection();
}

function paintSelection() {
  const cells = document.querySelectorAll('.crossword-cell');
  cells.forEach(c => c.classList.remove('active', 'in-word'));
  if (!activeCell) { renderClueBar(); return; }
  const aw = activeWord();
  if (aw) wordCells(aw.e, aw.dir).forEach(p => cells[p.row * COLS + p.col].classList.add('in-word'));
  cells[activeCell.row * COLS + activeCell.col].classList.add('active');
  renderClueBar();
}

// Every entry in reading order: across first, then down, each by number.
function allEntries() {
  const by = (a, b) => a.num - b.num;
  return [
    ...(CLUES.across || []).slice().sort(by).map(e => ({ e, dir: 'across' })),
    ...(CLUES.down || []).slice().sort(by).map(e => ({ e, dir: 'down' })),
  ];
}

// Step to the neighbouring entry and land on its first empty square
// (or its first square, if the word is already full).
function stepWord(delta) {
  const list = allEntries();
  if (!list.length) return;
  const aw = activeWord();
  let i = aw ? list.findIndex(x => x.e === aw.e && x.dir === aw.dir) : -1;
  i = (i + delta + list.length) % list.length;
  const { e, dir } = list[i];
  const cells = wordCells(e, dir);
  const target = cells.find(p => !userAnswers[p.row][p.col]) || cells[0];
  selectCell(target.row, target.col, { dir });
}

function renderClueBar() {
  const bar = document.getElementById('clue-bar');
  if (!bar) return;
  const aw = activeWord();
  bar.hidden = false;
  const k = document.getElementById('clue-bar-k');
  const t = document.getElementById('clue-bar-t');
  if (!aw) {
    k.textContent = '';
    t.textContent = 'Bir kutuya dokun.';
    return;
  }
  k.textContent = aw.e.num + ' ' + (aw.dir === 'across' ? 'Yatay' : 'Dikey');
  t.textContent = aw.e.clue || '';
}

function updateCell(letter) {
  if (!activeCell) return;
  const { row, col } = activeCell;
  userAnswers[row][col] = letter;

  const cells = document.querySelectorAll('.crossword-cell');
  const cell = cells[row * COLS + col];
  const textNode = Array.from(cell.childNodes).find(n => n.nodeType === 3);
  if (textNode) {
    textNode.textContent = letter;
  } else {
    cell.appendChild(document.createTextNode(letter));
  }
}

// ── Keyboard ──
// Sözcel's own layout (see KEYBOARD_LAYOUT in sozcel.html): the Turkish Q
// keyboard, Q/W/X in place but disabled, GİR and ← as the two wide keys.
// GİR is "Kontrol Et" here -- a crossword has nothing else to submit.
const KEYBOARD_LAYOUT = [
  ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P', 'Ğ', 'Ü'],
  ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'Ş', 'İ'],
  ['GİR', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'Ö', 'Ç', '←']
];
const WIDE_KEYS = new Set(['GİR', '←']);
const DISABLED_KEYS = new Set(['Q', 'W', 'X']);

function initKeyboard() {
  const keyboard = document.getElementById('keyboard');
  if (!keyboard || keyboard.childElementCount) return;
  KEYBOARD_LAYOUT.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'keyboard-row';
    row.forEach(key => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const disabled = DISABLED_KEYS.has(key);
      btn.className = 'key' + (WIDE_KEYS.has(key) ? ' wide' : '') + (disabled ? ' key-disabled' : '');
      btn.textContent = key;
      if (disabled) btn.disabled = true;
      else btn.addEventListener('click', () => handleKey(key));
      rowDiv.appendChild(btn);
    });
    keyboard.appendChild(rowDiv);
  });
  layoutGame();
  if (window.ResizeObserver) {
    new ResizeObserver(layoutGame).observe(document.getElementById('game-panel'));
  } else {
    window.addEventListener('resize', layoutGame);
  }
}

// One key width for all three rows, the widest that fits twelve across,
// capped at a thumb -- the same arithmetic as sozcel.html's layoutGame().
// KEY_ASPECT is the drawn hexagon's own ratio, so it fills its key.
const KEY_ASPECT = (0.8242 / 0.7618) * (1536 / 1024);
const KEY_MAX_W = 38;
const KEY_MIN_W = 16;
const KB_GAP = 3;
const KB_ROW_GAP = 5;
let _lastKeyW = 0;
function layoutKeyboard() {
  const panel = document.getElementById('game-panel');
  const kb = document.getElementById('keyboard');
  if (!panel || !kb) return;
  const cs = getComputedStyle(panel);
  const innerW = panel.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  if (!(innerW > 0)) return;
  const keyW = Math.max(KEY_MIN_W, Math.min(KEY_MAX_W, Math.floor((innerW - 11 * KB_GAP) / 12)));
  // Writing nothing when nothing changed keeps the ResizeObserver quiet.
  if (keyW === _lastKeyW) return;
  _lastKeyW = keyW;
  kb.style.setProperty('--kb-key', keyW + 'px');
  kb.style.setProperty('--kb-key-h', Math.round(keyW * KEY_ASPECT) + 'px');
  kb.style.setProperty('--kb-gap', KB_GAP + 'px');
  kb.style.setProperty('--kb-row-gap', KB_ROW_GAP + 'px');
  kb.style.setProperty('--kb-font', Math.max(11, Math.round(keyW * 0.55)) + 'px');
  kb.style.setProperty('--kb-font-wide', Math.max(9, Math.round(keyW * 0.40)) + 'px');
}

// The keyboard first, then the grid gets whatever is left of the play
// area once the definition bar, the message lines and the buttons have
// taken theirs -- so nothing on the page ever has to scroll.
function layoutGame() {
  layoutKeyboard();
  layoutBoard();
}

let _lastCell = 0;
function layoutBoard() {
  const area = document.getElementById('play-area');
  const grid = document.getElementById('crossword-grid');
  if (!area || !grid || !PUZZLE) return;
  const gap = parseFloat(getComputedStyle(grid).columnGap) || 0;
  const areaGap = parseFloat(getComputedStyle(area).rowGap) || 0;
  let others = 0, n = 0;
  for (const el of area.children) {
    if (el === grid || el.hidden || getComputedStyle(el).display === 'none') continue;
    others += el.offsetHeight;
    n++;
  }
  const availH = area.clientHeight - others - areaGap * n;
  const availW = area.clientWidth;
  const cell = Math.floor(Math.min(
    (availW - gap * (COLS - 1)) / COLS,
    (availH - gap * (ROWS - 1)) / ROWS,
    64));
  if (!(cell > 0) || cell === _lastCell) return;
  _lastCell = cell;
  grid.style.width = (cell * COLS + gap * (COLS - 1)) + 'px';
  grid.style.setProperty('--cell-font', Math.round(cell * 0.5) + 'px');
  grid.style.setProperty('--cell-num-font', Math.max(8, Math.round(cell * 0.2)) + 'px');
}

// The first word's first square, for a letter typed before any square
// was pressed.
function firstOpenCell() {
  const first = allEntries()[0];
  if (first) { activeDir = first.dir; return { row: first.e.row, col: first.e.col }; }
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) if (PUZZLE[r][c] !== null) return { row: r, col: c };
  }
  return null;
}

// One square back along the word; false at its first square.
function moveToPrev() {
  const aw = activeWord();
  if (!aw) return false;
  const cells = wordCells(aw.e, aw.dir);
  const i = cells.findIndex(p => p.row === activeCell.row && p.col === activeCell.col);
  if (i <= 0) return false;
  selectCell(cells[i - 1].row, cells[i - 1].col, { dir: aw.dir });
  return true;
}

// Both keyboards -- the on-screen one and a physical one -- come here.
function handleKey(key) {
  if (!PUZZLE || gameCompleted) return;
  if (key === 'GİR') { document.getElementById('check-btn').click(); return; }
  if (!activeCell) {
    const first = firstOpenCell();
    if (!first) return;
    selectCell(first.row, first.col);
    if (key === '←') return;
  }
  if (key === '←') {
    // Clear this square; if it was already empty, step back and clear that.
    const { row, col } = activeCell;
    if (!userAnswers[row][col] && moveToPrev()) updateCell('');
    else updateCell('');
    saveState();
    return;
  }
  updateCell(key);
  moveToNext();
  markAsPlayed();
  saveState();
}

// Physical keyboard. Turkish case pairs are I/ı and İ/i, so the fold is
// tr-TR's, never the invariant toUpperCase() (which turns i into I).
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Backspace') { handleKey('←'); return; }
  // A focused button already answers Enter with its own click.
  if (e.key === 'Enter') { if (!e.target.closest('button')) handleKey('GİR'); return; }
  if (e.key.length === 1 && /[a-zçğıöşüA-ZÇĞİÖŞÜ]/.test(e.key)) {
    const upper = e.key.toLocaleUpperCase('tr-TR');
    if (DISABLED_KEYS.has(upper)) return;
    handleKey(upper);
  }
});

// Record an "in progress" game_results row on first interaction so Kahvehane
// can show the game as played even when the user doesn't finish it today.
let markingPlayed = false;
async function markAsPlayed() {
  if (markingPlayed) return;
  markingPlayed = true;
  try {
    const flagKey = 'bulmaca_started_' + dailySeed;
    if (await gameStorage.get(flagKey)) return;
    await gameStorage.set(flagKey, '1');
    try {
      const { data: { session } } = await gameStorage.session();
      if (!session) return;
      const { error } = await sb.from('game_results').insert([{
        user_id: session.user.id,
        game: 'bulmaca',
        date: dailySeed,
        attempts: 0,
        won: false,
        neighborhood: userNeighborhood
      }]);
      if (error) console.error('[bulmaca markAsPlayed]', error);
    } catch (e) { console.error('[bulmaca markAsPlayed]', e); }
  } finally {
    markingPlayed = false;
  }
}

// One square on along the word; from its last square, on to the next word.
function moveToNext() {
  const aw = activeWord();
  if (!aw) return;
  const cells = wordCells(aw.e, aw.dir);
  const i = cells.findIndex(p => p.row === activeCell.row && p.col === activeCell.col);
  if (i >= 0 && i < cells.length - 1) selectCell(cells[i + 1].row, cells[i + 1].col, { dir: aw.dir });
  else stepWord(1);
}

// The definition bar's own controls.
function wireClueBar() {
  document.getElementById('clue-prev').addEventListener('click', () => stepWord(-1));
  document.getElementById('clue-next').addEventListener('click', () => stepWord(1));
  // Pressing the definition itself flips to the square's other word, the
  // same as pressing the square again.
  document.getElementById('clue-bar-text').addEventListener('click', () => {
    if (activeCell) selectCell(activeCell.row, activeCell.col, { tap: true });
  });
}

// Save/restore state
async function saveState() {
  const state = { userAnswers, gameCompleted, checkAttempts };
  await gameStorage.set(SAVE_KEY, JSON.stringify(state));
  // Awaited by the win branch on the check-btn listener so a tab closed
  // right after finishing doesn't cut the upsert off before it reaches
  // Supabase.
  await saveStateRemote(state);
}

// Mirror to Supabase so the board syncs across devices.
async function saveStateRemote(state) {
  try {
    const { data: { session } } = await gameStorage.session();
    if (!session) return;
    const { error } = await sb.from('game_state').upsert({
      user_id: session.user.id,
      game: 'bulmaca',
      date: dailySeed,
      state,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,game,date' });
    if (error) console.error('[bulmaca saveStateRemote]', error);
  } catch (e) { console.error('[bulmaca saveStateRemote]', e); }
}

async function restoreState() {
  let raw = await gameStorage.get(SAVE_KEY);
  if (!raw) {
    try {
      const { data: { session } } = await gameStorage.session();
      if (session) {
        const { data } = await sb.from('game_state')
          .select('state')
          .eq('user_id', session.user.id)
          .eq('game', 'bulmaca')
          .eq('date', dailySeed)
          .maybeSingle();
        if (data && data.state) {
          raw = JSON.stringify(data.state);
          await gameStorage.set(SAVE_KEY, raw);
        }
      }
    } catch (e) { console.error('[bulmaca restoreState remote]', e); }
  }
  if (!raw) return false;
  try {
    const state = JSON.parse(raw);
    if (!state.userAnswers) return false;
    const cells = document.querySelectorAll('.crossword-cell');
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        if (PUZZLE[row][col] !== null) {
          userAnswers[row][col] = (state.userAnswers[row] && state.userAnswers[row][col]) || '';
          const cell = cells[row * COLS + col];
          const textNode = Array.from(cell.childNodes).find(n => n.nodeType === 3);
          if (textNode) { textNode.textContent = userAnswers[row][col]; }
          else if (userAnswers[row][col]) { cell.appendChild(document.createTextNode(userAnswers[row][col])); }
          if (state.gameCompleted && userAnswers[row][col] === PUZZLE[row][col]) {
            cell.classList.add('correct');
          }
        }
      }
    }
    checkAttempts = state.checkAttempts || 0;
    gameCompleted = state.gameCompleted || false;
    if (gameCompleted) {
      document.getElementById('game-message').textContent = I18N.t('bulmaca.congrats');
      document.getElementById('game-message').style.color = 'var(--success)';
      document.getElementById('reset-info').textContent = getTimeUntilNextNight();
    }
    return true;
  } catch (e) { return false; }
}

// Check & clear buttons
document.getElementById('check-btn').addEventListener('click', async () => {
  if (gameCompleted) return;
  checkAttempts++;
  let allCorrect = true;
  const cells = document.querySelectorAll('.crossword-cell:not(.black)');

  cells.forEach(cell => {
    const row = parseInt(cell.dataset.row);
    const col = parseInt(cell.dataset.col);
    if (userAnswers[row][col] === PUZZLE[row][col]) {
      cell.classList.add('correct');
    } else {
      allCorrect = false;
      cell.classList.remove('correct');
    }
  });

  const msgEl = document.getElementById('game-message');
  if (allCorrect) {
    msgEl.textContent = I18N.t('bulmaca.congrats');
    msgEl.style.color = 'var(--success)';
    document.getElementById('reset-info').textContent = getTimeUntilNextNight();
    gameCompleted = true;
    // Insert the winning row first so renderStats() (Supabase-backed)
    // reflects this game immediately. Streaks are derived from row data.
    await recordGameResult('bulmaca', dailySeed, checkAttempts, true, userNeighborhood);
    renderStats();
  } else {
    msgEl.textContent = 'Bazı cevaplar yanlış!';
    msgEl.style.color = 'var(--accent)';
  }
  await saveState();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  if (gameCompleted) return;
  userAnswers.forEach((row, i) => row.forEach((_, j) => userAnswers[i][j] = ''));
  document.querySelectorAll('.crossword-cell:not(.black)').forEach(cell => {
    const textNode = Array.from(cell.childNodes).find(n => n.nodeType === 3);
    if (textNode) textNode.textContent = '';
    cell.classList.remove('correct');
  });
  document.getElementById('game-message').textContent = '';
  saveState();
});

// ── Daily neighborhood scoreboard ──
// The left bar shows each neighborhood's share of today's Bulmaca points.
// Scoring: `attempts` = number of check-button presses on the winning row.
// Fewer checks → higher score (20/12/8/6/4 for 1–5 checks, 2 for more).
// A loss / unfinished row earns 1 pt for participation.
function _bulmacaPointsForRow(attempts, won) {
  if (won) {
    const ladder = [20, 12, 8, 6, 4];
    const idx = Math.max(0, Math.min(ladder.length - 1, (attempts || 1) - 1));
    return ladder[idx] ?? 2;
  }
  return attempts >= 0 ? 1 : 0;
}

async function renderStats() {
  const el = document.getElementById('stats-left');
  if (!el) return;
  const emptyShell = (msg) => `
    <div class="scoreboard">
      <h2>${I18N.t('games.todayneighborhoods')}</h2>
      <ol class="scoreboard-list">
        <li class="scoreboard-empty">${msg}</li>
      </ol>
    </div>
  `;

  let rows;
  try {
    const { data, error } = await sb.from('game_results')
      .select('user_id, neighborhood, attempts, won')
      .eq('game', 'bulmaca')
      .eq('date', dailySeed);
    if (error) throw error;
    rows = data || [];
  } catch (e) {
    el.innerHTML = emptyShell('Skorlar yüklenemedi');
    return;
  }

  const bestByUser = new Map();
  rows.forEach(r => {
    if (!r.user_id || !r.neighborhood) return;
    const pts = _bulmacaPointsForRow(r.attempts, r.won);
    const prev = bestByUser.get(r.user_id);
    if (!prev || pts > prev.pts) bestByUser.set(r.user_id, { pts, neighborhood: r.neighborhood });
  });

  const totalsByNb = new Map();
  bestByUser.forEach(({ pts, neighborhood }) => {
    totalsByNb.set(neighborhood, (totalsByNb.get(neighborhood) || 0) + pts);
  });

  const total = Array.from(totalsByNb.values()).reduce((a, b) => a + b, 0);
  if (total === 0) {
    el.innerHTML = emptyShell('Bugün henüz puan yok');
    return;
  }

  const sorted = Array.from(totalsByNb.entries())
    .map(([nb, pts]) => ({ nb, pts, pct: pts / total }))
    .sort((a, b) => b.pts - a.pts);

  el.innerHTML = `
    <div class="scoreboard">
      <h2>${I18N.t('games.todayneighborhoods')}</h2>
      <ol class="scoreboard-list">
        ${sorted.map((row, i) => {
          const rankClass = i < 3 ? ' r' + (i + 1) : '';
          const name = (neighborhoodNames[row.nb] || row.nb).toLocaleUpperCase('tr-TR');
          return `
            <li class="scoreboard-item${rankClass}">
              <span class="scoreboard-rank">${i + 1}.</span>
              <span class="scoreboard-player"><span class="scoreboard-name">${name}</span></span>
              <span class="scoreboard-score">${row.pct.toFixed(2)}</span>
            </li>
          `;
        }).join('')}
      </ol>
    </div>
  `;
}

// ── Weekly scoreboard (mirrors Kahvehane) ──
// One implementation, in i18n.js -- and the null-safe one: three of the
// four copies rendered the literal text "null" for a null argument.
function escapeHtml(s) { return I18N.escapeHtml(s); }
// A 'YYYY-MM-DD' key as a Date. One implementation, in ist-date.js.
function parseGameDate(s) { return IstDate.parseYMD(s); }
// The numbers come from IstScoreboard (scoreboard.js) -- the same weekly
// board Kahvehane and Sözcel show. This page used to count one point per
// win over a rolling seven days, so it showed different totals for the
// same members under the same title.
async function loadScoreboard() {
  const listEl = document.getElementById('scoreboard-list');
  if (!listEl) return;
  const { rows, error } = await IstScoreboard.weekly(sb);
  if (error) { listEl.innerHTML = '<li class="scoreboard-empty">Skorlar yüklenemedi</li>'; return; }
  listEl.innerHTML = rows.length ? IstScoreboard.rowsHTML(rows, { districtNames: neighborhoodNames }) : '';
}

// Turkish ablative suffix (vowel harmony + voiceless-consonant rule).
// Turkish vowel harmony, in i18n.js where localisation lives.
function getAblativeSuffix(name) { return I18N.ablative(name); }

// Mark games as started (light gray) or completed (dark gray) in side nav
async function markPlayedGames() {
  const today = dailySeed;
  const started = new Set();
  const completed = new Set();
  const localFlags = {
    sozcel: 'sozcel_started_' + today,
    tumcel: 'tumcel_started_' + today,
    bulmaca: 'bulmaca_started_' + today
  };
  for (const [g, key] of Object.entries(localFlags)) {
    if (await gameStorage.get(key)) started.add(g);
  }
  try {
    const { data: { session } } = await gameStorage.session();
    if (session) {
      const { data, error } = await sb.from('game_results')
        .select('game, attempts').eq('user_id', session.user.id).eq('date', today);
      if (!error && data) data.forEach(r => {
        if ((r.attempts || 0) >= 1) completed.add(r.game);
        else started.add(r.game);
      });
    }
  } catch (e) {}
  document.querySelectorAll('.game-link[data-game]').forEach(el => {
    if (el.classList.contains('active')) return;
    const g = el.dataset.game;
    if (completed.has(g)) el.classList.add('completed');
    else if (started.has(g)) el.classList.add('started');
  });
}

// Init
(async () => {
  // Gate FIRST: a direct URL / bookmark load of a still-locked Bulmaca must
  // bounce to kahvehane before the puzzle wires up and game_results can be
  // written.
  if (typeof applyGameLocks === 'function') {
    const bounced = await applyGameLocks(sb);
    if (bounced) return;
  }

  const puzzle = await loadTodaysPuzzle();
  if (!puzzle) {
    // No admin-drawn puzzle for tonight -- same failure Tümcel already
    // reports for the same reason (nothing auto-picks either any more).
    document.getElementById('crossword-grid').innerHTML = '';
    const msgEl = document.getElementById('game-message');
    msgEl.textContent = 'Bugünkü bulmaca henüz hazır değil.';
    msgEl.style.color = 'var(--muted)';
    document.getElementById('check-btn').disabled = true;
    document.getElementById('clear-btn').disabled = true;
    renderStats();
    loadScoreboard();
    markPlayedGames();
    return;
  }

  initFromPuzzle(puzzle);
  createGrid();
  wireClueBar();
  renderClueBar();
  initKeyboard();
  await restoreState();
  // Start in the first word, so the bar has a definition from the outset.
  if (!gameCompleted && !activeCell) {
    const first = firstOpenCell();
    if (first) selectCell(first.row, first.col, { dir: activeDir });
  }
  layoutGame();
  renderStats();
  loadScoreboard();
  markPlayedGames();
})();


// Another member's profile: one sheet for the whole site (see
// openMemberSheet in profile-card.js), opened by any .author-link /
// .kefil-link on this page. profile-card.js is deferred, so this waits
// for it instead of reaching for it mid-parse.
(function wireMemberSheet() {
  const wire = () => { if (window.IstProfileCard) IstProfileCard.initMemberSheet({ sb, I18N }); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>
