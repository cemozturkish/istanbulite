<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(../../assets/fonts/inter-latin.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: Inter; src: url(../../assets/fonts/inter-latin-ext.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 430px; height: 932px; overflow: hidden; font-family: Inter, sans-serif; }
body { --bg: #f3f2ef; --ink: #111; --mut: #555; --red: #b93631; --rule: #111; background: var(--bg); color: var(--ink); position: relative; }
body.dark { --bg: #383838; --ink: #f4f3f0; --mut: #c9c9c9; --red: #e0574f; --rule: #f4f3f0; }
body.red { --bg: #b93631; --ink: #fff; --mut: #f6dcda; --red: #fff; --rule: #fff; }
body.earth { --bg: #574133; --ink: #f6ead9; --mut: #dcc7ae; --red: #f08a45; --rule: #f6ead9; }
.copy { position: absolute; left: 26px; right: 26px; top: 34px; }
.k { display: flex; align-items: center; gap: 12px; color: var(--red); font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
.k::after { content: ''; flex: 1; height: 1.5px; background: var(--rule); opacity: .9; }
h1 { margin-top: 14px; font-size: 39px; line-height: 1.02; font-weight: 900; letter-spacing: -0.035em; }
p { margin-top: 12px; font-size: 14.5px; line-height: 1.38; color: var(--mut); font-weight: 500; max-width: 360px; }
.phone { position: absolute; left: 50%; top: 210px; width: 334px; transform: translateX(-50%);
  padding: 9px; border-radius: 54px; background: #1b1b1b;
  box-shadow: 0 0 0 2px #4a4a4a, 0 30px 60px rgba(0,0,0,.28); }
.screen { position: relative; width: 316px; height: 685px; border-radius: 45px; overflow: hidden; background: var(--bar, #383838); }
.sb { position: absolute; z-index: 2; left: 0; right: 0; top: 0; height: 43.4px; display: flex; align-items: center; justify-content: space-between; padding: 6px 28px 0 38px; color: #fff; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.island { position: absolute; z-index: 2; top: 9px; left: 50%; transform: translateX(-50%); width: 92px; height: 27px; border-radius: 20px; background: #000; }
.icons { display: flex; gap: 5px; align-items: center; }
.shot { position: absolute; left: 0; top: 0; width: 316px; height: 685px; display: block; }
.home { position: absolute; z-index: 2; left: 50%; bottom: 7px; transform: translateX(-50%); width: 112px; height: 4px; border-radius: 3px; background: #f2f2f2; }
/* closer */
.closer .copy { top: 70px; text-align: center; }
.closer .k { display: none; }
.closer .logo { display: block; margin: 0 auto 34px; width: 230px; }
.closer h1 { font-size: 64px; line-height: .95; }
.closer p { margin: 18px auto 0; font-size: 16px; }
.closer .phone { top: 430px; }
</style></head>
<body>
<div class="copy"><div class="k" id="k"></div><img class="logo" id="logo" hidden><h1 id="h"></h1><p id="p"></p></div>
<div class="phone"><div class="screen" id="screen">
  <div class="sb"><span>9:41</span><span class="icons">
    <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="6" rx="1" fill="#fff"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="11" rx="1" fill="#fff"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2C13.3 1.5 10.8.5 8 .5S2.7 1.5.8 3.4L2 4.6c1.6-1.5 3.7-2.4 6-2.4zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.2-1.2C11.5 4.5 9.8 3.8 8 3.8s-3.5.7-4.8 1.9l1.2 1.2c1-.9 2.2-1.4 3.6-1.4zm0 3.3c.6 0 1.1.2 1.5.6L8 11 6.5 9.4c.4-.4.9-.6 1.5-.6z" fill="#fff"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.2" fill="none" stroke="#fff" opacity=".45"/><rect x="2" y="2" width="18" height="8" rx="2" fill="#fff"/><path d="M23 4v4c.8-.3 1.3-1.1 1.3-2S23.8 4.3 23 4z" fill="#fff" opacity=".45"/></svg>
  </span></div>
  <div class="island"></div>
  <img class="shot" id="shot">
  <div class="home"></div>
</div></div>
<script>
const q = new URLSearchParams(location.search);
document.body.className = (q.get('bg') || '') + (q.get('closer') ? ' closer' : '');
document.getElementById('k').textContent = q.get('k') || '';
document.getElementById('h').innerHTML = (q.get('h') || '').replace(/\|/g, '<br>');
document.getElementById('p').textContent = q.get('p') || '';
document.getElementById('shot').src = q.get('img');
document.getElementById('screen').style.setProperty('--bar', q.get('bar') || '#383838');
if (q.get('closer')) { document.getElementById('k').hidden = true; const l = document.getElementById('logo'); l.hidden = false; l.src = q.get('logo'); }
</script>
</body></html>
