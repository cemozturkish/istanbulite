  <!-- Swipe pagination: pre-body, set initial offscreen state so columns don't flash at origin before sliding in. Also seeds the VT direction class so the cross-document transition knows which way to slide before it captures the snapshot, and a one-shot flag (read by the other two pages' own card-entrance animations) so a feed's cards don't animate in on their first run here -- the column itself is already sliding in from the same edge, so animating the cards inside it too would look like the content arriving twice.
       ist-entering-* (the manual transform-transition fallback) is only for browsers WITHOUT View Transitions support -- on VT-capable browsers the native cross-document transition already slides the column in as a snapshot, so also applying the fallback class made the real DOM run its own second, independent slide underneath once DOMContentLoaded released it mid-transition, producing a visible double entrance. vt-* (which drives the VT pseudo-element keyframes) is unaffected and still always seeded. -->
  <script>
    (function(){
      try {
        var _d = sessionStorage.getItem('ist-page-enter-dir');
        if (_d) {
          var _vt = ('startViewTransition' in document) && !window.Capacitor;
          if (!_vt) document.documentElement.classList.add('ist-entering-' + _d);
          document.documentElement.classList.add('vt-' + _d);
          window.__istSuppressFirstCardAnim = { left: true, right: true };
        }
      } catch(e) {}
    })();
  </script>

  <style data-page="anahane">
    :root {
      /* Core ink & paper — cool cream newspaper palette */
      --ink: #4C382A;
      --ink-deep: #4C382A;
      --paper: #eddbd0;       /* main canvas + sidebar columns — lightest */
      --paper-warm: #eddbd0;  /* sidebar column background — lightest */
      --paper-card: rgba(255, 255, 255, 0.85);  /* news + event cards — white, mostly opaque over the map photo */
      /* Card text stays dark; hover just lightens the background a
         touch. Full detail (sources / RSVP) opens in the bottom sheet
         instead of flipping the card's own colors in place. */
      --card-fg: #1a1a1a;
      --card-fg-heading: #1a1a1a;
      --card-fg-muted: #4a4a4a;
      --card-border: rgba(26, 26, 26, 0.2);
      --card-border-soft: rgba(26, 26, 26, 0.15);
      --card-border-color: #1a1a1a;
      --paper-banner: #c9ae9a;/* sidebar header bars — darker */
      --paper-navbar: #b89b7f;/* top nav bar — darkest */
      --paper-dark: #d8c0b1;
      --hover: #d8c0b1;
      --field-bg: #e8d3c8;
      /* RGB triplets for the floating map panels (need alpha, so they
         can't just reference the hex vars above). Overridden alongside
         everything else in palette.css for data-palette="mono". */
      --paper-warm-rgb: 237, 219, 208;
      --ink-rgb: 76, 56, 42;
      /* Warm neutrals */
      --accent: #4C3B31;
      --accent-2: #775E4C;
      --muted: #867264;
      --rule: #b8a08a;
      --hairline: #c5ad9a;
      --whisper: #d4bbad;
      /* Newspaper accents */
      --ink-red: #B93631;
      --brown-1: #b8947a;
      --brown-2: #866955;
      --brown-3: #775742;
      --brown-4: #4C3B31;
      /* Semantic aliases */
      --border: var(--rule);
      --success: var(--accent-2);
      --danger: var(--ink-red);
      /* Border shortcuts */
      --col-border: 1px solid var(--rule);
      --row-border: 1px solid var(--hairline);
      --hairline-border: 1px solid var(--whisper);
      --rule-strong: 1px solid var(--ink);
      --rule-double: 4px double var(--ink);
    }

    /* Cards that float over the map photo keep one fixed look (white,
       mostly opaque) regardless of the earth/mono palette toggle — same

       palette.css's mono --paper-card just for this page. */
    :root[data-palette="mono"] {
      --paper-card: rgba(255, 255, 255, 0.85);
    }

    html, body {

    /* ── LOGIN OVERLAY ── */

    /* ── MAIN SITE ──
       Desktop: a real CSS Grid (matches kahvehane/kutuphane's body grid)
       -- 260px/1fr/260px columns, auto/1fr rows. The map is a fixed
       full-bleed background layer that escapes the grid entirely
       (z-index -1); the top nav and both sidebars are frameless grid
       items floating over it. Mobile keeps its own stacked layout,
       redeclared wholesale inside its own @media block below. */
    #main-site {
      pointer-events: none;
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }

    #main-site.active {
      pointer-events: auto;
    }

    /* Top nav, both side columns, and main are frameless -- just typography
       (or the full-bleed map) floating directly on the map photo. frames.css
       still targets these classes/tag with !important (including `main`,
       shared with kahvehane/kutuphane where it IS a card), so beat it with
       an #main-site-qualified override (higher specificity, wins regardless
       of stylesheet order). Without `main` here, frames.css's opaque
       --frame-bg background paints solid over main's grid cell, hiding the
       fixed/z-index:-1 .map-panel behind it. */
    #main-site .section-rule,
    #main-site .col-left,
    #main-site .col-right,
    #main-site main {
      background: none !important;
      box-shadow: none !important;
      border: none !important;
    }

    .section-rule {
      grid-column: 1 / -1;
      grid-row: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 28px 10px 28px;
      /* main now carries z-index:0 (see main{} below) to keep its fixed
         .map-panel child contained in its own stacking context instead of
         escaping to the root -- but that also makes main's whole subtree,
         including the full-bleed map, paint above any *non*-stacking-context
         sibling. .col-left/.col-right already get z-index:501 from
         frames.css (for the bottom-sheet layering, desktop-only), so they
         were unaffected; .section-rule had no z-index of its own and ended
         up buried under the map. A plain positive z-index (any value above
         main's 0) is enough to put it back on top. */
      z-index: 1;
    }

    header {
      display: flex;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 32px;
    }
    nav a {
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: color 0.2s;
      padding: 2px 0;
    }
    nav a:hover { color: var(--ink); }
    nav a.active { color: var(--ink); font-weight: 700; }

    .col-left {
      /* Swapped to the right-hand grid track: the library card (top of
         .col-left) sits top-right, the events feed's counterpart (top of
         .col-right) sits top-left -- see the matching swap of the
         slide-direction rules below, which keep exit/enter animations
         honest about which edge each column now actually borders. */
      grid-column: 3;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Wraps everything in .col-left except #library-card, so the profile
       card can be excluded from the column's slide/view-transition
       animation below and stay visually still while switching pages. */
    .col-left-slide {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .col-left .nb-highlight {
      padding: 9px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      background: transparent;
      color: var(--muted);
      text-align: left;
      font-style: italic;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      flex-shrink: 0;
    }
    .col-right {
      grid-column: 1;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    /* Wraps everything in .col-right except #politician-card, mirroring
       .col-left-slide -- keeps the politician card visually still during
       the slide/view-transition animations below while the news feed
       slides. */
    .col-right-slide {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    /* Mirrors #library-card's layout: DOM order in renderPoliticianCard()
       puts the avatar last (right side) instead of first, and this
       right-aligns the name/title text next to it -- a true mirror image
       of the top-left card rather than just a reused style. */
    .politician-card .card-id { text-align: right; }
    /* Clicking the card opens the detail bottom sheet (see the delegated
       #politician-card click listener) -- unlike #library-card, the whole
       card is the click target, not just an inner edit button. */
    .politician-card { cursor: pointer; }
    /* The two top cards sit on the same 14px line -- the one the feeds
       that used to stack below them were printed on, kept so the cards
       still line up with the columns' own inset. */
    #library-card, #politician-card {
      margin-left: 14px;
      margin-right: 14px;
    }

    /* Bottom corner cards -- mirror the top profile cards' pinned
       position/style but sit at the bottom of each column instead of the
       top; buttons will be added inside these later. Sibling of
       .col-left-slide/.col-right-slide (not inside it) so they stay put
       while the news/events feed above scrolls, exactly like
       #library-card/#politician-card stay put at the top. */
    .corner-card {
      border: 2px solid var(--ink);
      border-bottom: 5px solid var(--ink);
      margin: 12px 14px;
      padding: 12px 14px;
      min-height: 44px;
      background: color-mix(in srgb, var(--paper) 85%, transparent);
      flex-shrink: 0;
    }

    main {
      grid-column: 2;
      grid-row: 2;
      display: block;
      overflow: hidden;
      /* z-index (any explicit value, grid items don't need `position` for
         this) gives main its own stacking context, so its fixed/negative
         z-index child .map-panel stays contained within main's local
         paint order instead of escaping all the way to the root stacking
         context. Without this, .map-panel ends up stacked below
         #main-site's own box -- and #main-site.active has
         pointer-events:auto (see above) covering the full viewport, so it
         silently intercepted every hover/click meant for the map's SVG
         hit-regions before they ever reached them. Nothing else lives in
         main, so letting clicks pass straight through main's own box is
         safe; .map-panel re-enables pointer-events for itself and its
         children below. */
      z-index: 0;
      pointer-events: none;
    }

    /* ── MAP PANEL: fixed full-bleed background (matches kahvehane/kutuphane) ──
       position:fixed escapes the grid entirely, so this covers the whole
       viewport regardless of which grid cell it's a DOM child of. */
    .map-panel {
      position: fixed;
      inset: 0;
      pointer-events: auto;
      z-index: -1;
      padding: 0;
      overflow: hidden;
      /* Matches the map artwork's own sea/background gray (#f7f7f7); the
         svg uses preserveAspectRatio="slice" so this only shows briefly
         during image load, not as a letterbox gap. */
      background: #f7f7f7;
      /* Pinch-to-zoom is disabled for now (see map-zoom.js's
         ZOOM_ENABLED) -- touch-action stays at the browser default so a
         touch that starts on the map still scrolls the page normally. */
      touch-action: auto;
    }

    /* Wraps the photo + hit-region overlay so map-zoom.js can scale/pan
       them together as one unit with a single transform -- map-label
       stays outside it, un-zoomed. */
    .map-zoom-layer {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
    }

    .map-panel img.map-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    /* Mobile-only draft map image -- hidden on desktop, shown instead of
       the svg inside the mobile media query below. */
    .map-mobile-draft { display: none; }

    /* Traced hit-region overlay, aligned to map-photo via the matching
       5046x2300 viewBox + slice (see mobile media query for the
       mobile-draft swap, which hides this since it has no mobile trace
       yet). */
    .map-panel svg.map-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .neighborhood {
      cursor: pointer;
      fill: transparent;
      stroke: transparent;
      stroke-width: 3;
      transition: fill 0.2s, stroke 0.2s;
      pointer-events: all;
      /* Mobile browsers draw the default tap-highlight using the
         element's bounding *box*, not its actual (irregular polygon)
         shape -- on a district like this, that showed up as a gray
         rectangle flashing over the tapped area for a moment. */
      -webkit-tap-highlight-color: transparent;
    }

    /* Real districts outside this app's 25 (Avcılar, Arnavutköy, Kartal,
       Sultanbeyli, Sancaktepe, Pendik, Tuzla, Şile), plus the Kocaeli-side
       landmass ("istanbul_disi") — not interactive, and no longer given a
       distinguishing tint; they just blend into the base map artwork. */
    .map-unaccommodated,
    .map-istanbul-disi {
      fill: transparent;
      stroke: transparent;
      pointer-events: none;
    }

    /* Hover: dim the artwork under the cursor. .hover-active is toggled
       via JS on every polygon sharing the same data-neighborhood (see
       the mouseover/mouseout listeners below), so multi-polygon
       districts like Şişli light up as one unit instead of just the
       piece under the cursor; :hover stays as a no-JS fallback for the
       single polygon actually being pointed at. */
    .neighborhood:hover, .neighborhood.hover-active { fill: rgba(var(--ink-rgb), 0.18); }
    /* Clicked/active: darker tint + outline */
    .neighborhood.active {
      fill: rgba(var(--ink-rgb), 0.32);
      stroke: var(--accent);
    }
    /* Home neighborhood: always darker than the rest, even at rest,
       plus a dashed outline so it reads as "yours" over the art. Uses
       --ink-red (the same red as SON DAKİKA/breaking news) instead of
       the neutral ink tint the other states use -- it's identical in
       both earth and mono palettes, so no separate mono override needed. */
    .neighborhood.home {
      fill: rgba(130, 55, 48, 0.16);
      stroke: var(--brown-4);
      stroke-width: 4;
      stroke-dasharray: 10 6;
    }
    .neighborhood.home:hover, .neighborhood.home.hover-active { fill: rgba(130, 55, 48, 0.26); }
    .neighborhood.home.active { fill: rgba(130, 55, 48, 0.38); stroke: var(--brown-4); stroke-dasharray: none; }

    /* A member whose district has a hand-painted map (assets/map/home/,
       see home-map.js) gets the colour from the artwork itself, so the
       .home tint above would lay a second red over the first -- and a
       thicker, polygon-shaped one at that. On those maps the polygon
       falls back to plain district behaviour: the drawing alone says
       "this one is yours", and hovering or selecting it looks exactly
       like hovering or selecting anywhere else. */
    .map-panel.ist-home-painted .neighborhood.home {
      fill: transparent;
      stroke: transparent;
      stroke-dasharray: none;
    }
    .map-panel.ist-home-painted .neighborhood.home:hover,
    .map-panel.ist-home-painted .neighborhood.home.hover-active {
      fill: rgba(var(--ink-rgb), 0.18);
    }
    .map-panel.ist-home-painted .neighborhood.home.active {
      fill: rgba(var(--ink-rgb), 0.32);
      stroke: var(--accent);
    }

    /* Plain text, no frame/shadow — matches the HANE/KÜTÜPHANE/KAHVEHANE
       nav tab style (nav a above), not a floating pill. */
    .map-label {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ── PETEK pill — opens the hane honeycomb ──
       Sits right above the map label, the same white/ink frame Kahvehane's
       Kahve Endeksi pill wears over its own map, so the one button each
       page carries over the city reads as the same kind of button. Unlike
       that one it stays on desktop too: the honeycomb has no persistent
       column of its own to be redundant with. */
    .petek-pill {
      position: fixed;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 2px solid #1a1a1a;
      background: rgba(255, 255, 255, 0.85);
      color: #1a1a1a;
      padding: 6px 14px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .petek-pill:hover { background: #1a1a1a; color: #fff; }


    .sidebar-right-inner {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nb-articles {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nb-article {
      border-left: 3px solid #4C4C4C;
      padding-left: 6px;
    }

    .nb-article h4 {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .nb-article p {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 1px;
      line-height: 1.2;
    }

    .no-articles {
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--muted);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MOBILE RESPONSIVE ──
       Stacked flow instead of desktop's floating-over-fullscreen-map
       layout: the map sits at the very top like a hero banner with the
       profile card floating over its empty/sea-colored band (same
       #f7f7f7 as the map artwork's own background, so the card reads as
       part of the map rather than a stacked box), then an events/news
       column pair below, all scrolling in #main-site itself, with the
       tab bar pinned fixed at the very bottom (its <header> already
       escapes to the viewport via position:fixed regardless of where
       .section-rule sits). */
    @media (max-width: 768px) {
      html, body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        width: 100%;
      }

      #login-overlay .masthead-login { font-size: 2rem; }
      .login-box { width: 90vw; max-width: 360px; padding: 24px 20px; }
      .q-buttons-inline { display: flex; gap: 8px; }

      #main-site {
        position: relative;
        height: 100%;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "map map"
          "news events";
        /* Row 2 takes everything the map leaves, so the two card columns
           have a full-height box to sit at the BOTTOM of (see the feeds'
           auto margin below) instead of hanging off the map's lower edge.
           Left as the default
           align-content (stretch, not the `start` this used to pin): with
           anything else, grid track-sizes the rows by their content first
           and only then positions the shorter track set in the container,
           so row 2 sizes to one short card stack and never claims the
           leftover space -- the same trap kahvehane.html hit (see its own
           grid-template-rows comment).

           Both tracks are stated, neither is left to content, and that is
           the whole point -- kahvehane.html's row 1 already reads exactly
           like this, and this is the page catching up to it:

           Row 1 is the map's square written out (main bleeds to the true
           screen edges, so its rendered width is always 100vw, and the
           extra term matches main's own margin-top below). Left as `auto`,
           the track's base size was main's MIN-content height, which for
           an aspect-ratio panel is next to nothing -- so as soon as row 2
           wanted more than the leftover space, the grid paid it out of the
           map: with three days of news the square collapsed from 393px to
           250px on a phone, taking the shared hero line down with it and
           sliding Hane's cards up out of line with Kütüphane's and
           Kahvehane's.

           Row 2 is minmax(0, 1fr), not a bare `1fr` -- a bare one is
           minmax(auto, 1fr), and that auto minimum is the news/events
           stacks' own height, which is the demand that squeezed row 1 in
           the first place. Zero as the minimum makes row 2 exactly the
           leftover space and no more; anything taller scrolls inside its
           own column instead of growing the row. */
        grid-template-rows: calc(100vw + var(--map-hero-top)) minmax(0, 1fr);
        /* frames.css's gap (row + column) exposed a sliver of the raw
           page canvas (--page-bg, warm beige/mono gray) directly under
           the map -- a different color from the map's own #f7f7f7,
           breaking the edge-to-edge look right where it's most visible.
           Zero the row gap so the map's bottom edge sits flush against
           the content below it; the column gap (between events/news)
           is kept, just halved below. */
        row-gap: 0 !important;
        /* Halve frames.css's column-gap (--frame-gap, 10px) between the
           events and news columns -- the full gap read as too much
           breathing room between the two card stacks on mobile. */
        column-gap: calc(var(--frame-gap) / 2) !important;
        /* #main-site always fills the full viewport height (height:100%
           above), but its content (map + one short row of cards) often
           doesn't -- and the columns are transparent by design (see
           .col-left/.col-right below), so the run of empty page above the
           bottom-aligned cards would show the raw page canvas instead of
           the map/card #f7f7f7. Coloring the container itself means any
           such gap matches by default instead of needing a fix per
           element. */
        background: #f7f7f7;
        /* Clears the fixed bottom tab bar so the last row of cards isn't
           hidden behind it. */
        padding-bottom: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom) + 16px);
      }

      /* Map: same real desktop artwork + traced SVG hit-regions (no more
         placeholder draft image), now a normal in-flow square block
         instead of a fixed full-bleed background layer. Bleeds past
         #main-site's own left/right frame padding (frames.css) so it
         reaches the true screen edges instead of sitting in a gutter,
         and drops frames.css's card shadow (only meant for panels that
         look like discrete floating cards, not this edge-to-edge hero). */
      main {
        grid-area: map;
        position: static;
        height: auto;
        overflow: visible;
        margin-left: calc(-1 * var(--frame-pad, 10px));
        margin-right: calc(-1 * var(--frame-pad, 10px));
        /* Room under the profile bar (offset by the same safe-area
           amount so the gap stays constant across notch sizes), so the
           bar overlaps only the map's empty "sea" band and never the
           districts themselves. Trimmed the old 40px extra down to 16px
           to reclaim the leftover dead space above the map and pull the
           whole map (and the events/news below it) further up. */
        margin-top: var(--map-hero-top);
        box-shadow: none !important;
      }
      .map-panel {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
      }
      /* Neither this page nor kahvehane's is meant to scroll -- so once
         map-zoom.js zooms past 1x, it switches the panel to a fixed
         position pinned at its own current on-screen rect (computed in
         JS, not CSS) with overflow allowed to escape that little square.
         That's the same "position:fixed escapes the grid" trick the
         desktop full-bleed map already relies on (see main's z-index:0
         above, which keeps it correctly layered instead of jumping to
         the root stacking context), so the larger zoomed map can spill
         into the rest of the screen without ever growing #main-site's
         own scrollable content size. */
      .map-panel.ist-zoomed {
        position: fixed;
        overflow: visible;
      }
      .map-panel img.map-photo { display: block; }
      .map-panel svg.map-svg { display: block; }
      .map-mobile-draft { display: none; }
      .map-label {
        position: absolute;
        bottom: 8px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 1px;
      }
      /* Mobile: .map-panel is position:relative here (not the fixed
         full-viewport backdrop), so the pill anchors inside the map's
         own square, just above the label — same as Kahvehane's. */
      .petek-pill {
        position: absolute;
        bottom: 28px;
        font-size: 9px;
        letter-spacing: 1.2px;
        padding: 4px 10px;
      }

      /* The profile bar (#ist-pc-mount) is the fixed top bar — the
         counterpart of the tab bar at the bottom. Its geometry and colors
         are in profile-card.css, one implementation for all three pages;
         nothing about it is page-specific, so nothing about it is restated
         here. It used to be a light card floating over the map's top
         (empty/sea) band, which each of the three pages spelled out again
         in its own mobile query. */

      /* Capacitor's WKWebView reports env(safe-area-inset-top) as 0 for a
         real (measured, ~80-200ms) window after every fresh page load
         before self-correcting on its own -- with no gating, the card
         renders flush under the status bar/notch for that window,
         covering the map's top districts. safe-area-ready.js removes
         this class once the real value is confirmed (or after a
         timeout), so the card and map simply appear already in the
         right place instead of visibly jumping. */
      html.ist-safe-area-pending #ist-pc-mount,
      html.ist-safe-area-pending main {
        visibility: hidden;
      }
      /* .section-rule no longer renders a floating masthead bar -- its
         only visible content (the tab nav) is pulled out via the
         <header> position:fixed rule below and pinned to the viewport
         bottom regardless of where this sits. Taken out of grid flow so
         it doesn't claim a row of its own. */
      .section-rule {
        grid-area: auto;
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        padding: 0;
        overflow: visible;
      }

      /* Events (left) + news (right): normal in-flow columns below the
         map, each stacking its cards from the BOTTOM of the screen up --
         one news item rests just above the tab bar, and a second one is
         laid on top of it rather than the stack hanging off the map's
         lower edge. Flex columns (not blocks) so the auto margin below
         can do that. Explicit z-index (above main's own 0, see main{}
         above) so they stay on top of the map even once it's zoomed in
         and spilling past its own little square -- otherwise DOM order
         alone would leave one of the two columns stacked below it. */
      .col-left, .col-right {
        position: static;
        top: auto; bottom: auto; left: auto; right: auto;
        height: auto;
        width: auto;
        display: flex;
        flex-direction: column;
        overflow: visible;
        z-index: 1;
      }
      .col-left { grid-area: events; }
      .col-right { grid-area: news; }
      /* Both columns are empty on this page now -- the events went to
         Kahvehane and the news to Kütüphane -- so the two tracks below
         the map carry nothing and the map is all there is to see. The
         tracks themselves stay: they are what the carousel slides, and
         they are where whatever comes next to Hane will land. */
      /* #ist-pc-mount (profile-card.js) already covers the identity card
         on mobile — the desktop-only #library-card would otherwise
         duplicate it. */
      #library-card { display: none; }
      /* The politician card as a card is desktop-only -- but the seat it
         names is NOT hidden on a phone any more: it moves into the
         profile bar's left end (#ist-pc-seat, see "THE TOP BAR" in
         profile-card.css). It still follows the map there, so tapping a
         district swaps the bar's seat to that district's Belediye
         Başkanı on a phone too. politician-card.js paints both.
         Bottom corner cards stay desktop-only -- same reasoning
         #library-card carries above (nothing to show in them yet). */
      #politician-card { display: none; }
      .corner-card { display: none; }

      /* Both sidebars keep their desktop flex column (see the feeds' auto
         margin above, which needs a flex parent to mean anything) and
         keep the internal scrolling too -- the page itself does not scroll
         (see #main-site's overflow above), so row 2's band between the
         hero line and the tab bar is all the height either column ever
         gets, and a stack taller than the band has to absorb the overflow
         here. It used to be handed back to the page, which grew the row,
         squeezed the map and ran the last card down behind the fixed tab
         bar. The scroller is the sidebar rather than the feed inside it so
         that the feed stays a plain in-flow box whose auto margin can push
         it to the bottom of the scrollable area.
         .sidebar-right also takes the flex:1 its left counterpart already
         has in the desktop rule -- without it the news sidebar is only as
         tall as its own cards, and pushing the feed to the bottom of a box
         that is exactly the feed's height moves nothing. min-height:0 on
         both (and on the columns) because a flex/grid item's automatic
         minimum size is its content: without it the box refuses to be
         shorter than the whole stack and the overflow escapes upward
         again, one level at a time. */
      .col-left, .col-right { min-height: 0; }
      .sidebar-right-inner {
        padding: 8px 12px;
        gap: 6px;
      }
      .no-articles { font-size: 11px; padding: 14px 8px; }

      /* Bottom tab bar — fixed at bottom. Thinned from the top; labels sit
         flush against the bottom edge (the safe-area padding below is what
         separates them from the home-indicator area). */
      header {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom));
        padding: 0 0 env(safe-area-inset-bottom);
        margin: 0;
        border-top: 1px solid var(--rule);
        border-bottom: none;
        background: var(--paper-navbar);
        z-index: 100;
        display: flex;
        align-items: stretch;
      }
      nav {
        display: flex;
        width: 100%;
        height: 100%;
        gap: 0;
        /* Pull KÜTÜPHANE/KAHVEHANE in from the screen's rounded corners --
           at full-bleed width:100% the outer tabs sat right under the
           curve. 18px specifically (was 20px): that's the shared screen
           inset the rest of the page lines up on -- frames.css's 10px
           frame padding plus the 8px inner padding the columns use --
           so with the edge alignment below, the tab labels land on the
           same vertical lines as the floating profile card, the comment
           cards, the composer and the game tiles. */
        padding: 0 18px;
        flex-wrap: nowrap;
        justify-content: stretch;
      }
      nav a {
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 6px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--muted);
        border: none;
        text-decoration: none;
        /* Same fix as .neighborhood: without this, tapping a tab flashes
           the browser's default gray tap-highlight box over it. */
        -webkit-tap-highlight-color: transparent;
      }
      nav a.active { color: var(--ink); font-weight: 700; }
      /* The two outer tabs align their label to the bar's own edge
         instead of centering it inside their third of the bar, which is
         what actually puts the K of KÜTÜPHANE and the E of KAHVEHANE on
         the 18px inset line (see nav's padding above). HANE, in the
         middle, stays centered. The -0.5px pull cancels the trailing
         letter-spacing that CSS adds after the final E, which would
         otherwise sit between the glyph and the flex-end edge. */
      nav a:first-child { justify-content: flex-start; }
      nav a:last-child {
        justify-content: flex-end;
        margin-right: -0.5px;
      }

      /* ── Mobile swipe pagination: only left/right columns slide; map, datetime bar, and nav stay ── */
      .col-left, .col-right {
        transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        backface-visibility: hidden;
      }
      html.ist-entering-forward .col-left,
      html.ist-entering-forward .col-right {
        transform: translateX(100vw);
        transition: none;
      }
      html.ist-entering-backward .col-left,
      html.ist-entering-backward .col-right {
        transform: translateX(-100vw);
        transition: none;
      }
      body.ist-exiting-forward .col-left,
      body.ist-exiting-forward .col-right {
        transform: translateX(-100vw);
      }
      body.ist-exiting-backward .col-left,
      body.ist-exiting-backward .col-right {
        transform: translateX(100vw);
      }
    }

    /* ── Desktop swipe pagination: left column slides out/in toward the
       left edge, right column toward the right edge — regardless of nav
       direction; map, datetime bar, and nav stay ── */
    @media (min-width: 769px) {
      .col-left-slide, .col-right-slide {
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        backface-visibility: hidden;
      }
      /* col-left-slide now lives in the right-hand grid track (see the
         .col-left/.col-right grid-column swap above), so it exits/enters
         via the right edge, and vice versa for col-right-slide. */
      html.ist-entering-forward .col-left-slide,
      html.ist-entering-backward .col-left-slide {
        transform: translateX(100vw);
        transition: none;
      }
      html.ist-entering-forward .col-right-slide,
      html.ist-entering-backward .col-right-slide {
        transform: translateX(-100vw);
        transition: none;
      }
      body.ist-exiting-forward .col-left-slide,
      body.ist-exiting-backward .col-left-slide {
        transform: translateX(100vw);
      }
      body.ist-exiting-forward .col-right-slide,
      body.ist-exiting-backward .col-right-slide {
        transform: translateX(-100vw);
      }
    }

    /* ══════════════════════════════════════════════
       View Transitions API — cross-document slide
       The browser snapshots the outgoing page and holds
       it visible until the new page is ready, so there's
       no white flash between reloads. Only the columns
       animate; the map, nav, and datetime bar stay put
       because their content is identical across tabs. On
       mobile, direction comes from a class on <html> seeded
       by the outgoing page via sessionStorage (present before
       VT captures the new snapshot); desktop ignores direction
       entirely (see the media query below).
       ══════════════════════════════════════════════ */
    @view-transition { navigation: auto; }

    /* Suppress the default root crossfade — columns handle motion */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    .col-left-slide { view-transition-name: ist-col-left; }
    .col-right-slide { view-transition-name: ist-col-right; }

    /* The browser's own view-transition-group animation interpolates this
       named box's size/position between the outgoing and incoming page's
       rect. Kahvehane's col-right (the stacked game tiles) sits at a
       different height/position than col-right on the other pages (news/
       events), so that automatic box-morph -- stacked on top of the slide
       keyframes below -- swung the outgoing snapshot across the wrong part
       of the screen mid-transition, on top of the fixed nav bar (the view-
       transition layer always paints above it regardless of z-index).
       Disabling it pins the group to the new page's rect immediately; the
       keyframes below do 100% of the visible motion. */
    ::view-transition-group(ist-col-left),
    ::view-transition-group(ist-col-right) {
      animation: none;
    }

    /* Desktop: left column always exits/enters via the left edge, right
       column via the right edge — independent of nav direction, so no
       html.vt-forward/vt-backward gate is needed here. */
    @media (min-width: 769px) {
      /* ist-col-left is now the right-hand track and ist-col-right the
         left-hand one (see the .col-left/.col-right grid-column swap
         above), so their exit/enter edges are swapped here too. */
      @keyframes ist-vt-col-left-exit { from { transform: translateX(0); } to { transform: translateX(100vw); } }
      @keyframes ist-vt-col-left-enter { from { transform: translateX(100vw); } to { transform: translateX(0); } }
      @keyframes ist-vt-col-right-exit { from { transform: translateX(0); } to { transform: translateX(-100vw); } }
      @keyframes ist-vt-col-right-enter { from { transform: translateX(-100vw); } to { transform: translateX(0); } }

      ::view-transition-old(ist-col-left) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-left-exit;
      }
      ::view-transition-new(ist-col-left) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-left-enter;
      }
      ::view-transition-old(ist-col-right) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-right-exit;
      }
      ::view-transition-new(ist-col-right) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-right-enter;
      }
    }

    @media (max-width: 768px) {
      @keyframes ist-vt-out-left { from { transform: translateX(0); } to { transform: translateX(-100vw); } }
      @keyframes ist-vt-in-left { from { transform: translateX(100vw); } to { transform: translateX(0); } }
      @keyframes ist-vt-out-right { from { transform: translateX(0); } to { transform: translateX(100vw); } }
      @keyframes ist-vt-in-right { from { transform: translateX(-100vw); } to { transform: translateX(0); } }


      html.vt-forward::view-transition-old(ist-col-left),
      html.vt-forward::view-transition-old(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-out-left;
      }
      html.vt-forward::view-transition-new(ist-col-left),
      html.vt-forward::view-transition-new(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-in-left;
      }
      html.vt-backward::view-transition-old(ist-col-left),
      html.vt-backward::view-transition-old(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-out-right;
      }
      html.vt-backward::view-transition-new(ist-col-left),
      html.vt-backward::view-transition-new(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-in-right;
      }
    }

    /* ── Small-phone overrides (≤ 400px, e.g. iPhone 15) ── */
    @media (max-width: 400px) {
      /* Tighten padding inside the narrower news/events columns */
      .sidebar-right-inner { padding: 6px 6px; }
    }

    /* ── News / event detail: opened as THE sheet (see sheet.css) —
       the same object a game, an article or a profile opens as, so its
       size, anchor and slide are not restated here.

       The one thing this page does differently is the box itself: there
       is exactly one visible box, not a gray outer sheet with a second
       white card nested inside it. The #anahane-detail-sheet override
       below gives the SHEET the white chapter-box border/background
       (swapping out frames.css's gray shared fill) plus a drop shadow
       lifting it off the map, and the card rule further down strips the
       inner .politician-detail's own border and background so it's just
       content sitting in the sheet's padding.

       On mobile the sheet is dragged rather than scrolled (initDetailPull,
       see the ≤768px block at the end of this stylesheet): native
       scrolling had no way to stop it from climbing over the profile
       card at the top of the page. */
    #anahane-detail-sheet {
      background: #fff !important;
      border: 2px solid var(--card-border-color, #1a1a1a) !important;
      border-bottom-width: 0 !important;
      box-shadow: var(--frame-shadow-strong) !important;
    }
    /* The card's own border/background are dropped inside the detail
       overlay -- #anahane-detail-sheet now carries that box itself, so
       the card is just its content sitting in the sheet's padding, not a
       second bordered box nested inside the first. */
    .detail-overlay-body .politician-detail {
      background: none;
      border: none;
      padding: 0;
    }

    /* Politician detail sheet -- opened from #politician-card (built by
       the shared politician-card.js). The site's usual card treatment
       (background/border/shadow), in a centered profile layout. */
    .politician-detail {
      background: var(--paper-card);
      border: 2px solid var(--card-border-color);
      border-bottom: 5px solid var(--card-border-color);
      padding: 24px;
      color: var(--card-fg);
      text-align: center;
    }
    .politician-detail-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid var(--card-border-color);
      background: var(--paper-dark);
      overflow: hidden;
      position: relative;
      margin: 0 auto 14px;
    }
    .politician-detail-name {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--card-fg-heading);
    }
    .politician-detail-title {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 2px;
      margin-bottom: 16px;
    }
    .politician-detail-row {
      text-align: left;
      font-size: 0.86rem;
      padding: 8px 0;
      border-top: 1px solid var(--rule);
    }
    .politician-detail-bio {
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.5;
      margin-top: 12px;
      white-space: pre-wrap;
    }
    /* A person's name mentioned inside news/event body text (see
       person-mentions.js) -- dotted rather than a solid underline so it
       doesn't read as an outbound link. If the person currently holds a
       title (data-tip), hovering/focusing reveals it in a small label
       above the name -- a quick "who is this" reminder, not the full
       .politician-detail sheet the seat cards above open. */
    .person-mention {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }
    .person-mention:hover,
    .person-mention:focus-visible {
      text-decoration-style: solid;
    }
    .person-mention[data-tip] {
      position: relative;
      cursor: help;
    }
    .person-mention[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--paper);
      padding: 4px 10px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      z-index: 5;
    }
    .person-mention[data-tip]:hover::after,
    .person-mention[data-tip]:focus-visible::after {
      opacity: 1;
    }

<script>
// Wrapped in a scoping IIFE so this page's top-level declarations (sb,
// districtNames, etc.) don't leak to the global scope -- a future
// client-side navigation may execute this same script a second time in a
// document that already ran another carousel page's script, and without
// this wrapper a repeated `const` at global scope throws a
// duplicate-declaration SyntaxError.
(function () {
// Shared client (see router.js) — no page may declare its own createClient
// anymore, so that a future client-side navigation can run more than one
// page's script in the same document without a duplicate-declaration crash.
const sb = IstRouter.sb;

// ── Auth State ──
// Loading screen (loading-screen.js) covers the page — including on a
// refresh while already logged in — until the real session check
// resolves, then either reveals the site or bounces to the sign-in page.
let authSession = null;
const resolveLoading = LoadingScreen.start(() => {
  if (!authSession) { window.location.href = 'index.html'; return; }
  showSite(authSession.user);
});

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  authSession = session || null;
  resolveLoading();
}

// Highlight home neighborhood: try metadata first, then profiles table
// (admin-created accounts may not have neighborhood in user_metadata --
// that fallback path is a real network round-trip).
let cachedHomeNeighborhood = null;
// home-map.js is deferred and this can run before it, so it is read
// through a getter rather than captured.
function homeMapModule() { return window.IstHomeMap || null; }
async function highlightHomeNeighborhood(user) {
  // Re-apply the last known highlight immediately (synchronously, before
  // any profiles-table fetch below) -- #ist-content's map is rebuilt
  // fresh on every mount and starts with no .home class, so without this
  // a revisit shows the map for a beat with no highlight, then fades it
  // in once the fetch resolves. That read as a visible flash; this makes
  // a revisit correct on the very first paint.
  if (cachedHomeNeighborhood) {
    const nbEl = document.getElementById(cachedHomeNeighborhood);
    if (nbEl) nbEl.classList.add('home');
    // Same reason, for the other half of the highlight: the map image
    // itself is part of #ist-content and comes back as the base map on
    // every mount (see home-map.js).
    if (homeMapModule()) homeMapModule().apply(cachedHomeNeighborhood);
  }
  let homeNb = user?.user_metadata?.yasadigi_ilce || user?.user_metadata?.neighborhood;
  if (!homeNb && user?.id) {
    const { data: profile } = await sb.from('profiles').select('neighborhood').eq('id', user.id).single();
    homeNb = profile?.neighborhood;
  }
  if (homeNb) {
    cachedHomeNeighborhood = homeNb;
    const nbEl = document.getElementById(homeNb);
    if (nbEl) nbEl.classList.add('home');
    // Districts with a hand-painted map get it here in place of the base
    // one; the rest keep the .home tint the class above applies.
    if (homeMapModule()) homeMapModule().apply(homeNb);
    const subEl = document.getElementById('user-nb-sublabel');
    if (subEl) subEl.textContent = districtNames[homeNb] || homeNb;
  }
}

// This page's repeatable "become the active page" work -- the part that
// re-runs on every virtual re-entry into anahane, not just the first real
// load (see showSite() below for the one-time login-gateway part: hiding
// the login overlay, mounting the profile card, the onboarding/mahalle-
// picker/admin-notification nudges).
function mount() {
  // #main-site's pointer-events lock (see its CSS) is only unlocked by
  // the .active class -- kutuphane/kahvehane don't need this (their
  // #main-site has no pointer-events:none to begin with), but anahane's
  // full-bleed map layer does. #main-site is one shared, persistent node
  // across virtual navigations, and its *live* CSS rules are whichever
  // page's stylesheet setActiveStylesheet last enabled -- so this has to
  // be reasserted on every entry into anahane, not just showSite()'s
  // one-time login-gateway run, or a virtual re-entry (which skips
  // showSite() entirely) leaves the nav bar and profile card inheriting
  // pointer-events:none with nothing to unlock it.
  document.getElementById('main-site').classList.add('active');
  // First: its cached-value pre-apply (see highlightHomeNeighborhood) has
  // to land before router.js's post-mount MapZoom.init runs, or that
  // call's forced layout read locks in a frame with no .home class and
  // the class arriving a moment later reads as a visible flash.
  highlightHomeNeighborhood(window.__currentUser);
  renderPoliticianCard(activeNeighborhood || 'istanbul');
  loadPersonMentionsRoster();
  wirePetekPill();
  // #library-card lives inside #ist-content, so a virtual re-entry into
  // this page (router.js's navigateTo) resets it back to its spinner
  // placeholder along with the rest of the swapped HTML -- unlike
  // #ist-pc-mount (outside #ist-content, kept alive via IstProfileCard.
  // setPage), this has to be re-mounted every time, not just once from
  // showSite() on the real page load. See the same fix on kahvehane.html.
  mountLibraryCardWhenReady();
}

// profile-card.js is deferred, so on a real page load a fast checkSession()
// can call mount() (and thus this) before it has executed, leaving
// #library-card stuck on its spinner placeholder forever since mount()
// only fires again on a later virtual re-entry -- poll briefly the same way
// tryOnb/loadPersonMentionsRoster do instead of silently skipping.
function mountLibraryCardWhenReady(tries) {
  if (window.IstProfileCard) {
    IstProfileCard.mountLibraryCard({ sb, I18N, icon: IstProfileCard.HOME_SVG });
  } else if ((tries === undefined ? 40 : tries) > 0) {
    setTimeout(() => mountLibraryCardWhenReady((tries === undefined ? 40 : tries) - 1), 60);
  }
}

// The PETEK button over the map opens the hane honeycomb (see
// openHiveOverlay in profile-card.js). Bound to the button itself, not to
// `document` -- the three carousel pages share one document (router.js),
// and the button lives inside #ist-content, so the binding leaves with the
// page and is made again on every re-entry (mount).
//
// The button is handed over as the page's `origin`: on a phone the
// honeycomb grows out of this very button rather than rising as a sheet
// from the bottom edge, so the page needs the box it comes out of.
function wirePetekPill() {
  const pill = document.getElementById('petek-pill');
  if (!pill) return;
  pill.addEventListener('click', () => {
    if (window.IstProfileCard) IstProfileCard.openHiveOverlay({ sb, I18N, origin: pill });
  });
}

// person-mentions.js is deferred -- poll briefly the same way tryOnb/
// tryMahallePicker above do, so a fast mount() on a slow connection
// doesn't silently skip the initial load.
let personMentionsRoster = [];
function loadPersonMentionsRoster(tries) {
  if (window.IstPersonMentions) {
    IstPersonMentions.loadPeople(sb).then(people => { personMentionsRoster = people; });
  } else if ((tries === undefined ? 40 : tries) > 0) {
    setTimeout(() => loadPersonMentionsRoster((tries === undefined ? 40 : tries) - 1), 60);
  }
}

function unmount() {
  // Nothing of this page's own to unwind any more: the news and the
  // events -- the only things here that ticked or re-rendered on a
  // language change -- moved to Kütüphane and Kahvehane respectively.
  // Kept as a registered hook so router.js has one to call, and so the
  // next thing that needs unwinding has somewhere to go.
}

async function showSite(user) {
  document.getElementById('login-overlay').style.display = 'none';
  // #main-site's .active toggle now lives in mount() (see its comment) --
  // showSite() calls mount() below regardless, so adding it here too
  // would just be a redundant duplicate.
  window.__currentUser = user;
  I18N.syncFromSupabase(sb, user.id);
  Palette.syncFromSupabase(sb, user.id);
  // Mount the shared mobile profile card. profile-card.js is deferred, so
  // wait until it's loaded (DOMContentLoaded guarantees that) — otherwise a
  // fast session check can beat the deferred script on mobile and the card
  // silently never mounts. #library-card's own mount happens in mount()
  // instead (see there for why), since showSite() only ever runs once, on
  // the real page load.
  function mountProfileCard() {
    if (window.IstProfileCard) {
      IstProfileCard.mount({ sb, I18N, page: 'anahane' });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountProfileCard);
  } else {
    mountProfileCard();
  }
  mount();

  // First-login onboarding: locks the page until the user completes the flow.
  // No-op if profiles.onboarded_at is already set. The script also resumes
  // mid-flow on kahvehane / kutuphane and the post-tour finale on anahane.
  // onboarding.js is `defer`red, so on a slow connection it may not be
  // ready yet when this runs — poll briefly until it lands. Tied to the
  // real login gateway, not repeated on later virtual re-entries.
  (function tryOnb(tries) {
    if (window.IstOnboarding) {
      IstOnboarding.maybeRun({ sb, user, page: 'anahane' });
    } else if (tries > 0) {
      setTimeout(() => tryOnb(tries - 1), 60);
    }
  })(40);

  // Post-login mahalle picker: independent of onboarding.js (which only
  // ever runs once, on first login) so it also reaches existing users
  // whose ilçe gained mahalle data after they already signed up. No-ops
  // on its own if the ilçe has no mahalle rows yet or one is already set.
  (function tryMahallePicker(tries) {
    if (window.MahallePicker) {
      MahallePicker.maybeRun({ sb, user });
    } else if (tries > 0) {
      setTimeout(() => tryMahallePicker(tries - 1), 60);
    }
  })(40);

  // Admin one-shot notification popup — mascot bubble, shown once per user.
  (function tryNotif(tries) {
    if (window.IstAdminNotification) {
      IstAdminNotification.show({ sb });
    } else if (tries > 0) {
      setTimeout(() => tryNotif(tries - 1), 60);
    }
  })(40);
}

// ── Sign In ──
document.getElementById('auth-submit-btn').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  const btn = document.getElementById('auth-submit-btn');

  if (!email || !password) { errEl.textContent = 'Lütfen tüm alanları doldurun.'; return; }

  btn.textContent = ''; btn.appendChild(Object.assign(document.createElement('span'), {className:'spinner'}));
  const result = await sb.auth.signInWithPassword({ email, password });
  btn.textContent = 'Giriş';

  if (result.error) {
    errEl.textContent = result.error.message;
  } else {
    showSite(result.data.user);
  }
});

['auth-email','auth-password'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('auth-submit-btn').click();
  });
});

// ── Toggle Sign In / Sign Up ──
document.getElementById('show-signup').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('signin-form').style.display = 'none';
  document.getElementById('signup-form').style.display = '';
  populateSignupDropdowns();
});

document.getElementById('show-signin').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('signup-form').style.display = 'none';
  document.getElementById('signin-form').style.display = '';
});

// ── District names (used by sign-up form) ──
const districtNames = {
  bakirkoy:'Bakırköy', bayrampasa:'Bayrampaşa', bahcelievler:'Bahçelievler',
  sisli:'Şişli', eyupsultan:'Eyüpsultan', gop:'Gaziosmanpaşa',
  esenler:'Esenler', bagcilar:'Bağcılar', basaksehir:'Başakşehir',
  kucukcekmece:'Küçükçekmece', sultangazi:'Sultangazi', uskudar:'Üsküdar',
  kadikoy:'Kadıköy', maltepe:'Maltepe', umraniye:'Ümraniye',
  cekmekoy:'Çekmeköy', beykoz:'Beykoz', sariyer:'Sarıyer',
  besiktas:'Beşiktaş', beyoglu:'Beyoğlu', gungoren:'Güngören',
  kagithane:'Kağıthane', atasehir:'Ataşehir', zeytinburnu:'Zeytinburnu', fatih:'Fatih'
};

// ── Sign Up ──
let signupBornInIstanbul = null;

function populateSignupDropdowns() {
  const options = Object.entries(districtNames)
    .sort((a, b) => a[1].localeCompare(b[1], 'tr'))
    .map(([id, name]) => `<option value="${id}">${name}</option>`)
    .join('');
  const livingSelect = document.getElementById('signup-living-district');
  const birthSelect = document.getElementById('signup-birth-district');
  if (livingSelect.options.length <= 1) livingSelect.innerHTML += options;
  if (birthSelect.options.length <= 1) birthSelect.innerHTML += options;
}

document.getElementById('signup-born-yes').addEventListener('click', () => {
  signupBornInIstanbul = true;
  document.getElementById('signup-born-yes').classList.add('selected');
  document.getElementById('signup-born-no').classList.remove('selected');
  document.getElementById('signup-birth-district-wrap').style.display = '';
});

document.getElementById('signup-born-no').addEventListener('click', () => {
  signupBornInIstanbul = false;
  document.getElementById('signup-born-no').classList.add('selected');
  document.getElementById('signup-born-yes').classList.remove('selected');
  document.getElementById('signup-birth-district-wrap').style.display = 'none';
});

document.getElementById('signup-submit-btn').addEventListener('click', async () => {
  const name = document.getElementById('signup-name').value.trim();
  const lastname = document.getElementById('signup-lastname').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const livingDistrict = document.getElementById('signup-living-district').value;
  const errEl = document.getElementById('signup-error');
  const btn = document.getElementById('signup-submit-btn');

  if (!name || !lastname || !email || !password) {
    errEl.textContent = 'Lütfen tüm alanları doldurun.'; return;
  }
  if (!livingDistrict) {
    errEl.textContent = 'Lütfen yaşadığınız ilçeyi seçin.'; return;
  }
  if (signupBornInIstanbul === null) {
    errEl.textContent = 'Lütfen İstanbul doğumlu olup olmadığınızı belirtin.'; return;
  }

  let dogumYeri = 'istanbul_disi';
  if (signupBornInIstanbul) {
    dogumYeri = document.getElementById('signup-birth-district').value;
    if (!dogumYeri) {
      errEl.textContent = 'Lütfen doğduğunuz ilçeyi seçin.'; return;
    }
  }

  btn.textContent = ''; btn.appendChild(Object.assign(document.createElement('span'), {className:'spinner'}));

  const result = await sb.auth.signUp({
    email,
    password,
    options: {
      data: {
        display_name: name + ' ' + lastname,
        first_name: name,
        last_name: lastname,
        yasadigi_ilce: livingDistrict,
        dogum_yeri: dogumYeri
      }
    }
  });

  btn.textContent = 'Kayıt Ol';

  if (result.error) {
    errEl.textContent = result.error.message;
  } else if (result.data.user) {
    showSite(result.data.user);
  }
});

['signup-name','signup-lastname','signup-email','signup-password'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('signup-submit-btn').click();
  });
});

// ── Map Interactions ──
const svg = document.querySelector('svg');

// A virtual navigation (see router.js) replaces #ist-content's whole
// subtree on every revisit to this page, including the map's SVG
// -- so the actual .neighborhood elements are different DOM nodes each
// time. Delegating on `document` (never itself replaced) and re-querying
// fresh each time, instead of binding per-node listeners once, keeps map
// clicks/hover working after any number of navigate-away-and-back trips.
function getNeighborhoods() { return document.querySelectorAll('.neighborhood'); }

// Currently-selected district. null means nothing is selected, and the
// seat card falls back to İstanbul's Büyükşehir Belediye Başkanı.
let activeNeighborhood = null;

// Resolve what the map label should currently read when nothing is
// being hovered: the active neighborhood's name, or 'İstanbul'.
function baseMapLabel() {
  if (!activeNeighborhood) return 'İstanbul';
  const active = document.getElementById(activeNeighborhood);
  return (active && active.getAttribute('data-name')) || activeNeighborhood;
}

// ── Politician card (top-right, desktop) ───────────────────────
// Mirrors #library-card at the top-left: the İstanbul Büyükşehir Belediye
// Başkanı by default, swapped for the clicked district's Belediye Başkanı.
// Backed by two tables (see db/politicians.sql) so a person's data (name,
// avatar, bio) is independent of which seat, if any, they currently hold:
//   public.politicians     — the people roster
//   public.political_seats — id ('istanbul' or a neighborhood id) ->
//                            politician_id + title
// Nothing here is hardcoded, since officeholders change. Fetched once and
// cached for the session by the shared module (IstPoliticianCard.seats) --
// they rarely change, and Kütüphane swaps its own seat off the very same
// table, so there is one cache rather than one per page. That also matters
// mechanically: both page scripts end up in the one document router.js
// keeps, and two top-level `let`s of the same name there is a SyntaxError
// that takes the second page's whole script with it.

// The card and its detail view are drawn by the shared module
// (politician-card.js) -- the same markup kahvehane and kütüphane print,
// so a politician looks the same wherever you meet one. What stays here
// is the part that is genuinely anahane's: which seat is showing follows
// the district selection on the map. Kütüphane does the same with the
// countries on its phone map; Kahvehane has one fixed seat.
async function renderPoliticianCard(seatId) {
  const byId = await IstPoliticianCard.seats(sb);
  const id = seatId || 'istanbul';
  const seat = byId[id];
  const seatLabel = id !== 'istanbul' ? (districtNames[id] || id) : 'İstanbul';
  // render() paints both of the seat's surfaces -- the desktop card here in
  // col-right and the phone's slot in the profile bar -- and wires this
  // page's openDetail to each. The click is bound to those elements, never
  // delegated on document: #politician-card exists on all three carousel
  // pages, and a document-level listener would survive a virtual navigation
  // (see router.js) and keep firing on the other pages' cards, opening
  // anahane's sheet on top of theirs.
  IstPoliticianCard.render({ mountElId: 'politician-card', seat, seatLabel, openDetail });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

document.addEventListener('click', (e) => {
  const nb = e.target.closest('.neighborhood');
  // Only clicks inside the map itself should clear the selection
  // (tapping the sea/background to deselect) -- this used to match ANY
  // click anywhere on the page that wasn't precisely on a district
  // shape, so tapping a card or the nav bar silently cleared it.
  if (!nb) {
    // The PETEK pill sits inside the map panel but is not part of the
    // map: pressing it opens the honeycomb, it doesn't deselect a
    // district (same guard Kahvehane gives its Kahve Endeksi pill).
    if (!e.target.closest('.map-panel') || e.target.closest('.petek-pill')) return;
    getNeighborhoods().forEach(n => n.classList.remove('active'));
    document.getElementById('map-label').textContent = 'İstanbul';
    if (activeNeighborhood !== null) {
      activeNeighborhood = null;
      renderPoliticianCard('istanbul');
    }
    return;
  }
  // data-neighborhood covers multi-polygon districts (e.g. Şişli's
  // exclave piece) whose element id must stay unique but which still
  // count as the same neighborhood for active-state purposes.
  const nbId = nb.dataset.neighborhood || nb.id;
  getNeighborhoods().forEach(n => n.classList.toggle('active', (n.dataset.neighborhood || n.id) === nbId));
  const name = nb.getAttribute('data-name') || nbId;
  document.getElementById('map-label').textContent = name;
  activeNeighborhood = nbId;
  // The selection now drives one thing on this page: which seat the
  // profile bar names. The news and the events it used to filter live on
  // Kütüphane and Kahvehane.
  renderPoliticianCard(nbId);
});
document.addEventListener('mouseover', (e) => {
  const nb = e.target.closest('.neighborhood');
  if (!nb) return;
  document.getElementById('map-label').textContent = nb.getAttribute('data-name') || nb.id;
  const nbId = nb.dataset.neighborhood || nb.id;
  getNeighborhoods().forEach(n => n.classList.toggle('hover-active', (n.dataset.neighborhood || n.id) === nbId));
});
document.addEventListener('mouseout', (e) => {
  const nb = e.target.closest('.neighborhood');
  if (!nb || nb.contains(e.relatedTarget)) return;
  document.getElementById('map-label').textContent = baseMapLabel();
  getNeighborhoods().forEach(n => n.classList.remove('hover-active'));
});


// Detail overlay: a bottom sheet for whatever this page opens full-size --
// a politician's page (see politician-card.js) or a person mentioned by
// name. Mirrors Kahvehane's game overlay / Kütüphane's reader overlay.
// The phone pull handler (IstSheet.pull, assigned below). Opening and
// closing need nothing from it, since IstSheet drives it itself.
let detailPull = null;
function openDetail(html) {
  const overlay = document.getElementById('anahane-detail');
  const body = document.getElementById('anahane-detail-body');
  if (!overlay || !body) return;
  body.innerHTML = html;
  if (window.IstPersonMentions) IstPersonMentions.linkify(body, personMentionsRoster);
  // The sheet's body is the scroll container on desktop (see sheet.css) --
  // reset so a tall card left scrolled from a previous open doesn't reopen
  // mid-scroll. IstSheet.open does the same for the phone pull.
  body.scrollTop = 0;
  IstSheet.open(overlay);
}
function closeDetail() {
  const overlay = document.getElementById('anahane-detail');
  if (!overlay) return;
  IstSheet.close(overlay);
}
(function initDetailOverlay() {
  const overlay = document.getElementById('anahane-detail');
  const backdrop = document.getElementById('anahane-detail-backdrop');
  const closeBtn = document.getElementById('anahane-detail-close');
  const body = document.getElementById('anahane-detail-body');
  if (!overlay || !backdrop || !closeBtn || !body) return;
  backdrop.addEventListener('click', closeDetail);
  closeBtn.addEventListener('click', closeDetail);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeDetail();
  });
})();

// The pull is the shared sheet's (see IstSheet.pull in sheet.js) — the
// same gesture Kütüphane's reader opens with, so a politician and the
// meclis behave identically in the hand.
detailPull = IstSheet.pull('anahane-detail', { onDismiss: closeDetail });

// ── Init ──
// Skipped when this script is being injected by a virtual navigation
// (see router.js's navigateTo) -- that path calls the registered mount()
// directly instead, since the user's already authenticated and the
// profile card's already mounted from the real page load that got them
// into the app in the first place.
if (!window.__istVirtualNavInjecting) checkSession();

// Another member's profile: one sheet for the whole site (see
// openMemberSheet in profile-card.js). This page prints no member links
// of its own yet, but wiring it here means one will work the day it does
// -- and that the sheet is the same object it is everywhere else.
// profile-card.js is deferred, so this waits for it rather than reaching
// for it mid-parse.
(function wireMemberSheet() {
  const wire = () => { if (window.IstProfileCard) IstProfileCard.initMemberSheet({ sb, I18N }); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();

IstRouter.registerPage('anahane', { mount, unmount });
})();
</script>
