  <!-- Swipe pagination: pre-body, set initial offscreen state so columns don't flash at origin before sliding in. Also seeds the VT direction class so the cross-document transition knows which way to slide before it captures the snapshot, and a one-shot flag (read by the other two pages' own card-entrance animations) so a feed's cards don't animate in on their first run here -- the column itself is already sliding in from the same edge, so animating the cards inside it too would look like the content arriving twice.
       ist-entering-* (the manual transform-transition fallback) is only for browsers WITHOUT View Transitions support -- on VT-capable browsers the native cross-document transition already slides the column in as a snapshot, so also applying the fallback class made the real DOM run its own second, independent slide underneath once DOMContentLoaded released it mid-transition, producing a visible double entrance. vt-* (which drives the VT pseudo-element keyframes) is unaffected and still always seeded. -->
  <script>
    (function(){
      try {
        var _d = sessionStorage.getItem('ist-page-enter-dir');
        if (_d) {
          var _vt = ('startViewTransition' in document) && !window.Capacitor;
          if (!_vt) document.documentElement.classList.add('ist-entering-' + _d);
          document.documentElement.classList.add('vt-' + _d);
          window.__istSuppressFirstCardAnim = { left: true, right: true };
        }
      } catch(e) {}
    })();
  </script>

  <style data-page="anahane">
    :root {
      /* Core ink & paper — cool cream newspaper palette */
      --paper: #eddbd0;       /* main canvas + sidebar columns — lightest */
      --paper-warm: #eddbd0;  /* sidebar column background — lightest */
      --paper-card: rgba(255, 255, 255, 0.85);  /* news + event cards — white, mostly opaque over the map photo */
      /* Card text stays dark; hover just lightens the background a
         touch. Full detail (sources / RSVP) opens in the bottom sheet
         instead of flipping the card's own colors in place. */
      --card-fg: #1a1a1a;
      --card-fg-heading: #1a1a1a;
      --card-fg-muted: #4a4a4a;
      --card-border: rgba(26, 26, 26, 0.2);
      --card-border-soft: rgba(26, 26, 26, 0.15);
      --card-border-color: #1a1a1a;
      --paper-banner: #c9ae9a;/* sidebar header bars — darker */
      --paper-navbar: #b89b7f;/* top nav bar — darkest */
      /* RGB triplets for the floating map panels (need alpha, so they
         can't just reference the hex vars above). Overridden alongside
         everything else in palette.css for data-palette="mono". */
      --paper-warm-rgb: 237, 219, 208;
      /* Warm neutrals */
      /* Newspaper accents */
      /* Semantic aliases */
      --success: var(--accent-2);
      /* Border shortcuts */
    }

    /* Cards that float over the map photo keep one fixed look (white,
       mostly opaque) regardless of the earth/mono palette toggle — same
       reasoning as the fixed --card-fg text colors. This overrides
       palette.css's mono --paper-card just for this page. */
    :root[data-palette="mono"] {
      --paper-card: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }

    /* ── LOGIN OVERLAY ── */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(237, 229, 208, 0.98);
      backdrop-filter: blur(3px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    #login-overlay .masthead-login {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-weight: 400;
      font-size: 2.4rem;
      letter-spacing: 0.5px;
      color: var(--ink);
      margin-bottom: 48px;
    }

    #login-overlay .tagline {
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .login-box {
      border: 2px solid var(--ink);
      padding: 36px 40px;
      width: 360px;
      background: var(--paper);
      position: relative;
    }

    .login-box::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid var(--ink);
      pointer-events: none;
    }

    .login-box h2 {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: var(--col-border);
    }

    .login-box input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      border: 1px solid var(--ink);
      background: var(--field-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }

    .login-box input:focus {
      border-color: var(--accent);
    }

    .login-box button {
      width: 100%;
      padding: 11px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-box button:hover { background: var(--accent); }

    .login-box .error-msg {
      color: var(--accent);
      font-size: 0.82rem;
      text-align: center;
      margin-bottom: 10px;
      min-height: 18px;
      font-style: italic;
    }

    .form-toggle {
      font-size: 0.8rem;
      text-align: center;
      margin-top: 14px;
      color: var(--muted);
    }
    .form-toggle a {
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
    }
    .form-toggle a:hover { text-decoration: underline; }

    .q-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
      margin-top: 10px;
      text-align: left;
    }

    .q-buttons-inline {
      margin-bottom: 10px;
      justify-content: flex-start;
    }

    .q-btn-sm, .q-btn-sm-outline {
      padding: 7px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    .q-btn-sm {
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--ink);
    }
    .q-btn-sm.selected {
      background: var(--ink);
      color: var(--paper);
    }
    .q-btn-sm-outline {
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--ink);
    }
    .q-btn-sm-outline.selected {
      background: var(--ink);
      color: var(--paper);
    }

    /* ── MAIN SITE ──
       Desktop: a real CSS Grid (matches kahvehane/kutuphane's body grid)
       -- 260px/1fr/260px columns, auto/1fr rows. The map is a fixed
       full-bleed background layer that escapes the grid entirely
       (z-index -1); the top nav and both sidebars are frameless grid
       items floating over it. Mobile keeps its own stacked layout,
       redeclared wholesale inside its own @media block below. */
    #main-site {
      pointer-events: none;
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }

    #main-site.active {
      pointer-events: auto;
    }

    /* Top nav, both side columns, and main are frameless -- just typography
       on the page's own paper. frames.css still targets these classes/tag
       with !important (including `main`, shared with kahvehane/kutuphane
       where it IS a card), so beat it with an #main-site-qualified
       override (higher specificity, wins regardless of stylesheet
       order). */
    #main-site .section-rule,
    #main-site .col-left,
    #main-site .col-right,
    #main-site main {
      background: none !important;
      box-shadow: none !important;
      border: none !important;
    }

    .section-rule {
      grid-column: 1 / -1;
      grid-row: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 28px 10px 28px;
      /* Above main, whatever main happens to carry. */
      z-index: 1;
    }

    header {
      display: flex;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 32px;
    }
    nav a {
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: color 0.2s;
      padding: 2px 0;
    }
    nav a:hover { color: var(--ink); }
    nav a.active { color: var(--ink); font-weight: 700; }

    .col-left {
      /* Swapped to the right-hand grid track: the library card (top of
         .col-left) sits top-right, the events feed's counterpart (top of
         .col-right) sits top-left -- see the matching swap of the
         slide-direction rules below, which keep exit/enter animations
         honest about which edge each column now actually borders. */
      grid-column: 3;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Wraps everything in .col-left except #library-card, so the profile
       card can be excluded from the column's slide/view-transition
       animation below and stay visually still while switching pages. */
    .col-left-slide {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .col-left .nb-highlight {
      padding: 9px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      background: transparent;
      color: var(--muted);
      text-align: left;
      font-style: italic;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      flex-shrink: 0;
    }
    .col-right {
      grid-column: 1;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    /* Mirrors .col-left-slide -- the column's own sliding contents during
       the slide/view-transition animations below. */
    .col-right-slide {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    /* #library-card sits on the same 14px line the feeds below it are
       printed on, so it lines up with its column's own inset. */
    #library-card {
      margin-left: 14px;
      margin-right: 14px;
    }

    /* Bottom corner cards -- mirror the top profile cards' pinned
       position/style but sit at the bottom of each column instead of the
       top; buttons will be added inside these later. Sibling of
       .col-left-slide/.col-right-slide (not inside it) so they stay put
       while the news/events feed above scrolls, exactly like
       #library-card stays put at the top. */
    .corner-card {
      border: 2px solid var(--ink);
      border-bottom: 5px solid var(--ink);
      margin: 12px 14px;
      padding: 12px 14px;
      min-height: 44px;
      background: color-mix(in srgb, var(--paper) 85%, transparent);
      flex-shrink: 0;
    }

    main {
      grid-column: 2;
      grid-row: 2;
      display: block;
      overflow: hidden;
      /* The petek stands in this cell and fills it. Nothing here is a
         window onto a fixed backdrop any more, so main is a plain grid
         item again: the stacking context and the pointer-events:none
         that used to be here existed only to keep the full-bleed map
         layer behind everything and still clickable. */
      min-height: 0;
    }

    /* ── THE PETEK PAGE ──
       Hane is the petek: the grid fills the middle cell, and the reader
       pulls up and down through its three depths inside it (see
       HIVE_LEVELS in profile-card.js). Everything about how it is drawn
       — the cell size, the packing, the window it is scaled into, the
       levels — belongs to .ist-hive-page in profile-card.css, which is
       one implementation rather than a geometry this page restates. All
       that is this page's own is the cell it stands in. */
    .petek-page {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-right-inner {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nb-articles {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nb-article {
      border-left: 3px solid #4C4C4C;
      padding-left: 6px;
    }

    .nb-article h4 {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .nb-article p {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 1px;
      line-height: 1.2;
    }

    .no-articles {
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--muted);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Events (left column) ──
       The column beside the petek (see renderEventsNow in the script
       below). It spent a while on Kahvehane, in the space the
       neighborhood comments used to hold, and came back with that
       column's styling -- same box, same flex chain -- when the Kahve
       Endeksi took the column there. */
    .events-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      min-height: 0;
      /* .event-grow-page is positioned against this box, not the
         viewport -- it fills exactly the events column's own space,
         below the petek, never over it. On the phone that box is a
         fixed height (--hane-events-h on .col-left), so the room a card
         grows into is simply the room the column always has: nothing is
         forced open while a card is standing and nothing has to be
         cleared afterwards. It used to be an inline min-height set for
         as long as a card was open -- and a single missed cleanup left
         the column holding a third of the screen with nothing drawn in
         it, which pushed the petek off centre with no visible cause.

         It replaces reserving the band the moment the column has a card
         in it: that kept a press from moving the petek, but left the
         reader's own position a function of how many things were on. A
         box that is the same size on every night is the same fix,
         extended to the nights themselves. */
      position: relative;
    }
    #events-panel {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 16px 14px;
    }
    /* Only the middle depth of the petek is about who is standing beside
       the reader, which is the whole reason a kept event's verdict is
       worth showing at all (see paintHiveEventMarks) -- at the other
       two depths the column has nothing to say. Keyed on the OFF class
       (applyHiveLevel sets ist-hive-offmid at levels 0 and 2), never on
       :not(.ist-hive-mid): the default with no class at all has to be
       VISIBLE. A column hidden because a class never landed is
       indistinguishable from a column with nothing in it -- which is
       exactly how it read on a phone: a reserved band of bare paper
       under the petek, with the frame and the cards standing in it
       unseen. visibility:hidden, not
       display:none: .col-left sits in an auto-sized grid row on the
       phone (grid-area: events), so display:none would collapse that
       row's height and hand the freed space to the petek's own row
       (minmax(0,1fr)) -- which is exactly what moved the petek itself a
       few dozen px between levels (its box got taller/shorter, so its
       centred reader moved with it) instead of leaving it standing
       still while only what's around it changes. visibility:hidden
       keeps the row's height (and the petek's) constant across every
       level. */
    html.ist-hive-offmid .events-section { visibility: hidden; }
    /* The page a kept card grows into. Its box is measured onto the
       cards' own content box when it opens (measureEventGrowBand), the
       same way Kütüphane's news page is measured onto its feed's --
       inset:0 here is the frame before that measurement lands, and the
       desktop fallback. It never changes anything in the layout: the
       events column reserves its band the moment it has a card in it
       (see renderEventsNow), so the petek above stands exactly where it
       stood before the press. */
    .event-grow-page {
      position: absolute;
      inset: 0;
      z-index: 2;
      /* Two layers, and it has to be two: --paper-card is deliberately
         translucent on this page (white at 85%, from the days the cards
         floated over a map photo), and this page now stands OVER the
         petek -- one translucent layer and the reader's own honeycomb
         reads straight through the event they just opened. The card's
         own tint composited onto the page's paper is the same colour it
         has always been, and opaque. */
      background-color: var(--paper);
      background-image: linear-gradient(var(--paper-card), var(--paper-card));
      border: 2px solid var(--card-border-color);
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .event-grow-page[hidden] { display: none; }
    .event-grow-page-inner {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }
    /* ── head / body / foot, and only the middle moves ──
       The same three-part page a story opens as on Kütüphane: what this
       is (and the way back out) on the top line, the event scrolling in
       the middle, and the RSVP row on the bottom line where it cannot
       scroll away. */
    .ev-page-head {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--rule);
    }
    /* The same hand-drawn arrow every page inside a reader wears -- the
       reader arrived by touching a card, so the way back out is the
       drawing, not a word. */
    .ev-page-back {
      flex: none;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; padding: 0; cursor: pointer;
      transition: opacity 0.15s;
    }
    .ev-page-back:hover { opacity: 0.6; }
    .ev-page-back img { width: 24px; height: 24px; display: block; }
    .ev-page-head .ev-kicker { flex: 1; min-width: 0; margin-bottom: 0; }
    .ev-page-when {
      flex: none;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 11px;
      color: var(--muted);
    }
    .ev-page-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 14px 16px 16px;
    }
    .ev-page-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      text-wrap: balance;
      margin: 0 0 8px;
      color: var(--ink);
    }
    .ev-page-body .ev-meta { margin-bottom: 12px; }
    .ev-page-body .ev-desc {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--ink);
    }
    .ev-page-foot {
      flex: none;
      padding: 10px 16px;
      border-top: 1px solid var(--rule);
      background: var(--frame-bg);
    }
    /* The mini card behind the grown one, gone from the drawing while it
       is standing in for it -- same move Kütüphane's own .news-open and
       Kahvehane's own .ev-open make. */
    .event-item.event-grow-open { visibility: hidden; }

    .event-item {
      display: grid;
      grid-template-columns: 38px 1fr;
      column-gap: 10px;
      padding: 14px 16px 14px 14px;
      margin-bottom: 12px;
      /* Opaque, for the same reason the grown page is (see there): the
         strip these stand in is laid over the foot of the petek. */
      background-color: var(--paper);
      background-image: linear-gradient(var(--paper-card), var(--paper-card));
      border: 2px solid var(--card-border-color);
      border-bottom: 5px solid var(--card-border-color);
      transition: background 0.15s, transform 0.15s ease;
    }
    .event-item:last-child { margin-bottom: 0; }
    /* The reader has a city with things on in it and has kept none of
       them yet -- the same dashed frame the decks on the other two pages
       end with, saying where the deck is rather than apologising for an
       empty column. */
    .events-empty {
      padding: 16px 12px;
      text-align: center;
      border: 2px dashed var(--rule);
      background: transparent;
      box-sizing: border-box;
      /* It fills the column rather than sitting in it: the column is a
         fixed box on the phone (see .col-left below), and a frame that
         only wrapped its own two lines would leave bare paper between
         itself and the petek -- which is the very thing the frame is
         there to stop. */
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .events-empty-line {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink);
    }
    .events-empty-sub {
      margin-top: 3px;
      font-size: 0.72rem;
      font-style: italic;
      color: var(--muted);
    }
    /* ── Set like Kahvehane's own event cards ──
       Same object on both pages: what the reader threw right over there
       is what stands here. The type scale, the weights and the ink are
       that page's (.ev-card / .event-page-* in kahvehane.html) rather
       than a second set of numbers -- and the ink is --ink/--muted, so
       it follows the palette instead of the fixed dark that these cards
       carried from the days they floated over a map photo (which, on the
       dark theme, was dark text on a dark card). */
    .event-item .ev-date-block {
      text-align: center;
      padding-top: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      color: var(--ink);
    }
    .event-item .ev-day {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1;
    }
    .event-item .ev-mon {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }
    .event-item .ev-wd {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
      opacity: 0.75;
    }
    .event-item .ev-body { min-width: 0; }
    .event-item .ev-kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--ink-red);
      margin-bottom: 2px;
    }
    .event-item .ev-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0;
      color: var(--ink);
    }
    .event-item .ev-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--muted);
      line-height: 1.4;
    }
    .event-item.openable { cursor: pointer; }
    /* Plain hover only, for a mouse -- a lighter background, no nudge.
       Tapping the card grows it in place instead (see
       openEventGrowPage/.event-grow-page), so there is no lingering
       "pressed" look to hold once the tap has already answered. */
    /* A mouse only. `:hover` sticks after a tap on iOS, so on a phone
       this left the card the reader had just opened and closed sitting
       grey in the strip with no way to clear it -- the same reason
       Kütüphane's cards press with pointer events rather than :hover. */
    @media (hover: hover) and (pointer: fine) {
      .event-item.openable:hover { background: #e8e8e8; }
    }
    /* Only ever rendered inside the detail sheet (see buildEventDetailHtml)
       -- the column's preview card doesn't include it. */
    .event-item .ev-details {
      grid-column: 1 / -1;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--card-border);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--card-fg);
    }
    .event-item .ev-desc { margin-bottom: 10px; }
    .detail-overlay-body .event-item { max-width: 520px; margin: 0 auto; }
    .ev-rsvp-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ev-rsvp-btn {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 7px 14px;
      background: transparent;
      color: var(--ink-red);
      border: 1px solid var(--ink-red);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .ev-rsvp-btn:hover { background: rgba(185, 54, 49, 0.15); }
    .ev-rsvp-btn.attending {
      background: var(--ink-red);
      color: #1a1a1a;
    }
    .ev-rsvp-btn.attending:hover { opacity: 0.85; }
    .ev-rsvp-btn:disabled { opacity: 0.6; cursor: default; }
    .ev-rsvp-count {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    .ev-attendees {
      display: flex;
      align-items: center;
    }
    /* Preview-card attendee stack: shown under the title on every
       breakpoint, in the space the compact card otherwise leaves empty.
       The detail sheet's .ev-attendees (inside .ev-rsvp-row) is
       unaffected since it isn't matched by this class. */
    .ev-attendees-preview {
      display: flex;
      margin-top: 10px;
    }
    .ev-attendees-preview:empty { display: none !important; }
    .ev-attendee-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--paper-dark);
      border: 1.5px solid var(--paper-card, #fff);
      box-shadow: 0 0 0 1px var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--accent);
      overflow: hidden;
      margin-left: -8px;
    }
    .ev-attendee-avatar:first-child { margin-left: 0; }
    .ev-attendee-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .ev-attendee-avatar.ev-attendee-more {
      font-size: 0.56rem;
      color: var(--card-fg-muted);
    }

    /* ── MOBILE RESPONSIVE ──
       Stacked flow instead of desktop's floating-over-fullscreen-map
       layout: the map sits at the very top like a hero banner with the
       profile card floating over its empty/sea-colored band (same
       #f7f7f7 as the map artwork's own background, so the card reads as
       part of the map rather than a stacked box), then an events/news
       column pair below, all scrolling in #main-site itself, with the
       tab bar pinned fixed at the very bottom (its <header> already
       escapes to the viewport via position:fixed regardless of where
       .section-rule sits). */
    @media (max-width: 768px) {
      html, body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        width: 100%;
      }

      #login-overlay .masthead-login { font-size: 2rem; }
      .login-box { width: 90vw; max-width: 360px; padding: 24px 20px; }
      .q-buttons-inline { display: flex; gap: 8px; }

      #main-site {
        position: relative;
        height: 100%;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
        display: grid;
        grid-template-columns: 1fr 1fr;
        /* One row, and the events are laid OVER its foot rather than
           taking a row of their own (see .col-left below). */
        grid-template-areas: "hero hero";
        /* Row 1 is the petek and it takes everything that is left; row 2
           is the events and takes only what its own cards need.
           The other two pages' hero is a map -- a square drawing, so it
           gets a square. This page's hero is the petek, which is not a
           picture of a fixed size but a shape that grows, and the reader
           stands at the middle of it: pinning it to the map's square left
           the middle of the drawing at the middle of a box in the top
           third of the screen, with dead paper under it whenever there
           were no events on. So the petek is measured from what is left
           after the events rather than from the map's geometry, and with
           nothing on tonight it is the whole band between the two bars —
           which is where the reader's own avatar then sits, dead centre
           of the screen. */
        grid-template-rows: minmax(0, 1fr);
        /* The strip the events stand in, resting and opened (see
           .col-left below). Resting it is one preview card with a little
           air around it; opened it is what one card's date, title,
           description and RSVP row need to be read in -- and no more
           than that, because it opens UPWARD over the petek's own
           window: the drawing is lifted clear of it (--ist-hive-lift in
           profile-card.css), and every pixel this number grows is a
           pixel the reader has to be lifted by. */
        --hane-events-h: 90px;
        --hane-events-open-h: min(23vh, 185px);
        /* Both handed to the petek, which does different things with
           them (see fitHive in profile-card.js): the drawing is fitted
           small enough to clear the OPENED box, and stands centred in
           what the RESTING strip leaves -- which is where it is nearly
           all the time. Handed over rather than restated, so a card can
           never grow past what the drawing was moved out of the way of. */
        --ist-hive-reserve: var(--hane-events-open-h);
        --ist-hive-reserve-rest: var(--hane-events-h);
        /* frames.css's gap (row + column) exposed a sliver of the raw
           page canvas (--page-bg, warm beige/mono gray) directly under
           the map -- a different color from the map's own #f7f7f7,
           breaking the edge-to-edge look right where it's most visible.
           Zero the row gap so the map's bottom edge sits flush against
           the content below it; the column gap (between events/news)
           is kept, just halved below. */
        row-gap: 0 !important;
        /* Halved for the same reason it is on the other two pages -- the
           full gap reads as too much breathing room between columns.
           Nothing sits beside the events here, but the track is what the
           carousel slides, so the geometry stays theirs. */
        column-gap: calc(var(--frame-gap) / 2) !important;
        /* Clears the fixed bottom tab bar so the last row of cards isn't
           hidden behind it. */
        padding-bottom: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom) + 16px);
      }

      /* The petek fills everything between the two bars. It bleeds past
         #main-site's own left/right frame padding (frames.css) so the
         grid has the true screen width to be drawn in, and starts on the
         same line every other page's content does (--map-hero-top, the
         room under the profile bar) so swiping between the three pages
         doesn't shift what is under the bar. */
      main {
        grid-area: hero;
        position: static;
        min-height: 0;
        overflow: hidden;
        margin-left: calc(-1 * var(--frame-pad, 10px));
        margin-right: calc(-1 * var(--frame-pad, 10px));
        /* The map used to start on --map-hero-top and run *under* the
           profile bar: it is scenery, and a bar floating over scenery is
           the point. The petek is not scenery -- it is the page -- so it
           starts below the bar instead. The row it stands in keeps the
           hero square's own height either way, so the events below still
           begin on exactly the line Kahvehane's and Kütüphane's columns
           do and swiping between the three shifts nothing. */
        margin-top: calc(var(--navbar-h-top, 56px) + env(safe-area-inset-top) + 6px);
        box-shadow: none !important;
      }

      /* The petek's outermost depth is the whole shape, and the shape
         is bigger than the row it stands in — so at that depth the
         drawing is let out of its window (see .ist-hive in
         profile-card.css) and this cell has to let it past too, or the
         clip simply moves one box outward and the honeycomb still stops
         short of the screen. Only the clip is lifted: the row keeps its
         height, so the reader stays exactly where they were standing.
         The events column paints over it either way (it carries a
         z-index of its own), and is invisible at this depth anyway. */
      html.ist-hive-all main,
      html.ist-hive-all .petek-page { overflow: visible; }

      /* The profile bar (#ist-pc-mount) is the fixed top bar — the
         counterpart of the tab bar at the bottom. Its geometry and colors
         are in profile-card.css, one implementation for all three pages;
         nothing about it is page-specific, so nothing about it is restated
         here. It used to be a light card floating over the map's top
         (empty/sea) band, which each of the three pages spelled out again
         in its own mobile query. */

      /* Capacitor's WKWebView reports env(safe-area-inset-top) as 0 for a
         real (measured, ~80-200ms) window after every fresh page load
         before self-correcting on its own -- with no gating, the card
         renders flush under the status bar/notch for that window,
         covering the map's top districts. safe-area-ready.js removes
         this class once the real value is confirmed (or after a
         timeout), so the card and map simply appear already in the
         right place instead of visibly jumping. */
      html.ist-safe-area-pending #ist-pc-mount,
      html.ist-safe-area-pending main {
        visibility: hidden;
      }
      /* .section-rule no longer renders a floating masthead bar -- its
         only visible content (the tab nav) is pulled out via the
         <header> position:fixed rule below and pinned to the viewport
         bottom regardless of where this sits. Taken out of grid flow so
         it doesn't claim a row of its own. */
      .section-rule {
        grid-area: auto;
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        padding: 0;
        overflow: visible;
      }

      /* Events fill .col-left's height exactly; min-height:0 lets
         #events-panel below shrink to fit rather than overflowing the
         fixed column. */
      .events-section {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: visible;
      }
      /* ── One evening at a time, and you slide between them ──
         The strip is one card tall (see .col-left), so a stack in it
         could only ever be a scroller with a card and a half showing --
         a list you read half of. It is a row instead: one whole card
         fills the strip, and the next one is a swipe to the side, the
         way every other stack of cards on this app is dealt. Native
         scroll-snap does it, so the gesture is the platform's own --
         momentum, rubber-band, the lot -- and there is no drag handler
         here to fight the carousel's.
         8px side padding (on top of #main-site's own 10px frame padding)
         puts the cards on the shared 18px screen inset -- the same line
         the comments used to hold and the game tiles still do. */
      #events-panel {
        padding: 6px 8px 10px;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        /* The page carousel is one swipe away in the same direction
           (router.js listens on the document), so a slide that runs off
           the end of this strip must not become a page change. The
           listener is stopped in JS as well -- see wireEventStripSwipe;
           this is the scroll half of the same rule. */
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      #events-panel::-webkit-scrollbar { display: none; }
      /* Each card is the strip: a whole one, never a peek at the next.
         flex-basis 100% against a row that may hold ten of them, so they
         must not shrink either. */
      #events-panel > * {
        flex: 0 0 100%;
        min-width: 0;
        margin: 0;
        scroll-snap-align: center;
        overflow: hidden;
      }
      /* With more than one kept evening the cards give up a strip of
         their width so the next one shows at the edge. Nothing else on
         this page says there is another card to the side -- the strip is
         one card tall and there is no room in it for dots -- and a
         carousel nobody knows is a carousel is a list with one item in
         it. A single card (or the frame on an empty night) keeps the
         full width: there is nothing to peek at, and 26px of bare paper
         beside it would just read as a mistake. */
      #events-panel:has(> :nth-child(2)) > * { flex-basis: calc(100% - 26px); }
      .event-item {
        grid-template-columns: 30px 1fr;
        column-gap: 8px;
        padding: 8px 9px;
        align-content: center;
      }
      .event-item .ev-date-block { padding-top: 2px; }
      .event-item .ev-day { font-size: 1.05rem; line-height: 1; }
      .event-item .ev-mon { font-size: 0.5rem; margin-top: 2px; }
      .event-item .ev-wd { font-size: 0.46rem; margin-top: 1px; }
      .event-item .ev-kicker { font-size: 9px; letter-spacing: 1.5px; margin-bottom: 2px; }
      .event-item .ev-title { font-size: 16px; margin-bottom: 0; line-height: 1.2; }
      .ev-attendees-preview { margin-top: 6px; }
      .ev-attendees-preview .ev-attendee-avatar {
        width: 20px;
        height: 20px;
        font-size: 0.5rem;
        margin-left: -6px;
      }

      /* The card columns keep their shape (flex columns, bottom-up
         stacks): the events are in the left one, and whatever lands in
         the right behaves the way Kahvehane's and Kütüphane's do. */
      .col-left, .col-right {
        position: static;
        top: auto; bottom: auto; left: auto; right: auto;
        height: auto;
        width: auto;
        display: flex;
        flex-direction: column;
        overflow: visible;
        z-index: 1;
      }
      .col-left {
        /* ── Laid over the foot of the petek's own window ──
           The events used to have a grid row of their own, which made
           the petek's box (and the reader standing at the middle of it)
           a function of how tall this column was: it stood the drawing
           above the middle of the screen by exactly half the strip. So
           the petek now gets the WHOLE band between the two bars -- it
           is the page, and the reader is dead centre of it -- and this
           strip is laid over its foot, the same move level 0's own block
           makes inside the petek (see .ist-hive-self in
           profile-card.css).
           It also means a card opening changes nothing about the layout:
           the strip simply grows upward over the drawing and folds back,
           and the reader never moves. */
        grid-area: hero;
        align-self: end;
        position: relative;
        z-index: 2;
        /* ── Their share of the band, and always exactly that share ──
           A fixed box, not a row that grows with what is in it. The
           petek is centred in whatever is left above this (see fitHive),
           so every pixel this row gains or loses moves the reader
           himself: a night with three things on used to stand the
           drawing higher than a night with none, and an empty column
           left it hanging above a band of bare paper. So the column is
           the same height whatever it holds -- a night with a lot on
           scrolls inside it, and a night with nothing on prints the
           dashed frame across it (see .events-empty), the way the decks
           on the other two pages always keep their own corner.
           It is also the room a card grows into (.event-grow-page fills
           this box exactly), which is why it is stated once here rather
           than forced open for as long as a card is standing. */
        height: var(--hane-events-h);
        max-height: none;
        /* Opening and folding back is this one number changing (see
           openEventGrowPage), which is why the card's own grow can be
           measured against a box that is already the size it will be. */
        transition: height 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .col-left.events-open { height: var(--hane-events-open-h); }
      /* Nothing on this page's right column shows on a phone -- it is
         empty (the seat it used to carry is gone from Hane entirely, see
         the col-right markup). Hidden outright rather than given a track
         of its own, so the events get the full width. */
      .col-right { display: none; }
      /* #ist-pc-mount (profile-card.js) already covers the identity card
         on mobile — the desktop-only #library-card would otherwise
         duplicate it. */
      #library-card { display: none; }
      /* Bottom corner cards stay desktop-only -- same reasoning
         #library-card carries above (nothing to show in them yet). */
      .corner-card { display: none; }

      /* Both sidebars keep their desktop flex column (see the feeds' auto
         margin above, which needs a flex parent to mean anything) and
         keep the internal scrolling too -- the page itself does not scroll
         (see #main-site's overflow above), so row 2's band between the
         hero line and the tab bar is all the height either column ever
         gets, and a stack taller than the band has to absorb the overflow
         here. It used to be handed back to the page, which grew the row,
         squeezed the map and ran the last card down behind the fixed tab
         bar. The scroller is the sidebar rather than the feed inside it so
         that the feed stays a plain in-flow box whose auto margin can push
         it to the bottom of the scrollable area.
         .sidebar-right also takes the flex:1 its left counterpart already
         has in the desktop rule -- without it the news sidebar is only as
         tall as its own cards, and pushing the feed to the bottom of a box
         that is exactly the feed's height moves nothing. min-height:0 on
         both (and on the columns) because a flex/grid item's automatic
         minimum size is its content: without it the box refuses to be
         shorter than the whole stack and the overflow escapes upward
         again, one level at a time. */
      .col-left, .col-right { min-height: 0; }
      .sidebar-right-inner {
        padding: 8px 12px;
        gap: 6px;
      }
      .no-articles { font-size: 11px; padding: 14px 8px; }

      /* Bottom tab bar — fixed at bottom. Thinned from the top; labels sit
         flush against the bottom edge (the safe-area padding below is what
         separates them from the home-indicator area). */
      header {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom));
        padding: 0 0 env(safe-area-inset-bottom);
        margin: 0;
        border-top: 1px solid var(--rule);
        border-bottom: none;
        background: var(--paper-navbar);
        z-index: 100;
        display: flex;
        align-items: stretch;
      }
      nav {
        display: flex;
        width: 100%;
        height: 100%;
        gap: 0;
        /* Pull KÜTÜPHANE/KAHVEHANE in from the screen's rounded corners --
           at full-bleed width:100% the outer tabs sat right under the
           curve. 18px specifically (was 20px): that's the shared screen
           inset the rest of the page lines up on -- frames.css's 10px
           frame padding plus the 8px inner padding the columns use --
           so with the edge alignment below, the tab labels land on the
           same vertical lines as the floating profile card, the comment
           cards, the composer and the game tiles. */
        padding: 0 18px;
        flex-wrap: nowrap;
        justify-content: stretch;
      }
      nav a {
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 6px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--muted);
        border: none;
        text-decoration: none;
        /* Same fix as .neighborhood: without this, tapping a tab flashes
           the browser's default gray tap-highlight box over it. */
        -webkit-tap-highlight-color: transparent;
      }
      nav a.active { color: var(--ink); font-weight: 700; }
      /* The two outer tabs align their label to the bar's own edge
         instead of centering it inside their third of the bar, which is
         what actually puts the K of KÜTÜPHANE and the E of KAHVEHANE on
         the 18px inset line (see nav's padding above). HANE, in the
         middle, stays centered. The -0.5px pull cancels the trailing
         letter-spacing that CSS adds after the final E, which would
         otherwise sit between the glyph and the flex-end edge. */
      nav a:first-child { justify-content: flex-start; }
      nav a:last-child {
        justify-content: flex-end;
        margin-right: -0.5px;
      }

      /* ── Mobile swipe pagination: only left/right columns slide; map, datetime bar, and nav stay ── */
      .col-left, .col-right {
        transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        backface-visibility: hidden;
      }
      html.ist-entering-forward .col-left,
      html.ist-entering-forward .col-right {
        transform: translateX(100vw);
        transition: none;
      }
      html.ist-entering-backward .col-left,
      html.ist-entering-backward .col-right {
        transform: translateX(-100vw);
        transition: none;
      }
      body.ist-exiting-forward .col-left,
      body.ist-exiting-forward .col-right {
        transform: translateX(-100vw);
      }
      body.ist-exiting-backward .col-left,
      body.ist-exiting-backward .col-right {
        transform: translateX(100vw);
      }
    }

    /* ── Desktop swipe pagination: left column slides out/in toward the
       left edge, right column toward the right edge — regardless of nav
       direction; map, datetime bar, and nav stay ── */
    @media (min-width: 769px) {
      .col-left-slide, .col-right-slide {
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        backface-visibility: hidden;
      }
      /* col-left-slide now lives in the right-hand grid track (see the
         .col-left/.col-right grid-column swap above), so it exits/enters
         via the right edge, and vice versa for col-right-slide. */
      html.ist-entering-forward .col-left-slide,
      html.ist-entering-backward .col-left-slide {
        transform: translateX(100vw);
        transition: none;
      }
      html.ist-entering-forward .col-right-slide,
      html.ist-entering-backward .col-right-slide {
        transform: translateX(-100vw);
        transition: none;
      }
      body.ist-exiting-forward .col-left-slide,
      body.ist-exiting-backward .col-left-slide {
        transform: translateX(100vw);
      }
      body.ist-exiting-forward .col-right-slide,
      body.ist-exiting-backward .col-right-slide {
        transform: translateX(-100vw);
      }
    }

    /* ══════════════════════════════════════════════
       View Transitions API — cross-document slide
       The browser snapshots the outgoing page and holds
       it visible until the new page is ready, so there's
       no white flash between reloads. Only the columns
       animate; the map, nav, and datetime bar stay put
       because their content is identical across tabs. On
       mobile, direction comes from a class on <html> seeded
       by the outgoing page via sessionStorage (present before
       VT captures the new snapshot); desktop ignores direction
       entirely (see the media query below).
       ══════════════════════════════════════════════ */
    @view-transition { navigation: auto; }

    /* Suppress the default root crossfade — columns handle motion */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    .col-left-slide { view-transition-name: ist-col-left; }
    .col-right-slide { view-transition-name: ist-col-right; }

    /* The browser's own view-transition-group animation interpolates this
       named box's size/position between the outgoing and incoming page's
       rect. Kahvehane's col-right (the stacked game tiles) sits at a
       different height/position than col-right on the other pages (news/
       events), so that automatic box-morph -- stacked on top of the slide
       keyframes below -- swung the outgoing snapshot across the wrong part
       of the screen mid-transition, on top of the fixed nav bar (the view-
       transition layer always paints above it regardless of z-index).
       Disabling it pins the group to the new page's rect immediately; the
       keyframes below do 100% of the visible motion. */
    ::view-transition-group(ist-col-left),
    ::view-transition-group(ist-col-right) {
      animation: none;
    }

    /* Desktop: left column always exits/enters via the left edge, right
       column via the right edge — independent of nav direction, so no
       html.vt-forward/vt-backward gate is needed here. */
    @media (min-width: 769px) {
      /* ist-col-left is now the right-hand track and ist-col-right the
         left-hand one (see the .col-left/.col-right grid-column swap
         above), so their exit/enter edges are swapped here too. */
      @keyframes ist-vt-col-left-exit { from { transform: translateX(0); } to { transform: translateX(100vw); } }
      @keyframes ist-vt-col-left-enter { from { transform: translateX(100vw); } to { transform: translateX(0); } }
      @keyframes ist-vt-col-right-exit { from { transform: translateX(0); } to { transform: translateX(-100vw); } }
      @keyframes ist-vt-col-right-enter { from { transform: translateX(-100vw); } to { transform: translateX(0); } }

      ::view-transition-old(ist-col-left) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-left-exit;
      }
      ::view-transition-new(ist-col-left) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-left-enter;
      }
      ::view-transition-old(ist-col-right) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-right-exit;
      }
      ::view-transition-new(ist-col-right) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-right-enter;
      }
    }

    @media (max-width: 768px) {
      @keyframes ist-vt-out-left { from { transform: translateX(0); } to { transform: translateX(-100vw); } }
      @keyframes ist-vt-in-left { from { transform: translateX(100vw); } to { transform: translateX(0); } }
      @keyframes ist-vt-out-right { from { transform: translateX(0); } to { transform: translateX(100vw); } }
      @keyframes ist-vt-in-right { from { transform: translateX(-100vw); } to { transform: translateX(0); } }


      html.vt-forward::view-transition-old(ist-col-left),
      html.vt-forward::view-transition-old(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-out-left;
      }
      html.vt-forward::view-transition-new(ist-col-left),
      html.vt-forward::view-transition-new(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-in-left;
      }
      html.vt-backward::view-transition-old(ist-col-left),
      html.vt-backward::view-transition-old(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-out-right;
      }
      html.vt-backward::view-transition-new(ist-col-left),
      html.vt-backward::view-transition-new(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-in-right;
      }
    }

    /* ── Small-phone overrides (≤ 400px, e.g. iPhone 15) ── */
    @media (max-width: 400px) {
      /* Tighten padding inside the narrower news/events columns */
      .sidebar-right-inner { padding: 6px 6px; }
    }

    /* ── News / event detail: opened as THE sheet (see sheet.css) —
       the same object a game, an article or a profile opens as, so its
       size, anchor and slide are not restated here.

       The one thing this page does differently is the box itself: there
       is exactly one visible box, not a gray outer sheet with a second
       white card nested inside it. The #anahane-detail-sheet override
       below gives the SHEET the white chapter-box border/background
       (swapping out frames.css's gray shared fill) plus a drop shadow
       lifting it off the map, and the event card inside it sits in that
       box's padding.

       On mobile the sheet is dragged rather than scrolled (initDetailPull,
       see the ≤768px block at the end of this stylesheet): native
       scrolling had no way to stop it from climbing over the profile
       card at the top of the page. */
    #anahane-detail-sheet {
      background: #fff !important;
      border: 2px solid var(--card-border-color, #1a1a1a) !important;
      border-bottom-width: 0 !important;
      box-shadow: var(--frame-shadow-strong) !important;
    }
    /* There is no .politician-detail on this page any more: Hane names no
       seat at all (see the col-right markup below), so the only thing this
       sheet opens is an event. A person mentioned by name inside one still
       shows their title in the small label below, which is all this page
       ever needs to say about who somebody is -- the full page belongs to
       the two sides, where the seat does. */

    /* A person's name mentioned inside news/event body text (see
       person-mentions.js) -- dotted rather than a solid underline so it
       doesn't read as an outbound link. If the person currently holds a
       title (data-tip), hovering/focusing reveals it in a small label
       above the name -- a quick "who is this" reminder. It is the whole
       of what this page says about who somebody is: the full page belongs
       to the two sides, where the seat cards are. */
    .person-mention {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }
    .person-mention:hover,
    .person-mention:focus-visible {
      text-decoration-style: solid;
    }
    .person-mention[data-tip] {
      position: relative;
      cursor: help;
    }
    .person-mention[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--paper);
      padding: 4px 10px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      z-index: 5;
    }
    .person-mention[data-tip]:hover::after,
    .person-mention[data-tip]:focus-visible::after {
      opacity: 1;
    }
    /* The phone layout for this sheet — resting under the map, pulled up
       to the profile card — is the shared one now (.ist-sheet-pull in
       sheet.css, driven by IstSheet.pull). This page only opts in, on the
       markup, and keeps its own white single-box treatment above. */
  </style>
  <link rel="stylesheet" href="frames.css?v=5">
</head>

<!-- ══════════════ MAIN SITE ══════════════ -->
<div id="main-site">

  <!-- Mobile-only compact profile card (mounted by profile-card.js) -->
  <div id="ist-pc-mount"></div>

  <div class="section-rule">
    <header>
      <nav>

        <a href="anahane.html" class="active" data-tab="hane">Hane</a>
      </nav>
    </header>
  </div>

  <!-- ist-content: the swappable region for future client-side routing between
       kutuphane/anahane/kahvehane. Persistent chrome (nav, profile card, clock)
       stays outside this node. display:contents keeps grid placement identical
       to before this wrapper existed. -->
  <div id="ist-content" style="display:contents">
  <aside class="col-left">
    <div class="library-card" id="library-card"><div class="card-loading"><span class="spinner"></span></div></div>
    <!-- The events, back where they started. They belong beside the petek:

         one thing on the site that ends with you actually standing next
         to them. Kahvehane holds the map and what a cup costs on it;
         Hane holds the people and where they will be. Unscoped by
         construction -- there is no map on this page to filter by, so
         this is the whole city's list (each card kickered with its own
         district), and choosing a district is Kahvehane's job. -->
    <div class="col-left-slide">
      <section class="events-section">
        <div id="events-panel"></div>
        <!-- A kept event grows into this, in place, the same way
             Kahvehane's own event page and Kütüphane's news cards do

        <div class="event-grow-page" id="event-grow-page" hidden>

  <main>
    <!-- Hane IS the petek: the shared honeycomb is the page, not a sheet
         opened over a map (see mountHivePage in profile-card.js). The

    <section class="petek-page" id="hive-page"></section>
  </main>

  <aside class="col-right">
    <!-- No seat card here. Hane names nobody in power: this page is the
         self and the people (the petek beside it, the events on the other
         side) and it has no map for a seat to be true of. Whoever holds
         power over what you are looking at is a fact of the two sides --
         the district's Belediye Başkanı on Kahvehane, the country's
         leader on Kütüphane -- and the profile bar over this page carries
         you alone, in the middle of it (see setBarLayout in
         profile-card.js). -->
    <!-- Empty on purpose. Every story is on Kütüphane now -- İstanbul,
         Türkiye, the districts and Dünya in one feed (see its own
         #dunya-news-feed), rather than split across two pages. -->
    <div class="col-right-slide"></div>
    <!-- Bottom-left corner card (mirrors #library-card in the other
         column, pinned to the bottom instead of the top) -- empty for

<!-- Detail overlay: the bottom sheet this page opens things full-size
     in -- an event. See openDetail/closeDetail further down. -->
<div class="ist-sheet-overlay ist-sheet-pull detail-overlay" id="anahane-detail" hidden>
  <div class="ist-sheet-backdrop" id="anahane-detail-backdrop"></div>
  <div class="ist-sheet detail-overlay-sheet" id="anahane-detail-sheet">
    <button type="button" class="ist-sheet-close" id="anahane-detail-close" aria-label="Kapat" title="Kapat"><img class="close-icon" src="assets/cross.png" alt=""></button>
    <div class="ist-sheet-body detail-overlay-body" id="anahane-detail-body"></div>
  </div>

<script>
// Wrapped in a scoping IIFE so this page's top-level declarations (sb,
// districtNames, etc.) don't leak to the global scope -- a future
// client-side navigation may execute this same script a second time in a
// document that already ran another carousel page's script, and without
// this wrapper a repeated `const` at global scope throws a
// duplicate-declaration SyntaxError.
(function () {
// Shared client (see router.js) — no page may declare its own createClient
// anymore, so that a future client-side navigation can run more than one
// page's script in the same document without a duplicate-declaration crash.
const sb = IstRouter.sb;

// ── Auth State ──
// Loading screen (loading-screen.js) covers the page — including on a
// refresh while already logged in — until the real session check
// resolves, then either reveals the site or bounces to the sign-in page.
let authSession = null;
// Nothing of this runs under a virtual navigation. #loading-overlay is
// declared ABOVE #main-site and so never travels with the page (router.js
// injects only the overlays that follow it), and checkSession() is
// skipped there too -- so starting the loading screen anyway fired this
// callback with authSession still null and bounced the reader to
// index.html. That is what a swipe onto Hane used to do. The reader
// arrived here from another page that already holds a session; there is
// nothing to check and nothing to cover.
const resolveLoading = window.__istVirtualNavInjecting ? function () {} : LoadingScreen.start(() => {
  if (!authSession) { window.location.href = 'index.html'; return; }
  showSite(authSession.user);
});

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  authSession = session || null;
  resolveLoading();
}

// This page's repeatable "become the active page" work -- the part that
// re-runs on every virtual re-entry into anahane, not just the first real
// load (see showSite() below for the one-time login-gateway part: hiding
// the login overlay, mounting the profile card, the onboarding/mahalle-
// picker/admin-notification nudges).
function mount() {
  // #main-site's pointer-events lock (see its CSS) is only unlocked by
  // the .active class. #main-site is one shared, persistent node
  // across virtual navigations, and its *live* CSS rules are whichever
  // page's stylesheet setActiveStylesheet last enabled -- so this has to
  // be reasserted on every entry into anahane, not just showSite()'s
  // one-time login-gateway run, or a virtual re-entry (which skips
  // showSite() entirely) leaves the nav bar and profile card inheriting
  // pointer-events:none with nothing to unlock it.
  document.getElementById('main-site').classList.add('active');
  loadEvents();
  wireEventStripSwipe();
  loadPersonMentionsRoster();
  mountPetek();
  // #library-card lives inside #ist-content, so a virtual re-entry into
  // this page (router.js's navigateTo) resets it back to its spinner
  // placeholder along with the rest of the swapped HTML -- unlike
  // #ist-pc-mount (outside #ist-content, kept alive via IstProfileCard.
  // setPage), this has to be re-mounted every time, not just once from
  // showSite() on the real page load. See the same fix on kahvehane.html.
  mountLibraryCardWhenReady();
}

// profile-card.js is deferred, so on a real page load a fast checkSession()
// can call mount() (and thus this) before it has executed, leaving
// #library-card stuck on its spinner placeholder forever since mount()
// only fires again on a later virtual re-entry -- poll briefly the same way
// tryOnb/loadPersonMentionsRoster do instead of silently skipping.
function mountLibraryCardWhenReady(tries) {
  if (window.IstProfileCard) {
    IstProfileCard.mountLibraryCard({ sb, I18N, icon: IstProfileCard.HOME_SVG });
  } else if ((tries === undefined ? 40 : tries) > 0) {
    setTimeout(() => mountLibraryCardWhenReady((tries === undefined ? 40 : tries) - 1), 60);
  }
}

// Hane IS the petek (see mountHivePage in profile-card.js): there is no
// button and no sheet any more, the grid is simply the page. Mounted on
// every entry, including a virtual one -- #ist-content is swapped whole
// on a swipe back to this page, so the previous mount leaves with it.
//
// profile-card.js is deferred, so on a real page load a fast
// checkSession() can reach mount() before it has executed -- poll
// briefly, the same way the library card and the mentions roster do,
// rather than silently leaving the page empty until the next re-entry.
function mountPetek(tries) {
  if (window.IstProfileCard) {
    IstProfileCard.mountHivePage({ sb, I18N, mountId: 'hive-page' });
  } else if ((tries === undefined ? 40 : tries) > 0) {
    setTimeout(() => mountPetek((tries === undefined ? 40 : tries) - 1), 60);
  }
}

// person-mentions.js is deferred -- poll briefly the same way tryOnb/
// tryMahallePicker above do, so a fast mount() on a slow connection
// doesn't silently skip the initial load.
let personMentionsRoster = [];
function loadPersonMentionsRoster(tries) {
  if (window.IstPersonMentions) {
    IstPersonMentions.loadPeople(sb).then(people => { personMentionsRoster = people; });
  } else if ((tries === undefined ? 40 : tries) > 0) {
    setTimeout(() => loadPersonMentionsRoster((tries === undefined ? 40 : tries) - 1), 60);
  }
}

function unmount() {
  // The petek is the one thing this page leaves behind it: its state is
  // profile-card.js's own (so an in-flight fetch has something to check
  // itself against) and the classes saying which depth the reader was
  // standing at are on <html>, which the router does not swap. Left
  // there at level 0 or 2, ist-hive-offmid hides the kept-events column
  // on the way back in -- see unmountHivePage.
  if (window.IstProfileCard && IstProfileCard.unmountHivePage) IstProfileCard.unmountHivePage();
}

async function showSite(user) {
  document.getElementById('login-overlay').style.display = 'none';
  // #main-site's .active toggle now lives in mount() (see its comment) --
  // showSite() calls mount() below regardless, so adding it here too
  // would just be a redundant duplicate.
  window.__currentUser = user;
  I18N.syncFromSupabase(sb, user.id);
  Palette.syncFromSupabase(sb, user.id);
  // Mount the shared mobile profile card. profile-card.js is deferred, so
  // wait until it's loaded (DOMContentLoaded guarantees that) — otherwise a
  // fast session check can beat the deferred script on mobile and the card
  // silently never mounts. #library-card's own mount happens in mount()
  // instead (see there for why), since showSite() only ever runs once, on
  // the real page load.
  function mountProfileCard() {
    if (window.IstProfileCard) {
      IstProfileCard.mount({ sb, I18N, page: 'anahane' });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountProfileCard);
  } else {
    mountProfileCard();
  }
  mount();

  // First-login onboarding: locks the page until the user completes the flow.
  // No-op if profiles.onboarded_at is already set. The script also resumes
  // mid-flow on kahvehane / kutuphane and the post-tour finale on anahane.
  // onboarding.js is `defer`red, so on a slow connection it may not be
  // ready yet when this runs — poll briefly until it lands. Tied to the
  // real login gateway, not repeated on later virtual re-entries.
  (function tryOnb(tries) {
    if (window.IstOnboarding) {
      IstOnboarding.maybeRun({ sb, user, page: 'anahane' });
    } else if (tries > 0) {
      setTimeout(() => tryOnb(tries - 1), 60);
    }
  })(40);

  // Post-login mahalle picker: independent of onboarding.js (which only
  // ever runs once, on first login) so it also reaches existing users
  // whose ilçe gained mahalle data after they already signed up. No-ops
  // on its own if the ilçe has no mahalle rows yet or one is already set.
  (function tryMahallePicker(tries) {
    if (window.MahallePicker) {
      MahallePicker.maybeRun({ sb, user });
    } else if (tries > 0) {
      setTimeout(() => tryMahallePicker(tries - 1), 60);
    }
  })(40);

  // Admin one-shot notification popup — mascot bubble, shown once per user.
  (function tryNotif(tries) {
    if (window.IstAdminNotification) {
      IstAdminNotification.show({ sb });
    } else if (tries > 0) {
      setTimeout(() => tryNotif(tries - 1), 60);
    }
  })(40);
}

// ── The login gateway ──
// This overlay only exists on a REAL load of anahane.html; a virtual
// navigation swaps #ist-content alone and injects the body-level
// overlays that sit AFTER #main-site, which #login-overlay does not (it
// is declared above it). So every one of these ids is null when this
// script is injected by router.js, and wiring them unguarded threw --
// taking the rest of this file, mount() included, down with it, which is
// what made a swipe onto Hane land on index.html.
const onEl = (id, ev, fn) => {
  const el = document.getElementById(id);
  if (el) el.addEventListener(ev, fn);
};

function populateSignupDropdowns() {

    .sort((a, b) => a[1].localeCompare(b[1], 'tr'))
