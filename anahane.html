// ── No seat on Hane ───────────────────────────────────────────
// This page named a seat once -- İstanbul's Büyükşehir Belediye Başkanı,
// mirroring #library-card at the top-left. It names none now: Hane is the
// self and the people, with no map on it for a seat to be true of, and
// the profile bar over it carries you alone in the middle of the row (see
// setBarLayout in profile-card.js). Whoever holds power over what you are
// looking at is a fact of the two sides -- Kahvehane's own district and
// Kütüphane's countries -- and lives there, in politician-card.js.

// ── Events (left column) ──────────────────
// Beside the petek: the petek is who you are standing next to, an event
// is where you can go and actually stand next to them. This page has no
// map, so the list is the whole city's -- every district, each card
// kickered with its own -- and picking a district is Kahvehane's job.
// The filter argument survives for whoever wants to scope it later; the
// page never passes one.
// Date formatting and the .event-item template itself now live in
// event-interest-cards.js, shared with the copy of this stack standing
// inside the petek's level 1 (profile-card.js).
function eventDateParts(iso) {
  return IstEventCards.dateParts(iso, I18N.isEnglish());
}

let allEvents = [];
// Whether the last attempt to fetch the city's calendar failed, as
// against coming back with nothing in it. The column says different
// things about the two (see renderEventsNow): a city with nothing on
// tonight is a fact about İstanbul, and printing it because this phone
// could not ask is the app lying about the city on its behalf.
let eventsFailed = false;
let eventsRequestSeq = 0;
let rsvpCounts = {};       // event_id -> attendee count
let myRsvpIds = new Set(); // event_ids the current user has RSVP'd to
let rsvpAttendees = {};    // event_id -> [profile, ...] (capped)
const MAX_ATTENDEE_AVATARS = 6;
// The kept event currently grown into .event-grow-page (see
// openEventGrowPage), and the card it grew out of.
let _eventGrowId = null;
let _eventGrowOrigin = null;

async function loadEvents(neighborhoodFilter = null, instant = false) {
  const reqId = ++eventsRequestSeq;
  const now = new Date().toISOString();
  // The column says something from the first frame. It is a fixed box
  // under the petek (see .col-left), so while this was awaiting its two
  // round trips that box stood there as bare paper -- and a request that
  // never came back, or threw on the way, left it that way for good.
  // Drawing what is known right now (nothing yet, and the frame that
  // says so) costs nothing and means the band is never empty.
  renderEvents(true);
  try {
    // Scope the query to the selected neighborhood so the 30-row cap
    // doesn't hide matching rows that sit past the global top-30 window.
    let query = sb.from('events')
      .select('*')
      .gte('event_date', now)
      .order('event_date', { ascending: true })
      .limit(30);
    if (neighborhoodFilter) query = query.eq('neighborhood', neighborhoodFilter);
    const { data, error } = await query;
    // Drop responses from superseded requests so a slow older fetch
    // can't clobber a newer one with stale rows.
    if (reqId !== eventsRequestSeq) return;
    if (error) { console.error('[kahvehane events]', error); allEvents = []; eventsFailed = true; }
    else { allEvents = data || []; eventsFailed = false; }
    // What the reader threw right on Kahvehane's deck is kept in their
    // own browser (event-interest.js), which is the right home for a
    // verdict -- but a browser is not a member. A cleared cache, a
    // second device, the app beside mobile Safari: the deck's own
    // mirror of those verdicts (db/hive_event_interest.sql) is read
    // back here so the evenings they kept are waiting for them beside
    // the petek wherever they open it. Best-effort and never
    // authoritative: the device's own verdict wins, and a database
    // without the migration simply answers nothing.
    if (window.IstEventInterest && IstEventInterest.hydrate) {
      await IstEventInterest.hydrate(window.__currentUser && window.__currentUser.id, sb);
    }
    await loadRsvps();
  } catch (e) {
    // A rejected fetch (offline, a blocked request) used to take the
    // render with it, since it sat after the awaits.
    console.error('[kahvehane events]', e);
    eventsFailed = true;
  }
  if (reqId !== eventsRequestSeq) return;
  renderEvents(instant);
}

async function loadRsvps() {
  rsvpCounts = {};
  myRsvpIds = new Set();
  rsvpAttendees = {};
  const ids = allEvents.map(ev => ev.id);
  if (!ids.length) return;
  const { data, error } = await sb.from('event_rsvps')
    .select('event_id, user_id, created_at')
    .in('event_id', ids)
    .order('created_at', { ascending: true });
  if (error) { console.error('[kahvehane rsvps]', error); return; }
  const myId = window.__currentUser && window.__currentUser.id;
  (data || []).forEach(r => {
    rsvpCounts[r.event_id] = (rsvpCounts[r.event_id] || 0) + 1;
    if (myId && r.user_id === myId) myRsvpIds.add(r.event_id);
  });
  // Resolve attendee profile pictures in one batched query.
  const userIds = Array.from(new Set((data || []).map(r => r.user_id)));
  if (userIds.length) {
    const { data: profs, error: profErr } = await sb.from('profiles')
      .select('id, first_name, last_name, avatar_url, avatar_hair, avatar_hat, avatar_accessory, avatar_shirt')
      .in('id', userIds);
    if (profErr) { console.error('[kahvehane rsvp attendees]', profErr); return; }
    const profMap = new Map((profs || []).map(p => [p.id, p]));
    (data || []).forEach(r => {
      const p = profMap.get(r.user_id);
      if (!p) return;
      (rsvpAttendees[r.event_id] = rsvpAttendees[r.event_id] || []).push(p);
    });
  }
}

function buildAttendeeAvatarsHtml(eventId) {
  const list = rsvpAttendees[eventId] || [];
  if (!list.length) return '';
  const shown = list.slice(0, MAX_ATTENDEE_AVATARS);
  const extra = list.length - shown.length;
  const avatarsHtml = shown.map(p => {
    const name = capitalizeName([p.first_name, p.last_name].filter(Boolean).join(' ')) || 'Üye';
    const inner = IstAvatar.html(p.avatar_url, p.avatar_hair, p.avatar_hat, p.avatar_accessory, p.avatar_shirt);
    return `<span class="ev-attendee-avatar" title="${esc(name)}">${inner}</span>`;
  }).join('');
  const moreHtml = extra > 0
    ? `<span class="ev-attendee-avatar ev-attendee-more" title="+${extra}">+${extra}</span>`
    : '';
  return avatarsHtml + moreHtml;
}

async function toggleRsvp(eventId, btn) {
  const myId = window.__currentUser && window.__currentUser.id;
  if (!myId || btn.disabled) return;
  const attending = myRsvpIds.has(eventId);
  btn.disabled = true;
  try {
    if (attending) {
      const { error } = await sb.from('event_rsvps').delete().eq('event_id', eventId).eq('user_id', myId);
      if (error) throw error;
    } else {
      const { error } = await sb.from('event_rsvps').insert({ event_id: eventId, user_id: myId });
      if (error) throw error;
    }
  } catch (err) {
    console.error('[kahvehane rsvp]', err);
    btn.disabled = false;
    return;
  }
  // Refetch counts + attendee avatars so the stack reflects the change,
  // then patch just this event's row in place so the card doesn't collapse.
  await loadRsvps();
  const nowAttending = myRsvpIds.has(eventId);
  btn.classList.toggle('attending', nowAttending);
  btn.textContent = nowAttending ? I18N.t('home.events.rsvp.going') : I18N.t('home.events.rsvp.join');
  const row = btn.closest('.ev-rsvp-row');
  const countEl = row?.querySelector('.ev-rsvp-count');
  if (countEl) countEl.textContent = `${rsvpCounts[eventId] || 0} ${I18N.t('home.events.rsvp.count')}`;
  const avatarsEl = row?.querySelector('.ev-attendees');
  if (avatarsEl) avatarsEl.innerHTML = buildAttendeeAvatarsHtml(eventId);
  // Also patch the (separate) preview card in the column behind the sheet,
  // so its attendee stack matches without waiting for a reload.
  const previewEl = document.querySelector(`.event-item[data-event-id="${CSS.escape(eventId)}"] .ev-attendees-preview`);
  if (previewEl) previewEl.innerHTML = buildAttendeeAvatarsHtml(eventId);
  // The petek is printing who is going, the reader included -- so
  // answering the question repaints it rather than waiting for the card
  // to be closed and opened again.
  if (String(eventId) === String(_eventGrowId)) paintHiveForEvent(eventId);
  btn.disabled = false;
}

// ── A kept event's card, grown in place ──
// Same primitive Kahvehane's own event page and Kütüphane's news cards
// use (IstSheet.grow) -- the card becomes the page rather than a sheet
// rising over it, and it stays inside .events-section, below the petek,
// never over it (see .event-grow-page in the head <style>).

// Where the page's four sides fall: on the strip's own box, measured off
// #events-panel rather than restated as the sum of the column's padding
// -- one number written in two places is how those end up a couple of
// pixels apart. Same measurement Kütüphane's news page makes against its
// own feed (measureNewsPageBand there). Absolute inside .events-section,
// so everything is in that box's own coordinates.
//
// The panel's PADDING box, not its content box: the strip is a sideways
// scroller (see #events-panel's phone CSS), and a scroller draws its
// content right out to the padding edge -- so a page inset by the
// padding left an 8px sliver of the next card showing down the side of
// the event just opened.
function measureEventGrowBand() {
  const page = document.getElementById('event-grow-page');
  const panel = document.getElementById('events-panel');
  const section = document.querySelector('.events-section');
  if (!page || !panel || !section) return;
  const pr = panel.getBoundingClientRect();
  const sr = section.getBoundingClientRect();
  if (!(pr.width > 0) || !(sr.width > 0)) return;
  const px = (v) => Math.max(0, v).toFixed(2) + 'px';
  page.style.top = px(pr.top - sr.top);
  page.style.left = px(pr.left - sr.left);
  page.style.right = px(sr.right - pr.right);
  page.style.bottom = px(sr.bottom - pr.bottom);
}

function openEventGrowPage(ev, cardEl) {
  const page = document.getElementById('event-grow-page');
  const inner = document.getElementById('event-grow-page-inner');
  if (!page || !inner || !window.IstSheet) return;
  closeEventGrowPage(); // only one open at a time
  _eventGrowId = String(ev.id);
  _eventGrowOrigin = cardEl;
  cardEl.classList.add('event-grow-open');
  inner.innerHTML = buildEventPageHtml(ev);
  // The strip opens to the room a whole card needs. It is laid over the
  // foot of the petek's window rather than standing in a row of its own
  // (see .col-left), so this changes nothing about the layout and the
  // reader does not move: the strip grows upward over the drawing and
  // folds back down when the card is shut. Set before the measurement
  // below, so what the grow is measured against is already the box it
  // will be standing in.
  const col = document.querySelector('.col-left');
  if (col) { col.classList.add('events-open'); void col.offsetHeight; }
  page.hidden = false;
  measureEventGrowBand();
  IstSheet.grow({ page, inner, origin: cardEl, dir: 'in' });
  // Where the reader's own petek stands on it, painted straight onto
  // their hexagons: what they said about it on Kahvehane's deck, and --
  // the thing this page actually asks -- who among them is going
  // (profile-card.js owns the honeycomb, so this calls into it rather
  // than reaching for .ist-hive-cell here).
  paintHiveForEvent(ev.id);
}

function closeEventGrowPage() {
  const page = document.getElementById('event-grow-page');
  const inner = document.getElementById('event-grow-page-inner');
  if (!page || page.hidden || !window.IstSheet) return;
  if (window.IstProfileCard) IstProfileCard.clearHiveEventMarks();
  IstSheet.grow({ page, inner, origin: _eventGrowOrigin, dir: 'out' });
  const origin = _eventGrowOrigin;
  _eventGrowId = null;
  _eventGrowOrigin = null;
  setTimeout(() => {
    page.hidden = true;
    inner.innerHTML = '';
    if (origin) origin.classList.remove('event-grow-open');
    // Back to the resting strip -- one card's worth, above the tab bar.
    const col = document.querySelector('.col-left');
    if (col) col.classList.remove('events-open');
    // And the frame the grow drew around the page (see IstSheet.grow):
    // it is deliberately left standing after an 'out', holding the
    // collapsed card's outline until the sheet it belongs to hides. On
    // the other two pages that is the overlay, so it goes with it -- but
    // this page's grow lives inside the events strip itself, which is
    // never hidden, so nothing was taking it away. It stayed on the
    // screen at the *opened* geometry: two black rules running out of
    // the strip and down over the tab bar, with no way to get rid of
    // them short of a reload.
    IstSheet.cancelGrow(page);
  }, IstSheet.GROW_MS);
}

// The petek's own answer to the open card: the yes/no verdicts its
// members gave the event on Kahvehane's deck, and who has actually
// RSVP'd. The reader's own hexagon is painted from what this page
// already knows (myRsvpIds) -- the RPC deliberately answers only for
// everybody else.
function paintHiveForEvent(eventId) {
  if (!window.IstProfileCard || !IstProfileCard.paintHiveEventMarks) return;
  IstProfileCard.paintHiveEventMarks(sb, eventId, { mine: myRsvpIds.has(eventId) });
}

// The page is re-measured on resize like Kütüphane's is: it is a box
// pinned to another box, and a rotation moves the one it is pinned to.
window.addEventListener('resize', () => {
  const page = document.getElementById('event-grow-page');
  if (page && !page.hidden) measureEventGrowBand();
});

// ── The strip's own sideways slide ──
// One kept evening fills the strip and the next is a swipe to the side
// (see #events-panel's phone CSS, which does the sliding natively). The
// three-page carousel listens for exactly that gesture on the document
// (router.js), so a slide here has to stop at the strip or it deals the
// reader to Kütüphane instead of to their next evening -- the same
// stopPropagation Kahvehane's open event page makes for its own throw.
//
// Only while there is genuinely something to slide to, though: with one
// card in it (or the frame that says there are none) the strip is not a
// carousel, and swallowing the swipe there would leave a dead 90px band
// across the bottom of the screen that the page carousel cannot be
// reached from.
function wireEventStripSwipe() {
  const panel = document.getElementById('events-panel');
  if (!panel || panel.dataset.swipeWired) return;
  panel.dataset.swipeWired = '1';
  panel.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    if (panel.scrollWidth <= panel.clientWidth + 1) return;
    e.stopPropagation();
  }, { passive: true });
}

// What the member kept. The city's whole calendar is dealt with one card
// at a time on Kahvehane -- thrown right is "ilgimi çekti", thrown left
// is gone (see event-interest.js) -- and this column is the other end of
// that gesture: the evenings that were actually theirs, standing beside
// the people they would be standing next to. A list of everything on in
// İstanbul is a listings page; this is a plan.
function keptEvents() {
  // No store, no filter: the column degrades to the whole city's list
  // rather than to an empty page, which is the failure a reader can
  // actually make sense of.
  if (!window.IstEventInterest) return allEvents;
  const kept = IstEventInterest.interestedIds(window.__currentUser && window.__currentUser.id);
  return allEvents.filter(ev => kept.has(String(ev.id)));
}

function renderEvents(instant) {
  const panel = document.getElementById('events-panel');
  if (!panel) return;
  // 'left': this column sits to the left of the map, so its cards enter
  // and leave by the left edge -- the same way the comments did here.
  renderEventsNow(panel, keptEvents());
}

// The page a kept card grows into -- head / body / foot, the same
// three-part page a story opens as on Kütüphane. There is no throw on
// it: a kept event has already had its verdict given on Kahvehane's
// deck, and the one thing this page asks is whether you are going, which
// is the button standing on its bottom line.
function buildEventPageHtml(ev) {
  const parts = eventDateParts(ev.event_date);
  return IstEventCards.pageHTML(ev, parts, {
    backLabel: 'Hane',
    districtLabel: (id) => districtNames[id] || id,
    attendeesHTML: buildAttendeeAvatarsHtml,
    rsvp: {
      count: rsvpCounts[ev.id] || 0,
      attending: myRsvpIds.has(ev.id),
      joinLabel: I18N.t('home.events.rsvp.join'),
      goingLabel: I18N.t('home.events.rsvp.going'),
      countLabel: I18N.t('home.events.rsvp.count'),
    },
  });
}

// The column reserves nothing on render and nothing on open: it is a
// fixed box (--hane-events-h, see .col-left), the same size on a night
// with three things on, a night with none, and while a card is standing
// grown open in it. Which is the whole of why the petek above holds
// still -- row 1 is minmax(0,1fr), so every pixel this column gains or
// loses comes out of the drawing the reader is standing in the middle
// of.
function renderEventsNow(panel, rows) {
  if (!rows.length) {
    // Two different empties, and they still say different things -- a
    // city with nothing on says exactly that, while a city with events
    // on and none of them kept is a reader who hasn't been through the
    // deck yet, and that is worth one line pointing at where it is. But
    // both say it inside the SAME dashed frame, which is the rule the
    // decks on the other two pages already follow (see Kahvehane's own
    // deckFrameHTML): a column with nothing in it at all reads as the
    // page being broken rather than as there being nothing on, and this
    // one is standing under the petek where its absence moved the
    // drawing itself.
    const city = allEvents.length > 0;
    const line = city ? 'home.events.kept' : (eventsFailed ? 'events.failed' : 'events.none');
    const sub = city ? 'home.events.emptysub' : (eventsFailed ? 'events.failedsub' : 'events.nonesub');
    panel.innerHTML = `
      <div class="events-empty">
        <div class="events-empty-line">${esc(I18N.t(line))}</div>
        <div class="events-empty-sub">${esc(I18N.t(sub))}</div>
      </div>
    `;
    return;
  }
  const rowsById = new Map(rows.map(ev => [String(ev.id), ev]));
  // Weekday lives in the date block (day / month / weekday); time and
  // location are both dropped from the preview -- see buildEventDetailHtml
  // for the full date/time/location, still shown once you open the card.
  // That frees this card for a bigger title.
  panel.innerHTML = rows.map(ev => IstEventCards.previewHTML(ev, eventDateParts(ev.event_date), {
    districtLabel: (id) => districtNames[id] || id,
    attendeesHTML: buildAttendeeAvatarsHtml,
  })).join('');

  panel.querySelectorAll('.event-item.openable').forEach(el => {
    const ev = rowsById.get(el.dataset.eventId);
    if (!ev) return;
    el.addEventListener('click', () => openEventGrowPage(ev, el));
  });

  // Re-render (live refresh) rebuilds every card from scratch -- if the
  // one standing grown is still in this batch, hide its new copy the
  // same way the original was (see openEventGrowPage); otherwise the
  // card it grew out of is simply gone, so fold the page back.
  if (_eventGrowId != null) {
    // Only while a page is genuinely standing open. The mark this puts
    // on a card is `visibility: hidden` (see .event-grow-open), so a
    // stale id -- a close that took the early return, a virtual
    // navigation that swapped the markup out from under this module's
    // own state -- would hide the card on every render from then on,
    // with nothing on screen to say why.
    const page = document.getElementById('event-grow-page');
    if (!page || page.hidden) {
      _eventGrowId = null;
      _eventGrowOrigin = null;
    } else if (rowsById.has(_eventGrowId)) {
      const el = panel.querySelector(`[data-event-id="${CSS.escape(_eventGrowId)}"]`);
      if (el) { el.classList.add('event-grow-open'); _eventGrowOrigin = el; }
    } else {
      closeEventGrowPage();
    }
  }
}

// The RSVP button lives inside the detail sheet, which is re-rendered on
// every open -- delegated on the sheet body so it survives that, and bound
// to the element rather than to document (the sheet's body belongs to this
// page's markup, but a document listener would outlive a virtual
// navigation away from it -- see router.js).
(function initEventRsvpClicks() {
  const onRsvpClick = (e) => {
    const btn = e.target.closest('.ev-rsvp-btn');
    if (!btn) return;
    e.stopPropagation();
    toggleRsvp(btn.dataset.eventId, btn);
  };
  const body = document.getElementById('anahane-detail-body');
  if (body) body.addEventListener('click', onRsvpClick);
  const grown = document.getElementById('event-grow-page-inner');
  if (grown) grown.addEventListener('click', onRsvpClick);
})();

// The way back out is the arrow drawn into the page's own head, which is
// rebuilt on every open -- so the press is delegated on the inner rather
// than bound to a button that only exists between two renders. Bound to
// the element, never to document: all three carousel pages share one
// document (see router.js).
(function initEventGrowClose() {
  const inner = document.getElementById('event-grow-page-inner');
  if (!inner) return;
  inner.addEventListener('click', (e) => {
    if (e.target.closest('.ev-page-back')) closeEventGrowPage();
  });
})();

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// Detail overlay: a bottom sheet for whatever this page opens full-size
// -- an event. Mirrors Kahvehane's game overlay / Kütüphane's reader
// overlay.
// The phone pull handler (IstSheet.pull, assigned below). Opening and
// closing need nothing from it, since IstSheet drives it itself.
let detailPull = null;
function openDetail(html) {
  const overlay = document.getElementById('anahane-detail');
  const body = document.getElementById('anahane-detail-body');
  if (!overlay || !body) return;
  body.innerHTML = html;
  if (window.IstPersonMentions) IstPersonMentions.linkify(body, personMentionsRoster);
  // The sheet's body is the scroll container on desktop (see sheet.css) --
  // reset so a tall card left scrolled from a previous open doesn't reopen
  // mid-scroll. IstSheet.open does the same for the phone pull.
  body.scrollTop = 0;
  IstSheet.open(overlay);
}
function closeDetail() {
  const overlay = document.getElementById('anahane-detail');
  if (!overlay) return;
  IstSheet.close(overlay);
}
(function initDetailOverlay() {
  const overlay = document.getElementById('anahane-detail');
  const backdrop = document.getElementById('anahane-detail-backdrop');
  const closeBtn = document.getElementById('anahane-detail-close');
  const body = document.getElementById('anahane-detail-body');
  if (!overlay || !backdrop || !closeBtn || !body) return;
  backdrop.addEventListener('click', closeDetail);
  closeBtn.addEventListener('click', closeDetail);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeDetail();
  });
})();

// The pull is the shared sheet's (see IstSheet.pull in sheet.js) — the
// same gesture Kütüphane's reader opens with, so an event and a story
// behave identically in the hand.
detailPull = IstSheet.pull('anahane-detail', { onDismiss: closeDetail });

// ── Init ──
// Skipped when this script is being injected by a virtual navigation
// (see router.js's navigateTo) -- that path calls the registered mount()
// directly instead, since the user's already authenticated and the
// profile card's already mounted from the real page load that got them
// into the app in the first place.
if (!window.__istVirtualNavInjecting) checkSession();

// Another member's profile: one sheet for the whole site (see
// openMemberSheet in profile-card.js). This page prints no member links
// of its own yet, but wiring it here means one will work the day it does
// -- and that the sheet is the same object it is everywhere else.
// profile-card.js is deferred, so this waits for it rather than reaching
// for it mid-parse.
(function wireMemberSheet() {
  const wire = () => { if (window.IstProfileCard) IstProfileCard.initMemberSheet({ sb, I18N }); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();

IstRouter.registerPage('anahane', { mount, unmount });
})();
</script>
</body>
</html>
