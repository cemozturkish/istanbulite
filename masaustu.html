<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <meta charset="UTF-8">
  <!-- ── MASAÜSTÜ: THE APP, SEEN THROUGH A PHONE-SHAPED WINDOW ──
       project.html is a phone. Everything in it is measured off a phone's
       window: the hero is a 100vw square, the drawings are 9:16 and laid in
       with `cover`, the columns are cut from the window's width, and every
       one of those rules lives inside a `max-width: 768px` media query in a
       shared stylesheet. Opened in a desktop window none of that applies --
       the top bar is phone-only CSS, so it simply is not there; the cards
       stretch eight hundred pixels wide; the 9:16 map is cropped to a sliver
       of the Bosphorus -- and what the reader gets is the phone layout pulled
       apart rather than a layout of its own.

       So a desktop reader is not given a second layout. They are given the
       PHONE, standing in the middle of the screen: project.html in an iframe
       the shape of a phone, which is a real window of that width, so every
       media query, every vw and every innerWidth inside it reads exactly
       what it reads on the device. Nothing in the app had to be restated for
       this, and nothing about the phone or the native app changes because
       of it -- they never reach this page (see the bounce below and the one
       at the top of project.html).

       Around it is the DESK, painted with the app's own bar ink, read off
       the app itself rather than restated here (see paintDesk): the two
       bars run on into it, so the city reads as a lit window in the middle
       of a dark desk rather than a picture of a phone laid on one. And
       either side of the window is the one thing a desktop reader is
       missing -- a way across the strip without a finger (see the arrows). -->
  <script>
    // ── Who belongs here ──
    // The same question project.html asks at the top of its own head, asked
    // the other way round. Anything that is not a desktop goes back to the
    // app itself: a phone that followed a shared link, the native app (which
    // never ships this page -- see scripts/sync-web.js), or this page framed
    // inside something else. A desktop is a pointer that hovers, never a
    // window width -- project.html says why (a phone's window is 980px wide
    // until the viewport tag is read, and this runs before it).
    //
    // The media query is project.html's own, character for character -- a
    // window the two disagree about would be sent back and forth between
    // them. The one-shot flag is the second half of that promise: it tells
    // project.html this window has just come back from here, so it renders
    // as it is instead of sending the reader straight back.
    (function () {
      var desk = !window.Capacitor && window.self === window.top && !!window.matchMedia &&
        window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (desk) return;
      window.__masaLeaving = true;
      try { sessionStorage.setItem('ist_masa_back', '1'); } catch (e) { /* the query alone keeps them apart */ }
      location.replace('project.html' + location.search + location.hash);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e2e2e">
  <title>İstanbulite</title>
  <style>
    :root {
      /* Until the app is in and says what its bars are wearing (see
         paintDesk), the desk wears the charcoal they wear most of the time.
         The change is a transition, so a warm palette arrives rather than
         snapping. */
      --masa-ink: #2e2e2e;
      --masa-label: #9b9b9b;
      --masa-label-on: #f4f4f4;
      /* ── The window ──
         The shape of the phone the app is drawn for -- the largest one it
         is measured against, 430 x 932. Height first: the whole height of
         the screen, up to that phone's own; the width follows at the
         phone's ratio, never wider than that phone and never narrower than
         the narrowest one the app supports. A screen too short for that
         lets the window come out a little squarer -- an iPhone SE's shape,
         which the app already lays out for.

         Whole pixels, size AND place (`round`, where the engine has it):
         the app measures its own window and builds its grid off it, and a
         window standing a quarter of a pixel down the screen is one whose
         every line of type is drawn between two rows of pixels. */
      --masa-h: min(100vh, 932px);
      --masa-w: min(100vw, clamp(320px, calc(var(--masa-h) * 430 / 932), 430px));
    }
    @supports (height: 100dvh) {
      :root { --masa-h: min(100dvh, 932px); }
    }
    @supports (width: round(down, 10.5px, 1px)) {
      :root {
        --masa-h: round(down, min(100dvh, 932px), 1px);
        --masa-w: min(100vw, clamp(320px, round(down, calc(var(--masa-h) * 430 / 932), 1px), 430px));
      }
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--masa-ink);
      transition: background-color 0.4s ease;
      /* Nothing on the desk scrolls, and a sideways trackpad swipe here is
         the strip's (see the wheel below), never the browser's back. */
      overflow: hidden;
      overscroll-behavior: none;
    }
    /* ── The desk goes quiet with the app ──
       A page opening dims the whole phone except its bottom bar, which is
       lifted over the tint because the logo on it stays live (see
       body.fb-page-on in project.html). The desk is the bars' own ink run
       on past the window, so it does the same, or the window's top bar
       would turn into a darker box against an undimmed desk: everything
       down to the line the bottom bar starts on goes quiet, and the bar
       runs on across the desk at full strength under it. Same tint and
       same curve as the app's own (sheet.css), read off the app. */
    body::before {
      content: '';
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: var(--masa-dim-floor, 0px);
      z-index: 0;
      background: var(--masa-dim-ink, rgba(0, 0, 0, 0.28));
      opacity: 0;
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    html.masa-dim body::before { opacity: 1; }
    .masa-col {
      position: absolute;
      z-index: 1;
      width: var(--masa-w);
      height: var(--masa-h);
      left: calc((100vw - var(--masa-w)) / 2);
      top: calc((100vh - var(--masa-h)) / 2);
    }
    @supports (height: 100dvh) {
      .masa-col { top: calc((100dvh - var(--masa-h)) / 2); }
    }
    @supports (width: round(down, 10.5px, 1px)) {
      .masa-col {
        left: round(down, calc((100vw - var(--masa-w)) / 2), 1px);
        top: round(down, calc((100dvh - var(--masa-h)) / 2), 1px);
      }
    }
    .masa-col iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--masa-ink);
    }
    /* ── The arrows ──
       The strip is walked with a sideways pull, and a mouse has no pull. The
       app answers the trackpad's own swipe and the arrow keys as well (see
       stepLane in project.html), but neither is something a reader would
       think to try, so the floor under them is drawn: one hand-drawn arrow
       either side of the window, pointing at the lane that is over there.
       Same arrow the app's own pages carry, in the bar's own label ink, and
       it is only there while there IS a lane that way and the strip can be
       walked (nothing open over it) -- an arrow that does nothing when
       pressed is worse than no arrow. Hidden is `visibility`, after the
       fade: that is what also takes it out of the tab order and away from
       a screen reader, which an arrow that is not there must be. */
    .masa-step {
      position: absolute;
      top: 50%;
      margin-top: -26px;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0s linear 0.25s, transform 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .masa-step-l { right: calc(100% + 36px); }
    .masa-step-r { left: calc(100% + 36px); }
    .masa-step.on {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.25s ease, visibility 0s, transform 0.18s ease;
    }
    .masa-step i {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--masa-label);
      -webkit-mask: url(assets/back.png) center / contain no-repeat;
      mask: url(assets/back.png) center / contain no-repeat;
      transition: background-color 0.18s ease;
    }
    .masa-step-r i { transform: scaleX(-1); }
    .masa-step:hover i, .masa-step:focus-visible i { background: var(--masa-label-on); }
    .masa-step-l:hover { transform: translateX(-4px); }
    .masa-step-r:hover { transform: translateX(4px); }
    .masa-step:active { transform: scale(0.92); }
    .masa-step:focus { outline: none; }
    .masa-step:focus-visible { outline: 2px solid var(--masa-label-on); outline-offset: 6px; }
    /* A window too narrow to stand the arrows beside the phone gives the
       phone the room instead: the arrow keys and the swipe still work. */
    @media (max-width: 640px) {
      .masa-step { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      html, body, body::before, .masa-step, .masa-step i { transition: none; }
    }
  </style>
</head>
<body>
  <div class="masa-col">
    <button type="button" class="masa-step masa-step-l" id="masa-step-l" aria-label="Kütüphane" title="Kütüphane"><i aria-hidden="true"></i></button>
    <iframe id="masa-app" title="İstanbulite"></iframe>
    <button type="button" class="masa-step masa-step-r" id="masa-step-r" aria-label="Kahvehane" title="Kahvehane"><i aria-hidden="true"></i></button>
  </div>
<script>
(function () {
  if (window.__masaLeaving) return;

  const frame = document.getElementById('masa-app');
  const stepL = document.getElementById('masa-step-l');
  const stepR = document.getElementById('masa-step-r');
  // ?ink=0 and friends ride through to the app (see map-ink.js's KILL_KEY).
  frame.src = 'project.html' + location.search + location.hash;

  // Everything here is read off the app, and the app is the same origin,
  // so its window and document are reachable -- but only once it has
  // actually loaded something, and never while it is mid-navigation.
  function app() {
    try {
      const w = frame.contentWindow;
      return (w && w.document && w.__fb) ? w : null;
    } catch (err) { return null; }
  }

  // ── The desk wears the bar's own ink ──
  // project.html paints its root with --navbar-ink, which is a different
  // colour per palette and per half of the sky (frames.css). The desk is
  // that same ink, read off the app rather than copied here, so a palette
  // change or a sunset moves the desk in the same moment it moves the bars
  // -- and the two bars of the app run on into it rather than stopping at a
  // seam. The labels are read the same way, for the arrows.
  let watched = null;
  function paintDesk() {
    let doc;
    try { doc = frame.contentDocument; } catch (err) { return; }
    if (!doc || !doc.documentElement) return;
    const cs = getComputedStyle(doc.documentElement);
    const ink = cs.getPropertyValue('--navbar-ink').trim();
    const label = cs.getPropertyValue('--navbar-ink-label').trim();
    const labelOn = cs.getPropertyValue('--navbar-ink-label-active').trim();
    const root = document.documentElement.style;
    if (ink) {
      root.setProperty('--masa-ink', ink);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', ink);
    }
    if (label) root.setProperty('--masa-label', label);
    if (labelOn) root.setProperty('--masa-label-on', labelOn);
    const dimInk = cs.getPropertyValue('--ist-sheet-dim-ink').trim();
    if (dimInk) root.setProperty('--masa-dim-ink', dimInk);
    if (doc.title) document.title = doc.title;
    // palette.js writes data-palette / data-theme on the app's <html> at
    // every change -- a sunset included -- and IstSheet.syncDim writes the
    // dim there as a class (ist-dim-on), so the app's root is the one thing
    // to watch for both.
    if (watched !== doc.documentElement) {
      watched = doc.documentElement;
      new MutationObserver((list) => {
        if (list.some(m => m.attributeName !== 'class')) paintDesk();
        else syncDim();
      }).observe(watched, {
        attributes: true, attributeFilter: ['data-palette', 'data-theme', 'class'],
      });
    }
    syncDim();
  }

  // The desk's half of the app's dim (see body::before above): on with the
  // app's own, and down to the line the app's bottom bar starts on --
  // measured, because where that line falls is the app's arithmetic
  // (its bar height, the safe area), not this page's. The bar's ink is its
  // ::before, which stands --navbar-arc ABOVE the bar's own box at the two
  // corners (the hexagon shoulder, frames.css) -- and the corners are
  // where the bar meets the desk, so that is the line.
  function syncDim() {
    let doc;
    try { doc = frame.contentDocument; } catch (err) { return; }
    const on = !!(doc && doc.documentElement && doc.documentElement.classList.contains('ist-dim-on'));
    if (on) {
      const bar = doc.querySelector('.section-rule > header');
      const fr = frame.getBoundingClientRect();
      let line = fr.bottom;
      if (bar) {
        const lift = parseFloat(doc.defaultView.getComputedStyle(bar, '::before').top) || 0;
        line = fr.top + bar.getBoundingClientRect().top + Math.min(0, lift);
      }
      document.documentElement.style.setProperty('--masa-dim-floor', Math.max(0, window.innerHeight - line) + 'px');
    }
    document.documentElement.classList.toggle('masa-dim', on);
  }
  window.addEventListener('resize', syncDim);

  // The app's styles are in by the time its document stops loading, which
  // is long before its two dozen drawings are -- so the desk is painted on
  // the document's own readiness rather than on the frame's `load`, which
  // waits for every image.
  // Gives up at the frame's own `load`, which paints anyway -- a frame that
  // never becomes the app must not leave this asking every frame forever.
  let frameLoaded = false;
  function paintWhenReady() {
    if (frameLoaded) return;
    let doc;
    try { doc = frame.contentDocument; } catch (err) { return; }
    if (doc && doc.readyState !== 'loading' && /project\.html$/.test(frame.contentWindow.location.pathname)) {
      paintDesk();
      return;
    }
    requestAnimationFrame(paintWhenReady);
  }
  paintWhenReady();

  // ── Anything the app navigates to is a whole page again ──
  // The only way out of project.html is signing out (or deleting the
  // account), which sends it to index.html -- and the login gate is a page
  // laid out for any window, not a phone. It would load in here, a login
  // form in a phone on a desk, so the window steps aside and hands the
  // address to the whole tab instead.
  frame.addEventListener('load', () => {
    let href = '';
    try { href = frame.contentWindow.location.href; } catch (err) { return; }
    if (!href || href === 'about:blank') return;
    frameLoaded = true;
    if (!/project\.html$/.test(frame.contentWindow.location.pathname)) {
      location.replace(href);
      return;
    }
    paintDesk();
    syncSteps();
    frame.focus();
  });

  // ── The keyboard belongs to the app ──
  // Escape closes a page, the arrows walk the strip, the logo answers
  // Enter -- all of it is the app's own document listening. A press on the
  // desk would otherwise leave focus out here, where none of it is heard.
  // Only when nothing out here has it: a reader who tabbed out of the app
  // onto one of the arrows has put focus there on purpose.
  window.addEventListener('focus', () => {
    setTimeout(() => {
      if (document.activeElement === document.body || !document.activeElement) frame.focus();
    }, 0);
  });
  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('.masa-step')) return;
    requestAnimationFrame(() => frame.focus());
  });
  // And if a key lands out here anyway, the two the desk itself can answer.
  document.addEventListener('keydown', (e) => {
    const w = app();
    if (!w || e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (w.__fb.stepLane(e.key === 'ArrowLeft' ? -1 : 1)) e.preventDefault();
    frame.focus();
  });

  // ── A sideways swipe anywhere on the screen is the strip's ──
  // Inside the window the app hears the trackpad itself; out here on the
  // desk the same gesture is handed to the same function, so it does not
  // matter where on the screen the two fingers happen to be.
  document.addEventListener('wheel', (e) => {
    const w = app();
    if (w && w.__fb.laneWheel) w.__fb.laneWheel(e);
  }, { passive: true });

  // ── The arrows ──
  // Which lane each one leads to is named on it (for the tooltip and for a
  // screen reader); whether it is there at all is the app's own answer to
  // "can the strip be walked that way right now" -- the same guard the
  // keys and the trackpad go through, so the three can never disagree.
  // Lane 1 is the petek, the middle (see LANE_MAP in project.html).
  const LANE_NAMES = ['Kütüphane', 'Petek', 'Kahvehane'];
  function syncSteps() {
    const w = app();
    const fb = w && w.__fb;
    const at = fb ? fb.lane.at : null;
    [[stepL, -1], [stepR, 1]].forEach(([btn, dir]) => {
      btn.classList.toggle('on', !!fb && fb.canStepLane(dir));
      const name = (at != null) ? LANE_NAMES[at + dir] : null;
      if (name) { btn.setAttribute('aria-label', name); btn.title = name; }
    });
  }
  [[stepL, -1], [stepR, 1]].forEach(([btn, dir]) => {
    btn.addEventListener('click', () => {
      const w = app();
      if (w) w.__fb.stepLane(dir);
      syncSteps();
      frame.focus();
    });
  });
  // Polled rather than told: what decides it is spread across the whole
  // app (a page open, a game, a sheet, the tour, the strip mid-walk), and
  // asking the one function that already knows every one of them four
  // times a second costs nothing. Not while the tab is hidden.
  setInterval(() => { if (!document.hidden) syncSteps(); }, 250);
})();
</script>
</body>
</html>
