<!-- Hit-region overlay traced directly over assets/map/kutuphane-map-mobile.png
     (the 1080x1920 portrait drawing Kütüphane shows on phones), so the viewBox
     below is that image's own pixel grid and the two line up 1:1 as long as the
     SVG is drawn with preserveAspectRatio="xMidYMin meet" over an image fitted
     with object-fit:contain / object-position:center top.

     Source of truth. kutuphane.html inlines a copy of this (it has to, for the
     CSS hover/active tints and the click handler to reach the shapes). Keep the
     two in sync.

     Note for editors: no double hyphen anywhere in these comments. This file is
     parsed as XML, not HTML, and XML ends a comment at the first one.

     fill="none" and no stroke: the artwork is already drawn in the image
     underneath, these are only the shapes you can point at. The visible tints
     come from the .country rules in kutuphane.html.

     data-country groups the pieces of one country that were drawn as separate
     polygons (Türkiye's Anadolu/Rumeli halves, Yunanistan + Girit, Azerbaycan +
     Nahçıvan) so they light up as one unit; data-name is the label the map
     caption prints. -->
