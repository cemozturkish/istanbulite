// ── Interactive map — cosmetic parity with Hane/Kahvehane ──
// library_shelves content isn't neighborhood-scoped, so clicking a
// district here only gives the same visual feedback (active tint,
// map-label text) as the other two pages; it doesn't filter shelves or
// articles. Unlike Hane/Kahvehane, this map doesn't highlight the user's
// home neighborhood — Kütüphane is moving to a Turkey-wide map, where a
// single home *district* has no obvious analogue.
(function initLibraryMap() {
  // Delegated on document and re-queried fresh each time rather than
  // bound per-node once -- a virtual navigation (see router.js) replaces
  // #ist-content's whole subtree on every revisit to this page, including
  // the map's .neighborhood elements, so listeners bound once to the
  // original nodes would go stale after the first navigate-away-and-back.
  //
  // Both overlays answer to the same handlers: .neighborhood is the desktop
  // artwork's İstanbul trace, .country the phone artwork's country trace.
  // Only one of the two is ever displayed (see the .map-svg-ist /
  // .map-svg-world rules), so the hidden one's shapes can't be pointed at
  // and nothing has to branch on which is live.
  const MAP_REGION_SEL = '.neighborhood, .country';
  function getMapRegions() { return document.querySelectorAll(MAP_REGION_SEL); }
  if (!getMapRegions().length) return;

  // data-neighborhood / data-country covers shapes drawn as several polygons
  // (Şişli's exclave, Türkiye's Anadolu and Rumeli halves, Yunanistan plus
  // Girit) whose element ids must stay unique but which are one region.
  function regionId(el) { return el.dataset.neighborhood || el.dataset.country || el.id; }
  function regionName(el) { return el.getAttribute('data-name') || regionId(el); }

  // What lights when this region is touched or hovered. On the world
  // overlay that is the region's whole story -- Ukrayna lights Rusya with
  // it, Filistin lights the three countries the same war is being fought
  // in (db/country_stories.sql) -- because the page about to open is
  // about all of them, and the map has to say so before it opens. On the
  // İstanbul overlay, and for a country in no story, it is the one region.
  function regionGroupIds(el) {
    const id = regionId(el);
    return el.classList.contains('country') ? storyCountryIds(id) : [id];
  }

  // Paint one class across a group, clearing it everywhere else -- the
  // only way `active` and `hover-active` are ever set, so neither can end
  // up lit on half a story.
  function paintGroup(el, cls) {
    const group = new Set(el ? regionGroupIds(el) : []);
    getMapRegions().forEach(n => n.classList.toggle(cls, group.has(regionId(n))));
  }

  // The caption a region puts under the map when it is touched or hovered.
  // On the world overlay that is nothing at all: touching a country opens
  // its page, and that page already carries the country's name on its top
  // line -- printing it under the map too says the same word twice. The
  // İstanbul overlay (desktop) keeps naming the district it lit, since
  // nothing else on screen does. The country's own name is still passed to
  // the sheet (regionName below), it just never reaches the caption.
  function regionLabel(el) { return el.classList.contains('country') ? '' : regionName(el); }

  // What the caption reads with nothing selected, which is not the same
  // sentence on the two artworks: the desktop map is İstanbul's districts,
  // the phone map is Türkiye among its neighbours. Read off which overlay is
  // actually displayed rather than re-testing the breakpoint here, so the
  // caption can never disagree with the map under it.
  function idleMapLabel() {
    // The world map prints no idle caption -- Türkiye is the drawing itself,
    // so naming it adds a word over the artwork that says nothing new. The
    // caption only appears once the reader touches a country, and empties
    // again when they let it go.
    const world = document.querySelector('.map-svg-world');
    return (world && getComputedStyle(world).display !== 'none') ? '' : 'İstanbul';
  }

  // Held as the label text, not as an id to look up later: on the country
  // overlay several regions sit in a <g> carrying that same id (<g id="turkiye">
  // around the two halves), and getElementById would find the group -- which
  // has no data-name -- instead of a shape.
  let activeRegionName = null;

  function baseMapLabel() { return activeRegionName || idleMapLabel(); }

  // Called on every re-entry to the page, not just the first: the router
  // swaps in a fresh copy of the page's markup, where the caption is back to
  // its hardcoded "İstanbul" -- which on a phone would print İstanbul under
  // a map of Türkiye until the reader touched something.
  function resetMapLabel() {
    const mapLabel = document.getElementById('map-label');
    getMapRegions().forEach(n => n.classList.remove('active', 'hover-active'));
    activeRegionName = null;
    _mapSelectionOpenedSheet = false;
    if (mapLabel) mapLabel.textContent = idleMapLabel();
    // Nothing is selected any more, so the seat goes back to the one this
    // page rests on. A no-op on the very first run (politician-card.js is
    // deferred and has not loaded yet); mount()'s own poll paints it then.
    renderSeatFor('cumhurbaskani', 'Cumhurbaşkanı');
  }
  window.__istResetMapLabel = resetMapLabel;
  resetMapLabel();

  document.addEventListener('click', (e) => {
    const mapLabel = document.getElementById('map-label');
    const nb = e.target.closest(MAP_REGION_SEL);
    if (nb) {
      const nbId = regionId(nb);
      paintGroup(nb, 'active');
      if (mapLabel) mapLabel.textContent = regionLabel(nb);
      activeRegionName = regionLabel(nb);
      // Every country on the phone map opens: its story rises in the same
      // half-page sheet a news item does (see openCountrySheet), carrying
      // the entries of every country that just lit with it. Ankara is
      // the exception -- the only city drawn, the only thing inked red on
      // the artwork, and what this page holds of Ankara is the meclis, so it
      // opens the TBMM sheet the button in the boxes column opens. It still
      // lights with Türkiye, so the reader sees which country's parliament
      // they are opening; being in a story is about what lights, and what
      // a shape opens is decided here.
      //
      // The tint and caption above run first either way, so the map reads as
      // selected behind whichever sheet rises over it. Gated on .country so
      // the desktop overlay's districts keep behaving as they did -- they
      // have no pages to open.
      if (nb.classList.contains('country')) {
        // This selection belongs to the sheet about to rise, so closing
        // that sheet takes the tint and the caption with it (see
        // closeReaderOverlay) -- and the seat with it too, since
        // resetMapLabel is what closing runs.
        _mapSelectionOpenedSheet = true;
        // The bar's left end follows the map here exactly as it does on
        // Hane: the country you just touched puts its leader up there.
        renderSeatFor(nbId, regionName(nb));
        if (nbId === 'ankara') openTBMMSheet();
        else openCountrySheet(nbId, regionName(nb));
      }
      return;
    }
    // Snap back to the idle caption only when clicking empty space inside
    // the map panel itself — clicking the shelves, reading area or other UI
    // that floats over the map must not reset it.
    //
    // Through resetMapLabel rather than by clearing the same four things
    // here: that is the one place that knows what "nothing is selected"
    // means, and it grew a fifth thing (putting the seat back to the
    // Cumhurbaşkanı) that this copy silently would not have done — tapping
    // the sea would have deselected the country while leaving its leader
    // standing on the bar.
    if (!e.target.closest('.map-panel') || e.target.closest('.map-label')) return;
    resetMapLabel();
  });
  document.addEventListener('mouseover', (e) => {
    const nb = e.target.closest(MAP_REGION_SEL);
    if (!nb) return;
    const mapLabel = document.getElementById('map-label');
    if (mapLabel) mapLabel.textContent = regionLabel(nb);
    paintGroup(nb, 'hover-active');
  });
  document.addEventListener('mouseout', (e) => {
    const nb = e.target.closest(MAP_REGION_SEL);
    if (!nb || nb.contains(e.relatedTarget)) return;
    const mapLabel = document.getElementById('map-label');
    if (mapLabel) mapLabel.textContent = baseMapLabel();
    getMapRegions().forEach(n => n.classList.remove('hover-active'));
  });
})();

// Generate an 8-char uppercase referral code (matches the format the
// handle_new_user trigger uses for new accounts).
function generateReferralCode() {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let out = '';
  for (let i = 0; i < 8; i++) {
    out += alphabet[Math.floor(Math.random() * alphabet.length)];
  }
  return out;
}

    const birthPlace = document.getElementById('bs-birthplace').value.trim();

    if (!neighborhood) { msg.textContent = 'Yaşadığı ilçeyi seçin.'; msg.style.color = 'var(--accent)'; return; }
    if (!birth) { msg.textContent = 'Doğum yerini seçin.'; msg.style.color = 'var(--accent)'; return; }

    btn.disabled = true;
    btn.textContent = 'Oluşturuluyor...';
    msg.textContent = '';

    // Retry on referral_code unique-constraint collision (extremely unlikely
    // at this size, but the trigger does the same).
    let lastErr = null;
    for (let attempt = 0; attempt < 5; attempt++) {
      const payload = {
        id: user.id,
        email: user.email,
        first_name: firstName || null,
        last_name: lastName || null,
        neighborhood,
        birth_place: birth,
        referral_code: generateReferralCode(),
      };
      const { data, error } = await sb
        .from('profiles')
        .insert(payload)
        .select('id');
      if (!error && data && data.length > 0) {
        msg.textContent = 'Profil oluşturuldu. Yenileniyor...';
        msg.style.color = 'var(--muted)';
        setTimeout(() => window.location.reload(), 600);
        return;
      }
      lastErr = error;
      // 23505 = unique_violation. Retry with a new referral_code.
      if (error && error.code === '23505' && /referral_code/i.test(error.message || '')) continue;
      break;
    }
    btn.disabled = false;
    btn.textContent = 'Oluştur';
    console.error('[hane bootstrap] insert failed', lastErr);
    msg.textContent = 'Oluşturulamadı: ' + (lastErr?.message || 'bilinmeyen hata');
    msg.style.color = 'var(--accent)';
  });
}

async function loadProfile() {
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    window.location.href = 'index.html';
    return;
  }

  // Check if viewing another user's profile via ?user=ID
  const urlParams = new URLSearchParams(window.location.search);
  const viewingUserId = urlParams.get('user');
  const isViewingOther = viewingUserId && viewingUserId !== session.user.id;

  // When viewing another user's profile, fall back to the legacy mobile layout
  // (library-card + HESAP visible) instead of the shared self-profile widget.
  if (isViewingOther) document.body.classList.add('ist-viewing-other');

  // Fetch fresh user data from server (getSession can return stale cache)
  const { data: { user: freshUser }, error: userError } = await sb.auth.getUser();
  const user = freshUser || session.user;
 const profileUserId = isViewingOther ? viewingUserId : user.id;

const { data: profile, error: profileError } = await sb
  .from('profiles')
  .select('*')
  .eq('id', profileUserId)
  .single();

if (profileError) {
  console.error('[hane loadProfile]', profileError);
}

// Members this user has referred (been kefil to) -- fetched in full (not
// just a count) so the self-edit overlay can list them, same as the shared
// mobile/desktop cards elsewhere (see profile-card.js's fetchProfileData).
const { data: sponsoredRows } = await sb
  .from('profiles')
  .select('id, first_name, last_name, neighborhood, joined_at')
  .eq('referred_by', profileUserId)
  .order('joined_at', { ascending: true });
const sponsoredList = sponsoredRows || [];
const kefaletCount = sponsoredList.length;

// Lifetime sözcü count — gates premium avatars in the picker. Only needed
// for the self-edit card; viewing another user never shows the picker.
let ownSozcuCount = 0;
if (!isViewingOther) {
  const istNow = IstDate.now();
  const todayISO = `${istNow.getFullYear()}-${String(istNow.getMonth()+1).padStart(2,'0')}-${String(istNow.getDate()).padStart(2,'0')}`;
  const { count: szc } = await sb
    .from('sozcel_sozcul_assignments')
    .select('*', { count: 'exact', head: true })
    .eq('user_id', user.id)
    .lte('game_date', todayISO);
  ownSozcuCount = szc || 0;
}

// Resolve the name of the person who referred this user (their kefil)
let kefilOfUser = null;
if (profile?.referred_by) {
  const { data: kp } = await sb
    .from('profiles')
    .select('id, first_name, last_name')
    .eq('id', profile.referred_by)
    .maybeSingle();
  if (kp) kefilOfUser = kp;
}

// Accounts that predate the handle_new_user trigger don't have a profiles
// row. Surface this clearly instead of silently rendering empty fields and
// then accepting "saves" that update zero rows.
const profileMissing = !isViewingOther && !profile;
const isAdminUser = user.email === 'cemwozturk@gmail.com';
console.log('[hane loadProfile] auth user.id =', user.id, 'profile =', profile, 'profileError =', profileError, 'session role =', session?.user?.role, 'access_token len =', session?.access_token?.length);
if (profileMissing) {
  console.warn('[hane] No profiles row for auth user', user.id);
  if (isAdminUser) {
    renderProfileBootstrap(user);
    return;
  }
  const banner = document.createElement('div');
  banner.textContent = 'Profil kaydı bulunamadı. Bu hesabın profiles tablosunda satırı yok — yöneticiyle iletişime geçin.';
  Object.assign(banner.style, {
    position: 'fixed', top: '0', left: '0', right: '0',
    background: '#000', color: '#fff', padding: '10px 16px',
    fontSize: '0.8rem', fontFamily: "'Inter', sans-serif",
    textAlign: 'center', zIndex: '9999', letterSpacing: '0.5px'
  });
  document.body.appendChild(banner);
}

// The layered avatar (bald base + hair overlay) and the picker renderer
// live on IstProfileCard/IstAvatar so the desktop library-card here and the
// mobile widget stay in sync.
let avatarUrl = profile?.avatar_url || null;
let avatarHair = profile?.avatar_hair || null;
let avatarHat = profile?.avatar_hat || null;
let avatarAccessory = profile?.avatar_accessory || null;
let avatarShirt = profile?.avatar_shirt || null;

const firstName = profile?.first_name || '';
const lastName = profile?.last_name || '';

const displayName =
  `${firstName} ${lastName}`.trim() ||
  user.email.split('@')[0];

const yasadigiIlce = profile?.neighborhood || '';
const dogumYeri = profile?.birth_place || '';
const phone = profile?.phone || '';
// Two-option toggles. Legacy `more_turkish` / `system` get folded into
// their nearest neighbour so existing rows still pick a valid tick.
// palette_pref reuses the column written by onboarding.js: 'mono' = siyah-beyaz, 'earth' = kahverengi.
function normalizeLang(v)    { return v === 'more_english' ? 'more_english' : 'default'; }
function normalizeTheme(v)   { return v === 'dark' ? 'dark' : 'light'; }
function normalizePalette(v) { return v === 'earth' ? 'earth' : 'mono'; }

const languagePref = normalizeLang(profile?.language_pref);
const themePref = normalizeTheme(profile?.theme_pref);
const palettePref = normalizePalette(profile?.palette_pref);

// Apply the saved language immediately so labels render in the right tongue.
I18N.setLang(languagePref);
// Apply the saved palette too (palette.js already booted from the cached value).
Palette.setPalette(palettePref);

  function avatarDisplayHTML() {
    return IstAvatar.html(avatarUrl, avatarHair, avatarHat, avatarAccessory, avatarShirt);
  }

  // Birth place display (read-only)
  let dogumDisplay = '—';
  if (dogumYeri === 'istanbul_disi') dogumDisplay = 'İstanbul Dışı';
  else if (dogumYeri && neighborhoodNames[dogumYeri]) dogumDisplay = neighborhoodNames[dogumYeri];
  else if (dogumYeri) dogumDisplay = dogumYeri;

  // ── PROFILE LIBRARY CARD (top of right column) ──
  const cardEl = document.getElementById('library-card');
  const yasadigiDisplay = yasadigiIlce ? (neighborhoodNames[yasadigiIlce] || yasadigiIlce) : '—';

  // Editing/settings/badges all live in the shared profile-overlay bottom
  // sheet (IstProfileCard.openProfileOverlay) — same one anahane.html and
  // kahvehane.html open — instead of swapping this card to an edit form.
  function renderCardView() {
    cardEl.innerHTML = `
      <div class="card-top">
        <div class="avatar" id="avatar-display">${avatarDisplayHTML()}</div>
        <div class="card-id">
          <div class="card-name">${displayName}</div>
          <div class="card-meta">${yasadigiDisplay}</div>
        </div>
        ${isViewingOther ? '' : `<button type="button" class="edit-btn" id="edit-profile-btn" aria-label="${I18N.t('profile.toggle')}" title="${I18N.t('profile.toggle')}">${IstProfileCard.GEAR_SVG}</button>`}
      </div>
    `;
    if (!isViewingOther) {
      document.getElementById('edit-profile-btn').addEventListener('click', () => {
        IstProfileCard.openProfileOverlay({
          sb, I18N, user, profile,
          sozcuCount: ownSozcuCount, kefaletCount, sponsoredList, kefilOfUser,
          page: 'kutuphane',
          avatarUrl,
          avatarHair,
          avatarHat,
          avatarAccessory,
          avatarShirt,
          onAvatarChange(hair, hat, accessory, shirt) {
            avatarHair = hair;
            avatarHat = hat;
            avatarAccessory = accessory;
            avatarShirt = shirt;
            const av = document.getElementById('avatar-display');
            if (av) av.innerHTML = avatarDisplayHTML();
          },
        });
      });
    }
  }

  renderCardView();

  // Self-view: account info and sign-out already live in the shared profile
  // sheet (gear icon on the library card above) -- and this page is where
  // they live, since your profile shows different blocks depending on which
  // of the three pages opened it (see PROFILE_SECTIONS in profile-card.js).
  // So the rest of the left column stays empty here rather than duplicating.
  // ── RIGHT: kefil & sponsored count (only shown when viewing another user) ──
  if (isViewingOther) {
    document.querySelector('.profile-right').innerHTML = `
      <div class="info-card">
        <div class="right-section-title">${I18N.t('profile.kefil')}</div>
        ${kefilOfUser ? `<div class="info-row">
          <div class="info-label">${I18N.t('profile.kefil')}</div>
          <div class="info-value"><button class="kefil-link" data-user-id="${kefilOfUser.id}">${capitalizeName((`${kefilOfUser.first_name || ''} ${kefilOfUser.last_name || ''}`).trim()) || I18N.t('profile.unnamed')}</button></div>
        </div>` : ''}
        <div class="info-row">
          <div class="info-label">${I18N.t('profile.sponsoredcount')}</div>
          <div class="info-value">${kefaletCount ?? 0} ${I18N.t('profile.people')}</div>
        </div>
      </div>
    `;
  }

  // Left column entrance: profile card slides in from the left edge — same
  // treatment as Hane's news feed / Kahvehane's discussion feed.
  staggerEntrance([
    document.getElementById('library-card'),
    document.querySelector('.profile-right .info-card'),
  ], 'left');
}

// This page's repeatable "become the active page" work -- the part that
// re-runs on every virtual re-entry into kutuphane, not just the first
// real load. No timers or page-specific top-level listeners get set up
// by either call (both re-render their target elements via innerHTML,
// which is self-cleaning), so there's nothing for unmount() to undo.
let personMentionsRoster = [];
function loadPersonMentionsRoster(tries) {
  if (window.IstPersonMentions) {
    IstPersonMentions.loadPeople(sb).then(people => { personMentionsRoster = people; });
  } else if ((tries === undefined ? 40 : tries) > 0) {
    setTimeout(() => loadPersonMentionsRoster((tries === undefined ? 40 : tries) - 1), 60);
  }
}

// Drops the map spinner once the map image is there. Runs on every mount
// because the router hands this page a fresh copy of the .map-panel markup
// -- spinner included -- on every re-entry. On a re-entry the image is
// already in cache and img.complete is true, so the spinner never paints.
function clearMapLoading() {
  const img = document.getElementById('map-photo-img');
  const loading = document.getElementById('map-loading');
  if (!loading) return;
  if (!img || img.complete) { loading.remove(); return; }
  const done = () => loading.remove();
  img.addEventListener('load', done, { once: true });
  img.addEventListener('error', done, { once: true });
}

function mount() {
  clearMapLoading();
  loadProfile();
  bootstrapLibraryNav();
  // Re-attach the Makaleler / Posta Kutusu / TBMM click handlers to this
  // re-entry's fresh markup (see wireLibraryEntryPoints).
  wireLibraryEntryPoints();
  // The map caption ships in the markup as "İstanbul" (the desktop map's
  // idle text) and the router hands this page a fresh copy of that markup on
  // every re-entry -- see resetMapLabel in initLibraryMap.
  if (window.__istResetMapLabel) window.__istResetMapLabel();
  // Which countries light together (db/country_stories.sql). Fetched here
  // rather than on the first tap: the tap has to light the whole story in
  // the frame it tints the shape it was aimed at. Cached across
  // re-entries, so this is one request per session, not per mount.
  loadCountryStories();
  loadDunyaNews();
  IstRouter.onTick(tickDunyaNewsAgo);
  loadPersonMentionsRoster();
  // politician-card.js is deferred -- on a fresh real page load this
  // runs synchronously during parsing, before any deferred script has
  // executed, so a plain `if (window.IstPoliticianCard)` check here would
  // silently miss it. Poll briefly instead (same idiom as __mountIstPc's
  // tryOnb below). This paints the resting seat through the same path a
  // country tap uses, so there is one way the seat is ever set.
  (function tryPoliticianCard(tries) {
    if (window.IstPoliticianCard) {
      renderSeatFor('cumhurbaskani', 'Cumhurbaşkanı');
    } else if (tries > 0) {
      setTimeout(() => tryPoliticianCard(tries - 1), 60);
    }
  })(10);
}
function unmount() {
  IstRouter.offTick(tickDunyaNewsAgo);
  // A story swipes away with the page it belongs to.
  snapNewsPageShut();
}

// Skipped when this script is being injected by a virtual navigation (see
// router.js's navigateTo) -- that path calls the registered mount()
// directly instead, since the user's already authenticated and the
// profile card's already mounted from the real page load that got them
// into the app in the first place.
if (!window.__istVirtualNavInjecting) mount();

// Mount the shared mobile profile card (hidden on desktop via CSS).
// profile-card.js is deferred, so wait until it's loaded. Also skipped
// when injected by a virtual navigation, for the same reason as mount()
// above -- the card is already mounted and onboarding/admin-notification
// already had their one-time chance on the real page load.
function __mountIstPc() {
  if (window.IstProfileCard) IstProfileCard.mount({ sb, I18N, page: 'kutuphane' });
  // Resume the onboarding flow if the user is mid-tour. onboarding.js is
  // deferred — poll briefly in case it hasn't landed yet.
  (function tryOnb(tries) {
    if (window.IstOnboarding) {
      sb.auth.getSession().then(({ data }) => {
        if (data?.session?.user) IstOnboarding.maybeRun({ sb, user: data.session.user, page: 'kutuphane' });
      });
    } else if (tries > 0) {
      setTimeout(() => tryOnb(tries - 1), 60);
    }
  })(40);

  // Admin one-shot notification popup — mascot bubble, shown once per user.
  (function tryNotif(tries) {
    if (window.IstAdminNotification) {
      IstAdminNotification.show({ sb });
    } else if (tries > 0) {
      setTimeout(() => tryNotif(tries - 1), 60);
    }
  })(40);
}
if (!window.__istVirtualNavInjecting) {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', __mountIstPc);
  } else {
    __mountIstPc();
  }
}


// Another member's profile: one sheet for the whole site (see
// openMemberSheet in profile-card.js), opened by any .author-link /
// .kefil-link on this page. profile-card.js is deferred, so this waits
// for it instead of reaching for it mid-parse.
(function wireMemberSheet() {
  const wire = () => { if (window.IstProfileCard) IstProfileCard.initMemberSheet({ sb, I18N }); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();

IstRouter.registerPage('kutuphane', { mount, unmount });
})();
</script>
