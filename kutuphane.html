  // the receipt is written behind it.
  markLetterRead(letter);
  document.getElementById('letter-back').addEventListener('click', () => renderLettersList(letters));
  _closeReaderOverlay = closeReaderOverlay;
  const pathEl = area.querySelector('.shelf-path');
  if (pathEl) pathEl.scrollTop = 0;
}

// ══════════════════════════════════════════
// Hikâyeler — what a country on the map opens.
//
// A reader does not touch Ukrayna to read about Ukrayna. They touch it
// because there is a war there, and that war is also Rusya. So the map is
// grouped into **stories** (db/country_stories.sql): touching any member
// lights all of them and opens one page carrying every member's entries,
// each card kickered with the country it is filed under. Five of them --
// Rusya–Ukrayna, the İsrail cephesi (Filistin, Lübnan, Suriye, İran),
// Ermenistan–Azerbaycan, Yunanistan–Kıbrıs, and Türkiye with Ankara.
//
// A country in no story is unchanged: it lights alone and opens its own
// entries under its own name. The page is the same page either way --
// only its title and how many countries feed it differ.
//
// Same shape as Posta Kutusu above, and deliberately so: the sheet lists
// the entries, touching one opens it as a single scrollable page, and its
// back button returns to the list rather than closing.
// ══════════════════════════════════════════
// The groups, as country id -> story. Small and structural (five rows),
// so it is fetched once on mount rather than when a country is first
// touched: the tap has to light the whole group in the same frame it
// tints the shape, and it cannot wait for a round trip to know what the
// group is. Before it lands -- roughly the first moment of the page -- a
// tap simply behaves the way it did before stories existed, which is a
// legible degradation rather than a broken one.
let COUNTRY_STORIES = null;
let COUNTRY_STORIES_LOAD = null;

function loadCountryStories() {
  if (COUNTRY_STORIES) return Promise.resolve(COUNTRY_STORIES);
  if (!COUNTRY_STORIES_LOAD) {
    COUNTRY_STORIES_LOAD = sb.from('country_story_countries')
      .select('country, country_stories(id, name_tr, blurb)')
      .then(({ data, error }) => {
        if (error) {
          // Cleared so the next mount retries rather than inheriting a
          // failed fetch for the rest of the session.
          COUNTRY_STORIES_LOAD = null;
          console.error('[kutuphane country stories]', error);
          return null;
        }
        const byStory = new Map();
        (data || []).forEach(row => {
          const s = row.country_stories;
          if (!s) return;
          if (!byStory.has(s.id)) {
            byStory.set(s.id, { id: s.id, name: s.name_tr, blurb: s.blurb, countries: [] });
          }
          byStory.get(s.id).countries.push(row.country);
        });
        // Every member points at the same story object, so "what lights
        // with this" and "what feeds this page" are one list read twice.
        const map = {};
        byStory.forEach(story => story.countries.forEach(c => { map[c] = story; }));
        COUNTRY_STORIES = map;
        return map;
      });
  }
  return COUNTRY_STORIES_LOAD;
}

function countryStoryOf(countryId) {
  return (COUNTRY_STORIES && COUNTRY_STORIES[countryId]) || null;
}

// What lights when this country is touched, and what feeds its page: the
// whole story, or just the country itself when it is in none.
function storyCountryIds(countryId) {
  const story = countryStoryOf(countryId);
  return story ? story.countries : [countryId];
}

// Cached per page rather than per country -- the key is the set of
// countries the page is built from, so Rusya and Ukrayna share one entry
// and one fetch, which is the point of them being one story. Not
// preloaded: most of the map is never touched in a session.
const COUNTRY_ENTRIES_CACHE = {};

async function loadCountryEntries(countryIds) {
  const ids = countryIds.slice().sort();
  const key = ids.join(',');
  if (COUNTRY_ENTRIES_CACHE[key]) return COUNTRY_ENTRIES_CACHE[key];
  // The entry's chain rides along with it (db/country_entry_events.sql):
  // a timeline is the point of most of these pages, so fetching it
  // separately when the reader opens one would put a spinner in the
  // middle of a page that is otherwise already here.
  const { data, error } = await sb.from('country_entries')
    .select('*, country_entry_events(*)')
    .in('country', ids)
    .order('entry_date', { ascending: false, nullsFirst: false })
    .order('created_at', { ascending: false });
  if (error) {
    console.error('[kutuphane country entries]', error);
    // Not cached: a failed fetch is a network blip, not an empty story,
    // and caching it would keep the page empty for the whole session.
    return null;
  }
  COUNTRY_ENTRIES_CACHE[key] = data || [];
  return COUNTRY_ENTRIES_CACHE[key];
}

// countryName comes from the map shape's own data-name, so a country with
// no story is titled with the same word the caption under the map prints
// when you touch it. A country in one is titled with the story's name
// instead -- the war, not the participant.
async function openCountrySheet(countryId, countryName) {
  const overlay = document.getElementById('reader-overlay');
  const area = document.getElementById('reader-overlay-sheet');
  if (!overlay || !area) return;
  // Touching the map can happen while a news story is open -- the news
  // page sits in the band below the map, so the map stays live under it
  // (see openDunyaNewsDetail). This page replaces that story, so the
  // story's highlight goes with it: what is lit stays what is open. The
  // page itself is folded away by initNewsPage's own watch on this sheet.
  clearNewsCountryHighlight();
  const story = countryStoryOf(countryId);
  const page = {
    title: story ? story.name : countryName,
    blurb: story ? story.blurb : '',
    countries: story ? story.countries : [countryId],
  };
  area.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
  IstSheet.open(overlay);
  _closeReaderOverlay = closeReaderOverlay;
  const entries = await loadCountryEntries(page.countries);
  // The reader may have closed this sheet, or opened another country,
  // while the fetch was in flight -- don't paint over what they did.
  if (!overlay.classList.contains('open')) return;
  renderCountryEntriesList(entries, page);
}

// The head every page inside the reader sheet wears -- a country, a
// shelf, Posta Kutusu, a letter: the hand-drawn arrow alone in the
// corner. `backLabel` is what the arrow goes back to -- never printed,
// only announced, because the drawing says everything a word would.
// `title` is the page's own name, centred on the top line; a page whose
// body already carries its headline (a country entry, a letter) passes
// none, and the arrow stands alone over it.
//
// Declared here among the country code but hoisted, so the letters and
// shelves above reach it too.
function arrowHeadHTML(title, backId, backLabel) {
  return `
    <div class="arrow-head${title ? '' : ' arrow-head-bare'}">
      <button class="arrow-back" type="button" id="${libEsc(backId)}"
              aria-label="${libEsc(backLabel)}" title="${libEsc(backLabel)}">
        <img src="assets/back.png" alt=""/>
      </button>
      ${title ? `<h2 class="arrow-title">${libEsc(title)}</h2>` : ''}
    </div>
  `;
}

// A country entry's chain, newest first -- the same order, and the same
// ticked track, a Dünya story's Zaman Akışı is printed in. The one
// difference is that a moment here is stamped with its date rather than
// its age: these chains reach back to 1917, and "109 yıl önce" tells a
// reader nothing.
//
// Sorted here rather than in the query because the events arrive
// embedded in their entry (see loadCountryEntries), and an embedded
// select carries no order of its own.
function countryEntryEvents(entry) {
  return (entry.country_entry_events || []).slice()
    .sort((a, b) => (a.event_date < b.event_date ? 1 : a.event_date > b.event_date ? -1 : 0));
}

function countryTimelineHTML(entry) {
  const events = countryEntryEvents(entry);
  if (!events.length) return '';
  return `
    <div class="timeline">
      <div class="sidebar-label" style="padding:0 0 6px 0;background:none;border:none;font-size:0.6rem;letter-spacing:2px;">Zaman Akışı</div>
      <div class="timeline-track">
        ${events.map(ev => `
          <div class="timeline-item">
            <div class="timeline-item-date">
              <span class="timeline-tick"></span>
              <div class="ago">${libEsc(formatLetterDate(ev.event_date))}</div>
            </div>
            <strong>${libEsc(ev.title)}</strong>
            ${ev.body ? `<p>${libEsc(ev.body)}</p>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// What goes where a news card prints its age: the entry's own date if it
// has one, otherwise the date of the newest moment on its chain -- which
// is the same thing a story's `updated_at` says, "when this last moved".
function countryEntryStamp(entry) {
  if (entry.entry_date) return formatLetterDate(entry.entry_date);
  const newest = countryEntryEvents(entry)[0];
  return newest ? formatLetterDate(newest.event_date) : '';
}

// Each card is kickered with the country its entry is filed under, not
// with the page's own title: on a story page that is the whole point --
// FİLİSTİN, LÜBNAN, SURİYE, İRAN down one page under "İsrail Cephesi" --
// and on a one-country page it prints exactly what it always did.
function countryEntryKicker(entry) {
  return mapCountryName(entry.country).toLocaleUpperCase('tr-TR');
}

function renderCountryEntriesList(entries, page) {
  const area = document.getElementById('reader-overlay-sheet');
  if (!area) return;
  let listHtml;
  if (entries === null) {
    listHtml = `<div class="empty-state" style="padding:20px;font-size:0.78rem;">${libEsc(page.title)} yüklenemedi.</div>`;
  } else if (!entries.length) {
    listHtml = `<div class="empty-state" style="padding:20px;font-size:0.78rem;">${libEsc(page.title)} için henüz bir şey yok.</div>`;
  } else {
    // The same card the Dünya feed prints, so a story's entries are
    // tapped exactly the way a news item is -- kicker, headline, opening
    // paragraph -- rather than as a shelf of chapters.
    listHtml = `<div class="country-entries">` + entries.map(en => {
      const lead = (en.body || '').split(/\n{2,}/)[0].trim();
      const stamp = countryEntryStamp(en);
      return `
        <div class="article openable" data-entry="${libEsc(en.id)}">
          <div class="meta-row">
            <div class="kicker">${libEsc(countryEntryKicker(en))}</div>
            ${stamp ? `<div class="ago">${libEsc(stamp)}</div>` : ''}
          </div>
          <h3>${libEsc(en.title)}</h3>
          ${lead ? `<p>${libEsc(lead)}</p>` : ''}
        </div>
      `;
    }).join('') + `</div>`;
  }
  area.innerHTML = `
    <div class="shelf-path">
      ${arrowHeadHTML(page.title, 'country-back', 'Kütüphane')}
      ${page.blurb ? `<p class="story-blurb">${libEsc(page.blurb)}</p>` : ''}
      ${listHtml}
    </div>
  `;
  document.getElementById('country-back').addEventListener('click', closeReaderOverlay);
  area.querySelectorAll('.article.openable').forEach(card => {
    wireCardPress(card);
    card.addEventListener('click', () => {
      const entry = (entries || []).find(en => en.id === card.dataset.entry);
      if (entry) openCountryEntryReader(entry, entries, page);
    });
  });
}

// An entry is the arrow alone over one .article -- kicker, headline,
// body, its Zaman Akışı, and an optional source. It is a page in the
// reader sheet and not the news page above: a story reached by touching
// the map arrives over the map, where a story reached by touching a card
// grows out of that card. Same objects inside either way (see the
// :is(.article, .news-page) rules in the stylesheet). Body paragraphs
// come off renderLetterBodyHtml: blank lines separate paragraphs,
// nothing else is interpreted.
function openCountryEntryReader(entry, entries, page) {
  const area = document.getElementById('reader-overlay-sheet');
  if (!area) return;
  const url = libSafeUrl(entry.source_url);
  const stamp = countryEntryStamp(entry);
  area.innerHTML = `
    <div class="shelf-path">
      ${arrowHeadHTML(null, 'country-entry-back', page.title)}
      <div class="article">
        <div class="meta-row">
          <div class="kicker">${libEsc(countryEntryKicker(entry))}</div>
          ${stamp ? `<div class="ago">${libEsc(stamp)}</div>` : ''}
        </div>
        <h3>${libEsc(entry.title)}</h3>
        ${renderLetterBodyHtml(entry.body)}
        ${countryTimelineHTML(entry)}
        ${url ? `<p style="margin-top:16px;"><a href="${libEsc(url)}" target="_blank" rel="noopener noreferrer">Kaynak</a></p>` : ''}
      </div>
    </div>
  `;
  document.getElementById('country-entry-back').addEventListener('click',
    () => renderCountryEntriesList(entries, page));
  _closeReaderOverlay = closeReaderOverlay;
  const pathEl = area.querySelector('.shelf-path');
  if (pathEl) pathEl.scrollTop = 0;
}

// ══════════════════════════════════════════
// The news feed — left column (col-right). Reads public.breaking_news,
// and reads ALL of it: İstanbul, Türkiye, the districts and Dünya alike.
// Hane used to carry the first three in its own right-hand column; every
// story lives here now, so there is one place on the site where the news
// is, and Hane is left as the self and the city. The names kept the
// `dunya` prefix they were born with -- the Dünya-specific behaviour (a
// story lighting the countries it is about on the world map) is still
// here, it just no longer describes the whole feed.
// ══════════════════════════════════════════
let DUNYA_NEWS_CACHE = [];

function libFormatNewsAge(iso) {
  const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  const en = I18N.isEnglish();
  if (secs < 60) return en ? 'now' : 'şimdi';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return en ? `${mins}m` : `${mins} dk`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return en ? `${hrs}h` : `${hrs} sa`;
  if (hrs < 48) return en ? 'yesterday' : 'DÜN';
  return en ? '2 days ago' : 'evvelsi gün';
}
function libFormatAgoTR(iso) {
  const d = new Date(iso);
  const secs = Math.floor((Date.now() - d.getTime()) / 1000);
  const en = I18N.isEnglish();
  if (secs < 60) return en ? 'now' : 'şimdi';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return en ? `${mins}m` : `${mins} dk`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return en ? `${hrs}h` : `${hrs} sa`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return en ? `${days}d` : `${days} gün`;
  const months = Math.floor(days / 30);
  if (months < 12) return en ? `${months}mo` : `${months} ay`;
  const years = Math.floor(days / 365);
  const remMonths = Math.floor((days - years * 365) / 30);
  if (remMonths <= 0) return en ? `${years}y` : `${years} yıl`;
  return en ? `${years}y ${remMonths}mo` : `${years} yıl ${remMonths} ay`;
}
function libFormatAgoTRLong(iso) {
  const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  const en = I18N.isEnglish();
  if (secs < 60) return en ? 'now' : 'şimdi';
  return `${libFormatAgoTR(iso)} ${en ? 'ago' : 'önce'}`;
}
// Every story's category, not just DÜNYA: Kütüphane's left column is the
// whole newsroom now (see loadDunyaNews), so a card has to say which layer
// it belongs to -- İstanbul, Türkiye, a district, or the world.
function newsCategoryLabel(n) {
  const c = n.category || n.neighborhood || 'turkiye';
  if (c === 'turkiye') return 'TÜRKİYE';
  if (c === 'istanbul') return 'İSTANBUL';
  if (c === 'dunya') return 'DÜNYA';
  return (neighborhoodNames[c] || c).toLocaleUpperCase('tr-TR');
}
function dunyaKickerLabel(n) {
  const seriesName = n.breaking_news_series && n.breaking_news_series.name;
  return seriesName ? seriesName.toLocaleUpperCase('tr-TR') : newsCategoryLabel(n);
}
function libSafeUrl(u) {
  const s = String(u || '').trim();
  return /^https?:\/\//i.test(s) ? s : null;
}

// ── Which countries a Dünya story is about ──
// The admin ticks them while posting it (db/breaking_news_countries.sql);
// opening the story here lights every one of them on the phone map, so a
// story about Suriye and Irak shows the reader where it is happening
// instead of naming two places they then have to find.
//
// Names are read off the map's own shapes rather than fetched from
// public.countries: the story then names a country with exactly the word
// the caption under the map prints when you touch it, and the feed costs
// one query, not two.
function newsCountryIds(n) {
  return (n.breaking_news_countries || []).map(c => c.country).filter(Boolean);
}

// A country can be several polygons (Türkiye's two halves, Yunanistan
// plus Girit, Azerbaycan plus Nahçıvan) -- data-country is what makes
// them one country, so all of them light together.
function countryShapes(countryId) {
  return document.querySelectorAll(`.country[data-country="${CSS.escape(countryId)}"]`);
}

// The one place a country id becomes a word: read off the map's own
// shapes rather than fetched from public.countries, so a story naming
// Lübnan and the caption printed when you touch Lübnan are the same word
// by construction. Used by the news feed and by the story pages alike --
// hence `map`, not `news`.
function mapCountryName(countryId) {
  const shape = countryShapes(countryId)[0];
  return (shape && shape.getAttribute('data-name')) || countryId;
}

// Lit for as long as the story's sheet is open. Cleared by whatever
// replaces it -- closing the sheet, or touching a country on the map,
// which opens that country's own page over the story.
function setNewsCountryHighlight(countryIds) {
  document.querySelectorAll('.country.news-active')
    .forEach(el => el.classList.remove('news-active'));
  (countryIds || []).forEach(id =>
    countryShapes(id).forEach(el => el.classList.add('news-active')));
}
function clearNewsCountryHighlight() { setNewsCountryHighlight([]); }

async function loadDunyaNews() {
  const feed = document.getElementById('dunya-news-feed');
  if (!feed) return;
  await ensureDealtLoaded();
  const cutoff = new Date(Date.now() - 72 * 3600 * 1000).toISOString();
  const { data, error } = await sb.from('breaking_news')
    .select('*, breaking_news_sources(*), breaking_news_updates(*), breaking_news_polls(*), breaking_news_series(name), breaking_news_countries(country)')
    .gte('updated_at', cutoff)
    .is('archived_at', null)
    .order('updated_at', { ascending: false });
  if (error) {
    console.error('[kutuphane news]', error);
    feed.innerHTML = `<div class="empty-state" style="padding:20px;font-size:0.78rem;">Haberler yüklenemedi.</div>`;
    return;
  }
  DUNYA_NEWS_CACHE = data || [];
  reconcileDealt();
  renderDunyaNewsFeed();
}

// ── What the reader has already dealt with ──
// A story leaves the deck when it is swiped away, not when it is opened:
// the arrow puts it back on top, a swipe is done with it. That has to
// survive a reload -- a deck that refills itself every time the app is
// reopened is a deck nobody can ever get to the bottom of, which is the
// opposite of what this app is for. Kept per member in localStorage, the
// same way chapter completion is (see libReadCompletedSet), and pruned to
// the stories still in the 72h window so it cannot grow without end.
//
// What is remembered is not "this story is done" but **the state of it
// that was done with**: the story's own updated_at at the moment it was
// thrown. A story the admin has since moved on (a gelişme lands on the
// timeline and bumps breaking_news.updated_at -- see addNewsUpdate in
// admin.html, where a backdated one deliberately doesn't) is not the
// story the reader dealt with, so it comes back, and comes back on top of
// the deck because the deck is ordered by that same column. A story that
// has not moved stays gone.
const DEALT_KEY_PREFIX = 'dunya_dealt_';
let _dealt = new Map();   // story id -> the updated_at that was dealt with
let _dealtKey = null;

async function ensureDealtLoaded() {
  if (_dealtKey) return;
  const uid = await libGetCurrentUserId();
  _dealtKey = DEALT_KEY_PREFIX + (uid || 'anon');
  try {
    const raw = JSON.parse(localStorage.getItem(_dealtKey) || '{}');
    // A plain array is the first version of this store, which remembered
    // only that a story was dealt with. Those come in stampless and are
    // given the story's current updated_at on the next fetch (see
    // reconcileDealt) -- "you dealt with it as it stands", which is the
    // only honest reading of a record that never had a stamp.
    if (Array.isArray(raw)) raw.forEach(id => _dealt.set(String(id), null));
    else if (raw && typeof raw === 'object') {
      Object.keys(raw).forEach(id => _dealt.set(String(id), raw[id] || null));
    }
  } catch (e) { /* unreadable store: start the deck full */ }
}

function saveDealtIds() {
  if (!_dealtKey) return;
  const obj = {};
  _dealt.forEach((stamp, id) => { obj[id] = stamp; });
  try { localStorage.setItem(_dealtKey, JSON.stringify(obj)); } catch (e) {}
}

// Drops what has fallen out of the 72h window (what is dealt with is only
// ever about what is on the table) and stamps anything the older store
// left stampless. Run once per fetch, against the rows just returned.
function reconcileDealt() {
  let changed = false;
  const live = new Map(DUNYA_NEWS_CACHE.map(n => [String(n.id), n.updated_at || n.created_at]));
  _dealt.forEach((stamp, id) => {
    if (!live.has(id)) { _dealt.delete(id); changed = true; return; }
    if (!stamp) { _dealt.set(id, live.get(id)); changed = true; }
  });
  if (changed) saveDealtIds();
}

// True while the story is still the one the reader threw away. Compared as
// dates rather than as strings: PostgREST is free to hand back the same
// instant as ...Z or as +00:00, and one of those sorts above the other.
function newsIsDealt(n) {
  const stamp = _dealt.get(String(n.id));
  if (stamp === undefined) return false;
  if (!stamp) return true;
  return new Date(n.updated_at || n.created_at) <= new Date(stamp);
}

// The deck: what the reader hasn't dealt with, newest first. Sorted here
// rather than left to the query's own order, because "the newest story is
// the one on top" is the deck's rule and not a side effect of how its
// rows happened to arrive.
function undealtNews() {
  return DUNYA_NEWS_CACHE.filter(n => !newsIsDealt(n))
    .slice()
    .sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
}

// Takes the front card out of the deck without re-rendering it. The two
// behind it are already in the DOM at their own depths, so removing this
// node re-runs the nth-child rules and they TRANSITION forward a step --
// which is the whole reason the deck's depth is expressed as position
// rather than as a class the JS has to reassign.
function dealDeckCard(story) {
  const id = String(story.id);
  // The stamp is the story AS THROWN. The next gelişme moves it past this
  // and the story comes back -- that is the whole of "a story returns only
  // when it has actually moved".
  _dealt.set(id, story.updated_at || story.created_at || new Date().toISOString());
  saveDealtIds();
  const feed = document.getElementById('dunya-news-feed');
  if (!feed) return;
  const node = feed.querySelector(`.article[data-news-id="${CSS.escape(id)}"]`);
  if (node) node.remove();
  if (!feed.querySelector('.article')) feed.innerHTML = deckDoneHTML();
}

function deckDoneHTML() {
  return `
    <div class="deck-done">
      <div class="deck-done-line">Hepsi bu kadar.</div>
      <div class="deck-done-sub">Dışarısı seni bekliyor.</div>
    </div>
  `;
}

function renderDunyaNewsFeed() {
  const feed = document.getElementById('dunya-news-feed');
  if (!feed) return;
  const rows = undealtNews();
  animateFeedSwap(feed, 'right', () => {
    if (!rows.length) {
      // Two different empties, and they are not the same thing: no news at
      // all leaves the column blank so the map behind it stays clear,
      // while a deck the reader emptied themselves gets told so.
      feed.innerHTML = DUNYA_NEWS_CACHE.length ? deckDoneHTML() : '';
      return;
    }
    const rowsById = new Map(rows.map(n => [String(n.id), n]));
    feed.innerHTML = rows.map(n => {
      const lastTouch = n.updated_at || n.created_at;
      return `
        <div class="article openable" data-news-id="${libEsc(n.id)}">
          <div class="meta-row">
            <div class="kicker">${libEsc(dunyaKickerLabel(n))}</div>
            <div class="ago" data-iso="${libEsc(lastTouch)}">${libEsc(libFormatNewsAge(lastTouch))}</div>
          </div>
          <h3>${libEsc(n.title)}</h3>
          ${n.body ? `<p>${libEsc(n.body)}</p>` : ''}
        </div>
      `;
    }).join('');
    feed.querySelectorAll('.article.openable').forEach(el => {
      wireCardPress(el);
      const n = rowsById.get(el.dataset.newsId);
      if (!n) return;
      // The card is passed along: on a phone it is what the page grows
      // out of (see growNewsPage).
      el.addEventListener('click', () => openDunyaNewsDetail(n, el));
    });
  });
}

// A card presses like a button (see .article.openable in the stylesheet).
// Driven from pointer events rather than :hover/:active because a touch
// screen has no way to take either back: the state stays on the element
// after the tap, and the card sits pressed -- or, in the sideways nudge
// this replaced, sits offset -- behind the page it just opened.
function wireCardPress(card) {
  card.addEventListener('pointerdown', () => {
    card.classList.remove('released');
    card.classList.add('pressing');
  });
  // Lifting the finger is the only thing that pops: a press that ended
  // because the feed started scrolling under it (pointercancel) or because
  // the pointer left the card was never a press, and springing it open
  // would announce something the reader didn't do.
  card.addEventListener('pointerup', () => {
    if (!card.classList.contains('pressing')) return;
    card.classList.remove('pressing');
    card.classList.add('released');
  });
  const quiet = () => card.classList.remove('pressing');
  ['pointercancel', 'pointerleave'].forEach(ev => card.addEventListener(ev, quiet));
  card.addEventListener('animationend', () => card.classList.remove('released'));
}

function tickDunyaNewsAgo() {
  // The open story's own head carries the same stamp its card does, so it
  // ages with the feed rather than freezing at whatever it said when the
  // page opened. Only the head: the Zaman Akışı below prints its moments
  // with libFormatAgoTRLong, a different sentence entirely.
  document.querySelectorAll('#dunya-news-feed .ago[data-iso], .news-page-head .ago[data-iso]').forEach(el => {
    el.textContent = libFormatNewsAge(el.dataset.iso);
  });
}

// ══════════════════════════════════════════════════════════════════
// THE NEWS PAGE — the three pieces a story is printed in.
//
// A story used to open as one .article inside the reader sheet: the feed
// card again, full-size, with everything (countries, Zaman Akışı,
// sources) stacked down it in one scroll. It is a page of its own now —
// head / body / foot — because on a phone it opens INSIDE the band the
// feed lies in (see openDunyaNewsDetail and "THE NEWS PAGE" in the
// stylesheet) and a page that short cannot afford to scroll the two
// things the reader needs kept in view off the top and bottom of itself:
// what the story is, and where it is happening.
// ══════════════════════════════════════════════════════════════════

// The chain of updates and polls a story has grown, newest first. Same
// .timeline-* markup a country entry's Zaman Akışı uses, and the poll
// containers keep their #dunya-poll-<id> ids so loadAndRenderDunyaPoll
// finds them wherever the timeline is printed.
function newsTimelineHTML(n) {
  const timelineEvents = (n.breaking_news_updates || []).map(u => ({ type: 'update', created_at: u.created_at, data: u }))
    .concat((n.breaking_news_polls || []).map(p => ({ type: 'poll', created_at: p.created_at, data: p })))
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  if (!timelineEvents.length) return '';
  return `
    <div class="timeline">
      <div class="sidebar-label" style="padding:0 0 6px 0;background:none;border:none;font-size:0.6rem;letter-spacing:2px;">Zaman Akışı</div>
      <div class="timeline-track">
        ${timelineEvents.map(ev => ev.type === 'poll' ? `
          <div class="timeline-item timeline-item-poll">
            <div class="timeline-item-date">
              <span class="timeline-tick"></span>
              <div class="ago" data-iso="${libEsc(ev.created_at)}">${libEsc(libFormatAgoTRLong(ev.created_at))}</div>
            </div>
            <div class="poll-block" id="dunya-poll-${libEsc(ev.data.id)}"></div>
          </div>
        ` : `
          <div class="timeline-item">
            <div class="timeline-item-date">
              <span class="timeline-tick"></span>
              <div class="ago" data-iso="${libEsc(ev.created_at)}">${libEsc(libFormatAgoTRLong(ev.created_at))}</div>
            </div>
            <strong>${libEsc(ev.data.title)}</strong>
            ${ev.data.body ? `<p>${libEsc(ev.data.body)}</p>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// The countries the map is lighting behind this page, named. On a phone
// this is the caption to that highlight, printed on the page's own bottom
// line directly under it; on a desktop, where the world map isn't the
// drawing on screen, it is the whole of it.
function newsCountriesHTML(countryIds) {
  if (!countryIds.length) return '';
  return `
    <div class="news-countries">
      ${countryIds.map(id =>
        // Cased in JS with tr-TR, like the kicker above it: leaving it to
        // CSS turns Sırbistan's dotless ı and dotted i into the wrong
        // letters on any engine that doesn't read the page's lang.
        `<span>${libEsc(mapCountryName(id).toLocaleUpperCase('tr-TR'))}</span>`).join('')}
    </div>
  `;
}

function buildNewsPageHtml(n) {
  const sources = (n.breaking_news_sources || [])
    .slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  const sourcesHtml = sources.length
    ? sources.map(s => {
        const url = libSafeUrl(s.url);
        const inner = `<span class="src-name">${libEsc(s.name)}</span>${libEsc(s.headline)}`;
        return `<div class="src-item">${
          url ? `<a href="${libEsc(url)}" target="_blank" rel="noopener">${inner}</a>` : inner
        }</div>`;
      }).join('')
    : '<div class="sources-empty">Henüz kaynak eklenmedi.</div>';
  const lastTouch = n.updated_at || n.created_at;
  const countriesHtml = newsCountriesHTML(newsCountryIds(n));
  // The foot only exists where there is something to put on it: a district
  // story with no sources yet would otherwise end on an empty rule.
  const footHtml = (countriesHtml || sources.length) ? `
    <div class="news-page-foot">
      ${countriesHtml || '<span></span>'}
      ${sources.length ? `
        <button type="button" class="news-page-sources-btn" id="news-page-sources-btn" aria-expanded="false">
          ${libEsc(I18N.t('news.sources'))} (${sources.length})<span class="news-sources-caret">▴</span>
        </button>
      ` : ''}
    </div>
    ${sources.length ? `
      <div class="news-page-drawer" id="news-page-drawer">
        <div class="sidebar-label" style="font-size:0.6rem;letter-spacing:2px;">${libEsc(I18N.t('news.sources'))}</div>
        ${sourcesHtml}
      </div>
    ` : ''}
  ` : '';
  return `
    <div class="news-page-head">
      <button class="news-page-back" type="button" id="news-page-back"
              aria-label="Kütüphane" title="Kütüphane"><img src="assets/back.png" alt=""/></button>
      <div class="kicker">${libEsc(dunyaKickerLabel(n))}</div>
      <div class="ago" data-iso="${libEsc(lastTouch)}">${libEsc(libFormatNewsAge(lastTouch))}</div>
    </div>
    <div class="news-page-body" id="news-page-body">
      <h2 class="news-page-title">${libEsc(n.title)}</h2>
      ${n.body ? `<p>${libEsc(n.body)}</p>` : ''}
      ${newsTimelineHTML(n)}
    </div>
    ${footHtml}
    <div class="news-swipe-cue news-swipe-cue-a" id="news-cue-a"></div>
    <div class="news-swipe-cue news-swipe-cue-b" id="news-cue-b"></div>
  `;
}

// ── The grow ──
// On a phone the page is already sitting exactly where it will end up —
// the whole band under the map. What animates is the window onto it: a
// clip-path inset that starts as the tapped card's own box and opens out
// to the page's four edges, so the card the reader pressed becomes the
// page they are reading. The same move (and the same reasoning about why
// it is animated from JS rather than by a CSS transition between two
// classes) as the PETEK button on Hane — see growHive in profile-card.js.
//
// Off on desktop, where there is no band and the page is THE sheet
// rising from the bottom as usual.
const NEWS_GROW_MS = 380;
const NEWS_GROW_EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
let _newsOrigin = null;   // the feed card this page grew out of
let _newsAnims = [];

function newsPageGrows() {
  return window.matchMedia('(max-width: 768px)').matches
    && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// The card's box, expressed as an inset into the page's own box. Clamped
// at zero: a card scrolled part-way out of the band opens from that edge
// rather than from a negative inset, which clip-path reads as an
// overflow instead.
function newsOriginInset(page) {
  if (!page || !_newsOrigin || !_newsOrigin.isConnected) return null;
  const b = _newsOrigin.getBoundingClientRect();
  const s = page.getBoundingClientRect();
  if (!b.width || !b.height || !s.width || !s.height) return null;
  const px = (v) => Math.max(0, v).toFixed(2) + 'px';
  return `inset(${px(b.top - s.top)} ${px(s.right - b.right)} ${px(s.bottom - b.bottom)} ${px(b.left - s.left)})`;
}

function cancelNewsAnims() {
  _newsAnims.forEach(a => { try { a.cancel(); } catch (e) {} });
  _newsAnims = [];
}

// dir: 'in' when the card becomes the page, 'out' when the page folds
// back into it. The contents cross-fade rather than being drawn squeezed
// inside a card-sized window: out fast, in once the page has most of its
// room.
function growNewsPage(dir) {
  const page = document.getElementById('news-page');
  const inner = document.getElementById('news-page-inner');
  cancelNewsAnims();
  if (!page || !inner || !newsPageGrows() || !page.animate) return;
  const shut = newsOriginInset(page);
  if (!shut) return;
  const wide = 'inset(0px)';
  const opts = { duration: NEWS_GROW_MS, easing: NEWS_GROW_EASE };
  // 'out' holds the collapsed frame after it finishes: IstSheet.close
  // re-hides the overlay a little later (0.55s), and without the fill the
  // page would snap back to full size for those last frames.
  _newsAnims.push(page.animate(
    dir === 'in' ? [{ clipPath: shut }, { clipPath: wide }] : [{ clipPath: wide }, { clipPath: shut }],
    dir === 'in' ? opts : Object.assign({ fill: 'forwards' }, opts)));
  _newsAnims.push(inner.animate(
    dir === 'in'
      ? [{ opacity: 0 }, { opacity: 0, offset: 0.3 }, { opacity: 1 }]
      : [{ opacity: 1 }, { opacity: 0, offset: 0.45 }, { opacity: 0 }],
    Object.assign({ fill: 'forwards' }, opts)));
}

// Where the page's two sides fall, measured off the feed's own content
// box rather than restated as the sum of the frame pad and the feed's
// padding: the page has to come out of the card with its sides already
// on the card's sides, and one number written in two places is how those
// end up a couple of pixels apart. Cleared on desktop, where the page is
// THE sheet and sheet.css owns its geometry.
function measureNewsPageBand() {
  const overlay = document.getElementById('news-overlay');
  if (!overlay) return;
  const feed = document.getElementById('dunya-news-feed');
  if (!window.matchMedia('(max-width: 768px)').matches || !feed) {
    overlay.style.removeProperty('--news-page-left');
    overlay.style.removeProperty('--news-page-width');
    return;
  }
  const r = feed.getBoundingClientRect();
  const cs = getComputedStyle(feed);
  const left = r.left + parseFloat(cs.paddingLeft || 0);
  const width = r.width - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
  if (!(width > 0)) return;
  overlay.style.setProperty('--news-page-left', left.toFixed(2) + 'px');
  overlay.style.setProperty('--news-page-width', width.toFixed(2) + 'px');
}

// ══════════════════════════════════════════════════════════════════
// THE SWIPE — how a story leaves the deck
//
// The arrow at the top of the page puts a story back on the deck; a
// swipe is done with it. That is the whole rule, and it is what makes
// the stack finite: the reader deals with one story, it goes, the next
// one is already standing there.
//
// Where the story is asking something (a poll it has grown, see
// breaking_news_polls), the direction is the answer -- right is the
// first option, left is the second -- and the option the throw is
// heading toward is stamped on the page as it moves, so nobody answers
// a question they never saw. A story with nothing open to answer swipes
// away just the same, with no stamp: the gesture is "next" first and an
// opinion only where one was asked for.
// ══════════════════════════════════════════════════════════════════
const NEWS_SWIPE_DEAL_PX = 84;    // throw past this and the story is dealt
const NEWS_SWIPE_DEAL_VEL = 0.55; // ...or a flick this fast (px/ms)
const NEWS_SWIPE_FLY_MS = 300;
let _newsStory = null;            // the story the open page is printing
let _newsPollMine = new Map();    // poll id -> the reader's own vote, or null
let _newsDealing = false;

// The newest question on the open story the reader hasn't answered.
// Newest rather than first: a story's later polls are the ones its
// timeline has just grown, so that is the question it is currently
// asking. Only polls whose votes have actually come back are considered
// -- an unloaded poll is not an unanswered one.
function newsOpenPoll() {
  const polls = (_newsStory && _newsStory.breaking_news_polls) || [];
  return polls.slice()
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
    .find(p => _newsPollMine.has(String(p.id)) && _newsPollMine.get(String(p.id)) == null) || null;
}

function paintNewsSwipeCues() {
  const a = document.getElementById('news-cue-a');
  const b = document.getElementById('news-cue-b');
  if (!a || !b) return;
  const poll = newsOpenPoll();
  a.textContent = poll ? poll.option_a : '';
  b.textContent = poll ? poll.option_b : '';
}

function setNewsSwipeCueOpacity(dx) {
  const a = document.getElementById('news-cue-a');
  const b = document.getElementById('news-cue-b');
  const p = Math.min(1, Math.abs(dx) / NEWS_SWIPE_DEAL_PX);
  if (a) a.style.opacity = dx > 0 ? p : 0;
  if (b) b.style.opacity = dx < 0 ? p : 0;
}

// One vote, cast on the way out. Deliberately not awaited by the deal:
// the story is gone from the deck either way, and holding the animation
// on a round trip would make the gesture feel like it needs permission.
async function castNewsSwipeVote(poll, option) {
  const uid = await libGetCurrentUserId();
  if (!uid) return;
  _newsPollMine.set(String(poll.id), option);
  const { error } = await sb.from('breaking_news_poll_option_votes')
    .insert([{ poll_id: poll.id, user_id: uid, option }]);
  // A duplicate is not a failure here: the reader may have answered the
  // same poll from its own buttons before swiping.
  if (error && error.code !== '23505') console.error('[news swipe vote]', error);
}

// dir: +1 thrown right, -1 thrown left.
function dealNewsPage(dir) {
  const page = document.getElementById('news-page');
  if (!page || _newsDealing) return;
  _newsDealing = true;
  const story = _newsStory;
  const poll = newsOpenPoll();
  if (poll) castNewsSwipeVote(poll, dir > 0 ? 1 : 2);
  // The deck advances BEHIND the page while it is still on its way out,
  // so the next story is already standing there as the paper clears it
  // -- rather than the band being empty for a beat and then filling.
  if (story) dealDeckCard(story);
  const w = window.innerWidth || 400;
  page.style.transition = `transform ${NEWS_SWIPE_FLY_MS}ms ease-in, opacity ${NEWS_SWIPE_FLY_MS}ms ease-in`;
  page.style.transform = `translateX(${dir * (w + 140)}px) rotate(${dir * 7}deg)`;
  page.style.opacity = '0';
  setTimeout(() => {
    page.style.transition = '';
    page.style.transform = '';
    page.style.opacity = '';
    // Straight to hidden, never the fold-back: the story did not go back
    // into the card it came from, it left the deck.
    snapNewsPageShut();
    _newsDealing = false;
  }, NEWS_SWIPE_FLY_MS + 20);
}

// Touch phones only -- the same condition the pulled sheet uses, and for
// the same reason: a finger is the only thing that can throw a page.
function wireNewsPageSwipe() {
  const page = document.getElementById('news-page');
  if (!page) return;
  const mobile = window.matchMedia('(max-width: 768px) and (pointer: coarse)');
  let sx = 0, sy = 0, dx = 0, lastX = 0, lastT = 0, vel = 0;
  let dragging = false, axis = null;

  function render() {
    page.style.transform = `translateX(${dx}px) rotate(${dx * 0.014}deg)`;
    setNewsSwipeCueOpacity(dx);
  }

  function springBack() {
    page.style.transition = 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s';
    page.style.transform = '';
    setNewsSwipeCueOpacity(0);
    setTimeout(() => { if (!_newsDealing) page.style.transition = ''; }, 320);
  }

  page.addEventListener('touchstart', (e) => {
    if (!mobile.matches || e.touches.length !== 1 || _newsDealing) return;
    // The carousel's own swipe listens on the document (router.js, its
    // touchstart is what arms it): a horizontal drag on an open story is
    // that story's, not a page change, so it stops here.
    e.stopPropagation();
    dragging = true;
    axis = null;
    dx = 0;
    sx = lastX = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    lastT = e.timeStamp || performance.now();
    vel = 0;
    page.style.transition = 'none';
  }, { passive: true });

  page.addEventListener('touchmove', (e) => {
    if (!dragging || e.touches.length !== 1) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    // Which gesture this is gets decided once, on the first real movement,
    // and never revisited: the body scrolls vertically inside this page,
    // and a drag that kept changing its mind would fight the scroller.
    if (axis === null) {
      const adx = Math.abs(x - sx), ady = Math.abs(y - sy);
      if (adx < 6 && ady < 6) return;
      axis = adx > ady * 1.2 ? 'x' : 'y';
      if (axis === 'y') { dragging = false; page.style.transition = ''; return; }
    }
    const now = e.timeStamp || performance.now();
    const dt = now - lastT;
    // Weighted toward the newest sample so a flick's final speed wins over
    // the slow start of the same drag.
    if (dt > 0) vel = 0.7 * ((x - lastX) / dt) + 0.3 * vel;
    lastX = x;
    lastT = now;
    dx = x - sx;
    render();
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  const end = () => {
    if (!dragging) return;
    dragging = false;
    const flicked = Math.abs(vel) > NEWS_SWIPE_DEAL_VEL;
    const thrown = Math.abs(dx) > NEWS_SWIPE_DEAL_PX;
    if (!flicked && !thrown) { springBack(); return; }
    // A flick decides its own direction: a finger that started left and
    // ended up flicking right meant right.
    dealNewsPage((flicked ? vel : dx) > 0 ? 1 : -1);
  };
  page.addEventListener('touchend', end);
  page.addEventListener('touchcancel', end);
}

function openDunyaNewsDetail(n, cardEl) {
  const overlay = document.getElementById('news-overlay');
  const inner = document.getElementById('news-page-inner');
  if (!overlay || !inner) return;
  _newsOrigin = cardEl || null;
  _newsStory = n;
  _newsPollMine.clear();
  inner.innerHTML = buildNewsPageHtml(n);
  measureNewsPageBand();
  IstSheet.open(overlay);
  growNewsPage('in');
  const back = document.getElementById('news-page-back');
  if (back) back.addEventListener('click', () => closeNewsPage());
  // Light the story's countries on the map. The page sits in the band
  // BELOW the map rather than over it, so the drawing stays uncovered:
  // the reader sees where the story is happening for as long as they are
  // reading it, not only until the page arrives.
  setNewsCountryHighlight(newsCountryIds(n));
  (n.breaking_news_polls || []).forEach(p => loadAndRenderDunyaPoll(p));
}

function closeNewsPage() {
  const overlay = document.getElementById('news-overlay');
  const inner = document.getElementById('news-page-inner');
  if (!overlay || !inner || overlay.hidden) return;
  // Every way out lands here (the arrow, the backdrop, Escape, the map
  // opening something else), so the story's highlight goes out here
  // rather than at each of them.
  clearNewsCountryHighlight();
  growNewsPage('out');
  IstSheet.close(overlay, () => {
    inner.innerHTML = '';
    cancelNewsAnims();
    _newsOrigin = null;
    _newsStory = null;
  });
}

// Gone this frame, with no fold-back: for a swipe to another carousel
// page. The overlay is body-level and outlives the content swap (see
// router.js), so a story left open would stand over Hane's map for the
// half-second the ordinary close takes -- and fold back into a card that
// is no longer on the screen.
function snapNewsPageShut() {
  const overlay = document.getElementById('news-overlay');
  const page = document.getElementById('news-page');
  const inner = document.getElementById('news-page-inner');
  if (!overlay || !inner || overlay.hidden) return;
  clearNewsCountryHighlight();
  cancelNewsAnims();
  // Whatever a half-finished throw left on the page (see wireNewsPageSwipe)
  // -- the next story opens square in the band, never mid-flight.
  if (page) { page.style.transition = ''; page.style.transform = ''; page.style.opacity = ''; }
  overlay.classList.remove('open');
  overlay.hidden = true;
  inner.innerHTML = '';
  _newsOrigin = null;
  _newsStory = null;
}

// Wired once: the page's own chrome, and the two things that can take it
// away from underneath.
(function initNewsPage() {
  const overlay = document.getElementById('news-overlay');
  const inner = document.getElementById('news-page-inner');
  if (!overlay || !inner) return;
  const backdrop = document.getElementById('news-overlay-backdrop');
  if (backdrop) backdrop.addEventListener('click', () => closeNewsPage());
  wireNewsPageSwipe();
  // Bound to the overlay's own contents rather than to the document: this
  // page's markup is rebuilt on every open, and the three carousel pages
  // share one document (see router.js).
  inner.addEventListener('click', (e) => {
    const btn = e.target.closest('.news-page-sources-btn');
    if (!btn) return;
    const drawer = document.getElementById('news-page-drawer');
    if (!drawer) return;
    const open = drawer.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.isConnected && overlay.classList.contains('open')) closeNewsPage();
  });
  // The band's two sides move with the window (rotation, a resize), and
  // the page is pinned to them.
  window.addEventListener('resize', () => { if (!overlay.hidden) measureNewsPageBand(); });
  // The map stays live under an open story (the page covers the band, not
  // the drawing), so touching a country opens its own page in the reader
  // sheet over the top of this one. That sheet is the destination now:
  // fold this one away rather than leaving a story open underneath it.
  // Watched here, at the one place it can be seen, instead of trusting
  // seven separate reader-opening functions to remember.
  const reader = document.getElementById('reader-overlay');
  if (reader && window.MutationObserver) {
    new MutationObserver(() => { if (!reader.hidden) closeNewsPage(); })
      .observe(reader, { attributes: true, attributeFilter: ['hidden'] });
  }
}());

// Fetches a Dünya news poll's votes and renders either the voting buttons
// or the result bars into its #dunya-poll-<id> container -- mirrors
// anahane.html's loadAndRenderPoll, using libGetCurrentUserId() in place of
// window.__currentUser (this page never sets that global).
const MAX_POLL_VOTER_AVATARS = 6;

async function loadAndRenderDunyaPoll(poll) {
  const container = document.getElementById('dunya-poll-' + poll.id);
  if (!container) return;
  const { data, error } = await sb.from('breaking_news_poll_option_votes')
    .select('user_id, option').eq('poll_id', poll.id);
  if (error) { console.error('[dunya poll]', error); return; }
  const uid = await libGetCurrentUserId();
  const votersA = [], votersB = [];
  let mine = null;
  (data || []).forEach(v => {
    if (v.option === 1) votersA.push(v.user_id);
    else if (v.option === 2) votersB.push(v.user_id);
    if (uid && v.user_id === uid) mine = v.option;
  });

  let profilesById = new Map();
  const userIds = Array.from(new Set([...votersA, ...votersB]));
  if (mine != null && userIds.length) {
    const { data: profs, error: profErr } = await sb.from('profiles')
      .select('id, first_name, last_name, avatar_url, avatar_hair, avatar_hat, avatar_accessory, avatar_shirt').in('id', userIds);
    if (profErr) console.error('[dunya poll voter profiles]', profErr);
    else profilesById = new Map(profs.map(p => [p.id, p]));
  }

  renderDunyaPollInto(container, poll, votersA, votersB, mine, profilesById);
  // What the swipe on the open story would be answering: the newest
  // question the reader hasn't answered yet (see newsOpenPoll). Recorded
  // here rather than fetched a second time -- this is already the query
  // that knows it.
  _newsPollMine.set(String(poll.id), mine);
  paintNewsSwipeCues();
}

function buildDunyaVoterAvatarsHtml(userIds, profilesById) {
  const list = userIds.map(id => profilesById.get(id)).filter(Boolean);
  if (!list.length) return '';
  const shown = list.slice(0, MAX_POLL_VOTER_AVATARS);
  const extra = list.length - shown.length;
  const avatarsHtml = shown.map(p => {
    const name = capitalizeName([p.first_name, p.last_name].filter(Boolean).join(' ')) || 'Üye';
    const inner = IstAvatar.html(p.avatar_url, p.avatar_hair, p.avatar_hat, p.avatar_accessory, p.avatar_shirt);
    return `<span class="poll-voter-avatar" title="${libEsc(name)}">${inner}</span>`;
  }).join('');
  const moreHtml = extra > 0
    ? `<span class="poll-voter-avatar poll-voter-more" title="+${extra}">+${extra}</span>`
    : '';
  return avatarsHtml + moreHtml;
}

function renderDunyaPollInto(container, poll, votersA, votersB, mine, profilesById) {
  const countA = votersA.length, countB = votersB.length;
  const total = countA + countB;
  if (mine == null) {
    container.innerHTML = `
      <div class="poll-question">${libEsc(poll.question)}</div>
      <div class="poll-options">
        <button class="poll-opt-btn" type="button" data-option="1">${libEsc(poll.option_a)}</button>
        <button class="poll-opt-btn" type="button" data-option="2">${libEsc(poll.option_b)}</button>
      </div>
      <div class="poll-status"></div>
    `;
    container.querySelectorAll('.poll-opt-btn').forEach(btn => {
      btn.addEventListener('click', () => submitDunyaPollVote(poll, parseInt(btn.dataset.option, 10), container));
    });
  } else {
    const pctA = total ? Math.round((countA / total) * 100) : 0;
    const pctB = total ? 100 - pctA : 0;
    container.innerHTML = `
      <div class="poll-question">${libEsc(poll.question)}</div>
      <div class="poll-result-labels">
        <span class="poll-label-a${mine === 1 ? ' poll-label-mine' : ''}">${libEsc(poll.option_a)} · ${pctA}%</span>
        <span class="poll-label-b${mine === 2 ? ' poll-label-mine' : ''}">${pctB}% · ${libEsc(poll.option_b)}</span>
      </div>
      <div class="poll-bar-track">
        <div class="poll-bar-fill-a" style="width:${pctA}%"></div>
        <div class="poll-bar-fill-b" style="width:${pctB}%"></div>
      </div>
      <div class="poll-voters-row">
        <div class="poll-voters poll-voters-a">${buildDunyaVoterAvatarsHtml(votersA, profilesById)}</div>
        <div class="poll-voters poll-voters-b">${buildDunyaVoterAvatarsHtml(votersB, profilesById)}</div>
      </div>
    `;
  }
}

async function submitDunyaPollVote(poll, option, container) {
  const uid = await libGetCurrentUserId();
  if (!uid) return;
  container.querySelectorAll('.poll-opt-btn').forEach(b => b.disabled = true);
  const { error } = await sb.from('breaking_news_poll_option_votes')
    .insert([{ poll_id: poll.id, user_id: uid, option }]);
  if (error) {
    console.error('[dunya poll vote]', error);
    const statusEl = container.querySelector('.poll-status');
    if (statusEl) {
      statusEl.textContent = 'Oy kaydedilemedi, tekrar deneyin.';
      statusEl.className = 'poll-status err';
    }
    container.querySelectorAll('.poll-opt-btn').forEach(b => b.disabled = false);
    return;
  }
  loadAndRenderDunyaPoll(poll);
}

// ── Sequential chapter unlock state (per-user, localStorage) ──
// Members must read chapters in order: chapter N+1 stays locked until
// chapter N is finished. Completion is recorded when the reader reaches
// the "Tamamlandı" terminal step. Stored client-side per user id; a DB
// table can replace this later if cross-device sync becomes a need.
async function libGetCurrentUserId() {
  const { data: { session } } = await sb.auth.getSession();
  return session?.user?.id || null;
}
function libCompletionStorageKey(userId) {
  return 'lib_chapter_completed_' + userId;
}
function libReadCompletedSet(userId) {
  if (!userId) return new Set();
  try {
    const raw = localStorage.getItem(libCompletionStorageKey(userId));
    const arr = raw ? JSON.parse(raw) : [];
    return new Set(Array.isArray(arr) ? arr : []);
  } catch (e) {
    return new Set();
  }
}
function libWriteArticleCompleted(userId, articleId) {
  if (!userId || !articleId) return;
  const set = libReadCompletedSet(userId);
  if (set.has(articleId)) return;
  set.add(articleId);
  try {
    localStorage.setItem(libCompletionStorageKey(userId), JSON.stringify([...set]));
  } catch (e) {}
}

// Chapter intro modal: previews the chapter (number, title, description)
// before the reader pane mounts, so the reader knows what they're entering.
function showChapterIntro(article, index, onStart) {
  const overlay = document.createElement('div');
  overlay.className = 'chapter-intro-overlay';
  const description = (article.summary && article.summary.trim())
    ? libEsc(article.summary)
    : 'Bu bölüm için henüz bir açıklama yazılmadı.';
  overlay.innerHTML = `
    <div class="chapter-intro" role="dialog" aria-modal="true" aria-label="Bölüm ${index + 1}">
      <div class="chapter-intro-step">Bölüm ${index + 1}</div>
      <h3 class="chapter-intro-title">${libEsc(article.title)}</h3>
      <div class="chapter-intro-body">${description}</div>
      <div class="chapter-intro-actions">
        <button class="chapter-intro-btn secondary" type="button" data-act="cancel">İptal</button>
        <button class="chapter-intro-btn" type="button" data-act="start">Okumaya Başla</button>
      </div>
    </div>
  `;
  function close() { overlay.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('[data-act="cancel"]').addEventListener('click', close);
  overlay.querySelector('[data-act="start"]').addEventListener('click', () => {
    close();
    onStart();
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(overlay);
}

// On mobile the sheet should rise right up under the profile bar at the
// top of the screen (#ist-pc-mount), with the same gap below the bar as
// the sheet's own left/right gap -- the bar's height varies with the
// device's notch inset, so that gap has to be measured rather than
// hardcoded. No-ops (clears the inline override)
// above the mobile breakpoint, where the sheet is centered/floating
// and doesn't sit under the card at all.
async function openShelfPath(shelfId) {
  const overlay = document.getElementById('reader-overlay');
  const area = document.getElementById('reader-overlay-sheet');
  if (!overlay || !area) return;
  const shelf = SHELVES_CACHE.find(s => s.id === shelfId);

  // Rise the sheet right away with a spinner — the chapter list (or the
  // reader directly, for a single-article shelf) fills it in once the
  // fetch resolves, so this gets the same page-rising treatment as the
  // reader itself instead of appearing flat in the center column.
  area.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
  IstSheet.open(overlay);
  _closeReaderOverlay = closeReaderOverlay;

  const { data: articles, error } = await sb.from('library_articles')
    .select('*').eq('shelf_id', shelfId)
    .order('position', { ascending: true })
    .order('created_at', { ascending: false });
  if (error) {
    area.innerHTML = `
      <div class="shelf-path">
        ${arrowHeadHTML(null, 'path-back', 'Raflar')}
        <div class="empty-state">Yüklenemedi.</div>
      </div>
    `;
    document.getElementById('path-back').addEventListener('click', () => renderShelfButtons());
    return;
  }
  if (!articles || !articles.length) {
    area.innerHTML = `
      <div class="shelf-path">
        ${arrowHeadHTML((shelf && shelf.name_tr && shelf.name_tr.trim()) || `Raf ${shelfId}`, 'path-back', 'Raflar')}
        <div class="empty-state">Bu rafta henüz makale yok.</div>
      </div>
    `;
    document.getElementById('path-back').addEventListener('click', () => renderShelfButtons());
    return;
  }

  // Compute lock state: a chapter unlocks only after the previous one
  // has been completed. The first chapter is always open.
  const userId = await libGetCurrentUserId();
  const completedSet = libReadCompletedSet(userId);
  const lockState = articles.map((a, i) => {
    if (i === 0) return false;
    return !completedSet.has(articles[i - 1].id);
  });

  if (articles.length === 1) {
    // Chapters aren't mandatory: a shelf with a single article (e.g. a
    // standalone letter) has nothing to pick between, so it skips the
    // table of contents and opens straight into the reader.
    openArticleReader(articles[0], shelf, shelfId, articles, lockState, completedSet);
    return;
  }

  renderShelfPathView(shelf, shelfId, articles, lockState, completedSet);
}

// Closes the reader overlay entirely, whichever view (shelf list, table of
// contents, reader, Dünya detail, ...) is currently showing.
// The phone pull: the reader sheet (a shelf, an article, a letter, the
// meclis, a politician) rests under the map and is dragged up from
// there, exactly as a news item does on Anahane — one gesture for every
// page that opens over a map (see IstSheet.pull in sheet.js). Attached
// once; IstSheet.open/close drive it from then on.
IstSheet.pull('reader-overlay', { onDismiss: closeReaderOverlay });

function closeReaderOverlay() {
  const overlay = document.getElementById('reader-overlay');
  const area = document.getElementById('reader-overlay-sheet');
  if (!overlay || !area) return;
  // Every way out of the sheet lands here (back button, backdrop, Escape,
  // dragging it down), so the highlight a country page lit is dropped
  // here rather than at each of them.
  clearNewsCountryHighlight();
  // Same for the selection the map made when the reader touched a country
  // to open this sheet: what is lit is what is open, so the tint and the
  // caption go out with the page they belong to. Without this the country
  // stayed inked after the sheet slid away -- the backdrop covers the map,
  // so the tap that closed the sheet never reached the map to clear it, and
  // it took a second tap on empty sea to put the map back.
  if (_mapSelectionOpenedSheet && window.__istResetMapLabel) window.__istResetMapLabel();
  // Content is cleared only once the sheet is off-screen, so it doesn't
  // empty mid-slide (see sheet.js).
  IstSheet.close(overlay, () => { area.innerHTML = ''; });
}

// rises from the bottom like the reader itself. Reused both when a shelf

function renderShelfPathView(shelf, shelfId, articles, lockState, completedSet) {
  const area = document.getElementById('reader-overlay-sheet');
  if (!area) return;
  const title = (shelf && shelf.name_tr && shelf.name_tr.trim()) || `Raf ${shelfId}`;
  const subtitle = shelf && shelf.subtitle_tr ? shelf.subtitle_tr.trim() : '';

      <div class="path-list">
        ${articles.map((a, i) => {
          const meta = [
            a.author ? libEsc(a.author) : null,
          ].filter(Boolean).join(' · ');

          const completed = completedSet.has(a.id);
          const badge = locked
            ? `<div class="path-lock">Kilitli</div>`

}

// Body parser: splits on lines that contain only --- into sections,
// then within each section converts [[word::definition]] into vocab tooltips.
function parseArticleSections(body) {
  if (!body) return [];
  const raw = String(body).replace(/\r\n/g, '\n');
  const parts = raw.split(/\n\s*---\s*\n/);
  return parts.map(p => p.trim()).filter(p => p.length > 0);
}

// Body parser: vote widgets (must sit on their own line) are block-level,
// vocab tooltips are inline. Splitting by line first keeps the vote block
// out of any wrapping <p> tag — block elements inside <p> would render
// fine in most browsers but break the source-order assumption when the
// browser auto-closes the paragraph.
function renderInlineBody(text) {
  const lines = String(text).replace(/\r\n/g, '\n').split('\n');
  const voteLineRe = /^\s*\[\[vote::([^\]]+?)::(-?\d+)::(-?\d+)\]\]\s*$/;
  const imgLineRe = /^\s*\[\[img::(\S+?)\]\]\s*$/;
  const parts = [];
  let buf = [];
  function flushText() {
    if (!buf.length) return;
    const escaped = libEsc(buf.join('\n'));
    const withVocab = escaped.replace(/\[\[([^|\]]+?)::([^\]]+?)\]\]/g, (_m, word, def) =>
      `<span class="vocab-term" tabindex="0">${word.trim()}<span class="vocab-pop">${def.trim()}</span></span>`
    );
    parts.push(withVocab.split(/\n{2,}/).map(p =>
      p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : ''
    ).join(''));
    buf = [];
  }
  for (const line of lines) {
    const voteMatch = line.match(voteLineRe);
    const imgMatch = !voteMatch && line.match(imgLineRe);
    if (voteMatch) {
      flushText();
      parts.push(`<div class="vote-widget" data-q="${libEsc(voteMatch[1].trim())}" data-min="${voteMatch[2]}" data-max="${voteMatch[3]}" data-answered="0"></div>`);
    } else if (imgMatch) {
      flushText();
      parts.push(`<img class="body-img" src="${libEsc(imgMatch[1])}" alt="" loading="lazy">`);
    } else {
      buf.push(line);
    }
  }
  flushText();
  return parts.join('');
}

// Build the inner UI for every empty .vote-widget container in `root`.
// Each widget is a row of person icons (one per vote slot) + a slider
// 0..count. Moving the slider flips the leftmost N icons green ("yes")
// while the rest stay red ("no"); reader-next is gated on the widget
// being answered (any interaction sets data-answered = "1").
function hydrateVoteWidgets(root, onAnswerChange) {
  root.querySelectorAll('.vote-widget[data-q]').forEach(w => {
    if (w.dataset.hydrated === '1') return;
    w.dataset.hydrated = '1';
    const q = w.dataset.q;
    const min = Number(w.dataset.min || 0);
    const max = Number(w.dataset.max || 10);
    const count = Math.max(0, max - min);
    const peopleHtml = Array.from({ length: count }, () =>
      `<svg class="vote-person" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M3 22c0-5 4-8 9-8s9 3 9 8z"/></svg>`
    ).join('');
    w.innerHTML = `
      <div class="vote-q">${q}</div>
      <div class="vote-people">${peopleHtml}</div>
      <div class="vote-controls">
        <input type="range" class="vote-slider" min="${min}" max="${max}" step="1" value="${min}" aria-label="${q}"/>
        <div class="vote-readout">${min} / ${max}</div>
      </div>
    `;
    const slider = w.querySelector('.vote-slider');
    const readout = w.querySelector('.vote-readout');
    const persons = w.querySelectorAll('.vote-person');
    function paint(markAnswered) {
      const v = Number(slider.value);
      readout.textContent = `${v} / ${max}`;
      persons.forEach((p, i) => p.classList.toggle('yes', i < (v - min)));
      if (markAnswered) {
        w.dataset.answered = '1';
        if (onAnswerChange) onAnswerChange();
      }
    }
    slider.addEventListener('input', () => paint(true));
    slider.addEventListener('change', () => paint(true));
    // Track-click that lands on the default value doesn't fire 'input';
    // pointerdown ensures we still register the interaction as an answer.
    slider.addEventListener('pointerdown', () => paint(true));
    paint(false);
  });
}

function openArticleReader(article, shelf, shelfId, articles, lockState, completedSet) {
  const overlay = document.getElementById('reader-overlay');
  const area = document.getElementById('reader-overlay-sheet');
  if (!overlay || !area) return;

  // Multi-chapter shelves: the in-sheet back button returns to the table
  // of contents (still inside the same sheet, no close/reopen) so a
  // freshly-completed chapter's unlock state shows immediately. A
  // single-article shelf has no table of contents to return to, so its
  // back button closes the sheet outright. Backdrop click / Esc always
  // close the sheet fully, regardless of which view is showing.
  const hasChapters = articles && articles.length > 1;
  function backToPath() {
    if (hasChapters) {
      renderShelfPathView(shelf, shelfId, articles, lockState, completedSet);
    } else {
      closeReaderOverlay();
    }
  }
  _closeReaderOverlay = closeReaderOverlay;

  const sections = parseArticleSections(article.body || '');
  // Always render at least one section so the reader has something to show.
  if (!sections.length) sections.push(article.summary || '');

  // Track which step the reader is on; the poll lives one step past the
  // last section so progress shows 100% once they reach it.
  let step = 0;
  const lastSectionIdx = sections.length - 1;
  const hasPoll = article.poll && article.poll.question && Array.isArray(article.poll.options) && article.poll.options.length >= 2;
  const totalSteps = sections.length + (hasPoll ? 1 : 0);

  function renderStep() {
    const onPoll = hasPoll && step === sections.length;
    const progressPct = Math.round(((step + 1) / totalSteps) * 100);
    const remainingPct = 100 - progressPct;
    const byline = [
      article.author ? libEsc(article.author) : null,
      article.published_at ? libEsc(formatLibDate(article.published_at)) : null,
    ].filter(Boolean).join(' · ');

    const stepLabel = onPoll
      ? 'Anket'
      : `Bölüm ${step + 1} / ${sections.length}`;

    let content;
    if (onPoll) {
      content = `<div class="reader-poll" id="poll-mount"></div>`;
    } else {
      const sectionHtml = renderInlineBody(sections[step]);
      const isFirst = step === 0;
      content = `
        ${isFirst ? `
          ${byline ? `<div class="reader-byline">${byline}</div>` : ''}
          <h1 class="reader-title">${libEsc(article.title)}</h1>
          ${article.summary ? `<div class="reader-summary">${libEsc(article.summary)}</div>` : ''}
        ` : ''}
        <div class="reader-section-body">${sectionHtml}</div>
      `;
    }

    const isLastSection = step === lastSectionIdx && !hasPoll;
    const nextLabel = onPoll ? 'Bitti' : (isLastSection ? 'Bitti' : 'İleri →');

    area.innerHTML = `
      <div class="reader">
        <div class="reader-top">
          <button class="reader-back" type="button" id="reader-back">${hasChapters ? '← Raf' : '← Raflar'}</button>
          <div class="reader-progress"><div class="reader-progress-fill" style="width:${remainingPct}%"></div></div>
          <div class="reader-step-count">${libEsc(stepLabel)}</div>
        </div>
        <div class="reader-scroll">
          ${content}
        </div>
        <div class="reader-actions">
          <button class="reader-btn secondary" type="button" id="reader-prev" ${step === 0 ? 'disabled' : ''}>← Geri</button>
          <button class="reader-btn" type="button" id="reader-next">${nextLabel}</button>
        </div>
      </div>
    `;

    // Re-evaluate the Next button: gated when any vote widget in the
    // current step still has data-answered="0".
    function refreshNextGate() {
      const next = document.getElementById('reader-next');
      if (!next) return;
      const widgets = area.querySelectorAll('.vote-widget[data-q]');
      const allAnswered = Array.from(widgets).every(w => w.dataset.answered === '1');
      next.disabled = !allAnswered;
    }

    document.getElementById('reader-back').addEventListener('click', backToPath);
    document.getElementById('reader-prev').addEventListener('click', () => {
      if (step > 0) { step--; renderStep(); }
    });
    document.getElementById('reader-next').addEventListener('click', async () => {
      if (!onPoll && step < lastSectionIdx) { step++; renderStep(); return; }
      if (!onPoll && hasPoll) { step = sections.length; renderStep(); return; }
      // Last action: surface a "finished" notice and mark the chapter
      // completed so the next one unlocks on the shelf path.
      const done = document.createElement('div');
      done.className = 'reader-done';
      done.textContent = '✓ Tamamlandı';
      area.querySelector('.reader-actions').replaceWith(done);
      const uid = await libGetCurrentUserId();
      libWriteArticleCompleted(uid, article.id);
      // Unlocks the next chapter for whenever the reader returns to the
      // table of contents (← Raf) -- there's no persistent sidebar nav to
      // refresh live anymore, so nothing further to do here.
      if (hasChapters) {
        completedSet.add(article.id);
        const idx = articles.indexOf(article);
        if (idx > -1 && idx + 1 < articles.length) lockState[idx + 1] = false;
      }
    });

    // Vocab-pop on tap (mobile keeps tooltips open until next tap).
    area.querySelectorAll('.vocab-term').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.vocab-term.vocab-open').forEach(o => {
          if (o !== el) o.classList.remove('vocab-open');
        });
        el.classList.toggle('vocab-open');
      });
    });

    hydrateVoteWidgets(area, refreshNextGate);
    refreshNextGate();
    if (window.IstPersonMentions) IstPersonMentions.linkify(area, personMentionsRoster);

    if (onPoll) mountPoll(article);
    const scrollEl = area.querySelector('.reader-scroll');
    if (scrollEl) scrollEl.scrollTop = 0;
  }

  renderStep();
  IstSheet.open(overlay);
}

// Wires the reader overlay's backdrop-click/Escape close once; which
// chapter is currently open (and how to close it) is set by
// openArticleReader each time it runs, via _closeReaderOverlay.
let _closeReaderOverlay = null;

// True while the sheet on screen is the one the map itself opened (a
// country's page, or the meclis from Ankara) -- set by the map's click
// handler, cleared by resetMapLabel. closeReaderOverlay clears the map's
// selection only then: on desktop a district can be selected on its own,
// with no page behind it, and closing an unrelated sheet must not drop it.
let _mapSelectionOpenedSheet = false;
(function initReaderOverlay() {
  const overlay = document.getElementById('reader-overlay');
  const backdrop = document.getElementById('reader-overlay-backdrop');
  const area = document.getElementById('reader-overlay-sheet');
  if (!overlay || !backdrop || !area) return;
  backdrop.addEventListener('click', () => { if (_closeReaderOverlay) _closeReaderOverlay(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open') && _closeReaderOverlay) _closeReaderOverlay();
  });
})();

async function mountPoll(article) {
  const mount = document.getElementById('poll-mount');
  if (!mount) return;
  const { question, options } = article.poll;
  mount.innerHTML = `
    <div class="poll-q">${libEsc(question)}</div>
    <div class="poll-options" id="poll-options">
      ${options.map((o, i) => `
        <button class="poll-option" data-idx="${i}" type="button">
          <span class="opt-bar" style="width:0%"></span>
          <span class="opt-text">${libEsc(o)}</span>
          <span class="opt-pct"></span>
        </button>
      `).join('')}
    </div>
  `;
  const { data: { session } } = await sb.auth.getSession();
  const uid = session?.user?.id || null;

  async function refresh() {
    const [{ data: votes }, mineRes] = await Promise.all([
      sb.from('library_article_poll_votes').select('option_index').eq('article_id', article.id),
      uid ? sb.from('library_article_poll_votes')
        .select('option_index').eq('article_id', article.id).eq('user_id', uid).maybeSingle()
        : Promise.resolve({ data: null }),
    ]);
    const counts = options.map(() => 0);
    (votes || []).forEach(v => { if (counts[v.option_index] != null) counts[v.option_index]++; });
    const total = counts.reduce((a, b) => a + b, 0);
    const mine = mineRes && mineRes.data ? mineRes.data.option_index : null;
    mount.querySelectorAll('.poll-option').forEach(btn => {
      const idx = Number(btn.dataset.idx);
      const pct = total > 0 ? Math.round((counts[idx] / total) * 100) : 0;
      btn.classList.toggle('mine', mine === idx);
      btn.querySelector('.opt-bar').style.width = (mine != null ? pct + '%' : '0%');
      btn.querySelector('.opt-pct').textContent = (mine != null) ? (pct + '%') : '';
    });
  }
  refresh();

  mount.querySelectorAll('.poll-option').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = Number(btn.dataset.idx);
      const { data: { session: s2 } } = await sb.auth.getSession();
      if (!s2) { alert('Önce giriş yapın.'); return; }
      await sb.from('library_article_poll_votes')
        .upsert({ article_id: article.id, user_id: s2.user.id, option_index: idx },
                { onConflict: 'article_id,user_id' });
      refresh();
    });
  });
}

  sisli:'Şişli', eyupsultan:'Eyüpsultan', gop:'Gaziosmanpaşa',
