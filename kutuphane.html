      margin-top: 2px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    /* .card-top/.edit-btn are the only states .library-card ever renders
       now — editing/settings/badges live in the shared profile-overlay
       bottom sheet (IstProfileCard.openProfileOverlay) instead. .edit-btn
       is an icon-only button inline inside .card-top (to the right of the
       avatar/name/district), not a separate line below it. */
    .library-card .edit-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      border: none;
      cursor: pointer;
    }
    .library-card .edit-btn svg { width: 17px; height: 17px; }
    .library-card .edit-btn:hover { background: var(--accent); }
    /* ── MOBILE RESPONSIVE ── */
    /* ── MOBILE RESPONSIVE ──
       Same stacked-flow treatment as anahane/kahvehane: the map sits at
       the top like a hero banner with the profile card floating over
       its empty/sea-colored band (same #f7f7f7 as the map artwork's own
       background, so the card reads as part of the map rather than a
       stacked box), then the shelves grid below it, all scrolling in
       body itself (a plain flex column here, not a grid -- .map-panel
       is a sibling of col-left/main/col-right rather than nested in
       main, so it just needs to become an in-flow item instead of a
       fixed full-bleed background layer for the stacking order to fall
       out correctly), with the tab bar pinned fixed at the very bottom. */
    @media (max-width: 768px) {
      /* html AND body, the same lock anahane.html and kahvehane.html
         already carry -- this page only ever set `html`, and that is what
         put the boxes and the Dünya cards behind the tab bar in mobile
         Safari.

         Everything below the map is positioned off the bottom of
         #main-site, and frames.css sizes #main-site to `height: 100%`
         (!important) -- of BODY. Body was left on its desktop
         `height: 100vh` here, and on iOS `vh` is the LARGE viewport: the
         page is sized as though Safari's bottom URL bar weren't there. The
         tab bar meanwhile is position:fixed/bottom:0, which lands it above
         that bar, on the SMALL viewport. So the page reserved its
         navbar-height of space from a line roughly a URL bar lower than
         the line the navbar is actually drawn on, and both stacks ended up
         under it -- on a phone with the bar showing, which is every phone
         that isn't the installed app.

         dvh is the viewport as it is right now, and position:fixed +
         width:100% pins the document to it so the value cannot drift
         out from under the layout as the bar collapses on scroll. 100vh
         stays as the fallback for engines without dvh. */
      html, body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        width: 100%;
      }
      /* Lives on #main-site (not body directly) for the same reason as
         the desktop rule above -- see that rule's comment. The map no
         longer takes a row here: it's the fixed full-screen backdrop
         behind this grid (see .map-panel below), so the grid holds only
         one column -- the news, all of it, full width -- floated down onto
         the blank lower half of the artwork by the padding-top, and
         resting on the bottom of the screen (see its auto margin below).
         The library boxes used to be the other column here; they are two
         small buttons pinned into the top-right corner now (see the
         .col-left rule below) and take no track at all. */
      #main-site {
        /* 100% of the body pinned above, not a viewport unit of its own:
           frames.css sets `height: 100% !important` on #main-site, so a
           100dvh written here never applied and only made it look as
           though this element owned its own height. It follows body. */
        height: 100%;
        display: grid;
        /* One track: the news column, the full width of the screen. */
        grid-template-columns: 1fr;
        grid-template-areas: "news";
        /* The single row takes the whole screen under the hero line, so
           both columns have a full-height box to sit at the bottom of.
           Left as the default align-content (stretch, not the `start`
           this used to pin): with anything else, grid track-sizes the row
           by its content first and only then positions the shorter track
           in the container, so a 1fr row sizes to one short card stack
           and never claims the leftover space -- the same trap
           kahvehane.html hit (see its own grid-template-rows comment).

           minmax(0, 1fr), not a bare 1fr: a bare `1fr` is minmax(auto,
           1fr), and that `auto` minimum is the row's min-content height,
           so once the Dünya feed held more than the band under the map
           could show, the row GREW past #main-site's content box instead
           of the feed staying pinned to the bottom of it -- the stack ran
           down behind the fixed tab bar and the last card was sliced
           mid-headline. Zero as the minimum lets the row be exactly the
           leftover height, and the columns scroll inside it (see
           .col-*-slide below) rather than the page growing under the bar. */
        grid-template-rows: minmax(0, 1fr);
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        /* frames.css's shared gap would otherwise expose a sliver of
           the raw page canvas (a different color from the map's own
           #f7f7f7) under the map -- zero the row gap so the map's bottom
           edge sits flush against the columns below it; the column gap
           (between news/boxes) is kept, just halved (matches anahane's
           own mobile gap treatment). */
        row-gap: 0 !important;
        column-gap: calc(var(--frame-gap) / 2) !important;
        /* The columns start on the phone's shared hero line (see
           --map-hero-end in frames.css) -- the same line Hane's news and
           events start on, and Kahvehane's comments and game tiles, so
           nothing shifts under the reader as they swipe between the
           three. The map here is a full-screen backdrop rather than an
           in-flow square, so this page reaches that line with padding
           instead of a grid row; the line itself is the one line.
           !important for the same reason the gaps above need it
           (frames.css targets #main-site at equal specificity and loads
           after this stylesheet). */
        padding-top: var(--map-hero-end) !important;
        /* Reserve space for fixed bottom tab bar + a frame-gap so the
           cards don't visually press against the nav (frames.css design). */
        padding-bottom: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom) + var(--frame-gap, 10px));
        box-sizing: border-box;
      }
      /* Transparent, not a color: the map is a fixed layer *behind* this
         grid now, so any background painted on body or #main-site would
         cover it outright rather than just filling gaps (which is what
         the old #f7f7f7 was for, back when the map was an in-flow block
         and the leftover space below it showed frames.css's raw page
         canvas). frames.css's html,body rule sets a background with
         !important, so this needs the extra "html" qualifier to win on
         specificity regardless of source order. */
      html body,
      html #main-site {
        background: transparent !important;
      }

      /* .map-panel is a sibling of main (see its markup comment) so it
         keeps rendering underneath the reader-overlay sheet's own
         full-bleed rise, independent of main's display:none below. It
         takes no grid area at all now -- it's out of flow. */
      .col-right { grid-area: news; }
      /* The library boxes are not a column here any more: they are two
         small buttons in the top-right corner, just under the profile
         bar, floating over the map the way the PETEK button does on Hane.
         Taken out of the grid entirely (fixed, not a grid item) so the
         news column below gets the whole width.
         The legacy ?user=ID view still shows the desktop library card and
         HESAP block inside this column, so it keeps the old two-column
         grid instead -- see the .ist-viewing-other rule just below. */
      body:not(.ist-viewing-other) .col-left {
        position: fixed;
        top: calc(env(safe-area-inset-top) + var(--navbar-h-top, 56px) + 8px);
        right: var(--screen-inset, 18px);
        left: auto;
        width: auto;
        z-index: 6;
      }
      /* Nothing to scroll here (two buttons), and the scroller would clip
         the unread badge that hangs off Posta Kutusu's top-right corner. */
      body:not(.ist-viewing-other) .col-left-slide { overflow: visible; }
      body.ist-viewing-other #main-site {
        grid-template-columns: auto 1fr;
        grid-template-areas: "boxes news";
      }
      body.ist-viewing-other .col-left { grid-area: boxes; }
      /* The news column rests on the bottom of the screen: one card sits
         just above the tab bar and each newer one is laid on top of it,
         so the stack grows up toward the map rather than hanging off the
         hero line. The auto margin goes on the feed itself rather than on
         .col-right-slide: the slide carries flex:1 and fills the column,
         and flex hands the free space to a growing item before any margin
         sees it, so an auto margin one level up is silently ignored. The
         feed already sits in a flex column (the slide) and does not grow
         -- #dunya-news-feed is flex:none on mobile. (The library boxes
         still take the same treatment in the legacy ?user=ID layout,
         where they are a column again.)
         Deliberately an auto margin rather than justify-content:flex-end:
         once a stack outgrows the band the margin resolves to zero and the
         column scrolls it as usual, where flex-end would push the top of
         the stack out of the scroller and out of reach. */
      #dunya-news-feed { margin-top: auto; }
      body.ist-viewing-other .lib-boxes { margin-top: auto; }

      /* ...and where a stack outgrows the band, THIS is what it scrolls
         in. The band between the hero line and the tab bar is all the
         height either column ever gets (see #main-site's minmax(0, 1fr)
         above), so the overflow has to be absorbed here, inside the
         column, rather than by the page growing behind the fixed tab bar.
         The scroller is the slide and not .col-* itself because the feed
         is the slide's own child: scrolling the column would leave the
         feed overflowing a mid-height slide box, and how much of that
         overflow counts as scrollable is exactly the kind of thing
         engines disagree about.
         min-height:0 on the columns for the same reason the row needs a
         zero minimum -- a flex/grid item's automatic minimum size is its
         content, so without this the column refuses to be shorter than
         the whole stack and hands the overflow straight back to the page. */
      .col-left, .col-right { min-height: 0; }
      .col-left-slide, .col-right-slide {
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        /* No scrollbar: these columns are frameless text floating on the
           map, so a track drawn down the middle of the artwork would read
           as a seam in the drawing rather than as chrome. */
        scrollbar-width: none;
      }
      .col-left-slide::-webkit-scrollbar,
      .col-right-slide::-webkit-scrollbar { display: none; }
      /* Lifted over the country overlay (z-index 2, see .map-svg-world) so
         both stay usable in the same half of the screen: the columns take
         the taps that land on them, the map takes the rest. Without this the
         overlay would be the topmost thing over the whole lower half and a
         news card underneath it could not be opened.
         z-index alone, no position: these are grid items, and z-index
         applies to grid items as-is (same as frames.css relies on). */
      .col-left, .col-right { z-index: 3; }

      /* On mobile, the kütüphane page is one screen: the map plus its two
         columns. Both the chapter list and the reader itself rise over it
         as the same full-bleed sheet (see sheet.css's phone rules)
         rather than swapping
         #reading-area into view. */
      main {
        display: none;
      }

      /* .section-rule no longer renders a floating brand bar -- its
         only visible content (the tab nav) is pulled out via the
         <header> position:fixed rule below and pinned to the viewport
         bottom regardless of where this sits. Taken out of flow so it
         doesn't claim space above the map. */
      .section-rule {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        padding: 0;
        overflow: visible;
      }

      /* The profile bar (#ist-pc-mount) is the fixed top bar — the
         counterpart of the tab bar at the bottom. Its geometry and colors
         are in profile-card.css, one implementation for all three pages;
         nothing about it is page-specific, so nothing about it is restated
         here. It used to be a light card floating over the map's top
         (empty/sea) band, which each of the three pages spelled out again
         in its own mobile query. */

      /* Capacitor's WKWebView reports env(safe-area-inset-top) as 0 for a
         real (measured, ~80-200ms) window after every fresh page load
         before self-correcting on its own -- with no gating, the card
         renders flush under the status bar/notch for that window.
         safe-area-ready.js removes this class once the real value is
         confirmed (or after a timeout), so the card simply appears
         already in the right place instead of visibly jumping. */
      html.ist-safe-area-pending #ist-pc-mount {
        visibility: hidden;
      }
      /* #mobile-top only shows in the ?user=ID "viewing another
         profile" case (see body.ist-viewing-other below), where the
         profile bar is hidden — it keeps the older floating-card
         treatment the bar itself used to have, since it is a different
         (legacy) surface and not the bar. */
      body.ist-viewing-other #mobile-top {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 20;
        background: #eeeeee !important;
        border: 2px solid #1a1a1a !important;
        border-bottom: 5px solid #1a1a1a !important;
      }

      /* Map: the mobile draft is a full-screen backdrop, not a block in
         the column flow. The art is drawn at 1080x1920 -- a phone
         screen, not a map slot -- with Turkey in its top half and a
         deliberately sparse lower half for the news/boxes columns to sit
         over. So the panel goes back to the same fixed full-bleed layer
         the desktop rule uses, and the columns below start on the shared
         hero line (see #main-site's padding-top and --map-hero-end),
         which lands them on the empty part of the drawing.

         Nothing left to bleed past here: inset:0 already reaches the
         true screen edges, so the negative frame-pad margins the
         in-flow version needed are gone. */
      .map-panel {
        position: fixed;
        inset: 0;
        height: auto;
        margin: 0;
        z-index: -1;
        overflow: hidden;
        /* The draft is drawn on white, and `contain` below leaves the
           strip under the artwork bare on tall screens. Matching white
           makes that strip read as more of the drawing's own paper
           rather than a panel edge. */
        background: #fff;
      }

      /* `contain`, not the shared `cover` above. The art (9:16) is
         relatively wider than a modern phone (~9:19.5), so cover fills
         the screen by cropping the sides -- and Turkey is drawn all the
         way out to the source's right edge, so it's the eastern border
         that gets shaved. contain instead fits the art to the full
         screen *width*, exactly as composed, and leaves the leftover
         height as white below it. Anchored top so the drawing hangs from
         the top of the screen and that leftover collects at the bottom,
         behind the columns, where the art is already blank. */
      .map-panel img.map-photo {
        object-fit: contain;
        object-position: center top;
      }

      /* Swap the overlays: the İstanbul trace is drawn against the desktop
         artwork and lines up with nothing on this drawing, so it steps aside
         for the country trace that *was* drawn on this one. The phone map is
         pointable from here on -- it used to have no live shapes at all,
         since the only overlay in the page was the mismatched one and it was
         hidden outright. */
      .map-panel svg.map-svg-ist {
        display: none;
      }

      /* Sized to exactly the box .map-panel occupies (fixed, inset:0) so the
         xMidYMin viewBox resolves against the same rectangle the image is
         fitted to -- that, and nothing else, is what keeps the shapes on the
         coastlines. It cannot live *inside* that panel though: see the
         markup comment on this overlay.

         pointer-events is off on the sheet and back on for the shapes alone
         (.country, above), so this layer is invisible to touch except exactly
         where a country is drawn -- the sea between them, and the empty lower
         half of the artwork, still scroll and tap through to the page.

         The whole drawing is live, top to bottom -- the countries in the
         lower half are as touchable as the ones above the hero line, even
         though the columns are drawn over that half. What keeps both working
         is the z-index below: the columns sit ABOVE this overlay, so a news
         card or a shelf box always wins the tap where it is actually drawn,
         and the map answers everywhere they are not (the margins around
         them, the gaps between them, the run of empty page under them).

         Only the top is clipped, and only as far as the profile bar reaches:
         the bar is drawn over the artwork, so a country under it (Rusya) had
         no business taking taps meant for the bar's buttons. clip-path takes
         hit-testing with it, which is what makes clipping the right tool
         here rather than a second stacking rule. */
      svg.map-svg-world {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        /* Over #main-site (unpositioned), under the columns (3), the profile
           bar (20), the tab bar (100) and the sheets (500). */
        z-index: 2;
        pointer-events: none;
        clip-path: inset(calc(var(--navbar-h, 38px) + env(safe-area-inset-top)) 0 0 0);
      }
      /* Sits just above the hero line, where the columns start --
         exactly where Hane's and Kahvehane's captions sit over their own
         maps (8px of air under the caption, see their .map-label rules).
         Positioned from the top rather than the panel's bottom edge,
         which since the panel went full-screen is the bottom of the
         screen, behind the tab bar. */
      .map-label {
        position: absolute;
        top: calc(var(--map-hero-end) - 20px);
        bottom: auto;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 1px;
        text-align: center;
      }

      /* col-left holds the library boxes (self-view) -- a normal in-flow
         grid column now, sitting beside .col-right below the map, so no
         more standalone card background/border of its own (matches
         .col-right's own frameless treatment just below). */
      .col-left {
        border: none;
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: visible;
      }
      .col-left .nb-highlight { display: none; }

      /* Shelves area — sits below the map now instead of filling the
         remaining viewport, so it grows with its own content instead of
         scrolling internally. One per row, each spanning the full width
         of the sheet: a shelf and a letter are list rows, not tiles, and
         the two-column grid this used to be cut every name in half to
         make them fit side by side. */
      .shelves {
        display: flex;
        flex-direction: column;
        padding: 0;
        gap: 8px;
        overflow: visible;
      }
      /* Reading area takes over full middle space when a shelf is opened */
      .reading-area {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 16px;
      }
      .shelf-btn {
        padding: 10px 8px;
        border-bottom-width: 4px;
      }
      .shelf-title { font-size: 0.85rem; letter-spacing: 1px; line-height: 1.2; }
      .shelf-subtitle { font-size: 0.68rem; margin-top: 2px; }
      .shelf-progress { font-size: 0.56rem; margin-top: 3px; }

      /* The corner pair (see the .col-left rule above): a row, no padding
         of its own -- .col-left's own top/right offsets already place it
         on the screen's inset line. */
      .lib-boxes { gap: 6px; padding: 0; }
      .lib-box {
        width: auto;
        padding: 5px 8px;
        border-bottom-width: 3px;
      }
      .lib-box-title {
        font-size: 0.58rem;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      /* No hover nudge on a phone -- these sit over the map and a
         :hover left stuck after a tap would leave one button offset. */
      .lib-box:hover { transform: none; }

      /* Cancels the desktop rule's flex:1/overflow-y:auto (a fixed-height
         internally-scrolling column there) -- on mobile the scroller is
         the slide around it (see .col-*-slide above), so the feed itself
         just sizes to its own content, matching .shelves' own mobile
         treatment above. Padding is the same 12px .lib-boxes carries, so
         the two bottom-aligned stacks end on the same line above the tab
         bar -- it was 10px, which left the Dünya cards sitting 2px lower
         than the boxes beside them. */
      #dunya-news-feed { padding: 12px; gap: 8px; flex: none; overflow: visible; min-height: auto; }
      .article { padding: 8px 12px; }
      :is(.article, .news-page-head) .kicker { font-size: 10px; margin-bottom: 2px; letter-spacing: 1px; }
      .article h3 { font-size: 18px; margin-bottom: 3px; line-height: 1.25; }
      .article p { font-size: 12px; line-height: 1.35; }

      /* ── THE DECK ──
         Two stories or ten, on a phone the feed is one stack of paper
         standing at the bottom of the band: the newest on top, the rest
         behind it, and the reader deals with them one at a time (swipe
         the open story away and the next one is already standing there --
         see dealNewsPage). It replaced a scrolling list, which asked the
         reader to decide how much of the news to get through; a stack
         asks them to deal with one thing.

         Every card sits in the same grid cell, so they are exactly on top
         of each other and exactly the same height, and the two behind are
         pushed up and back a step each so their top edges show. The depth
         is nth-child and nothing else: promoting the next story is
         REMOVING the front node, and the ones behind transition into
         their new places on their own rather than being re-rendered
         there.

         Past the third the picture stops changing -- a stack is a stack,
         and a fourth edge of paper says nothing a third one didn't. Those
         cards stay in the DOM (the desktop column still prints the whole
         list, and the fourth has to be standing there ready when the
         front one leaves); they are simply not drawn. */
      #dunya-news-feed {
        display: grid;
        grid-template-areas: "deck";
      }
      #dunya-news-feed > .article {
        grid-area: deck;
        transition: background 0.15s, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }
      /* The press keeps its own quick curve: the deck's rule above is an
         id selector and would otherwise win it on specificity, and a card
         that takes a third of a second to give under the finger doesn't
         read as a button at all. */
      #dunya-news-feed > .article.openable.pressing { transition: transform 0.11s ease-out; }
      /* Content from the top here. A card stretched to the tallest in the
         deck would otherwise hold its headline down at its own bottom
         edge with a gap above it. */
      #dunya-news-feed > .article.openable h3 { margin-top: 0; }
      #dunya-news-feed > .article:nth-child(1) { z-index: 3; }
      #dunya-news-feed > .article:nth-child(2) { z-index: 2; transform: translateY(-10px) scale(0.965); }
      #dunya-news-feed > .article:nth-child(3) { z-index: 1; transform: translateY(-19px) scale(0.93); }
      #dunya-news-feed > .article:nth-child(n+4) { display: none; }
      /* Only the top of the deck is a button. The ones behind are edges of
         paper: a press on the sliver of one would fight its own depth
         transform and pull it out of the stack. */
      #dunya-news-feed > .article:not(:nth-child(1)) { pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        #dunya-news-feed > .article { transition: background 0.15s; }
      }

      /* ── THE NEWS PAGE on a phone (see its block above) ──
         Not a sheet arriving from anywhere: it IS the band the feed lies
         in. Its top edge is the hero line, its bottom edge is where the
         bottom card was already resting above the tab bar, and its two
         sides are the cards' own sides — so the card the reader tapped
         grows into a box that was already drawn around it. The grow
         itself is a clip-path animated in JS (growNewsPage), which is why
         every transform and transition the sheet would otherwise carry is
         taken off here: a transform would move the page out from under
         the clip measured against it.

         --news-page-left/--news-page-width are measured off the feed's own
         content box when the page opens (and again on resize), rather than
         restated as the sum of the frame pad and the feed's padding — one
         number in two places is how a page ends up 2px off the cards it
         came out of. The fallback is that sum, for the frame before the
         measurement lands. */
      .news-overlay {
        /* The map above stays live while a story is open: the page takes
           its own taps and nothing else takes any, so touching a country
           still opens it (and closes this, see initNewsPage). */
        pointer-events: none;
      }
      .news-overlay .ist-sheet-backdrop { display: none; }
      .news-overlay .news-page {
        pointer-events: auto;
        left: var(--news-page-left, calc(var(--frame-pad, 10px) + 12px));
        right: auto;
        width: var(--news-page-width, calc(100vw - (var(--frame-pad, 10px) + 12px) * 2));
        top: var(--map-hero-end);
        bottom: calc(var(--navbar-h, 46px) + env(safe-area-inset-bottom, 0px) + var(--frame-gap, 10px));
        height: auto;
        transform: none;
        transition: none;
        /* The page owns its horizontal axis (the throw, see
           wireNewsPageSwipe); the vertical one stays the browser's, so the
           body inside it scrolls natively. */
        touch-action: pan-y;
        /* It floats in the band instead of running off the bottom of the
           screen, so it gets the fourth edge frames.css drops. */
        border-bottom-width: 2px !important;
      }
      .news-overlay.open .news-page { transform: none; }
      .news-page-head { padding: 9px 12px 8px; }
      .news-page-body { padding: 11px 12px 14px; }
      .news-page-title { font-size: 19px; margin-bottom: 7px; }
      .news-page-body > p { font-size: 13px; line-height: 1.5; }
      .news-page-inner { --news-foot-h: 34px; }
      .news-page-foot { padding: 0 12px; }
      .news-page-drawer { padding: 10px 12px; }

      /* sheet.css hides the side columns under any open sheet, because a
         sheet rises OVER them. This page doesn't rise over anything: it
         grows inside the band, so the feed behind it stays put through the
         grow (the cards it is expanding past are half the reason the move
         reads), and the two library buttons floating over the map above it
         never had anything to get out of the way of. */
      body:has(#news-overlay.open) .col-left,
      body:has(#news-overlay.open) .col-right { visibility: visible; }

      .article-area {
        padding: 16px;
        overflow-y: visible;
        flex: none;
        min-height: 60px;
      }
      .article-area .empty-state { padding: 32px 20px; font-size: 0.8rem; }
      .article-list .list-head { padding-bottom: 8px; margin-bottom: 6px; }
      .article-list .source-heading { font-size: 0.65rem; letter-spacing: 2px; }
      .sort-control { font-size: 0.6rem; gap: 6px; }
      .sort-control select { font-size: 13px; padding: 3px 6px; }
      .article-item { padding: 12px 0; }
      .article-item .item-title { font-size: 0.92rem; }
      .article-item .item-summary { font-size: 0.8rem; }
      .article-item .item-byline { font-size: 0.68rem; }
      .article-item .item-counts { font-size: 0.68rem; gap: 8px; margin-top: 4px; }
      .article-detail .back-btn { font-size: 0.65rem; padding: 0 0 12px 0; }
      .article-detail .detail-title { font-size: 1.2rem; margin-bottom: 8px; }
      .article-detail .detail-summary { font-size: 0.85rem; margin-bottom: 14px; }
      .article-detail .detail-body { font-size: 0.82rem; line-height: 1.55; }
      .reaction-bar { gap: 8px; margin: 12px 0 6px 0; flex-wrap: wrap; }
      .reaction-btn { padding: 5px 12px; font-size: 0.78rem; }
      .comments-heading { font-size: 0.68rem; margin-bottom: 10px; }
      .comment-row { padding: 8px 10px; }
      .comment-meta { font-size: 0.65rem; }
      .comment-body { font-size: 0.82rem; }
      /* 16px prevents iOS Safari zoom-on-focus */
      .comment-composer textarea { font-size: 16px; min-height: 52px; }
      .composer-submit { padding: 7px 14px; font-size: 0.68rem; }
      .loading { padding: 14px; font-size: 12px; }

      /* Left column hosts the Dünya feed, now a normal in-flow grid column
         beside .col-left below the map instead of filling the remaining
         viewport height. */
      .col-right {
        border: none;
        display: flex;
        flex-direction: column;
        overflow: visible;
      }
      /* Back to the desktop treatment (body .col-left/.col-right near the
         top of this file: background:none!important) -- frameless text
         floating on the map. The #f7f7f7 fill this rule used to carry was
         for the layout where the map was a block *above* this row rather
         than behind it, so "none" exposed the raw page canvas; now that
         the artwork is the full-screen backdrop again, a fill here would
         paint a gray slab over the lower half of the drawing. Kept as a
         rule (rather than deleted) so the mobile intent stays explicit
         next to the layout it belongs to. */
      body .col-left,
      body .col-right {
        background: transparent !important;
      }
      .library-card { padding: 14px 16px; }
      .library-card .avatar { width: 48px; height: 48px; font-size: 1.2rem; border-width: 2px; }
      .library-card .card-name { font-size: 0.88rem; }
      .library-card .card-meta { font-size: 0.65rem; }
      .profile-right {
        padding: 12px 16px 14px 16px;
        gap: 10px;
        overflow: visible;
        display: flex;
        flex-direction: column;
      }
      .right-section-title { font-size: 10px; margin-bottom: 6px; padding-bottom: 3px; letter-spacing: 1.2px; }
      .info-row { margin-bottom: 5px; gap: 2px; }
      .info-label { font-size: 9px; letter-spacing: 1px; }
      .info-value { font-size: 12px; }

      /* Existing library-card and HESAP column are replaced by the shared
         #ist-pc-mount widget on mobile -- .col-left itself stays visible
         (it's the library boxes' own grid column now, see "boxes" above),
         just these two desktop-only pieces of it hide. When viewing
         another user's profile (?user=ID), keep the legacy layout instead
         (both stay visible, alongside the boxes). */
      body:not(.ist-viewing-other) #mobile-top { display: none !important; }
      body:not(.ist-viewing-other) #library-card,
      body:not(.ist-viewing-other) .profile-right { display: none !important; }
      body.ist-viewing-other #ist-pc-mount { display: none !important; }
      /* The Cumhurbaşkanı card as a card is desktop-only -- but the seat
         it names is NOT hidden on a phone any more: it moves into the
         profile bar's left end (#ist-pc-seat, see "THE TOP BAR" in
         profile-card.css), which is where there is actually room for it
         beside a full-bleed map. politician-card.js paints both. */
      #politician-card { display: none !important; }

      /* ── Mobile top: compact profile card + countdowns ── */
      #mobile-top {
        background: var(--paper-card);
      }
      #mobile-top .library-card {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 10px 16px;
        border: none;
        box-shadow: none;
      }
      #mobile-top .library-card .card-top {
        flex: 1;
        min-width: 0;
      }
      #mobile-top .library-card .edit-btn {
        width: auto;
        flex-shrink: 0;
        padding: 6px 14px;
        font-size: 0.65rem;
      }
      #mobile-top .library-card .avatar {
        width: 38px;
        height: 38px;
        font-size: 1rem;
        border-width: 2px;
      }
      #mobile-top .library-card .card-name { font-size: 0.85rem; }
      #mobile-top .library-card .card-meta { font-size: 0.62rem; }

      /* Bottom tab bar — thinned from the top; labels sit flush against the
         bottom edge (the safe-area padding below is what separates them
         from the home-indicator area). */
      header {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom));
        padding: 0 0 env(safe-area-inset-bottom);
        margin: 0;
        border-top: 1px solid var(--rule);
        border-bottom: none;
        background: var(--paper-navbar);
        z-index: 100;
        display: flex;
        align-items: stretch;
      }
      nav {
        display: flex;
        width: 100%;
        height: 100%;
        gap: 0;
        /* Pull KÜTÜPHANE/KAHVEHANE in from the screen's rounded corners --
           at full-bleed width:100% the outer tabs sat right under the
           curve. 18px specifically (was 20px): that's the shared screen
           inset the rest of the page lines up on -- frames.css's 10px
           frame padding plus the 8px inner padding the columns use --
           so with the edge alignment below, the tab labels land on the
           same vertical lines as the floating profile card, the comment
           cards, the composer and the game tiles. */
        padding: 0 18px;
        flex-wrap: nowrap;
        justify-content: stretch;
      }
      nav a {
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 6px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--muted);
        border: none;
        text-decoration: none;
        /* Same fix as .neighborhood: without this, tapping a tab flashes
           the browser's default gray tap-highlight box over it. */
        -webkit-tap-highlight-color: transparent;
      }
      nav a.active { color: var(--ink); font-weight: 700; }
      /* The two outer tabs align their label to the bar's own edge
         instead of centering it inside their third of the bar, which is
         what actually puts the K of KÜTÜPHANE and the E of KAHVEHANE on
         the 18px inset line (see nav's padding above). HANE, in the
         middle, stays centered. The -0.5px pull cancels the trailing
         letter-spacing that CSS adds after the final E, which would
         otherwise sit between the glyph and the flex-end edge. */
      nav a:first-child { justify-content: flex-start; }
      nav a:last-child {
        justify-content: flex-end;
        margin-right: -0.5px;
      }

      /* Swipe animation — tab strip and profile card slide horizontally between pages */
      .col-left, .col-right {
        transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        backface-visibility: hidden;
      }
      html.ist-entering-forward .col-left,
      html.ist-entering-forward .col-right {
        transform: translateX(100vw);
        transition: none;
      }
      html.ist-entering-backward .col-left,
      html.ist-entering-backward .col-right {
        transform: translateX(-100vw);
        transition: none;
      }
      body.ist-exiting-forward .col-left,
      body.ist-exiting-forward .col-right {
        transform: translateX(-100vw);
      }
      body.ist-exiting-backward .col-left,
      body.ist-exiting-backward .col-right {
        transform: translateX(100vw);
      }
    }

    /* ── Desktop swipe pagination: left column slides out/in toward the
       left edge, right column toward the right edge — regardless of nav
       direction; nav stays ── */
    @media (min-width: 769px) {
      .col-left-slide, .col-right-slide {
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        backface-visibility: hidden;
      }
      /* col-left-slide now lives in the right-hand grid track (see the
         .col-left/.col-right grid-column swap above), so it exits/enters
         via the right edge, and vice versa for col-right-slide. */
      html.ist-entering-forward .col-left-slide,
      html.ist-entering-backward .col-left-slide {
        transform: translateX(100vw);
        transition: none;
      }
      html.ist-entering-forward .col-right-slide,
      html.ist-entering-backward .col-right-slide {
        transform: translateX(-100vw);
        transition: none;
      }
      body.ist-exiting-forward .col-left-slide,
      body.ist-exiting-backward .col-left-slide {
        transform: translateX(100vw);
      }
      body.ist-exiting-forward .col-right-slide,
      body.ist-exiting-backward .col-right-slide {
        transform: translateX(-100vw);
      }
    }

    /* ══════════════════════════════════════════════
       View Transitions API — cross-document slide
       The browser snapshots the outgoing page and holds
       it visible until the new page is ready, so there's
       no white flash between reloads. Only the columns
       animate; the map, nav, and datetime bar stay put
       because their content is identical across tabs. On
       mobile, direction comes from a class on <html> seeded
       by the outgoing page via sessionStorage (present before
       VT captures the new snapshot); desktop ignores direction
       entirely (see the media query below).
       ══════════════════════════════════════════════ */
    @view-transition { navigation: auto; }

    /* Suppress the default root crossfade — columns handle motion */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    .col-left-slide { view-transition-name: ist-col-left; }
    .col-right-slide { view-transition-name: ist-col-right; }

    /* The browser's own view-transition-group animation interpolates this
       named box's size/position between the outgoing and incoming page's
       rect. Kahvehane's col-right (the stacked game tiles) sits at a
       different height/position than col-right on the other pages (news/
       events), so that automatic box-morph -- stacked on top of the slide
       keyframes below -- swung the outgoing snapshot across the wrong part
       of the screen mid-transition, on top of the fixed nav bar (the view-
       transition layer always paints above it regardless of z-index).
       Disabling it pins the group to the new page's rect immediately; the
       keyframes below do 100% of the visible motion. */
    ::view-transition-group(ist-col-left),
    ::view-transition-group(ist-col-right) {
      animation: none;
    }

    /* Desktop: left column always exits/enters via the left edge, right
       column via the right edge — independent of nav direction, so no
       html.vt-forward/vt-backward gate is needed here. */
    @media (min-width: 769px) {
      /* ist-col-left is now the right-hand track and ist-col-right the
         left-hand one (see the .col-left/.col-right grid-column swap
         above), so their exit/enter edges are swapped here too. */
      @keyframes ist-vt-col-left-exit { from { transform: translateX(0); } to { transform: translateX(100vw); } }
      @keyframes ist-vt-col-left-enter { from { transform: translateX(100vw); } to { transform: translateX(0); } }
      @keyframes ist-vt-col-right-exit { from { transform: translateX(0); } to { transform: translateX(-100vw); } }
      @keyframes ist-vt-col-right-enter { from { transform: translateX(-100vw); } to { transform: translateX(0); } }

      ::view-transition-old(ist-col-left) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-left-exit;
      }
      ::view-transition-new(ist-col-left) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-left-enter;
      }
      ::view-transition-old(ist-col-right) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-right-exit;
      }
      ::view-transition-new(ist-col-right) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-right-enter;
      }
    }

    @media (max-width: 768px) {
      @keyframes ist-vt-out-left { from { transform: translateX(0); } to { transform: translateX(-100vw); } }
      @keyframes ist-vt-in-left { from { transform: translateX(100vw); } to { transform: translateX(0); } }
      @keyframes ist-vt-out-right { from { transform: translateX(0); } to { transform: translateX(100vw); } }
      @keyframes ist-vt-in-right { from { transform: translateX(-100vw); } to { transform: translateX(0); } }

      html.vt-forward::view-transition-old(ist-col-left),
      html.vt-forward::view-transition-old(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-out-left;
      }
      html.vt-forward::view-transition-new(ist-col-left),
      html.vt-forward::view-transition-new(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-in-left;
      }
      html.vt-backward::view-transition-old(ist-col-left),
      html.vt-backward::view-transition-old(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-out-right;
      }
      html.vt-backward::view-transition-new(ist-col-left),
      html.vt-backward::view-transition-new(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-in-right;
      }
    }

      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: inherit; color: inherit;
      font-weight: 600; padding: 0; text-decoration: underline; text-underline-offset: 2px;
    }
    .kefil-link:hover { color: var(--accent); }

<!-- Wraps everything except modals (matching anahane.html) so #main-site

     #main-site for why. -->

  <div id="ist-pc-mount"></div>

  <div class="section-rule">

        <a href="anahane.html">Hane</a>

  <!-- ist-content: the swappable region for future client-side routing between
       kutuphane/anahane/kahvehane. Persistent chrome (nav, profile card)
       stays outside this node. display:contents keeps grid placement identical
       to before this wrapper existed. -->
  <div id="ist-content" style="display:contents">

  <div id="mobile-top"></div>

       mobile even while main is display:none between shelf/article opens —
       see the .reading-area vs .reader background split below for how the

         mobile art is drawn tall (9:16) instead of wide, so the mobile
         media query re-fits .map-panel around it -- see the .map-panel /
         .map-photo rules in that query. -->
    <picture>

         the desktop one (countries around Türkiye, not İstanbul's districts),
         so it gets its own trace -- assets/map/kutuphane-map-mobile.svg is the
         source of truth, this is the inlined copy the CSS and the click
         handler need to reach. Which of the two overlays is live is purely a
         media-query swap; see the .map-svg-ist / .map-svg-world rules.

         A sibling of .map-panel rather than a child of it, which is the whole
         reason this map can be touched at all. .map-panel is the fixed
         backdrop at z-index:-1 -- and being positioned with a z-index it is
         also a stacking context, so nothing inside it can climb out. #main-site
         covers the full screen (the map band is its padding-top), so every tap
         over the map landed on #main-site and the shapes underneath were
         unreachable. Out here the overlay can sit above #main-site instead.

         viewBox is the mobile artwork's own 1080x1920 pixel grid and
         xMidYMin meet is the SVG spelling of the object-fit:contain /
         object-position:center top the image is drawn with -- that pairing is
         what keeps the shapes on the coastlines at every screen size, so the
         two must be changed together or not at all. -->

<script>
// Wrapped in a scoping IIFE so this page's top-level declarations (sb,
// neighborhoodNames, etc.) don't leak to the global scope -- a future
// client-side navigation may execute this same script a second time in a
// document that already ran another carousel page's script, and without
// this wrapper a repeated `const` at global scope throws a
// duplicate-declaration SyntaxError.
(function () {
// Mobile: pin source tab strip just below the top nav bar.
function updateTabStripOffset() {
  if (window.innerWidth > 768) return;
  const sr = document.querySelector('.section-rule');
  const cl = document.querySelector('.col-left');
  if (sr && cl) cl.style.top = sr.offsetHeight + 'px';
}
updateTabStripOffset();
window.addEventListener('resize', updateTabStripOffset);

// Mobile layout (≤768px): surface the legacy profile card at the top when
// viewing another user's profile (?user=ID); self-view uses #ist-pc-mount.
(function () {
  const MOBILE_BP = 768;
  if (new URLSearchParams(window.location.search).get('user')) {
    document.body.classList.add('ist-viewing-other');
  }
  const mobileTop = document.getElementById('mobile-top');
  const card      = document.getElementById('library-card');
  const colLeft   = document.querySelector('aside.col-left');

  if (!mobileTop || !card || !colLeft) return;

  let inMobile = null;

  function applyLayout() {
    const mobile = window.innerWidth <= MOBILE_BP;
    if (mobile === inMobile) return;
    inMobile = mobile;
    if (mobile && document.body.classList.contains('ist-viewing-other')) {
      mobileTop.appendChild(card);
    }
  }

  applyLayout();

  let raf = null;
  window.addEventListener('resize', () => {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(applyLayout);
  });
}());

// ── Kütüphane: topic tabs → article list → article detail ──
// Reads articles and categories from public.library_articles,
// public.library_categories (see db/library_categories_v4.sql).
let LIB_CATEGORIES = []; // [{ id, label_tr, position }]
let LIB_CATEGORY_LABELS = {}; // { id: label_tr }
let activeCategoryId = null;

const LIB_SORT_OPTIONS = [
  { value: 'newest', label: 'Yeni → Eski' },
  { value: 'oldest', label: 'Eski → Yeni' },
  { value: 'liked', label: 'En çok beğenilen' },
  { value: 'disliked', label: 'En çok beğenilmeyen' },
  { value: 'commented', label: 'En çok konuşulan' },
  { value: 'contested', label: 'En tartışmalı' },
];
let currentSort = 'newest';

function libEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function capitalizeName(s) {
  if (!s) return '';
  return s.trim().split(/\s+/).map(w => w ? w.charAt(0).toLocaleUpperCase('tr-TR') + w.slice(1).toLocaleLowerCase('tr-TR') : '').join(' ');
}

async function fetchLibraryCategory(categoryId) {
  const { data, error } = await sb.from('library_articles')
    .select('*').eq('category', categoryId)
    .order('position', { ascending: true })
    .order('created_at', { ascending: false });
  if (error) {
    console.error('[kutuphane library fetch]', error);
    return [];
  }
  return data || [];
}

async function loadLibraryCategories() {
  const { data, error } = await sb.from('library_categories')
    .select('*').order('position', { ascending: true });
  if (error) {
    console.error('[kutuphane categories fetch]', error);
    return [];
  }
  LIB_CATEGORIES = data || [];
  LIB_CATEGORY_LABELS = {};
  LIB_CATEGORIES.forEach(c => { LIB_CATEGORY_LABELS[c.id] = c.label_tr; });
  return LIB_CATEGORIES;
}

function renderCategoryTabs() {
  const shelf = document.getElementById('library-shelf');
  if (!shelf) return;
  if (!LIB_CATEGORIES.length) {
    shelf.innerHTML = '<div class="shelf-loading">Kategori yok.</div>';
    return;
  }
  shelf.innerHTML = LIB_CATEGORIES.map(c => `
    <button class="source-tab${c.id === activeCategoryId ? ' active' : ''}" data-category="${libEsc(c.id)}">${libEsc(c.label_tr)}</button>
  `).join('');
  shelf.querySelectorAll('.source-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeCategoryId = tab.dataset.category;
      renderCategoryList(activeCategoryId);
    });
  });
}

// Pull reaction counts + comment counts for a given set of article ids
// so the client can sort by liked / disliked / commented without an RPC.
async function fetchArticleStats(articleIds) {
  if (!articleIds.length) return { likes: {}, dislikes: {}, comments: {} };
  const [rxRes, cmRes] = await Promise.all([
    sb.from('library_article_reactions').select('article_id, reaction').in('article_id', articleIds),
    sb.from('library_article_comments').select('article_id').in('article_id', articleIds),
  ]);
  const likes = {}, dislikes = {}, comments = {};
  (rxRes.data || []).forEach(r => {
    if (r.reaction === 'like') likes[r.article_id] = (likes[r.article_id] || 0) + 1;
    else if (r.reaction === 'dislike') dislikes[r.article_id] = (dislikes[r.article_id] || 0) + 1;
  });
  (cmRes.data || []).forEach(c => {
    comments[c.article_id] = (comments[c.article_id] || 0) + 1;
  });
  return { likes, dislikes, comments };
}

function sortKey(a) {
  // Newest/oldest prefer published_at, fall back to created_at.
  return new Date(a.published_at || a.created_at || 0).getTime();
}

// Contested score: 0 when one side dominates, 1 at a perfect 50/50.
// Articles with no reactions score 0 so they sink to the bottom.
function contestedScore(likes, dislikes) {
  const total = likes + dislikes;
  if (total === 0) return 0;
  return 1 - Math.abs(likes - dislikes) / total;
}

function applySort(articles, stats, sort) {
  const copy = articles.slice();
  if (sort === 'newest') copy.sort((a, b) => sortKey(b) - sortKey(a));
  else if (sort === 'oldest') copy.sort((a, b) => sortKey(a) - sortKey(b));
  else if (sort === 'liked') copy.sort((a, b) => (stats.likes[b.id] || 0) - (stats.likes[a.id] || 0) || sortKey(b) - sortKey(a));
  else if (sort === 'disliked') copy.sort((a, b) => (stats.dislikes[b.id] || 0) - (stats.dislikes[a.id] || 0) || sortKey(b) - sortKey(a));
  else if (sort === 'commented') copy.sort((a, b) => (stats.comments[b.id] || 0) - (stats.comments[a.id] || 0) || sortKey(b) - sortKey(a));
  else if (sort === 'contested') {
    copy.sort((a, b) => {
      const ca = contestedScore(stats.likes[a.id] || 0, stats.dislikes[a.id] || 0);
      const cb = contestedScore(stats.likes[b.id] || 0, stats.dislikes[b.id] || 0);
      if (cb !== ca) return cb - ca;
      // Tiebreaker: more total reactions wins, then newest.
      const ta = (stats.likes[a.id] || 0) + (stats.dislikes[a.id] || 0);
      const tb = (stats.likes[b.id] || 0) + (stats.dislikes[b.id] || 0);
      return (tb - ta) || (sortKey(b) - sortKey(a));
    });
  }
  return copy;
}

function formatReactionPct(likes, dislikes) {
  const total = likes + dislikes;
  if (total === 0) return { likeLabel: '—', dislikeLabel: '—' };
  const likePct = Math.round((likes / total) * 100);
  return { likeLabel: likePct + '%', dislikeLabel: (100 - likePct) + '%' };
}

async function renderCategoryList(categoryId) {
  const area = document.getElementById('article-area');
  const name = LIB_CATEGORY_LABELS[categoryId];
  if (!area || !name) return;
  activeCategoryId = categoryId;
  document.querySelectorAll('.source-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.category === categoryId);
  });
  area.innerHTML = `
    <div class="article-list">
      <div class="list-head">
        <div class="source-heading">${name}</div>
        <label class="sort-control">
          <span>Sırala</span>
          <select id="sort-select">
            ${LIB_SORT_OPTIONS.map(o => `<option value="${o.value}"${o.value === currentSort ? ' selected' : ''}>${o.label}</option>`).join('')}
          </select>
        </label>
      </div>
      <div class="empty-state"><span class="spinner"></span></div>
    </div>
  `;
  document.getElementById('sort-select').addEventListener('change', (e) => {
    currentSort = e.target.value;
    renderCategoryList(categoryId);
  });
  const articles = await fetchLibraryCategory(categoryId);
  if (!articles.length) {
    area.querySelector('.empty-state').textContent = 'Henüz makale yok.';
    return;
  }
  const stats = await fetchArticleStats(articles.map(a => a.id));
  const sorted = applySort(articles, stats, currentSort);
  const items = sorted.map(a => {
    const meta = [
      a.author ? libEsc(a.author) : null,
      a.published_at ? libEsc(formatLibDate(a.published_at)) : null,
    ].filter(Boolean).join(' · ');
    const likes = stats.likes[a.id] || 0;
    const dislikes = stats.dislikes[a.id] || 0;
    const { likeLabel, dislikeLabel } = formatReactionPct(likes, dislikes);
    const counts = `
      <span class="item-counts">
        <span title="Beğenenler">👍 ${likeLabel}</span>
        <span title="Beğenmeyenler">👎 ${dislikeLabel}</span>
        <span title="Yorumlar">💬 ${stats.comments[a.id] || 0}</span>
      </span>
    `;
    return `
      <div class="article-item" data-id="${a.id}">
        <div class="item-title">${libEsc(a.title)}</div>
        ${meta ? `<div class="item-byline">${meta}</div>` : ''}
        <div class="item-summary">${libEsc(a.summary || '')}</div>
        ${counts}
      </div>
    `;
  }).join('');
  area.innerHTML = `
    <div class="article-list">
      <div class="list-head">
        <div class="source-heading">${name}</div>
        <label class="sort-control">
          <span>Sırala</span>
          <select id="sort-select">
            ${LIB_SORT_OPTIONS.map(o => `<option value="${o.value}"${o.value === currentSort ? ' selected' : ''}>${o.label}</option>`).join('')}
          </select>
        </label>
      </div>
      ${items}
    </div>
  `;
  document.getElementById('sort-select').addEventListener('change', (e) => {
    currentSort = e.target.value;
    renderCategoryList(categoryId);
  });
  area.querySelectorAll('.article-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const article = articles.find(x => x.id === id);
      if (article) renderArticleDetail(categoryId, article);
    });
  });
}

function formatLibDate(iso) {
  if (!iso) return '';
  try {
    return I18N.formatDate(iso, { year:'numeric', month:'long', day:'numeric' });
  } catch { return ''; }
}

// Plain (non-paginated) article body: escapes text and turns newlines into
// <br>, except lines that are just an [[img::URL]] token, which become an
// inline image instead.
function renderPlainBodyWithImages(text) {
  const imgLineRe = /^\s*\[\[img::(\S+?)\]\]\s*$/;
  return String(text).replace(/\r\n/g, '\n').split('\n').map(line => {
    const m = line.match(imgLineRe);
    return m ? `<img class="body-img" src="${libEsc(m[1])}" alt="" loading="lazy">` : libEsc(line);
  }).join('<br>');
}

function renderArticleDetail(categoryId, article) {
  const area = document.getElementById('article-area');
  const name = LIB_CATEGORY_LABELS[categoryId];
  if (!area || !article) return;
  const byline = [
    article.author ? libEsc(article.author) : null,
    article.published_at ? libEsc(formatLibDate(article.published_at)) : null,
  ].filter(Boolean).join(' · ');
  area.innerHTML = `
    <div class="article-detail">
      <button class="back-btn" id="back-to-list">← ${name}</button>
      <div class="detail-source">${name}</div>
      <div class="detail-title">${libEsc(article.title)}</div>
      ${byline ? `<div class="detail-byline">${byline}</div>` : ''}
      ${article.summary ? `<div class="detail-summary">${libEsc(article.summary)}</div>` : ''}
      ${article.body ? `<div class="detail-body">${renderPlainBodyWithImages(article.body)}</div>` : ''}
      ${article.url ? `<a class="detail-link" href="${article.url}" target="_blank" rel="noopener">Kaynakta Oku ↗</a>` : ''}

      <div class="reaction-bar" id="reaction-bar">
        <button class="reaction-btn" data-rx="like" id="rx-like">
          <span class="rx-icon">👍</span>
          <span class="rx-count" id="rx-like-count">—</span>
        </button>
        <button class="reaction-btn" data-rx="dislike" id="rx-dislike">
          <span class="rx-icon">👎</span>
          <span class="rx-count" id="rx-dislike-count">—</span>
        </button>
      </div>

      <section class="article-comments" id="article-comments">
        <h3 class="comments-heading">Yorumlar</h3>
        <div class="comments-list" id="comments-list">
          <div class="empty-state" style="padding:12px;"><span class="spinner"></span></div>
        </div>
        <form class="comment-composer" id="comment-composer">
          <textarea id="comment-body" maxlength="5000" placeholder="Yorumunuzu yazın..." rows="3"></textarea>
          <div class="composer-row">
            <span class="composer-msg" id="composer-msg"></span>
            <button type="submit" class="composer-submit" id="comment-submit">Gönder</button>
          </div>
        </form>
      </section>
    </div>
  `;
  document.getElementById('back-to-list').addEventListener('click', () => renderCategoryList(categoryId));
  if (window.IstPersonMentions) IstPersonMentions.linkify(area, personMentionsRoster);
  loadComments(article.id);
  loadReactions(article.id);
  document.getElementById('comment-composer').addEventListener('submit', (e) => {
    e.preventDefault();
    submitComment(article.id);
  });
  document.querySelectorAll('#reaction-bar .reaction-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleReaction(article.id, btn.dataset.rx));
  });

async function loadReactions(articleId) {
  const { data: { session } } = await sb.auth.getSession();
  const myUid = session?.user?.id;

  const { data, error } = await sb.from('library_article_reactions')
    .select('user_id, reaction').eq('article_id', articleId);
  if (error) { console.error('[reactions]', error); return; }
  let likes = 0, dislikes = 0, mine = null;
  (data || []).forEach(r => {
    if (r.reaction === 'like') likes++;
    else if (r.reaction === 'dislike') dislikes++;
    if (myUid && r.user_id === myUid) mine = r.reaction;
  });
  const likeEl = document.getElementById('rx-like');
  const dislikeEl = document.getElementById('rx-dislike');
  if (!likeEl || !dislikeEl) return;
  const { likeLabel, dislikeLabel } = formatReactionPct(likes, dislikes);
  document.getElementById('rx-like-count').textContent = likeLabel;
  document.getElementById('rx-dislike-count').textContent = dislikeLabel;
  likeEl.classList.toggle('active', mine === 'like');
  dislikeEl.classList.toggle('active', mine === 'dislike');
}

async function toggleReaction(articleId, reaction) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { alert('Önce giriş yapın.'); return; }
  const uid = session.user.id;

  // Find current reaction (if any).
  const { data: existing } = await sb.from('library_article_reactions')
    .select('reaction').eq('article_id', articleId).eq('user_id', uid).maybeSingle();

  if (existing && existing.reaction === reaction) {
    // Toggle off.
    await sb.from('library_article_reactions').delete()
      .eq('article_id', articleId).eq('user_id', uid);
  } else {
    // Insert or switch via upsert.
    await sb.from('library_article_reactions')
      .upsert({ article_id: articleId, user_id: uid, reaction }, { onConflict: 'article_id,user_id' });
  }
  loadReactions(articleId);
}

async function loadComments(articleId) {
  const listEl = document.getElementById('comments-list');
  if (!listEl) return;
  const { data: { session } } = await sb.auth.getSession();
  const currentUid = session?.user?.id;

  const { data: comments, error } = await sb.from('library_article_comments')
    .select('*').eq('article_id', articleId)
    .order('created_at', { ascending: true });
  if (error) { listEl.innerHTML = `<div class="empty-state" style="padding:12px;">Yorumlar yüklenemedi.</div>`; return; }
  if (!comments || !comments.length) {
    listEl.innerHTML = '<div class="empty-state" style="padding:12px;">Henüz yorum yok.</div>';
    return;
  }

  const authorIds = [...new Set(comments.map(c => c.author_id))];
  const { data: authors } = await sb.from('profiles_public')
    .select('id, first_name, last_name, neighborhood')
    .in('id', authorIds);
  const authorMap = {};
  (authors || []).forEach(p => { authorMap[p.id] = p; });

  listEl.innerHTML = comments.map(c => {
    const a = authorMap[c.author_id] || {};
    const name = capitalizeName(((a.first_name || '') + ' ' + (a.last_name || '')).trim()) || 'Üye';
    const nb = a.neighborhood ? (' · ' + libEsc(a.neighborhood)) : '';
    const when = formatRelative(c.created_at);
    const own = currentUid && c.author_id === currentUid;
    return `
      <div class="comment-row">
        <div class="comment-meta">
          <span class="comment-author">${libEsc(name)}</span>
          <span class="comment-when">${when}${nb}</span>
          ${own ? `<button class="comment-delete" data-id="${c.id}" type="button">Sil</button>` : ''}
        </div>
        <div class="comment-body">${libEsc(c.body).replace(/\n/g, '<br>')}</div>
      </div>
    `;
  }).join('');
  if (window.IstPersonMentions) IstPersonMentions.linkify(listEl, personMentionsRoster);

  listEl.querySelectorAll('.comment-delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Yorumu sil?')) return;
      const { error } = await sb.from('library_article_comments').delete().eq('id', btn.dataset.id);
      if (error) { alert('Silinemedi: ' + error.message); return; }
      loadComments(articleId);
    });
  });
}

function formatRelative(iso) {
  const d = new Date(iso);
  const mins = Math.floor((Date.now() - d.getTime()) / 60000);
  const en = I18N.isEnglish();
  if (mins < 1) return en ? 'now' : 'şimdi';
  if (mins < 60) return en ? `${mins}m ago` : `${mins} dk önce`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return en ? `${hrs}h ago` : `${hrs} saat önce`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return en ? `${days}d ago` : `${days} gün önce`;
  return I18N.formatDate(d, { year:'numeric', month:'short', day:'numeric' });
}

async function submitComment(articleId) {
  const ta = document.getElementById('comment-body');
  const btn = document.getElementById('comment-submit');
  const msg = document.getElementById('composer-msg');
  const body = ta.value.trim();
  if (!body) { msg.textContent = 'Boş bırakılamaz.'; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { msg.textContent = 'Önce giriş yapın.'; return; }

  btn.disabled = true;
  btn.textContent = 'Gönderiliyor...';
  msg.textContent = '';

  const { error } = await sb.from('library_article_comments')
    .insert([{ article_id: articleId, author_id: session.user.id, body }]);

  btn.disabled = false;
  btn.textContent = 'Gönder';

  if (error) { msg.textContent = 'Hata: ' + error.message; return; }
  ta.value = '';
  loadComments(articleId);
}

// Shelves are loaded after the supabase client is ready
// (see the bootstrap call at the end of this script).
async function bootstrapLibraryNav() {
  await loadShelvesUI();
}

// ══════════════════════════════════════════
// Kütüphane v5 reader: shelves → article path → article reader
// Shelves used to render always-open in the left column; that spot is now
// Dünya news (see below), so browsing shelves lives entirely inside the
// reader-overlay sheet, opened via the "Makaleler" box (see .lib-boxes
// markup and openLibraryShelvesSheet).
// ══════════════════════════════════════════
let SHELVES_CACHE = [];
let SHELF_COUNTS = {};
let SHELF_ARTICLE_IDS = {};
let LIB_USER_ID = null;
let SHELVES_LOADED = false;
let SHELVES_LOAD_ERROR = false;

async function loadShelvesUI() {
  const [shRes, artRes, userId] = await Promise.all([
    sb.from('library_shelves').select('*').order('id', { ascending: true }),
    sb.from('library_articles').select('id, shelf_id'),
    libGetCurrentUserId(),
  ]);
  SHELVES_LOADED = true;
  if (shRes.error) {
    SHELVES_LOAD_ERROR = true;
    return;
  }
  SHELVES_LOAD_ERROR = false;
  SHELVES_CACHE = shRes.data || [];
  LIB_USER_ID = userId;
  SHELF_COUNTS = {};
  SHELF_ARTICLE_IDS = {};
  (artRes.data || []).forEach(r => {
    if (r.shelf_id == null) return;
    SHELF_COUNTS[r.shelf_id] = (SHELF_COUNTS[r.shelf_id] || 0) + 1;
    (SHELF_ARTICLE_IDS[r.shelf_id] || (SHELF_ARTICLE_IDS[r.shelf_id] = [])).push(r.id);
  });
}

// Chapters read vs. total for a shelf, for the "3/6" style progress badge
// on its button. Reads localStorage fresh each call so it stays accurate
// right after a chapter is completed, without a full shelves refetch.
function shelfProgress(shelfId) {
  const ids = SHELF_ARTICLE_IDS[shelfId] || [];
  if (!ids.length) return null;
  const completed = libReadCompletedSet(LIB_USER_ID);
  const done = ids.filter(id => completed.has(id)).length;
  return { done, total: ids.length };
}

// Slides a column's current cards out toward its outer screen edge, then
// rebuilds it and slides the fresh cards back in from that same edge.
// `direction` is 'left' (profile/scores, left column) or 'right' (shelves,
// right column) -- see the .card-entering-*/.card-leaving-* CSS. Renders
// immediately (no leave animation) on first paint, when the container
// starts out empty. Cards enter with a staggered delay by list position,
// so the topmost card arrives first and lower ones follow. Same pattern
// as Hane's news/events and Kahvehane's discussion feed/scoreboard.
const CARD_SWAP_MS = 300;
const CARD_STAGGER_MS = 160;
function animateFeedSwap(container, direction, buildFn) {
  const enterClass = direction === 'left' ? 'card-entering-left' : 'card-entering-right';
  const leaveClass = direction === 'left' ? 'card-leaving-left' : 'card-leaving-right';
  const playEnter = () => {
    buildFn();
    staggerEntrance(Array.from(container.children), direction);
  };
  const existing = Array.from(container.children);
  if (!existing.length) { playEnter(); return; }
  existing.forEach(el => el.classList.add(leaveClass));
  setTimeout(playEnter, CARD_SWAP_MS);
}

// Applies the staggered slide-in entrance to an already-rendered list of
// elements (used directly by loadProfile() for the left column's fixed
// set of blocks, which only render once rather than repeatedly swapping
// like a feed) -- also the tail end of animateFeedSwap() above.
function staggerEntrance(elements, direction) {
  const enterClass = direction === 'left' ? 'card-entering-left' : 'card-entering-right';
  elements.filter(Boolean).forEach((el, i) => {
    el.style.animationDelay = `${i * CARD_STAGGER_MS}ms`;
    el.classList.add(enterClass);
    el.addEventListener('animationend', () => {
      el.classList.remove(enterClass);
      el.style.animationDelay = '';
    }, { once: true });
  });
}

// Builds the shelf-grid markup alone (no wrapping sheet chrome) -- shared
// by renderShelfButtons (the sheet's top level) below.
function shelfListInnerHtml(activeShelfId) {
  if (SHELVES_LOAD_ERROR) {
    return `<div class="empty-state" style="padding:20px;font-size:0.78rem;">Raflar yüklenemedi.</div>`;
  }
  const filledShelves = SHELVES_CACHE.filter(s => (SHELF_COUNTS[s.id] || 0) > 0);
  if (!filledShelves.length) {
    return `<div class="empty-state" style="padding:20px;font-size:0.78rem;">Henüz raf yok.</div>`;
  }
  return `<div class="shelves">${filledShelves.map(s => {
    const active = s.id === activeShelfId;
    const name = (s.name_tr || '').trim();
    const subtitle = (s.subtitle_tr || '').trim();
    const display = name || `Raf ${s.id}`;
    const subtitleHtml = subtitle ? `<div class="shelf-subtitle">${libEsc(subtitle)}</div>` : '';
    const progress = shelfProgress(s.id);
    const progressHtml = progress
      ? `<div class="shelf-progress">${progress.done}/${progress.total}</div>`
      : '';
    return `
      <a class="shelf-btn${active ? ' shelf-active' : ''}" data-shelf="${s.id}" href="#">
        <div>
          <div class="shelf-title">${libEsc(display)}</div>
          ${subtitleHtml}
          ${progressHtml}
        </div>
      </a>
    `;
  }).join('')}</div>`;
}

// Sheet's top level -- the shelf list itself. Reached from the "Makaleler"
// box (openLibraryShelvesSheet) and from a shelf-path's "← Raflar" back
// button (renderShelfPathView, openShelfPath's error/empty branches),
// which return here without closing the sheet.
function renderShelfButtons(activeShelfId = null) {
  const area = document.getElementById('reader-overlay-sheet');
  if (!area) return;
  area.innerHTML = `
    <div class="shelf-path">
      ${arrowHeadHTML('Makaleler', 'shelves-back', 'Kütüphane')}
      ${shelfListInnerHtml(activeShelfId)}
    </div>
  `;
  document.getElementById('shelves-back').addEventListener('click', closeReaderOverlay);
  area.querySelectorAll('.shelf-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      openShelfPath(Number(btn.dataset.shelf));
    });
  });
}

// Entry point for the "Makaleler" box (see .lib-boxes markup) -- rises the
// reader overlay straight into the shelf list, fetching it first if this
// is the first time it's been opened this session.
async function openLibraryShelvesSheet() {
  const overlay = document.getElementById('reader-overlay');
  const area = document.getElementById('reader-overlay-sheet');
  if (!overlay || !area) return;
  area.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
  IstSheet.open(overlay);
  _closeReaderOverlay = closeReaderOverlay;
  if (!SHELVES_LOADED) await loadShelvesUI();
  renderShelfButtons();
}

// ══════════════════════════════════════════
// Mektuplar (letters) -- deliberately flat: no shelf, no chapters, just a
// title/date/body list reading public.library_letters (see
// db/library_letters.sql). Reuses the same reader-overlay sheet as
// Makaleler, but with its own much simpler list + single-page views.
// ══════════════════════════════════════════
let LETTERS_CACHE = null; // null = not fetched yet this session
// Which letters this member has already opened (library_letter_reads).
// A Set of letter ids, null until fetched.
let LETTER_READS = null;

async function loadLetters() {
  if (LETTERS_CACHE) return LETTERS_CACHE;
  const { data, error } = await sb.from('library_letters')
    .select('*')
    .order('letter_date', { ascending: false, nullsFirst: false })
    .order('created_at', { ascending: false });
  if (error) {
    console.error('[kutuphane letters]', error);
    LETTERS_CACHE = [];
    return LETTERS_CACHE;
  }
  LETTERS_CACHE = data || [];
  return LETTERS_CACHE;
}

// The member's own read receipts. Fetched once per session and kept in
// step by hand afterwards (openLetterReader adds to it), so opening a
// letter drops the count on the box immediately rather than after a
// round-trip.
async function loadLetterReads() {
  if (LETTER_READS) return LETTER_READS;
  const uid = await libGetCurrentUserId();
  if (!uid) { LETTER_READS = new Set(); return LETTER_READS; }
  const { data, error } = await sb.from('library_letter_reads')
    .select('letter_id')
    .eq('user_id', uid);
  if (error) {
    console.error('[kutuphane letter reads]', error);
    // Left unset so the next open tries again -- a failed fetch must not
    // become "everything is unread" for the rest of the session.
    return new Set();
  }
  LETTER_READS = new Set((data || []).map(r => r.letter_id));
  return LETTER_READS;
}

function letterIsRead(letter) {
  return !!(LETTER_READS && LETTER_READS.has(letter.id));
}

// Writes the receipt and keeps the local set in step. Ignores duplicates
// rather than checking first: opening a letter twice is the ordinary
// case, and the primary key already says what should happen.
async function markLetterRead(letter) {
  if (letterIsRead(letter)) return;
  const uid = await libGetCurrentUserId();
  if (!uid) return;
  if (LETTER_READS) LETTER_READS.add(letter.id);
  refreshLetterBadge();
  const { error } = await sb.from('library_letter_reads')
    .upsert({ user_id: uid, letter_id: letter.id }, { onConflict: 'user_id,letter_id', ignoreDuplicates: true });
  if (error) console.error('[kutuphane letter read]', error);
}

// The app-icon badge on the Posta Kutusu box: how many letters this
// member has never opened. Removed entirely at zero -- an empty ring
// sitting on the corner would still read as "something is waiting".
function refreshLetterBadge() {
  const box = document.getElementById('lib-box-mektuplar');
  if (!box) return;
  const unread = (LETTERS_CACHE || []).filter(l => !letterIsRead(l)).length;
  let badge = box.querySelector('.lib-box-badge');
  if (!unread) { if (badge) badge.remove(); return; }
  if (!badge) {
    badge = document.createElement('span');
    badge.className = 'lib-box-badge';
    box.appendChild(badge);
  }
  badge.textContent = unread > 99 ? '99+' : String(unread);
  badge.setAttribute('aria-label', unread + ' okunmamış mektup');
}

// Called from mount(), on every entry to the page (a virtual navigation
// rebuilds the box, so the badge has to be put back on it), and cheap on
// a revisit because both fetches are cached for the session.
async function initLetterBadge() {
  await Promise.all([loadLetters(), loadLetterReads()]);
  refreshLetterBadge();
}

function formatLetterDate(dateStr) {
  if (!dateStr) return '';
  // dateStr is a plain YYYY-MM-DD (Postgres `date`) -- parse as local, not
  // UTC-midnight, so it doesn't roll back a day in western timezones.
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('tr-TR', { year: 'numeric', month: 'long', day: 'numeric' });
}

// Entry point for the "Mektuplar" box (see .lib-boxes markup).
async function openMektuplarSheet() {
  const overlay = document.getElementById('reader-overlay');
  const area = document.getElementById('reader-overlay-sheet');
  if (!overlay || !area) return;
  area.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
  IstSheet.open(overlay);
  _closeReaderOverlay = closeReaderOverlay;
  const [letters] = await Promise.all([loadLetters(), loadLetterReads()]);
  renderLettersList(letters);
}

function renderLettersList(letters) {
  const area = document.getElementById('reader-overlay-sheet');
  if (!area) return;
  // Each letter says whether it has been opened: an unread one is dotted
  // (the same red the box's badge wears, so the count on the corner and
  // the letters it stands for are visibly the same thing), a read one
  // says "Okundu" the way a finished chapter does on a shelf.
  const listHtml = letters.length
    ? `<div class="shelves">${letters.map(l => {
        const read = letterIsRead(l);
        return `
        <a class="shelf-btn letter-btn${read ? ' letter-read' : ''}" data-letter="${libEsc(l.id)}" href="#">
          ${read ? '' : '<span class="letter-dot" aria-hidden="true"></span>'}
          <div>
            <div class="shelf-title">${libEsc(l.title)}</div>
            ${l.letter_date ? `<div class="shelf-subtitle">${libEsc(formatLetterDate(l.letter_date))}</div>` : ''}
            <div class="letter-state">${read ? 'Okundu' : 'Okunmadı'}</div>
          </div>
        </a>
        `;
      }).join('')}</div>`
    : `<div class="empty-state" style="padding:20px;font-size:0.78rem;">Henüz mektup yok.</div>`;
  area.innerHTML = `
    <div class="shelf-path">
      ${arrowHeadHTML('Posta Kutusu', 'letters-back', 'Kütüphane')}
      ${listHtml}
    </div>
  `;
  document.getElementById('letters-back').addEventListener('click', closeReaderOverlay);
  area.querySelectorAll('.shelf-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const letter = letters.find(l => l.id === btn.dataset.letter);
      if (letter) openLetterReader(letter, letters);
    });
  });
}

// Plain paragraphs only -- no page-splitting, no vote widgets, no vocab
// tooltips (those are Makaleler-specific pedagogical features a letter
// has no use for). Blank lines separate paragraphs.
function renderLetterBodyHtml(body) {
  const escaped = libEsc(body || '');
  return escaped.split(/\n{2,}/).map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '').join('');
}

// A letter is one scrollable page -- title, date, body -- with a back
// button to the letters list, no chapters/steps/next-button to click
// through (unlike openArticleReader's Duolingo-style Makaleler reader).
function openLetterReader(letter, letters) {
  const area = document.getElementById('reader-overlay-sheet');
  if (!area) return;
  area.innerHTML = `
    <div class="shelf-path">
      ${arrowHeadHTML(null, 'letter-back', 'Posta Kutusu')}
      <h2 class="path-title" style="margin-bottom:4px;">${libEsc(letter.title)}</h2>
      ${letter.letter_date ? `<p class="path-subtitle">${libEsc(formatLetterDate(letter.letter_date))}</p>` : ''}
      <div class="reader-section-body" style="margin-top:14px;">${renderLetterBodyHtml(letter.body)}</div>
    </div>
  `;
  // Opening it is reading it -- there is nothing to click through here,
  // the whole letter is on this one page. The badge drops by one now;
