<script>
// Wrapped in a scoping IIFE so this page's top-level declarations (sb,
// neighborhoodNames, etc.) don't leak to the global scope -- a future
// client-side navigation may execute this same script a second time in a
// document that already ran another carousel page's script, and without
// this wrapper a repeated `const` at global scope throws a
// duplicate-declaration SyntaxError.
(function () {
// Game overlay: clicking a game link opens it as a bottom sheet (an
// iframe loading the game's own, otherwise-unmodified page) instead of
// navigating away from Kahvehane. Closing it — the ✕ button, clicking
// the backdrop, or a postMessage from the game's own ← Geri button
// (see sozcel.html/tumcel.html/bulmaca.html) — just hides the sheet;
// Kahvehane itself was never actually left. The scoreboard stays on the
// full weekly board throughout — opening a game doesn't narrow it to that
// game's own scores. The left column (discussion feed) is left alone —
// the game already has its own help (question-mark) button, so a duplicate
// instructions blurb here was redundant.

(function initGameOverlay() {
  const overlay = document.getElementById('game-overlay');
  const sheet = document.getElementById('game-overlay-sheet');
  const frame = document.getElementById('game-overlay-frame');
  const backdrop = document.getElementById('game-overlay-backdrop');
  if (!overlay || !sheet || !frame || !backdrop) return;

  // Opening/closing/positioning are the shared sheet's (see sheet.js);
  // the iframe's src is the only part that belongs to this page, and it
  // is cleared only once the sheet is off-screen.
  function openGame(href) {
    frame.src = href;
    IstSheet.open(overlay);
  }
  function closeGame() {
    IstSheet.close(overlay, () => { frame.src = 'about:blank'; });
    // Coming back out of a game is the other half of the deck's own
    // sentence: play the one on top, come back, the question that follows
    // it is standing there. The sheet never left this page, so nothing
    // re-mounts on its own -- without this the deck stayed exactly as it
    // was until the reader swiped away and back. It re-reads what has
    // been finished rather than assuming the game just played was: a game
    // opened and closed mid-way is still on top of the deck (see
    // buildGameDeck's own note on that).
    const uid = window.__currentUser && window.__currentUser.id;
    if (!uid) return;
    markPlayedGames(uid);
    buildGameDeck(uid);
    if (typeof applyGameLocks === 'function') applyGameLocks(sb);
  }

  // Delegated on document (not bound per-node) -- a virtual navigation
  // (see router.js) replaces #ist-content's whole subtree on every
  // revisit to this page, including these .game-link cards, so a
  // listener bound once to the original nodes would go stale after the
  // first navigate-away-and-back.
  document.addEventListener('click', (e) => {
    const link = e.target.closest('.game-link');
    if (!link) return;
    e.preventDefault();
    if (link.classList.contains('locked')) return;
    openGame(link.getAttribute('href'));
  });
  // No standalone ✕ — the game's own ← back button (postMessage below)
  // and clicking outside the sheet both close it.
  backdrop.addEventListener('click', closeGame);
  window.addEventListener('message', (e) => {
    if (e.source === frame.contentWindow && e.data === 'ist-close-game-overlay') closeGame();
  });
})();

// The detail sheet: plain HTML content (the Kahve Endeksi board, or a
// venue drilled into from it) rather than the game sheet's iframe -- the
// same object either way, opened and closed by the shared sheet
// helpers (see sheet.js). It carries .ist-sheet-dim because the board is
// a destination rather than something read beside the map: while it is
// open the map behind it is scenery, so it tints it. Same treatment as
// the PETEK sheet, and for the same reason (see sheet.css).
function openDetail(html) {
  const overlay = document.getElementById('kahvehane-detail');
  const body = document.getElementById('kahvehane-detail-body');
  if (!overlay || !body) return;
  body.innerHTML = html;
  if (window.IstPersonMentions) IstPersonMentions.linkify(body, personMentionsRoster);
  body.scrollTop = 0;
  IstSheet.open(overlay);
}
function closeDetail() {
  const overlay = document.getElementById('kahvehane-detail');
  if (!overlay) return;
  IstSheet.close(overlay);
}
(function initDetailOverlay() {
  const overlay = document.getElementById('kahvehane-detail');
  const backdrop = document.getElementById('kahvehane-detail-backdrop');
  const closeBtn = document.getElementById('kahvehane-detail-close');
  if (!overlay || !backdrop || !closeBtn) return;
  backdrop.addEventListener('click', closeDetail);
  closeBtn.addEventListener('click', closeDetail);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeDetail();
  });
})();

// The pull is the shared sheet's (see IstSheet.pull in sheet.js) — the
// same gesture a news item or the meclis opens with on Anahane/
// Kütüphane, so the coffee board and a venue behave identically in the
// hand. Only the dismissal is this page's: closeDetail also closes a
// drilled-into venue, if one is open.
IstSheet.pull('kahvehane-detail', { onDismiss: closeDetail });

// ── The Kahve Endeksi's own sheet ──
// The board is a destination again, reached from the corner button
// (#coffee-box) rather than standing open in a column: the column belongs
// to the day's games now. It is THE sheet, pulled like every other one
// opened over this page's map -- the board's own panel is the sheet's
// body, so nothing about how the board or a venue is rendered changes.
function openCoffeeSheet() {
  const overlay = document.getElementById('coffee-overlay');
  if (!overlay) return;
  // Always open on the board itself, scoped to whatever the map is
  // currently showing -- a venue left drilled into from last time is not
  // what "open the index" means.
  refreshCoffeeIndexPanel();
  IstSheet.open(overlay);
}
function closeCoffeeSheet() {
  const overlay = document.getElementById('coffee-overlay');
  if (!overlay) return;
  // A venue's district stays lit on the map while its panel is open --
  // closing the sheet is what puts the map back.
  if (openVenueId) closeCoffeeVenue();
  IstSheet.close(overlay);
}
(function initCoffeeOverlay() {
  const overlay = document.getElementById('coffee-overlay');
  const backdrop = document.getElementById('coffee-overlay-backdrop');
  const closeBtn = document.getElementById('coffee-overlay-close');
  if (!overlay || !backdrop || !closeBtn) return;
  backdrop.addEventListener('click', closeCoffeeSheet);
  closeBtn.addEventListener('click', closeCoffeeSheet);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeCoffeeSheet();
  });
})();
IstSheet.pull('coffee-overlay', { onDismiss: closeCoffeeSheet });
// ── The week's Skor Tahtası, from the other corner ──
// The games are fleeting -- a card is dealt, played and inked over -- so
// the score a reader just earned had nowhere to be looked at on a phone:
// the board only ever slid in over the discussion feed on a wide desktop
// while a game was still open. It is a destination of its own now, the
// mirror of the Kahve Endeksi's corner. The board itself is unchanged and
// unduplicated: the one node is carried into the sheet and back out.
function openScoreboardSheet() {
  const overlay = document.getElementById('scoreboard-overlay');
  const body = document.getElementById('scoreboard-overlay-body');
  const board = document.getElementById('scoreboard-board');
  if (!overlay || !body || !board) return;
  if (board.parentElement !== body) body.appendChild(board);
  // Whatever the map is scoped to is what the board answers for, the same
  // rule the coffee index follows -- and a week rolls over while a page
  // stays open, so it is re-read on every opening rather than trusted.
  loadScoreboard(activeMapNeighborhood || null, true);
  IstSheet.open(overlay);
}
function closeScoreboardSheet() {
  const overlay = document.getElementById('scoreboard-overlay');
  if (!overlay) return;
  IstSheet.close(overlay, () => {
    // Back to its desktop home once the sheet has finished leaving --
    // moving it mid-slide would empty the sheet in plain view.
    const home = document.getElementById('game-score-slide');
    const board = document.getElementById('scoreboard-board');
    if (home && board && board.parentElement !== home) home.appendChild(board);
  });
}
(function initScoreboardOverlay() {
  const overlay = document.getElementById('scoreboard-overlay');
  const backdrop = document.getElementById('scoreboard-overlay-backdrop');
  const closeBtn = document.getElementById('scoreboard-overlay-close');
  if (!overlay || !backdrop || !closeBtn) return;
  backdrop.addEventListener('click', closeScoreboardSheet);
  closeBtn.addEventListener('click', closeScoreboardSheet);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeScoreboardSheet();
  });
})();
IstSheet.pull('scoreboard-overlay', { onDismiss: closeScoreboardSheet });

// Delegated: the buttons live inside #ist-content, which a virtual
// navigation rebuilds wholesale. Both ids are this page's alone.
document.addEventListener('click', (e) => {
  if (e.target.closest('#coffee-box')) openCoffeeSheet();
  if (e.target.closest('#scoreboard-box')) openScoreboardSheet();
});

// Tick every 60s via the shared clock (see router.js) instead of running
// its own setInterval, which a revisit via virtual navigation would
// duplicate. Also re-rendered immediately on an I18N language change
// instead of waiting for the next tick.
function tickScoreboardCountdown() {
  const cdEl = document.getElementById('scoreboard-countdown');
  if (cdEl && cdEl.dataset.mode === 'week') setWeekProgress(cdEl);
}

const ADMIN_EMAIL = 'cemwozturk@gmail.com';

// Shared client (see router.js) — no page may declare its own createClient
// anymore, so that a future client-side navigation can run more than one
// page's script in the same document without a duplicate-declaration crash.
const sb = IstRouter.sb;

const neighborhoodNames = {
  bakirkoy:'Bakırköy', bayrampasa:'Bayrampaşa', bahcelievler:'Bahçelievler',
  sisli:'Şişli', eyupsultan:'Eyüpsultan', gop:'Gaziosmanpaşa',
  esenler:'Esenler', bagcilar:'Bağcılar', basaksehir:'Başakşehir',
  kucukcekmece:'Küçükçekmece', sultangazi:'Sultangazi', uskudar:'Üsküdar',
  kadikoy:'Kadıköy', maltepe:'Maltepe', umraniye:'Ümraniye',
  cekmekoy:'Çekmeköy', beykoz:'Beykoz', sariyer:'Sarıyer',
  besiktas:'Beşiktaş', beyoglu:'Beyoğlu', gungoren:'Güngören',
  kagithane:'Kağıthane', atasehir:'Ataşehir', zeytinburnu:'Zeytinburnu', fatih:'Fatih'
};

let selectedNeighborhood = '';
let activeMapNeighborhood = null;
let homeNeighborhood = null;
let currentUserFirstName = '';
let isAdmin = false;

// Turkish ablative suffix: -den/-dan/-ten/-tan with vowel harmony
// Turkish vowel harmony, in i18n.js where localisation lives.
function getAblativeSuffix(name) { return I18N.ablative(name); }

// Source of truth for current neighborhood is profiles.neighborhood — the
// RLS policy on neighborhood_comments enforces the same value when posting.
// Fall back to user_metadata only if the profile read fails for some reason.
// Re-run on every mount (not just the first) so it stays correct if it
// changes mid-session.
async function refreshHomeNeighborhood() {
  const user = window.__currentUser;
  // Re-apply the last known highlight immediately (synchronously, before
  // the profile fetch below) -- #ist-content's map is rebuilt fresh on
  // every mount and starts with no .home class, so without this a
  // revisit shows the map for a beat with no highlight, then fades it in
  // once the fetch resolves. That read as a visible flash; this makes a
  // revisit correct on the very first paint, with the fetch below only
  // silently correcting it later if it actually changed.
  if (homeNeighborhood) {
    const nbEl = document.getElementById(homeNeighborhood);
    if (nbEl) nbEl.classList.add('home');
    // Same reason, for the other half of the highlight: the map image
    // itself is part of #ist-content and comes back as the base map on
    // every mount (see home-map.js).
    if (window.IstHomeMap) window.IstHomeMap.apply(homeNeighborhood);
  }
  let profileNb = null;
  let profileFirst = '';
  try {
    const { data: prof } = await sb
      .from('profiles')
      .select('neighborhood, first_name')
      .eq('id', user.id)
      .maybeSingle();
    if (prof) {
      profileNb = prof.neighborhood || null;
      profileFirst = prof.first_name || '';
    }
  } catch (_) {}

  homeNeighborhood = profileNb
    || user.user_metadata?.neighborhood
    || user.user_metadata?.yasadigi_ilce
    || localStorage.getItem('yasadigi_ilce_local') || null;
  currentUserFirstName = profileFirst || user.user_metadata?.first_name || '';

  if (homeNeighborhood) {
    selectedNeighborhood = homeNeighborhood;
    const nbName = neighborhoodNames[homeNeighborhood] || homeNeighborhood;
    document.getElementById('home-nb-badge').textContent = nbName;
    // Highlight home neighborhood on map without activating it — the
    // default view is Tüm İstanbul, not the user's own neighborhood.
    const nbEl = document.getElementById(homeNeighborhood);
    if (nbEl) nbEl.classList.add('home');
    // Districts with a hand-painted map get it here in place of the base
    // one; the rest keep the .home tint the class above applies.
    if (window.IstHomeMap) window.IstHomeMap.apply(homeNeighborhood);
  } else {
    document.getElementById('home-nb-badge').textContent = 'Semt seçilmedi';
  }
}

let onI18NChangeForCountdown = null;
let discussionTickIntervalId = null;

// This page's repeatable "become the active page" work -- the part that
// re-runs on every virtual re-entry into kahvehane, not just the first
// real load (see init() below for the one-time login-gateway part: the
// auth check, mounting the profile card, resuming onboarding, the admin
// notification nudge).
// Mobile only: .col-left/.col-right are meant to fill exactly the space
// between the map and the fixed bottom nav (see #main-site's own
// grid-template-rows comment), but that "1fr" row doesn't actually
// stretch them there in practice -- #ist-content is display:contents
// (needed so a virtual navigation, see router.js, can swap it without
// disturbing #main-site's own grid), and grid item stretch sizing
// doesn't reliably propagate through a display:contents wrapper in this
// WebKit version. Measuring the real gap and setting an explicit height
// sidesteps that entirely instead of fighting the grid/flex cascade for
// it. header is position:fixed at the very bottom regardless of DOM
// position, so its own rect is a reliable, already-safe-area-aware
// reference point.
function syncColumnHeights() {
  const colRight = document.querySelector('.col-right');
  const colLeft = document.querySelector('.col-left');
  const headerEl = document.querySelector('header');
  if (!colRight || !headerEl) return;
  if (window.innerWidth > 768) {
    colRight.style.height = '';
    if (colLeft) colLeft.style.height = '';
    return;
  }
  const frameGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--frame-gap')) || 10;
  const navTop = headerEl.getBoundingClientRect().top;
  // Measured off the games column itself, and only it: .col-left is
  // display:none on a phone now (the board went behind the corner
  // button, see .corner-boxes), and a hidden element's rect is all
  // zeroes -- which would have handed the band the whole screen's
  // height instead of the strip under the map.
  const colTop = colRight.getBoundingClientRect().top;
  const height = Math.max(0, navTop - colTop - frameGap);
  colRight.style.height = height + 'px';
  // Both halves of the band, and both off the games column's own top:
  // the two decks hang from the same bottom line and have to start from
  // the same top one, or the events would sit a few pixels off the games
  // beside them.
  if (colLeft) colLeft.style.height = height + 'px';
}
window.addEventListener('resize', syncColumnHeights);


// person-mentions.js is deferred -- poll briefly (same idiom as
// IstPoliticianCard elsewhere) so a fast mount() on a slow connection
// doesn't silently skip the initial roster load.
let personMentionsRoster = [];
function loadPersonMentionsRoster(tries) {
  if (window.IstPersonMentions) {
    IstPersonMentions.loadPeople(sb).then(people => { personMentionsRoster = people; });
  } else if ((tries === undefined ? 40 : tries) > 0) {
    setTimeout(() => loadPersonMentionsRoster((tries === undefined ? 40 : tries) - 1), 60);
  }
}

// profile-card.js is deferred, so on a real page load a fast init() can
// call mount() (and thus this) before it has executed, leaving
// #library-card stuck on its spinner placeholder forever since mount()
// only fires again on a later virtual re-entry -- poll briefly the same way
// loadPersonMentionsRoster does instead of silently skipping.
function mountLibraryCardWhenReady(tries) {
  if (window.IstProfileCard) {
    IstProfileCard.mountLibraryCard({ sb, I18N, icon: IstProfileCard.COFFEE_SVG });
  } else if ((tries === undefined ? 40 : tries) > 0) {
    setTimeout(() => mountLibraryCardWhenReady((tries === undefined ? 40 : tries) - 1), 60);
  }
}

async function mount() {
  // Before the first await, so a virtual navigation (router.js swaps
  // #ist-content, then calls this) has the column heights and the square
  // tile width in place for the frame it paints on arrival -- everything
  // past the await lands well after that frame is on screen.
  syncColumnHeights();
  await refreshHomeNeighborhood();
  // Default politician card is this user's own neighborhood's mayor (not
  // İstanbul's, unlike Anahane's map-driven card) -- see politician-card.js.
  // homeNeighborhood is resolved by refreshHomeNeighborhood() above, so
  // this only ever renders once we know it (never null in practice, since
  // every profile requires a neighborhood).
  if (window.IstPoliticianCard && homeNeighborhood) {
    IstPoliticianCard.mount({
      sb, mountElId: 'politician-card', seatId: homeNeighborhood,
      seatLabel: neighborhoodNames[homeNeighborhood] || homeNeighborhood,
      openDetail,
    });
  }
  // #library-card lives inside #ist-content, so a virtual re-entry into
  // this page (router.js's navigateTo) resets it back to its spinner
  // placeholder along with the rest of the swapped HTML -- unlike
  // #ist-pc-mount (outside #ist-content, kept alive via IstProfileCard.
  // setPage), this has to be re-mounted every time, not just once from
  // init() on the real page load. See the same fix on anahane.html.
  mountLibraryCardWhenReady();
  loadPersonMentionsRoster();
  updateSubmitFormVisibility();
  syncColumnHeights();
  // header's own safe-area-inset-bottom padding can resolve a moment
  // after this first measurement on a fresh WKWebView paint (see
  // safe-area-ready.js) -- re-measure shortly after to correct for that.
  setTimeout(syncColumnHeights, 350);

  // Posts should always cascade in from the left on arrival (see
  // loadPosts's own animateFeedSwap call below) -- only the
  // scoreboard/game-buttons' entrance is meant to stay suppressed here
  // (see __istSuppressFirstCardAnim, seeded by router.js's navigateTo or
  // the pre-body script on a real load) to avoid a double-motion look
  // with the column's own slide. The game buttons get their own
  // separate staggered entrance instead now (see .game-link-enter), so
  // nothing else depends on 'left' staying suppressed here.
  if (window.__istSuppressFirstCardAnim) window.__istSuppressFirstCardAnim.left = false;

  loadPosts();
  markPlayedGames(window.__currentUser.id);
  buildGameDeck(window.__currentUser.id);
  if (typeof applyGameLocks === 'function') applyGameLocks(sb);
  loadScoreboard();
  loadCoffeeIndexPanel();
  loadKahveEvents();
  // The cards print a date and a district in the reader's own language,
  // so they are rebuilt when it changes -- registered here and dropped in
  // unmount(), the same way the countdown's own listener is, so a page
  // entered twice doesn't end up with two.
  if (onI18NChangeForEvents) I18N.offChange(onI18NChangeForEvents);
  onI18NChangeForEvents = () => renderEventsDeck();
  I18N.onChange(onI18NChangeForEvents);

  IstRouter.onTick(tickScoreboardCountdown);
  onI18NChangeForCountdown = tickScoreboardCountdown;
  I18N.onChange(onI18NChangeForCountdown);
  if (discussionTickIntervalId) clearInterval(discussionTickIntervalId);
  discussionTickIntervalId = setInterval(tickDiscussionPosts, 30000);
  // The coffee board re-ranks itself off the clock (venues opening and
  // closing, discount windows starting and ending) -- see tickCoffeeIndex.
  if (coffeeTickIntervalId) clearInterval(coffeeTickIntervalId);
  coffeeTickIntervalId = setInterval(tickCoffeeIndex, COFFEE_TICK_MS);
  I18N.onChange(tickCoffeeIndex);

  // If the current user is the picked sözcü with a pending word,
  // glow the Sözcel tile and surface a one-time mascot popup.
  (function tryGreet(tries) {
    if (window.IstSozcu) {
      window.IstSozcu.glowGameLink(sb);
      window.IstSozcu.greet({ sb, page: 'kahvehane' });
    } else if (tries > 0) {
      setTimeout(() => tryGreet(tries - 1), 80);
    }
  })(40);
}

function unmount() {
  IstRouter.offTick(tickScoreboardCountdown);
  if (onI18NChangeForCountdown) { I18N.offChange(onI18NChangeForCountdown); onI18NChangeForCountdown = null; }
  if (onI18NChangeForEvents) { I18N.offChange(onI18NChangeForEvents); onI18NChangeForEvents = null; }
  if (discussionTickIntervalId) { clearInterval(discussionTickIntervalId); discussionTickIntervalId = null; }
  if (coffeeTickIntervalId) { clearInterval(coffeeTickIntervalId); coffeeTickIntervalId = null; }
  I18N.offChange(tickCoffeeIndex);
  // A virtual navigation rebuilds #ist-content, but the board's sheet is
  // body-level and outlives it — close it (and any venue drilled into it)
  // on the way out, or it would still be standing over the next page.
  closeCoffeeSheet();
  // Same reasoning, and the event page is the more urgent of the two: it
  // is not a sheet but the band itself, so one left open would sit over
  // the next page's own band.
  snapEventPageShut();
}

async function init() {
  // Require auth
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  window.__currentUser = session.user;

  I18N.syncFromSupabase(sb, session.user.id);
  Palette.syncFromSupabase(sb, session.user.id);
  isAdmin = session.user.email === ADMIN_EMAIL;
  // Mount the shared mobile profile card. profile-card.js is deferred, so
  // wait until it's loaded (DOMContentLoaded guarantees that) — otherwise a
  // fast session check can beat the deferred script on mobile and the card
  // silently never mounts. #library-card's own mount happens in mount()
  // instead (see there for why), since init() only ever runs once, on the
  // real page load.
  function mountProfileCard() {
    if (window.IstProfileCard) {
      IstProfileCard.mount({ sb, I18N, page: 'kahvehane' });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountProfileCard);
  } else {
    mountProfileCard();
  }
  // Resume the onboarding flow if the user is mid-tour. onboarding.js is
  // deferred — poll briefly in case it hasn't landed yet.
  (function tryOnb(tries) {
    if (window.IstOnboarding) IstOnboarding.maybeRun({ sb, user: session.user, page: 'kahvehane' });
    else if (tries > 0) setTimeout(() => tryOnb(tries - 1), 60);
  })(40);

  await mount();

  // Admin one-shot notification popup — mascot bubble, shown once per user.
  (function tryNotif(tries) {
    if (window.IstAdminNotification) {
      IstAdminNotification.show({ sb });
    } else if (tries > 0) {
      setTimeout(() => tryNotif(tries - 1), 60);
    }
  })(40);
}

// The composer is always visible, regardless of which neighborhood is being
// viewed (Tüm İstanbul included) -- selectedNeighborhood already resolves to
// where the post will actually land (home neighborhood for regular users;
// the viewed neighborhood for admin, who can post anywhere), so the badge
// just mirrors that. Only hidden before we know the user's own neighborhood.
function updateSubmitFormVisibility() {
  const formEl = document.getElementById('submit-form');
  if (!formEl) return;
  if (!selectedNeighborhood) {
    formEl.style.display = 'none';
    return;
  }
  formEl.style.display = 'block';
  const badge = document.getElementById('home-nb-badge');
  if (badge) badge.textContent = neighborhoodNames[selectedNeighborhood] || selectedNeighborhood;
}

// Today's date in Europe/Istanbul, matching the dailySeed format used by each game
function getTodaySeed() {
  return IstDate.daySeed();
}

// Color games by status: started today (light gray) vs completed today (dark
// gray). A game_results row with attempts >= 1 means the game ended; attempts=0
// is the in-progress marker written by each game's markAsPlayed(). LocalStorage
// flags also mark a game as started in case the Supabase write fails.
// ── The day's sequence: the games and the questions between them ──
// The three games are one sequence with a question in each joint: play
// Sözcel, answer a question, play Tümcel, answer another, play Bulmaca,
// answer the last. On a phone that sequence is a DECK -- the same object
// Kütüphane's news is (see #dunya-news-feed there), in the same terms:
// one card in front of you, the rest standing behind it, and the front
// one leaves by being dealt. Play the game on top, come back, the
// question is standing there; throw it left or right and the next game
// is already behind it.
//
// The direction is the answer, exactly as it is on a news story: right
// is the first option, left is the second, and the option is stamped on
// the card as it goes so nobody answers a question they never saw. The
// two buttons say the same thing for a mouse.
//
// Desktop has no deck (the column prints all three tiles, the way the
// news column prints the whole list): there the question card simply
// stands above the tile it is holding shut.
//
// A day with no question in a slot has no card and no gate -- an empty
// table has to leave the site exactly as it was (see game-locks.js).
const QUESTION_ORDER = ['sozcel', 'tumcel', 'bulmaca'];
const Q_SWIPE_DEAL_PX = 84;    // throw past this and the card is dealt
const Q_SWIPE_DEAL_VEL = 0.55; // ...or a flick this fast (px/ms)
const Q_SWIPE_FLY_MS = 300;
let deckQuestions = {};   // after_game -> question row, today's, unanswered
let deckDealing = false;

function isPhoneDeck() {
  return window.matchMedia('(max-width: 768px)').matches;
}

async function buildGameDeck(userId) {
  const deck = document.getElementById('game-deck');
  if (!deck || !userId) return;
  deck.querySelectorAll('.q-card, .deck-done').forEach(el => el.remove());
  deckQuestions = {};

  const today = getTodaySeed();
  let questions = [];
  try {
    const { data, error } = await sb
      .from('daily_questions')
      .select('id, after_game, body_tr, body_en, option_a_tr, option_a_en, option_b_tr, option_b_en')
      .eq('question_date', today);
    if (!error && data) questions = data;
  } catch (_) { /* table not there yet: no questions, no gates */ }

  // Played means FINISHED, not opened. Every game writes an in-progress
  // row on the reader's first interaction (attempts: 0 -- see each game's
  // markAsPlayed), which is what marks the tile as "started"; reading a
  // row's mere existence as played dealt the card out from under a game
  // still being played, and a dealt card is gone for the day -- somebody
  // on their second guess came back to find Sözcel out of the deck and no
  // way to reach it. `attempts >= 1` is the same rule markPlayedGames
  // uses for its started/completed colouring; the two must agree.
  const played = new Set();
  try {
    const { data } = await sb.from('game_results').select('game, attempts').eq('user_id', userId).eq('date', today);
    (data || []).forEach(r => { if ((r.attempts || 0) >= 1) played.add(r.game); });
  } catch (_) {}
  // A game the admin has switched off for today is not a step the reader
  // has left to take -- it is not part of the day's sequence at all. So it
  // leaves the deck exactly the way a finished game does, rather than
  // standing in it locked: a card that can never be dealt is a deck that
  // can never be emptied, and reaching the bottom is the whole point (a
  // day whose only game is Sözcel ends on "Hepsi bu kadar." the moment
  // Sözcel is done, the same as Kütüphane's news deck). The admin keeps
  // theirs -- they own the switch, and their nav link stays open too (see
  // game-locks.js).
  let offGames = new Set();
  if (!isAdmin && window.IstGameLocks) {
    try { offGames = await IstGameLocks.offGamesToday(sb); } catch (_) {}
  }

  const answered = new Set();
  if (questions.length) {
    try {
      const { data } = await sb.from('question_answers')
        .select('question_id').eq('user_id', userId)
        .in('question_id', questions.map(q => q.id));
      (data || []).forEach(r => answered.add(r.question_id));
    } catch (_) {}
  }
  questions.forEach(q => { if (!answered.has(q.id)) deckQuestions[q.after_game] = q; });

  // The deck is the sequence with everything already done taken out of
  // it: a game *finished* today is dealt with, and so is a question
  // already answered. A game merely started is not done with -- it stays
  // on top of the deck, marked, waiting to be gone back to. What is left, in order, is what the reader still has in
  // front of them -- and the first of those is the top of the deck.
  const phone = isPhoneDeck();
  QUESTION_ORDER.forEach(game => {
    const tile = deck.querySelector(`.game-link-enter:has(.game-link[data-game="${game}"])`)
      || Array.from(deck.querySelectorAll('.game-link-enter'))
          .find(el => el.querySelector(`.game-link[data-game="${game}"]`));
    // Only the deck takes cards out: the desktop column prints all three
    // tiles whatever has been played, the way the news column prints the
    // whole list. A played game's card is *removed* rather than hidden --
    // the deck's depth is nth-child, and a hidden child still counts, so
    // one left in place would push the fourth card into the rule that
    // stops drawing them. (The tiles come back with the page: router.js
    // swaps #ist-content whole on every entry.)
    if (tile && phone && (played.has(game) || offGames.has(game))) tile.remove();
    const q = deckQuestions[game];
    if (!q) return;
    const card = questionCardHTML(q);
    if (phone) {
      // Behind its own game until that game is played: the order is what
      // makes the sequence, and only the top card is reachable.
      if (tile && tile.isConnected && tile.nextSibling) deck.insertBefore(card, tile.nextSibling);
      else if (tile && tile.isConnected) deck.appendChild(card);
      else deck.insertBefore(card, deck.children[deckIndex(deck, game)] || null);
    } else if (played.has(game)) {
      // Desktop: the question stands above the tiles, over the one it is
      // holding shut. Only the due one is printed -- there is no deck
      // here to hold the others in.
      const picker = document.getElementById('game-picker');
      const heading = picker && picker.querySelector('h2');
      if (picker && !picker.querySelector('.q-card')) {
        if (heading && heading.nextSibling) picker.insertBefore(card, heading.nextSibling);
        else picker.insertBefore(card, picker.firstChild);
      }
    }
    if (card.isConnected) wireQuestionCard(card);
  });

  if (phone) paintDeckDone();
}

// The bottom of the deck, in the same words Kütüphane's uses: reaching
// the end is the app doing its job, so it says so and points at the door.
// Where a question whose own game card has already gone belongs: in
// front of every card of a later game, behind everything of an earlier
// one. Walking the deck rather than counting, because what is in it
// depends on what has been played.
function deckIndex(deck, game) {
  const after = QUESTION_ORDER.slice(QUESTION_ORDER.indexOf(game) + 1);
  const kids = Array.from(deck.children);
  const i = kids.findIndex(el => {
    const link = el.querySelector && el.querySelector('.game-link[data-game]');
    return link && after.includes(link.dataset.game);
  });
  return i === -1 ? kids.length : i;
}

function paintDeckDone() {
  const deck = document.getElementById('game-deck');
  if (!deck) return;
  const left = Array.from(deck.children).filter(el => !el.classList.contains('deck-done'));
  const done = deck.querySelector('.deck-done');
  if (left.length) { if (done) done.remove(); return; }
  if (done) return;
  const el = document.createElement('div');
  el.className = 'deck-done';
  el.innerHTML = `<div class="deck-done-line">${I18N.t('games.q.deckdone')}</div>
    <div class="deck-done-sub">${I18N.t('games.q.deckdonesub')}</div>`;
  deck.appendChild(el);
}

function questionText(q, field) {
  const en = window.I18N && I18N.isEnglish();
  return (en && q[field + '_en']) ? q[field + '_en'] : q[field + '_tr'];
}

function questionCardHTML(q) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.dataset.questionId = q.id;
  card.innerHTML = `
    <div class="q-cue q-cue-a">${escapeHtml(questionText(q, 'option_a'))}</div>
    <div class="q-cue q-cue-b">${escapeHtml(questionText(q, 'option_b'))}</div>
    <div class="q-kicker">${I18N.t('games.q.kicker')}</div>
    <div class="q-body">${escapeHtml(questionText(q, 'body'))}</div>
    <div class="q-opts">
      <button type="button" class="q-opt" data-choice="b">${escapeHtml(questionText(q, 'option_b'))}</button>
      <button type="button" class="q-opt" data-choice="a">${escapeHtml(questionText(q, 'option_a'))}</button>
    </div>
    <div class="q-hint">${I18N.t('games.q.hint')}</div>
    <div class="q-err"></div>`;
  return card;
}

// Touch phones only for the throw -- the same condition Kütüphane's story
// swipe uses, and for the same reason: a finger is the only thing that
// can throw a card. Everywhere else the two buttons are the answer.
function wireQuestionCard(card) {
  card.querySelectorAll('.q-opt').forEach(btn => {
    btn.addEventListener('click', () => answerQuestion(card, btn.dataset.choice, 0));
  });

  const mobile = window.matchMedia('(max-width: 768px) and (pointer: coarse)');
  let sx = 0, sy = 0, dx = 0, lastX = 0, lastT = 0, vel = 0;
  let dragging = false, axis = null;

  const paintCues = () => {
    const p = Math.min(1, Math.abs(dx) / Q_SWIPE_DEAL_PX);
    const a = card.querySelector('.q-cue-a');
    const b = card.querySelector('.q-cue-b');
    if (a) a.style.opacity = dx > 0 ? p : 0;
    if (b) b.style.opacity = dx < 0 ? p : 0;
  };

  card.addEventListener('touchstart', (e) => {
    if (!mobile.matches || e.touches.length !== 1 || deckDealing) return;
    // The carousel's own swipe listens on the document (router.js): a
    // horizontal drag on the top of the deck is this card's, not a page
    // change, so it stops here.
    e.stopPropagation();
    dragging = true; axis = null; dx = 0;
    sx = lastX = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    lastT = e.timeStamp || performance.now();
    vel = 0;
    card.style.transition = 'none';
  }, { passive: true });

  card.addEventListener('touchmove', (e) => {
    if (!dragging || e.touches.length !== 1) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    // Decided once, on the first real movement: the column scrolls
    // vertically, and a drag that kept changing its mind would fight it.
    if (axis === null) {
      const adx = Math.abs(x - sx), ady = Math.abs(y - sy);
      if (adx < 6 && ady < 6) return;
      axis = adx > ady * 1.2 ? 'x' : 'y';
      if (axis === 'y') { dragging = false; card.style.transition = ''; return; }
    }
    const now = e.timeStamp || performance.now();
    const dt = now - lastT;
    if (dt > 0) vel = 0.7 * ((x - lastX) / dt) + 0.3 * vel;
    lastX = x; lastT = now;
    dx = x - sx;
    card.style.transform = `translateX(${dx}px) rotate(${dx * 0.014}deg)`;
    paintCues();
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  const end = () => {
    if (!dragging) return;
    dragging = false;
    const flicked = Math.abs(vel) > Q_SWIPE_DEAL_VEL;
    const thrown = Math.abs(dx) > Q_SWIPE_DEAL_PX;
    if (!flicked && !thrown) {
      card.style.transition = 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1)';
      card.style.transform = '';
      dx = 0; paintCues();
      setTimeout(() => { card.style.transition = ''; }, 320);
      return;
    }
    // A flick decides its own direction: a finger that started left and
    // ended up flicking right meant right.
    answerQuestion(card, (flicked ? vel : dx) > 0 ? 'a' : 'b', (flicked ? vel : dx) > 0 ? 1 : -1);
  };
  card.addEventListener('touchend', end);
  card.addEventListener('touchcancel', end);
}

// One answer, written on the way out. The card leaves either way: the
// deck advances behind it while it is still flying, so the next game is
// already standing there as the paper clears -- rather than the column
// being empty for a beat and then filling.
async function answerQuestion(card, choice, dir) {
  if (!card || deckDealing || card.dataset.answered) return;
  const id = card.dataset.questionId;
  card.dataset.answered = '1';
  deckDealing = true;

  const { error } = await sb.from('question_answers')
    .insert([{ question_id: id, user_id: window.__currentUser.id, choice }]);
  if (error) {
    delete card.dataset.answered;
    deckDealing = false;
    card.style.transition = 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1)';
    card.style.transform = '';
    const err = card.querySelector('.q-err');
    if (err) err.textContent = I18N.t('games.q.failed');
    return;
  }

  // Answered: the tile behind it is open from here on.
  Object.keys(deckQuestions).forEach(g => { if (deckQuestions[g].id === id) delete deckQuestions[g]; });
  if (typeof applyGameLocks === 'function') applyGameLocks(sb);

  const w = window.innerWidth || 400;
  card.style.transition = `transform ${Q_SWIPE_FLY_MS}ms ease-in, opacity ${Q_SWIPE_FLY_MS}ms ease-in`;
  card.style.transform = dir
    ? `translateX(${dir * (w + 140)}px) rotate(${dir * 7}deg)`
    : 'scale(0.96)';
  card.style.opacity = '0';
  setTimeout(() => {
    card.remove();
    paintDeckDone();
    deckDealing = false;
  }, Q_SWIPE_FLY_MS + 20);

  // The count comes back after the card has gone: it is a note about the
  // answer, not a result screen to sit through.
  try {
    const { data } = await sb.rpc('question_tally', { p_question_id: id });
    const tally = Array.isArray(data) ? data[0] : data;
    const same = tally ? Math.max(0, (choice === 'a' ? tally.a_count : tally.b_count) - 1) : 0;
    if (same > 0) showToast(`${same} ${I18N.t('games.q.tallyone')}`);
  } catch (_) {}
}

async function markPlayedGames(userId) {
  const today = getTodaySeed();
  const started = new Set();
  const completed = new Set();

  const localFlags = {
    bulmaca: 'bulmaca_started_' + today,
    sozcel: 'sozcel_started_' + today,
    tumcel: 'tumcel_started_' + today
  };
  for (const [game, key] of Object.entries(localFlags)) {
    if (localStorage.getItem(key)) started.add(game);
  }

  try {
    const { data, error } = await sb
      .from('game_results')
      .select('game, attempts')
      .eq('user_id', userId)
      .eq('date', today);
    if (!error && data) {
      data.forEach(r => {
        if ((r.attempts || 0) >= 1) completed.add(r.game);
        else started.add(r.game);
      });
    }
  } catch (e) { /* table may not exist yet — ignore */ }

  document.querySelectorAll('.game-link[data-game]').forEach(el => {
    const g = el.dataset.game;
    if (completed.has(g)) el.classList.add('completed');
    else if (started.has(g)) el.classList.add('started');
  });
}

// Slides a panel's current rows out toward their column's outer screen
// edge, then rebuilds it and slides the fresh rows back in from that
// same edge. `direction` is 'left' (discussion posts, left column) or
// 'right' (scoreboard, right column) -- see the .card-entering-*/
// .card-leaving-* CSS. Renders immediately (no leave animation) on first
// paint, when the panel starts out empty. Rows enter with a staggered
// delay by list position, so the topmost row arrives first and lower
// ones follow. `leadingEls` (optional) are static elements sitting above
// the container -- e.g. the game links above the scoreboard -- that
// should join the same top-to-bottom entrance cascade without being
// part of the container's own leave/rebuild cycle. Skips the entrance
// animation on the first call after arriving via the swipe-pagination
// nav (see window.__istSuppressFirstCardAnim, seeded pre-body): the
// whole column is already sliding in from that same edge, so animating
// the rows inside it too would look like the content arriving twice.
const CARD_SWAP_MS = 300;
const CARD_STAGGER_MS = 160;
// `instant`: rebuilds in place with no leave/enter animation at all (and
// no entrance cascade for leadingEls either) -- used for map neighborhood
// clicks, where the slide-out/in read as the comments/scoreboard (and the
// always-static game buttons above them) leaving and re-entering the
// screen instead of just updating.
function animateFeedSwap(container, direction, buildFn, leadingEls = [], instant = false) {
  if (instant) { buildFn(); return; }
  const suppress = window.__istSuppressFirstCardAnim && window.__istSuppressFirstCardAnim[direction];
  if (suppress) window.__istSuppressFirstCardAnim[direction] = false;
  const enterClass = direction === 'left' ? 'card-entering-left' : 'card-entering-right';
  const leaveClass = direction === 'left' ? 'card-leaving-left' : 'card-leaving-right';
  const playEnter = () => {
    buildFn();
    if (suppress) return;
    const items = [...leadingEls, ...Array.from(container.children)];
    items.forEach((el, i) => {
      el.style.animationDelay = `${i * CARD_STAGGER_MS}ms`;
      el.classList.add(enterClass);
      el.addEventListener('animationend', () => {
        el.classList.remove(enterClass);
        el.style.animationDelay = '';
      }, { once: true });
    });
  };
  const existing = Array.from(container.children);
  if (!existing.length) { playEnter(); return; }
  existing.forEach(el => el.classList.add(leaveClass));
  setTimeout(playEnter, CARD_SWAP_MS);
}

// ── Weekly scoreboard ──
// One implementation, in i18n.js -- and the null-safe one: three of the
// four copies rendered the literal text "null" for a null argument.
function escapeHtml(s) { return I18N.escapeHtml(s); }
function capitalizeName(s) {
  if (!s) return '';
  return s.trim().split(/\s+/).map(w => w ? w.charAt(0).toLocaleUpperCase('tr-TR') + w.slice(1).toLocaleLowerCase('tr-TR') : '').join(' ');
}

// game_results.date is stored as un-padded "YYYY-M-D".
// A 'YYYY-MM-DD' key as a Date. One implementation, in ist-date.js.
function parseGameDate(s) { return IstDate.parseYMD(s); }

// Points awarded per Sözcel game: 20/12/8/6/4/2 for win in 1–6 guesses; 1 for playing without winning.

// First-solver bonuses: Istanbul's first solver of the day (10) also counts
// as their district's first solver, so the separate district bonus (5) only
// ever goes to someone who is first within their district but not first
// in all of Istanbul.
const ISTANBUL_FIRST_BONUS = 10;
const NEIGHBORHOOD_FIRST_BONUS = 5;

// Points the Sözcü earns from each solver's result on their word: 5/1/2/3/2/1
// for a win found on the 1st–6th guess; 0 if the solver didn't find it.
// Mirrors sozcel.html's sozcuPoints() — keep both in sync.

// Seven-square week tracker (Monday first, matching the scoring week):
// days already passed are dark, today is double-bordered, days to come are plain.
function renderWeekProgress() {
  const nowIst = IstDate.now();
  const dow = nowIst.getDay(); // 0=Sun … 6=Sat
  const todayIdx = dow === 0 ? 6 : dow - 1; // Monday=0 … Sunday=6
  const en = I18N.isEnglish();
  const letters = en ? ['M', 'T', 'W', 'T', 'F', 'S', 'S'] : ['P', 'S', 'Ç', 'P', 'C', 'C', 'P'];
  const names = en
    ? ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']
    : ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
  const label = en ? 'Weekly progress' : 'Haftalık ilerleme';
  const days = letters.map((l, i) => {
    const cls = i < todayIdx ? 'past' : i === todayIdx ? 'today' : 'future';
    return `<span class="week-day ${cls}" title="${names[i]}">${l}</span>`;
  }).join('');
  return `<div class="week-progress" role="img" aria-label="${label}">${days}</div>`;
}
function setWeekProgress(el) {
  if (!el) return;
  el.innerHTML = renderWeekProgress();
  el.dataset.mode = 'week';
}
function clearWeekProgress(el) {
  if (!el) return;
  el.innerHTML = '';
  el.dataset.mode = '';
}
// The board's numbers come from IstScoreboard (scoreboard.js); what stays
// here is this page's own presentation of them -- the district filter, the
// title, the week-progress countdown, and the entrance cascade the game
// links join.
async function loadScoreboard(neighborhoodFilter = null, instant = false) {
  const listEl = document.getElementById('scoreboard-list');
  if (!listEl) return;
  const titleEl = document.getElementById('scoreboard-title');
  const countdownEl = document.getElementById('scoreboard-countdown');
  // Game links sit above the scoreboard and never get rebuilt; they join
  // the same top-to-bottom entrance cascade as the scoreboard rows below.
  const gameLinks = Array.from(document.querySelectorAll('.games-section .game-link'));
  const setList = (html) => animateFeedSwap(listEl, 'right', () => { listEl.innerHTML = html; }, gameLinks, instant);

  // Title + countdown swap: a filtered view is per-neighborhood (no weekly
  // countdown shown there), while the unfiltered default is the full
  // weekly leaderboard.
  if (neighborhoodFilter) {
    const nbName = neighborhoodNames[neighborhoodFilter] || neighborhoodFilter;
    if (titleEl) titleEl.textContent = I18N.formatNeighborhoodBest(nbName.toLocaleUpperCase('tr-TR'));
    clearWeekProgress(countdownEl);
  } else {
    if (titleEl) titleEl.textContent = I18N.t('games.weeklyscoreboard');
  }

  const { rows, error } = await IstScoreboard.weekly(sb, { neighborhoodFilter });
  if (error) { setList('<li class="scoreboard-empty">Skorlar yüklenemedi</li>'); return; }
  if (!rows.length) { setList(neighborhoodFilter ? '' : '<li class="scoreboard-empty">Henüz skor yok</li>'); return; }

  // A filtered view is already about one district, so naming it on every
  // row is noise.
  setList(IstScoreboard.rowsHTML(rows, {
    districtNames: neighborhoodNames,
    withDistrict: !neighborhoodFilter,
  }));

  if (!neighborhoodFilter && countdownEl) setWeekProgress(countdownEl);
}

function getMapNeighborhoods() { return document.querySelectorAll('.neighborhood'); }

// Resolve what the map label should show when nothing is being hovered:
// the active neighborhood's name, or 'İstanbul' if none is active.
function baseMapLabel() {
  if (!activeMapNeighborhood) return 'İstanbul';
  const active = document.getElementById(activeMapNeighborhood);
  return (active && active.getAttribute('data-name')) || activeMapNeighborhood;
}

document.addEventListener('click', (e) => {
  // .neighborhood is shared with Kütüphane's own (desktop) İstanbul map --
  // this listener is bound to document and outlives a virtual navigation
  // away from this page, so a click on Kütüphane's map after swapping
  // pages would otherwise reach here too and throw on #discussion-label,
  // which only this page's markup has. See CLAUDE.md's "three carousel
  // pages share one document" rule.
  if (!document.getElementById('discussion-label')) return;
  const nb = e.target.closest('.neighborhood');
  if (nb) {
    // data-neighborhood covers multi-polygon districts (e.g. Şişli's
    // exclave piece) whose element id must stay unique but which still
    // count as the same neighborhood for comment/scoreboard purposes.
    const nbId = nb.dataset.neighborhood || nb.id;
    getMapNeighborhoods().forEach(n => n.classList.toggle('active', (n.dataset.neighborhood || n.id) === nbId));
    const name = nb.getAttribute('data-name') || nbId;
    document.getElementById('map-label').textContent = name;
    document.getElementById('discussion-label').textContent = name;
    activeMapNeighborhood = nbId;
    selectedNeighborhood = (isAdmin || nbId === homeNeighborhood) ? nbId : homeNeighborhood;
    updateSubmitFormVisibility();
    // instant: a map click filters the existing feed/scoreboard to this
    // district -- it should update in place, not slide out and back in
    // (which also replays the game buttons' own entrance animation even
    // though they never change).
    loadPosts(nbId, true);
    loadScoreboard(nbId, true);
    loadCoffeeIndexPanel(nbId);
    return;
  }
  // Snap back to Tüm İstanbul only when clicking empty space inside the

  // reset.
  if (!e.target.closest('.map-panel') || e.target.closest('.map-label')) return;
  getMapNeighborhoods().forEach(n => n.classList.remove('active'));
  // Restore home highlight after clearing active state
  if (homeNeighborhood) {
    const homeEl = document.getElementById(homeNeighborhood);
    if (homeEl) homeEl.classList.add('home');
  }
  document.getElementById('map-label').textContent = 'İstanbul';
  document.getElementById('discussion-label').textContent = I18N.t('kahvehane.allistanbul');
  activeMapNeighborhood = null;
  selectedNeighborhood = homeNeighborhood;
  updateSubmitFormVisibility();
  loadPosts(null, true);
  loadScoreboard(null, true);
  loadCoffeeIndexPanel(null);
});
document.addEventListener('mouseover', (e) => {

  if (!nb) return;
  document.getElementById('map-label').textContent = nb.getAttribute('data-name') || nb.id;

document.addEventListener('mouseout', (e) => {
