  <!-- Swipe pagination: pre-body, set initial offscreen state so columns don't flash at origin before sliding in. Also seeds the VT direction class so the cross-document transition knows which way to slide before it captures the snapshot, and a one-shot flag so the posts/scoreboard card-entrance animation (see animateFeedSwap) skips its first run here -- the column itself is already sliding in from the same edge, so animating the cards inside it too would look like the content arriving twice.
       ist-entering-* (the manual transform-transition fallback, see .col-right-slide/.game-link-enter below) is only for browsers WITHOUT View Transitions support -- on VT-capable browsers the native cross-document transition already slides the whole column in as a snapshot, so also applying the fallback class made the real DOM run its own second, independent slide underneath once DOMContentLoaded released it mid-transition, producing a visible double entrance. vt-* (which drives the VT pseudo-element keyframes) is unaffected and still always seeded. -->
  <script>
    (function(){
      try {
        var _d = sessionStorage.getItem('ist-page-enter-dir');
        if (_d) {
          var _vt = ('startViewTransition' in document) && !window.Capacitor;
          if (!_vt) document.documentElement.classList.add('ist-entering-' + _d);
          document.documentElement.classList.add('vt-' + _d);
          window.__istSuppressFirstCardAnim = { left: true, right: true };
        }
      } catch(e) {}
    })();
  </script>

  <style data-page="kahvehane">
    :root {
      /* Core ink & paper — warm cream newspaper palette */
      --paper: #eddbd0;        /* main canvas */
      --paper-card: #b8947a;   /* cards/blocks — darker, for contrast over the map photo */
      --paper-banner: #c9ae9a; /* section headers/banners */
      --paper-navbar: #b89b7f; /* top nav (darkest) */
      /* RGB triplet for the map hover tint (needs alpha, so it can't
         just reference the hex --ink var). Overridden alongside
         everything else in palette.css for data-palette="mono". */
      /* Warm neutrals */
      /* Newspaper accents */
      /* Semantic aliases */
      --success: var(--accent-2);
      /* Border shortcuts */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
    }

    /* The actual grid lives on #main-site (a wrapper around everything
       except modals, matching anahane.html), not body directly -- so that
       when a virtual navigation (see router.js) swaps #ist-content's
       contents for a different page, this element -- which persists in
       the DOM across that swap since it's outside #ist-content -- keeps
       being correctly laid out by whichever page's stylesheet is
       currently active (see setActiveStylesheet), instead of silently
       losing its grid-ness whenever this page's own stylesheet gets
       disabled. frames.css already special-cases #main-site (stripping
       body's own padding, adding its own) for exactly this reason. */
    #main-site {
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* Top nav, and both side columns, are frameless -- just typography
       floating directly on the map photo (matches anahane). frames.css
       still targets these classes with !important, so beat it with a
       body-qualified override (higher specificity, wins regardless of
       stylesheet order). */
    body .section-rule,
    body .col-left,
    body .col-right,
    body main {
      background: none !important;
      box-shadow: none !important;
      border: none !important;
    }

    .section-rule {
      grid-column: 1 / -1;
      grid-row: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 28px 10px 28px;
      /* main now carries z-index:0 (see main{} below) to keep its fixed
         .map-panel child contained in its own stacking context instead of
         escaping to the root -- but that also makes main's whole subtree,
         including the full-bleed map, paint above any *non*-stacking-context
         sibling. .col-left/.col-right already get z-index:501 from
         frames.css (for the bottom-sheet layering, desktop-only), so they
         were unaffected; .section-rule had no z-index of its own and ended
         up buried under the map (matches anahane). A plain positive z-index
         (any value above main's 0) is enough to put it back on top. */
      z-index: 1;
    }

    header {
      display: flex;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 32px;
    }
    nav a {
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: color 0.2s;
      padding: 2px 0;
    }
    nav a:hover { color: var(--ink); }
    nav a.active { color: var(--ink); font-weight: 700; }

    /* ── Left column ──
       Spans both grid rows (not just row 2, alongside main) so it uses
       the space next to the top nav bar instead of leaving it empty —
       .section-rule spans the full width but only its centered nav text
       actually renders, so columns 1 and 3 of row 1 were unused. */
    .col-left {
      grid-column: 1;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Wraps everything in .col-left except #library-card, so the profile
       card can be excluded from the column's slide/view-transition
       animation below and stay visually still while switching pages. */
    .col-left-slide {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .col-left .nb-highlight {
      padding: 12px 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: var(--paper-banner);
      color: var(--ink-red);
      text-align: left;
      flex-shrink: 0;
    }

    /* ── Game score slide-in panel ──
       The weekly scoreboard used to sit permanently in col-right; now that
       spot shows the coffee index instead (see .coffee-index-panel below),
       so the scoreboard only surfaces here, sliding in over the discussion
       feed the moment a game is actually open -- the moment it's actually
       relevant. Confined to the same >1240px band where col-left stays
       visible at all while a game is open (below that, col-left goes
       visibility:hidden -- see sheet.css's own 1240px rule);
       off-screen and non-interactive otherwise so it never blocks the
       discussion feed underneath. */
    /* Containing block for BOTH left-hand slide-in panels: the game
       scoreboard above and the coffee venue panel below. The scoreboard
       only ever opens above 1240px (see its own gate), but the venue
       panel opens anywhere col-left has its desktop layout, so this
       starts at the same 769px the desktop layout itself does. Parked
       panels are clipped by col-left's own overflow:hidden.
       The column also reaches out over the page's own canvas gutter
       (frames.css rings the whole page in --frame-pad, so grid column 1
       starts one pad in from the screen). Both panels are meant to read
       as having come in from OUTSIDE the screen, and that gutter left a
       strip of bare canvas showing to the left of a panel that was
       supposed to be running off it -- dropping the panels' own left
       padding and left borders (see below) couldn't close it, since the
       gap is outside the panel entirely. So: pull the column's box left
       by one pad and hand the same amount back as padding. In-flow
       content (the discussion feed, the profile card) lands exactly
       where it did, while the panels -- positioned against the padding
       box -- now start at x=0 and run clean off the screen edge. */
    @media (min-width: 769px) {
      .col-left {
        position: relative;
        margin-left: calc(-1 * var(--frame-pad, 10px));
        padding-left: var(--frame-pad, 10px);
      }
    }
    .game-score-slide {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      /* No left padding: the board runs straight off the panel's open left
         edge (see border-left-width: 0 below) instead of sitting in a
         gutter, so it reads as having come in from outside the column
         rather than as a card parked inside it. */
      padding: 14px 14px 14px 0;
      /* Same "chapter-box" treatment as the sheets themselves (.ist-sheet
         in frames.css) -- solid frame-bg behind a
         2px ink border, no box-shadow (the border alone carries the
         weight there, and a shadow here bled a few px past the element's
         own edge into col-left even while off-screen, showing as a
         stray sliver at the column's left edge). No border-left, mirroring
         those sheets' own "no bottom border" treatment: this panel slides
         in from the left, so its left edge is the one meant to read as
         continuing past the screen instead of stopping. */
      background: var(--frame-bg);
      border: 2px solid var(--ink);
      border-left-width: 0;
      transform: translateX(-100%);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    @media (min-width: 1241px) {
      body:has(.game-overlay.open) .game-score-slide {
        transform: translateX(0);
        pointer-events: auto;
      }
    }

    /* ── Venue detail content ──
       The board is the column now, so a venue is not a panel that slides
       in over anything: the column itself drills into it and comes back
       (renderVenueHTML builds the one string, .coffee-index-panel holds
       it). Fixed white/ink language, matching .post and the board's own
       rows. */
    /* The way back: a plain in-flow link above the venue, reading as
       "back to the board". It is the only dismiss there is — the venue
       replaced the board in place, so there is nothing to close, only
       somewhere to return to. */
    .cv-back {
      display: block;
      background: none;
      border: none;
      padding: 0;
      margin-bottom: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
    }
    /* Fills the column so .cv-comments' flex:1 has real height to claim
       -- otherwise the whole detail sizes to its content and the composer
       floats halfway up the column instead of sitting at its foot. */
    .coffee-index-panel .cv-detail {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .cv-head { flex-shrink: 0; padding-right: 26px; }
    .cv-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      overflow-wrap: break-word;
    }
    /* The district the board's rows deliberately do not print -- here
       there is room for it, and it is the first thing you want once you
       have picked a venue out of the list. */
    .cv-district {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--ink-red);
      margin-top: 2px;
    }
    .cv-price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 10px;
    }
    .cv-price {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ink);
    }
    .cv-was { font-size: 0.85rem; text-decoration: line-through; opacity: 0.55; }
    .cv-status {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
      margin-top: 2px;
    }
    .cv-status.closed { color: var(--ink-red); }
    /* The venue's week, today's line inked so "am I too late" is one
       glance rather than a calculation. */
    .cv-hours { margin-top: 12px; }
    .cv-hours-title,
    .cv-comments-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .cv-day {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.72rem;
      color: var(--ink);
      padding: 1px 0;
    }
    .cv-day.today { font-weight: 700; }
    .cv-day .cv-day-hours { color: var(--muted); }
    .cv-day.today .cv-day-hours { color: var(--ink); }
    .cv-section-rule { border-top: 1px solid var(--rule); margin: 14px 0 12px; flex-shrink: 0; }
    /* Comments: scrolls on its own so the composer below stays reachable
       without the whole panel scrolling away from the venue's name. */
    .cv-comments {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .cv-comment {
      position: relative;
      background: var(--paper-card);
      border: 1px solid var(--rule);
      border-bottom-width: 3px;
      padding: 8px 10px;
      margin-bottom: 8px;
      color: var(--ink);
    }
    .cv-comment-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .cv-comment-time { color: var(--muted); font-weight: 400; letter-spacing: 0.5px; }
    .cv-comment-body { font-size: 0.8rem; line-height: 1.45; overflow-wrap: break-word; }
    .cv-comment-delete {
      position: absolute;
      top: 4px;
      right: 5px;
      background: none;
      border: none;
      font-size: 0.9rem;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      padding: 0 3px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .cv-comment:hover .cv-comment-delete { opacity: 1; }
    .cv-empty {
      font-size: 0.72rem;
      color: var(--muted);
      font-style: italic;
      padding: 8px 2px;
    }
    /* Composer, mirroring .submit-form's textarea + arrow button. */
    .cv-form { flex-shrink: 0; margin-top: 10px; }
    .cv-form-row { display: flex; gap: 6px; align-items: flex-end; }
    .cv-form textarea {
      flex: 1;
      min-width: 0;
      min-height: 38px;
      max-height: 96px;
      resize: vertical;
      padding: 8px 10px;
      border: 1px solid var(--rule);
      background: var(--paper-card);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--ink);
      outline: none;
    }
    .cv-form textarea:focus { border-color: var(--ink); }
    .cv-form button {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .cv-form button:disabled { opacity: 0.45; cursor: default; }
    .cv-form button svg { width: 17px; height: 17px; }
    .cv-status-msg {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.65rem;
      margin-top: 5px;
      min-height: 0.8rem;
    }
    .cv-status-msg.err { color: var(--ink-red); }
    .cv-status-msg.ok { color: var(--accent); }

    /* In the mobile sheet the panel chrome is the sheet's own, so the
       content lays out as a plain column with the sheet doing the
       scrolling -- no internal scroller, no absolute close button. */
    .detail-overlay-body .cv-comments { overflow: visible; }
    .detail-overlay-body .cv-detail { display: block; max-width: none; position: relative; }
    /* Same for the board itself, and it fits its sheet exactly the way
       the Skor Tahtasi fits its own (see #scoreboard-overlay-body): the
       sheet's own padding is the board's margin, the sheet's body is
       what scrolls, and the board runs the full width of it. The board
       is only ever the sheet's body now -- the column-era padding, flex
       sizing, internal scroller and 520px cap are all leftovers of the
       page column it used to be, and every one of them read as a second
       frame drawn inside the first. */
    #coffee-overlay-body { padding: 10px 12px 14px; }
    .detail-overlay-body .coffee-index-panel {
      display: block;
      flex: none;
      min-height: 0;
      padding: 0;
    }
    .detail-overlay-body .coffee-detail { max-width: none; margin: 0; }
    /* Same 4px step under the heading the scoreboard's list takes, so the
       two boards read as one object seen twice. */
    .detail-overlay-body .coffee-rows { overflow: visible; flex: none; margin-top: 4px; }

    /* Desktop keeps the three tiles exactly as they were: the deck
       wrapper is not a box there at all, so every rule below still sees
       .game-link-enter as .game-picker's own child. */
    .game-deck { display: contents; }

    /* ── Right column: same reasoning as .col-left above ── */
    .col-right {
      grid-column: 3;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      overflow-y: hidden;
    }
    /* Wraps everything in .col-right except #politician-card, mirroring
       .col-left-slide -- keeps the politician card visually still during
       the slide/view-transition animations below while the games section
       slides (see anahane.html's own .col-right-slide for the same
       pattern). */
    .col-right-slide {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    /* Mirrors #library-card's layout: avatar on the right, name/title
       text right-aligned next to it -- see politician-card.js. */
    .politician-card .card-id { text-align: right; }
    .politician-card { cursor: pointer; }

    main {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      /* z-index (any explicit value, grid items don't need `position` for
         this) gives main its own stacking context, so its fixed/negative
         z-index child .map-panel stays contained within main's local
         paint order instead of escaping all the way to the root stacking
         context. Without this, .map-panel ends up stacked below
         #main-site's own box, which silently intercepted every hover/
         click meant for the map's SVG hit-regions before they ever
         reached them. Nothing else lives in main, so letting clicks pass
         straight through main's own box is safe; .map-panel re-enables
         pointer-events for itself and its children below. */
      z-index: 0;
      pointer-events: none;
    }

    /* ── MAP PANEL: fixed full-bleed background (matches anahane) ──
       position:fixed escapes the body grid entirely, so this covers the
       whole viewport regardless of which grid cell it's a DOM child of. */
    .map-panel {
      position: fixed;
      inset: 0;
      pointer-events: auto;
      z-index: -1;
      overflow: hidden;
      background: #f7f7f7;
      /* Pinch-to-zoom is disabled for now (see map-zoom.js's
         ZOOM_ENABLED) -- touch-action stays at the browser default so a
         touch that starts on the map still scrolls the page normally. */
      touch-action: auto;
    }

    /* Wraps the photo + hit-region overlay so map-zoom.js can scale/pan
       them together as one unit with a single transform -- map-label
       stays outside it, un-zoomed. */
    .map-zoom-layer {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
    }

    .map-panel img.map-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    /* Hit-region overlay traced against map-photo (same 5046x2300 source
       image) — see assets/map/istanbul-map.svg for the source of truth; keep
       this copy and anahane.html's in sync. */
    .map-panel svg.map-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .neighborhood {
      cursor: pointer;
      fill: transparent;
      stroke: transparent;
      stroke-width: 1.4;
      transition: fill 0.2s, stroke 0.2s, opacity 0.2s;
      pointer-events: all;
      /* Mobile browsers draw the default tap-highlight using the
         element's bounding *box*, not its actual (irregular polygon)
         shape -- on a district like this, that showed up as a gray
         rectangle flashing over the tapped area for a moment. */
      -webkit-tap-highlight-color: transparent;
    }

    /* Real districts outside this app's 25, plus the Kocaeli-side landmass
       ("istanbul_disi") — not interactive, and no longer given a
       distinguishing tint; they just blend into the base map artwork. */
    .map-unaccommodated,
    .map-istanbul-disi {
      fill: transparent;
      stroke: transparent;
      pointer-events: none;
    }

    /* Hover: dim the artwork under the cursor (matches anahane) — a
       transparent ink tint, not an element-opacity fade, so the black
       stroke borders stay black instead of washing out to gray.
       .hover-active is toggled via JS on every polygon sharing the same
       data-neighborhood, so multi-polygon districts (e.g. Şişli) light
       up as one unit instead of just the piece under the cursor. */
    .neighborhood:hover, .neighborhood.hover-active { fill: rgba(var(--ink-rgb), 0.18); }
    /* Clicked/active: darker tint + outline (matches anahane exactly —
       was a much stronger brown-1 tint before, which read as the
       district turning solid brown instead of just a darker shade of
       the same neutral ink tint hover uses). */
    .neighborhood.active {
      fill: rgba(var(--ink-rgb), 0.32);
      stroke: var(--accent);
    }
    /* Home neighborhood: always darker than the rest, even at rest,
       plus a dashed outline so it reads as "yours" over the art
       (matches anahane exactly). */
    .neighborhood.home {
      fill: rgba(130, 55, 48, 0.16);
      stroke: var(--brown-4);
      stroke-width: 4;
      stroke-dasharray: 10 6;
    }
    .neighborhood.home:hover, .neighborhood.home.hover-active { fill: rgba(130, 55, 48, 0.26); }
    .neighborhood.home.active { fill: rgba(130, 55, 48, 0.38); stroke: var(--brown-4); stroke-dasharray: none; }

    /* A member whose district has a hand-painted map (assets/map/home/,
       see home-map.js) gets the colour from the artwork itself, so the
       .home tint above would lay a second red over the first -- and a
       thicker, polygon-shaped one at that. On those maps the polygon
       falls back to plain district behaviour: the drawing alone says
       "this one is yours", and hovering or selecting it looks exactly
       like hovering or selecting anywhere else. */
    .map-panel.ist-home-painted .neighborhood.home {
      fill: transparent;
      stroke: transparent;
      stroke-dasharray: none;
    }
    .map-panel.ist-home-painted .neighborhood.home:hover,
    .map-panel.ist-home-painted .neighborhood.home.hover-active {
      fill: rgba(var(--ink-rgb), 0.18);
    }
    .map-panel.ist-home-painted .neighborhood.home.active {
      fill: rgba(var(--ink-rgb), 0.32);
      stroke: var(--accent);
    }

    /* Plain text, no frame/shadow — matches the HANE/KÜTÜPHANE/KAHVEHANE
       nav tab style (nav a above), not a floating pill. */
    .map-label {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--ink);
    }

    .discussion-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }
    /* The comments are parked while the events hold this column (see
       COMMENTS_ENABLED in the script). `hidden` alone would not do it:
       the rule above sets display, and any display beats the UA's
       [hidden] rule -- so the section has to be hidden louder than it is
       shown, at both breakpoints. */
    .discussion-section[hidden] { display: none !important; }

    /* Which neighborhood's comments are showing is already visible under
       the map itself (#map-label) -- this used to repeat it here too,
       redundantly; the element (and the JS that keeps its text in sync)
       stays, just hidden, so nothing else has to change. */
    .discussion-label {
      display: none;
    }

    .games-section {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .games-section-inner {
      padding: 10px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow-y: hidden;
    }

    /* Wraps the heading + 3 game links; stays visible while a game's bottom
       sheet is open so the buttons and the full weekly scoreboard both
       stay on screen. The three tiles share one row -- they're square
       (see .game-link below), so a stack of them would eat the whole
       column -- with the heading forced onto its own line above by
       flex-basis:100%. */
    .game-picker {
      display: flex;
      flex-flow: row wrap;
      /* No stretch: the tiles' height comes from their aspect-ratio and
         nothing else. Letting the row stretch them too leaves two rules
         claiming the same axis, which is precisely what WebKit resolved
         the other way on the mobile tiles. */
      align-items: flex-start;
      gap: 10px;
      flex-shrink: 0;
    }
    .game-picker > h2 {
      flex: 0 0 100%;
    }

    /* Fixed white/transparent, matching the .post / Anahane news+event
       cards floating on the map photo -- not --paper-warm, so this
       doesn't retheme with earth/mono like the games column used to. */
    .games-section h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
      text-align: center;
      letter-spacing: 2px;
      flex-shrink: 0;
      border: 2px solid var(--ink);
      background: var(--paper-banner);
      color: var(--ink);
      padding: 10px 12px;
    }

    /* ── Weekly scoreboard (top 5 winners of the last 7 days) ──
       No border-top divider — the framed heading below already reads as
       its own section, a rule line on top of that was redundant. Lives in
       .games-section-inner below the game tiles; that container is
       overflow-y:hidden, so flex:1 + min-height:0 here (and the list's own
       overflow-y:auto below) let a long board scroll internally instead of
       getting clipped. */
    .scoreboard {
      margin-top: 14px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .scoreboard h2 {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 4px;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 2px solid var(--ink);
      background: var(--paper-banner);
      color: var(--ink);
      padding: 8px 12px;
    }
    .scoreboard-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      min-height: 0;
    }
    .scoreboard-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 10px;
      background: var(--paper);
      border: 1px solid var(--rule);
      font-size: 0.75rem;
    }
    /* 4-stop dark-tint gradient on the row background, fixed white/black
       (not the palette's brown-*) so these read as the same frosted
       glass over the map photo as the .post / Anahane cards -- more
       transparent for the plain rows, darker+more opaque toward rank 1. */
    .scoreboard-item { background: var(--paper-card); color: var(--ink); border-color: var(--hairline); }
    .scoreboard-item.r1 { background: var(--brown-3); color: #fff; border-color: var(--ink); }
    .scoreboard-item.r2 { background: var(--brown-2); color: #fff; }
    .scoreboard-item.r3 { background: var(--brown-1); color: #fff; }
    .scoreboard-rank {
      font-weight: 700;
      color: inherit;
      min-width: 18px;
      font-size: 0.8rem;
    }
    .scoreboard-player {
      flex: 1;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .scoreboard-name {
      font-weight: 400;
      color: inherit;
    }
    .scoreboard-score {
      font-weight: 700;
      color: inherit;
      font-size: 0.85rem;
      min-width: 22px;
      text-align: right;
    }
    .scoreboard-empty {
      font-size: 0.7rem;
      color: var(--muted);
      font-style: italic;
      text-align: center;
      padding: 10px 4px;
      list-style: none;
    }
    .scoreboard-countdown {
      font-size: 0.58rem;
      color: var(--muted);
      text-align: center;
      /* No horizontal padding: it wraps the week strip, which has to match
         the heading box's width exactly (see .week-progress below). */
      padding: 0 0 5px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      letter-spacing: 1px;
      font-style: italic;
    }
    /* Emptied while a neighborhood filter is on (clearWeekProgress) — collapse
       it so no stray gap opens above the heading. */
    .scoreboard-countdown:empty { display: none; }
    /* Seven-square week tracker replacing the old countdown text: past days
       dark, today double-bordered, future days plain. Sits ABOVE the
       scoreboard heading and spans exactly its width — seven equal columns
       across the full content box, so Monday's left edge and Sunday's right
       edge line up with the heading box's own edges. The squares grow to
       whatever a seventh of that width allows. */
    .week-progress {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      padding: 0;
    }
    .week-day {
      box-sizing: border-box;
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper-card);
      border: 1px solid var(--rule);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
    }
    .week-day.past { background: var(--brown-2); border-color: var(--brown-2); color: #fff; }
    .week-day.today { background: var(--paper-card); border: 3px double var(--ink); color: var(--ink); }
    .week-day.future { background: var(--paper-card); border-color: var(--rule); color: var(--muted); }
    /* Scoreboard rows are clickable end-to-end (not just the name) and
       nudge left on hover, same feel as the game-link cards above. */
    .scoreboard-item.author-link { cursor: pointer; transition: transform 0.15s ease; }
    .scoreboard-item.author-link:hover { transform: translateX(-4px); text-decoration: none; }

    /* The board bleeds off the slide-in panel's open left edge (no left
       padding, see .game-score-slide above): drop every left border along
       that edge too, so nothing draws a stopping line there and the whole
       table reads as continuing out past the column. */
    .game-score-slide .scoreboard h2,
    .game-score-slide .scoreboard-item,
    .game-score-slide .week-day:first-child { border-left-width: 0; }

    /* The board standing in its own sheet (#scoreboard-overlay, opened
       from the right-hand corner button): the sheet's body is its box, so
       the margin that separated it from the game tiles in the column has
       nothing above it to clear, and the sheet's own body is what
       scrolls -- the list must not keep a second scroller inside one. */
    #scoreboard-overlay-body { padding: 10px 12px 14px; }
    #scoreboard-overlay-body .scoreboard { margin-top: 0; }
    #scoreboard-overlay-body .scoreboard-list { overflow-y: visible; }

    /* Both corner sheets, on a phone: the tab bar is fixed over the
       sheet's lower edge, so a board long enough to be scrolled to its
       end needs that much room under its last row or the cheapest cup in
       the next district is read through the tab bar. It is padding on a
       sheet that is taller than its content anyway, so nothing moves on
       a short board. */
    @media (max-width: 768px) {
      #coffee-overlay-body,
      #scoreboard-overlay-body {
        padding-bottom: calc(var(--navbar-h, 52px) + 24px + env(safe-area-inset-bottom, 0px));
      }
    }

    /* Chapter-box style, matching the Kütüphane reading-path nodes
       (.path-node): thick ink border with a heavier bottom edge. Fixed
       white/transparent + dark ink, matching the .post / Anahane
       news+event cards over the map photo, instead of the palette-driven
       --paper-warm/--ink these used to retheme with under earth/mono. */
    /* ── The question between two games ──
       The three games are a sequence and this is what stands in each
       joint of it (see db/daily_questions.sql): play Sözcel, answer this,
       play Tümcel, answer the next. It is the mall stairway in its
       smallest form -- the way to the next game runs through it, so a
       member who came only for the games still says what they think on
       the way, one question at a time, from inside the app rather than
       out of a survey nobody opens.

       It stands at the top of the games column, above the tiles, because
       the tile it unlocks is right below it: what is in the way should
       be in the way, not somewhere else on the page. Same white/ink card
       language as .game-link so the column reads as one stack. */
    .q-card {
      position: relative;
      /* Its column is narrow and fixed (260px on desktop, whatever the
         phone band gives it): the card takes the full width of it and
         never a pixel more. As a flex item in .game-picker's row-wrap it
         has to be told to take a whole row, or it sizes to its own text
         and pushes the tiles off the page. */
      flex: 0 0 100%;
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      border: 2px solid var(--ink);
      border-bottom-width: 5px;
      background: var(--paper-card);
      padding: 12px 14px;
      touch-action: pan-y;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Follows the finger while it is being thrown, and is let go of on
       release -- the card leaves in the direction of the answer, which is
       what makes the direction mean something (the same grammar as
       Kütüphane's news deck). */
    .q-card.throwing { transition: transform 0.32s ease, opacity 0.32s ease; }
    .q-kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ink-red, var(--accent));
    }
    .q-body {
      margin-top: 5px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.95rem;
      line-height: 1.3;
      color: var(--ink);
    }
    .q-opts { display: flex; gap: 8px; margin-top: 10px; }
    .q-opt {
      flex: 1;
      min-width: 0;
      padding: 8px 6px;
      border: 1px solid var(--ink);
      background: none;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    .q-opt:hover { background: var(--ink); color: var(--paper); }
    .q-hint {
      margin-top: 7px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.54rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }
    /* What the card says once it has been answered, in the two beats
       before it leaves: your answer is in, and how many people are
       standing where you are standing. No names and no percentages of a
       poll -- just the one number that says you are not alone in it. */
    .q-done { text-align: center; padding: 4px 0 2px; }
    .q-done-line {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink);
    }
    .q-done-tally {
      margin-top: 3px;
      font-size: 0.62rem;
      color: var(--muted);
    }
    .q-err { margin-top: 6px; font-size: 0.62rem; color: var(--accent); text-align: center; }
    .q-err:empty { display: none; }

    /* ── The stamps ──
       The two options, printed on the card's own edges and getting solid
       as the throw gets committed, so the answer the gesture is about to
       give is on the paper before it leaves. Same object as the news
       story's swipe cues on Kütüphane, same reasoning: each stamp sits on
       the edge the card is moving AWAY from, because the leading edge is
       the half that leaves the screen first. */
    .q-cue {
      position: absolute;
      top: 50%;
      z-index: 4;
      max-width: 46%;
      padding: 5px 9px;
      border: 2px solid currentColor;
      background: var(--paper-card);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      line-height: 1.15;
      opacity: 0;
      pointer-events: none;
    }
    .q-cue-a { left: 10px; color: var(--ink-red, var(--accent)); transform: translateY(-50%) rotate(-5deg); }
    .q-cue-b { right: 10px; color: var(--ink); transform: translateY(-50%) rotate(5deg); }
    /* Desktop answers with the buttons -- there is nothing to throw, so
       there is nothing to stamp. */
    @media (min-width: 769px) { .q-cue { display: none; } }

    /* ── The bottom of the deck ──
       Every game played and every question answered. Reaching the end is
       the app doing its job, so it says so and points at the door -- the
       same words, and the same dashed empty frame, Kütüphane's news deck
       ends with. */
    .deck-done {
      align-self: center;
      padding: 16px 12px;
      text-align: center;
      border: 2px dashed var(--rule);
      background: transparent;
      /* Its width is the band's, never its own text's -- see the mobile
         rule on the two decks below, where that matters for more than
         looks. */
      box-sizing: border-box;
    }
    .deck-done-line {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink);
    }
    .deck-done-sub {
      margin-top: 3px;
      font-size: 0.72rem;
      font-style: italic;
      color: var(--muted);
    }

    /* ══════════════════════════════════════════════════════════
       THE EVENTS DECK — the other half of the band

       The day's games are a deck in the band's right-hand corner; the
       city's events are the same deck in its left-hand one. Both are the
       object Kütüphane's news is: cards laid on top of each other, one
       in front of the reader at a time, dealt by being thrown rather
       than by being opened.

       What an event asks is not "next" but a verdict -- right is "ilgimi
       çekti", left "ilgimi çekmedi" -- and what the reader keeps is
       waiting for them beside the petek on Hane (see event-interest.js).
       That is the mall stairway in its smallest form again: the member
       who came for the games walks the whole city's calendar on the way,
       and leaves with the two or three evenings that were actually
       theirs.

       An event card is a news card, printed on the same paper as a game
       card next to it: kicker (the district -- this page has a map, so
       the word has something to point at), the event as the headline,
       and when it is under that. ══════════════════════════════════════ */
    .events-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .events-deck {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      min-height: 0;
      /* Desktop: a plain column of cards, scrolling inside the column
         rather than being clipped by .col-left's own overflow:hidden. On
         a phone this is a deck instead, and its scroller is the band (see
         the mobile rules). */
      overflow-y: auto;
    }
    .ev-card {
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
      background: var(--paper-card, #fff);
      border: 2px solid var(--ink);
      border-bottom: 5px solid var(--ink);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, transform 0.2s ease-out;
    }
    .ev-card-kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--ink-red);
      margin-bottom: 2px;
    }
    .ev-card-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      margin-top: auto;
      margin-bottom: 3px;
    }
    .ev-card-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    /* The card presses like a button and springs past its own size when
       released -- the first frame of it growing into the page (see
       growEventPage). Driven by pointer events rather than :hover or
       :active, both of which stick after a tap on iOS and would leave the
       card sitting pressed behind the page it just opened. Same object,
       same reasoning, as Kütüphane's .article.openable. */
    .ev-card.pressing {
      transform: scale(0.955);
      transition: transform 0.11s ease-out;
    }
    @keyframes ist-ev-card-release {
      0%   { transform: scale(0.955); }
      52%  { transform: scale(1.022); }
      100% { transform: scale(1); }
    }
    .ev-card.released { animation: ist-ev-card-release 0.34s cubic-bezier(0.22, 1, 0.36, 1); }
    @media (prefers-reduced-motion: reduce) {
      .ev-card.pressing { transform: none; }
      .ev-card.released { animation: none; }
    }
    @media (hover: hover) and (pointer: fine) {
      .ev-card:hover { background: var(--paper-dark); }
    }
    /* The card is the page now, so it stops being drawn behind it --
       only where the page actually grows out of it (a phone). */
    .ev-card.ev-open { visibility: hidden; }

    /* ══════════════════════════════════════════════════════════
       THE EVENT PAGE — what a card opens into.

       Kütüphane's news page, in every respect that matters: on a phone
       it grows out of the tapped card into the band that card lies in,
       and folds back into it, because a sheet rising over the map would
       cover the very district the page has just lit (lightMapDistrict) --
       and where the thing is happening is half of what an event IS.

       Head / body / foot, and only the middle scrolls: what this is on
       the top line, the event itself in the middle, the verdict on the
       bottom line -- the same two words the throw stamps, for a mouse.
       On desktop there is no band and no map to protect, so it stays THE
       sheet (sheet.css), exactly as everything else here does.
       ══════════════════════════════════════════════════════════ */
    .event-overlay .event-page { display: flex; flex-direction: column; overflow: hidden; }
    .event-page-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .event-page-head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--rule);
    }
    /* The same hand-drawn arrow every reader on the site wears: the
       reader arrived by touching a card, so the way back out is the
       drawing, not a word. */
    .event-page-back {
      flex: none;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .event-page-back:hover { opacity: 0.6; }
    .event-page-back img { width: 24px; height: 24px; display: block; }
    .event-page-head .ev-card-kicker { flex: 1; min-width: 0; margin-bottom: 0; }
    .event-page-head .ev-page-when { flex: none; font-size: 11px; color: var(--muted); }
    .event-page-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 14px 16px 16px;
    }
    .event-page-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
      text-wrap: balance;
      margin: 0 0 8px 0;
    }
    .event-page-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .event-page-body > p {
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--ink);
    }
    .event-page-body > p + p { margin-top: 10px; }
    /* There is no row of buttons on the foot of this page, and that is
       the point: the verdict is the THROW, the same gesture the news
       deck and the question cards already taught -- and a page carrying
       both says the gesture is the shortcut and the buttons are the real
       way, which is the wrong way round here. It is the one thing this
       page asks of the reader, so it asks it in one language. (Desktop
       has no finger, so a mouse drags the page instead -- see
       wireEventPageSwipe.) */
    /* The page is a thing you push. On desktop that has to be said, since
       a mouse has no way to discover it -- and while a drag is running,
       the text under the cursor must not start highlighting instead. */
    @media (hover: hover) and (pointer: fine) {
      .event-page { cursor: grab; }
      .event-page.ev-dragging { cursor: grabbing; user-select: none; }
    }
    /* ── The stamp the throw puts on the paper ──
       Each stamp sits on the edge the page is moving AWAY from: the
       leading edge is the half that leaves the screen first, so a stamp
       there would be gone exactly as the throw commits. It gets solid as
       the throw does, so nobody ever gives a verdict they didn't see. */
    .ev-swipe-cue {
      position: absolute;
      top: 50%;
      z-index: 4;
      max-width: 46%;
      padding: 7px 12px;
      border: 2px solid currentColor;
      background: var(--frame-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.15;
      opacity: 0;
      pointer-events: none;
    }
    .ev-swipe-cue-yes { left: 14px; color: var(--ink-red); transform: translateY(-50%) rotate(-5deg); }
    .ev-swipe-cue-no { right: 14px; color: var(--ink); transform: translateY(-50%) rotate(5deg); }

    .game-link {
      /* Square, and centred on its own content -- the three tiles sit
         side by side in one row (see .game-picker above), so the width
         is a third of the column and aspect-ratio squares it off. */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      background: var(--paper-card);
      border: 2px solid var(--ink);
      border-bottom: 5px solid var(--ink);
      padding: 0;
      text-align: center;
      text-decoration: none;
      color: var(--ink);
      transition: background 0.2s, border-color 0.2s, transform 0.15s ease, filter 0.1s ease;
      position: relative;
      flex-shrink: 0;
    }

    .game-link:hover {
      background: var(--hover);
      transform: translateX(-4px);
    }
    /* Pressed feedback: darken whatever the current state's colors are
       (plain, started, completed) without needing a state-specific
       override, plus a small press-down nudge. */
    .game-link:active {
      filter: brightness(0.85);
      transform: translateX(-2px) translateY(2px);
    }

    /* 0.78rem, not the old 1.1rem: three squares in a row are each about
       a third of the column wide, and "Bulmaca" has to stay on one line
       inside that. */
    .game-link-title {
      font-size: 0.78rem;
      font-weight: 700;
    }

    /* Both kept in the markup and shown on a phone, where the game is a
       news card with room for a kicker and a standfirst (see .game-deck
       in the mobile block); on the desktop square the name alone is all
       there is room to centre. */
    .game-link-subtitle,
    .game-link-kicker {
      display: none;
    }

    /* Sözcel's wordmark, filling the square tile in place of the text
       title -- the artwork spells the name out, and alt= carries it for
       screen readers. object-fit:contain keeps it square inside the
       padding whatever size the tile ends up; the padding is a
       percentage so that margin stays proportional from the ~70px
       desktop tile up to the ~130px one on a large phone. */
    .game-link-logo {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 6%;
      object-fit: contain;
    }
    .game-link[data-game="sozcel"] .game-link-title {
      display: none;
    }

    /* Started today (brighter/more opaque white) vs completed today (dark
       tinted, dimmed) -- same fixed white/black frosted-glass treatment
       as the base tile, not the palette's --paper-card/--brown-3. */
    .game-link.started {
      background: var(--paper-card);
      color: var(--accent);
    }
    .game-link.started .game-link-subtitle { color: var(--muted); }
    .game-link.completed {
      background: var(--brown-2);
      color: #fff;
      border-color: var(--ink);
    }
    .game-link.completed .game-link-subtitle { color: var(--paper); }

    /* Swiping/tapping into Kahvehane slides the whole right column in as
       one rigid block (see .col-right's own 0.32s transform below),
       which carries these three cards along together with no sense of
       order. .game-link-enter (a plain wrapper div around each .a.game-
       link, see the markup below) plays its own staggered slide+fade on
       top of that -- top card first, each lower one a beat later -- so
       they visibly cascade in rather than arriving as one block, while
       still riding the column's own "from the right" motion the whole
       time (never opacity:0 for the full slide -- an earlier version
       hid them for its whole duration and they just popped in at the
       end with no visible motion of their own). The wrapper (not
       .game-link itself) carries this transform because .game-link's
       own transform is already used for :hover/:active's nudge --
       sharing one property between two different-speed transitions
       would make that feedback sluggish too. */
    .game-link-enter {
      /* Equal thirds of the row (min-width:0 so a long title can't push
         a tile wider than its share and break the equal split). */
      flex: 1 1 0;
      min-width: 0;
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.32s ease;
    }
    .game-link-enter:nth-of-type(1) { transition-delay: 0ms; }
    .game-link-enter:nth-of-type(2) { transition-delay: 180ms; }
    .game-link-enter:nth-of-type(3) { transition-delay: 360ms; }
    html.ist-entering-forward .game-link-enter,
    html.ist-entering-backward .game-link-enter {
      transform: translateX(50px);
      opacity: 0.4;
      transition: none;
    }

    /* .game-link.locked and #game-lock-toast styles are injected by
       game-locks.js so the rule lives in one place. */

    /* Home neighborhood badge shown in the post form */
    .home-nb-badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--accent);
      color: var(--paper);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      vertical-align: middle;
    }

    .submit-form {
      padding: 16px 20px;
      flex-shrink: 0;
      margin-top: auto;
    }

    .submit-form-header {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Textarea + send button side by side instead of stacked -- the
       button used to be a full-width bar under the textarea, which read
       as oversized for a one-word action. */
    .submit-form-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      /* A flex item's default min-width is auto (its own content's
         natural width), not 0 -- without this, the textarea (and this
         row) refused to shrink below that, which forced the whole
         column's grid track wider to fit it, visibly pushing the map
         and game tiles to the right whenever the composer appeared. */
      min-width: 0;
    }

    /* Chapter-box style, matching .post/.game-link/.shelf-btn -- a thick
       ink border with a heavier bottom edge, square corners, instead of
       the thin gray outline + rounded corners these had before, which
       read as a generic form control rather than one of this site's own
       cards. */
    /* Taller than the button -- the send button is now a small square icon
       (see .submit-form button below), so the width it used to take up as a
       full text button goes straight to this box instead. align-items:
       flex-end on .submit-form-row keeps the square pinned to the textarea's
       bottom-right corner as it's resized taller. */
    .submit-form textarea {
      flex: 1;
      min-width: 0;
      height: 76px;
      padding: 10px;
      border: 2px solid var(--ink);
      border-bottom: 5px solid var(--ink);
      border-radius: 0;
      background: var(--paper-warm);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.9rem;
      resize: vertical;
    }

    /* Small square icon button instead of a full-width "GÖNDER" bar --
       that read as oversized for a one-tap send action next to the
       (now bigger) textarea. */
    .submit-form button {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
      color: var(--paper);
      border: 2px solid var(--ink);
      border-bottom: 5px solid var(--ink);
      border-radius: 0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-form button svg {
      width: 16px;
      height: 16px;
    }

    .submit-form button:hover { background: var(--accent); }

    .submit-status {
      font-size: 0.8rem;
      text-align: center;
      margin-top: 8px;
      font-style: italic;
    }
    /* JS only ever sets textContent here, never toggles display -- empty
       by default, it was still taking up its own line-height + margin
       below the send row, pushing the row up from the composer's true
       bottom edge. */
    .submit-status:empty {
      display: none;
    }
    .submit-status.ok { color: var(--success); }
    .submit-status.err { color: var(--accent); }

    /* Fixed toast — always visible above everything so submit outcome is seen */
    .global-toast {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 24px);
      padding: 10px 14px;
      background: #000000;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      z-index: 9999;
      display: none;
      text-align: center;
    }
    .global-toast.ok { background: #4C4C4C; }
    .global-toast.err { background: #000000; }

    .discussion-posts {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Chapter-box style, matching the Kütüphane reading-path nodes and
       the Anahane news/event cards: white/opaque, thick border with a
       heavier bottom edge, fixed dark text regardless of OS light/dark
       preference or earth/mono palette -- distinct from --paper-card
       (shared with the game-link "started" state), so changing this
       doesn't retheme the games column. */
    .post {
      position: relative;
      background: var(--paper-card);
      border: 2px solid var(--ink);
      border-bottom: 5px solid var(--ink);
      padding: 16px 18px;
      margin-bottom: 12px;
      color: var(--ink);
      transition: background 0.15s, transform 0.15s ease;
    }
    /* Hover just lightens the background a touch and nudges the post
       inward toward the center, same feedback as the Anahane cards.
       Gated on a real hover-capable pointer: on touch, :hover latches
       onto the last-tapped card and stays there, which left that one
       post sitting 6px to the right of every other post (and of the
       composer/profile card it's supposed to line up with). */
    @media (hover: hover) {
      .post:hover {
        background: #e8e8e8;
        transform: translateX(6px);
      }
    }

    .post-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .post-time {
      margin-left: auto;
      text-align: right;
    }

    .post-neighborhood {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--ink-red);
    }

    .post-time {
      font-size: 0.65rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #4a4a4a;
      font-style: italic;
    }

    .post-content {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--ink);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      font-style: italic;
      color: var(--muted);
    }

    .load-more-wrap {
      display: flex;
      justify-content: center;
      padding: 8px 0 16px;
    }
    .load-more-btn {
      background: var(--paper);
      border: 1px solid var(--ink);
      padding: 8px 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
    }
    .load-more-btn:hover { background: var(--hover, #e0e0e0); }
    .load-more-btn:disabled { opacity: 0.6; cursor: default; }

    .post-delete {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      color: #4a4a4a;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .post.can-delete:hover .post-delete,
    .post-delete:focus { opacity: 1; }
    .post-delete:hover { color: var(--danger); }

    /* Discussion posts (left column) and scoreboard rows (right column)
       slide in from their own column's outer screen edge on render, and
       slide back out the same way just before the feed is replaced --
       see the animateFeedSwap() helper used by loadPosts() / loadScoreboard(). */
    @keyframes card-slide-in-left {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes card-slide-in-right {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    /* backwards fill-mode holds the keyframe's "from" state during the
       staggered animation-delay set in JS, so a lower row stays hidden
       off-screen while it waits its turn instead of flashing visible
       in place first. */
    .card-entering-left { animation: card-slide-in-left 0.4s ease-out backwards; }
    .card-entering-right { animation: card-slide-in-right 0.7s ease-out backwards; }
    .card-leaving-left,
    .card-leaving-right {
      transition: transform 0.3s ease-in, opacity 0.3s ease-in;
      opacity: 0;
    }
    .card-leaving-left { transform: translateX(-100%); }
    .card-leaving-right { transform: translateX(100%); }

    .submit-form .submit-form-note {
      font-size: 0.72rem;
      color: var(--muted);
      font-style: italic;
      padding: 12px;
      text-align: center;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--muted);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── The corner button ──
       The one door into the Kahve Endeksi, and deliberately the same
       object Kütüphane's Makaleler/Posta Kutusu boxes are: the smallest
       thing that still reads as a door, standing in the top-right corner
       under the profile bar. Both map pages now open their side matter
       from the same corner, so the gesture carries across the swipe.
       It has to stay ABOVE the mobile media query below: a media query
       adds no specificity, so the phone's own smaller padding/geometry
       only wins by coming later in the file. Stated here because this
       block spent a version sitting under it, where the desktop padding
       quietly survived onto the phone and left the button 12px off the
       inset line every other thing on that screen is printed on. */
    .corner-boxes {
      display: flex;
      flex-direction: row;
      /* One button at each end of the line rather than a huddled pair:
         the Kahve Endeksi and the Skor Tahtası are different rooms, and
         a corner each says so where a pair does not (the same treatment
         Kütüphane's Makaleler/Posta Kutusu take). */
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px 0;
      flex-shrink: 0;
    }
    .corner-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper-warm);
      border: 2px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      padding: 6px 10px;
      color: var(--ink);
      transition: background 0.2s, transform 0.2s;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
    }
    /* Nudges toward the map, the same feedback .game-link and the board's
       own rows give (this column's inward is leftward). */
    .corner-box:hover { background: var(--paper-dark); transform: translateX(-4px); }
    .corner-box-title {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── MOBILE RESPONSIVE ──
       Same stacked-flow treatment as anahane: the map sits at the top
       like a hero banner with the profile card floating over its empty/
       sea-colored band (same #f7f7f7 as the map artwork's own
       background, so the card reads as part of the map rather than a
       stacked box), then comments (left) and square game tiles (right)
       below, all scrolling in body itself, with the tab bar pinned
       fixed at the very bottom (its <header> already escapes to the
       viewport via position:fixed regardless of where .section-rule
       sits). */
    @media (max-width: 768px) {
      html, body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        width: 100%;
      }

      #main-site {
        display: grid;
        /* Two columns, and both of them are decks: the city's events on
           the left, the day's games on the right (see .events-deck).
           The Kahve Endeksi held the left half until it went behind the
           corner button, and the band was the games alone for a while --
           but an event is the one thing on the site that ends with the
           reader outside standing next to somebody, so it belongs in the
           band the reader is actually walking past, not one tap off it. */
        grid-template-columns: 1fr 1fr;
        /* ── The channel between the two decks ──
           Each deck stands --deck-inset in from its own outer screen
           edge (on top of the frame's own padding), and the gap between
           them is exactly that same distance -- so the band reads as two
           cards spaced evenly across it rather than as two boxes that
           happen to have drifted apart. The grid's own column gap
           already contributes --frame-gap of it, so each facing side
           pads by half of what is left. Stated once, here, because the
           two halves have to agree or the channel is off-centre. */
        --deck-inset: 12px;
        --deck-channel-pad: calc((var(--frame-pad, 10px) + var(--deck-inset) - var(--frame-gap, 10px)) / 2);
        /* Row 1 (the map) gets an explicit, definite track size instead
           of "auto": with one auto-width column (games) and one 1fr
           column (comments) below it, plain "auto auto" rows didn't
           size to their own content -- they got compressed to fit
           body's definite height (each row roughly halved, clipping
           the map's bottom edge). main bleeds to the true screen edges
           (see its negative margins below), so its rendered width is
           always 100vw -- sizing row 1 to 100vw directly gives the same
           square, deterministically. The extra env(safe-area-inset-top)
           + 16px term matches main's own margin-top below (trimmed from
           40px to match anahane's same fix) -- without it, the fixed
           track was sized for the square alone and the pushed-down map
           either got clipped or overlapped row 2. Row 2 is a plain 1fr:
           the page itself doesn't scroll (see overflow below), so row 2
           is exactly the leftover space and no more -- content that
           doesn't fit scrolls inside .discussion-posts instead of
           growing this row or the page. */
        grid-template-rows: calc(100vw + var(--map-hero-top)) 1fr;
        /* align-content other than the default (stretch) makes grid
           track-size its rows by content first and only then position
           the resulting (shorter) track set within the container -- so
           despite row 2 being "1fr", it was sizing to comments/games'
           own short content and leaving the real leftover space
           unclaimed by any grid item (see the now-stale comment this
           replaced, and the html body background rule below, both
           written around that gap). Plain stretch (the default -- this
           was previously pinned to `start`) makes row 2 actually
           consume all remaining space, so .discussion-section's own
           flex:1 chain (see .discussion-posts) can grow into it instead
           of leaving it as bare backdrop. */
        overflow: hidden;
        /* frames.css's gap (row + column) exposed a sliver of the raw
           page canvas (--page-bg, warm beige/mono gray) directly under
           the map -- a different color from the map's own #f7f7f7,
           breaking the edge-to-edge look right where it's most visible.
           Keep the column gap (between comments/games) but zero the
           row gap so the map's bottom edge sits flush against the
           content below it. */
        row-gap: 0 !important;
        /* Reserve space for fixed bottom tab bar + a frame-gap so the
           cards don't visually press against the nav (frames.css design). */
        padding-bottom: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom) + var(--frame-gap, 10px));
      }
      /* Defensive fallback, not the primary fix (see grid-template-rows'
         own comment above): row 2 now stretches to fill the viewport, so
         in the normal case .col-left/.col-right's own backgrounds
         already cover it end to end and this never shows. Kept in case
         a row ever IS shorter than the container (e.g. unusually little
         content) -- otherwise that gap would show frames.css's raw page
         canvas (--page-bg) instead of the map/card #f7f7f7. frames.css's
         html,body rule also sets a background with !important, so this
         needs the extra "html" qualifier to win on specificity
         regardless of source order. */
      html body {
        background: #f7f7f7 !important;
      }

      .col-left, .col-right, header, .section-rule, main {
        grid-column: unset; grid-row: unset;
      }

      /* The profile bar (#ist-pc-mount) is the fixed top bar — the
         counterpart of the tab bar at the bottom. Its geometry and colors
         are in profile-card.css, one implementation for all three pages;
         nothing about it is page-specific, so nothing about it is restated
         here. It used to be a light card floating over the map's top
         (empty/sea) band, which each of the three pages spelled out again
         in its own mobile query. */

      /* Capacitor's WKWebView reports env(safe-area-inset-top) as 0 for a
         real (measured, ~80-200ms) window after every fresh page load
         before self-correcting on its own -- with no gating, the card
         renders flush under the status bar/notch for that window,
         covering the map's top districts. safe-area-ready.js removes
         this class once the real value is confirmed (or after a
         timeout), so the card and map simply appear already in the
         right place instead of visibly jumping. */
      html.ist-safe-area-pending #ist-pc-mount,
      html.ist-safe-area-pending main {
        visibility: hidden;
      }
      /* .section-rule no longer renders a floating brand bar -- its
         only visible content (the tab nav) is pulled out via the
         <header> position:fixed rule below and pinned to the viewport
         bottom regardless of where this sits. Taken out of grid flow so
         it doesn't claim a row of its own. */
      .section-rule {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        padding: 0;
        overflow: visible;
      }

      /* Map: same real artwork + traced SVG hit-regions, now a normal
         in-flow square block instead of a fixed full-bleed background
         layer sitting behind everything -- so it also drops the
         desktop click-through hack (main's pointer-events:none /
         .map-panel's negative z-index), which only existed because the
         map used to escape main's box via position:fixed. Bleeds past
         body's own left/right frame padding (frames.css) so it reaches
         the true screen edges instead of sitting in a gutter, and drops
         frames.css's card shadow (only meant for panels that look like
         discrete floating cards, not this edge-to-edge hero). */
      main {
        grid-column: 1 / -1;
        grid-row: 1;
        display: block;
        overflow: visible;
        pointer-events: auto;
        margin-left: calc(-1 * var(--frame-pad, 10px));
        margin-right: calc(-1 * var(--frame-pad, 10px));
        /* Room under the profile bar (offset by the same safe-area
           amount so the gap stays constant across notch sizes), so the
           bar overlaps only the map's empty "sea" band and never the
           districts themselves. Trimmed from 40px to 16px to match
           anahane's same fix -- keep in sync with grid-template-rows
           above. */
        margin-top: var(--map-hero-top);
        box-shadow: none !important;
      }
      .map-panel {
        position: relative;
        inset: auto;
        width: 100%;
        /* aspect-ratio (which works fine on anahane) doesn't resolve
           reliably here: main spans an explicit 1fr column and an auto
           (content-sized) one, and that combination made the grid's
           "auto" row track collapse to half the leftover body height
           instead of sizing to the map's own square, clipping its
           bottom half. A definite viewport-based height sidesteps that
           row-sizing ambiguity entirely -- main's rendered width is
           always ~100vw (full-bleed, see the negative margins above),
           so 100vw here still yields the same square as anahane. */
        height: 100vw;
        aspect-ratio: auto;
        z-index: auto;
        overflow: hidden;
      }
      /* This page isn't meant to scroll either -- so once map-zoom.js
         zooms past 1x, it switches the panel to a fixed position pinned
         at its own current on-screen rect (computed in JS, not CSS)
         with overflow allowed to escape its little square. That's the
         same "position:fixed escapes the grid" trick the desktop
         full-bleed map already relies on, so the larger zoomed map can
         spill into the rest of the screen without ever growing body's
         own layout size. */
      .map-panel.ist-zoomed {
        position: fixed;
        overflow: visible;
      }
      .map-label {
        position: absolute;
        bottom: 8px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 1px;
      }
      /* The events column. Everything this column used to carry on a
         phone is gone -- the mayor's card and the identity card are the
         profile bar's now, the comments are parked, the board went behind
         the corner button -- and it was hidden outright for as long as
         that left it empty. It holds the events deck now, which is
         exactly the half of the band Kütüphane fills with its news. */
      .col-left {
        display: flex;
        flex-direction: column;
        grid-column: 1;
        grid-row: 2;
        min-height: 0;
        overflow: visible;
        border-top: 1px solid var(--rule);
        z-index: 1;
      }
      /* Transparent (inherits the desktop rule's background:none) so
         these read as frameless text floating over the map, same as
         desktop -- body's own background is the same #f7f7f7, so this
         looks identical at rest, and once map-zoom.js zooms the map
         past its little square, it now shows through here instead of
         being hidden behind a flat color. */
      .col-left .nb-highlight {
        padding: 6px 12px;
        font-size: 10px;
        letter-spacing: 1.2px;
      }
      /* Desktop-only (it slides in over the discussion feed at >1240px;
         the mobile game overlay never uses it). Parked at
         translateX(-100%) it still isn't gone here: .col-left is its
         containing block and keeps overflow:visible on mobile (unlike
         desktop's overflow:hidden, which clipped it), so the panel's
         right edge -- 2px ink border and all -- peeked out as a tall
         framed strip in body's left frame-padding gutter. */
      .game-score-slide { display: none; }
      /* #ist-pc-mount (profile-card.js) already covers the identity card
         on mobile — the desktop-only #library-card would just take up
         space above the discussion feed. */
      #library-card { display: none; }
      /* The Belediye Başkanı card as a card is desktop-only -- but the
         seat it names is NOT hidden on a phone any more: it moves into
         the profile bar's RIGHT end (#ist-pc-seat, see "THE TOP BAR" in
         profile-card.css), with you at the left end -- the mirror of
         Kütüphane's bar, so swiping between the two walks your own name
         across the row. politician-card.js paints both. */
      #politician-card { display: none; }
      /* Fills .col-left's height exactly; min-height:0 lets it (and,
         in turn, .discussion-posts below) shrink to fit rather than
         overflowing the fixed column. */
      .discussion-section {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: visible;
      }
      .discussion-label {
        padding: 5px 12px;
        font-size: 9px;
        letter-spacing: 1.2px;
      }
      /* Scrolls internally instead of growing .discussion-section past
         its allotted (fixed, non-scrolling-page) height -- flex:1 lets
         it take exactly the space left after the label and composer.
         8px side padding (on top of #main-site's own 10px frame padding)
         puts the post cards on the shared 18px screen inset -- the same
         line as the floating profile card, the composer below, and the
         game tiles' outer edge. Extra bottom padding so the last card's
         heavy 5px bottom border isn't shaved off by this box's own
         overflow clip. */
