      .discussion-posts {
        padding: 6px 8px 10px;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* The comments sit at the BOTTOM of the feed, right above the
           composer -- one comment rests on the composer instead of
           floating up under the map, and each newer one is laid on top of
           the stack (newest first is the order they already load in, see
           fetchPostsPage). Same move as Hane's news and events columns.
           An auto margin on the first card, not justify-content:flex-end:
           once the comments outgrow the feed the margin resolves to zero
           and this box scrolls them normally, where flex-end would push
           the newest ones past the top edge of a scroller that cannot
           reach them. */
        display: flex;
        flex-direction: column;
      }
      .discussion-posts > :first-child { margin-top: auto; }
      /* This box has a fixed height (flex:1 of a fixed column) and now
         lays its cards out as flex items, so without this they would be
         squeezed shorter to fit instead of overflowing into the scroll. */
      .discussion-posts > * { flex-shrink: 0; }
      /* No trailing gap under the last card: the feed's own bottom
         padding is what separates the stack from the composer. */
      .discussion-posts > :last-child { margin-bottom: 0; }
      .post {
        padding: 10px 12px;
        margin-bottom: 6px;
      }
      .post-neighborhood {
        font-size: 0.55rem;
        letter-spacing: 1.5px;
      }
      .post-time {
        font-size: 0.55rem;
      }
      .post-content {
        font-size: 0.82rem;
        line-height: 1.4;
      }
      .submit-form {
        /* Same 8px as .games-section-inner all round: the bottom edge
           lands flush with the game tiles' bottom, and the sides put the
           textarea on the shared 18px screen inset (see
           .discussion-posts above). */
        padding: 8px;
        /* Transparent -- reads as floating over the map/page background
           like the rest of this column instead of a separate white
           panel (matches .col-left .nb-highlight's own reasoning). */
        background: none;
        /* No margin-top: .discussion-posts's flex:1 already pushes this
           to the bottom of the column, so a fixed 56px here didn't move
           the composer at all -- it just carved 56px out of the feed
           above it, which was enough to clip the bottom border off the
           last comment while leaving an empty band under it. */
        /* Stays fixed at the bottom of the column, right after
           .discussion-posts's flex:1 -- that's what takes up the
           leftover space (and scrolls internally if there's too much
           to fit), not this. */
        flex-shrink: 0;
      }
      .submit-form-header {
        font-size: 10px;
        margin-bottom: 4px;
      }
      .submit-form textarea {
        height: 56px;
        padding: 5px 7px;
        font-size: 11px;
      }
      .submit-form button {
        width: 34px;
        height: 34px;
      }
      .submit-form button svg {
        width: 14px;
        height: 14px;
      }

      /* Pinned into the top-right corner under the profile bar, over the
         map, on the same line as Kütüphane's corner boxes -- .col-right
         itself is the games column below the map, so it is the button
         that is fixed here rather than its column. */
      .corner-boxes {
        position: fixed;
        top: calc(env(safe-area-inset-top) + var(--navbar-h-top, 56px) + 8px);
        right: var(--screen-inset, 18px);
        /* Spanning the whole line, a corner each -- Kahve Endeksi on the
           left, Skor Tahtası on the right. The band between them is map,
           so the strip itself takes no taps (only the buttons do), or it
           would swallow every touch on the districts underneath it. */
        left: var(--screen-inset, 18px);
        pointer-events: none;
        padding: 0;
        z-index: 6;
      }
      .corner-box { pointer-events: auto; }
      .corner-box { padding: 5px 8px; border-bottom-width: 3px; }
      .corner-box-title { font-size: 0.58rem; letter-spacing: 1px; }
      /* No hover nudge on a phone -- it sits over the map and a :hover
         left latched after a tap would leave it sitting offset. */
      .corner-box:hover { transform: none; }

      /* Games: normal in-flow column below the map, to the right --
         short rectangular tiles stacked with a gap. flex (not block)
         so .games-section below sizes within the column's fixed
         (non-scrolling-page) height instead of overflowing it. */
      .col-right {
        grid-column: 2;
        grid-row: 2;
        min-height: 0;
        overflow: visible;
        border-left: none;
        border-top: 1px solid var(--rule);
        display: flex;
        flex-direction: column;
        width: auto;
        z-index: 1;
      }
      .games-section {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: visible;
      }
      /* Scrolls internally (rather than growing the page) on the rare
         screen too short for even the 3 short tiles to fit. */
      .games-section-inner {
        padding: var(--deck-inset) var(--deck-inset) var(--deck-inset) var(--deck-channel-pad);
        gap: 8px;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      /* Just the "Günün Oyunları" heading above the game tiles -- not
         .games-section h2 generally, which was also catching (and
         hiding) the scoreboard's own h2 below. */
      .game-picker h2 { display: none; }
      /* Grows to fill .games-section-inner's own height instead of
         sizing to content (overriding the desktop rule's flex-shrink:0)
         -- otherwise the game-link-enter tiles below have nothing
         concrete to grow into despite their own flex:1. */
      .game-picker {
        /* Back to a stack: the desktop rule rows the three squares up
           side by side, which only works in a column wide enough for
           them -- here the games column is the narrow strip beside the
           comments. Both halves of the desktop `flex-flow: row wrap`
           have to be undone, not just the direction: leaving wrap on let
           WebKit break the stack into a second and third column the
           moment the three tiles didn't fit the height exactly. */
        flex-flow: column nowrap;
        gap: 8px;
        flex: 1;
        min-height: 0;
      }
      /* ── THE DECK ──
         The same object as Kütüphane's news deck, in the same terms: all
         the cards sit in one grid cell, and the depth is nth-child and
         nothing else, so dealing the front card is *removing the node* --
         the ones behind then transition forward on their own instead of
         being re-rendered there. Past the third card the picture stops
         changing; the rest stay in the DOM (the next one has to be
         standing ready) but are not drawn. Only the top takes a press or
         a throw: the ones behind are edges of paper. */
      .game-deck, .events-deck {
        display: grid;
        grid-template-areas: "deck";
        /* Sized by its own tallest card, and no taller: a card stretched
           to fill a column reads as a panel, not paper. Every card takes
           that same height -- which is what lets the front one cover the
           ones behind instead of leaving their bottom edges showing
           under it. */
        flex: 0 0 auto;
        /* Down against the tab bar the way Kütüphane's news deck is --
           an auto top margin rather than justify-content:flex-end, so a
           deck that outgrows the band still scrolls in
           .games-section-inner instead of pushing its top card out of
           reach.

           And it fills its half of the band rather than sizing to its
           own cards. It kept the cards' width while it WAS the whole
           band -- a deck is a hand of cards, not a panel, and not
           spanning everything is how it read as one. With a second deck
           beside it that is no longer free: two content-width decks
           leave a channel between them whose width is decided by
           whichever card happens to carry the longest word, which is
           nothing at all to look at. The even channel is the thing worth
           having now (see --deck-channel-pad), and it needs both halves
           to have a definite edge. */
        margin-top: auto;
        align-self: stretch;
        max-width: 100%;
      }
      /* Opaque in the deck. A tile's own 0.85 white reads fine floating
         over the map, but in a stack it lets the card *behind* show
         through the one in front, which is exactly the illusion a deck
         is made of. Its aspect-ratio goes too: the card is as tall as
         the deck's tallest, not a square. */
      .game-deck > .game-link-enter > .game-link {
        flex: 1;
        aspect-ratio: auto;
        background: var(--paper-card, #fff);
        /* Same frame the news wears (.article in kutuphane.html): 2px
           ink with a heavy bottom rule. The deck is one object across the
           two pages, so a card in it is one object too. */
        border: 2px solid var(--ink);
        border-bottom: 5px solid var(--ink);
        color: var(--ink);
      }
      /* Finished today: the card is inked over, the way a story you have
         dealt with is gone from the news deck. Everything printed on it
         flips to paper, kicker included, or the card would go dark under
         text that stayed dark with it. (A finished game leaves the deck
         anyway -- this is what the desktop tiles and the moment before
         the next mount look like.) */
      .game-deck > .game-link-enter > .game-link.completed {
        background: var(--ink);
        color: var(--paper-card, #fff);
      }
      .game-deck > .game-link-enter > .game-link.completed .game-link-kicker,
      .game-deck > .game-link-enter > .game-link.completed .game-link-subtitle {
        color: rgba(255, 255, 255, 0.72);
      }
      /* Started but not finished is the opposite of done: the card stays
         on top of the deck waiting to be gone back to, so it must not be
         inked like a card that has been dealt with. It is marked instead,
         with the same "this is the one you are on" bar the coffee board
         puts on an open venue. */
      .game-deck > .game-link-enter > .game-link.started {
        background: var(--paper-card, #fff);
        box-shadow: inset 4px 0 0 var(--ink);
      }
      /* A card is pressed, not hovered: on a touch screen :hover latches
         onto whatever was tapped last and leaves the top of the deck
         sitting 4px off (the same reason Kütüphane's cards press rather
         than nudge). */
      .game-deck .game-link:hover { transform: none; background: var(--paper-card, #fff); }
      .game-deck .game-link.completed:hover { background: var(--ink); }
      :is(.game-deck, .events-deck) > * {
        grid-area: deck;
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }
      :is(.game-deck, .events-deck) > :nth-child(1) { z-index: 3; }
      /* The two behind are pushed up and back a step each. The scale is
         kept shallow on purpose: it pulls a card's top edge back down
         again, so a deeper scale with the same offset would show LESS of
         the card behind, not more. */
      :is(.game-deck, .events-deck) > :nth-child(2) { z-index: 2; transform: translateY(-12px) scale(0.97); }
      :is(.game-deck, .events-deck) > :nth-child(3) { z-index: 1; transform: translateY(-23px) scale(0.94); }
      :is(.game-deck, .events-deck) > :nth-child(n+4) { display: none; }
      :is(.game-deck, .events-deck) > :not(:nth-child(1)) { pointer-events: none; }
      /* A card being thrown follows the finger with no transition of its
         own (the JS sets transform directly); the flight out and the
         spring back set their own. */
      .game-deck > .q-card.throwing { transition: transform 0.3s ease-in, opacity 0.3s ease-in; }
      @media (prefers-reduced-motion: reduce) {
        :is(.game-deck, .events-deck) > * { transition: none; }
      }
      /* ── The empty frame takes the whole band ──
         Alone in a deck, .deck-done was the only thing deciding the
         deck's width, and the width it decided was its own text's --
         which lands on a fractional pixel. WebKit then drops the LEFT
         edge of a dashed border sitting on one, so the frame printed
         with three sides and no obvious reason for the fourth to be
         missing. Stretching it to the band puts both its edges back on
         whole pixels, and it is the right picture anyway: this is the
         same object Kütüphane's news deck ends with, and there it has
         always been the column's own width. */
      :is(.game-deck, .events-deck):has(> .deck-done:only-child) { align-self: stretch; }
      /* The events deck rests in the band's bottom-LEFT corner, the
         mirror of the games' bottom-right one: both hang from the bottom
         (an auto top margin rather than justify-content, so a deck that
         outgrows the band still scrolls instead of pushing its top card
         out of reach), and each sits against its own outer edge, so the
         two decks read as the two ends of one band rather than as a
         column of boxes. */
      .events-deck {
        margin-top: auto;
        align-self: stretch;
        max-width: 100%;
        padding: 0;
        /* The cards behind the front one stand a step up and back, past
           this box's own top edge -- the band below is what scrolls. */
        overflow: visible;
      }
      .events-section-inner {
        padding: var(--deck-inset) var(--deck-channel-pad) var(--deck-inset) var(--deck-inset);
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      /* Opaque in a deck, the same reason a game card is: a card behind
         showing through the one in front is exactly the illusion a deck
         is made of. */
      .events-deck > .ev-card {
        background: var(--paper-card, #fff);
      }
      .events-deck > .ev-card:hover { background: var(--paper-card, #fff); }
      .ev-card-title { font-size: 16px; }
      /* A card being thrown follows the finger with no transition of its
         own (the page's own throw sets the transform directly). */
      .event-page.throwing { transition: transform 0.3s ease-in, opacity 0.3s ease-in; }

      /* ── THE EVENT PAGE on a phone (see its block above) ──
         Not a sheet arriving from anywhere: it IS the band the deck lies
         in. Its top edge is the hero line, its bottom edge is where the
         bottom card was already resting above the tab bar, and its two
         sides are the deck's own -- so the card the reader pressed grows
         into a box that was already drawn around it. The grow is a
         clip-path animated in JS (growEventPage), which is why every
         transform and transition the sheet would otherwise carry comes
         off here: a transform would move the page out from under the clip
         measured against it.

         --event-page-left/--event-page-width are measured off the deck's
         own content box when the page opens (and again on resize) rather
         than restated as the sum of the frame pad and the deck's padding
         -- one number written in two places is how a page ends up two
         pixels off the card it came out of. */
      .event-overlay {
        /* The map above stays live while an event is open: the page takes
           its own taps and nothing else takes any. */
        pointer-events: none;
      }
      /* The tint is the same one the board and the scoreboard rise with
         (.ist-sheet-dim in sheet.css), and it stops at the hero line
         there too, so the map -- with this event's own district burning
         on it -- keeps its light. It takes no taps: the whole band below
         is the page, so there is no backdrop left to press, and the map
         above has to stay live. What the tint is actually FOR here is the
         grow: the card opens into a band that has already gone quiet
         behind it. */
      .event-overlay .ist-sheet-backdrop { pointer-events: none; }
      .event-overlay .event-page {
        pointer-events: auto;
        left: var(--event-page-left, calc(var(--frame-pad, 10px) + 12px));
        right: auto;
        width: var(--event-page-width, calc(100vw - (var(--frame-pad, 10px) + 12px) * 2));
        top: var(--map-hero-end);
        bottom: calc(var(--navbar-h, 46px) + env(safe-area-inset-bottom, 0px) + var(--frame-gap, 10px));
        height: auto;
        transform: none;
        transition: none;
        /* The page owns its horizontal axis (the throw); the vertical one
           stays the browser's, so the body inside it scrolls natively. */
        touch-action: pan-y;
        /* It floats in the band instead of running off the bottom of the
           screen, so it gets the fourth edge frames.css drops. */
        border-bottom-width: 2px !important;
      }
      .event-overlay.open .event-page { transform: none; }
      .event-page-head { padding: 9px 12px 8px; }
      .event-page-body { padding: 11px 12px 14px; }
      .event-page-title { font-size: 19px; margin-bottom: 6px; }
      .event-page-body > p { font-size: 13px; line-height: 1.5; }
      /* sheet.css hides the side columns under any open sheet, because a
         sheet rises OVER them. This page doesn't rise over anything: it
         grows inside the band, and the cards it is expanding past are
         half the reason the move reads at all. */
      body:has(#event-overlay.open) .col-left,
      body:has(#event-overlay.open) .col-right { visibility: visible; }

      /* Each tile grows to fill the column's own height (see
         syncColumnHeights() in the script below, which is what gives
         .col-right a real height to grow into in the first place) --
         the top tile's top edge stays put (games-section-inner packs
         from the top) and growing all three equally means the bottom
         tile's bottom edge lands exactly at the column's own bottom,
         same level as the comments side. .game-link-enter (the
         entrance-animation wrapper, see above) has to be the flex item
         actually doing the growing, with .game-link filling it in turn
         -- flex:1 on .game-link itself would have no effect since its
         own parent (.game-link-enter) isn't flex-sized. */
      .game-link-enter {
        min-height: 0;
        display: flex;
      }
      /* Side by side again: the deck is the whole band now (the board
         gave its half back, see .corner-boxes), and two options across a
         full-width card read the way the news page's poll does. Which is
         which is still carried by the stamps on the throw, not by their
         left/right order. */
      .q-opts { flex-direction: row; }
      .game-link {
        /* ── The day's game, as a news card ──
           Not a tile any more: the same paper Kütüphane's stories are
           printed on, in the same band, read the same way -- a kicker
           saying where in the day's sequence this is, the game's name as
           the headline, and what it is under that. The three of them are
           a sequence, and a sequence is legible as a stack of cards in
           order; three squares side by side said nothing about order at
           all. Type sizes are the phone news card's own (see .article in
           kutuphane.html's mobile block). */
        padding: 8px 12px;
        width: auto;
        align-items: stretch;
        justify-content: flex-start;
        text-align: left;
        /* A card is as wide as the band and as tall as its own text --
           the square the desktop tile still is has no meaning in a deck,
           where every card has to be the same height as every other one
           anyway (the deck's grid cell decides that, see .game-deck). */
        aspect-ratio: auto;
        /* No explicit height here -- .game-link-enter (its parent, a
           row-direction flex container) stretches it to fill that
           wrapper's height by default, and the wrapper is a grid item in
           the deck, so every card comes out the height of the tallest
           one in the stack. */
        display: flex;
        flex-direction: column;
        position: relative;
      }
      /* Where in the day's sequence this card is -- the news card's
         kicker, in its own type and its own red. */
      .game-link-kicker {
        display: block;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--ink-red);
        margin-bottom: 2px;
      }
      /* The headline. margin-top:auto sits it at the foot of the card
         with the kicker at its head, which is how an .article.openable
         lays its own two lines out. */
      .game-link-title {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.25;
        margin-top: auto;
        margin-bottom: 3px;
      }
      /* And the standfirst -- shown again here (the desktop tile hides
         it: a square with the name centred in it has no room for a second
         line, a card does). */
      .game-link-subtitle {
        display: block;
        font-size: 12px;
        line-height: 1.35;
        font-style: normal;
        overflow-wrap: break-word;
      }
      /* The wordmark is the square tile's way of saying "Sözcel"; a card
         says it in the headline like every other card in the stack. */
      .game-deck .game-link-logo { display: none; }
      .game-deck .game-link[data-game="sozcel"] .game-link-title { display: block; }

      /* Bottom tab bar — fixed at bottom. Thinned from the top; labels sit
         flush against the bottom edge (the safe-area padding below is what
         separates them from the home-indicator area). */
      header {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(var(--navbar-h, 38px) + env(safe-area-inset-bottom));
        padding: 0 0 env(safe-area-inset-bottom);
        margin: 0;
        border-top: 1px solid var(--rule);
        border-bottom: none;
        background: var(--paper-navbar);
        z-index: 100;
        display: flex;
        align-items: stretch;
      }
      nav {
        display: flex;
        width: 100%;
        height: 100%;
        gap: 0;
        /* Pull KÜTÜPHANE/KAHVEHANE in from the screen's rounded corners --
           at full-bleed width:100% the outer tabs sat right under the
           curve. 18px specifically (was 20px): that's the shared screen
           inset the rest of the page lines up on -- frames.css's 10px
           frame padding plus the 8px inner padding the columns use --
           so with the edge alignment below, the tab labels land on the
           same vertical lines as the floating profile card, the comment
           cards, the composer and the game tiles. */
        padding: 0 18px;
        flex-wrap: nowrap;
        justify-content: stretch;
      }
      nav a {
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 6px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--muted);
        border: none;
        text-decoration: none;
        /* Same fix as .neighborhood: without this, tapping a tab flashes
           the browser's default gray tap-highlight box over it. */
        -webkit-tap-highlight-color: transparent;
      }
      nav a.active { color: var(--ink); font-weight: 700; }
      /* The two outer tabs align their label to the bar's own edge
         instead of centering it inside their third of the bar, which is
         what actually puts the K of KÜTÜPHANE and the E of KAHVEHANE on
         the 18px inset line (see nav's padding above). HANE, in the
         middle, stays centered. The -0.5px pull cancels the trailing
         letter-spacing that CSS adds after the final E, which would
         otherwise sit between the glyph and the flex-end edge. */
      nav a:first-child { justify-content: flex-start; }
      nav a:last-child {
        justify-content: flex-end;
        margin-right: -0.5px;
      }

      /* ── Mobile swipe pagination: full page (map + datetime + columns) slides; fixed bottom nav stays ──
         What slides is .col-right-slide and the corner button, not
         .col-right itself: the button is position:fixed (see
         .corner-boxes above), and a transform on an ancestor would make
         that ancestor its containing block -- the button would spend the
         whole 0.32s measured from the top of the games column, halfway
         down the screen, and then jump into the corner. Transforming the
         fixed element itself just moves it, which is exactly what
         Kütüphane's own corner pair does. */
      .col-left-slide, .col-right-slide, .corner-boxes {
        transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        backface-visibility: hidden;
      }
      html.ist-entering-forward .col-left-slide,
      html.ist-entering-forward .col-right-slide,
      html.ist-entering-forward .corner-boxes {
        transform: translateX(100vw);
        transition: none;
      }
      html.ist-entering-backward .col-left-slide,
      html.ist-entering-backward .col-right-slide,
      html.ist-entering-backward .corner-boxes {
        transform: translateX(-100vw);
        transition: none;
      }
      body.ist-exiting-forward .col-left-slide,
      body.ist-exiting-forward .col-right-slide,
      body.ist-exiting-forward .corner-boxes {
        transform: translateX(-100vw);
      }
      body.ist-exiting-backward .col-left-slide,
      body.ist-exiting-backward .col-right-slide,
      body.ist-exiting-backward .corner-boxes {
        transform: translateX(100vw);
      }
    }

    /* ── Desktop swipe pagination: left column slides out/in toward the
       left edge, right column toward the right edge — regardless of nav
       direction; nav stays ── */
    @media (min-width: 769px) {
      .col-left-slide, .col-right-slide {
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        backface-visibility: hidden;
      }
      html.ist-entering-forward .col-left-slide,
      html.ist-entering-backward .col-left-slide {
        transform: translateX(-100vw);
        transition: none;
      }
      html.ist-entering-forward .col-right-slide,
      html.ist-entering-backward .col-right-slide {
        transform: translateX(100vw);
        transition: none;
      }
      body.ist-exiting-forward .col-left-slide,
      body.ist-exiting-backward .col-left-slide {
        transform: translateX(-100vw);
      }
      body.ist-exiting-forward .col-right-slide,
      body.ist-exiting-backward .col-right-slide {
        transform: translateX(100vw);
      }
    }

    /* ══════════════════════════════════════════════
       View Transitions API — cross-document slide
       The browser snapshots the outgoing page and holds
       it visible until the new page is ready, so there's
       no white flash between reloads. Only the columns
       animate; the map, nav, and datetime bar stay put
       because their content is identical across tabs. On
       mobile, direction comes from a class on <html> seeded
       by the outgoing page via sessionStorage (present before
       VT captures the new snapshot); desktop ignores direction
       entirely (see the media query below).
       ══════════════════════════════════════════════ */
    @view-transition { navigation: auto; }

    /* Suppress the default root crossfade — columns handle motion */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    .col-left-slide { view-transition-name: ist-col-left; }
    .col-right-slide { view-transition-name: ist-col-right; }

    /* The browser's own view-transition-group animation interpolates this
       named box's size/position between the outgoing and incoming page's
       rect. Kahvehane's col-right (the stacked game tiles) sits at a
       different height/position than col-right on the other pages (news/
       events), so that automatic box-morph -- stacked on top of the slide
       keyframes below -- swung the outgoing snapshot across the wrong part
       of the screen mid-transition, on top of the fixed nav bar (the view-
       transition layer always paints above it regardless of z-index).
       Disabling it pins the group to the new page's rect immediately; the
       keyframes below do 100% of the visible motion. */
    ::view-transition-group(ist-col-left),
    ::view-transition-group(ist-col-right) {
      animation: none;
    }

    /* Desktop: left column always exits/enters via the left edge, right
       column via the right edge — independent of nav direction, so no
       html.vt-forward/vt-backward gate is needed here. */
    @media (min-width: 769px) {
      @keyframes ist-vt-col-left-exit { from { transform: translateX(0); } to { transform: translateX(-100vw); } }
      @keyframes ist-vt-col-left-enter { from { transform: translateX(-100vw); } to { transform: translateX(0); } }
      @keyframes ist-vt-col-right-exit { from { transform: translateX(0); } to { transform: translateX(100vw); } }
      @keyframes ist-vt-col-right-enter { from { transform: translateX(100vw); } to { transform: translateX(0); } }

      ::view-transition-old(ist-col-left) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-left-exit;
      }
      ::view-transition-new(ist-col-left) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-left-enter;
      }
      ::view-transition-old(ist-col-right) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-right-exit;
      }
      ::view-transition-new(ist-col-right) {
        animation: 400ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-col-right-enter;
      }
    }

    @media (max-width: 768px) {
      @keyframes ist-vt-out-left { from { transform: translateX(0); } to { transform: translateX(-100vw); } }
      @keyframes ist-vt-in-left { from { transform: translateX(100vw); } to { transform: translateX(0); } }
      @keyframes ist-vt-out-right { from { transform: translateX(0); } to { transform: translateX(100vw); } }
      @keyframes ist-vt-in-right { from { transform: translateX(-100vw); } to { transform: translateX(0); } }

      html.vt-forward::view-transition-old(ist-col-left),
      html.vt-forward::view-transition-old(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-out-left;
      }
      html.vt-forward::view-transition-new(ist-col-left),
      html.vt-forward::view-transition-new(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-in-left;
      }
      html.vt-backward::view-transition-old(ist-col-left),
      html.vt-backward::view-transition-old(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-out-right;
      }
      html.vt-backward::view-transition-new(ist-col-left),
      html.vt-backward::view-transition-new(ist-col-right) {
        animation: 320ms cubic-bezier(0.4, 0, 0.2, 1) both ist-vt-in-right;
      }
    }

    /* ══════════════════════════════════════════════
       Game overlay: the game itself renders in an iframe (sozcel.html
       etc. stay self-contained, unmodified pages) inside THE sheet (see
       sheet.css) — the same object a news item, an article or a profile
       opens as. Only the iframe inside it is this page's business; see
       the markup near .col-right below and the script at the bottom of
       the file for open/close wiring. */
    /* The sheet itself now matches kütüphane's narrower width, but the game
       (sozcel.html etc.) has its own @media (max-width: 768px) mobile
       layout that reads the *iframe's* rendered width — a 680px iframe
       would wrongly trip that breakpoint on an ordinary desktop-width
       viewport (giant keyboard, mobile padding). So the iframe itself
       stays fixed at a desktop-safe 820px and is centered over the
       narrower sheet, with the sheet's overflow:hidden cropping the
       unused side padding; the game's actual content (word grid,
       keyboard) is well under 680px wide and centered, so nothing real
       gets clipped. Below ~768px (see the media query below) this reverts
       to a normal full-width flex child, matching a real mobile viewport
       one-to-one so the game's own mobile layout kicks in correctly. */
    .game-overlay-frame {
      position: absolute;
      left: 50%;
      top: 0;
      width: 820px;
      height: 100%;
      transform: translateX(-50%);
      border: none;
    }
    @media (max-width: 768px) {
      /* At a real phone width the iframe reverts to a plain full-size
         child, matching a real mobile viewport one-to-one so the game's
         own mobile layout kicks in correctly. */
      .game-overlay-frame {
        position: static;
        width: 100%;
        height: 100%;
        transform: none;
      }
    }

    /* ── Detail sheet: #politician-card's full info (see
       politician-card.js) and a Kahve Endeksi venue. Plain HTML content
       rather than .game-overlay's iframe, but the same object either way
       (see sheet.css) — nothing about how it opens is restated here. */
    .detail-overlay-body .politician-detail { max-width: 520px; margin: 0 auto; }

    /* ── Kahve Endeksi sheet content (rendered via openDetail) ──
       Same fixed white/ink language as the scoreboard rows and game
       tiles: frosted rows, framed heading, cheapest row inked darkest. */
    .coffee-detail {
      max-width: 520px;
      margin: 0 auto;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      color: var(--ink);
    }
    .coffee-detail h2 {
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 2px solid var(--ink);
      background: var(--paper-card);
      padding: 10px 12px;
      margin-bottom: 4px;
    }
    .coffee-rows { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
    .coffee-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--paper-card);
      border: 1px solid var(--hairline);
      font-size: 0.8rem;
      /* Hovering a row lights up the district it is in on the map (see
         the coffee-row hover handlers in the script below) -- the row
         no longer prints its district name, the map answers instead.
         Clicking drills the column into that venue (openCoffeeVenue). */
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.15s ease;
    }
    /* Nudges toward the map on hover, the same feedback as .game-link and
       the scoreboard rows. Gated on a real hover-capable pointer for the
       same reason .post is: on touch, :hover latches onto the last-tapped
       row and leaves it sitting offset from every other row. */
    @media (hover: hover) {
      .coffee-row:hover {
        border-color: var(--brown-2);
        transform: translateX(-4px);
      }
    }
    .coffee-row:active { transform: translateX(-2px) translateY(1px); }
    /* The row whose panel is currently open, so the board still shows
       what you are looking at after the panel covers the feed. */
    .coffee-row.selected { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
    .coffee-row.cheapest { background: var(--brown-3); color: #fff; border-color: var(--ink); }
    /* Closed venues are off the board: still listed (so you know they
       exist and what they charge) but visibly out of the running, and
       never ranked as the cheapest. */
    .coffee-row.closed { opacity: 0.45; background: rgba(255, 255, 255, 0.35); }
    .coffee-row-venue { flex: 1; min-width: 0; overflow-wrap: break-word; font-weight: 700; }
    .coffee-row-meta { display: block; font-size: 0.6rem; font-weight: 400; opacity: 0.75; letter-spacing: 0.5px; margin-top: 2px; }
    /* Discount and last-call markers -- the two things that make the
       board move on its own. Weight rather than hue, to stay inside the
       page's fixed white/ink language. */
    .coffee-row-meta .mk-discount,
    .coffee-row-meta .mk-last,
    .coffee-row-meta .mk-closed { font-weight: 700; letter-spacing: 1px; }
    .coffee-row-price { font-weight: 700; font-size: 0.9rem; white-space: nowrap; text-align: right; }
    /* Undiscounted price, kept visible next to the live one so the size
       of the discount reads at a glance. */
    .coffee-price-was {
      display: block;
      font-size: 0.6rem;
      font-weight: 400;
      text-decoration: line-through;
      opacity: 0.6;
    }
    .coffee-empty {
      font-size: 0.75rem; color: var(--muted); font-style: italic;
      text-align: center; padding: 14px 4px;
    }

    /* ── Coffee index panel ──
       The board itself, and it is the sheet's body and nothing else now
       (#coffee-overlay, opened from the left-hand corner button). It
       used to be the left column, and the column-era rules here -- a
       flex:1 panel with min-height:0 and .coffee-rows keeping its own
       overflow-y:auto -- outranked the sheet's own by coming later in
       the file, so the board was still sizing itself to a column that
       is not there and scrolling inside a body that was already
       scrolling. One box, laid out by the sheet: see
       #coffee-overlay-body above. Clicking a row drills this same panel
       into that venue and back (openCoffeeVenue), so the sheet never
       hands its content to another surface. */
    .coffee-index-panel {
      position: relative;
    }
    .coffee-index-panel .coffee-detail { max-width: none; }

    /* Politician detail sheet -- opened from #politician-card. Same card
       treatment as the rest of the page (background/border/shadow via
       frames.css's shared flat-card rule), centered profile layout. */
    .politician-detail {
      background: var(--paper-card);
      border: 2px solid var(--ink);
      border-bottom: 5px solid var(--ink);
      padding: 24px;
      text-align: center;
    }
    .politician-detail-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      background: var(--paper-dark);
      overflow: hidden;
      position: relative;
      margin: 0 auto 14px;
    }
    .politician-detail-name {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink);
    }
    .politician-detail-title {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 2px;
      margin-bottom: 16px;
    }
    .politician-detail-row {
      text-align: left;
      font-size: 0.86rem;
      padding: 8px 0;
      border-top: 1px solid var(--rule);
    }
    .politician-detail-bio {
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.5;
      margin-top: 12px;
      white-space: pre-wrap;
    }
    /* A person's name mentioned inside a post or comment body (see
       person-mentions.js) -- dotted rather than a solid underline so it
       doesn't read as an outbound link. If the person currently holds a
       title (data-tip), hovering/focusing reveals it in a small label
       above the name -- a quick "who is this" reminder, not the full
       .politician-detail sheet the mayor card above opens. */
    .person-mention {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }
    .person-mention:hover,
    .person-mention:focus-visible {
      text-decoration-style: solid;
    }
    .person-mention[data-tip] {
      position: relative;
      cursor: help;
    }
    .person-mention[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--paper);
      padding: 4px 10px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      z-index: 5;
    }
    .person-mention[data-tip]:hover::after,
    .person-mention[data-tip]:focus-visible::after {
      opacity: 1;
    }

    .author-link {
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .author-link:hover { text-decoration: underline; }
  </style>

<body>

<!-- Wraps everything except modals (matching anahane.html) so #main-site
     (not body) is the grid -- see the CSS comment on #main-site for why. -->
<div id="main-site">

  <!-- Mobile-only compact profile card (mounted by profile-card.js) -->
  <div id="ist-pc-mount"></div>

  <div class="section-rule">
    <header>
      <nav>
        <a href="kahvehane.html" class="active" data-tab="istanbulite">İstanbulite</a>
        <a href="project.html" data-tab="project">Proje</a>
        <a href="anahane.html" data-tab="hane">Hane</a>
      </nav>
    </header>
  </div>

  <!-- ist-content: the swappable region for future client-side routing between
       kutuphane/anahane/kahvehane. Persistent chrome (nav, profile card, clock)
       stays outside this node. display:contents keeps grid placement identical
       to before this wrapper existed. -->
  <div id="ist-content" style="display:contents">
  <aside class="col-left">
    <!-- Profile cards swapped: this neighborhood's Belediye Başkanı now
         sits top-left, #library-card top-right (see .col-right below). -->
    <div class="library-card politician-card" id="politician-card"><div class="card-loading"><span class="spinner"></span></div></div>
    <div class="col-left-slide">
      <!-- ── The city's events, as a deck ──
           The band's left-hand corner, mirroring the day's games in its
           right-hand one (see .events-deck in the stylesheet). A card is
           dealt by being thrown: right is "ilgimi çekti" and the event
           goes to Hane, beside the petek; left is "ilgimi çekmedi" and it
           is gone. Unscoped by construction -- the whole city's list,
           each card kickered with its own district, which the map above
           lights the moment the card is opened. -->
      <section class="events-section" id="events-section">
        <div class="events-section-inner">
          <div class="events-deck" id="events-deck"></div>
        </div>
      </section>
      <section class="discussion-section" id="discussion-section" hidden>
        <div class="discussion-label" id="discussion-label" data-i18n="kahvehane.allistanbul">Tüm İstanbul</div>
        <div class="discussion-posts" id="discussion-posts"></div>
        <div class="submit-form" id="submit-form" style="display:none;">
          <span id="home-nb-badge" class="home-nb-badge" style="display:none;"></span>
          <div class="submit-form-row">
            <textarea id="post-content" placeholder="Ne söylemek istersiniz?"></textarea>
            <button id="submit-btn" aria-label="Gönder" title="Gönder">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
            </button>
          </div>
          <div class="submit-form-note" id="submit-form-note" style="display:none;"></div>
          <div class="submit-status" id="submit-status"></div>
        </div>
      </section>
    </div>
    <!-- Slides in over the events column above on desktop while a game
         is open (see .game-score-slide CSS + initGameOverlay JS). Same
         #scoreboard-* ids loadScoreboard() already targets -- just
         relocated here from col-right, which now shows the coffee index
         instead (see .coffee-index-panel below). -->
    <div class="game-score-slide" id="game-score-slide">
      <div class="scoreboard" id="scoreboard-board">
        <!-- Week strip sits above the heading and spans its exact width —
             see .week-progress in the stylesheet. -->
        <div class="scoreboard-countdown" id="scoreboard-countdown"></div>
        <h2 id="scoreboard-title" data-i18n="games.weeklyscoreboard">Haftanın Skor Tahtası</h2>
        <ol class="scoreboard-list" id="scoreboard-list">
          <li class="scoreboard-empty">Yükleniyor...</li>
        </ol>
      </div>
    </div>
  </aside>

  <main>
    <section class="map-panel">
      <!-- Scaled/panned as one unit by map-zoom.js (pinch to zoom, drag
           to pan once zoomed) -- map-label below stays outside it. -->
      <div class="map-zoom-layer">
      <!-- Mobile gets a smaller export of the same drawing (3510x1600 vs
           the 5046x2300 desktop source, ~397KB vs ~2.1MB) -- the browser
           picks one before fetching, matching how kutuphane.html already
           does this for its own map. Same composition, same aspect ratio,
           just fewer bytes for the square crop a phone actually shows. -->
      <picture>
        <source media="(max-width: 768px)" srcset="assets/map/istanbul-map-mobile.png">
        <img class="map-photo" src="assets/map/istanbul-map.png" alt="">
      </picture>

      <!-- Hit-region overlay traced against map-photo (same 5046x2300
           source image) — see assets/map/istanbul-map.svg for the source of
           truth; keep this copy and anahane.html's in sync. -->
