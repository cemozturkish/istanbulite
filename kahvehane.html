// ── Paginated comment feed ──
// Reads `neighborhood_comments` 20 at a time, with a "Load more" button.
// Resets when the filter changes (map click / clear).
//
// PARKED. The events column above took this column's space, and where the
// neighborhood comments belong is still an open question -- so the feed,
// its composer and everything that drives them stay exactly as they are,
// switched off at one line rather than deleted. `#discussion-section`
// carries `hidden` in the markup to match; turning both back on is the
// whole of re-enabling it.
const COMMENTS_ENABLED = false;
const PAGE_SIZE = 20;
let feedState = { filter: null, offset: 0, done: false, currentUserId: null };

async function loadPosts(neighborhoodFilter = null, instant = false) {
  if (!COMMENTS_ENABLED) return;
  feedState = { filter: neighborhoodFilter, offset: 0, done: false, currentUserId: feedState.currentUserId };
  const postsEl = document.getElementById('discussion-posts');

  const { data: { session } } = await sb.auth.getSession();
  feedState.currentUserId = session?.user?.id || null;

  const rows = await fetchPostsPage(neighborhoodFilter, 0);

  animateFeedSwap(postsEl, 'left', () => {
    if (!rows) {
      postsEl.innerHTML = '<div class="empty-state">Mesajlar yüklenemedi.</div>';
      return;
    }
    if (rows.length === 0) {
      postsEl.innerHTML = '';
      return;
    }
    postsEl.innerHTML = '';
    appendPosts(rows);
    feedState.offset = rows.length;
    feedState.done = rows.length < PAGE_SIZE;
    renderLoadMore();
  }, [], instant);
}

// Posts older than this disappear from the feed.
const POST_TTL_MS = (23 * 60 + 59) * 60 * 1000;

function formatRelativeTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 0) return 'şimdi';
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return 'şimdi';
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}dk`;
  const hr = Math.floor(min / 60);
  const remMin = min - hr * 60;
  if (remMin === 0) return `${hr}sa`;
  return `${hr}sa ${remMin}dk`;
}

async function fetchPostsPage(neighborhoodFilter, offset) {
  const cutoff = new Date(Date.now() - POST_TTL_MS).toISOString();
  let query = sb
    .from('neighborhood_comments')
    .select('id, author_id, neighborhood, body, created_at')
    .gte('created_at', cutoff)
    .order('created_at', { ascending: false })
    .range(offset, offset + PAGE_SIZE - 1);
  if (neighborhoodFilter) query = query.eq('neighborhood', neighborhoodFilter);
  const { data, error } = await query;
  if (error) {
    console.error('[kahvehane loadPosts]', error);
    return null;
  }
  if (!data || data.length === 0) return [];
  // Resolve names in one batched query
  const ids = Array.from(new Set(data.map(p => p.author_id).filter(Boolean)));
  const nameMap = new Map();
  if (ids.length > 0) {
    const { data: profs } = await sb
      .from('profiles')
      .select('id, first_name, last_name')
      .in('id', ids);
    (profs || []).forEach(p => nameMap.set(p.id, {
      first: capitalizeName(p.first_name || ''),
      last: capitalizeName(p.last_name || ''),
    }));
  }
  return data.map(p => ({ ...p, _authorName: nameMap.get(p.author_id) || { first: '', last: '' } }));
}

function appendPosts(rows) {
  const postsEl = document.getElementById('discussion-posts');
  const html = rows.map(post => {
    const nbName = neighborhoodNames[post.neighborhood] || post.neighborhood;
    const { first, last } = post._authorName || {};
    let authorDisplay;
    if (feedState.filter) {
      // Specific neighborhood selected — show full name, no "X'den" prefix
      authorDisplay = (first || last)
        ? [first, last].filter(Boolean).join(' ')
        : nbName;
    } else if (I18N.isEnglish()) {
      // All Istanbul view — show "Cem from Bakırköy"
      authorDisplay = first ? `${first} from ${nbName}` : nbName;
    } else {
      // All Istanbul view — show "Bakırköy'den Cem"
      const suffix = getAblativeSuffix(nbName);
      authorDisplay = first ? `${nbName}${suffix} ${first}` : nbName;
    }
    const authorLink = post.author_id
      ? `<span class="author-link" data-user-id="${post.author_id}" title="Profili görüntüle">${authorDisplay}</span>`
      : authorDisplay;
    const isMine = post.author_id && post.author_id === feedState.currentUserId;
    const canDelete = isMine || isAdmin;
    const deleteBtn = canDelete
      ? `<button class="post-delete" data-delete-id="${post.id}" title="Mesajı sil" aria-label="Mesajı sil">×</button>`
      : '';
    const postClass = canDelete ? 'post can-delete' : 'post';
    return `
      <div class="${postClass}" data-post-id="${post.id}" data-created-at="${post.created_at}">
        ${deleteBtn}
        <div class="post-meta">
          <span class="post-neighborhood">${authorLink}</span>
          <span class="post-time">${formatRelativeTime(post.created_at)}</span>
        </div>
        <div class="post-content">${escapeHtml(post.body)}</div>
      </div>
    `;
  }).join('');
  // Insert before any existing load-more wrapper so it stays at the bottom
  const lm = postsEl.querySelector('.load-more-wrap');
  if (lm) lm.insertAdjacentHTML('beforebegin', html);
  else postsEl.insertAdjacentHTML('beforeend', html);
  if (window.IstPersonMentions) IstPersonMentions.linkify(postsEl, personMentionsRoster);
}

function renderLoadMore() {
  const postsEl = document.getElementById('discussion-posts');
  const existing = postsEl.querySelector('.load-more-wrap');
  if (feedState.done) {
    if (existing) existing.remove();
    return;
  }
  if (existing) return;
  const wrap = document.createElement('div');
  wrap.className = 'load-more-wrap';
  wrap.innerHTML = `<button class="load-more-btn" id="load-more-btn" type="button">Daha fazla</button>`;
  postsEl.appendChild(wrap);
}

async function handleLoadMore() {
  const btn = document.getElementById('load-more-btn');
  if (!btn || feedState.done) return;
  btn.disabled = true;
  btn.textContent = 'Yükleniyor…';
  const rows = await fetchPostsPage(feedState.filter, feedState.offset);
  if (rows === null) {
    btn.disabled = false;
    btn.textContent = 'Tekrar dene';
    return;
  }
  appendPosts(rows);
  feedState.offset += rows.length;
  feedState.done = rows.length < PAGE_SIZE;
  if (feedState.done) {
    const wrap = btn.closest('.load-more-wrap');
    if (wrap) wrap.remove();
  } else {
    btn.disabled = false;
    btn.textContent = 'Daha fazla';
  }
}

// Delegated on document (not the #discussion-posts container itself) --
// a virtual navigation (see router.js) replaces #ist-content's whole
// subtree on every revisit to this page, so a listener bound once to the
// original container node would go stale after the first
// navigate-away-and-back.
document.addEventListener('click', async (e) => {
  if (!e.target.closest('#discussion-posts')) return;
  const loadMoreBtn = e.target.closest('#load-more-btn');
  if (loadMoreBtn) { handleLoadMore(); return; }
  const delBtn = e.target.closest('.post-delete');
  if (delBtn) {
    const id = delBtn.getAttribute('data-delete-id');
    if (!id) return;
    if (!confirm('Mesaj silinsin mi?')) return;
    delBtn.disabled = true;
    const { error } = await sb.from('neighborhood_comments').delete().eq('id', id);
    if (error) {
      delBtn.disabled = false;
      alert('Silinemedi: ' + error.message);
      return;
    }
    const postEl = delBtn.closest('.post');
    if (postEl) postEl.remove();
  }
});

// Refresh relative-time labels every 30s and drop expired posts. Router's
// shared clock only ticks every 60s, so this keeps its own interval --
// named + ID-tracked (see mount()/unmount()) so a revisit via virtual
// navigation clears the old one instead of stacking a second.
function tickDiscussionPosts() {
  const postsEl = document.getElementById('discussion-posts');
  if (!postsEl) return;
  const now = Date.now();
  postsEl.querySelectorAll('.post[data-created-at]').forEach(el => {
    const created = new Date(el.getAttribute('data-created-at')).getTime();
    if (now - created >= POST_TTL_MS) {
      el.remove();
      return;
    }
    const timeEl = el.querySelector('.post-time');
    if (timeEl) timeEl.textContent = formatRelativeTime(el.getAttribute('data-created-at'));
  });
  if (!postsEl.querySelector('.post')) {
    const lm = postsEl.querySelector('.load-more-wrap');
    if (lm) lm.remove();
  }
}

// Delegated on document (not the button itself) -- a virtual navigation
// (see router.js) replaces #ist-content's whole subtree on every revisit
// to this page, so a listener bound once to the original button node
// would go stale after the first navigate-away-and-back.
document.addEventListener('click', async (e) => {
  if (!e.target.closest('#submit-btn')) return;
  const content = document.getElementById('post-content').value.trim();
  const statusEl = document.getElementById('submit-status');
  
  const postNeighborhood = selectedNeighborhood || homeNeighborhood;
  if (!postNeighborhood) {
    statusEl.textContent = 'Lütfen bir semt seçin';
    statusEl.className = 'submit-status err';
    return;
  }
  
  if (!content) {
    statusEl.textContent = 'Lütfen bir mesaj yazın';
    statusEl.className = 'submit-status err';
    return;
  }
  
  // Explicitly refresh the session first — stale tokens sometimes produce
  // "TypeError: Load failed" on Safari instead of a clean 401, and re-reading
  // the session from storage guarantees we send a fresh access_token.
  let session = null;
  try {
    const refreshed = await sb.auth.refreshSession();
    session = refreshed.data?.session || null;
  } catch (_) {}
  if (!session) {
    const got = await sb.auth.getSession();
    session = got.data?.session || null;
  }
  if (!session) {
    statusEl.textContent = 'Mesaj göndermek için giriş yapın';
    statusEl.className = 'submit-status err';
    showToast('Oturum bulunamadı — lütfen tekrar giriş yapın', 'err');
    return;
  }

  // Residency guard mirrors the RLS policy: only post to your own neighborhood
  // (admin override). The DB will reject any attempt to bypass this.
  if (!isAdmin && postNeighborhood !== homeNeighborhood) {
    statusEl.textContent = 'Sadece kendi semtinize yazabilirsiniz.';
    statusEl.className = 'submit-status err';
    return;
  }

  document.getElementById('submit-btn').disabled = true;

  const insertData = {
    neighborhood: String(postNeighborhood),
    body: String(content),
    author_id: String(session.user.id)
  };

  // Use XMLHttpRequest instead of fetch: Safari's fetch implementation
  // surfaces a generic "TypeError: Load failed" with no diagnostic info on
  // POSTs from inside SPA-shell iframes (keepalive/connection-coalescing
  // bug). XHR uses a separate transport path that works reliably in the
  // same context. Retry up to 3 times for transient network blips.
  function attemptInsert() {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://fgxispjoiynnoqitwpks.supabase.co/rest/v1/neighborhood_comments', true);
      xhr.setRequestHeader('apikey', 'sb_publishable_iCNHaPaYLC-WRfmsfNPxYg_x2XJtI9Z');
      xhr.setRequestHeader('Authorization', `Bearer ${session.access_token}`);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('Prefer', 'return=minimal');
      xhr.timeout = 15000;
      xhr.onload = () => resolve({
        ok: xhr.status >= 200 && xhr.status < 300,
        status: xhr.status,
        statusText: xhr.statusText,
        body: xhr.responseText || ''
      });
      xhr.onerror = () => {
        const e = new Error('XHR network error');
        e.name = 'NetworkError';
        reject(e);
      };
      xhr.ontimeout = () => {
        const e = new Error('XHR timed out after 15s');
        e.name = 'TimeoutError';
        reject(e);
      };
      xhr.onabort = () => {
        const e = new Error('XHR aborted');
        e.name = 'AbortError';
        reject(e);
      };
      xhr.send(JSON.stringify(insertData));
    });
  }

  let lastErr = null;
  let response = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      response = await attemptInsert();
      lastErr = null;
      break;
    } catch (err) {
      lastErr = err;
      console.warn(`[kahvehane insert attempt ${attempt}/3 failed]`, err);
      if (attempt < 3) {
        await new Promise(r => setTimeout(r, 400 * attempt));
      }
    }
  }

  document.getElementById('submit-btn').disabled = false;

  if (!response) {
    // All attempts threw — transport-layer failure (offline, content blocker,
    // captive portal, etc.). Surface session + embed-mode info so we can tell
    // if this is iframe-specific from the reported message.
    const sessionSnippet = session?.user?.id ? session.user.id.slice(0, 8) : 'no-user';
    const expiresAt = session?.expires_at ? new Date(session.expires_at * 1000).toISOString().slice(11, 19) : 'n/a';
    const embedMode = new URLSearchParams(location.search).get('embed') || 'none';
    const msg = `Hata: ${lastErr?.name || 'Error'} — ${lastErr?.message || String(lastErr)} [uid:${sessionSnippet} exp:${expiresAt} embed:${embedMode}]`;
    statusEl.textContent = msg;
    statusEl.className = 'submit-status err';
    showToast(msg, 'err');
    console.error('[kahvehane submit failed — all attempts]', { lastErr, insertData, session });
    return;
  }

  if (!response.ok) {
    const detail = (response.body || '').slice(0, 300);
    const msg = `Hata: HTTP ${response.status} ${response.statusText} ${detail}`.trim();
    statusEl.textContent = msg;
    statusEl.className = 'submit-status err';
    showToast(msg, 'err');
    return;
  }

  const okMsg = 'Mesajınız yayınlandı!';
  statusEl.textContent = okMsg;
  statusEl.className = 'submit-status ok';
  document.getElementById('post-content').value = '';
  showToast(okMsg, 'ok');
  loadPosts(activeMapNeighborhood || null);
  setTimeout(() => { statusEl.textContent = ''; }, 3000);
});

// Fixed-position toast so users always see the submit outcome, even when the
// status element inside the form is scrolled out of view on mobile.
function showToast(text, kind) {
  let toast = document.getElementById('global-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'global-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = text;
  toast.className = 'global-toast ' + (kind || '');
  toast.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.style.display = 'none'; }, 5000);
}

// ── Kahve Endeksi (coffee price index) ──
// The local-economy layer per the Vision section of CLAUDE.md: the
// cheapest cup of coffee, per district. It is the left column itself --
// on every screen, beside the map that scopes it (a district click
// re-scopes it, the sea puts all of İstanbul back). It used to be a
// block under the game tiles on desktop and a sheet behind a pill on a
// phone; one list on two surfaces, kept in step by hand, where the pill
// only ever existed because the column was holding something else.
//
// The board is LIVE, like a market board rather than a printed list. Two
// things move it without anyone touching the data (see coffee-index.js
// for the evaluation and db/coffee_prices_v3_live.sql for the shape):
//   - Opening hours. A venue that has closed drops out of the ranking
//     and sinks to the bottom of the board, dimmed; the cheapest cup is
//     the cheapest cup you can actually go and buy right now.
//   - Scheduled discounts. Inside its happy window a venue trades at the
//     discounted price and re-ranks accordingly, then snaps back the
//     moment the window ends.
// Because both are clock-driven, the board re-ranks itself on a timer
// (COFFEE_TICK_MS) off the already-fetched rows — no refetch needed for
// a venue to close or a discount to expire.
//
// Read-only on both surfaces: the index is curated exclusively from the
// admin portal (admin.html's "Kahve" tab) — RLS on coffee_prices allows
// writes to the admin only (see db/coffee_prices_v2_admin_only.sql).
const COFFEE_MAX_ROWS = 15;
// Re-rank cadence, and how stale the fetched rows may get before the
// next tick re-reads them from Supabase (admin edits are rare, the clock
// is what actually moves the board).
const COFFEE_TICK_MS = 30000;
const COFFEE_REFETCH_MS = 5 * 60 * 1000;
// The district the always-visible col-right panel (see
// .coffee-index-panel) is currently scoped to — kept so the map's
// district clicks can re-scope it (loadCoffeeIndexPanel) without the
// sheet, which reads the map selection at open time, having to agree.
let coffeePanelScope = null;
// Last fetch's rows, kept so the tick can re-rank without another round
// trip. `scope` is the district filter they were fetched under; `rows` is
// null when the fetch itself failed.
let coffeeCache = { scope: undefined, rows: null, at: 0 };
let coffeeTickIntervalId = null;

function formatCoffeePrice(p) {
  const locale = (window.I18N && I18N.isEnglish()) ? 'en-US' : 'tr-TR';
  try {
    return new Intl.NumberFormat(locale, { style: 'currency', currency: 'TRY' }).format(p);
  } catch (_) { return p + ' TL'; }
}

// Newest-first fetch, deduped to the newest entry per (district, venue)
// — legacy rows predating the admin-curated index can still hold the
// same venue twice, once per original reporter. Ranking happens at
// render time instead of here, because it depends on the clock.
async function fetchCoffeeRows(nbFilter) {
  let query = sb.from('coffee_prices')
    .select('id, neighborhood, venue, price, hours, happy_price, happy_days, happy_start, happy_end, happy_label')
    .order('updated_at', { ascending: false })
    .limit(300);
  if (nbFilter) query = query.eq('neighborhood', nbFilter);
  const { data, error } = await query;
  if (error) { console.error('[kahve endeksi]', error); return null; }
  const seen = new Set();
  const out = [];
  for (const r of (data || [])) {
    const key = r.neighborhood + '|' + String(r.venue).trim().toLocaleLowerCase('tr-TR');
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(r);
  }
  return out;
}

// Fetch, or reuse the cached rows when they're for the same scope and
// still fresh. Every render path goes through here so the tick can
// re-render cheaply while a scope change still hits the network.
async function getCoffeeRows(nbFilter, { force = false } = {}) {
  const scope = nbFilter || null;
  const fresh = coffeeCache.scope === scope
    && coffeeCache.rows !== null
    && (Date.now() - coffeeCache.at) < COFFEE_REFETCH_MS;
  if (!force && fresh) return coffeeCache.rows;
  const rows = await fetchCoffeeRows(scope);
  coffeeCache = { scope, rows, at: Date.now() };
  return rows;
}

// Live ranking: open venues cheapest-first, then the closed ones (also
// cheapest-first) so the board still tells you what a shut place charges
// without letting it win. Cut to COFFEE_MAX_ROWS only after ranking, so
// a venue opening or a discount starting can pull it onto the board.
function rankCoffeeRows(rows, now) {
  return rows
    .map(r => ({ row: r, live: IstCoffee.evaluate(r, now) }))
    .sort((a, b) => {
      if (a.live.open !== b.live.open) return a.live.open ? -1 : 1;
      return a.live.price - b.live.price;
    })
    .slice(0, COFFEE_MAX_ROWS);
}

// The one line under a venue's name: why its price is what it is, and
// when that changes. Returns HTML (the markers are styled spans), with
// every interpolated value either escaped or generated here.
function coffeeStatusMeta(live, now) {
  const en = !!(window.I18N && I18N.isEnglish());
  const parts = [];

  if (!live.open) {
    parts.push(`<span class="mk-closed">${I18N.t('kahve.closed')}</span>`);
    if (live.opensAt != null) {
      const at = IstCoffee.formatHM(live.opensAt);
      if (live.opensInDays === 0) parts.push(at);
      else if (live.opensInDays === 1) parts.push(`${I18N.t('kahve.tomorrow')} ${at}`);
      else {
        const d = new Date(now);
        d.setDate(d.getDate() + live.opensInDays);
        parts.push(`${escapeHtml(I18N.formatWeekday(d, { weekday: 'short' }))} ${at}`);
      }
    }
    return parts.join(' · ');
  }

  // "→ 18:00" reads as "until 18:00" without needing a Turkish case
  // suffix, which would have to change with each time's spoken form.
  if (live.discounted) {
    const label = live.discount.label ? escapeHtml(live.discount.label) : I18N.t('kahve.discount');
    parts.push(`<span class="mk-discount">${label} → ${IstCoffee.formatHM(live.discount.endsAt)}</span>`);
  }
  if (live.minutesToClose != null && live.minutesToClose <= 60) {
    parts.push(`<span class="mk-last">${I18N.t('kahve.lastcall')} ${live.minutesToClose} ${en ? 'min' : 'dk'}</span>`);
  } else if (live.closesAt != null && !live.discounted) {
    parts.push(`${I18N.t('kahve.open')} → ${IstCoffee.formatHM(live.closesAt)}`);
  }
  return parts.join(' · ');
}

// The board. Purely presentational: prices are entered in the admin
// portal, so there is nothing interactive to wire up here beyond the
// district hover (see the handlers below) and the row click that drills
// into a venue.
function renderCoffeeBoardHTML(rows, now) {
  let listHTML;
  if (rows === null) {
    listHTML = `<div class="coffee-empty">${I18N.t('kahve.failed')}</div>`;
  } else if (rows.length === 0) {
    listHTML = `<div class="coffee-empty">${I18N.t('kahve.empty')}</div>`;
  } else {
    const ranked = rankCoffeeRows(rows, now);
    listHTML = '<div class="coffee-rows">' + ranked.map(({ row, live }, i) => {
      const meta = coffeeStatusMeta(live, now);
      const cls = [
        'coffee-row',
        // Only an open venue can be the cheapest cup in the district.
        (i === 0 && live.open) ? 'cheapest' : '',
        live.open ? '' : 'closed',
        row.id === openVenueId ? 'selected' : '',
      ].filter(Boolean).join(' ');
      // data-nb drives the map highlight on hover — it replaces the
      // district name this row used to print. data-id opens the venue's
      // own panel on click (see openCoffeeVenue).
      return `<div class="${cls}" data-nb="${escapeHtml(row.neighborhood)}" data-id="${escapeHtml(row.id)}">
        <div class="coffee-row-venue">${escapeHtml(row.venue)}${meta ? `<span class="coffee-row-meta">${meta}</span>` : ''}</div>
        <div class="coffee-row-price">${live.discounted ? `<span class="coffee-price-was">${formatCoffeePrice(live.basePrice)}</span>` : ''}${formatCoffeePrice(live.price)}</div>
      </div>`;
    }).join('') + '</div>';
  }

  return `<div class="coffee-detail">
    <h2>${I18N.t('kahve.index')}</h2>
    ${listHTML}
  </div>`;
}

// The board, in the column (see .coffee-index-panel). Called on mount and
// on every map selection.
async function loadCoffeeIndexPanel(nbFilter = null) {
  coffeePanelScope = nbFilter;
  await refreshCoffeeIndexPanel();
}

async function refreshCoffeeIndexPanel() {
  const content = document.getElementById('coffee-index-content');
  if (!content) return;
  const rows = await getCoffeeRows(coffeePanelScope);
  // A venue drilled into this same panel is not the board: re-scoping the
  // map while one is open returns to the board (the venue may not even be
  // in the new district), but a plain refresh must never paint over it.
  if (openVenueId) closeCoffeeVenue({ silent: true });
  content.innerHTML = renderCoffeeBoardHTML(rows, new Date());
}

// Re-rank both surfaces off the clock. Cheap by design: it re-reads the
// cached rows, and only goes back to Supabase once they're stale enough
// (getCoffeeRows decides) and the tab is actually being looked at.
async function tickCoffeeIndex() {
  const panel = document.getElementById('coffee-index-content');
  if (!panel) return;
  if (coffeeCache.scope === undefined) return;
  if (document.visibilityState === 'hidden') return;
  const rows = await getCoffeeRows(coffeeCache.scope);
  // The venue lives in this very panel, so the board is not repainted
  // while one is open -- only the venue's own live block moves (see
  // tickOpenVenue), which is what leaves a half-typed comment alone.
  if (openVenueId) { tickOpenVenue(rows); return; }
  panel.innerHTML = renderCoffeeBoardHTML(rows, new Date());
}

// The open venue's own price/status/hours move with the same clock as
// the board. Only #cv-live is replaced — the comment list below it and
// anything half-typed in the composer stay exactly as they are.
function tickOpenVenue(rows) {
  if (!openVenueId) return;
  const surface = venueSurface();
  if (!surface) return;
  const row = (rows || []).find(r => r.id === openVenueId);
  const live = surface.querySelector('#cv-live');
  if (row && live) live.innerHTML = venueLiveHTML(row, new Date());
}

// ── Coffee venue detail: live status, the week's hours, and comments ──
// Clicking a row drills the board into that venue, in place, with a back
// link -- one surface on every screen, because the board is the column
// itself now. Nothing slides in over anything and nothing rises from the
// bottom: you tapped a line in a list and the list became the thing you
// tapped, which is the shortest possible distance between the two.
//
// The index stays admin-curated -- nothing here writes to coffee_prices.
// What members add is comments about the coffee (coffee_comments, see
// db/coffee_comments.sql), which anyone signed in may post regardless of
// which district they live in.
const COFFEE_COMMENT_LIMIT = 50;
// The venue whose panel is open, so the board's 30s tick can refresh its
// live status without disturbing the comments or a half-typed comment.
let openVenueId = null;

// The venue's week, Monday-first, today's row marked. Reads the same
// `hours` object the board evaluates (see coffee-index.js).
function venueWeekHTML(row, now) {
  if (!row.hours || !Object.keys(row.hours).length) {
    return `<div class="cv-empty">${I18N.t('kahve.hoursunknown')}</div>`;
  }
  const todayDow = now.getDay();
  // Monday-first ordering over getDay() indices.
  return [1, 2, 3, 4, 5, 6, 0].map(dow => {
    const w = IstCoffee.dayWindow(row.hours, dow);
    // Any date with the right weekday works; I18N handles the locale.
    const d = new Date(now);
    d.setDate(d.getDate() + ((dow - todayDow) + 7) % 7);
    const name = I18N.formatWeekday(d, { weekday: 'short' });
    const hours = w
      ? `${IstCoffee.formatHM(w.open)} – ${IstCoffee.formatHM(w.close)}`
      : I18N.t('kahve.closed');
    return `<div class="cv-day${dow === todayDow ? ' today' : ''}">
      <span>${escapeHtml(name)}</span><span class="cv-day-hours">${escapeHtml(hours)}</span>
    </div>`;
  }).join('');
}

// Price + status + week. Split out from renderVenueHTML so the board's
// tick can refresh just this block, leaving the comment list and a
// half-typed comment alone.
function venueLiveHTML(row, now) {
  const live = IstCoffee.evaluate(row, now);
  const meta = coffeeStatusMeta(live, now);
  return `
    <div class="cv-price-row">
      ${live.discounted ? `<span class="cv-was">${formatCoffeePrice(live.basePrice)}</span>` : ''}
      <span class="cv-price">${formatCoffeePrice(live.price)}</span>
    </div>
    <div class="cv-status${live.open ? '' : ' closed'}">${meta || '&nbsp;'}</div>
    <div class="cv-hours">
      <div class="cv-hours-title">${I18N.t('kahve.hours')}</div>
      ${venueWeekHTML(row, now)}
    </div>`;
}

// `undefined` means the fetch is still out, `null` means it failed, `[]`
// means the venue has no comments yet — three different things to say.
function venueCommentsHTML(comments, currentUserId) {
  if (comments === undefined) return `<div class="cv-empty">${I18N.t('kahve.loading')}</div>`;
  if (comments === null) return `<div class="cv-empty">${I18N.t('kahve.commentsfailed')}</div>`;
  if (!comments.length) return `<div class="cv-empty">${I18N.t('kahve.nocomments')}</div>`;
  return comments.map(c => {
    const { first, last } = c._authorName || {};
    const name = [first, last].filter(Boolean).join(' ') || I18N.t('profile.unnamed');
    // .author-link is picked up by the page's existing profile popup.
    const author = c.author_id
      ? `<span class="author-link" data-user-id="${c.author_id}" title="Profili görüntüle">${escapeHtml(name)}</span>`
      : escapeHtml(name);
    const canDelete = isAdmin || (c.author_id && c.author_id === currentUserId);
    return `<div class="cv-comment" data-comment-id="${c.id}">
      ${canDelete ? `<button class="cv-comment-delete" data-cv-delete="${c.id}" aria-label="Yorumu sil" title="Yorumu sil">×</button>` : ''}
      <div class="cv-comment-meta">
        <span>${author}</span>
        <span class="cv-comment-time">${escapeHtml(formatRelativeTime(c.created_at))}</span>
      </div>
      <div class="cv-comment-body">${escapeHtml(c.body)}</div>
    </div>`;
  }).join('');
}

// The venue, in the board's own panel. The only way out is back to the
// board -- the column drilled in, so it drills back out.
function renderVenueHTML(row, comments, currentUserId) {
  const now = new Date();
  const district = neighborhoodNames[row.neighborhood] || row.neighborhood;
  return `<div class="cv-detail">
    <button type="button" class="cv-back" id="cv-back">← ${I18N.t('kahve.index')}</button>
    <div class="cv-head">
      <div class="cv-title">${escapeHtml(row.venue)}</div>
      <div class="cv-district">${escapeHtml(district)}</div>
      <div id="cv-live">${venueLiveHTML(row, now)}</div>
    </div>
    <div class="cv-section-rule"></div>
    <div class="cv-comments-title">${I18N.t('kahve.comments')}</div>
    <div class="cv-comments" id="cv-comments">${venueCommentsHTML(comments, currentUserId)}</div>
    <div class="cv-form">
      <div class="cv-form-row">
        <textarea id="cv-input" maxlength="1000" placeholder="${escapeHtml(I18N.t('kahve.commentph'))}"></textarea>
        <button type="button" id="cv-send" aria-label="${escapeHtml(I18N.t('kahve.send'))}" title="${escapeHtml(I18N.t('kahve.send'))}">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
        </button>
      </div>
      <div class="cv-status-msg" id="cv-status"></div>
    </div>
  </div>`;
}

// Newest first, with author names resolved in one batched follow-up —
// the same two-step the discussion feed uses (profiles is a separate
// table and PostgREST cannot join across the RLS boundary here).
async function fetchVenueComments(coffeeId) {
  const { data, error } = await sb.from('coffee_comments')
    .select('id, author_id, body, created_at')
    .eq('coffee_id', coffeeId)
    .order('created_at', { ascending: false })
    .limit(COFFEE_COMMENT_LIMIT);
  if (error) { console.error('[kahve yorumlari]', error); return null; }
  const rows = data || [];
  const ids = Array.from(new Set(rows.map(c => c.author_id).filter(Boolean)));
  const nameMap = new Map();
  if (ids.length) {
    const { data: profs } = await sb.from('profiles')
      .select('id, first_name, last_name').in('id', ids);
    (profs || []).forEach(p => nameMap.set(p.id, {
      first: capitalizeName(p.first_name || ''),
      last: capitalizeName(p.last_name || ''),
    }));
  }
  return rows.map(c => ({ ...c, _authorName: nameMap.get(c.author_id) || { first: '', last: '' } }));
}

// Where the venue content lives: the board's own panel, once it has
// drilled in.
function venueSurface() {
  const panel = document.getElementById('coffee-index-content');
  return (panel && panel.querySelector('.cv-detail')) ? panel : null;
}

async function openCoffeeVenue(coffeeId) {
  const rows = coffeeCache.rows || [];
  const row = rows.find(r => r.id === coffeeId);
  if (!row) return;
  openVenueId = coffeeId;
  markSelectedCoffeeRow(coffeeId);
  // Keep the venue's district lit on the map for as long as its panel is
  // open, so the row hover's answer to "where is this" persists.
  applyCoffeeHighlight(row.neighborhood);

  const paint = (comments) => {
    const panel = document.getElementById('coffee-index-content');
    if (panel) panel.innerHTML = renderVenueHTML(row, comments, feedState.currentUserId);
  };
  // Paint the venue immediately (it is already in hand), then fill the
  // comments in — a round trip should not delay the price and hours.
  paint(undefined);
  const comments = await fetchVenueComments(coffeeId);
  // Bail if the user closed or switched venue while the fetch was out.
  if (openVenueId !== coffeeId) return;
  const list = document.querySelector('#cv-comments');
  if (list) list.innerHTML = venueCommentsHTML(comments, feedState.currentUserId);
  else paint(comments);
}

// Back to the board. `silent` is for the one caller that is about to
// paint the board itself (refreshCoffeeIndexPanel) -- everyone else wants
// the column put back the way they found it.
function closeCoffeeVenue(opts) {
  openVenueId = null;
  applyCoffeeHighlight(null);
  if (opts && opts.silent) return;
  const panel = document.getElementById('coffee-index-content');
  if (panel) panel.innerHTML = renderCoffeeBoardHTML(coffeeCache.rows, new Date());
  markSelectedCoffeeRow(null);
}

function markSelectedCoffeeRow(coffeeId) {
  document.querySelectorAll('.coffee-row[data-id]').forEach(r => {
    r.classList.toggle('selected', r.dataset.id === coffeeId);
  });
}

async function submitVenueComment() {
  const surface = venueSurface();
  if (!surface || !openVenueId) return;
  const input = surface.querySelector('#cv-input');
  const statusEl = surface.querySelector('#cv-status');
  const btn = surface.querySelector('#cv-send');
  const body = (input.value || '').trim();
  if (!body) return;

  btn.disabled = true;
  statusEl.textContent = '';
  statusEl.className = 'cv-status-msg';

  const { error } = await sb.from('coffee_comments')
    .insert([{ coffee_id: openVenueId, author_id: feedState.currentUserId, body }]);
  btn.disabled = false;

  if (error) {
    console.error('[kahve yorum gonderme]', error);
    statusEl.textContent = I18N.t('kahve.commentfailed');
    statusEl.className = 'cv-status-msg err';
    return;
  }
  input.value = '';
  const comments = await fetchVenueComments(openVenueId);
  const list = surface.querySelector('#cv-comments');
  if (list) list.innerHTML = venueCommentsHTML(comments, feedState.currentUserId);
}

async function deleteVenueComment(id) {
  if (!confirm('Yorumu sil?')) return;
  const { error } = await sb.from('coffee_comments').delete().eq('id', id);
  if (error) { showToast('Yorum silinemedi.', 'err'); return; }
  if (!openVenueId) return;
  const comments = await fetchVenueComments(openVenueId);
  const surface = venueSurface();
  const list = surface && surface.querySelector('#cv-comments');
  if (list) list.innerHTML = venueCommentsHTML(comments, feedState.currentUserId);
}

// Delegated for the same reason every other handler on this page is:
// #ist-content is rebuilt wholesale on each virtual re-entry.
document.addEventListener('click', (e) => {
  if (e.target.closest('#cv-back')) { closeCoffeeVenue(); return; }
  const del = e.target.closest('[data-cv-delete]');
  if (del) { deleteVenueComment(del.getAttribute('data-cv-delete')); return; }
  if (e.target.closest('#cv-send')) { submitVenueComment(); return; }

  // A row on the board opens its venue. Ignore clicks on the author
  // links inside an already-open panel, which belong to the profile popup.
  const row = e.target.closest('.coffee-row[data-id]');
  if (row && !e.target.closest('.author-link')) openCoffeeVenue(row.dataset.id);
});

// Enter sends, Shift+Enter makes a new line — the convention the rest of
// the site's composers use.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.shiftKey) return;
  if (!e.target.closest('#cv-input')) return;
  e.preventDefault();
  submitVenueComment();
});

// ── Coffee row → map district highlight ──
// The board no longer prints each venue's district (it used to sit in
// the row's meta line, next to a report date). Hovering the row lights
// the district up on the map instead — the same .hover-active tint the
// map's own hover uses, so "where is this place" is answered by the map
// rather than by more text in the row. Desktop-shaped by nature: on
// mobile the board opens as a sheet over the map, so there is nothing to
// light up and nothing to hover with.
// Light one district (or none) and name it on the map label. Shared by
// the row hover and by the open venue panel, which keeps its district
// lit for as long as it is open.
function applyCoffeeHighlight(nbId) { lightMapDistrict(nbId); }

// Light one district (or none) and name it on the map label. One
// implementation for everything on this page that answers "where is
// this?" with the drawing rather than with more text -- a coffee row
// hovered, a venue panel left open, an event card opened into its page.
function lightMapDistrict(nbId) {
  getMapNeighborhoods().forEach(n =>
    n.classList.toggle('hover-active', !!nbId && (n.dataset.neighborhood || n.id) === nbId));
  const label = document.getElementById('map-label');
  if (label) label.textContent = nbId ? (neighborhoodNames[nbId] || nbId) : baseMapLabel();
}

// The district to fall back to when a row hover ends: the open venue's,
// if a panel is showing one, otherwise nothing.
function restingCoffeeHighlight() {
  if (!openVenueId) return null;
  const row = (coffeeCache.rows || []).find(r => r.id === openVenueId);
  return row ? row.neighborhood : null;
}

document.addEventListener('mouseover', (e) => {
  const row = e.target.closest('.coffee-row[data-nb]');
  if (!row) return;
  applyCoffeeHighlight(row.dataset.nb);
});
document.addEventListener('mouseout', (e) => {
  const row = e.target.closest('.coffee-row[data-nb]');
  if (!row || row.contains(e.relatedTarget)) return;
  applyCoffeeHighlight(restingCoffeeHighlight());
});


// Another member's profile: one sheet for the whole site (see
// openMemberSheet in profile-card.js), opened by any .author-link /
// .kefil-link on this page. profile-card.js is deferred, so this waits
// for it instead of reaching for it mid-parse.
(function wireMemberSheet() {
  const wire = () => { if (window.IstProfileCard) IstProfileCard.initMemberSheet({ sb, I18N }); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();


// ══════════════════════════════════════════════════════════════════
// THE EVENTS DECK — the city's calendar, one card at a time
//
// The mirror of the game deck in the other corner of the band, and the
// same object Kütüphane's news deck is: cards laid on top of each other,
// only the front one live, dealt by being thrown rather than by being
// opened. What the throw means here is a verdict -- right "ilgimi
// çekti", left "ilgimi çekmedi" -- and what the reader keeps is printed
// beside the petek on Hane (see event-interest.js, which both pages
// read).
//
// The deck is the whole city's, never the selected district's: an event
// is a reason to cross town, and a list that quietly shrank to the
// district the map happens to be scoped to would be the app talking the
// reader out of exactly that. The district is on the card instead, and
// the map lights it the moment the card is opened.
// ══════════════════════════════════════════════════════════════════
const EVENTS_LIMIT = 30;
const MONTH_ABBR_TR = ['OCA','ŞUB','MAR','NİS','MAY','HAZ','TEM','AĞU','EYL','EKİ','KAS','ARA'];
const MONTH_ABBR_EN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
let kahveEvents = [];
let eventsRequestSeq = 0;
let onI18NChangeForEvents = null;

function myUid() {
  return (window.__currentUser && window.__currentUser.id) || null;
}

// Istanbul's clock, like everything dated on this site (see ist-date.js
// and convention 10): never a formatted date parsed back into a Date.
function eventWhenParts(iso) {
  const d = new Date(iso);
  const tz = 'Europe/Istanbul';
  const en = I18N.isEnglish();
  const locale = en ? 'en-US' : 'tr-TR';
  const day = parseInt(d.toLocaleDateString('en-US', { timeZone: tz, day: 'numeric' }), 10);
  const month = parseInt(d.toLocaleDateString('en-US', { timeZone: tz, month: 'numeric' }), 10);
  const wd = d.toLocaleDateString(locale, { timeZone: tz, weekday: 'short' }).toLocaleUpperCase(locale);
  const weekday = d.toLocaleDateString(locale, { timeZone: tz, weekday: 'long' });
  const time = d.toLocaleTimeString(locale, { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: en });
  return { day, mon: (en ? MONTH_ABBR_EN : MONTH_ABBR_TR)[month - 1] || '', wd, weekday, time };
}

function eventShortWhen(iso) {
  const p = eventWhenParts(iso);
  return `${p.day} ${p.mon} ${p.wd} · ${p.time}`;
}

// What the reader hasn't ruled on yet, soonest first. Sorted here rather
// than left to the query's order, because "the next evening in the city
// is the one on top" is the deck's own rule.
function undealtEvents() {
  const uid = myUid();
  return kahveEvents
    .filter(ev => !IstEventInterest.judged(uid, ev.id))
    .slice()
    .sort((a, b) => new Date(a.event_date) - new Date(b.event_date));
}

async function loadKahveEvents() {
  const reqId = ++eventsRequestSeq;
  const { data, error } = await sb.from('events')
    .select('*')
    .gte('event_date', new Date().toISOString())
    .order('event_date', { ascending: true })
    .limit(EVENTS_LIMIT);
  // Drop a superseded response so a slow older fetch can't clobber a
  // newer one with stale rows.
  if (reqId !== eventsRequestSeq) return;
  if (error) { console.error('[kahvehane events]', error); kahveEvents = []; }
  else kahveEvents = data || [];
  // Verdicts on events that have already happened are dead weight -- but
  // only prune when this fetch actually saw the whole calendar. A short
  // page of a capped query is not evidence that the rows it didn't
  // return are gone.
  // ...and never on an empty answer. A fetch that came back with no rows
  // at all cannot tell "the city has nothing on" apart from "this request
  // saw nothing" (a request that went out before the session did returns
  // an empty list, not an error, under RLS) -- and pruning against it
  // wipes every verdict the member has, permanently, with the events
  // they kept vanishing from Hane. Keeping a stale verdict costs nothing:
  // both pages filter against the calendar they actually fetched.
  if (kahveEvents.length && kahveEvents.length < EVENTS_LIMIT) {
    IstEventInterest.prune(myUid(), kahveEvents.map(ev => String(ev.id)));
  }
  renderEventsDeck();
}

// The dashed frame both bottoms are printed in -- the deck's own end and
// a city with nothing on. One box, two things it can say.
function deckFrameHTML(line, sub) {
  return `
    <div class="deck-done">
      <div class="deck-done-line">${escapeHtml(line)}</div>
      <div class="deck-done-sub">${escapeHtml(sub)}</div>
    </div>
  `;
}

function eventDeckDoneHTML() {
  return deckFrameHTML(I18N.t('games.q.deckdone'), I18N.t('games.q.deckdonesub'));
}

function renderEventsDeck() {
  const deck = document.getElementById('events-deck');
  if (!deck) return;
  const rows = undealtEvents();
  if (!rows.length) {
    // The corner is never blank. The two empties still say different
    // things -- a deck the reader emptied themselves is told so and
    // pointed at the door, a city with nothing on says exactly that --
    // but both say it inside the same frame, because a corner with
    // nothing in it at all reads as the deck being broken rather than as
    // there being nothing on. (Kütüphane's news column DOES go blank when
    // there is no news: it is the whole left-hand column over a map, and
    // an apology printed across that is a bigger object than this.)
    deck.innerHTML = kahveEvents.length
      ? eventDeckDoneHTML()
      : deckFrameHTML(I18N.t('events.none'), I18N.t('events.nonesub'));
    return;
  }
  const byId = new Map(rows.map(ev => [String(ev.id), ev]));
  deck.innerHTML = rows.map(ev => {
    const nb = ev.neighborhood ? (neighborhoodNames[ev.neighborhood] || ev.neighborhood) : 'İstanbul';
    return `
      <div class="ev-card" data-event-id="${escapeHtml(ev.id)}">
        <div class="ev-card-kicker">${escapeHtml(nb.toLocaleUpperCase('tr-TR'))}</div>
        <div class="ev-card-title">${escapeHtml(ev.title)}</div>
        <div class="ev-card-meta">${escapeHtml(eventShortWhen(ev.event_date))}</div>
      </div>
    `;
  }).join('');
  deck.querySelectorAll('.ev-card').forEach(el => {
    wireEvCardPress(el);
    const ev = byId.get(el.dataset.eventId);
    if (!ev) return;
    // The card is passed along: on a phone it is what the page grows out
    // of (see growEventPage).
    el.addEventListener('click', () => openEventPage(ev, el));
  });
}

// A card presses like a button. Pointer events rather than :hover /
// :active, both of which stick after a tap on iOS and would leave the
// card sitting pressed behind the page it just opened.
function wireEvCardPress(card) {
  card.addEventListener('pointerdown', () => {
    card.classList.remove('released');
    card.classList.add('pressing');
  });
  card.addEventListener('pointerup', () => {
    if (!card.classList.contains('pressing')) return;
    card.classList.remove('pressing');
    card.classList.add('released');
  });
  const quiet = () => card.classList.remove('pressing');
  ['pointercancel', 'pointerleave'].forEach(e => card.addEventListener(e, quiet));
  card.addEventListener('animationend', () => card.classList.remove('released'));
}

// Takes the front card out of the deck without re-rendering it: the ones
// behind are already in the DOM at their own depths, so removing this
// node re-runs the nth-child rules and they TRANSITION forward a step --
// which is the whole reason a deck's depth is position and not a class.
function dealEventCard(ev, verdict) {
  IstEventInterest.set(myUid(), ev.id, verdict);
  const deck = document.getElementById('events-deck');
  if (!deck) return;
  const node = deck.querySelector(`.ev-card[data-event-id="${CSS.escape(String(ev.id))}"]`);
  if (node) node.remove();
  if (!deck.querySelector('.ev-card')) deck.innerHTML = eventDeckDoneHTML();
}

// ── The page an event opens into ──
const EV_SWIPE_DEAL_PX = 84;    // throw past this and the event is dealt
const EV_SWIPE_DEAL_VEL = 0.55; // ...or a flick this fast (px/ms)
const EV_SWIPE_FLY_MS = 300;
let _evOrigin = null;   // the deck card this page grew out of
let _evOpen = null;     // the event the open page is printing
let _evDealing = false;

function evPageGrows() {
  return window.matchMedia('(max-width: 768px)').matches
    && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function showEvOrigin() {
  if (_evOrigin) _evOrigin.classList.remove('ev-open');
}

function cancelEvAnims() {
  IstSheet.cancelGrow(document.getElementById('event-page'));
}

// dir: 'in' when the card becomes the page, 'out' when the page folds
// back into it. One implementation for this and Kütüphane's news story
// (IstSheet.grow) -- the same move, and the frame it draws around itself
// while it grows is the whole reason it is shared rather than typed
// twice.
function growEventPage(dir) {
  const page = document.getElementById('event-page');
  const inner = document.getElementById('event-page-inner');
  if (!evPageGrows()) { IstSheet.cancelGrow(page); return; }
  IstSheet.grow({ page, inner, origin: _evOrigin, dir });
}

// Where the page's two sides fall, measured off the deck's own content
// box rather than restated as the sum of the frame pad and its padding:
// the page has to come out of the card with its sides already on the
// card's sides. Cleared on desktop, where the page is THE sheet and
// sheet.css owns its geometry.
function measureEventPageBand() {
  const overlay = document.getElementById('event-overlay');
  if (!overlay) return;
  const deck = document.getElementById('events-deck');
  if (!window.matchMedia('(max-width: 768px)').matches || !deck) {
    overlay.style.removeProperty('--event-page-left');
    overlay.style.removeProperty('--event-page-width');
    return;
  }
  // The whole band, not the deck's own box and not even its own column:
  // the deck is a hand of cards in one corner, and an event opened into
  // that corner would be a page 170px wide. It grows across both halves
  // -- its own side and the games' -- which is the same box Kütüphane's
  // news page fills, measured the same way (off the two columns' own
  // content boxes, never restated as a sum of paddings).
  const inner = deck.closest('.events-section-inner') || deck;
  const games = document.querySelector('.games-section-inner');
  const r = inner.getBoundingClientRect();
  const cs = getComputedStyle(inner);
  const left = r.left + parseFloat(cs.paddingLeft || 0);
  let right = r.right - parseFloat(cs.paddingRight || 0);
  if (games) {
    const gr = games.getBoundingClientRect();
    const gcs = getComputedStyle(games);
    right = Math.max(right, gr.right - parseFloat(gcs.paddingRight || 0));
  }
  const width = right - left;
  if (!(width > 0)) return;
  overlay.style.setProperty('--event-page-left', left.toFixed(2) + 'px');
  overlay.style.setProperty('--event-page-width', width.toFixed(2) + 'px');
}

function buildEventPageHtml(ev) {
  const nb = ev.neighborhood ? (neighborhoodNames[ev.neighborhood] || ev.neighborhood) : 'İstanbul';
  const p = eventWhenParts(ev.event_date);
  const meta = [`${p.day} ${p.mon} · ${p.weekday} · ${p.time}`, ev.location].filter(Boolean)
    .map(escapeHtml).join('<br>');
  return `
    <div class="event-page-head">
      <button class="event-page-back" type="button" id="event-page-back"
              aria-label="Kahvehane" title="Kahvehane"><img src="assets/back.png" alt=""/></button>
      <div class="ev-card-kicker">${escapeHtml(nb.toLocaleUpperCase('tr-TR'))}</div>
      <div class="ev-page-when">${escapeHtml(`${p.day} ${p.mon}`)}</div>
    </div>
    <div class="event-page-body">
      <h2 class="event-page-title">${escapeHtml(ev.title)}</h2>
      <div class="event-page-meta">${meta}</div>
      ${ev.description ? `<p>${escapeHtml(ev.description)}</p>` : ''}
    </div>
    <div class="ev-swipe-cue ev-swipe-cue-yes" id="ev-cue-yes">${escapeHtml(I18N.t('events.verdict.yes'))}</div>
    <div class="ev-swipe-cue ev-swipe-cue-no" id="ev-cue-no">${escapeHtml(I18N.t('events.verdict.no'))}</div>
  `;
}

function openEventPage(ev, cardEl) {
  const overlay = document.getElementById('event-overlay');
  const inner = document.getElementById('event-page-inner');
  if (!overlay || !inner) return;
  _evOrigin = cardEl || null;
  // The card is the page now, so it stops being drawn behind it -- only
  // where the page actually grows out of it. On desktop the page is THE
  // sheet beside a printed column, and a gap in that column would just
  // read as a missing event.
  if (_evOrigin && evPageGrows()) _evOrigin.classList.add('ev-open');
  _evOpen = ev;
  inner.innerHTML = buildEventPageHtml(ev);
  measureEventPageBand();
  IstSheet.open(overlay);
  growEventPage('in');
  const back = document.getElementById('event-page-back');
  if (back) back.addEventListener('click', () => closeEventPage());
  // Light the district on the map. The page sits in the band BELOW the
  // map rather than over it, so the drawing stays uncovered: the reader
  // sees where the event is for as long as they are reading about it.
  lightMapDistrict(ev.neighborhood || null);
}

function closeEventPage() {
  const overlay = document.getElementById('event-overlay');
  const inner = document.getElementById('event-page-inner');
  if (!overlay || !inner || overlay.hidden) return;
  // Every way out lands here, so the highlight goes out here rather than
  // at each of them -- and it goes back to whatever the board was
  // holding lit, if a venue panel is open behind all this.
  lightMapDistrict(restingCoffeeHighlight());
  showEvOrigin();
  growEventPage('out');
  IstSheet.close(overlay, () => {
    inner.innerHTML = '';
    cancelEvAnims();
    _evOrigin = null;
    _evOpen = null;
  });
}

// Gone this frame, with no fold-back: for a throw, and for a swipe to
// another carousel page. The overlay is body-level and outlives the
// content swap (see router.js), so an event left open would stand over
// Hane's petek for the half-second the ordinary close takes -- and fold
// back into a card that is no longer on the screen.
function snapEventPageShut() {
  const overlay = document.getElementById('event-overlay');
  const page = document.getElementById('event-page');
  const inner = document.getElementById('event-page-inner');
  if (!overlay || !inner || overlay.hidden) return;
  lightMapDistrict(restingCoffeeHighlight());
  showEvOrigin();
  cancelEvAnims();
  if (page) { page.style.transition = ''; page.style.transform = ''; page.style.opacity = ''; }
  overlay.classList.remove('open');
  // This path drops .open by hand rather than through IstSheet.close, so
  // the map's half of the tint has to be told (see syncDim there) or it
  // would stay quiet with no sheet open.
  IstSheet.syncDim();
  overlay.hidden = true;
  inner.innerHTML = '';
  _evOrigin = null;
  _evOpen = null;
}

function setEvCueOpacity(dx) {
  const yes = document.getElementById('ev-cue-yes');
  const no = document.getElementById('ev-cue-no');
  const p = Math.min(1, Math.abs(dx) / EV_SWIPE_DEAL_PX);
  if (yes) yes.style.opacity = dx > 0 ? p : 0;
  if (no) no.style.opacity = dx < 0 ? p : 0;
}

// dir: +1 thrown right (ilgimi çekti), -1 thrown left (ilgimi çekmedi).
function dealEventPage(dir) {
  const page = document.getElementById('event-page');
  if (!page || _evDealing || !_evOpen) return;
  _evDealing = true;
  const ev = _evOpen;
  // The deck advances BEHIND the page while it is still on its way out,
  // so the next event is already standing there as the paper clears it.
  dealEventCard(ev, dir > 0 ? 'yes' : 'no');
  const w = window.innerWidth || 400;
  page.style.transition = `transform ${EV_SWIPE_FLY_MS}ms ease-in, opacity ${EV_SWIPE_FLY_MS}ms ease-in`;
  page.style.transform = `translateX(${dir * (w + 140)}px) rotate(${dir * 7}deg)`;
  page.style.opacity = '0';
  setTimeout(() => {
    page.style.transition = '';
    page.style.transform = '';
    page.style.opacity = '';
    // Straight to hidden, never the fold-back: the event did not go back
    // into the card it came from, it left the deck.
    snapEventPageShut();
    _evDealing = false;
  }, EV_SWIPE_FLY_MS + 20);
}

// ── The throw ──
// The only thing this page asks for, so it is the only thing it offers:
// no buttons, just the gesture the news deck and the question cards
// already taught. A finger throws the paper on a phone; on desktop the
// mouse drags it, because a reader with no touch screen still has to be
// able to say what they thought -- and a page with a row of buttons on it
// would make the throw look like the shortcut rather than the move.
//
// Both inputs run the same three steps; only how a drag starts and where
// the moves are listened for differ (a mouse leaves the element the
// moment it is thrown, so its move/up live on the window).
function wireEventPageSwipe() {
  const page = document.getElementById('event-page');
  if (!page) return;
  const touch = window.matchMedia('(max-width: 768px) and (pointer: coarse)');
  let sx = 0, sy = 0, dx = 0, lastX = 0, lastT = 0, vel = 0;
  let dragging = false, axis = null;

  function render() {
    page.style.transform = `translateX(${dx}px) rotate(${dx * 0.014}deg)`;
    setEvCueOpacity(dx);
  }

  function springBack() {
    page.style.transition = 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s';
    page.style.transform = '';
    setEvCueOpacity(0);
    setTimeout(() => { if (!_evDealing) page.style.transition = ''; }, 320);
  }

  function begin(x, y, t) {
    dragging = true;
    axis = null;
    dx = 0;
    sx = lastX = x;
    sy = y;
    lastT = t;
    vel = 0;
    page.style.transition = 'none';
  }

  // Returns true once the drag has committed to the horizontal axis --
  // the caller then knows to keep the browser out of it.
  function move(x, y, t) {
    if (!dragging) return false;
    // Which gesture this is gets decided once, on the first real
    // movement, and never revisited: the body scrolls vertically inside
    // this page, and a drag that kept changing its mind would fight the
    // scroller.
    if (axis === null) {
      const adx = Math.abs(x - sx), ady = Math.abs(y - sy);
      if (adx < 6 && ady < 6) return false;
      axis = adx > ady * 1.2 ? 'x' : 'y';
      if (axis === 'y') { dragging = false; page.style.transition = ''; return false; }
      page.classList.add('ev-dragging');
    }
    const dt = t - lastT;
    // Weighted toward the newest sample so a flick's final speed wins
    // over the slow start of the same drag.
    if (dt > 0) vel = 0.7 * ((x - lastX) / dt) + 0.3 * vel;
    lastX = x;
    lastT = t;
    dx = x - sx;
    render();
    return true;
  }

  function end() {
    if (!dragging) return;
    dragging = false;
    page.classList.remove('ev-dragging');
    const flicked = Math.abs(vel) > EV_SWIPE_DEAL_VEL;
    const thrown = Math.abs(dx) > EV_SWIPE_DEAL_PX;
    if (!flicked && !thrown) { springBack(); return; }
    // A flick decides its own direction: a finger that started left and
    // ended up flicking right meant right.
    dealEventPage((flicked ? vel : dx) > 0 ? 1 : -1);
  }

  page.addEventListener('touchstart', (e) => {
    if (!touch.matches || e.touches.length !== 1 || _evDealing) return;
    // The carousel's own swipe listens on the document (router.js): a
    // horizontal drag on an open event is that event's, not a page
    // change, so it stops here.
    e.stopPropagation();
    begin(e.touches[0].clientX, e.touches[0].clientY, e.timeStamp || performance.now());
  }, { passive: true });

  page.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    if (move(e.touches[0].clientX, e.touches[0].clientY, e.timeStamp || performance.now())
        && e.cancelable) e.preventDefault();
  }, { passive: false });

  page.addEventListener('touchend', end);
  page.addEventListener('touchcancel', end);

  // The mouse. Only the primary button, and never a drag begun on
  // something the reader is plainly using for something else (the arrow,
  // a link, a selection of the body's own text is still theirs to make
  // -- the axis test below leaves a vertical or tiny movement alone).
  page.addEventListener('mousedown', (e) => {
    if (touch.matches || e.button !== 0 || _evDealing) return;
    if (e.target.closest('button, a, input, textarea')) return;
    begin(e.clientX, e.clientY, e.timeStamp || performance.now());
  });
  window.addEventListener('mousemove', (e) => {
    // Text selection is what a horizontal mouse drag would otherwise do,
    // and it would leave the page smeared with highlight as it flew out.
    if (move(e.clientX, e.clientY, e.timeStamp || performance.now())) e.preventDefault();
  });
  window.addEventListener('mouseup', end);
}

(function initEventPage() {
  const overlay = document.getElementById('event-overlay');
  const backdrop = document.getElementById('event-overlay-backdrop');
  if (!overlay || !backdrop) return;
  backdrop.addEventListener('click', () => closeEventPage());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeEventPage();
  });
  window.addEventListener('resize', measureEventPageBand);
  wireEventPageSwipe();
})();


IstRouter.registerPage('kahvehane', { mount, unmount });

// Runs here, at the tail of a script that sits at the end of <body>, so
// the columns are sized and the game tiles are square in the first frame
// the user sees. mount() re-runs it, but mount() is gated on the session
// check, and on a real device that round-trip is long enough to paint --
// which is exactly how long the tiles used to sit there in the wrong
// shape before snapping square.
syncColumnHeights();
})();
</script>

<!-- game-lock toast is created by game-locks.js when first needed -->

</body>
